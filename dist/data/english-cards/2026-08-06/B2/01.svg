<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>disruption</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/08/06 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Rain can interrupt an outdoor plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Rain can interrupt an outdoor plan.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">disruption</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /dɪsˈrʌpʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">Singular: disruption; plural: disruptions.</tspan></text><text x="28" y="604.0425" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="634.8985">something that interrupts a normal plan or</tspan><tspan x="28" y="670.4235">activity</tspan></text><text x="28" y="723.2035000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="754.0595000000001">interruption; disturbance</tspan></text><text x="28" y="806.8395" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="837.6955">Rain caused a disruption to the outdoor</tspan><tspan x="28" y="873.2205">concert.</tspan></text><text x="28" y="926.0005000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="956.8565000000001">Topic: Plans for a rainy day. Write one</tspan><tspan x="28" y="992.3815000000001">sentence using this word. Check that your</tspan><tspan x="28" y="1027.9065">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1080.6865" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1111.5425">A: What does “disruption” mean?</tspan><tspan x="28" y="1147.0675">B: It means something that interrupts a normal</tspan><tspan x="28" y="1182.5925">plan or activity.</tspan><tspan x="28" y="1218.1175">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1253.6425">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1306.4225000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1337.2785000000001">Which word means “something that interrupts a</tspan><tspan x="28" y="1372.8035000000002">normal plan or activity”: disruption or anticipate?</tspan></text></svg>