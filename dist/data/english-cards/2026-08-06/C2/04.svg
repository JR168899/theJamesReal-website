<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/08/06 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">dispense with</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="583.633">manage without something unnecessary</tspan></text><text x="28" y="640.5730000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="673.8610000000001">do without; forgo</tspan></text><text x="28" y="730.8010000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="764.0890000000002">We can dispense with a rule that serves no</tspan><tspan x="28" y="802.4140000000002">useful purpose.</tspan></text><text x="28" y="859.3540000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="892.6420000000002">Keep the particle with the verb. Check a</tspan><tspan x="28" y="930.9670000000002">dictionary before changing its object or</tspan><tspan x="28" y="969.2920000000001">word order.</tspan></text><text x="28" y="1026.2320000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1059.5200000000002">A: How can we change our plans?</tspan><tspan x="28" y="1097.8450000000003">B: We can dispense with a rule that serves</tspan><tspan x="28" y="1136.1700000000003">no useful purpose.</tspan><tspan x="28" y="1174.4950000000003">A: That gives us a starting point.</tspan><tspan x="28" y="1212.8200000000002">B: Let us try it together.</tspan></text><text x="28" y="1269.7600000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1303.0480000000002">Explain “dispense with” in your own words,</tspan><tspan x="28" y="1341.3730000000003">then use it in a sentence about plans for a</tspan><tspan x="28" y="1379.6980000000003">rainy day.</tspan></text></svg>