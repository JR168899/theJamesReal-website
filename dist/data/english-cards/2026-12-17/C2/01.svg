<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>symbiosis</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/12/17 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A bee visits a flowering plant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A bee visits a flowering plant.</tspan></text><a href="https://www.pexels.com/photo/macro-view-of-bee-on-flower-collecting-pollen-34256469/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34256469</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="473.86">symbiosis</tspan></text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="509.805">US /ˌsɪmbaɪˈoʊsɪs/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.020000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="535.4306">Singular: symbiosis; plural: symbioses.</tspan></text><text x="28" y="586.2450000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="613.9090000000001">a close relationship in which different organisms or</tspan><tspan x="28" y="645.7590000000001">groups interact</tspan></text><text x="28" y="693.0790000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="720.7430000000002">close biological association; interdependent</tspan><tspan x="28" y="752.5930000000002">relationship</tspan></text><text x="28" y="799.9130000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="827.5770000000002">The garden offers examples of symbiosis between</tspan><tspan x="28" y="859.4270000000002">different organisms.</tspan></text><text x="28" y="906.7470000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="934.4110000000003">In broad biological usage this is a close association</tspan><tspan x="28" y="966.2610000000003">between species. Mutualism specifies a relationship</tspan><tspan x="28" y="998.1110000000003">benefiting both.</tspan></text><text x="28" y="1045.4310000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1073.0950000000003">Sarah: Does symbiosis always mean both organisms</tspan><tspan x="28" y="1104.9450000000002">benefit?</tspan><tspan x="28" y="1136.7950000000003">Liam: In broad biological usage, no. It refers to a</tspan><tspan x="28" y="1168.6450000000002">close association between species.</tspan><tspan x="28" y="1200.4950000000003">Sarah: Then we need to identify the particular</tspan><tspan x="28" y="1232.3450000000003">relationship?</tspan><tspan x="28" y="1264.1950000000002">Liam: Yes. Mutualism is the term when both benefit.</tspan></text><text x="28" y="1311.5150000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1339.1790000000003">Which is more precise for a relationship benefiting</tspan><tspan x="28" y="1371.0290000000002">both species: symbiosis alone or mutualism? Explain.</tspan></text></svg>