<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/28 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="39.56" font-weight="700" fill="#2d382e"><tspan x="28" y="471.56">I would distinguish between the</tspan><tspan x="28" y="521.01">intention and its consequences.</tspan></text><text x="28" y="574.76" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="600.904">A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="631.004">from the effects of their action.</tspan></text><text x="28" y="675.724" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="701.868">I would separate the aim from the outcome.; We should</tspan><tspan x="28" y="731.9680000000001">assess purpose and effects independently.</tspan></text><text x="28" y="776.6880000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="802.8320000000001">A: The rule was introduced to make registration fair.</tspan><tspan x="28" y="832.9320000000001">B: I would distinguish between the intention and its</tspan><tspan x="28" y="863.0320000000002">consequences.</tspan></text><text x="28" y="907.7520000000002" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="933.8960000000002">This distinction acknowledges an aim without treating a</tspan><tspan x="28" y="963.9960000000002">good aim as proof of a good outcome. Name both</tspan><tspan x="28" y="994.0960000000002">elements concretely.</tspan></text><text x="28" y="1038.8160000000003" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1064.9600000000003">A: The rule was introduced to make registration fair.</tspan><tspan x="28" y="1095.0600000000002">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1125.1600000000003">consequences.</tspan><tspan x="28" y="1155.2600000000002">A: You think it affected people differently?</tspan><tspan x="28" y="1185.3600000000004">B: Yes. Requiring a phone excluded some of the people</tspan><tspan x="28" y="1215.4600000000003">it was meant to help.</tspan></text><text x="28" y="1260.1800000000003" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1286.3240000000003">A well-meant phone-only booking rule excludes people</tspan><tspan x="28" y="1316.4240000000002">without phones. Separate the aim from the result in your</tspan><tspan x="28" y="1346.5240000000003">response. (Model: The intention was fair access, but one</tspan><tspan x="28" y="1376.6240000000003">consequence was excluding people without phones.)</tspan></text></svg>