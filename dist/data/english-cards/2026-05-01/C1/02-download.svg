<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discerning</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/05/01 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Fresh produce is displayed at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Fresh produce is displayed at a market.</tspan></text><a href="https://www.pexels.com/photo/vegetables-in-market-12527092/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12527092</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">discerning</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /dɪˈsɝnɪŋ/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">discerning · more discerning · most discerning; noun: discernment</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">able to notice differences and make careful</tspan><tspan x="28" y="641.0609999999999">judgements</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">perceptive; judicious</tspan></text><text x="28" y="760.677" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="787.733">A discerning shopper considers durability as well as</tspan><tspan x="28" y="818.8829999999999">price.</tspan></text><text x="28" y="865.163" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="892.2189999999999">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="923.3689999999999">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="954.519">description rather than using it as a general</tspan><tspan x="28" y="985.669">compliment.</tspan></text><text x="28" y="1031.949" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1059.005">Kore: She did not choose the most expensive piece.</tspan><tspan x="28" y="1090.1550000000002">Onyx: She is a discerning buyer; she checks how</tspan><tspan x="28" y="1121.305">things are made.</tspan><tspan x="28" y="1152.4550000000002">Kore: What persuaded her?</tspan><tspan x="28" y="1183.605">Onyx: The repairable joints and the well-finished</tspan><tspan x="28" y="1214.755">edges.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Describe a discerning purchase without equating</tspan><tspan x="28" y="1319.2410000000002">good judgment with a high price. (Model: The buyer</tspan><tspan x="28" y="1350.391">compared construction, suitability and repairability</tspan><tspan x="28" y="1381.5410000000002">before choosing.)</tspan></text></svg>