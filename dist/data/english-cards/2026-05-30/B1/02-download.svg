<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>notice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/05/30 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Paying attention makes the details of an ordinary setting easier to see.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Paying attention makes the details of an ordinary setting easier to see.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">notice</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /ˈnoʊtɪs/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">notice · notices · noticed · noticed · noticing (base · third</tspan><tspan x="28" y="574.6075000000001">person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to become aware of something</tspan></text><text x="28" y="714.9210999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="745.7770999999999">observe; become aware of</tspan></text><text x="28" y="798.5570999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="829.4130999999999">I notice a small plant beside the door.</tspan></text><text x="28" y="882.1930999999998" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="913.0490999999998">Topic: Getting to know a city. Write one</tspan><tspan x="28" y="948.5740999999998">sentence using this word. Check that your</tspan><tspan x="28" y="984.0990999999999">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1036.8790999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1067.7350999999999">A: What does “notice” mean?</tspan><tspan x="28" y="1103.2601">B: It means to become aware of something.</tspan><tspan x="28" y="1138.7850999999998">A: Can we use it on a city walk?</tspan><tspan x="28" y="1174.3101">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1291.096">Make a sentence of your own, then answer:</tspan><tspan x="28" y="1326.621">Which word means “to become aware of</tspan><tspan x="28" y="1362.146">something”: notice or landmark? (Model: notice)</tspan></text></svg>