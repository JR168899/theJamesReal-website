<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although and despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/10/21 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Rain provides a context for describing an obstacle and continuing anyway.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Rain provides a context for describing an obstacle and continuing anyway.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="481.91">Although and despite</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="582.7065000000001">Use although before a clause. Use despite</tspan><tspan x="28" y="620.6815000000001">before a noun or an -ing form.</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="710.0855000000001">Although it was difficult, we continued.</tspan><tspan x="28" y="748.0605000000002">Despite the difficulty, we continued.</tspan></text><text x="28" y="804.4805000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="837.4645000000002">Read the example together with the rule.</tspan><tspan x="28" y="875.4395000000002">Notice the verb form and keep the same</tspan><tspan x="28" y="913.4145000000002">pattern in your own sentence.</tspan></text><text x="28" y="969.8345000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1002.8185000000002">A: Could you give me an example?</tspan><tspan x="28" y="1040.7935000000002">B: Although it was difficult, we continued.</tspan><tspan x="28" y="1078.7685000000001">Despite the difficulty, we continued.</tspan><tspan x="28" y="1116.7435000000003">A: Which pattern does that use?</tspan><tspan x="28" y="1154.7185000000002">B: Use although before a clause. Use</tspan><tspan x="28" y="1192.6935000000003">despite before a noun or an -ing form.</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1294.344">Explain the meaning before looking at the</tspan><tspan x="28" y="1332.319">model answer. Choose: Despite / Although</tspan><tspan x="28" y="1370.294">the difficulty, we continued. (Model: Despite)</tspan></text></svg>