<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually make a realistic plan?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/12/27 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>How do you usually make a realistic plan?</title><desc>Original family-manga illustration: calendar, related to How do you usually make a realistic plan?.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.25" font-weight="700" fill="#353331"><tspan x="28" y="472.25">How do you usually make a</tspan><tspan x="28" y="522.5625">realistic plan?</tspan></text><text x="28" y="577.25" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#353331"><tspan x="28" y="603.85">An open question that invites a person to describe a</tspan><tspan x="28" y="634.475">familiar experience.</tspan></text><text x="28" y="679.975" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#353331"><tspan x="28" y="706.575">How do you usually make a realistic plan?</tspan></text><text x="28" y="752.075" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#353331"><tspan x="28" y="778.6750000000001">Ask this as a genuine question. Listen to the answer,</tspan><tspan x="28" y="809.3000000000001">then ask a related follow-up.</tspan></text><text x="28" y="854.8000000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#353331"><tspan x="28" y="881.4000000000001">A: How do you usually make a realistic plan?</tspan><tspan x="28" y="912.0250000000001">B: I make practical arrangements, while leaving room for</tspan><tspan x="28" y="942.6500000000001">other people’s preferences.</tspan><tspan x="28" y="973.2750000000001">A: What has helped you most?</tspan><tspan x="28" y="1003.9000000000001">B: For example, we describe one habit that helped us</tspan><tspan x="28" y="1034.525">instead of calling the whole year good or bad.</tspan></text><text x="28" y="1258.0" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#353331"><tspan x="28" y="1284.6">Apply the idea to a real situation, then answer: Write a</tspan><tspan x="28" y="1315.225">reply of your own, then ask one related question. (Model:</tspan><tspan x="28" y="1345.85">I make practical arrangements, while leaving room for</tspan><tspan x="28" y="1376.475">other people’s preferences. What works best for you?)</tspan></text></svg>