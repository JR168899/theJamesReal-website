ont-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#3d3028"><tspan x="28" y="815.2010000000001">Keep the particle with the verb. Check a dictionary</tspan><tspan x="28" y="847.0510000000002">before changing its object or word order.</tspan></text><text x="28" y="894.3710000000001" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#3d3028"><tspan x="28" y="922.0350000000002">A: How can we make a realistic plan?</tspan><tspan x="28" y="953.8850000000002">B: We can dispense with a rule that serves no useful</tspan><tspan x="28" y="985.7350000000002">purpose.</tspan><tspan x="28" y="1017.5850000000003">A: That gives us a starting point.</tspan><tspan x="28" y="1049.4350000000002">B: Let us try it together.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#3d3028"><tspan x="28" y="1286.224">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1318.0739999999998">Explain “dispense with” in your own words, then use it</tspan><tspan x="28" y="1349.924">in a sentence about looking back and looking ahead.</tspan></text></svg>