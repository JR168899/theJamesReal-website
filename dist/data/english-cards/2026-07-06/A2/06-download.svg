<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a piece of cake</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/07/06 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">a piece of cake</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">something very easy; informal</tspan></text><text x="28" y="625.7635" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="656.6195">a breeze; very easy</tspan></text><text x="28" y="709.3995" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="740.2555">The first step was a piece of cake.</tspan></text><text x="28" y="793.0355" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="823.8915">Learn the whole expression. It is figurative</tspan><tspan x="28" y="859.4164999999999">language, so a word-for-word interpretation may</tspan><tspan x="28" y="894.9414999999999">be misleading.</tspan></text><text x="28" y="947.7215" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="978.5775">A: How would you express this idea?</tspan><tspan x="28" y="1014.1025">B: a piece of cake</tspan><tspan x="28" y="1049.6275">A: What does that mean here?</tspan><tspan x="28" y="1085.1525">B: something very easy; informal</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1291.096">Tell a friend. What does “a piece of cake” mean</tspan><tspan x="28" y="1326.621">in this example? The first step was a piece of</tspan><tspan x="28" y="1362.146">cake. (Model: Something very easy; informal.)</tspan></text></svg>