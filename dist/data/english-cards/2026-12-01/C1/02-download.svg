<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>delegate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/12/01 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A list can organize actions, responsibilities and repeated practice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A list can organize actions, responsibilities and repeated practice.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">delegate</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ˈdɛləˌɡeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">delegate · delegates · delegated · delegated · delegating (base</tspan><tspan x="28" y="569.69">· third person · past · past participle · -ing)</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">to give a task and appropriate responsibility to</tspan><tspan x="28" y="688.5052000000001">another person</tspan></text><text x="28" y="739.4652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="769.2572000000001">assign; entrust</tspan></text><text x="28" y="820.2171999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="850.0092000000001">We delegate one task to each volunteer.</tspan></text><text x="28" y="900.9691999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="930.7612">Topic: Working together. Write one sentence</tspan><tspan x="28" y="965.0612">using this word. Check that your sentence keeps</tspan><tspan x="28" y="999.3612">the meaning shown above.</tspan></text><text x="28" y="1050.3212" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1080.1132">A: What does “delegate” mean?</tspan><tspan x="28" y="1114.4132">B: It means to give a task and appropriate</tspan><tspan x="28" y="1148.7132">responsibility to another person.</tspan><tspan x="28" y="1183.0132">A: Can we use it during a shared project?</tspan><tspan x="28" y="1217.3132">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1268.2732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1298.0652">Which word means “to give a task and</tspan><tspan x="28" y="1332.3652">appropriate responsibility to another person”:</tspan><tspan x="28" y="1366.6652">delegate or interdependence? (Model: delegate)</tspan></text></svg>