<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut the Gordian knot</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/12/01 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#383426"><tspan x="28" y="472.02">cut the Gordian knot</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="552.8430000000001">solve a complex problem with a decisive and direct action</tspan></text><text x="28" y="598.083" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="624.5310000000001">take a decisive shortcut; break the deadlock</tspan></text><text x="28" y="669.771" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="696.219">A simpler agreement cut the Gordian knot.</tspan></text><text x="28" y="741.459" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="767.907">A literary allusion to a decisive solution. More formal than</tspan><tspan x="28" y="798.3570000000001">sort it out; not simply any small adjustment.</tspan></text><text x="28" y="843.597" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="870.0450000000001">Sarah: The committee keeps arguing over twenty</tspan><tspan x="28" y="900.4950000000001">overlapping rules.</tspan><tspan x="28" y="930.945">Liam: Could one clear access policy cut the Gordian</tspan><tspan x="28" y="961.3950000000001">knot?</tspan><tspan x="28" y="991.845">Sarah: Perhaps, if it removes duplication without hiding</tspan><tspan x="28" y="1022.2950000000001">the real conflicts.</tspan><tspan x="28" y="1052.7450000000001">Liam: Then we should test what the simpler rule actually</tspan><tspan x="28" y="1083.1950000000002">settles.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1284.368">Does cutting the Gordian knot always mean ignoring</tspan><tspan x="28" y="1314.818">important complexity? Explain. (Model: No. It means a</tspan><tspan x="28" y="1345.268">decisive solution to a tangled problem, but whether it is</tspan><tspan x="28" y="1375.7179999999998">justified depends on what it resolves or overlooks.)</tspan></text></svg>