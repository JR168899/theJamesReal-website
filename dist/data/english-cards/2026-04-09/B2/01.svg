<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>functional</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/04/09 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A workspace brings together the tools needed for a task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A workspace brings together the tools needed for a task.</tspan></text><a href="https://www.pexels.com/photo/office-tools-and-equipment-on-a-desk-8296953/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8296953</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="481.91">functional</tspan></text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="524.7675">US /ˈfʌŋkʃənəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="23.870000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="555.3211">Adjective: functional; related noun: function</tspan></text><text x="28" y="615.9075" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="648.8915000000001">designed to be useful and to work well</tspan></text><text x="28" y="705.3115" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="738.2955000000001">practical; useful</tspan></text><text x="28" y="794.7155" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="827.6995000000001">The room is small but functional.</tspan></text><text x="28" y="884.1195" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="917.1035">Topic: Making a room your own. Write one</tspan><tspan x="28" y="955.0785000000001">sentence using this word. Check that your</tspan><tspan x="28" y="993.0535000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1049.4734999999998" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1082.4575">A: What does “functional” mean?</tspan><tspan x="28" y="1120.4325">B: It means designed to be useful and to</tspan><tspan x="28" y="1158.4075">work well.</tspan><tspan x="28" y="1196.3825">A: Can we use it at home?</tspan><tspan x="28" y="1234.3575">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1290.7775" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.7615">Which word means “designed to be useful</tspan><tspan x="28" y="1361.7365">and to work well”: functional or atmosphere?</tspan></text></svg>