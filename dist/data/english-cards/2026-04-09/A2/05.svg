<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>on the same page</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/04/09 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">on the same page</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="583.633">in agreement or sharing an understanding</tspan></text><text x="28" y="640.5730000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="673.8610000000001">in accord; of the same understanding</tspan></text><text x="28" y="730.8010000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="764.0890000000002">Are we on the same page about the plan?</tspan></text><text x="28" y="821.0290000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="854.3170000000002">Informal and figurative: sharing an</tspan><tspan x="28" y="892.6420000000003">understanding, not necessarily complete</tspan><tspan x="28" y="930.9670000000002">agreement on every issue.</tspan></text><text x="28" y="987.9070000000003" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1021.1950000000003">Bella: I thought we were meeting at the</tspan><tspan x="28" y="1059.5200000000002">library.</tspan><tspan x="28" y="1097.8450000000003">Fenrir: I meant the cafe beside it.</tspan><tspan x="28" y="1136.1700000000003">Bella: Let us make sure we are on the</tspan><tspan x="28" y="1174.4950000000003">same page before telling the others.</tspan><tspan x="28" y="1212.8200000000004">Fenrir: The cafe, at ten, by the window.</tspan></text><text x="28" y="1269.7600000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1303.0480000000002">A meeting message names two different</tspan><tspan x="28" y="1341.3730000000003">places. Rewrite it to put everyone on the</tspan><tspan x="28" y="1379.6980000000003">same page.</tspan></text></svg>