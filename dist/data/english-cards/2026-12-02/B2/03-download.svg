<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>follow through</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/12/02 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written list makes tasks visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written list makes tasks visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">follow through</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">complete what you have agreed to do</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="632.2765">carry out a commitment; see it through</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="706.8485000000001">A good plan matters only if we follow through.</tspan></text><text x="28" y="753.9085" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="781.4205000000001">Follow through on a promise or commitment.</tspan><tspan x="28" y="813.0955">Distinguish taking the first step from carrying the task</tspan><tspan x="28" y="844.7705000000001">to completion.</tspan></text><text x="28" y="891.8305" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="919.3425000000001">Aoede: The group agreed to repair the gate.</tspan><tspan x="28" y="951.0175">Echo: Has anyone followed through?</tspan><tspan x="28" y="982.6925000000001">Aoede: A volunteer ordered the parts, and the work is</tspan><tspan x="28" y="1014.3675000000001">booked for Friday.</tspan><tspan x="28" y="1046.0425">Echo: Then the promise has turned into an actual</tspan><tspan x="28" y="1077.7175000000002">arrangement.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Which better demonstrates following through:</tspan><tspan x="28" y="1317.667">suggesting a repair or booking the work after agreeing</tspan><tspan x="28" y="1349.3419999999999">to arrange it? Explain. (Model: Booking the work</tspan><tspan x="28" y="1381.017">shows action that carries the agreement forward.)</tspan></text></svg>