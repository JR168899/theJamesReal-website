lipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.94" font-weight="700" fill="#2c3540"><tspan x="28" y="472.94">Consideration becomes visible</tspan><tspan x="28" y="524.115">through practical decisions.</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="606.7959999999999">An original James Real learning reflection on</tspan><tspan x="28" y="637.9459999999999">practical consideration.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="711.2819999999999">An original James Real learning reflection on</tspan><tspan x="28" y="742.4319999999999">practical consideration</tspan></text><text x="28" y="788.712" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="815.7679999999999">For example, we discuss an unclear instruction</tspan><tspan x="28" y="846.9179999999999">before spending an hour on the wrong task.</tspan></text><text x="28" y="893.198" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="920.2539999999999">This is an original James Real learning reflection.</tspan><tspan x="28" y="951.4039999999999">Explain the idea in your own words rather than</tspan><tspan x="28" y="982.5539999999999">treating it as a factual rule.</tspan></text><text x="28" y="1028.8339999999998" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1055.89">A: How would you express this idea?</tspan><tspan x="28" y="1087.0400000000002">B: Consideration becomes visible through practical</tspan><tspan x="28" y="1118.19">decisions.</tspan><tspan x="28" y="1149.3400000000001">A: What does that mean here?</tspan><tspan x="28" y="1180.49">B: An original James Real learning reflection on</tspan><tspan x="28" y="1211.64">practical consideration.</tspan></text><text x="28" y="1258.24" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.296">Explain the meaning before looking at the model</tspan><tspan x="28" y="1316.4460000000001">answer. Which action in today’s topic illustrates this</tspan><tspan x="28" y="1347.596">reflection? (Model: We discuss an unclear instruction</tspan><tspan x="28" y="1378.746">before spending an hour on the wrong task.)</tspan></text></svg>