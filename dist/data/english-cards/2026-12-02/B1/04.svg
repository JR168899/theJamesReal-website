<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>look into</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/12/02 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">look into</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="568.1220000000001">examine or investigate</tspan></text><text x="28" y="619.082" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="648.8740000000001">investigate; examine</tspan></text><text x="28" y="699.834" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="729.6260000000001">We should look into another option.</tspan></text><text x="28" y="780.5859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="810.378">Keep the particle with the verb. Check a</tspan><tspan x="28" y="844.678">dictionary before changing its object or word</tspan><tspan x="28" y="878.9780000000001">order.</tspan></text><text x="28" y="929.9379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="959.73">A: How can we finish a task together?</tspan><tspan x="28" y="994.03">B: We should look into another option.</tspan><tspan x="28" y="1028.33">A: That gives us a starting point.</tspan><tspan x="28" y="1062.63">B: Let us try it together.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">Explain the meaning before looking at the model</tspan><tspan x="28" y="1323.772">answer. Explain “look into” in your own words,</tspan><tspan x="28" y="1358.072">then use it in a sentence about working together.</tspan></text></svg>