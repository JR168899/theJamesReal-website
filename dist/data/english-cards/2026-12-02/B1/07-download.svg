<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/12/02 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A visual explanation can help people check a shared understanding.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A visual explanation can help people check a shared understanding.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="470.41">Let me check that I understand.</tspan></text><text x="28" y="522.5975" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="547.9815">A way to confirm your understanding before continuing a</tspan><tspan x="28" y="577.2065">conversation.</tspan></text><text x="28" y="620.6265000000001" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="646.0105000000001">Let me make sure I have this right.; Can I confirm what you</tspan><tspan x="28" y="675.2355000000001">mean?</tspan></text><text x="28" y="718.6555000000001" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="744.0395000000001">A: How should we finish a task together?</tspan><tspan x="28" y="773.2645000000001">B: Let me check that I understand.</tspan></text><text x="28" y="816.6845000000001" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="842.0685000000001">Use this phrase in a friendly conversation. Listen to the</tspan><tspan x="28" y="871.2935000000001">reply before asking your next question.</tspan></text><text x="28" y="914.7135000000001" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="940.0975000000001">A: How would you express this idea?</tspan><tspan x="28" y="969.3225000000001">B: Let me check that I understand.</tspan><tspan x="28" y="998.5475000000001">A: What does that mean here?</tspan><tspan x="28" y="1027.7725">B: A useful way to keep an everyday conversation clear</tspan><tspan x="28" y="1056.9975000000002">and considerate.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1282.7440000000001">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1311.969">When might you say “Let me check that I understand.”?</tspan><tspan x="28" y="1341.1940000000002">(Model: You could say it during a shared project, when you</tspan><tspan x="28" y="1370.419">want to ask for help or make your understanding clear.)</tspan></text></svg>