<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>equivocation</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/11/07 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>equivocation</title><desc>Original family-manga illustration: dialogue, related to equivocation.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.25" font-weight="700" fill="#382d2e"><tspan x="28" y="472.25">equivocation</tspan></text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="506.8125">US /ɪˌkwɪvəˈkeɪʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.25" font-weight="400" fill="#382d2e"><tspan x="28" y="531.4525">Noun. Learn the word in the sense shown below.</tspan></text><text x="28" y="580.3125" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="606.9125">language that allows more than one interpretation,</tspan><tspan x="28" y="637.5375">sometimes to avoid commitment</tspan></text><text x="28" y="683.0375" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="709.6375">ambiguity; evasive wording</tspan></text><text x="28" y="755.1375" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="781.7375000000001">His equivocation left us unsure whether he had agreed.</tspan></text><text x="28" y="827.2375000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="853.8375000000001">Topic: A conversation worth having. Write one sentence</tspan><tspan x="28" y="884.4625000000001">using this word. Check that your sentence keeps the</tspan><tspan x="28" y="915.0875000000001">meaning shown above.</tspan></text><text x="28" y="960.5875000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="987.1875000000001">A: What does “equivocation” mean?</tspan><tspan x="28" y="1017.8125000000001">B: It means language that allows more than one</tspan><tspan x="28" y="1048.4375">interpretation, sometimes to avoid commitment.</tspan><tspan x="28" y="1079.0625">A: Can we use it in a conversation?</tspan><tspan x="28" y="1109.6875">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.0" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.6">Explain your reasoning to a partner. Which word means</tspan><tspan x="28" y="1315.225">“language that allows more than one interpretation,</tspan><tspan x="28" y="1345.85">sometimes to avoid commitment”: equivocation or</tspan><tspan x="28" y="1376.475">intersubjective? (Model: equivocation)</tspan></text></svg>