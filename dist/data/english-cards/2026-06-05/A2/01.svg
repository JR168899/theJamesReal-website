<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>leaf</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/06/05 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Leaves form a dense pattern of growth.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Leaves form a dense pattern of growth.</tspan></text><a href="https://www.pexels.com/photo/close-up-photography-green-leafed-plants-1420021/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1420021</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="481.91">leaf</tspan></text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="524.7675">US /lif/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.870000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="555.3211">Singular: leaf; plural: leaves.</tspan></text><text x="28" y="615.9075" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="648.8915000000001">a flat green part of a plant</tspan></text><text x="28" y="705.3115" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="738.2955000000001">plant blade; foliage unit</tspan></text><text x="28" y="794.7155" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="827.6995000000001">A green leaf has fallen onto the path.</tspan></text><text x="28" y="884.1195" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="917.1035">Keep the sense and countability shown in</tspan><tspan x="28" y="955.0785000000001">the example. Use a singular or plural form</tspan><tspan x="28" y="993.0535000000001">appropriate to the specific person, object or</tspan><tspan x="28" y="1031.0285000000001">event being discussed.</tspan></text><text x="28" y="1087.4485" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1120.4325000000001">Bella: Why is this leaf yellow?</tspan><tspan x="28" y="1158.4075">Fenrir: I am not sure. Let us check the plant.</tspan><tspan x="28" y="1196.3825000000002">Bella: Should I pull it off now?</tspan><tspan x="28" y="1234.3575">Fenrir: Wait until we know what is wrong.</tspan></text><text x="28" y="1290.7775" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.7615">A leaf changes color. Suggest a careful first</tspan><tspan x="28" y="1361.7365">response rather than guessing the cause.</tspan></text></svg>