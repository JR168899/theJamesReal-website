<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>arrive</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/01/09 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A station is a place between departure and arrival.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A station is a place between departure and arrival.</tspan></text><a href="https://www.pexels.com/photo/people-standing-on-a-platform-on-a-train-station-5617385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5617385</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">arrive</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /əˈraɪv/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">arrive · arrives · arrived · arrived · arriving (base · third</tspan><tspan x="28" y="579.5250000000001">person · past · past participle · -ing)</tspan></text><text x="28" y="638.157" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="670.0770000000001">to reach a place</tspan></text><text x="28" y="724.677" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="756.5970000000001">reach a place; get there</tspan></text><text x="28" y="811.197" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="843.1170000000001">We arrive at the station before nine.</tspan></text><text x="28" y="897.717" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="929.6370000000001">Topic: A journey with room to spare. Write one</tspan><tspan x="28" y="966.3870000000001">sentence using this word. Check that your</tspan><tspan x="28" y="1003.1370000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1057.7369999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1089.657">A: What does “arrive” mean?</tspan><tspan x="28" y="1126.407">B: It means to reach a place.</tspan><tspan x="28" y="1163.157">A: Can we use it on a journey?</tspan><tspan x="28" y="1199.907">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1292.72">Read, then answer. Which word means “to</tspan><tspan x="28" y="1329.47">reach a place”: arrive or journey? (Model:</tspan><tspan x="28" y="1366.22">arrive)</tspan></text></svg>