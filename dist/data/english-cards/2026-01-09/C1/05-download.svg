<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/01/09 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#383426"><tspan x="28" y="470.41">the devil is in the details</tspan></text><text x="28" y="522.5975" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="547.9815">small details can cause important difficulties</tspan></text><text x="28" y="591.4015" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="616.7855000000001">small points can cause big problems; careful execution</tspan><tspan x="28" y="646.0105000000001">matters</tspan></text><text x="28" y="689.4305" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="714.8145000000001">The broad idea is sound, but the devil is in the details.</tspan></text><text x="28" y="758.2345" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="783.6185">A warning about overlooked implementation details. Use a</tspan><tspan x="28" y="812.8435000000001">concrete consequential detail rather than a purely</tspan><tspan x="28" y="842.0685000000001">decorative preference.</tspan></text><text x="28" y="885.4885" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="910.8725000000001">A: Entry is free, so we can register when we arrive.</tspan><tspan x="28" y="940.0975000000001">B: Read the conditions. Registration closes at noon.</tspan><tspan x="28" y="969.3225000000001">A: The devil is in the details. I only noticed free entry.</tspan><tspan x="28" y="998.5475000000001">B: We still have time to register now.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1282.7440000000001">Which overlooked detail matters: the poster&#x27;s color or a</tspan><tspan x="28" y="1311.969">registration deadline six hours before the contest? Explain.</tspan><tspan x="28" y="1341.1940000000002">(Model: The deadline matters because someone arriving</tspan><tspan x="28" y="1370.419">without registering earlier may be unable to enter.)</tspan></text></svg>