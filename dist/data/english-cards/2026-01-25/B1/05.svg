<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>play it by ear</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/01/25 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#383426"><tspan x="28" y="480.3">play it by ear</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="577.845">decide what to do as events develop</tspan></text><text x="28" y="632.4449999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="664.365">improvise; respond as you go</tspan></text><text x="28" y="718.9649999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="750.885">We have a rough plan, but we can play it by</tspan><tspan x="28" y="787.635">ear.</tspan></text><text x="28" y="842.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="874.155">Decide as circumstances develop. Distinguish</tspan><tspan x="28" y="910.905">this figurative use from playing music by ear</tspan><tspan x="28" y="947.655">without reading a score.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1034.175">A: Should we reserve every hour of Saturday?</tspan><tspan x="28" y="1070.925">B: Let us book the train and play the afternoon</tspan><tspan x="28" y="1107.675">by ear.</tspan><tspan x="28" y="1144.425">A: What if it rains?</tspan><tspan x="28" y="1181.175">B: We can choose an indoor activity when we</tspan><tspan x="28" y="1217.925">see the weather.</tspan></text><text x="28" y="1272.5249999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1304.445">Make a plan that includes one fixed</tspan><tspan x="28" y="1341.195">arrangement and one part to play by ear.</tspan></text></svg>