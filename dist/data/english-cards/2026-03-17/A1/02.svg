<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>water</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/03/17 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A glass holds drinking water.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A glass holds drinking water.</tspan></text><a href="https://www.pexels.com/photo/clear-drinking-glass-on-table-4098281/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4098281</text></a></svg><text font-family="Arial, sans-serif" font-size="49.220000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="481.22">water</tspan></text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="523.485">US /ˈwɔtɚ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.540000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="553.6161999999999">Usually uncountable: water; no regular plural in this</tspan><tspan x="28" y="582.3349999999999">sense.</tspan></text><text x="28" y="642.0838" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="674.6118">the clear liquid that people, animals and</tspan><tspan x="28" y="712.0618000000001">plants need</tspan></text><text x="28" y="767.7018" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="800.2298000000001">clear drinking liquid; H₂O</tspan></text><text x="28" y="855.8698" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="888.3978000000001">The plant needs a little water.</tspan></text><text x="28" y="944.0378000000001" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="976.5658000000001">Water is uncountable in this sense: some</tspan><tspan x="28" y="1014.0158000000001">water or a glass of water. The verb water a</tspan><tspan x="28" y="1051.4658000000002">plant is a different grammatical use.</tspan></text><text x="28" y="1107.1058" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1139.6338000000003">Heart: Can I have some water?</tspan><tspan x="28" y="1177.0838000000003">Puck: Of course. Your glass is here.</tspan><tspan x="28" y="1214.5338000000004">Heart: Is it cold?</tspan><tspan x="28" y="1251.9838000000002">Puck: A little. I can bring room-temperature</tspan><tspan x="28" y="1289.4338000000002">water instead.</tspan></text><text x="28" y="1345.0738000000001" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1377.6018000000004">Ask for water politely.</tspan></text></svg>