<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>priority</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/06/11 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written plan connects limited time with a chosen purpose.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written plan connects limited time with a chosen purpose.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">priority</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /praɪˈɔrəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">Singular: priority; plural: priorities.</tspan></text><text x="28" y="604.8900000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="635.8980000000001">something considered more important than</tspan><tspan x="28" y="671.5980000000002">other things</tspan></text><text x="28" y="724.6380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="755.6460000000002">main concern; matter of greater importance</tspan></text><text x="28" y="808.6860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="839.6940000000002">Safety is our first priority on the journey.</tspan></text><text x="28" y="892.7340000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="923.7420000000002">Topic: Looking back and looking ahead. Write</tspan><tspan x="28" y="959.4420000000002">one sentence using this word. Check that your</tspan><tspan x="28" y="995.1420000000002">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1048.182" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1079.19">A: What does “priority” mean?</tspan><tspan x="28" y="1114.89">B: It means something considered more</tspan><tspan x="28" y="1150.5900000000001">important than other things.</tspan><tspan x="28" y="1186.29">A: Can we use it at the end of the year?</tspan><tspan x="28" y="1221.99">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1275.03" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.038">Which word means “something considered</tspan><tspan x="28" y="1341.738">more important than other things”: priority or</tspan><tspan x="28" y="1377.438">evaluate? (Model: priority)</tspan></text></svg>