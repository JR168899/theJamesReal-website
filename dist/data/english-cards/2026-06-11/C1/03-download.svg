<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/06/11 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A budget helps someone allow for costs and limits.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A budget helps someone allow for costs and limits.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="470.41">factor something in</tspan><tspan x="28" y="518.4225">factor in something</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="595.994">include something when making a judgement</tspan></text><text x="28" y="639.414" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="664.798">allow for; take into account</tspan></text><text x="28" y="708.218" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="733.602">We factor in the time other people need.</tspan></text><text x="28" y="777.0219999999999" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="802.406">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="831.631">changing its object or word order.</tspan></text><text x="28" y="875.0509999999999" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="900.435">A: How can we make a realistic plan?</tspan><tspan x="28" y="929.66">B: We factor in the time other people need.</tspan><tspan x="28" y="958.885">A: That gives us a starting point.</tspan><tspan x="28" y="988.1099999999999">B: Let us try it together.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1282.7440000000001">Explain “factor in” in your own words, then use it in a</tspan><tspan x="28" y="1311.969">sentence about looking back and looking ahead. (Model: It</tspan><tspan x="28" y="1341.1940000000002">means to include something when making a judgement.</tspan><tspan x="28" y="1370.419">Example: We factor in the time other people need.)</tspan></text></svg>