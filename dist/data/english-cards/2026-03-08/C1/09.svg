<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Inversion after only then</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/03/08 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pumpkin-head costume changes a familiar human appearance.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pumpkin-head costume changes a familiar human appearance.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382f40"><tspan x="28" y="482.0">Inversion after only then</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="584.04">Put an auxiliary before the subject when</tspan><tspan x="28" y="622.54">Only then begins a sentence in this pattern.</tspan></text><text x="28" y="679.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="713.18">Only then did we understand the problem.</tspan></text><text x="28" y="770.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="803.8199999999999">After fronted Only then use auxiliary +</tspan><tspan x="28" y="842.3199999999999">subject + main verb. Past simple uses did +</tspan><tspan x="28" y="880.8199999999999">base verb: did we understand, not</tspan><tspan x="28" y="919.3199999999999">understood.</tspan></text><text x="28" y="976.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1009.9599999999999">Kore: Did you notice the missing condition</tspan><tspan x="28" y="1048.46">at once?</tspan><tspan x="28" y="1086.96">Onyx: No. I read the second page first.</tspan><tspan x="28" y="1125.46">Kore: And after that?</tspan><tspan x="28" y="1163.96">Onyx: Only then did I realize that advance</tspan><tspan x="28" y="1202.46">registration was required.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1295.04">Rewrite We read the second page. At that</tspan><tspan x="28" y="1333.54">moment we understood the deadline as a</tspan><tspan x="28" y="1372.04">sentence beginning Only then.</tspan></text></svg>