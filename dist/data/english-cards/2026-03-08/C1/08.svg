<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A thing of beauty is a joy for ever:</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/03/08 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A greeting card sits beside flowers.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A greeting card sits beside flowers.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#2c3540"><tspan x="28" y="474.78">A thing of beauty is a joy for</tspan><tspan x="28" y="528.255">ever:</tspan></text><text font-family="Arial, sans-serif" font-size="18.6" font-weight="400" fill="#2c3540"><tspan x="28" y="557.5500000000001">John Keats · Endymion, Book I · Published 1818</tspan></text><text x="28" y="608.7" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="636.972">Something beautiful can continue to give pleasure</tspan><tspan x="28" y="669.5219999999999">after the first moment.</tspan></text><text x="28" y="717.8820000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="746.154">Beauty can bring lasting pleasure; A beautiful</tspan><tspan x="28" y="778.704">experience can stay with us</tspan></text><text x="28" y="827.0640000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="855.336">Long after our walk, I still remember the light on the</tspan><tspan x="28" y="887.886">trees.</tspan></text><text x="28" y="936.2460000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="964.518">The colon is retained from the opening line. For ever</tspan><tspan x="28" y="997.068">is an older two-word spelling of forever. This is a</tspan><tspan x="28" y="1029.618">poetic claim, not a measurable promise.</tspan></text><text x="28" y="1077.9780000000003" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1106.2500000000002">A: Why would a beautiful thing continue to give joy?</tspan><tspan x="28" y="1138.8000000000002">B: Its memory or influence may last after the first</tspan><tspan x="28" y="1171.3500000000001">encounter.</tspan><tspan x="28" y="1203.9000000000003">A: Must everyone find the same thing beautiful?</tspan><tspan x="28" y="1236.4500000000003">B: No. The line invites reflection rather than</tspan><tspan x="28" y="1269.0000000000002">establishing a universal preference.</tspan></text><text x="28" y="1317.3600000000004" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1345.6320000000003">Name one way an encounter with beauty can remain</tspan><tspan x="28" y="1378.1820000000002">meaningful after the object is no longer present.</tspan></text></svg>