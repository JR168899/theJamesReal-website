l="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">in agreement or sharing an understanding</tspan></text><text x="35" y="590.8" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Are we on the same page about the plan?</tspan></text><text x="35" y="667.1999999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Learn the whole expression. It is figurative language, so</tspan><tspan x="35" dy="24.839999999999996">a word-for-word interpretation may be misleading.</tspan></text><text x="35" y="768.4399999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="792.9999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Try without help. What does “on the same page” mean in</tspan><tspan x="35" dy="24.839999999999996">this example? Are we on the same page about the plan?</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   05 OF 11</tspan></text></svg>