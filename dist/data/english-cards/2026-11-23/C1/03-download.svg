<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - Phrasal verbs</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#3d3028">2026-11-23 · C1 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>factor in</title><desc>Original family-manga illustration: music, related to factor in.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#54b8ec"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#d59bea"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#d59bea"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34.04" font-weight="700" fill="#3d3028"><tspan x="28" y="466.04">factor something in</tspan><tspan x="28" y="508.59000000000003">factor in something</tspan></text><text x="28" y="554.84" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="577.336">include something when making a judgement</tspan></text><text x="28" y="615.816" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="638.312">include something when making a judgement</tspan></text><text x="28" y="676.792" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="699.288">We factor in the time other people need.</tspan></text><text x="28" y="737.768" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="760.264">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="786.164">changing its object or word order.</tspan></text><text x="28" y="824.644" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="847.14">A: How can we listen to a whole album?</tspan><tspan x="28" y="873.04">B: We factor in the time other people need.</tspan><tspan x="28" y="898.9399999999999">A: That gives us a starting point.</tspan><tspan x="28" y="924.8399999999999">B: Let us try it together.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.84" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.72" font-weight="400" fill="#3d3028"><tspan x="28" y="1278.336">Review without reading the example first. Explain “factor in” in</tspan><tspan x="28" y="1304.236">your own words, then use it in a sentence about listening</tspan><tspan x="28" y="1330.136">without distraction. (Model: It means to include something</tspan><tspan x="28" y="1356.036">when making a judgement. Example: We factor in the time</tspan><tspan x="28" y="1381.936">other people need.)</tspan></text></svg>