169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#d59bea"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#d59bea"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.08" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">follow through</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="568.1220000000001">complete what you have agreed to do</tspan></text><text x="28" y="619.0819999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="648.874">carry out a commitment; see it through</tspan></text><text x="28" y="699.8339999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="729.626">A good plan matters only if we follow through.</tspan></text><text x="28" y="780.5859999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="810.3779999999999">Keep the particle with the verb. Check a</tspan><tspan x="28" y="844.6779999999999">dictionary before changing its object or word</tspan><tspan x="28" y="878.978">order.</tspan></text><text x="28" y="929.9379999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="959.7299999999998">A: How can we listen to a whole album?</tspan><tspan x="28" y="994.0299999999997">B: A good plan matters only if we follow through.</tspan><tspan x="28" y="1028.3299999999997">A: That gives us a starting point.</tspan><tspan x="28" y="1062.6299999999999">B: Let us try it together.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">Review without reading the example first. Explain</tspan><tspan x="28" y="1323.772">“follow through” in your own words, then use it in</tspan><tspan x="28" y="1358.072">a sentence about listening without distraction.</tspan></text></svg>