<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Inversion after only then</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/02/09 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pumpkin-head costume changes a familiar human appearance.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pumpkin-head costume changes a familiar human appearance.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="480.99">Inversion after only then</tspan></text><text x="28" y="547.5525" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="579.9285000000001">Put an auxiliary before the subject when</tspan><tspan x="28" y="617.2035000000001">Only then begins a sentence in this pattern.</tspan></text><text x="28" y="672.5835000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="704.9595000000002">Only then did we realize what our guests</tspan><tspan x="28" y="742.2345000000001">needed for Valentine’s Day.</tspan></text><text x="28" y="797.6145000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="829.9905000000002">After fronted Only then use auxiliary +</tspan><tspan x="28" y="867.2655000000002">subject + main verb. Past simple uses did +</tspan><tspan x="28" y="904.5405000000003">base verb: did we understand, not</tspan><tspan x="28" y="941.8155000000003">understood.</tspan></text><text x="28" y="997.1955000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1029.5715000000002">Kore: Did you notice the missing condition at</tspan><tspan x="28" y="1066.8465000000003">once?</tspan><tspan x="28" y="1104.1215000000002">Onyx: No. I read the second page first.</tspan><tspan x="28" y="1141.3965000000003">Kore: And after that?</tspan><tspan x="28" y="1178.6715000000004">Onyx: Only then did I realize that advance</tspan><tspan x="28" y="1215.9465000000002">registration was required.</tspan></text><text x="28" y="1271.3265000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1303.7025">Rewrite We read the second page. At that</tspan><tspan x="28" y="1340.9775000000002">moment we understood the deadline as a</tspan><tspan x="28" y="1378.2525">sentence beginning Only then.</tspan></text></svg>