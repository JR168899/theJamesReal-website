<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you like to show someone you appreciate them?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/02/09 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Hands arrange paper around a gift.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Hands arrange paper around a gift.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-wrapping-a-gift-5272210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5272210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#353331"><tspan x="28" y="472.48">How do you like to show</tspan><tspan x="28" y="523.08">someone you appreciate them?</tspan></text><text x="28" y="578.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="604.832">An opening that invites a personal preference or</tspan><tspan x="28" y="635.632">experience without assuming everyone shares it.</tspan></text><text x="28" y="681.392" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="708.144">How do you like to show someone you appreciate</tspan><tspan x="28" y="738.944">them?</tspan></text><text x="28" y="784.7040000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="811.456">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="842.256">different preference or a declined invitation without</tspan><tspan x="28" y="873.056">asking the person to justify it.</tspan></text><text x="28" y="918.8160000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="945.5680000000001">Sky: Do you usually buy a Valentine&#x27;s gift?</tspan><tspan x="28" y="976.368">Michael: Sometimes, but I often write a note to a</tspan><tspan x="28" y="1007.1680000000001">friend.</tspan><tspan x="28" y="1037.968">Sky: What do you put in it?</tspan><tspan x="28" y="1068.768">Michael: One specific thing I am grateful for.</tspan><tspan x="28" y="1099.5680000000002">Sky: That sounds less pressured than a grand</tspan><tspan x="28" y="1130.3680000000002">gesture.</tspan><tspan x="28" y="1161.1680000000001">Michael: It feels more like what I actually want to say.</tspan></text><text x="28" y="1258.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1284.832">A friend prefers a personal note to an expensive gift.</tspan><tspan x="28" y="1315.632">Ask about a specific kind act they might mention.</tspan><tspan x="28" y="1346.432">(Model: Is there something they did recently that you</tspan><tspan x="28" y="1377.2320000000002">would like to thank them for?)</tspan></text></svg>