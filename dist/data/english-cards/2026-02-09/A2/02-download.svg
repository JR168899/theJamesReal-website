<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>prepare</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/02/09 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Getting food ready is part of preparing a meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Getting food ready is part of preparing a meal.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">prepare</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /prɪˈpɛr/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">prepare · prepares · prepared · prepared · preparing (base ·</tspan><tspan x="28" y="571.7974999999999">third person · past · past participle · -ing)</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">to make something ready</tspan></text><text x="28" y="709.3463" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="739.5943000000001">get ready; make ready</tspan></text><text x="28" y="791.3343000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="821.5823000000001">We prepare the vegetables before our guests</tspan><tspan x="28" y="856.4073000000002">arrive.</tspan></text><text x="28" y="908.1473000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953000000001">Topic: A thoughtful message for Valentine’s</tspan><tspan x="28" y="973.2203000000002">Day. Write one sentence using this word. Check</tspan><tspan x="28" y="1008.0453000000001">that your sentence keeps the meaning shown</tspan><tspan x="28" y="1042.8703">above.</tspan></text><text x="28" y="1094.6103000000003" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1124.8583">A: What does “prepare” mean?</tspan><tspan x="28" y="1159.6833000000001">B: It means to make something ready.</tspan><tspan x="28" y="1194.5083000000002">A: Can we use it when sending a greeting?</tspan><tspan x="28" y="1229.3333">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1281.0733000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1311.3213">Read, then answer. Which word means “to</tspan><tspan x="28" y="1346.1463">make something ready”: prepare or invite?</tspan><tspan x="28" y="1380.9713000000002">(Model: prepare)</tspan></text></svg>