<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>brevity is the soul of wit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/04/27 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="476.16">brevity is the soul of wit</tspan></text><text font-family="Arial, sans-serif" font-size="19.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="506.4">William Shakespeare · Hamlet, Act II, Scene 2 (First Folio) · Published</tspan><tspan x="28" y="529.824">1623</tspan></text><text x="28" y="582.24" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="611.424">Expressing an idea briefly can make it more</tspan><tspan x="28" y="645.024">effective or clever.</tspan></text><text x="28" y="694.9440000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="724.128">Concise expression can be powerful; Wit often</tspan><tspan x="28" y="757.7280000000001">benefits from economy</tspan></text><text x="28" y="807.648" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="836.832">Instead of repeating the explanation, I give one</tspan><tspan x="28" y="870.432">clear sentence and wait for a reply.</tspan></text><text x="28" y="920.352" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="949.536">This is an excerpt from a speech by Polonius. His</tspan><tspan x="28" y="983.136">lengthy speech creates irony, so the dramatic</tspan><tspan x="28" y="1016.736">context matters. The date refers to the First Folio</tspan><tspan x="28" y="1050.336">publication.</tspan></text><text x="28" y="1100.2559999999999" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1129.44">A: Is the message long?</tspan><tspan x="28" y="1163.04">B: Very long.</tspan><tspan x="28" y="1196.64">A: Could it be shorter and still clear?</tspan><tspan x="28" y="1230.24">B: Yes. We can remove the repeated information.</tspan></text><text x="28" y="1280.1599999999999" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1309.344">Make this shorter: Please meet me at ten o&#x27;clock,</tspan><tspan x="28" y="1342.944">which is the time of our meeting. (Model: Please</tspan><tspan x="28" y="1376.544">meet me at ten.)</tspan></text></svg>