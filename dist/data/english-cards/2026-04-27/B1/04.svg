<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>look into</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/04/27 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="481.91">look into</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="582.7065000000001">examine or investigate</tspan></text><text x="28" y="639.1265000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="672.1105000000001">investigate; examine</tspan></text><text x="28" y="728.5305000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="761.5145000000001">We should look into another option.</tspan></text><text x="28" y="817.9345000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="850.9185000000001">Keep the particle with the verb. Check a</tspan><tspan x="28" y="888.8935000000001">dictionary before changing its object or word</tspan><tspan x="28" y="926.8685000000002">order.</tspan></text><text x="28" y="983.2885000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1016.2725000000002">A: How can we listen to a friend?</tspan><tspan x="28" y="1054.2475000000002">B: We should look into another option.</tspan><tspan x="28" y="1092.2225">A: That gives us a starting point.</tspan><tspan x="28" y="1130.1975000000002">B: Let us try it together.</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1294.344">Explain your reasoning to a partner. Explain</tspan><tspan x="28" y="1332.319">“look into” in your own words, then use it in a</tspan><tspan x="28" y="1370.294">sentence about a conversation worth having.</tspan></text></svg>