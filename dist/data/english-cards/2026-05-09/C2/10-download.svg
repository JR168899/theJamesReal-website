<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Mother’s Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/05/09 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#353331"><tspan x="28" y="468.8">What would you like to do for</tspan><tspan x="28" y="514.8000000000001">Mother’s Day?</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="589.12">An open question that invites a person to describe a familiar</tspan><tspan x="28" y="617.12">experience.</tspan></text><text x="28" y="658.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="683.04">What would you like to do for Mother’s Day?</tspan></text><text x="28" y="724.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="748.9599999999999">Ask this as a genuine question. Listen to the answer, then ask</tspan><tspan x="28" y="776.9599999999999">a related follow-up.</tspan></text><text x="28" y="818.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="842.8799999999999">A: What would you like to do for Mother’s Day?</tspan><tspan x="28" y="870.8799999999999">B: I would like to show appreciation through an action.</tspan><tspan x="28" y="898.8799999999999">A: What should we prepare?</tspan><tspan x="28" y="926.8799999999999">B: For example, we name one helpful action instead of relying</tspan><tspan x="28" y="954.8799999999999">on a general compliment.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1281.1200000000001">Make a sentence of your own, then answer: Write a reply of</tspan><tspan x="28" y="1309.1200000000001">your own, then ask one related question. (Model: I treat the</tspan><tspan x="28" y="1337.1200000000001">plan as provisional, rather than assuming that its coherence</tspan><tspan x="28" y="1365.1200000000001">guarantees a good experience. What works best for you?)</tspan></text></svg>