<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/09 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="472.48">I would distinguish between the</tspan><tspan x="28" y="523.08">intention and its consequences.</tspan></text><text x="28" y="578.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="604.832">A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="635.632">from the effects of their action.</tspan></text><text x="28" y="681.392" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="708.144">I would separate the aim from the outcome.; We</tspan><tspan x="28" y="738.944">should assess purpose and effects independently.</tspan></text><text x="28" y="784.7040000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="811.456">A: How should we show appreciation through an</tspan><tspan x="28" y="842.256">action?</tspan><tspan x="28" y="873.056">B: I would distinguish between the intention and its</tspan><tspan x="28" y="903.856">consequences.</tspan></text><text x="28" y="949.6160000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="976.368">Use this phrase in a friendly conversation. Listen to</tspan><tspan x="28" y="1007.168">the reply before asking your next question.</tspan></text><text x="28" y="1052.9279999999999" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1079.68">A: How would you express this idea?</tspan><tspan x="28" y="1110.48">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1141.28">consequences.</tspan><tspan x="28" y="1172.0800000000002">A: What does that mean here?</tspan><tspan x="28" y="1202.88">B: A proposal to evaluate a person’s purpose</tspan><tspan x="28" y="1233.68">separately from the effects of their action.</tspan></text><text x="28" y="1279.4399999999998" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1306.192">Make a sentence of your own, then answer: When</tspan><tspan x="28" y="1336.992">might you say “I would distinguish between the</tspan><tspan x="28" y="1367.792">intention and its consequences.”?</tspan></text></svg>