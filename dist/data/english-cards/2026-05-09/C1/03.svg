<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/05/09 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="478.69">factor something in</tspan><tspan x="28" y="537.0525">factor in something</tspan></text><text x="28" y="600.49" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="631.346">include something when making a judgement</tspan></text><text x="28" y="684.126" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="714.982">allow for; take into account</tspan></text><text x="28" y="767.762" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="798.6179999999999">We factor in the time other people need.</tspan></text><text x="28" y="851.3979999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="882.2539999999999">Separable: factor the delay in / factor in the</tspan><tspan x="28" y="917.7789999999999">delay; factor it in. Include a relevant time, cost</tspan><tspan x="28" y="953.3039999999999">or condition in a calculation.</tspan></text><text x="28" y="1006.084" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1036.94">A: Leaving at seven twenty should be fine.</tspan><tspan x="28" y="1072.4650000000001">B: Have you factored in the fifteen-minute walk?</tspan><tspan x="28" y="1107.99">A: I had not. There is a ten-minute queue as</tspan><tspan x="28" y="1143.515">well.</tspan><tspan x="28" y="1179.04">B: Then we should work backward from the</tspan><tspan x="28" y="1214.565">seven-thirty start.</tspan></text><text x="28" y="1267.345" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1298.201">A walk starts at 7:30. Allow fifteen minutes to</tspan><tspan x="28" y="1333.726">get there and ten minutes to enter. Give the</tspan><tspan x="28" y="1369.251">latest departure time and explain.</tspan></text></svg>