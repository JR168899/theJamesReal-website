<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/05/09 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="468.8">Let me check that I understand.</tspan></text><text x="28" y="518.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="543.12">A way to confirm your understanding before continuing a</tspan><tspan x="28" y="571.12">conversation.</tspan></text><text x="28" y="612.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="637.04">Let me make sure I have this right.; Can I confirm what you</tspan><tspan x="28" y="665.04">mean?</tspan></text><text x="28" y="706.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="730.9599999999999">A: How should we show appreciation through an action?</tspan><tspan x="28" y="758.9599999999999">B: Let me check that I understand.</tspan></text><text x="28" y="800.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="824.8799999999999">Use this phrase in a friendly conversation. Listen to the reply</tspan><tspan x="28" y="852.8799999999999">before asking your next question.</tspan></text><text x="28" y="894.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="918.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="946.7999999999998">B: Let me check that I understand.</tspan><tspan x="28" y="974.7999999999998">A: What does that mean here?</tspan><tspan x="28" y="1002.7999999999998">B: A way to confirm your understanding before continuing a</tspan><tspan x="28" y="1030.7999999999997">conversation.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">Make a sentence of your own, then answer: When might you</tspan><tspan x="28" y="1309.1200000000001">say “Let me check that I understand.”? (Model: You could say</tspan><tspan x="28" y="1337.1200000000001">it when thanking someone who cares for us, when you want to</tspan><tspan x="28" y="1365.1200000000001">ask for help or make your understanding clear.)</tspan></text></svg>