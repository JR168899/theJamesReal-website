<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>tidy</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - Vocabulary</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#382d2e">2026-10-22 · A2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>tidy</title><desc>Original family-manga illustration: room, related to tidy.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#382d2e"><tspan x="28" y="478.0">tidy</tspan></text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="517.5">US /ˈtaɪdi/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#382d2e"><tspan x="28" y="545.66">Adjective. Learn the word in the sense shown below.</tspan></text><text x="28" y="601.5" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="631.9">arranged neatly and without unnecessary</tspan><tspan x="28" y="666.9">things lying around</tspan></text><text x="28" y="718.9" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="749.3">neat; orderly</tspan></text><text x="28" y="801.3" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="831.6999999999999">A tidy desk makes it easier to find a notebook.</tspan></text><text x="28" y="883.6999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="914.0999999999999">Topic: Making a room your own. Write one</tspan><tspan x="28" y="949.0999999999999">sentence using this word. Check that your</tspan><tspan x="28" y="984.0999999999999">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1036.1" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="1066.5">A: What does “tidy” mean?</tspan><tspan x="28" y="1101.5">B: It means arranged neatly and without</tspan><tspan x="28" y="1136.5">unnecessary things lying around.</tspan><tspan x="28" y="1171.5">A: Can we use it at home?</tspan><tspan x="28" y="1206.5">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382d2e"><tspan x="28" y="1290.4">Try it. Which word means “arranged neatly and</tspan><tspan x="28" y="1325.4">without unnecessary things lying around”: tidy</tspan><tspan x="28" y="1360.4">or shelf?</tspan></text></svg>