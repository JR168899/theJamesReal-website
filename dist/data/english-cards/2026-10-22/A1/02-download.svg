<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>window</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/22 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Light enters through a narrow window.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Light enters through a narrow window.</tspan></text><a href="https://www.pexels.com/photo/sunlight-streaming-into-a-dark-room-through-a-lone-window-18820283/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 18820283</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">window</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ˈwɪndoʊ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">Singular: window; plural: windows.</tspan></text><text x="28" y="609.975" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.8950000000001">an opening with glass that lets light into a room</tspan></text><text x="28" y="696.495" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="728.4150000000001">glazed opening; window opening</tspan></text><text x="28" y="783.015" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="814.9350000000001">We open the window to let in fresh air.</tspan></text><text x="28" y="869.535" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="901.455">Keep the sense and countability shown in the</tspan><tspan x="28" y="938.205">example. Use a singular or plural form</tspan><tspan x="28" y="974.955">appropriate to the specific person, object or</tspan><tspan x="28" y="1011.705">event being discussed.</tspan></text><text x="28" y="1066.305" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1098.2250000000001">Heart: Can you open the window?</tspan><tspan x="28" y="1134.9750000000001">Puck: A little. The room is warm.</tspan><tspan x="28" y="1171.7250000000001">Heart: Is the noise outside too loud?</tspan><tspan x="28" y="1208.4750000000001">Puck: No. This is fine.</tspan></text><text x="28" y="1263.075" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1294.9950000000001">The room is warm. Ask someone to open the</tspan><tspan x="28" y="1331.7450000000001">window a little. (Model: Could you open the</tspan><tspan x="28" y="1368.4950000000001">window a little, please?)</tspan></text></svg>