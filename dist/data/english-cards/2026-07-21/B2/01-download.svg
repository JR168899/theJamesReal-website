<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>assumption</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/07/21 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">assumption</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /əˈsʌmpʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Singular: assumption; plural: assumptions.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">something accepted as true without enough</tspan><tspan x="28" y="655.1550000000001">evidence</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">supposition; something taken for granted</tspan></text><text x="28" y="782.835" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="811.715">Our plan rests on the assumption that everyone</tspan><tspan x="28" y="844.965">can attend.</tspan></text><text x="28" y="894.365" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="923.245">Keep the sense and countability shown in the</tspan><tspan x="28" y="956.495">example. Use a singular or plural form</tspan><tspan x="28" y="989.745">appropriate to the specific person, object or event</tspan><tspan x="28" y="1022.995">being discussed.</tspan></text><text x="28" y="1072.395" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1101.2749999999999">A: Why did we reserve a place for ten?</tspan><tspan x="28" y="1134.5249999999999">B: We worked on the assumption that everyone</tspan><tspan x="28" y="1167.7749999999999">would attend.</tspan><tspan x="28" y="1201.0249999999999">A: Has anybody actually confirmed?</tspan><tspan x="28" y="1234.2749999999999">B: Only six people. We should check the others.</tspan></text><text x="28" y="1283.675" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1312.5549999999998">Identify the assumption in reserving ten seats</tspan><tspan x="28" y="1345.8049999999998">before hearing from four invitees. (Model: That all</tspan><tspan x="28" y="1379.0549999999998">ten invitees will attend.)</tspan></text></svg>