<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>explain</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/07/21 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group develops a shared plan around a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group develops a shared plan around a board.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#382d2e"><tspan x="28" y="479.38">explain</tspan></text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="520.065">US /ɪkˈspleɪn/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.66" font-weight="400" fill="#382d2e"><tspan x="28" y="549.0698">explain · explains · explained · explained · explaining</tspan><tspan x="28" y="576.715">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="634.2302" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="665.5422">to make something clear by giving information</tspan></text><text x="28" y="719.1021999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="750.4141999999999">make clear; describe how or why</tspan></text><text x="28" y="803.9741999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="835.2861999999999">Please explain how this tool works.</tspan></text><text x="28" y="888.8461999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="920.1581999999999">Use the verb in the sense shown in the</tspan><tspan x="28" y="956.2081999999998">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="992.2581999999999">object; the word forms above show its</tspan><tspan x="28" y="1028.3082">changes.</tspan></text><text x="28" y="1081.8682" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1113.1801999999998">A: Can you explain this part?</tspan><tspan x="28" y="1149.2301999999997">B: The blue line shows where we start.</tspan><tspan x="28" y="1185.2801999999997">A: And the red one?</tspan><tspan x="28" y="1221.3301999999999">B: That is the way back.</tspan></text><text x="28" y="1274.8901999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.2021999999997">Ask for an explanation of one specific part of a</tspan><tspan x="28" y="1342.2521999999997">map. (Model: Could you explain what the red</tspan><tspan x="28" y="1378.3021999999996">line shows?)</tspan></text></svg>