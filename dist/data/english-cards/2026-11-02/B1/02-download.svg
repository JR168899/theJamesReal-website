<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>reflect</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/11/02 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">reflect</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /rɪˈflɛkt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">reflect · reflects · reflected · reflected · reflecting (base · third</tspan><tspan x="28" y="559.1525">person · past · past participle · -ing)</tspan></text><text x="28" y="609.6877" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="637.1997">to think carefully about something</tspan></text><text x="28" y="684.2597" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="711.7717">think carefully; consider</tspan></text><text x="28" y="758.8317" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="786.3437">At the end of the day, I reflect on what I learned.</tspan></text><text x="28" y="833.4037" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="860.9157">Use the verb in the sense shown in the exchange.</tspan><tspan x="28" y="892.5907">Notice the subject, tense and any object; the word</tspan><tspan x="28" y="924.2657">forms above show its changes.</tspan></text><text x="28" y="971.3257" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="998.8377">A: You closed the book without starting the next</tspan><tspan x="28" y="1030.5127">chapter.</tspan><tspan x="28" y="1062.1877">B: I wanted to reflect on the ending.</tspan><tspan x="28" y="1093.8627000000001">A: Did it change your mind about the character?</tspan><tspan x="28" y="1125.5377">B: It made me less certain about my first judgment.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Give a reflective response to an ending that</tspan><tspan x="28" y="1317.667">challenged your first impression of a character.</tspan><tspan x="28" y="1349.3419999999999">(Model: I first thought she was selfish, but the ending</tspan><tspan x="28" y="1381.017">made me reconsider what she knew at the time.)</tspan></text></svg>