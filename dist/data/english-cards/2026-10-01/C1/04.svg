<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/01 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="480.99">iron something out</tspan><tspan x="28" y="542.2275">iron out something</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="641.166">resolve small difficulties</tspan></text><text x="28" y="696.5459999999999" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="728.922">resolve; straighten out</tspan></text><text x="28" y="784.3019999999999" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="816.678">We can iron out the details before we begin.</tspan></text><text x="28" y="872.0579999999999" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="904.434">Keep the particle with the verb. Check a</tspan><tspan x="28" y="941.709">dictionary before changing its object or word</tspan><tspan x="28" y="978.9839999999999">order.</tspan></text><text x="28" y="1034.364" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1066.7399999999998">A: How can we read a short book?</tspan><tspan x="28" y="1104.0149999999999">B: We can iron out the details before we</tspan><tspan x="28" y="1141.2899999999997">begin.</tspan><tspan x="28" y="1178.5649999999998">A: That gives us a starting point.</tspan><tspan x="28" y="1215.8399999999997">B: Let us try it together.</tspan></text><text x="28" y="1271.22" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1303.596">Explain “iron out” in your own words, then</tspan><tspan x="28" y="1340.871">use it in a sentence about a little time to</tspan><tspan x="28" y="1378.146">read.</tspan></text></svg>