<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discern</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/01 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">discern</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /dɪˈsɝn/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">discern · discerns · discerned · discerned · discerning (base ·</tspan><tspan x="28" y="566.88">third person · past · past participle · -ing)</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">to recognise a detail or difference that is not</tspan><tspan x="28" y="683.2704">immediately obvious</tspan></text><text x="28" y="733.1904000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="762.3744">perceive; distinguish</tspan></text><text x="28" y="812.2944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="841.4784000000001">With careful listening, we can discern a second</tspan><tspan x="28" y="875.0784000000001">melody.</tspan></text><text x="28" y="924.9984000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="954.1824">Use the verb in the sense shown in the</tspan><tspan x="28" y="987.7824">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1021.3824000000001">object; the word forms above show its changes.</tspan></text><text x="28" y="1071.3024" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1100.4864000000002">Kore: Can you discern a change in the narrator&#x27;s</tspan><tspan x="28" y="1134.0864000000001">tone?</tspan><tspan x="28" y="1167.6864000000003">Onyx: The last paragraph is much less confident.</tspan><tspan x="28" y="1201.2864000000002">Kore: Which words give that impression?</tspan><tspan x="28" y="1234.8864000000003">Onyx: The repeated perhaps and the unanswered</tspan><tspan x="28" y="1268.4864000000002">questions.</tspan></text><text x="28" y="1318.4064" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1347.5904000000003">Name two textual clues that could help someone</tspan><tspan x="28" y="1381.1904000000002">discern uncertainty.</tspan></text></svg>