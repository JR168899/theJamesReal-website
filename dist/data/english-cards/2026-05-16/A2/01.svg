<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>forecast</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/05/16 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Dark clouds gather over a landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Dark clouds gather over a landscape.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">forecast</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /ˈfɔrˌkæst/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">Singular: forecast; plural: forecasts.</tspan></text><text x="28" y="604.8900000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="635.8980000000001">a statement about what the weather is</tspan><tspan x="28" y="671.5980000000002">expected to be like</tspan></text><text x="28" y="724.6380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="755.6460000000002">prediction; weather outlook</tspan></text><text x="28" y="808.6860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="839.6940000000002">The forecast says it will rain this afternoon.</tspan></text><text x="28" y="892.7340000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="923.7420000000002">Keep the sense and countability shown in the</tspan><tspan x="28" y="959.4420000000002">example. Use a singular or plural form</tspan><tspan x="28" y="995.1420000000002">appropriate to the specific person, object or</tspan><tspan x="28" y="1030.842">event being discussed.</tspan></text><text x="28" y="1083.882" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1114.89">Bella: What does the forecast say?</tspan><tspan x="28" y="1150.5900000000001">Fenrir: Rain after three.</tspan><tspan x="28" y="1186.2900000000002">Bella: Then shall we walk in the morning?</tspan><tspan x="28" y="1221.99">Fenrir: That would give us a better chance of</tspan><tspan x="28" y="1257.69">staying dry.</tspan></text><text x="28" y="1310.73" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1341.738">Use a forecast of rain after three to suggest</tspan><tspan x="28" y="1377.438">when to take a walk.</tspan></text></svg>