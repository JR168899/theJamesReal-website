<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Reading maketh a full man; conference a ready man; and writing an exact man.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/04/16 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="37.95" font-weight="700" fill="#2c3540"><tspan x="28" y="469.95">Reading maketh a full man;</tspan><tspan x="28" y="517.3875">conference a ready man; and</tspan><tspan x="28" y="564.825">writing an exact man.</tspan></text><text font-family="Arial, sans-serif" font-size="16.5" font-weight="400" fill="#2c3540"><tspan x="28" y="590.8125">Francis Bacon · Of Studies, Essays (1625 edition) · Published 1625</tspan></text><text x="28" y="636.1875" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="661.2674999999999">Reading builds knowledge, discussion develops</tspan><tspan x="28" y="690.1424999999999">readiness, and writing encourages precision.</tspan></text><text x="28" y="733.0425" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="758.1225">Read to learn, discuss to respond, and write to be precise;</tspan><tspan x="28" y="786.9975">Different forms of study develop different abilities</tspan></text><text x="28" y="829.8975" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="854.9775">We read the passage, discuss an interpretation, and write</tspan><tspan x="28" y="883.8525">a precise summary.</tspan></text><text x="28" y="926.7525" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="951.8325">Maketh means makes; conference here means</tspan><tspan x="28" y="980.7075">discussion. The historical use of man is retained in the</tspan><tspan x="28" y="1009.5825">quotation. These claims describe an educational ideal.</tspan></text><text x="28" y="1052.4825" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1077.5625">A: Which line caught your attention?</tspan><tspan x="28" y="1106.4375">B: “Reading maketh a full man; conference a ready man;</tspan><tspan x="28" y="1135.3125">and writing an exact man.”</tspan><tspan x="28" y="1164.1875">A: How does that connect with the example?</tspan><tspan x="28" y="1193.0625">B: Reading, discussion and writing contribute different,</tspan><tspan x="28" y="1221.9375">complementary skills.</tspan></text><text x="28" y="1264.8375" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1289.9175">Explain how the example illustrates the quoted idea. Which</tspan><tspan x="28" y="1318.7925">detail supports your explanation? (Model: Reading,</tspan><tspan x="28" y="1347.6675">discussion and writing contribute different, complementary</tspan><tspan x="28" y="1376.5425">skills.)</tspan></text></svg>