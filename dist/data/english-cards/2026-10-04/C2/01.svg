<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>polysemy</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/04 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Looking closely at words helps a reader distinguish meanings.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Looking closely at words helps a reader distinguish meanings.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">polysemy</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˈpɑliˌsimi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Usually uncountable: polysemy; no regular plural in this sense.</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">the existence of several related meanings for one</tspan><tspan x="28" y="653.9805000000001">word</tspan></text><text x="28" y="703.1205" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="731.8485000000001">multiple related senses; related meanings of one</tspan><tspan x="28" y="764.9235000000001">word</tspan></text><text x="28" y="814.0635" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="842.7915">The polysemy of “page” becomes clear when we</tspan><tspan x="28" y="875.8665000000001">compare a book and a website.</tspan></text><text x="28" y="925.0065" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="953.7345">Topic: A little time to read. Write one sentence using</tspan><tspan x="28" y="986.8095000000001">this word. Check that your sentence keeps the</tspan><tspan x="28" y="1019.8845">meaning shown above.</tspan></text><text x="28" y="1069.0244999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1097.7524999999998">A: What does “polysemy” mean?</tspan><tspan x="28" y="1130.8274999999999">B: It means the existence of several related</tspan><tspan x="28" y="1163.9025">meanings for one word.</tspan><tspan x="28" y="1196.9774999999997">A: Can we use it in a quiet reading corner?</tspan><tspan x="28" y="1230.0524999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1279.1924999999997" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1307.9204999999997">Compare your first answer with this question: Which</tspan><tspan x="28" y="1340.9954999999998">word means “the existence of several related</tspan><tspan x="28" y="1374.0704999999998">meanings for one word”: polysemy or hermeneutic?</tspan></text></svg>