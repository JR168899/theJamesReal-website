<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Reading maketh a full man; conference a ready man; and writing an exact man.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/04 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="39.330000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="471.33">Reading maketh a full man;</tspan><tspan x="28" y="520.4925">conference a ready man; and</tspan><tspan x="28" y="569.655">writing an exact man.</tspan></text><text font-family="Arial, sans-serif" font-size="17.1" font-weight="400" fill="#2c3540"><tspan x="28" y="596.5875">Francis Bacon · Of Studies, Essays (1625 edition) · Published 1625</tspan></text><text x="28" y="643.6124999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="669.6044999999999">Reading builds knowledge, discussion develops</tspan><tspan x="28" y="699.5294999999999">readiness, and writing encourages precision.</tspan></text><text x="28" y="743.9894999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="769.9814999999999">Read to learn, discuss to respond, and write to be</tspan><tspan x="28" y="799.9064999999998">precise; Different forms of study develop different</tspan><tspan x="28" y="829.8314999999999">abilities</tspan></text><text x="28" y="874.2914999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="900.2834999999999">We read the passage, discuss an interpretation, and</tspan><tspan x="28" y="930.2084999999998">write a precise summary.</tspan></text><text x="28" y="974.6684999999999" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1000.6605">Maketh means makes; conference here means</tspan><tspan x="28" y="1030.5855">discussion. The historical use of man is retained in the</tspan><tspan x="28" y="1060.5104999999999">quotation. These claims describe an educational ideal.</tspan></text><text x="28" y="1104.9705000000001" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1130.9625">A: What do you think of this line?</tspan><tspan x="28" y="1160.8875">B: It makes me think about our example.</tspan><tspan x="28" y="1190.8125">A: Which part?</tspan><tspan x="28" y="1220.7375000000002">B: We read the passage, discuss an interpretation, and</tspan><tspan x="28" y="1250.6625000000001">write a precise summary.</tspan></text><text x="28" y="1295.1225000000002" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1321.1145000000001">Which action in the example connects with the</tspan><tspan x="28" y="1351.0395">quotation? (Model: Reading, discussion and writing</tspan><tspan x="28" y="1380.9645">contribute different, complementary skills.)</tspan></text></svg>