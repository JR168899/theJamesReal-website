<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>tree</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/12/24 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations are part of this Christmas setting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations are part of this Christmas setting.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">tree</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /tri/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">Singular: tree; plural: trees.</tspan></text><text x="28" y="604.8900000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="635.8980000000001">a tall plant with a woody trunk and branches</tspan></text><text x="28" y="688.9380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="719.9460000000001">woody plant; large perennial plant</tspan></text><text x="28" y="772.9860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="803.9940000000001">We hang paper stars on the tree.</tspan></text><text x="28" y="857.0340000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="888.0420000000001">Topic: A Christmas celebration shaped by</tspan><tspan x="28" y="923.7420000000002">care. Write one sentence using this word.</tspan><tspan x="28" y="959.4420000000001">Check that your sentence keeps the meaning</tspan><tspan x="28" y="995.1420000000002">shown above.</tspan></text><text x="28" y="1048.182" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1079.19">A: What does “tree” mean?</tspan><tspan x="28" y="1114.89">B: It means a tall plant with a woody trunk and</tspan><tspan x="28" y="1150.5900000000001">branches.</tspan><tspan x="28" y="1186.29">A: Can we use it at a Christmas gathering?</tspan><tspan x="28" y="1221.99">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1275.03" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.038">Your example. Which word means “a tall plant</tspan><tspan x="28" y="1341.738">with a woody trunk and branches”: tree or gift?</tspan><tspan x="28" y="1377.438">(Model: tree)</tspan></text></svg>