<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>find out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/12/24 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Reference books help a reader discover information.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Reference books help a reader discover information.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="478.69">find something out</tspan><tspan x="28" y="537.0525">find out something</tspan></text><text x="28" y="600.49" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="631.346">learn a fact</tspan></text><text x="28" y="684.126" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="714.982">discover; learn</tspan></text><text x="28" y="767.762" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="798.6179999999999">Let us find out what we need as we prepare for</tspan><tspan x="28" y="834.1429999999999">Christmas.</tspan></text><text x="28" y="886.923" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="917.779">Keep the particle with the verb. Check a</tspan><tspan x="28" y="953.304">dictionary before changing its object or word</tspan><tspan x="28" y="988.829">order.</tspan></text><text x="28" y="1041.6090000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1072.4650000000001">A: How can we prepare a Christmas gathering?</tspan><tspan x="28" y="1107.9900000000002">B: Let us find out what we need.</tspan><tspan x="28" y="1143.515">A: That gives us a starting point.</tspan><tspan x="28" y="1179.0400000000002">B: Let us try it together.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1291.096">For Christmas, your example. Explain “find out”</tspan><tspan x="28" y="1326.621">in your own words, then use it in a sentence</tspan><tspan x="28" y="1362.146">about a christmas celebration shaped by care.</tspan></text></svg>