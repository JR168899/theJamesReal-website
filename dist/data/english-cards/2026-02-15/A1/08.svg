<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/02/15 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together outdoors.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">There is nothing in the world</tspan><tspan x="28" y="529.8075">so irresistibly contagious as</tspan><tspan x="28" y="584.145">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="18.900000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="613.9125">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="665.8875" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="694.6155000000001">A cheerful mood can spread from one person to</tspan><tspan x="28" y="727.6905000000002">others.</tspan></text><text x="28" y="776.8305" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="805.5585000000001">Laughter can spread through a group; Good spirits</tspan><tspan x="28" y="838.6335000000001">can influence the people nearby</tspan></text><text x="28" y="887.7735" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="916.5015000000001">One guest starts laughing at a gentle joke, and soon</tspan><tspan x="28" y="949.5765000000001">the whole table is smiling.</tspan></text><text x="28" y="998.7165" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1027.4445">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="1060.5195">spreading, rather than an infection. The original</tspan><tspan x="28" y="1093.5945000000002">spelling good-humour is retained.</tspan></text><text x="28" y="1142.7344999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1171.4624999999999">A: Why are they all laughing?</tspan><tspan x="28" y="1204.5375">B: One person told a funny story.</tspan><tspan x="28" y="1237.6125">A: Did the others join in?</tspan><tspan x="28" y="1270.6874999999998">B: Yes. The good mood spread.</tspan></text><text x="28" y="1319.8274999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1348.5555">Does contagious mean an illness in this sentence?</tspan></text></svg>