<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there a New Year custom that matters to your family?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/02/15 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Red envelopes appear in a festive New Year display.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Red envelopes appear in a festive New Year display.</tspan></text><a href="https://www.pexels.com/photo/vibrant-lunar-new-year-decorations-with-red-envelopes-35045708/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35045708</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#353331"><tspan x="28" y="470.41">Is there a New Year custom that</tspan><tspan x="28" y="518.4225">matters to your family?</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="595.994">An opening that invites a personal preference or</tspan><tspan x="28" y="625.219">experience without assuming everyone shares it.</tspan></text><text x="28" y="668.639" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="694.023">Is there a New Year custom that matters to your family?</tspan></text><text x="28" y="737.443" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="762.827">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="792.052">different preference or a declined invitation without asking</tspan><tspan x="28" y="821.277">the person to justify it.</tspan></text><text x="28" y="864.697" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="890.081">Sky: Will you be celebrating Lunar New Year with your</tspan><tspan x="28" y="919.306">family?</tspan><tspan x="28" y="948.5310000000001">Michael: Yes. We are meeting for a meal.</tspan><tspan x="28" y="977.7560000000001">Sky: Is there anything visitors should know?</tspan><tspan x="28" y="1006.981">Michael: It is best to ask the host; families do things</tspan><tspan x="28" y="1036.2060000000001">differently.</tspan><tspan x="28" y="1065.431">Sky: I would enjoy hearing about your own custom, if you</tspan><tspan x="28" y="1094.656">would like to share it.</tspan><tspan x="28" y="1123.881">Michael: My grandmother usually explains the dishes and</tspan><tspan x="28" y="1153.106">the stories behind them.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1282.7440000000001">You are invited to an unfamiliar celebration. Ask a</tspan><tspan x="28" y="1311.969">respectful practical question without assuming every family</tspan><tspan x="28" y="1341.1940000000002">follows the same custom. (Model: Is there anything your</tspan><tspan x="28" y="1370.419">family would like visitors to know before the meal?)</tspan></text></svg>