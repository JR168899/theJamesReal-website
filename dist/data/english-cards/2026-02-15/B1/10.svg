<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Lunar New Year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/02/15 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Red envelopes are part of a Lunar New Year greeting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Red envelopes are part of a Lunar New Year greeting.</tspan></text><a href="https://www.pexels.com/photo/vibrant-lunar-new-year-decorations-with-red-envelopes-35045708/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35045708</text></a></svg><text font-family="Arial, sans-serif" font-size="49.68000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.68">What would you like to</tspan><tspan x="28" y="543.78">do for Lunar New Year?</tspan></text><text x="28" y="611.28" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="644.112">An open question that invites a person to</tspan><tspan x="28" y="681.9119999999999">describe a familiar experience.</tspan></text><text x="28" y="738.072" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="770.904">What would you like to do for Lunar New</tspan><tspan x="28" y="808.704">Year?</tspan></text><text x="28" y="864.864" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="897.696">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="935.496">answer, then ask a related follow-up.</tspan></text><text x="28" y="991.6560000000001" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1024.488">A: What would you like to do for Lunar New</tspan><tspan x="28" y="1062.288">Year?</tspan><tspan x="28" y="1100.088">B: I would like to welcome the new year</tspan><tspan x="28" y="1137.8880000000001">together.</tspan><tspan x="28" y="1175.688">A: What should we prepare?</tspan><tspan x="28" y="1213.488">B: For example, we ask the host how their</tspan><tspan x="28" y="1251.288">family exchanges greetings.</tspan></text><text x="28" y="1307.448" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1340.2800000000002">Write a reply of your own, then ask one</tspan><tspan x="28" y="1378.0800000000002">related question.</tspan></text></svg>