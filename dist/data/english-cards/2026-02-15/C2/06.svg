<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a curate’s egg</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/02/15 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">a curate’s egg</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">something with both good and bad parts; chiefly</tspan><tspan x="28" y="608.5085">British</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="692.1445000000001">a mixed bag; partly successful</tspan></text><text x="28" y="744.9245000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="775.7805000000001">The elaborate arrangement was a curate’s egg.</tspan></text><text x="28" y="828.5605" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="859.4165">Chiefly British; partly good and partly bad. Its</tspan><tspan x="28" y="894.9415">historical irony can make it sound wry or mildly</tspan><tspan x="28" y="930.4665">critical.</tspan></text><text x="28" y="983.2465000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1014.1025000000001">Sarah: Was the exhibition worth visiting?</tspan><tspan x="28" y="1049.6275">Liam: It was a curate&#x27;s egg: excellent objects,</tspan><tspan x="28" y="1085.1525000000001">but confusing explanations.</tspan><tspan x="28" y="1120.6775">Sarah: Would you still recommend it?</tspan><tspan x="28" y="1156.2025">Liam: For the objects, yes, with that reservation.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1291.096">Assess a workshop with excellent</tspan><tspan x="28" y="1326.621">demonstrations but poor access information</tspan><tspan x="28" y="1362.146">using a curate&#x27;s egg.</tspan></text></svg>