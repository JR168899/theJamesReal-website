<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/02/15 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Red envelopes are part of a Lunar New Year greeting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Red envelopes are part of a Lunar New Year greeting.</tspan></text><a href="https://www.pexels.com/photo/vibrant-lunar-new-year-decorations-with-red-envelopes-35045708/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35045708</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="473.4">I would distinguish between</tspan><tspan x="28" y="525.15">the intention and its</tspan><tspan x="28" y="576.9">consequences.</tspan></text><text x="28" y="633.15" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="660.51">A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="692.01">from the effects of their action.</tspan></text><text x="28" y="738.81" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="766.1700000000001">I would separate the aim from the outcome.; We</tspan><tspan x="28" y="797.6700000000001">should assess purpose and effects independently.</tspan></text><text x="28" y="844.4699999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="871.8299999999999">A: How should we welcome the new year together?</tspan><tspan x="28" y="903.3299999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="934.8299999999999">consequences.</tspan></text><text x="28" y="981.63" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1008.99">Use this phrase in a friendly conversation. Listen to</tspan><tspan x="28" y="1040.49">the reply before asking your next question.</tspan></text><text x="28" y="1087.2900000000002" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1114.65">A: How would you express this idea?</tspan><tspan x="28" y="1146.15">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1177.65">consequences.</tspan><tspan x="28" y="1209.15">A: What does that mean here?</tspan><tspan x="28" y="1240.65">B: A proposal to evaluate a person’s purpose</tspan><tspan x="28" y="1272.15">separately from the effects of their action.</tspan></text><text x="28" y="1318.9500000000003" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1346.3100000000002">When might you say “I would distinguish between the</tspan><tspan x="28" y="1377.8100000000002">intention and its consequences.”?</tspan></text></svg>