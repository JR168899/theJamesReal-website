<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intergenerational</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/02/15 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>The meal creates space for intergenerational conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">The meal creates space for intergenerational conversation.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">intergenerational</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˌɪntɚˌdʒɛnəˈreɪʃənəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Adjective: intergenerational; related noun: generation</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">involving people from different generations</tspan></text><text x="28" y="680.1215" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="710.0655">between generations; cross-generational</tspan></text><text x="28" y="761.2855" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="791.2295">The meal creates space for intergenerational</tspan><tspan x="28" y="825.7045">conversation.</tspan></text><text x="28" y="876.9245" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8685">Topic: Welcoming the Lunar New Year. Write</tspan><tspan x="28" y="941.3435000000001">one sentence using this word. Check that your</tspan><tspan x="28" y="975.8185000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1027.0385" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1056.9824999999998">A: What does “intergenerational” mean?</tspan><tspan x="28" y="1091.4574999999998">B: It means involving people from different</tspan><tspan x="28" y="1125.9325">generations.</tspan><tspan x="28" y="1160.4074999999998">A: Can we use it at a Lunar New Year</tspan><tspan x="28" y="1194.8825">gathering?</tspan><tspan x="28" y="1229.3574999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Which word means “involving people from</tspan><tspan x="28" y="1344.9965">different generations”: intergenerational or</tspan><tspan x="28" y="1379.4715">continuity? (Model: intergenerational)</tspan></text></svg>