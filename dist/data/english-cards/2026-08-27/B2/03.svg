<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>follow through</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/08/27 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">follow through</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="583.633">complete what you have agreed to do</tspan></text><text x="28" y="640.5730000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="673.8610000000001">carry out a commitment; see it through</tspan></text><text x="28" y="730.8010000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="764.0890000000002">A good plan matters only if we follow</tspan><tspan x="28" y="802.4140000000002">through.</tspan></text><text x="28" y="859.3540000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="892.6420000000002">Keep the particle with the verb. Check a</tspan><tspan x="28" y="930.9670000000002">dictionary before changing its object or</tspan><tspan x="28" y="969.2920000000001">word order.</tspan></text><text x="28" y="1026.2320000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1059.5200000000002">A: How can we care for a plant?</tspan><tspan x="28" y="1097.8450000000003">B: A good plan matters only if we follow</tspan><tspan x="28" y="1136.1700000000003">through.</tspan><tspan x="28" y="1174.4950000000003">A: That gives us a starting point.</tspan><tspan x="28" y="1212.8200000000002">B: Let us try it together.</tspan></text><text x="28" y="1269.7600000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1303.0480000000002">Explain “follow through” in your own words,</tspan><tspan x="28" y="1341.3730000000003">then use it in a sentence about growing</tspan><tspan x="28" y="1379.6980000000003">something small.</tspan></text></svg>