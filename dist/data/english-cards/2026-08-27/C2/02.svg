<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>phenology</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/08/27 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Seasonal changes can be observed in the leaves of a tree.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Seasonal changes can be observed in the leaves of a tree.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">phenology</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /fəˈnɑlədʒi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">Usually uncountable: phenology; no regular plural in this</tspan><tspan x="28" y="571.7974999999999">sense.</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">the study of seasonal events in living things</tspan></text><text x="28" y="709.3463" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="739.5943000000001">study of seasonal biological timing</tspan></text><text x="28" y="791.3343000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="821.5823000000001">Phenology records when plants flower and</tspan><tspan x="28" y="856.4073000000002">birds migrate.</tspan></text><text x="28" y="908.1473000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953000000001">Topic: Growing something small. Write one</tspan><tspan x="28" y="973.2203000000002">sentence using this word. Check that your</tspan><tspan x="28" y="1008.0453000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1059.7853000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0333">A: What does “phenology” mean?</tspan><tspan x="28" y="1124.8583">B: It means the study of seasonal events in</tspan><tspan x="28" y="1159.6833000000001">living things.</tspan><tspan x="28" y="1194.5083">A: Can we use it in a small garden?</tspan><tspan x="28" y="1229.3333">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1281.0733000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1311.3213">Which word means “the study of seasonal</tspan><tspan x="28" y="1346.1463">events in living things”: phenology or</tspan><tspan x="28" y="1380.9713000000002">symbiosis?</tspan></text></svg>