<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>equanimity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/02/23 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader takes a quiet moment at home.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader takes a quiet moment at home.</tspan></text><a href="https://www.pexels.com/photo/woman-sitting-and-reading-book-5698385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5698385</text></a></svg><text font-family="Arial, sans-serif" font-size="49.220000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="481.22">equanimity</tspan></text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="523.485">US /ˌikwəˈnɪməti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.540000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="553.6161999999999">Usually uncountable: equanimity; no regular plural in this</tspan><tspan x="28" y="582.3349999999999">sense.</tspan></text><text x="28" y="642.0838" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="674.6118">calmness and balance in a difficult situation</tspan></text><text x="28" y="730.2518" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="762.7798">composure; evenness of temper</tspan></text><text x="28" y="818.4198" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="850.9478">She met the change of plan with equanimity.</tspan></text><text x="28" y="906.5878" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="939.1158">Composure during difficulty does not mean</tspan><tspan x="28" y="976.5658000000001">indifference to the outcome.</tspan></text><text x="28" y="1032.2058" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1064.7338000000002">A: She received the cancellation with</tspan><tspan x="28" y="1102.1838000000002">surprising equanimity.</tspan><tspan x="28" y="1139.6338000000003">B: Was she indifferent to it?</tspan><tspan x="28" y="1177.0838">A: No. She was disappointed, but remained</tspan><tspan x="28" y="1214.5338000000002">composed enough to discuss alternatives.</tspan><tspan x="28" y="1251.9838000000002">B: That is different from not caring.</tspan></text><text x="28" y="1307.6237999999998" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.1518">Distinguish equanimity from indifference</tspan><tspan x="28" y="1377.6018000000001">when a valued plan fails.</tspan></text></svg>