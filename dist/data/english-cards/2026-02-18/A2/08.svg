<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If music be the food of love, play on;</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/02/18 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Musicians work together on a piece of music.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Musicians work together on a piece of music.</tspan></text><a href="https://www.pexels.com/photo/couple-playing-music-in-living-room-3978313/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3978313</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">If music be the food of love,</tspan><tspan x="28" y="529.8075">play on;</tspan></text><text font-family="Arial, sans-serif" font-size="18.900000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="559.5749999999999">William Shakespeare · Twelfth Night, Act I, Scene 1 (First Folio) ·</tspan><tspan x="28" y="582.6329999999999">Published 1623</tspan></text><text x="28" y="634.23" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="662.9580000000001">The speaker imagines music as something that feeds</tspan><tspan x="28" y="696.0330000000001">or sustains a feeling of love.</tspan></text><text x="28" y="745.173" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="773.9010000000001">Music can nourish emotion; Sound is compared to</tspan><tspan x="28" y="806.9760000000001">emotional nourishment</tspan></text><text x="28" y="856.116" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="884.844">The melody changes the mood in the room, and we</tspan><tspan x="28" y="917.9190000000001">listen to the next phrase.</tspan></text><text x="28" y="967.059" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="995.787">Orsino speaks this line. Be is an older subjunctive</tspan><tspan x="28" y="1028.862">form here. Food of love is a metaphor, and the</tspan><tspan x="28" y="1061.9370000000001">speech goes on to complicate the speaker’s desire.</tspan></text><text x="28" y="1111.0769999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1139.8049999999998">A: Is music really food?</tspan><tspan x="28" y="1172.8799999999999">B: No. The speaker is making a comparison.</tspan><tspan x="28" y="1205.955">A: What can music give someone?</tspan><tspan x="28" y="1239.0299999999997">B: A feeling, rather than a meal.</tspan></text><text x="28" y="1288.1699999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1316.898">Does food name something to eat in this quotation?</tspan></text></svg>