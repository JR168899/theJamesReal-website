<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>mother</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/05/07 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="48.760000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="480.76">mother</tspan></text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="522.63">US /ˈmʌðɚ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.32" font-weight="400" fill="#382d2e"><tspan x="28" y="552.4796">Singular: mother; plural: mothers.</tspan></text><text x="28" y="611.67" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="643.8939999999999">a female parent</tspan></text><text x="28" y="699.0139999999999" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="731.2379999999998">mom; female parent</tspan></text><text x="28" y="786.358" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="818.5819999999999">My mother reads with me after lunch.</tspan></text><text x="28" y="873.702" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="905.9259999999999">Topic: A practical way to say thank you.</tspan><tspan x="28" y="943.026">Write one sentence using this word. Check</tspan><tspan x="28" y="980.126">that your sentence keeps the meaning</tspan><tspan x="28" y="1017.2259999999999">shown above.</tspan></text><text x="28" y="1072.346" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1104.57">A: What does “mother” mean?</tspan><tspan x="28" y="1141.6699999999998">B: It means a female parent.</tspan><tspan x="28" y="1178.77">A: Can we use it when thanking someone</tspan><tspan x="28" y="1215.87">who cares for us?</tspan><tspan x="28" y="1252.97">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1308.09" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.3139999999999">Which word means “a female parent”:</tspan><tspan x="28" y="1377.4139999999998">mother or thank?</tspan></text></svg>