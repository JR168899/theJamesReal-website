<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/07 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2d382e"><tspan x="28" y="472.02">I would distinguish between the</tspan><tspan x="28" y="522.045">intention and its consequences.</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="602.868">A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="633.3180000000001">from the effects of their action.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="705.0060000000001">I would separate the aim from the outcome.; We should</tspan><tspan x="28" y="735.4560000000001">assess purpose and effects independently.</tspan></text><text x="28" y="780.696" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="807.1440000000001">A: How should we show appreciation through an action?</tspan><tspan x="28" y="837.5940000000002">B: I would distinguish between the intention and its</tspan><tspan x="28" y="868.0440000000001">consequences.</tspan></text><text x="28" y="913.284" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="939.7320000000001">Use this phrase in a friendly conversation. Listen to the</tspan><tspan x="28" y="970.1820000000001">reply before asking your next question.</tspan></text><text x="28" y="1015.422" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1041.8700000000001">A: How would you express this idea?</tspan><tspan x="28" y="1072.3200000000002">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1102.7700000000002">consequences.</tspan><tspan x="28" y="1133.22">A: What does that mean here?</tspan><tspan x="28" y="1163.67">B: A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="1194.1200000000001">from the effects of their action.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1284.368">When might you say “I would distinguish between the</tspan><tspan x="28" y="1314.818">intention and its consequences.”? (Model: You could say</tspan><tspan x="28" y="1345.268">it when thanking someone who cares for us, when you</tspan><tspan x="28" y="1375.7179999999998">want to ask for help or make your understanding clear.)</tspan></text></svg>