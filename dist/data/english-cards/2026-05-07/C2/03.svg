<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/05/07 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="477.54">bear something out</tspan><tspan x="28" y="534.465">bear out something</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="626.436">support or confirm a claim</tspan></text><text x="28" y="677.916" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="708.0120000000001">corroborate; substantiate</tspan></text><text x="28" y="759.4920000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="789.5880000000001">The experience did not bear out our initial</tspan><tspan x="28" y="824.238">assumption.</tspan></text><text x="28" y="875.7180000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="905.8140000000001">Keep the particle with the verb. Check a</tspan><tspan x="28" y="940.464">dictionary before changing its object or word</tspan><tspan x="28" y="975.114">order.</tspan></text><text x="28" y="1026.594" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1056.69">A: How can we show appreciation through an</tspan><tspan x="28" y="1091.3400000000001">action?</tspan><tspan x="28" y="1125.99">B: The experience did not bear out our initial</tspan><tspan x="28" y="1160.64">assumption.</tspan><tspan x="28" y="1195.29">A: That gives us a starting point.</tspan><tspan x="28" y="1229.94">B: Let us try it together.</tspan></text><text x="28" y="1281.42" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1311.516">For Mother’s Day, explain “bear out” in your</tspan><tspan x="28" y="1346.1660000000002">own words, then use it in a sentence about a</tspan><tspan x="28" y="1380.816">practical way to say thank you.</tspan></text></svg>