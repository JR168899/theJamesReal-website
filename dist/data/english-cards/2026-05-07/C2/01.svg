<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>reciprocity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/07 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People contribute to an experience they enjoy together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People contribute to an experience they enjoy together.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">reciprocity</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /ˌrɛsəˈprɑsəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">Usually uncountable: reciprocity; no regular plural in this</tspan><tspan x="28" y="566.88">sense.</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">the practice of responding to another person’s</tspan><tspan x="28" y="683.2704">action with a similar action</tspan></text><text x="28" y="733.1904000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="762.3744">mutual exchange; give-and-take</tspan></text><text x="28" y="812.2944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="841.4784000000001">Sharing the work creates a sense of reciprocity.</tspan></text><text x="28" y="891.3984000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="920.5824000000001">Topic: A practical way to say thank you. Write</tspan><tspan x="28" y="954.1824000000001">one sentence using this word. Check that your</tspan><tspan x="28" y="987.7824000000002">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1037.7024000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1066.8864000000003">A: What does “reciprocity” mean?</tspan><tspan x="28" y="1100.4864000000002">B: It means the practice of responding to another</tspan><tspan x="28" y="1134.0864000000004">person’s action with a similar action.</tspan><tspan x="28" y="1167.6864000000003">A: Can we use it when thanking someone who</tspan><tspan x="28" y="1201.2864000000004">cares for us?</tspan><tspan x="28" y="1234.8864000000003">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1284.8064000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1313.9904000000004">Which word means “the practice of responding to</tspan><tspan x="28" y="1347.5904000000003">another person’s action with a similar action”:</tspan><tspan x="28" y="1381.1904000000004">reciprocity or interdependence?</tspan></text></svg>