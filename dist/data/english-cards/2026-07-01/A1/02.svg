<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>parade</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/07/01 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Flags are carried in a public parade.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Flags are carried in a public parade.</tspan></text><a href="https://www.pexels.com/photo/people-horseback-riding-holding-american-flags-during-a-parade-12711524/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12711524</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">parade</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /pəˈreɪd/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Singular: parade; plural: parades.</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">a public procession, often held as part of a</tspan><tspan x="28" y="663.3765000000001">celebration</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">procession; march</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">We watch the parade from the sidewalk.</tspan></text><text x="28" y="876.9245" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8685">Topic: Sharing a public celebration. Write one</tspan><tspan x="28" y="941.3435000000001">sentence using this word. Check that your</tspan><tspan x="28" y="975.8185000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1027.0385" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1056.9824999999998">A: What does “parade” mean?</tspan><tspan x="28" y="1091.4574999999998">B: It means a public procession, often held as</tspan><tspan x="28" y="1125.9325">part of a celebration.</tspan><tspan x="28" y="1160.4074999999998">A: Can we use it at a neighborhood</tspan><tspan x="28" y="1194.8825">celebration?</tspan><tspan x="28" y="1229.3574999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Read, then answer. Which word means “a</tspan><tspan x="28" y="1344.9965">public procession, often held as part of a</tspan><tspan x="28" y="1379.4715">celebration”: parade or flag?</tspan></text></svg>