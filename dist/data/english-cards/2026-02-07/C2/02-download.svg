<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>frugality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/02/07 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a budget and checks available money.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a budget and checks available money.</tspan></text><a href="https://www.pexels.com/photo/a-person-writing-on-notebook-using-a-pen-6328972/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6328972</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">frugality</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /fruˈɡæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Usually uncountable: frugality; no regular plural in this sense.</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">careful use of money or resources without</tspan><tspan x="28" y="641.0609999999999">unnecessary waste</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">thrift; economy</tspan></text><text x="28" y="760.677" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="787.733">Frugality means using resources carefully rather than</tspan><tspan x="28" y="818.8829999999999">wasting them.</tspan></text><text x="28" y="865.163" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="892.2189999999999">Keep the sense and countability shown in the</tspan><tspan x="28" y="923.3689999999999">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="954.519">the specific person, object or event being discussed.</tspan></text><text x="28" y="1000.799" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1027.855">Sarah: Why repair the coat when a new one is</tspan><tspan x="28" y="1059.005">affordable?</tspan><tspan x="28" y="1090.155">Liam: Frugality is not the same as buying the</tspan><tspan x="28" y="1121.305">cheapest replacement.</tspan><tspan x="28" y="1152.455">Sarah: What matters to you?</tspan><tspan x="28" y="1183.605">Liam: Using what still works and avoiding an</tspan><tspan x="28" y="1214.755">unnecessary purchase.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Distinguish frugality from simply choosing the lowest</tspan><tspan x="28" y="1319.2410000000002">sticker price. (Model: Frugality uses resources</tspan><tspan x="28" y="1350.391">carefully and may favor repair or a durable item over</tspan><tspan x="28" y="1381.5410000000002">repeated cheap purchases.)</tspan></text></svg>