t-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">something very easy; informal</tspan></text><text x="35" y="590.8" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">The first step was a piece of cake.</tspan></text><text x="35" y="667.1999999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Learn the whole expression. It is figurative language, so</tspan><tspan x="35" dy="24.839999999999996">a word-for-word interpretation may be misleading.</tspan></text><text x="35" y="768.4399999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="792.9999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Tell a friend. What does “a piece of cake” mean in this</tspan><tspan x="35" dy="24.839999999999996">example? The first step was a piece of cake.</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   06 OF 11</tspan></text></svg>