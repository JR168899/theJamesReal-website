<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Looking back and looking ahead</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/12/26 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/notebook-next-to-a-calendar-20657557/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 20657557</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Looking back and looking ahead</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="159.0">When we make a realistic plan, a little care can make the experience better. Planning and thinking</tspan><tspan x="42" y="184.74">about other people both help.</tspan></text><text x="42" y="216.48" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="243.48">First, reviewing a specific experience teaches more than a vague judgement. For example, we describe</tspan><tspan x="42" y="269.21999999999997">one habit that helped us instead of calling the whole year good or bad. This is a small thing that makes</tspan><tspan x="42" y="294.96">the day easier.</tspan></text><text x="42" y="326.7" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="353.7">Second, a small next step is easier to act on than a broad promise. For example, we choose a</tspan><tspan x="42" y="379.44">ten-minute practice session and put it on the calendar. We do not need a perfect day to do this well.</tspan></text><text x="42" y="411.17999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="438.17999999999995">We can make a realistic plan more easily when we prepare and notice other people. These simple steps</tspan><tspan x="42" y="463.91999999999996">give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="513.66">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="535.62">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="557.5799999999999">argument rather than introduce a new proposal.</tspan><tspan x="42" y="579.54">Explain two ways to make a realistic plan. Which do you like better? Use four short paragraphs: introduction, two developed</tspan><tspan x="42" y="601.5">points, and conclusion.</tspan></text></svg>