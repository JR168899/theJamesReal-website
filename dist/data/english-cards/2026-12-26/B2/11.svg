<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Looking back and looking ahead</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-12-26</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Looking back and looking ahead</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Looking back and looking ahead</title><desc>Original hand-drawn story illustration: magnifier, set within year. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-1) scale(1.4)"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><g transform="translate(94 266) rotate(1) scale(0.52)"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Looking back and looking ahead</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A good way to make a realistic</tspan><tspan x="36" dy="23.459999999999997">plan combines practical structure</tspan><tspan x="36" dy="23.459999999999997">with an awareness of other</tspan><tspan x="36" dy="23.459999999999997">people. Neither a rigid plan nor</tspan><tspan x="36" dy="23.459999999999997">complete improvisation is</tspan><tspan x="36" dy="23.459999999999997">sufficient on its own; both need</tspan><tspan x="36" dy="23.459999999999997">to be judged in context.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="384" dy="0">The practical case is straightforward:</tspan><tspan x="384" dy="20.7">reviewing a specific experience</tspan><tspan x="384" dy="20.7">teaches more than a vague judgement.</tspan><tspan x="384" dy="20.7">Consider how we describe one habit</tspan><tspan x="384" dy="20.7">that helped us instead of calling the</tspan><tspan x="384" dy="20.7">whole year good or bad. The benefit is</tspan><tspan x="384" dy="20.7">not merely efficiency. A modest</tspan><tspan x="384" dy="20.7">arrangement prevents avoidable</tspan><tspan x="384" dy="20.7">confusion, leaving attention available</tspan><tspan x="384" dy="20.7">for the activity itself rather than</tspan><tspan x="384" dy="20.7">for problems that could have been</tspan><tspan x="384" dy="20.7">anticipated.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Consideration adds a second,</tspan><tspan x="732" dy="23.459999999999997">equally important dimension: a</tspan><tspan x="732" dy="23.459999999999997">small next step is easier to act</tspan><tspan x="732" dy="23.459999999999997">on than a broad promise. In this</tspan><tspan x="732" dy="23.459999999999997">situation, we choose a ten-minute</tspan><tspan x="732" dy="23.459999999999997">practice session and put it on</tspan><tspan x="732" dy="23.459999999999997">the calendar. A decision can be</tspan><tspan x="732" dy="23.459999999999997">convenient for one person while</tspan><tspan x="732" dy="23.459999999999997">creating difficulty for another,</tspan><tspan x="732" dy="23.459999999999997">so its value depends partly on</tspan><tspan x="732" dy="23.459999999999997">whose needs it recognises.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">The most useful approach therefore</tspan><tspan x="1080" dy="22.08">brings structure and consideration</tspan><tspan x="1080" dy="22.08">together. Preparation establishes a</tspan><tspan x="1080" dy="22.08">workable starting point; attention</tspan><tspan x="1080" dy="22.08">to other people keeps it</tspan><tspan x="1080" dy="22.08">responsive. Success should be</tspan><tspan x="1080" dy="22.08">assessed by how well the</tspan><tspan x="1080" dy="22.08">arrangement serves the experience,</tspan><tspan x="1080" dy="22.08">rather than by how closely events</tspan><tspan x="1080" dy="22.08">follow the original plan.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Explain your reasoning to a partner. What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>