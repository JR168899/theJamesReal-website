<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>decorate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/04/05 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations are part of this Christmas setting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations are part of this Christmas setting.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">decorate</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˈdɛkəˌreɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">decorate · decorates · decorated · decorated · decorating</tspan><tspan x="28" y="564.7724999999999">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">to add things that make a place or object look more</tspan><tspan x="28" y="679.3443000000002">attractive or festive</tspan></text><text x="28" y="728.4843000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="757.2123000000001">adorn; embellish</tspan></text><text x="28" y="806.3523000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="835.0803000000002">We decorate the room before our guests arrive.</tspan></text><text x="28" y="884.2203000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="912.9483000000001">Topic: An Easter gathering with room for everyone.</tspan><tspan x="28" y="946.0233000000002">Write one sentence using this word. Check that your</tspan><tspan x="28" y="979.0983000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1028.2383" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1056.9663">A: What does “decorate” mean?</tspan><tspan x="28" y="1090.0413">B: It means to add things that make a place or object</tspan><tspan x="28" y="1123.1163000000001">look more attractive or festive.</tspan><tspan x="28" y="1156.1913">A: Can we use it at an Easter gathering?</tspan><tspan x="28" y="1189.2663">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Try without help. Which word means “to add things</tspan><tspan x="28" y="1320.923">that make a place or object look more attractive or</tspan><tspan x="28" y="1353.998">festive”: decorate or hunt? (Model: decorate)</tspan></text></svg>