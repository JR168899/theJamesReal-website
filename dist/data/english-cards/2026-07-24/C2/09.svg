<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Concessive fronting</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C2 - 2026/07/24 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A useful plan can still leave circumstances unanticipated.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A useful plan can still leave circumstances unanticipated.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382f40"><tspan x="28" y="478.69">Concessive fronting</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="572.9835">An adjective can precede as + subject + verb to</tspan><tspan x="28" y="608.5085">concede a point in formal writing.</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="692.1445000000001">Useful as the plan was, it could not anticipate</tspan><tspan x="28" y="727.6695000000001">every circumstance.</tspan></text><text x="28" y="780.4495000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="811.3055000000002">Read the example together with the rule. Notice</tspan><tspan x="28" y="846.8305000000001">the verb form and keep the same pattern in</tspan><tspan x="28" y="882.3555000000001">your own sentence.</tspan></text><text x="28" y="935.1355000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="965.9915000000002">A: Could you give me an example?</tspan><tspan x="28" y="1001.5165000000002">B: Useful as the plan was, it could not</tspan><tspan x="28" y="1037.0415000000003">anticipate every circumstance.</tspan><tspan x="28" y="1072.5665000000001">A: Which pattern does that use?</tspan><tspan x="28" y="1108.0915000000002">B: An adjective can precede as + subject + verb</tspan><tspan x="28" y="1143.6165000000003">to concede a point in formal writing.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="1291.096">Explain the meaning before looking at the</tspan><tspan x="28" y="1326.621">model answer. Rewrite with concessive fronting:</tspan><tspan x="28" y="1362.146">Although the plan was useful, it had limits.</tspan></text></svg>