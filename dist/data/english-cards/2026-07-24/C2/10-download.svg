<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you decide what is worth buying?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/07/24 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shopper chooses produce at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shopper chooses produce at a market.</tspan></text><a href="https://www.pexels.com/photo/woman-buying-fruits-in-a-supermarket-9475666/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 9475666</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">How do you decide what is</tspan><tspan x="28" y="529.8075">worth buying?</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="617.5980000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="650.6730000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="728.541">How do you decide what is worth buying?</tspan></text><text x="28" y="777.6809999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="806.409">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="839.484">different preference or a declined invitation without</tspan><tspan x="28" y="872.559">asking the person to justify it.</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="950.427">Sarah: Do you make a list before shopping?</tspan><tspan x="28" y="983.5020000000001">Liam: A short one. Otherwise I buy things I already</tspan><tspan x="28" y="1016.577">have.</tspan><tspan x="28" y="1049.652">Sarah: Do you stick to it exactly?</tspan><tspan x="28" y="1082.727">Liam: Not if I find something useful at a good price.</tspan><tspan x="28" y="1115.8020000000001">Sarah: How do you decide whether it is useful?</tspan><tspan x="28" y="1148.877">Liam: I ask where I would use it, rather than just</tspan><tspan x="28" y="1181.952">noticing the discount.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1287.848">Someone says they bought an item because it was</tspan><tspan x="28" y="1320.923">discounted. Ask a friendly question about its actual</tspan><tspan x="28" y="1353.998">use. (Model: What are you planning to use it for?)</tspan></text></svg>