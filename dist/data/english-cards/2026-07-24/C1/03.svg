<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/07/24 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="477.54">factor something in</tspan><tspan x="28" y="534.465">factor in something</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="626.436">include something when making a judgement</tspan></text><text x="28" y="677.916" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="708.0120000000001">allow for; take into account</tspan></text><text x="28" y="759.4920000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="789.5880000000001">We factor in the time other people need.</tspan></text><text x="28" y="841.0680000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="871.1640000000001">Separable: factor the delay in / factor in the</tspan><tspan x="28" y="905.8140000000001">delay; factor it in. Include a relevant time, cost</tspan><tspan x="28" y="940.4640000000002">or condition in a calculation.</tspan></text><text x="28" y="991.9440000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1022.0400000000001">Kore: Leaving at seven twenty should be fine.</tspan><tspan x="28" y="1056.69">Onyx: Have you factored in the fifteen-minute</tspan><tspan x="28" y="1091.3400000000001">walk?</tspan><tspan x="28" y="1125.99">Kore: I had not. There is a ten-minute queue as</tspan><tspan x="28" y="1160.64">well.</tspan><tspan x="28" y="1195.2900000000002">Onyx: Then we should work backward from the</tspan><tspan x="28" y="1229.94">seven-thirty start.</tspan></text><text x="28" y="1281.4199999999998" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1311.5159999999998">A walk starts at 7:30. Allow fifteen minutes to</tspan><tspan x="28" y="1346.166">get there and ten minutes to enter. Give the</tspan><tspan x="28" y="1380.8159999999998">latest departure time and explain.</tspan></text></svg>