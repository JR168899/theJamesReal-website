<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>value</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/07/24 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Looking at alternatives helps people make a considered choice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Looking at alternatives helps people make a considered choice.</tspan></text><a href="https://www.pexels.com/photo/colleagues-using-a-laptop-7212946/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7212946</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="473.86">value</tspan></text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="509.805">US /ˈvælju/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.020000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="535.4306">Singular: value; plural: values.</tspan></text><text x="28" y="586.2450000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="613.9090000000001">the usefulness or benefit of something in relation to</tspan><tspan x="28" y="645.7590000000001">its cost</tspan></text><text x="28" y="693.0790000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="720.7430000000002">worth; usefulness</tspan></text><text x="28" y="768.0630000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="795.7270000000002">We consider the value of something before buying it.</tspan></text><text x="28" y="843.0470000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="870.7110000000002">Topic: Choosing with care. Write one sentence using</tspan><tspan x="28" y="902.5610000000003">this word. Check that your sentence keeps the</tspan><tspan x="28" y="934.4110000000003">meaning shown above.</tspan></text><text x="28" y="981.7310000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1009.3950000000003">A: What does “value” mean?</tspan><tspan x="28" y="1041.2450000000003">B: It means the usefulness or benefit of something in</tspan><tspan x="28" y="1073.0950000000003">relation to its cost.</tspan><tspan x="28" y="1104.9450000000004">A: Can we use it at a neighbourhood market?</tspan><tspan x="28" y="1136.7950000000003">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1286.224">Explain the meaning before looking at the model</tspan><tspan x="28" y="1318.0739999999998">answer. Which word means “the usefulness or benefit</tspan><tspan x="28" y="1349.924">of something in relation to its cost”: value or durable?</tspan></text></svg>