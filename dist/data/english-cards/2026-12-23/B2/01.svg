x="28" y="662.2020000000001">community or situation</tspan></text><text x="28" y="713.162" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="742.9540000000002">tradition; customary practice</tspan></text><text x="28" y="793.9140000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="823.7060000000002">Our neighbors explained their holiday custom.</tspan></text><text x="28" y="874.666" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="904.4580000000002">Topic: A Christmas celebration shaped by care.</tspan><tspan x="28" y="938.7580000000002">Write one sentence using this word. Check that</tspan><tspan x="28" y="973.0580000000002">your sentence keeps the meaning shown above.</tspan></text><text x="28" y="1024.018" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1053.8100000000002">A: What does “custom” mean?</tspan><tspan x="28" y="1088.1100000000001">B: It means a usual way of behaving in a</tspan><tspan x="28" y="1122.41">particular community or situation.</tspan><tspan x="28" y="1156.7100000000003">A: Can we use it at a Christmas gathering?</tspan><tspan x="28" y="1191.0100000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Explain your reasoning to a partner. Which word</tspan><tspan x="28" y="1323.772">means “a usual way of behaving in a particular</tspan><tspan x="28" y="1358.072">community or situation”: custom or charitable?</tspan></text></svg>