<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>communal</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/12/23 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People share an activity together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People share an activity together.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">communal</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /kəˈmjunəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">Adjective: communal; related noun: community</tspan></text><text x="28" y="604.0425" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="634.8985">shared or used by a group of people</tspan></text><text x="28" y="687.6785" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="718.5345">shared; collective</tspan></text><text x="28" y="771.3145" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="802.1705">The communal meal brings neighbors together.</tspan></text><text x="28" y="854.9504999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="885.8064999999999">Topic: A Christmas celebration shaped by care.</tspan><tspan x="28" y="921.3314999999999">Write one sentence using this word. Check that</tspan><tspan x="28" y="956.8564999999999">your sentence keeps the meaning shown</tspan><tspan x="28" y="992.3815">above.</tspan></text><text x="28" y="1045.1615" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1076.0175">A: What does “communal” mean?</tspan><tspan x="28" y="1111.5425">B: It means shared or used by a group of</tspan><tspan x="28" y="1147.0674999999999">people.</tspan><tspan x="28" y="1182.5925">A: Can we use it at a Christmas gathering?</tspan><tspan x="28" y="1218.1174999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1270.8975" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1301.7535">Explain your reasoning to a partner. Which</tspan><tspan x="28" y="1337.2785000000001">word means “shared or used by a group of</tspan><tspan x="28" y="1372.8035">people”: communal or reciprocity?</tspan></text></svg>