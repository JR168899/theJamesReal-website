rif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="781.4205000000001">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="813.0955">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="860.1555" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="887.6675">A: How would you express this idea?</tspan><tspan x="28" y="919.3425">B: get the ball rolling</tspan><tspan x="28" y="951.0175">A: What does that mean here?</tspan><tspan x="28" y="982.6925">B: start an activity</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Explain the meaning before looking at the model</tspan><tspan x="28" y="1317.667">answer. What does “get the ball rolling” mean in this</tspan><tspan x="28" y="1349.3419999999999">example? One question can get the ball rolling.</tspan><tspan x="28" y="1381.017">(Model: Start an activity.)</tspan></text></svg>