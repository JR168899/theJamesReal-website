<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I will honour Christmas in my heart, and try to keep it all the year.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/12/23 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="472.48">I will honour Christmas in my</tspan><tspan x="28" y="523.08">heart, and try to keep it all the</tspan><tspan x="28" y="573.6800000000001">year.</tspan></text><text font-family="Arial, sans-serif" font-size="17.6" font-weight="400" fill="#2c3540"><tspan x="28" y="601.4">Charles Dickens · A Christmas Carol, Stave Four · Published 1843</tspan></text><text x="28" y="649.8" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="676.5519999999999">The speaker promises to carry the spirit of a</tspan><tspan x="28" y="707.3519999999999">celebration into ordinary life.</tspan></text><text x="28" y="753.112" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="779.8639999999999">Keep practicing generosity beyond the holiday; Let an</tspan><tspan x="28" y="810.6639999999999">occasion influence everyday conduct</tspan></text><text x="28" y="856.424" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="883.1759999999999">After the gathering, we continue checking whether our</tspan><tspan x="28" y="913.9759999999999">neighbor needs help.</tspan></text><text x="28" y="959.736" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="986.4879999999999">Scrooge speaks this line after confronting the</tspan><tspan x="28" y="1017.2879999999999">consequences of his conduct. The quotation</tspan><tspan x="28" y="1048.088">expresses his resolution; it is not a statement that</tspan><tspan x="28" y="1078.888">everyone celebrates the holiday.</tspan></text><text x="28" y="1124.648" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1151.4">A: Does the promise end after Christmas?</tspan><tspan x="28" y="1182.2">B: No. He wants to keep it all year.</tspan><tspan x="28" y="1213.0">A: How could he show that?</tspan><tspan x="28" y="1243.8000000000002">B: By continuing to be kind to people.</tspan></text><text x="28" y="1289.56" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1316.3120000000001">Give one example of kindness after a holiday is over.</tspan><tspan x="28" y="1347.112">(Model: Help someone with a practical task during an</tspan><tspan x="28" y="1377.912">ordinary week.)</tspan></text></svg>