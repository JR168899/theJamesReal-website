<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>It is raining. Shall we stay here?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A2 - 2026/02/21 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cup of tea offers a simple refreshment.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cup of tea offers a simple refreshment.</tspan></text><a href="https://www.pexels.com/photo/cup-of-tea-on-a-table-16921454/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16921454</text></a></svg><text font-family="Arial, sans-serif" font-size="49.68000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.68">It is raining. Shall we</tspan><tspan x="28" y="543.78">stay here?</tspan></text><text x="28" y="611.28" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="644.112">An opening that invites a personal</tspan><tspan x="28" y="681.9119999999999">preference or experience without assuming</tspan><tspan x="28" y="719.712">everyone shares it.</tspan></text><text x="28" y="775.872" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="808.704">It is raining. Shall we stay here?</tspan></text><text x="28" y="864.8639999999999" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="897.6959999999999">Follow the answer with a related question.</tspan><tspan x="28" y="935.4959999999999">Accept a different preference or a declined</tspan><tspan x="28" y="973.2959999999999">invitation without asking the person to justify</tspan><tspan x="28" y="1011.0959999999999">it.</tspan></text><text x="28" y="1067.2559999999999" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1100.088">A: It is raining. Shall we stay here?</tspan><tspan x="28" y="1137.888">B: Yes. We can read.</tspan><tspan x="28" y="1175.6879999999999">A: Would you like some tea?</tspan><tspan x="28" y="1213.488">B: That would be nice.</tspan></text><text x="28" y="1269.648" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1302.48">It is raining. Invite a friend to have tea</tspan><tspan x="28" y="1340.28">indoors. (Model: Would you like to come in</tspan><tspan x="28" y="1378.08">for some tea?)</tspan></text></svg>