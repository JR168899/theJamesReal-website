<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>coat</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/02/21 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A coat is an outer layer of clothing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A coat is an outer layer of clothing.</tspan></text><a href="https://www.pexels.com/photo/person-replenishing-the-clothes-hanging-on-the-rack-7679877/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7679877</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382d2e"><tspan x="28" y="482.0">coat</tspan></text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="525.3">US /koʊt/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="24.200000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="556.2760000000001">Singular: coat; plural: coats.</tspan></text><text x="28" y="617.7" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="651.14">clothing worn over other clothes outdoors</tspan></text><text x="28" y="708.34" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="741.78">overcoat; outer garment</tspan></text><text x="28" y="798.98" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="832.42">Take a coat because it is cold outside.</tspan></text><text x="28" y="889.62" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="923.06">Topic: Plans for a rainy day. Write one</tspan><tspan x="28" y="961.56">sentence using this word. Check that your</tspan><tspan x="28" y="1000.06">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1057.26" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.7">A: What does “coat” mean?</tspan><tspan x="28" y="1129.2">B: It means clothing worn over other</tspan><tspan x="28" y="1167.7">clothes outdoors.</tspan><tspan x="28" y="1206.2">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1244.7">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1301.9" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1335.3400000000001">Try it. Which word means “clothing worn</tspan><tspan x="28" y="1373.8400000000001">over other clothes outdoors”: coat or rain?</tspan></text></svg>