<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes a meal feel welcoming to you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/08 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">What makes a meal feel</tspan><tspan x="28" y="535.5">welcoming to you?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">An opening that invites a personal preference</tspan><tspan x="28" y="663.4">or experience without assuming everyone</tspan><tspan x="28" y="698.4">shares it.</tspan></text><text x="28" y="750.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="780.8">What makes a meal feel welcoming to you?</tspan></text><text x="28" y="832.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="863.1999999999999">Follow the answer with a related question.</tspan><tspan x="28" y="898.1999999999999">Accept a different preference or a declined</tspan><tspan x="28" y="933.1999999999999">invitation without asking the person to justify it.</tspan></text><text x="28" y="985.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1015.5999999999999">Aoede: Do you prefer a big dinner or something</tspan><tspan x="28" y="1050.6">simple?</tspan><tspan x="28" y="1085.6">Echo: Something simple, if it leaves time to talk.</tspan><tspan x="28" y="1120.6">Aoede: Would soup and bread suit you?</tspan><tspan x="28" y="1155.6">Echo: Perfect. I can bring the bread.</tspan><tspan x="28" y="1190.6">Aoede: Then I will make the soup.</tspan><tspan x="28" y="1225.6">Echo: And we can share the washing-up</tspan><tspan x="28" y="1260.6">afterward.</tspan></text><text x="28" y="1312.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1343.0">Your guest says they prefer simple food.</tspan><tspan x="28" y="1378.0">Suggest a meal and ask one relevant follow-up.</tspan></text></svg>