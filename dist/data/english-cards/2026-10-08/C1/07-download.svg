ht="400" fill="#2d382e"><tspan x="28" y="809.3000000000001">A: How should we share a meal?</tspan><tspan x="28" y="839.9250000000001">B: I see your point, although I would qualify it slightly.</tspan></text><text x="28" y="885.4250000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#2d382e"><tspan x="28" y="912.0250000000001">Use this phrase in a friendly conversation. Listen to the</tspan><tspan x="28" y="942.6500000000001">reply before asking your next question.</tspan></text><text x="28" y="988.1500000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#2d382e"><tspan x="28" y="1014.7500000000001">A: How would you express this idea?</tspan><tspan x="28" y="1045.375">B: I see your point, although I would qualify it slightly.</tspan><tspan x="28" y="1076.0">A: What does that mean here?</tspan><tspan x="28" y="1106.625">B: A useful way to keep an everyday conversation clear</tspan><tspan x="28" y="1137.25">and considerate.</tspan></text><text x="28" y="1258.0" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#2d382e"><tspan x="28" y="1284.6">Make a sentence of your own, then answer: When might</tspan><tspan x="28" y="1315.225">you say “I see your point, although I would qualify it</tspan><tspan x="28" y="1345.85">slightly.”? (Model: You could say it at the table, when you</tspan><tspan x="28" y="1376.475">want to ask for help or make your understanding clear.)</tspan></text></svg>