<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Around the table</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-08</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Around the table</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Around the table</title><desc>Original hand-drawn story illustration: plate, set within table. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.5)"><ellipse rx="65" ry="38" fill="#e9d2a9"/><ellipse rx="43" ry="23"/><path d="M-84-40V43M-94-40V-13Q-84 1-74-13V-40M85-40V43M85-40Q59-12 85-4"/></g><g transform="translate(95 264) rotate(0) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Around the table</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">There is more than one way to</tspan><tspan x="36" dy="23.459999999999997">share a meal. In my experience,</tspan><tspan x="36" dy="23.459999999999997">practical preparation and</tspan><tspan x="36" dy="23.459999999999997">attention to others are two</tspan><tspan x="36" dy="23.459999999999997">useful starting points.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">One reason is that a simple plan</tspan><tspan x="384" dy="23.459999999999997">leaves time for conversation. For</tspan><tspan x="384" dy="23.459999999999997">instance, we prepare the</tspan><tspan x="384" dy="23.459999999999997">vegetables before our guests</tspan><tspan x="384" dy="23.459999999999997">arrive. This prevents a small</tspan><tspan x="384" dy="23.459999999999997">difficulty from taking over the</tspan><tspan x="384" dy="23.459999999999997">experience. It also leaves us</tspan><tspan x="384" dy="23.459999999999997">more time to notice what is</tspan><tspan x="384" dy="23.459999999999997">happening.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Another reason is that sharing</tspan><tspan x="732" dy="23.459999999999997">the work helps everyone feel</tspan><tspan x="732" dy="23.459999999999997">included. For example, each guest</tspan><tspan x="732" dy="23.459999999999997">brings one dish and helps clear</tspan><tspan x="732" dy="23.459999999999997">the table. This approach</tspan><tspan x="732" dy="23.459999999999997">recognises that the experience</tspan><tspan x="732" dy="23.459999999999997">belongs to more than one person</tspan><tspan x="732" dy="23.459999999999997">and that different people may</tspan><tspan x="732" dy="23.459999999999997">need different things.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">These examples show why</tspan><tspan x="1080" dy="23.459999999999997">preparation and consideration</tspan><tspan x="1080" dy="23.459999999999997">work well together. We do not</tspan><tspan x="1080" dy="23.459999999999997">have to control every detail. We</tspan><tspan x="1080" dy="23.459999999999997">can make a sensible arrangement</tspan><tspan x="1080" dy="23.459999999999997">and remain ready to respond.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Make a sentence of your own, then answer: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>