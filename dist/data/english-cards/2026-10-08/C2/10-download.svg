<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually share a meal?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/08 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>How do you usually share a meal?</title><desc>Original family-manga illustration: plate, related to How do you usually share a meal?.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse rx="65" ry="38" fill="#e9d2a9"/><ellipse rx="43" ry="23"/><path d="M-84-40V43M-94-40V-13Q-84 1-74-13V-40M85-40V43M85-40Q59-12 85-4"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#353331"><tspan x="28" y="468.8">How do you usually share a</tspan><tspan x="28" y="514.8000000000001">meal?</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="589.12">An open question that invites a person to describe a familiar</tspan><tspan x="28" y="617.12">experience.</tspan></text><text x="28" y="658.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="683.04">How do you usually share a meal?</tspan></text><text x="28" y="724.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="748.9599999999999">Ask this as a genuine question. Listen to the answer, then ask</tspan><tspan x="28" y="776.9599999999999">a related follow-up.</tspan></text><text x="28" y="818.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="842.8799999999999">A: How do you usually share a meal?</tspan><tspan x="28" y="870.8799999999999">B: I treat the plan as provisional, rather than assuming that its</tspan><tspan x="28" y="898.8799999999999">coherence guarantees a good experience.</tspan><tspan x="28" y="926.8799999999999">A: What has helped you most?</tspan><tspan x="28" y="954.8799999999999">B: For example, we prepare the vegetables before our guests</tspan><tspan x="28" y="982.8799999999999">arrive.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1281.1200000000001">Make a sentence of your own, then answer: Write a reply of</tspan><tspan x="28" y="1309.1200000000001">your own, then ask one related question. (Model: I treat the</tspan><tspan x="28" y="1337.1200000000001">plan as provisional, rather than assuming that its coherence</tspan><tspan x="28" y="1365.1200000000001">guarantees a good experience. What works best for you?)</tspan></text></svg>