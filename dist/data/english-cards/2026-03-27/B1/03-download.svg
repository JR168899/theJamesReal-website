<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>work out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/03/27 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Hands assemble the pieces of a puzzle.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Hands assemble the pieces of a puzzle.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">work something out</tspan><tspan x="28" y="525.6675">work out something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">find a solution</tspan></text><text x="28" y="656.802" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="684.3140000000001">solve; figure out</tspan></text><text x="28" y="731.374" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="758.8860000000001">We can work out a plan together.</tspan></text><text x="28" y="805.946" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="833.4580000000001">Work something out means solve or calculate it here.</tspan><tspan x="28" y="865.133">It is separable: work the answer out / work it out.</tspan></text><text x="28" y="912.193" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="939.705">A: We have twelve guests and three tables.</tspan><tspan x="28" y="971.38">B: Can we work out a seating plan?</tspan><tspan x="28" y="1003.0550000000001">A: Four people at each table would fit.</tspan><tspan x="28" y="1034.73">B: Let us check whether the chairs are available.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">There are twelve guests and three equal tables. Work</tspan><tspan x="28" y="1317.667">out a plan and state what else must be checked.</tspan><tspan x="28" y="1349.3419999999999">(Model: Seat four guests at each table and check that</tspan><tspan x="28" y="1381.017">twelve suitable chairs are available.)</tspan></text></svg>