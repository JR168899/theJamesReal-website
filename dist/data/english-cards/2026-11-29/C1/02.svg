<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>resilience</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-11-29</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">resilience</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>resilience</title><desc>Original hand-drawn story illustration: ladder, set within weather. the ability to recover or adapt after difficulty</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-40 70L-15-73M25 70L50-73M-12-55H47M-20-20H40M-26 15H34M-33 50H28"/></g><g transform="translate(538 266) rotate(0) scale(0.52)"><path d="M-72-4Q0-108 72-4Q48-26 24-4Q0-26-24-4Q-48-26-72-4Z" fill="#c7a1a3"/><path d="M0-62V49Q0 78-23 63M-72-4Q-32-72 0-62Q32-72 72-4M-52 19L-59 33M45 22L39 37"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">resilience</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">the ability to recover or adapt after difficulty</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Topic: Plans for a rainy day. Write one sentence using</tspan><tspan x="35" dy="24.839999999999996">this word. Check that your sentence keeps the meaning</tspan><tspan x="35" dy="24.839999999999996">shown above.</tspan></text><text x="35" y="716.8799999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="741.4399999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: What does “resilience” mean?</tspan><tspan x="35" dy="24.839999999999996">B: It means the ability to recover or adapt after</tspan><tspan x="35" dy="24.839999999999996">difficulty.</tspan><tspan x="35" dy="24.839999999999996">A: Can we use it on a rainy day?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. Let us think of a clear example.</tspan></text><text x="35" y="892.6399999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="917.1999999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Apply the idea to a real situation, then answer: Which</tspan><tspan x="35" dy="24.839999999999996">word means “the ability to recover or adapt after</tspan><tspan x="35" dy="24.839999999999996">difficulty”: resilience or provisional?</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   02 OF 11</tspan></text></svg>