<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there an album you like listening to all the way through?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/11/17 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener uses headphones to focus on sound.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener uses headphones to focus on sound.</tspan></text><a href="https://www.pexels.com/photo/man-wearing-a-headset-and-listening-8867041/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8867041</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">Is there an album you like</tspan><tspan x="28" y="525.6675">listening to all the way</tspan><tspan x="28" y="577.705">through?</tspan></text><text x="28" y="634.2674999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="661.7795">An opening that invites a personal preference or</tspan><tspan x="28" y="693.4544999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="740.5144999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="768.0264999999999">Is there an album you like listening to all the way</tspan><tspan x="28" y="799.7014999999999">through?</tspan></text><text x="28" y="846.7614999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="874.2734999999999">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="905.9484999999999">different preference or a declined invitation without</tspan><tspan x="28" y="937.6234999999999">asking the person to justify it.</tspan></text><text x="28" y="984.6834999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1012.1954999999999">Sarah: Do you usually listen to whole albums?</tspan><tspan x="28" y="1043.8705">Liam: Not often, but I tried it last weekend.</tspan><tspan x="28" y="1075.5455">Sarah: Did anything surprise you?</tspan><tspan x="28" y="1107.2205">Liam: The quieter songs made more sense between</tspan><tspan x="28" y="1138.8954999999999">the louder ones.</tspan><tspan x="28" y="1170.5704999999998">Sarah: Would you listen that way again?</tspan><tspan x="28" y="1202.2455">Liam: Yes, when I can give it my attention.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Invite someone to explain how listening to an album</tspan><tspan x="28" y="1317.667">in order changed their experience. (Model: Did the</tspan><tspan x="28" y="1349.3419999999999">order of the tracks change how you heard any of the</tspan><tspan x="28" y="1381.017">songs?)</tspan></text></svg>