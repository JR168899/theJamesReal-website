<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>evocative</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/11/17 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A familiar tune can bring an experience or memory to mind.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A familiar tune can bring an experience or memory to mind.</tspan></text><a href="https://www.pexels.com/photo/photography-of-woman-listening-to-music-1181367/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1181367</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">evocative</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ɪˈvɑkətɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">evocative · more evocative · most evocative; noun:</tspan><tspan x="28" y="579.5250000000001">evocation</tspan></text><text x="28" y="638.157" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="670.0770000000001">bringing strong images or feelings to mind</tspan></text><text x="28" y="724.677" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="756.5970000000001">suggestive; bringing memories to mind</tspan></text><text x="28" y="811.197" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="843.1170000000001">The song is evocative of summer evenings.</tspan></text><text x="28" y="897.717" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="929.6370000000001">Topic: Listening without distraction. Write one</tspan><tspan x="28" y="966.3870000000001">sentence using this word. Check that your</tspan><tspan x="28" y="1003.1370000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1057.7369999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1089.657">A: What does “evocative” mean?</tspan><tspan x="28" y="1126.407">B: It means bringing strong images or feelings</tspan><tspan x="28" y="1163.157">to mind.</tspan><tspan x="28" y="1199.907">A: Can we use it while listening to music?</tspan><tspan x="28" y="1236.657">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1291.2569999999998" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.177">Which word means “bringing strong images or</tspan><tspan x="28" y="1359.927">feelings to mind”: evocative or resonance?</tspan></text></svg>