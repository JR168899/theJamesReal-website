<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Would you mind if we considered another option?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/09/16 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="474.32">Would you mind if we</tspan><tspan x="28" y="527.22">considered another option?</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="612.688">A polite suggestion that a group examine a different</tspan><tspan x="28" y="644.888">possibility.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="720.696">Could we look at an alternative?; Would you be open</tspan><tspan x="28" y="752.8960000000001">to a different approach?</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="828.7040000000001">A: The first venue is cheap, but the stairs may be</tspan><tspan x="28" y="860.9040000000001">difficult for some guests.</tspan><tspan x="28" y="893.104">B: Would you mind if we considered another option?</tspan></text><text x="28" y="940.9440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="968.912">Would you mind if we + past form can make a</tspan><tspan x="28" y="1001.1120000000001">tentative suggestion: considered. Not at all</tspan><tspan x="28" y="1033.3120000000001">commonly grants the request.</tspan></text><text x="28" y="1081.152" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1109.1200000000001">A: The first venue is cheap, but the stairs may be</tspan><tspan x="28" y="1141.3200000000002">difficult for some guests.</tspan><tspan x="28" y="1173.5200000000002">B: Would you mind if we considered another option?</tspan><tspan x="28" y="1205.72">A: Not at all. What do you suggest?</tspan><tspan x="28" y="1237.92">B: The library room has level access and is near the</tspan><tspan x="28" y="1270.1200000000001">bus stop.</tspan></text><text x="28" y="1317.96" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1345.928">Suggest an alternative venue politely and give one</tspan><tspan x="28" y="1378.1280000000002">concrete reason for considering it.</tspan></text></svg>