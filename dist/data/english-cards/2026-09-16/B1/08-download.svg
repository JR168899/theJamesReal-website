<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/09/16 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People share food during an outing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People share food during an outing.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="39.330000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="471.33">There is nothing in the world so</tspan><tspan x="28" y="520.4925">irresistibly contagious as</tspan><tspan x="28" y="569.655">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="17.1" font-weight="400" fill="#2c3540"><tspan x="28" y="596.5875">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="643.6124999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="669.6044999999999">A cheerful mood can spread from one person to others.</tspan></text><text x="28" y="714.0644999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="740.0564999999999">Laughter can spread through a group; Good spirits can</tspan><tspan x="28" y="769.9814999999999">influence the people nearby</tspan></text><text x="28" y="814.4414999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="840.4334999999999">One guest starts laughing at a gentle joke, and soon the</tspan><tspan x="28" y="870.3584999999998">whole table is smiling.</tspan></text><text x="28" y="914.8184999999997" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="940.8104999999998">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="970.7354999999998">spreading, rather than an infection. The original spelling</tspan><tspan x="28" y="1000.6604999999998">good-humour is retained.</tspan></text><text x="28" y="1045.1204999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1071.1124999999997">A: Which line caught your attention?</tspan><tspan x="28" y="1101.0374999999997">B: “There is nothing in the world so irresistibly contagious</tspan><tspan x="28" y="1130.9624999999996">as laughter and good-humour.”</tspan><tspan x="28" y="1160.8874999999998">A: How does that connect with the example?</tspan><tspan x="28" y="1190.8124999999998">B: The example shows one person’s cheerful reaction</tspan><tspan x="28" y="1220.7374999999997">affecting the rest of the group.</tspan></text><text x="28" y="1265.1974999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1291.1894999999997">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1321.1144999999997">Which detail supports your explanation? (Model: The</tspan><tspan x="28" y="1351.0394999999996">example shows one person’s cheerful reaction affecting</tspan><tspan x="28" y="1380.9644999999998">the rest of the group.)</tspan></text></svg>