<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Listening without distraction</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-11-18</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Listening without distraction</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Listening without distraction</title><desc>Original hand-drawn story illustration: dialogue, set within music. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><g transform="translate(94 266) rotate(-3) scale(0.52)"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#b7a3bf"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#b7a3bf"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Listening without distraction</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">The decision to listen to a whole</tspan><tspan x="36" dy="23.459999999999997">album may appear ordinary, yet it</tspan><tspan x="36" dy="23.459999999999997">exposes a recurring tension</tspan><tspan x="36" dy="23.459999999999997">between arrangements that make</tspan><tspan x="36" dy="23.459999999999997">life manageable and experiences</tspan><tspan x="36" dy="23.459999999999997">that resist being prescribed. A</tspan><tspan x="36" dy="23.459999999999997">defensible approach combines</tspan><tspan x="36" dy="23.459999999999997">proportionate preparation with a</tspan><tspan x="36" dy="23.459999999999997">willingness to reconsider whose</tspan><tspan x="36" dy="23.459999999999997">interests a plan serves.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="384" dy="0">Preparation has value because</tspan><tspan x="384" dy="22.08">setting aside distractions lets us</tspan><tspan x="384" dy="22.08">notice more of the music. In the</tspan><tspan x="384" dy="22.08">present case, we put the phone away</tspan><tspan x="384" dy="22.08">during the first song. Such an</tspan><tspan x="384" dy="22.08">intervention is modest, but that</tspan><tspan x="384" dy="22.08">modesty is its strength: it removes</tspan><tspan x="384" dy="22.08">a foreseeable obstacle without</tspan><tspan x="384" dy="22.08">claiming to determine the entire</tspan><tspan x="384" dy="22.08">experience. Structure is useful to</tspan><tspan x="384" dy="22.08">the extent that it releases</tspan><tspan x="384" dy="22.08">attention rather than consuming it.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="732" dy="0">That argument requires a</tspan><tspan x="732" dy="20.7">qualification, however: sharing</tspan><tspan x="732" dy="20.7">different preferences makes listening</tspan><tspan x="732" dy="20.7">more interesting. For instance, each</tspan><tspan x="732" dy="20.7">friend chooses one track and explains</tspan><tspan x="732" dy="20.7">what they enjoy about it. An</tspan><tspan x="732" dy="20.7">arrangement that appears efficient</tspan><tspan x="732" dy="20.7">from one standpoint may impose costs</tspan><tspan x="732" dy="20.7">elsewhere. Listening to those affected</tspan><tspan x="732" dy="20.7">is therefore not an optional gesture</tspan><tspan x="732" dy="20.7">of goodwill; it supplies information</tspan><tspan x="732" dy="20.7">without which the plan cannot be</tspan><tspan x="732" dy="20.7">adequately evaluated.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">The resulting principle is one of</tspan><tspan x="1080" dy="23.459999999999997">proportion. Preparation deserves</tspan><tspan x="1080" dy="23.459999999999997">support when it clarifies</tspan><tspan x="1080" dy="23.459999999999997">responsibilities and protects</tspan><tspan x="1080" dy="23.459999999999997">time, while responsiveness</tspan><tspan x="1080" dy="23.459999999999997">prevents it from hardening into</tspan><tspan x="1080" dy="23.459999999999997">an end in itself. To judge the</tspan><tspan x="1080" dy="23.459999999999997">experience well is to examine</tspan><tspan x="1080" dy="23.459999999999997">both what the arrangement enables</tspan><tspan x="1080" dy="23.459999999999997">and what it may inadvertently</tspan><tspan x="1080" dy="23.459999999999997">exclude.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Explain the meaning before looking at the model answer. What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>