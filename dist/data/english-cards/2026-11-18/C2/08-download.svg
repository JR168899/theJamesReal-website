<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If music be the food of love, play on;</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/11/18 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people play guitars together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people play guitars together.</tspan></text><a href="https://www.pexels.com/photo/men-playing-the-guitars-and-smiling-4670179/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4670179</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="472.48">If music be the food of love,</tspan><tspan x="28" y="523.08">play on;</tspan></text><text font-family="Arial, sans-serif" font-size="17.6" font-weight="400" fill="#2c3540"><tspan x="28" y="550.8000000000001">William Shakespeare · Twelfth Night, Act I, Scene 1 (First Folio) · Published</tspan><tspan x="28" y="572.272">1623</tspan></text><text x="28" y="620.32" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="647.072">The speaker imagines music as something that feeds</tspan><tspan x="28" y="677.872">or sustains a feeling of love.</tspan></text><text x="28" y="723.6320000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="750.384">Music can nourish emotion; Sound is compared to</tspan><tspan x="28" y="781.184">emotional nourishment</tspan></text><text x="28" y="826.9440000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="853.696">The melody changes the mood in the room, and we</tspan><tspan x="28" y="884.496">listen to the next phrase.</tspan></text><text x="28" y="930.2560000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="957.008">Orsino speaks this line. Be is an older subjunctive</tspan><tspan x="28" y="987.808">form here. Food of love is a metaphor, and the</tspan><tspan x="28" y="1018.6080000000001">speech goes on to complicate the speaker’s desire.</tspan></text><text x="28" y="1064.368" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1091.1200000000001">A: Why does the speaker compare music to food?</tspan><tspan x="28" y="1121.92">B: He imagines it feeding an emotional appetite.</tspan><tspan x="28" y="1152.72">A: Is that the same as saying music is literally edible?</tspan><tspan x="28" y="1183.5200000000002">B: No. The metaphor connects listening with desire</tspan><tspan x="28" y="1214.3200000000002">and nourishment.</tspan></text><text x="28" y="1260.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.832">Explain the food metaphor without treating it as a</tspan><tspan x="28" y="1317.632">literal definition of music. (Model: The speaker</tspan><tspan x="28" y="1348.432">imagines music nourishing or satisfying an emotional</tspan><tspan x="28" y="1379.2320000000002">appetite.)</tspan></text></svg>