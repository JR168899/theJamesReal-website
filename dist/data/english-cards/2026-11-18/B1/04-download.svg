<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>look into</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/11/18 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">look into</tspan></text><text x="28" y="516.015" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="539.271">examine or investigate</tspan></text><text x="28" y="579.051" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="602.307">investigate; examine</tspan></text><text x="28" y="642.0870000000001" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="665.3430000000001">We should look into another option.</tspan></text><text x="28" y="705.1230000000002" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="728.3790000000001">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="755.1540000000001">changing its object or word order.</tspan></text><text x="28" y="794.9340000000002" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="818.1900000000002">A: How can we listen to a whole album?</tspan><tspan x="28" y="844.9650000000001">B: We should look into another option.</tspan><tspan x="28" y="871.7400000000002">A: That gives us a starting point.</tspan><tspan x="28" y="898.5150000000002">B: Let us try it together.</tspan></text><text x="28" y="1256.24" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1279.496">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1306.2710000000002">Explain “look into” in your own words, then use it in a sentence</tspan><tspan x="28" y="1333.046">about listening without distraction. (Model: It means to examine</tspan><tspan x="28" y="1359.8210000000001">or investigate. Example: We should look into another option.)</tspan></text></svg>