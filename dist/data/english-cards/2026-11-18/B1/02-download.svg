<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>attention</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/11/18 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Listening closely means giving attention to another person.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Listening closely means giving attention to another person.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">attention</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /əˈtɛnʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">Usually uncountable: attention; no regular plural in this sense.</tspan></text><text x="28" y="598.11" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="627.9020000000002">careful listening or looking</tspan></text><text x="28" y="678.862" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="708.6540000000001">concentration; careful notice</tspan></text><text x="28" y="759.6139999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="789.4060000000001">Please give your full attention to the person</tspan><tspan x="28" y="823.706">speaking.</tspan></text><text x="28" y="874.6659999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="904.4580000000001">Topic: Listening without distraction. Write one</tspan><tspan x="28" y="938.758">sentence using this word. Check that your</tspan><tspan x="28" y="973.0580000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1024.018" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1053.81">A: What does “attention” mean?</tspan><tspan x="28" y="1088.11">B: It means careful listening or looking.</tspan><tspan x="28" y="1122.4099999999999">A: Can we use it while listening to music?</tspan><tspan x="28" y="1156.71">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Explain the meaning before looking at the model</tspan><tspan x="28" y="1323.772">answer. Which word means “careful listening or</tspan><tspan x="28" y="1358.072">looking”: attention or melody? (Model: attention)</tspan></text></svg>