<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contextual</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/07/04 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets shape a neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets shape a neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">contextual</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /kənˈtɛkstʃuəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Adjective: contextual; related noun: context</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">understood in relation to its surroundings</tspan></text><text x="28" y="670.0455000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="698.7735000000001">context-dependent; related to the setting</tspan></text><text x="28" y="747.9135" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="776.6415000000001">A contextual reading considers the history of the</tspan><tspan x="28" y="809.7165000000001">street.</tspan></text><text x="28" y="858.8565" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="887.5845">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="920.6595000000001">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="953.7345">description rather than using it as a general</tspan><tspan x="28" y="986.8095000000001">compliment.</tspan></text><text x="28" y="1035.9495" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1064.6775">A: Would the same entrance work on every street?</tspan><tspan x="28" y="1097.7525">B: No. The judgment is contextual.</tspan><tspan x="28" y="1130.8275">A: What changes here?</tspan><tspan x="28" y="1163.9025">B: The slope, the nearby crossing and the way</tspan><tspan x="28" y="1196.9775">people approach the building.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Give two contextual factors that could affect the</tspan><tspan x="28" y="1320.923">design of an entrance. (Model: The slope of the</tspan><tspan x="28" y="1353.998">pavement and the routes people use to approach it.)</tspan></text></svg>