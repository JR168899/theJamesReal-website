<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/07/04 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A new day begins with getting up and preparing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A new day begins with getting up and preparing.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="480.3">get ready</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="577.845">prepare yourself</tspan></text><text x="28" y="632.4449999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="664.365">prepare; make preparations</tspan></text><text x="28" y="718.9649999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="750.885">We get ready before we leave as we prepare</tspan><tspan x="28" y="787.635">for Independence Day.</tspan></text><text x="28" y="842.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="874.155">Keep the particle with the verb. Check a</tspan><tspan x="28" y="910.905">dictionary before changing its object or word</tspan><tspan x="28" y="947.655">order.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1034.175">A: How can we join a public celebration?</tspan><tspan x="28" y="1070.925">B: We get ready before we leave.</tspan><tspan x="28" y="1107.675">A: That gives us a starting point.</tspan><tspan x="28" y="1144.425">B: Let us try it together.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1292.72">For Independence Day, tell a friend. Explain</tspan><tspan x="28" y="1329.47">“get ready” in your own words, then use it in a</tspan><tspan x="28" y="1366.22">sentence about sharing a public celebration.</tspan></text></svg>