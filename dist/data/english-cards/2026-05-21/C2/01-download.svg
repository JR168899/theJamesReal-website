<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>subsidiarity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/21 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People close to a shared task contribute knowledge and effort.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People close to a shared task contribute knowledge and effort.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">subsidiarity</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /səbˌsɪdiˈɛrəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">Usually uncountable: subsidiarity; no regular plural in this sense.</tspan></text><text x="28" y="589.635" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="617.9069999999999">the principle that a matter should be handled at the</tspan><tspan x="28" y="650.4569999999999">most local competent level</tspan></text><text x="28" y="698.817" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="727.0889999999999">local decision-making principle; responsibility at the</tspan><tspan x="28" y="759.6389999999999">appropriate local level</tspan></text><text x="28" y="807.999" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="836.271">Subsidiarity allows local teams to make decisions</tspan><tspan x="28" y="868.8209999999999">they are equipped to handle.</tspan></text><text x="28" y="917.181" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="945.453">Topic: Working together. Write one sentence using</tspan><tspan x="28" y="978.0029999999999">this word. Check that your sentence keeps the</tspan><tspan x="28" y="1010.553">meaning shown above.</tspan></text><text x="28" y="1058.9130000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1087.1850000000002">A: What does “subsidiarity” mean?</tspan><tspan x="28" y="1119.7350000000001">B: It means the principle that a matter should be</tspan><tspan x="28" y="1152.285">handled at the most local competent level.</tspan><tspan x="28" y="1184.8350000000003">A: Can we use it during a shared project?</tspan><tspan x="28" y="1217.3850000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1265.7450000000003" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1294.0170000000003">Which word means “the principle that a matter</tspan><tspan x="28" y="1326.5670000000002">should be handled at the most local competent level”:</tspan><tspan x="28" y="1359.1170000000002">subsidiarity or asymmetry? (Model: subsidiarity)</tspan></text></svg>