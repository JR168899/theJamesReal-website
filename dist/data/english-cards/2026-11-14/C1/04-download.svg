122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-32" cy="-12" r="28" fill="#dcc18a"/><path d="M-11 9L50 65M29 46L43 31M44 60L59 44"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="38.41" font-weight="700" fill="#3d3028"><tspan x="28" y="470.40999999999997">iron something out</tspan><tspan x="28" y="518.4225">iron out something</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="595.994">resolve small difficulties</tspan></text><text x="28" y="639.414" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="664.798">resolve; straighten out</tspan></text><text x="28" y="708.218" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="733.602">We can iron out the details before we begin.</tspan></text><text x="28" y="777.0219999999999" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="802.406">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="831.631">changing its object or word order.</tspan></text><text x="28" y="875.0509999999999" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="900.435">A: How can we buy what we need?</tspan><tspan x="28" y="929.66">B: We can iron out the details before we begin.</tspan><tspan x="28" y="958.885">A: That gives us a starting point.</tspan><tspan x="28" y="988.1099999999999">B: Let us try it together.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="1282.7440000000001">Explain your reasoning to a partner. Explain “iron out” in</tspan><tspan x="28" y="1311.969">your own words, then use it in a sentence about choosing</tspan><tspan x="28" y="1341.1940000000002">with care. (Model: It means to resolve small difficulties.</tspan><tspan x="28" y="1370.419">Example: We can iron out the details before we begin.)</tspan></text></svg>