<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>listen</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/07/18 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A conversation includes listening and responding to another person.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A conversation includes listening and responding to another person.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">listen</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ˈlɪsən/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">listen · listens · listened · listened · listening (base · third</tspan><tspan x="28" y="569.69">person · past · past participle · -ing)</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">to pay attention to a sound or to someone</tspan><tspan x="28" y="688.5052000000001">speaking</tspan></text><text x="28" y="739.4652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="769.2572000000001">pay attention to sound; attend to speech</tspan></text><text x="28" y="820.2171999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="850.0092000000001">Please listen to the whole question before</tspan><tspan x="28" y="884.3092">answering.</tspan></text><text x="28" y="935.2692" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="965.0612000000001">Topic: A conversation worth having. Write one</tspan><tspan x="28" y="999.3612">sentence using this word. Check that your</tspan><tspan x="28" y="1033.6612">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1084.6212" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1114.4132">A: What does “listen” mean?</tspan><tspan x="28" y="1148.7132">B: It means to pay attention to a sound or to</tspan><tspan x="28" y="1183.0131999999999">someone speaking.</tspan><tspan x="28" y="1217.3132">A: Can we use it in a conversation?</tspan><tspan x="28" y="1251.6132">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1302.5732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1332.3652">Try it. Which word means “to pay attention to a</tspan><tspan x="28" y="1366.6652">sound or to someone speaking”: listen or friend?</tspan></text></svg>