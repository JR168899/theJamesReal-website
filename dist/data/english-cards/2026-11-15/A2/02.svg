<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>fresh</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/11/15 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Vegetables are arranged for selection.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Vegetables are arranged for selection.</tspan></text><a href="https://www.pexels.com/photo/assorted-fresh-ripe-vegetables-in-market-stall-3873912/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3873912</text></a></svg><text font-family="Arial, sans-serif" font-size="48.760000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="480.76">fresh</tspan></text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="522.63">US /frɛʃ/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="23.32" font-weight="400" fill="#382d2e"><tspan x="28" y="552.4796">fresh · fresher · freshest; noun: freshness</tspan></text><text x="28" y="611.67" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="643.8939999999999">recently produced or picked and still in good</tspan><tspan x="28" y="680.9939999999999">condition</tspan></text><text x="28" y="736.114" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="768.338">newly picked; recently produced</tspan></text><text x="28" y="823.4580000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="855.682">We buy fresh vegetables at the market.</tspan></text><text x="28" y="910.8020000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="943.0260000000001">The adjective describes a person, thing or</tspan><tspan x="28" y="980.1260000000001">situation. Choose a concrete noun or context</tspan><tspan x="28" y="1017.2260000000001">that supports the description rather than</tspan><tspan x="28" y="1054.326">using it as a general compliment.</tspan></text><text x="28" y="1109.4460000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1141.67">Bella: Are these carrots fresh?</tspan><tspan x="28" y="1178.77">Fenrir: Yes. They arrived this morning.</tspan><tspan x="28" y="1215.8700000000001">Bella: I will take three, please.</tspan><tspan x="28" y="1252.97">Fenrir: Would you like the leaves left on?</tspan></text><text x="28" y="1308.0900000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.314">Ask a market seller when the vegetables</tspan><tspan x="28" y="1377.414">arrived.</tspan></text></svg>