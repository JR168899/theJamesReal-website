<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>work out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/11/15 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#3d3028"><tspan x="28" y="472.02">work something out</tspan><tspan x="28" y="522.045">work out something</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="602.868">find a solution</tspan></text><text x="28" y="648.108" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="674.556">solve; figure out</tspan></text><text x="28" y="719.7959999999999" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="746.244">We can work out a plan together.</tspan></text><text x="28" y="791.4839999999999" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="817.932">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="848.3820000000001">changing its object or word order.</tspan></text><text x="28" y="893.622" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="920.07">A: How can we buy what we need?</tspan><tspan x="28" y="950.5200000000001">B: We can work out a plan together.</tspan><tspan x="28" y="980.97">A: That gives us a starting point.</tspan><tspan x="28" y="1011.4200000000001">B: Let us try it together.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1284.368">Apply the idea to a real situation, then answer: Explain</tspan><tspan x="28" y="1314.818">“work out” in your own words, then use it in a sentence</tspan><tspan x="28" y="1345.268">about choosing with care. (Model: It means to find a</tspan><tspan x="28" y="1375.7179999999998">solution. Example: We can work out a plan together.)</tspan></text></svg>