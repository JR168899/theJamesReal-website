<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually buy what we need?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/11/15 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Fresh food is displayed at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Fresh food is displayed at a market.</tspan></text><a href="https://www.pexels.com/photo/vegetables-in-market-12527092/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12527092</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#353331"><tspan x="28" y="482.0">How do you usually buy</tspan><tspan x="28" y="544.5">what we need?</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="646.54">An open question that invites a person to</tspan><tspan x="28" y="685.04">describe a familiar experience.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="775.68">How do you usually buy what we need?</tspan></text><text x="28" y="832.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="866.3199999999999">Ask this as a genuine question. Listen to</tspan><tspan x="28" y="904.8199999999999">the answer, then ask a related follow-up.</tspan></text><text x="28" y="962.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="995.4599999999999">A: How do you usually buy what we need?</tspan><tspan x="28" y="1033.96">B: I try to prepare without deciding every</tspan><tspan x="28" y="1072.46">detail in advance.</tspan><tspan x="28" y="1110.96">A: What has helped you most?</tspan><tspan x="28" y="1149.46">B: For example, we check the kitchen</tspan><tspan x="28" y="1187.96">before choosing fruit and vegetables.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1295.04">Apply the idea to a real situation, then</tspan><tspan x="28" y="1333.54">answer: Write a reply of your own, then ask</tspan><tspan x="28" y="1372.04">one related question.</tspan></text></svg>