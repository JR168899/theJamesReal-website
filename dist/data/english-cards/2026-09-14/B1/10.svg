<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes a meal feel welcoming to you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/09/14 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">What makes a meal feel</tspan><tspan x="28" y="533.43">welcoming to you?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="658.772">experience without assuming everyone shares it.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">What makes a meal feel welcoming to you?</tspan></text><text x="28" y="790.484" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="820.2760000000002">Follow the answer with a related question. Accept</tspan><tspan x="28" y="854.5760000000001">a different preference or a declined invitation</tspan><tspan x="28" y="888.8760000000002">without asking the person to justify it.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="969.6280000000002">Sky: Do you prefer a big dinner or something</tspan><tspan x="28" y="1003.9280000000001">simple?</tspan><tspan x="28" y="1038.228">Michael: Something simple, if it leaves time to</tspan><tspan x="28" y="1072.5280000000002">talk.</tspan><tspan x="28" y="1106.8280000000002">Sky: Would soup and bread suit you?</tspan><tspan x="28" y="1141.1280000000002">Michael: Perfect. I can bring the bread.</tspan><tspan x="28" y="1175.428">Sky: Then I will make the soup.</tspan><tspan x="28" y="1209.728">Michael: And we can share the washing-up</tspan><tspan x="28" y="1244.0280000000002">afterward.</tspan></text><text x="28" y="1294.988" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1324.78">Your guest says they prefer simple food. Suggest</tspan><tspan x="28" y="1359.08">a meal and ask one relevant follow-up.</tspan></text></svg>