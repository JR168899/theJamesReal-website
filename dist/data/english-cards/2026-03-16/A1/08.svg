<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>We need the tonic of wildness</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/03/16 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Changing leaves mark the passing of seasons.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Changing leaves mark the passing of seasons.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#2c3540"><tspan x="28" y="476.39">We need the tonic of</tspan><tspan x="28" y="531.8774999999999">wildness</tspan></text><text font-family="Arial, sans-serif" font-size="19.3" font-weight="400" fill="#2c3540"><tspan x="28" y="562.275">Henry David Thoreau · Walden, Spring · Published 1854</tspan></text><text x="28" y="615.35" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="644.6859999999999">Time in untamed nature can refresh people who</tspan><tspan x="28" y="678.4609999999999">spend much of life within familiar routines.</tspan></text><text x="28" y="728.6410000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="757.977">Nature can restore our energy; Wild places can</tspan><tspan x="28" y="791.752">offer renewal</tspan></text><text x="28" y="841.9320000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="871.268">After a day indoors, we spend a quiet hour beside</tspan><tspan x="28" y="905.043">the trees.</tspan></text><text x="28" y="955.2230000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="984.5590000000001">This is an excerpt. Tonic means something that</tspan><tspan x="28" y="1018.3340000000001">refreshes or restores, not a literal drink. The</tspan><tspan x="28" y="1052.1090000000002">passage contrasts familiar village life with the</tspan><tspan x="28" y="1085.884">surrounding wild landscape.</tspan></text><text x="28" y="1136.0640000000003" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1165.4000000000003">Heart: How do you feel after a walk outside?</tspan><tspan x="28" y="1199.1750000000004">Puck: A little more relaxed.</tspan><tspan x="28" y="1232.9500000000003">Heart: Is tonic a drink here?</tspan><tspan x="28" y="1266.7250000000004">Puck: No. It is a way to describe feeling</tspan><tspan x="28" y="1300.5000000000005">refreshed.</tspan></text><text x="28" y="1350.6800000000003" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1380.0160000000003">Is the quotation describing literal medicine?</tspan></text></svg>