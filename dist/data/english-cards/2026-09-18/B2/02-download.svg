<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>flexible</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/09/18 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">flexible</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ˈflɛksəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">flexible · more flexible · most flexible; noun: flexibility</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">able to change when circumstances change</tspan></text><text x="28" y="659.9695" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="687.4815000000001">adaptable; open to change</tspan></text><text x="28" y="734.5415" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="762.0535000000001">A flexible plan leaves time for an unexpected stop.</tspan></text><text x="28" y="809.1135" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="836.6255000000001">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="868.3005">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="899.9755000000001">description rather than using it as a general</tspan><tspan x="28" y="931.6505000000001">compliment.</tspan></text><text x="28" y="978.7105" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1006.2225000000001">A: Must we follow the route exactly?</tspan><tspan x="28" y="1037.8975">B: No. The plan is flexible if the weather changes.</tspan><tspan x="28" y="1069.5725">A: Could we stop at the gardens instead?</tspan><tspan x="28" y="1101.2475000000002">B: Certainly, provided we can still catch the last train.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Explain one way a travel plan can be flexible without</tspan><tspan x="28" y="1317.667">becoming completely unplanned. (Model: Keep the</tspan><tspan x="28" y="1349.3419999999999">return train fixed while allowing a choice of afternoon</tspan><tspan x="28" y="1381.017">activities.)</tspan></text></svg>