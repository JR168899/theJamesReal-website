<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Small choices matter to other people.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/12/29 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small choices matter to other people.</title><desc>Original family-manga illustration: calendar, related to Small choices matter to other people..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.93" font-weight="700" fill="#2c3540"><tspan x="28" y="475.93">Small choices matter to</tspan><tspan x="28" y="530.8425">other people.</tspan></text><text x="28" y="590.53" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="619.562">Ordinary decisions can affect the people around</tspan><tspan x="28" y="652.987">us, even when the decisions seem minor.</tspan></text><text x="28" y="702.6469999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="731.679">Our everyday decisions affect others.; Little</tspan><tspan x="28" y="765.1039999999999">choices can have a shared impact.</tspan></text><text x="28" y="814.7639999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="843.7959999999999">For example, we choose a ten-minute practice</tspan><tspan x="28" y="877.2209999999999">session and put it on the calendar.</tspan></text><text x="28" y="926.8809999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="955.9129999999999">Read this as a reflection, not a factual rule.</tspan><tspan x="28" y="989.3379999999999">Relate it to a specific action in the example, and</tspan><tspan x="28" y="1022.7629999999999">explain why you agree or disagree.</tspan></text><text x="28" y="1072.4229999999998" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="1101.4549999999997">A: What did we learn from that experience?</tspan><tspan x="28" y="1134.8799999999997">B: Small choices matter to other people.</tspan><tspan x="28" y="1168.3049999999996">A: What do you mean?</tspan><tspan x="28" y="1201.7299999999998">B: Ordinary decisions can affect the people</tspan><tspan x="28" y="1235.1549999999997">around us, even when the decisions seem minor.</tspan></text><text x="28" y="1284.8149999999998" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#2c3540"><tspan x="28" y="1313.8469999999998">Which action in today’s topic illustrates this</tspan><tspan x="28" y="1347.2719999999997">reflection? (Model: We choose a ten-minute</tspan><tspan x="28" y="1380.6969999999997">practice session and put it on the calendar.)</tspan></text></svg>