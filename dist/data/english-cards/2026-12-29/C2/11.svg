<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Looking back and looking ahead</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-12-29</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Looking back and looking ahead</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Looking back and looking ahead</title><desc>Original hand-drawn story illustration: magnifier, set within year. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><g transform="translate(94 266) rotate(-1) scale(0.52)"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Looking back and looking ahead</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="36" dy="0">To make a realistic plan is to</tspan><tspan x="36" dy="20.7">negotiate a familiar but frequently</tspan><tspan x="36" dy="20.7">obscured relationship between</tspan><tspan x="36" dy="20.7">intentional design and the</tspan><tspan x="36" dy="20.7">contingencies of shared experience.</tspan><tspan x="36" dy="20.7">The question is not whether</tspan><tspan x="36" dy="20.7">arrangements are desirable, but what</tspan><tspan x="36" dy="20.7">authority they should acquire. A</tspan><tspan x="36" dy="20.7">credible position supports preparation</tspan><tspan x="36" dy="20.7">while withholding the assumption that</tspan><tspan x="36" dy="20.7">procedural coherence is equivalent to</tspan><tspan x="36" dy="20.7">human value.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="14" font-weight="normal"><tspan x="384" dy="0">There is a substantive case for</tspan><tspan x="384" dy="19.32">structure: reviewing a specific</tspan><tspan x="384" dy="19.32">experience teaches more than a vague</tspan><tspan x="384" dy="19.32">judgement. Here, we describe one habit</tspan><tspan x="384" dy="19.32">that helped us instead of calling the</tspan><tspan x="384" dy="19.32">whole year good or bad. The arrangement</tspan><tspan x="384" dy="19.32">earns its legitimacy through the</tspan><tspan x="384" dy="19.32">specific difficulty it alleviates, not</tspan><tspan x="384" dy="19.32">through its conformity to an abstract</tspan><tspan x="384" dy="19.32">ideal of order. Its success is</tspan><tspan x="384" dy="19.32">consequently conditional. Once the</tspan><tspan x="384" dy="19.32">intervention demands more attention than</tspan><tspan x="384" dy="19.32">the obstacle it removes, the original</tspan><tspan x="384" dy="19.32">justification begins to unravel.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="732" dy="0">An assessment confined to that practical</tspan><tspan x="732" dy="17.939999999999998">benefit would nevertheless be incomplete,</tspan><tspan x="732" dy="17.939999999999998">since a small next step is easier to act on</tspan><tspan x="732" dy="17.939999999999998">than a broad promise. In concrete terms, we</tspan><tspan x="732" dy="17.939999999999998">choose a ten-minute practice session and put</tspan><tspan x="732" dy="17.939999999999998">it on the calendar. This introduces a</tspan><tspan x="732" dy="17.939999999999998">problem of perspective: whose convenience</tspan><tspan x="732" dy="17.939999999999998">supplies the standard against which</tspan><tspan x="732" dy="17.939999999999998">improvement is measured? An apparently</tspan><tspan x="732" dy="17.939999999999998">neutral procedure may privilege the</tspan><tspan x="732" dy="17.939999999999998">preferences of its designer. Attentiveness</tspan><tspan x="732" dy="17.939999999999998">to others makes that asymmetry visible and</tspan><tspan x="732" dy="17.939999999999998">creates grounds for revision.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">What emerges is a qualified defence</tspan><tspan x="1080" dy="22.08">of planning, rather than a</tspan><tspan x="1080" dy="22.08">celebration of either control or</tspan><tspan x="1080" dy="22.08">spontaneity. Arrangements can</tspan><tspan x="1080" dy="22.08">sustain an experience without</tspan><tspan x="1080" dy="22.08">exhausting its meaning. Their</tspan><tspan x="1080" dy="22.08">authority should remain answerable</tspan><tspan x="1080" dy="22.08">to the people and circumstances</tspan><tspan x="1080" dy="22.08">they affect; otherwise, a means of</tspan><tspan x="1080" dy="22.08">making life more habitable risks</tspan><tspan x="1080" dy="22.08">becoming the criterion to which</tspan><tspan x="1080" dy="22.08">life must conform.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>