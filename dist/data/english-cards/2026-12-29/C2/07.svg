 font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2d382e"><tspan x="28" y="871.8299999999999">A: How should we make a realistic plan?</tspan><tspan x="28" y="903.3299999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="934.8299999999999">consequences.</tspan></text><text x="28" y="981.6299999999999" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2d382e"><tspan x="28" y="1008.9899999999999">Use this phrase in a friendly conversation. Listen to</tspan><tspan x="28" y="1040.4899999999998">the reply before asking your next question.</tspan></text><text x="28" y="1087.29" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2d382e"><tspan x="28" y="1114.6499999999999">A: How would you express this idea?</tspan><tspan x="28" y="1146.1499999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1177.6499999999999">consequences.</tspan><tspan x="28" y="1209.1499999999999">A: What does that mean here?</tspan><tspan x="28" y="1240.6499999999999">B: A useful way to keep an everyday conversation</tspan><tspan x="28" y="1272.1499999999999">clear and considerate.</tspan></text><text x="28" y="1318.95" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2d382e"><tspan x="28" y="1346.31">When might you say “I would distinguish between the</tspan><tspan x="28" y="1377.81">intention and its consequences.”?</tspan></text></svg>