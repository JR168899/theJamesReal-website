<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Looking back and looking ahead</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/12/29 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/notebook-next-to-a-calendar-20657557/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 20657557</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Looking back and looking ahead</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="160.0">When we make a realistic plan, a little care can make the experience better. Planning and</tspan><tspan x="42" y="186.91">thinking about other people both help.</tspan></text><text x="42" y="218.82" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="246.82">First, reviewing a specific experience teaches more than a vague judgement. For example, we</tspan><tspan x="42" y="273.73">describe one habit that helped us instead of calling the whole year good or bad. This is a small</tspan><tspan x="42" y="300.64">thing that makes the day easier.</tspan></text><text x="42" y="332.54999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="360.54999999999995">Second, a small next step is easier to act on than a broad promise. For example, we choose a</tspan><tspan x="42" y="387.4599999999999">ten-minute practice session and put it on the calendar. We do not need a perfect day to do this</tspan><tspan x="42" y="414.36999999999995">well.</tspan></text><text x="42" y="446.28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="474.28">We can make a realistic plan more easily when we prepare and notice other people. These</tspan><tspan x="42" y="501.18999999999994">simple steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="551.0999999999999">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="573.06">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="595.0199999999999">about an experience of your own.</tspan><tspan x="42" y="616.9799999999999">What two reasons support the main idea? Explain one example.</tspan></text></svg>