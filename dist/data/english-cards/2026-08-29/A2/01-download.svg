<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>leaf</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/08/29 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Leaves form a dense pattern of growth.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Leaves form a dense pattern of growth.</tspan></text><a href="https://www.pexels.com/photo/close-up-photography-green-leafed-plants-1420021/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1420021</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">leaf</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /lif/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: leaf; plural: leaves.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">a flat green part of a plant</tspan></text><text x="28" y="659.9695" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="687.4815000000001">plant blade; foliage unit</tspan></text><text x="28" y="734.5415" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="762.0535000000001">A green leaf has fallen onto the path.</tspan></text><text x="28" y="809.1135" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="836.6255000000001">Keep the sense and countability shown in the</tspan><tspan x="28" y="868.3005">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="899.9755000000001">the specific person, object or event being discussed.</tspan></text><text x="28" y="947.0355000000001" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="974.5475000000001">A: Why is this leaf yellow?</tspan><tspan x="28" y="1006.2225000000001">B: I am not sure. Let us check the plant.</tspan><tspan x="28" y="1037.8975">A: Should I pull it off now?</tspan><tspan x="28" y="1069.5725000000002">B: Wait until we know what is wrong.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">A leaf changes color. Suggest a careful first response</tspan><tspan x="28" y="1317.667">rather than guessing the cause. (Model: Check the</tspan><tspan x="28" y="1349.3419999999999">plant and its growing conditions before deciding what</tspan><tspan x="28" y="1381.017">to do.)</tspan></text></svg>