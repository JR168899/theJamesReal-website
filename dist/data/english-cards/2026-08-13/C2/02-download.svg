<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>asymmetry</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/08/13 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">asymmetry</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /eɪˈsɪmətri/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: asymmetry; plural: asymmetries.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">an imbalance or difference between corresponding</tspan><tspan x="28" y="644.5845">parts</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">imbalance; lack of symmetry</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">The discussion revealed an asymmetry between who</tspan><tspan x="28" y="825.4035">planned the event and who did the work.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Specify the unequal relation: asymmetry of</tspan><tspan x="28" y="931.6505">information, power or resources.</tspan></text><text x="28" y="978.7104999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1006.2225">A: Both sides signed, but did they negotiate on equal</tspan><tspan x="28" y="1037.8975">terms?</tspan><tspan x="28" y="1069.5725">B: There was a substantial asymmetry of information.</tspan><tspan x="28" y="1101.2475">A: One party knew the likely costs and the other did</tspan><tspan x="28" y="1132.9225">not?</tspan><tspan x="28" y="1164.5974999999999">B: Exactly. Formal agreement alone does not remove</tspan><tspan x="28" y="1196.2725">that imbalance.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Explain an information asymmetry without assuming</tspan><tspan x="28" y="1317.667">that both parties know the same facts. (Model: One</tspan><tspan x="28" y="1349.3419999999999">party has relevant knowledge that the other lacks,</tspan><tspan x="28" y="1381.017">affecting their ability to judge the arrangement.)</tspan></text></svg>