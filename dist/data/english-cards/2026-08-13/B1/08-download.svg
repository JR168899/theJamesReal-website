<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>brevity is the soul of wit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/08/13 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#2c3540"><tspan x="28" y="474.78">brevity is the soul of wit</tspan></text><text font-family="Arial, sans-serif" font-size="18.6" font-weight="400" fill="#2c3540"><tspan x="28" y="504.07500000000005">William Shakespeare · Hamlet, Act II, Scene 2 (First Folio) · Published</tspan><tspan x="28" y="526.767">1623</tspan></text><text x="28" y="577.545" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="605.8169999999999">Expressing an idea briefly can make it more effective</tspan><tspan x="28" y="638.3669999999998">or clever.</tspan></text><text x="28" y="686.727" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="714.9989999999999">Concise expression can be powerful; Wit often</tspan><tspan x="28" y="747.5489999999999">benefits from economy</tspan></text><text x="28" y="795.909" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="824.1809999999999">Instead of repeating the explanation, I give one clear</tspan><tspan x="28" y="856.7309999999999">sentence and wait for a reply.</tspan></text><text x="28" y="905.091" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="933.3629999999999">This is an excerpt from a speech by Polonius. His</tspan><tspan x="28" y="965.9129999999999">lengthy speech creates irony, so the dramatic context</tspan><tspan x="28" y="998.463">matters. The date refers to the First Folio publication.</tspan></text><text x="28" y="1046.823" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1075.095">Sky: Should we cut every sentence in half?</tspan><tspan x="28" y="1107.645">Michael: Brevity is useful only if the meaning</tspan><tspan x="28" y="1140.195">survives.</tspan><tspan x="28" y="1172.7450000000001">Sky: The line sounds simpler than the scene itself.</tspan><tspan x="28" y="1205.295">Michael: Yes. Polonius praises brevity while being</tspan><tspan x="28" y="1237.845">notably long-winded.</tspan></text><text x="28" y="1286.2050000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1314.477">Explain the irony of a long-winded character praising</tspan><tspan x="28" y="1347.027">brevity. (Model: The character&#x27;s own speech conflicts</tspan><tspan x="28" y="1379.577">with the concise speaking he praises.)</tspan></text></svg>