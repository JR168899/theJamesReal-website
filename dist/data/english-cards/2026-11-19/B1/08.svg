<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If music be the food of love, play on;</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/11/19 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People make music together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People make music together.</tspan></text><a href="https://www.pexels.com/photo/couple-playing-music-in-living-room-3978313/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3978313</text></a></svg><text font-family="Arial, sans-serif" font-size="43.24" font-weight="700" fill="#2c3540"><tspan x="28" y="475.24">If music be the food of love,</tspan><tspan x="28" y="529.29">play on;</tspan></text><text font-family="Arial, sans-serif" font-size="18.8" font-weight="400" fill="#2c3540"><tspan x="28" y="558.9">William Shakespeare · Twelfth Night, Act I, Scene 1 (First Folio) ·</tspan><tspan x="28" y="581.836">Published 1623</tspan></text><text x="28" y="633.16" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="661.7360000000001">The speaker imagines music as something that feeds</tspan><tspan x="28" y="694.6360000000001">or sustains a feeling of love.</tspan></text><text x="28" y="743.516" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="772.0920000000001">Music can nourish emotion; Sound is compared to</tspan><tspan x="28" y="804.9920000000001">emotional nourishment</tspan></text><text x="28" y="853.872" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="882.4480000000001">The melody changes the mood in the room, and we</tspan><tspan x="28" y="915.3480000000001">listen to the next phrase.</tspan></text><text x="28" y="964.228" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="992.8040000000001">Orsino speaks this line. Be is an older subjunctive</tspan><tspan x="28" y="1025.7040000000002">form here. Food of love is a metaphor, and the</tspan><tspan x="28" y="1058.604">speech goes on to complicate the speaker’s desire.</tspan></text><text x="28" y="1107.484" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="1136.06">A: Which line caught your attention?</tspan><tspan x="28" y="1168.96">B: “If music be the food of love, play on;”</tspan><tspan x="28" y="1201.86">A: How does that connect with the example?</tspan><tspan x="28" y="1234.76">B: Food nourishes a body; in the metaphor, music</tspan><tspan x="28" y="1267.6599999999999">nourishes an emotion.</tspan></text><text x="28" y="1316.54" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="1345.116">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1378.016">Which detail supports your explanation?</tspan></text></svg>