<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>value</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/11/10 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>value</title><desc>Original family-manga illustration: scales, related to value.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-60V59M-45 64H45M-63-34H63M-48-34L-70 18H-24ZM48-34L24 18H70Z" fill="#d9bf85"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">value</tspan></text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˈvælju/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.669999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Noun. Learn the word in the sense shown below.</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">the usefulness or benefit of something in</tspan><tspan x="28" y="663.3765000000001">relation to its cost</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">worth; usefulness</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">We consider the value of something before</tspan><tspan x="28" y="860.1795000000001">buying it.</tspan></text><text x="28" y="911.3995" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="941.3435000000001">Topic: Choosing with care. Write one sentence</tspan><tspan x="28" y="975.8185000000001">using this word. Check that your sentence</tspan><tspan x="28" y="1010.2935000000001">keeps the meaning shown above.</tspan></text><text x="28" y="1061.5135" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="1091.4575">A: What does “value” mean?</tspan><tspan x="28" y="1125.9325">B: It means the usefulness or benefit of</tspan><tspan x="28" y="1160.4075">something in relation to its cost.</tspan><tspan x="28" y="1194.8825">A: Can we use it at a neighbourhood market?</tspan><tspan x="28" y="1229.3575">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.76" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.58" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Which word means “the usefulness or benefit of</tspan><tspan x="28" y="1344.9965">something in relation to its cost”: value or</tspan><tspan x="28" y="1379.4715">durable? (Model: value)</tspan></text></svg>