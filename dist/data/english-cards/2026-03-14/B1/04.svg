<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>look into</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/03/14 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="478.69">look into</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="572.9835">examine or investigate</tspan></text><text x="28" y="625.7635" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="656.6195">investigate; examine</tspan></text><text x="28" y="709.3995" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="740.2555">We should look into another option.</tspan></text><text x="28" y="793.0355" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="823.8915">Keep the particle with the verb. Check a</tspan><tspan x="28" y="859.4164999999999">dictionary before changing its object or word</tspan><tspan x="28" y="894.9414999999999">order.</tspan></text><text x="28" y="947.7215" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="978.5775">A: How can we care for a plant?</tspan><tspan x="28" y="1014.1025">B: We should look into another option.</tspan><tspan x="28" y="1049.6275">A: That gives us a starting point.</tspan><tspan x="28" y="1085.1525">B: Let us try it together.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1291.096">Make a sentence of your own, then answer:</tspan><tspan x="28" y="1326.621">Explain “look into” in your own words, then use</tspan><tspan x="28" y="1362.146">it in a sentence about growing something small.</tspan></text></svg>