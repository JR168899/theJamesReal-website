<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/02/20 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A budget helps someone allow for costs and limits.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A budget helps someone allow for costs and limits.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">factor something in</tspan><tspan x="28" y="513.0">factor in something</tspan></text><text x="28" y="559.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="582.236">include something when making a judgement</tspan></text><text x="28" y="620.716" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="643.212">allow for; take into account</tspan></text><text x="28" y="681.692" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="704.188">We factor in the time other people need.</tspan></text><text x="28" y="742.668" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="765.164">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="791.064">changing its object or word order.</tspan></text><text x="28" y="829.544" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="852.04">A: How can we change our plans?</tspan><tspan x="28" y="877.9399999999999">B: We factor in the time other people need.</tspan><tspan x="28" y="903.8399999999999">A: That gives us a starting point.</tspan><tspan x="28" y="929.74">B: Let us try it together.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1278.336">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1304.236">Explain “factor in” in your own words, then use it in a sentence</tspan><tspan x="28" y="1330.136">about plans for a rainy day. (Model: It means to include</tspan><tspan x="28" y="1356.036">something when making a judgement. Example: We factor in</tspan><tspan x="28" y="1381.936">the time other people need.)</tspan></text></svg>