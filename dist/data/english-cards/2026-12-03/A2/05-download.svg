<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>on the same page</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/12/03 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">on the same page</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">in agreement or sharing an understanding</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="632.2765">in accord; of the same understanding</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="706.8485000000001">Are we on the same page about the plan?</tspan></text><text x="28" y="753.9085" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="781.4205000000001">Informal and figurative: sharing an understanding, not</tspan><tspan x="28" y="813.0955">necessarily complete agreement on every issue.</tspan></text><text x="28" y="860.1555" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="887.6675">A: I thought we were meeting at the library.</tspan><tspan x="28" y="919.3425">B: I meant the cafe beside it.</tspan><tspan x="28" y="951.0175">A: Let us make sure we are on the same page before</tspan><tspan x="28" y="982.6925">telling the others.</tspan><tspan x="28" y="1014.3675000000001">B: The cafe, at ten, by the window.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">A meeting message names two different places.</tspan><tspan x="28" y="1317.667">Rewrite it to put everyone on the same page. (Model:</tspan><tspan x="28" y="1349.3419999999999">We are meeting at the cafe beside the library at ten,</tspan><tspan x="28" y="1381.017">by the window.)</tspan></text></svg>