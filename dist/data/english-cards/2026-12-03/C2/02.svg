<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>asymmetry</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-12-03</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">asymmetry</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>asymmetry</title><desc>Original hand-drawn story illustration: scales, set within work. an imbalance or difference between corresponding parts</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M0-60V59M-45 64H45M-63-34H63M-48-34L-70 18H-24ZM48-34L24 18H70Z" fill="#d9bf85"/></g><g transform="translate(538 266) rotate(0) scale(0.52)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">asymmetry</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">an imbalance or difference between corresponding parts</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Topic: Working together. Write one sentence using this</tspan><tspan x="35" dy="24.839999999999996">word. Check that your sentence keeps the meaning shown</tspan><tspan x="35" dy="24.839999999999996">above.</tspan></text><text x="35" y="716.8799999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="741.4399999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: What does “asymmetry” mean?</tspan><tspan x="35" dy="24.839999999999996">B: It means an imbalance or difference between</tspan><tspan x="35" dy="24.839999999999996">corresponding parts.</tspan><tspan x="35" dy="24.839999999999996">A: Can we use it during a shared project?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. Let us think of a clear example.</tspan></text><text x="35" y="892.6399999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="917.1999999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Make a sentence of your own, then answer: Which word means</tspan><tspan x="35" dy="24.839999999999996">“an imbalance or difference between corresponding parts”:</tspan><tspan x="35" dy="24.839999999999996">asymmetry or subsidiarity?</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   02 OF 11</tspan></text></svg>