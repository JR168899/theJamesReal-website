<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Working together</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-12-03</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Working together</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Working together</title><desc>Original hand-drawn story illustration: people, set within work. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-2) scale(1.4)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><g transform="translate(94 266) rotate(2) scale(0.52)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Working together</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="36" dy="0">To finish a task together is to</tspan><tspan x="36" dy="20.7">negotiate a familiar but frequently</tspan><tspan x="36" dy="20.7">obscured relationship between</tspan><tspan x="36" dy="20.7">intentional design and the</tspan><tspan x="36" dy="20.7">contingencies of shared experience.</tspan><tspan x="36" dy="20.7">The question is not whether</tspan><tspan x="36" dy="20.7">arrangements are desirable, but what</tspan><tspan x="36" dy="20.7">authority they should acquire. A</tspan><tspan x="36" dy="20.7">credible position supports preparation</tspan><tspan x="36" dy="20.7">while withholding the assumption that</tspan><tspan x="36" dy="20.7">procedural coherence is equivalent to</tspan><tspan x="36" dy="20.7">human value.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="14" font-weight="normal"><tspan x="384" dy="0">There is a substantive case for</tspan><tspan x="384" dy="19.32">structure: clear responsibilities help</tspan><tspan x="384" dy="19.32">people know what to do. Here, we agree</tspan><tspan x="384" dy="19.32">who will prepare the notes and who will</tspan><tspan x="384" dy="19.32">check the figures. The arrangement earns</tspan><tspan x="384" dy="19.32">its legitimacy through the specific</tspan><tspan x="384" dy="19.32">difficulty it alleviates, not through</tspan><tspan x="384" dy="19.32">its conformity to an abstract ideal of</tspan><tspan x="384" dy="19.32">order. Its success is consequently</tspan><tspan x="384" dy="19.32">conditional. Once the intervention</tspan><tspan x="384" dy="19.32">demands more attention than the obstacle</tspan><tspan x="384" dy="19.32">it removes, the original justification</tspan><tspan x="384" dy="19.32">begins to unravel.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="732" dy="0">An assessment confined to that practical</tspan><tspan x="732" dy="17.939999999999998">benefit would nevertheless be incomplete,</tspan><tspan x="732" dy="17.939999999999998">since asking for help early prevents a small</tspan><tspan x="732" dy="17.939999999999998">problem from becoming a large one. In</tspan><tspan x="732" dy="17.939999999999998">concrete terms, we discuss an unclear</tspan><tspan x="732" dy="17.939999999999998">instruction before spending an hour on the</tspan><tspan x="732" dy="17.939999999999998">wrong task. This introduces a problem of</tspan><tspan x="732" dy="17.939999999999998">perspective: whose convenience supplies the</tspan><tspan x="732" dy="17.939999999999998">standard against which improvement is</tspan><tspan x="732" dy="17.939999999999998">measured? An apparently neutral procedure</tspan><tspan x="732" dy="17.939999999999998">may privilege the preferences of its</tspan><tspan x="732" dy="17.939999999999998">designer. Attentiveness to others makes that</tspan><tspan x="732" dy="17.939999999999998">asymmetry visible and creates grounds for</tspan><tspan x="732" dy="17.939999999999998">revision.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">What emerges is a qualified defence</tspan><tspan x="1080" dy="22.08">of planning, rather than a</tspan><tspan x="1080" dy="22.08">celebration of either control or</tspan><tspan x="1080" dy="22.08">spontaneity. Arrangements can</tspan><tspan x="1080" dy="22.08">sustain an experience without</tspan><tspan x="1080" dy="22.08">exhausting its meaning. Their</tspan><tspan x="1080" dy="22.08">authority should remain answerable</tspan><tspan x="1080" dy="22.08">to the people and circumstances</tspan><tspan x="1080" dy="22.08">they affect; otherwise, a means of</tspan><tspan x="1080" dy="22.08">making life more habitable risks</tspan><tspan x="1080" dy="22.08">becoming the criterion to which</tspan><tspan x="1080" dy="22.08">life must conform.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Make a sentence of your own, then answer: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>