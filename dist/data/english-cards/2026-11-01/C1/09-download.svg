roke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#382f40"><tspan x="28" y="478.0">Inversion after only then</tspan></text><text x="28" y="540.5" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="570.9">Put an auxiliary before the subject when Only</tspan><tspan x="28" y="605.9">then begins a sentence in this pattern.</tspan></text><text x="28" y="657.9" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="688.3">Only then did we understand the problem.</tspan></text><text x="28" y="740.3" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="770.6999999999999">Read the example together with the rule. Notice</tspan><tspan x="28" y="805.6999999999999">the verb form and keep the same pattern in</tspan><tspan x="28" y="840.6999999999999">your own sentence.</tspan></text><text x="28" y="892.6999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="923.0999999999999">A: Could you give me an example?</tspan><tspan x="28" y="958.0999999999999">B: Only then did we understand the problem.</tspan><tspan x="28" y="993.0999999999999">A: Which pattern does that use?</tspan><tspan x="28" y="1028.1">B: Put an auxiliary before the subject when</tspan><tspan x="28" y="1063.1">Only then begins a sentence in this pattern.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="1290.4">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1325.4">Complete: Only then ___ we understand the</tspan><tspan x="28" y="1360.4">problem. (Model: did)</tspan></text></svg>