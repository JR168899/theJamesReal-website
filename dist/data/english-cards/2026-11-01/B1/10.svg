<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What have you enjoyed reading lately?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/11/01 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader makes notes beside an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader makes notes beside an open book.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">What have you enjoyed</tspan><tspan x="28" y="533.43">reading lately?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="658.772">experience without assuming everyone shares it.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">What have you enjoyed reading lately?</tspan></text><text x="28" y="790.484" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="820.2760000000002">Follow the answer with a related question. Accept</tspan><tspan x="28" y="854.5760000000001">a different preference or a declined invitation</tspan><tspan x="28" y="888.8760000000002">without asking the person to justify it.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="969.6280000000002">A: Have you read anything you would</tspan><tspan x="28" y="1003.9280000000001">recommend?</tspan><tspan x="28" y="1038.228">B: A short book of travel stories.</tspan><tspan x="28" y="1072.5280000000002">A: What did you enjoy about it?</tspan><tspan x="28" y="1106.8280000000002">B: The writer notices small details rather than</tspan><tspan x="28" y="1141.1280000000002">rushing between landmarks.</tspan><tspan x="28" y="1175.428">A: Would you lend it to me when you finish?</tspan><tspan x="28" y="1209.728">B: Certainly. I have one chapter left.</tspan></text><text x="28" y="1260.688" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1290.48">Your friend recommends a book. Ask about what</tspan><tspan x="28" y="1324.78">they enjoyed rather than testing whether they</tspan><tspan x="28" y="1359.08">remember the plot.</tspan></text></svg>