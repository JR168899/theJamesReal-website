<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although and despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/12/22 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People continue a city journey in rainy weather.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People continue a city journey in rainy weather.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#382f40"><tspan x="28" y="479.15">Although and despite</tspan></text><text x="28" y="543.2125" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="574.3725000000001">Use although before a clause. Use despite</tspan><tspan x="28" y="610.2475000000001">before a noun or an -ing form.</tspan></text><text x="28" y="663.5475" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="694.7075000000001">Although the preparations took time, we</tspan><tspan x="28" y="730.5825000000001">enjoyed Christmas. Despite the extra work, we</tspan><tspan x="28" y="766.4575000000001">had time to talk.</tspan></text><text x="28" y="819.7575" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="850.9175000000001">Although introduces a clause with a subject</tspan><tspan x="28" y="886.7925000000001">and verb; despite takes a noun phrase or an</tspan><tspan x="28" y="922.6675000000001">-ing form. Avoid despite of.</tspan></text><text x="28" y="975.9675000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="1007.1275000000002">A: Was the train delay enough to cancel the</tspan><tspan x="28" y="1043.0025000000003">visit?</tspan><tspan x="28" y="1078.8775000000003">B: Although we arrived late, we still saw the</tspan><tspan x="28" y="1114.7525000000003">exhibition.</tspan><tspan x="28" y="1150.6275000000003">A: Did you have to hurry?</tspan><tspan x="28" y="1186.5025000000003">B: Yes, but despite the delay, the visit was</tspan><tspan x="28" y="1222.3775000000003">worthwhile.</tspan></text><text x="28" y="1275.6775000000002" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="1306.8375">Rewrite Although the train was late, we</tspan><tspan x="28" y="1342.7125">enjoyed the visit using despite. (Model: Despite</tspan><tspan x="28" y="1378.5875">the late train, we enjoyed the visit.)</tspan></text></svg>