<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually make a realistic plan?</title><rect width="660" height="1434" fill="#e3e1df"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#353331" stroke-width="1"/><text x="35" y="43" fill="#353331" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-12-22</tspan></text><text x="35" y="88" fill="#353331" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">How do you usually make a</tspan><tspan x="35" dy="41.4">realistic plan?</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>How do you usually make a realistic plan?</title><desc>Original hand-drawn story illustration: calendar, set within year. An open question that invites a person to describe a familiar experience.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><g transform="translate(538 266) rotate(-1) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">How do you usually make a realistic plan?</text></svg><text x="35" y="555.8" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An open question that invites a person to describe a</tspan><tspan x="35" dy="24.839999999999996">familiar experience.</tspan></text><text x="35" y="657.0399999999998" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="681.5999999999998" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: How do you usually make a realistic plan?</tspan><tspan x="35" dy="24.839999999999996">B: I treat the plan as provisional, rather than assuming</tspan><tspan x="35" dy="24.839999999999996">that its coherence guarantees a good experience.</tspan><tspan x="35" dy="24.839999999999996">A: What has helped you most?</tspan><tspan x="35" dy="24.839999999999996">B: For example, we describe one habit that helped us</tspan><tspan x="35" dy="24.839999999999996">instead of calling the whole year good or bad.</tspan></text><text x="35" y="857.6399999999998" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="882.1999999999997" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Write a reply of your own, then ask one related question.</tspan></text><text x="35" y="1406" fill="#353331" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">SMALLTALK   /   10 OF 11</tspan></text></svg>