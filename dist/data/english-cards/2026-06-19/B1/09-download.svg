<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>First conditional</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B1 - 2026/06/19 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="481.91">First conditional</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="582.7065000000001">Use if + present simple and will + base verb</tspan><tspan x="28" y="620.6815000000001">for a possible future result.</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="710.0855000000001">If we plan together, we will have more time to</tspan><tspan x="28" y="748.0605000000002">spend time with someone who cares for us.</tspan></text><text x="28" y="804.4805000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="837.4645000000002">Read the example together with the rule.</tspan><tspan x="28" y="875.4395000000002">Notice the verb form and keep the same</tspan><tspan x="28" y="913.4145000000002">pattern in your own sentence.</tspan></text><text x="28" y="969.8345000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1002.8185000000002">A: Could you give me an example?</tspan><tspan x="28" y="1040.7935000000002">B: If we plan together, we will have more</tspan><tspan x="28" y="1078.7685000000001">time to spend time with someone who cares</tspan><tspan x="28" y="1116.7435000000003">for us.</tspan><tspan x="28" y="1154.7185000000002">A: Which pattern does that use?</tspan><tspan x="28" y="1192.6935000000003">B: Use if + present simple and will + base</tspan><tspan x="28" y="1230.6685000000002">verb for a possible future result.</tspan></text><text x="28" y="1287.0885" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1320.0725000000002">Complete: If we plan together, we ___ have</tspan><tspan x="28" y="1358.0475000000001">more time. (Model: will)</tspan></text></svg>