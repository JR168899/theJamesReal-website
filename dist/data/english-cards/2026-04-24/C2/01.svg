<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intersubjective</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/04/24 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People can compare what each person means and understands.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People can compare what each person means and understands.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">intersubjective</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ˌɪntɚsəbˈdʒɛktɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Adjective: intersubjective; related noun: intersubjectivity</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">shared or established between different people’s</tspan><tspan x="28" y="644.5845">perspectives</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">shared between people; jointly understood</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">Their conversation created an intersubjective</tspan><tspan x="28" y="825.4035">understanding of the problem.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Topic: A conversation worth having. Write one</tspan><tspan x="28" y="931.6505">sentence using this word. Check that your sentence</tspan><tspan x="28" y="963.3255">keeps the meaning shown above.</tspan></text><text x="28" y="1010.3855" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8975">A: What does “intersubjective” mean?</tspan><tspan x="28" y="1069.5725">B: It means shared or established between different</tspan><tspan x="28" y="1101.2475">people’s perspectives.</tspan><tspan x="28" y="1132.9225000000001">A: Can we use it in a conversation?</tspan><tspan x="28" y="1164.5975">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Explain the meaning before looking at the model</tspan><tspan x="28" y="1317.667">answer. Which word means “shared or established</tspan><tspan x="28" y="1349.3419999999999">between different people’s perspectives”:</tspan><tspan x="28" y="1381.017">intersubjective or equivocation?</tspan></text></svg>