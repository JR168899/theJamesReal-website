"162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-65 36L-38 12L-2 12L24-7Q42-17 43-1L18 26H52Q73 24 72 38L27 62H-18L-42 77" fill="#d5ad8e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="42.32" font-weight="700" fill="#2c3540"><tspan x="28" y="474.32">A small decision matters</tspan><tspan x="28" y="527.22">when it helps someone else.</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="612.688">An original James Real learning reflection on</tspan><tspan x="28" y="644.888">practical consideration.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="720.696">An original James Real learning reflection on</tspan><tspan x="28" y="752.8960000000001">practical consideration</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="828.7040000000001">For example, we send a clear message about the</tspan><tspan x="28" y="860.9040000000001">new meeting place before anyone leaves home.</tspan></text><text x="28" y="908.7440000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="936.7120000000001">This is an original James Real learning reflection.</tspan><tspan x="28" y="968.9120000000001">Explain the idea in your own words rather than</tspan><tspan x="28" y="1001.1120000000001">treating it as a factual rule.</tspan></text><text x="28" y="1048.9520000000002" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="1076.9200000000003">A: How would you express this idea?</tspan><tspan x="28" y="1109.1200000000003">B: A small decision matters when it helps someone</tspan><tspan x="28" y="1141.3200000000004">else.</tspan><tspan x="28" y="1173.5200000000002">A: What does that mean here?</tspan><tspan x="28" y="1205.7200000000003">B: An original James Real learning reflection on</tspan><tspan x="28" y="1237.9200000000003">practical consideration.</tspan></text><text x="28" y="1285.7600000000002" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2c3540"><tspan x="28" y="1313.7280000000003">Which action in today’s topic illustrates this</tspan><tspan x="28" y="1345.9280000000003">reflection? (Model: We send a clear message about</tspan><tspan x="28" y="1378.1280000000004">the new meeting place before anyone leaves home.)</tspan></text></svg>