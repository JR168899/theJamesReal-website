<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Working together</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-12-04</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Working together</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Working together</title><desc>Original hand-drawn story illustration: people, set within work. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><g transform="translate(94 266) rotate(-1) scale(0.52)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Working together</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">There is more than one way to</tspan><tspan x="36" dy="23.459999999999997">finish a task together. In my</tspan><tspan x="36" dy="23.459999999999997">experience, practical preparation</tspan><tspan x="36" dy="23.459999999999997">and attention to others are two</tspan><tspan x="36" dy="23.459999999999997">useful starting points.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">One reason is that clear</tspan><tspan x="384" dy="23.459999999999997">responsibilities help people know</tspan><tspan x="384" dy="23.459999999999997">what to do. For instance, we</tspan><tspan x="384" dy="23.459999999999997">agree who will prepare the notes</tspan><tspan x="384" dy="23.459999999999997">and who will check the figures.</tspan><tspan x="384" dy="23.459999999999997">This prevents a small difficulty</tspan><tspan x="384" dy="23.459999999999997">from taking over the experience.</tspan><tspan x="384" dy="23.459999999999997">It also leaves us more time to</tspan><tspan x="384" dy="23.459999999999997">notice what is happening.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Another reason is that asking for</tspan><tspan x="732" dy="23.459999999999997">help early prevents a small</tspan><tspan x="732" dy="23.459999999999997">problem from becoming a large</tspan><tspan x="732" dy="23.459999999999997">one. For example, we discuss an</tspan><tspan x="732" dy="23.459999999999997">unclear instruction before</tspan><tspan x="732" dy="23.459999999999997">spending an hour on the wrong</tspan><tspan x="732" dy="23.459999999999997">task. This approach recognises</tspan><tspan x="732" dy="23.459999999999997">that the experience belongs to</tspan><tspan x="732" dy="23.459999999999997">more than one person and that</tspan><tspan x="732" dy="23.459999999999997">different people may need</tspan><tspan x="732" dy="23.459999999999997">different things.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">These examples show why</tspan><tspan x="1080" dy="23.459999999999997">preparation and consideration</tspan><tspan x="1080" dy="23.459999999999997">work well together. We do not</tspan><tspan x="1080" dy="23.459999999999997">have to control every detail. We</tspan><tspan x="1080" dy="23.459999999999997">can make a sensible arrangement</tspan><tspan x="1080" dy="23.459999999999997">and remain ready to respond.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Compare your first answer with this question: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>