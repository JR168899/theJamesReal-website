<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Working together</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - B1 - 2026/12/04 - 01 - Essay</tspan></text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>Working together</title><desc>Original family-manga illustration: people, related to Working together.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#76c6f3"/><path d="M-9 6L9 17L21 3"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">Working together</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#37322b"><tspan x="42" y="158.0">There is more than one way to finish a task together. In my experience, practical preparation and attention to</tspan><tspan x="42" y="182.57">others are two useful starting points.</tspan></text><text x="42" y="220.14" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#37322b"><tspan x="42" y="246.14">One reason is that clear responsibilities help people know what to do. For instance, we agree who will prepare the notes and who will check</tspan><tspan x="42" y="270.71">the figures. This prevents a small difficulty from taking over the experience. It also leaves us more time to notice what is happening.</tspan></text><text x="42" y="308.28" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#37322b"><tspan x="42" y="334.28">Another reason is that asking for help early prevents a small problem from becoming a large one. For example, we discuss an unclear</tspan><tspan x="42" y="358.84999999999997">instruction before spending an hour on the wrong task. This approach recognises that the experience belongs to more than one person and</tspan><tspan x="42" y="383.41999999999996">that different people may need different things.</tspan></text><text x="42" y="420.99" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#37322b"><tspan x="42" y="446.99">These examples show why preparation and consideration work well together. We do not have to control every detail. We can make a</tspan><tspan x="42" y="471.56">sensible arrangement and remain ready to respond.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="527.13">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete example. Conclude by connecting the two</tspan><tspan x="42" y="549.13">reasons without introducing a new argument. Use the structure as a model; write about an experience of your own.</tspan><tspan x="42" y="571.13">Compare your first answer with this question: What two reasons support the main idea? Explain one example. (Model: The two reasons are that clear responsibilities help</tspan><tspan x="42" y="593.13">people know what to do and that asking for help early prevents a small problem from becoming a large one. One example is that we agree who will prepare the notes and</tspan><tspan x="42" y="615.13">who will check the figures.)</tspan></text></svg>