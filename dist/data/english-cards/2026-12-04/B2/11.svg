<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Working together</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-12-04</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Working together</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Working together</title><desc>Original hand-drawn story illustration: people, set within work. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(2) scale(1.4)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><g transform="translate(94 266) rotate(-2) scale(0.52)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Working together</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A good way to finish a task</tspan><tspan x="36" dy="23.459999999999997">together combines practical</tspan><tspan x="36" dy="23.459999999999997">structure with an awareness of</tspan><tspan x="36" dy="23.459999999999997">other people. Neither a rigid</tspan><tspan x="36" dy="23.459999999999997">plan nor complete improvisation</tspan><tspan x="36" dy="23.459999999999997">is sufficient on its own; both</tspan><tspan x="36" dy="23.459999999999997">need to be judged in context.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="384" dy="0">The practical case is</tspan><tspan x="384" dy="22.08">straightforward: clear</tspan><tspan x="384" dy="22.08">responsibilities help people know</tspan><tspan x="384" dy="22.08">what to do. Consider how we agree</tspan><tspan x="384" dy="22.08">who will prepare the notes and who</tspan><tspan x="384" dy="22.08">will check the figures. The benefit</tspan><tspan x="384" dy="22.08">is not merely efficiency. A modest</tspan><tspan x="384" dy="22.08">arrangement prevents avoidable</tspan><tspan x="384" dy="22.08">confusion, leaving attention</tspan><tspan x="384" dy="22.08">available for the activity itself</tspan><tspan x="384" dy="22.08">rather than for problems that could</tspan><tspan x="384" dy="22.08">have been anticipated.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="732" dy="0">Consideration adds a second,</tspan><tspan x="732" dy="22.08">equally important dimension: asking</tspan><tspan x="732" dy="22.08">for help early prevents a small</tspan><tspan x="732" dy="22.08">problem from becoming a large one.</tspan><tspan x="732" dy="22.08">In this situation, we discuss an</tspan><tspan x="732" dy="22.08">unclear instruction before spending</tspan><tspan x="732" dy="22.08">an hour on the wrong task. A</tspan><tspan x="732" dy="22.08">decision can be convenient for one</tspan><tspan x="732" dy="22.08">person while creating difficulty</tspan><tspan x="732" dy="22.08">for another, so its value depends</tspan><tspan x="732" dy="22.08">partly on whose needs it</tspan><tspan x="732" dy="22.08">recognises.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">The most useful approach therefore</tspan><tspan x="1080" dy="22.08">brings structure and consideration</tspan><tspan x="1080" dy="22.08">together. Preparation establishes a</tspan><tspan x="1080" dy="22.08">workable starting point; attention</tspan><tspan x="1080" dy="22.08">to other people keeps it</tspan><tspan x="1080" dy="22.08">responsive. Success should be</tspan><tspan x="1080" dy="22.08">assessed by how well the</tspan><tspan x="1080" dy="22.08">arrangement serves the experience,</tspan><tspan x="1080" dy="22.08">rather than by how closely events</tspan><tspan x="1080" dy="22.08">follow the original plan.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Compare your first answer with this question: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>