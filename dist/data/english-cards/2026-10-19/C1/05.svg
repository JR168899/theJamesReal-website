<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/19 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>the devil is in the details</title><desc>Original family-manga illustration: train, related to the devil is in the details.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-65" y="-55" width="130" height="100" rx="20" fill="#59baf1"/><path d="M-49-37H-5V0H-49ZM9-37H49V0H9M-50 22H-32M32 22H50M-40 45L-58 72M40 45L58 72M-50 60H50"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#383426"><tspan x="28" y="475.47">the devil is in the details</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">small details can cause important difficulties</tspan></text><text x="28" y="612.4005000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="641.1285000000001">small points can cause big problems; careful</tspan><tspan x="28" y="674.2035000000002">execution matters</tspan></text><text x="28" y="723.3435000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="752.0715000000001">The broad idea is sound, but the devil is in the</tspan><tspan x="28" y="785.1465000000002">details.</tspan></text><text x="28" y="834.2865" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="863.0145000000001">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="896.0895000000002">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="945.2295" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="973.9575000000001">A: How would you express this idea?</tspan><tspan x="28" y="1007.0325000000001">B: the devil is in the details</tspan><tspan x="28" y="1040.1075">A: What does that mean here?</tspan><tspan x="28" y="1073.1825000000001">B: small details can cause important difficulties</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Review without reading the example first. What does</tspan><tspan x="28" y="1320.923">“the devil is in the details” mean in this example? The</tspan><tspan x="28" y="1353.998">broad idea is sound, but the devil is in the details.</tspan></text></svg>