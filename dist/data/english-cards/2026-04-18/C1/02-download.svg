<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>externality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/04/18 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People on foot share the city with vehicles and other road users.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People on foot share the city with vehicles and other road users.</tspan></text><a href="https://www.pexels.com/photo/people-walking-on-pedestrian-lane-during-daytime-109919/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 109919</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">externality</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˌɛkstɚˈnæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Singular: externality; plural: externalities.</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">a consequence of an activity that affects people not</tspan><tspan x="28" y="653.9805000000001">directly involved in it</tspan></text><text x="28" y="703.1205" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="731.8485000000001">spillover effect; indirect cost or benefit</tspan></text><text x="28" y="780.9885" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="809.7165000000001">Traffic noise is an externality that affects nearby</tspan><tspan x="28" y="842.7915000000002">residents.</tspan></text><text x="28" y="891.9315" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="920.6595000000001">Topic: Earth Day in everyday choices. Write one</tspan><tspan x="28" y="953.7345000000001">sentence using this word. Check that your sentence</tspan><tspan x="28" y="986.8095000000001">keeps the meaning shown above.</tspan></text><text x="28" y="1035.9495" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1064.6775">A: What does “externality” mean?</tspan><tspan x="28" y="1097.7525">B: It means a consequence of an activity that affects</tspan><tspan x="28" y="1130.8275">people not directly involved in it.</tspan><tspan x="28" y="1163.9025">A: Can we use it during an Earth Day activity?</tspan><tspan x="28" y="1196.9775">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Which word means “a consequence of an activity</tspan><tspan x="28" y="1320.923">that affects people not directly involved in it”:</tspan><tspan x="28" y="1353.998">externality or interdependence? (Model: externality)</tspan></text></svg>