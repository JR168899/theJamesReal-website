<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>recycle</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/04/18 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">recycle</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /riˈsaɪkəl/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">recycle · recycles · recycled · recycled · recycling (base · third</tspan><tspan x="28" y="574.6075000000001">person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to process used material so it can be made into</tspan><tspan x="28" y="697.6660999999999">something useful</tspan></text><text x="28" y="750.4461" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="781.3021">reprocess; recover materials</tspan></text><text x="28" y="834.0821" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="864.9381">We recycle the clean paper after the activity.</tspan></text><text x="28" y="917.7180999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="948.5740999999999">Use the verb in the sense shown in the</tspan><tspan x="28" y="984.0990999999999">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1019.6241">object; the word forms above show its changes.</tspan></text><text x="28" y="1072.4041" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1103.2601">A: Does this go in the recycling bin?</tspan><tspan x="28" y="1138.7851">B: Let us check the local guide.</tspan><tspan x="28" y="1174.3101">A: I thought all packaging could be recycled.</tspan><tspan x="28" y="1209.8351">B: Not in every collection system.</tspan></text><text x="28" y="1262.6151" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1293.4711">Before recycling unfamiliar packaging, what</tspan><tspan x="28" y="1328.9961">should you check? (Model: The local collection</tspan><tspan x="28" y="1364.5211">rules for that material.)</tspan></text></svg>