<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sustainable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/04/18 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="40.71000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="472.71000000000004">sustainable</tspan></text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="507.6675">US /səˈsteɪnəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.470000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="532.5891">sustainable · more sustainable · most sustainable; noun: sustainability</tspan></text><text x="28" y="582.0075" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="608.9115">able to continue over time without exhausting</tspan><tspan x="28" y="639.8865000000001">resources</tspan></text><text x="28" y="685.9065" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="712.8105">maintainable; viable over time</tspan></text><text x="28" y="758.8305" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="785.7345">A sustainable routine leaves time for rest.</tspan></text><text x="28" y="831.7545" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="858.6585">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="889.6335">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="920.6085">description rather than using it as a general</tspan><tspan x="28" y="951.5835">compliment.</tspan></text><text x="28" y="997.6035" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1024.5075000000002">Aoede: We managed an hour every evening this</tspan><tspan x="28" y="1055.4825">week.</tspan><tspan x="28" y="1086.4575000000002">Echo: But is that pace sustainable once work gets</tspan><tspan x="28" y="1117.4325000000001">busy?</tspan><tspan x="28" y="1148.4075000000003">Aoede: Probably not. Twenty minutes would be easier</tspan><tspan x="28" y="1179.3825000000002">to maintain.</tspan><tspan x="28" y="1210.3575">Echo: Then let us build the routine around that.</tspan></text><text x="28" y="1258.16" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.064">A learner studies three hours daily, becomes</tspan><tspan x="28" y="1316.039">exhausted and stops. Propose a more sustainable</tspan><tspan x="28" y="1347.0140000000001">arrangement. (Model: A shorter regular session with</tspan><tspan x="28" y="1377.989">time to rest would be easier to maintain.)</tspan></text></svg>