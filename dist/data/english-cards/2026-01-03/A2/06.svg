<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a piece of cake</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/01/03 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">a piece of cake</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="584.04">something very easy; informal</tspan></text><text x="28" y="641.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="674.68">a breeze; very easy</tspan></text><text x="28" y="731.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="765.3199999999999">The first step was a piece of cake.</tspan></text><text x="28" y="822.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="855.9599999999999">Learn the whole expression. It is figurative</tspan><tspan x="28" y="894.4599999999999">language, so a word-for-word interpretation</tspan><tspan x="28" y="932.9599999999999">may be misleading.</tspan></text><text x="28" y="990.16" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1023.5999999999999">A: How would you express this idea?</tspan><tspan x="28" y="1062.1">B: a piece of cake</tspan><tspan x="28" y="1100.6">A: What does that mean here?</tspan><tspan x="28" y="1139.1">B: something very easy; informal</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1295.04">Try it. What does “a piece of cake” mean in</tspan><tspan x="28" y="1333.54">this example? The first step was a piece of</tspan><tspan x="28" y="1372.04">cake.</tspan></text></svg>