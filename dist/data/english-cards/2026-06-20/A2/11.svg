<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Making time for a shared activity</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/06/20 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-holding-their-child-5276077/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 5276077</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Making time for a shared activity</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="163.0">When we spend time with someone who cares for us, a little care can make the</tspan><tspan x="42" y="193.42">experience better. Planning and thinking about other people both help.</tspan></text><text x="42" y="225.84" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="256.84000000000003">First, a simple shared activity creates space for conversation. For example, we choose</tspan><tspan x="42" y="287.26000000000005">a short walk that suits everyone’s pace. This is a small thing that makes the day easier.</tspan></text><text x="42" y="319.68" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="350.68">Second, attention matters more than an elaborate plan. For example, we put our phones</tspan><tspan x="42" y="381.1">away and ask about a familiar memory. We do not need a perfect day to do this well.</tspan></text><text x="42" y="413.52" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="444.52">We can spend time with someone who cares for us more easily when we prepare and</tspan><tspan x="42" y="474.94">notice other people. These simple steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="525.36">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="547.32">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="569.28">about an experience of your own.</tspan><tspan x="42" y="591.24">Try it. What two reasons support the main idea? Explain one example.</tspan></text></svg>