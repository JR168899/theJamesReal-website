<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/06/20 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="472.48">There is nothing in the world so</tspan><tspan x="28" y="523.08">irresistibly contagious as</tspan><tspan x="28" y="573.6800000000001">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="17.6" font-weight="400" fill="#2c3540"><tspan x="28" y="601.4">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="649.8" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="676.5519999999999">A cheerful mood can spread from one person to</tspan><tspan x="28" y="707.3519999999999">others.</tspan></text><text x="28" y="753.112" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="779.8639999999999">Laughter can spread through a group; Good spirits</tspan><tspan x="28" y="810.6639999999999">can influence the people nearby</tspan></text><text x="28" y="856.424" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="883.1759999999999">One guest starts laughing at a gentle joke, and soon</tspan><tspan x="28" y="913.9759999999999">the whole table is smiling.</tspan></text><text x="28" y="959.736" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="986.4879999999999">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="1017.2879999999999">spreading, rather than an infection. The original</tspan><tspan x="28" y="1048.088">spelling good-humour is retained.</tspan></text><text x="28" y="1093.848" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1120.6000000000001">A: What do you think of this line?</tspan><tspan x="28" y="1151.4">B: It makes me think about our example.</tspan><tspan x="28" y="1182.2">A: Which part?</tspan><tspan x="28" y="1213.0000000000002">B: One guest starts laughing at a gentle joke, and</tspan><tspan x="28" y="1243.8000000000002">soon the whole table is smiling.</tspan></text><text x="28" y="1289.56" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1316.3120000000001">Which action in the example connects with the</tspan><tspan x="28" y="1347.112">quotation? (Model: The example shows one person’s</tspan><tspan x="28" y="1377.912">cheerful reaction affecting the rest of the group.)</tspan></text></svg>