<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/10/29 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A new day begins with getting up and preparing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A new day begins with getting up and preparing.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">get ready</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="568.1220000000001">prepare yourself</tspan></text><text x="28" y="619.082" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="648.8740000000001">prepare; make preparations</tspan></text><text x="28" y="699.834" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="729.6260000000001">We get ready before we leave as we prepare for</tspan><tspan x="28" y="763.926">Halloween.</tspan></text><text x="28" y="814.886" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="844.6780000000001">Keep the particle with the verb. Check a</tspan><tspan x="28" y="878.9780000000001">dictionary before changing its object or word</tspan><tspan x="28" y="913.2780000000001">order.</tspan></text><text x="28" y="964.2379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="994.0300000000001">A: How can we prepare a Halloween evening?</tspan><tspan x="28" y="1028.3300000000002">B: We get ready before we leave.</tspan><tspan x="28" y="1062.63">A: That gives us a starting point.</tspan><tspan x="28" y="1096.93">B: Let us try it together.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">For Halloween, look again. Explain “get ready” in</tspan><tspan x="28" y="1323.772">your own words, then use it in a sentence about</tspan><tspan x="28" y="1358.072">a halloween evening that welcomes everyone.</tspan></text></svg>