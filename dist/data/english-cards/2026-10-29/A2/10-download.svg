<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Do you like Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A2 - 2026/10/29 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A seasonal display combines treats and Halloween decorations.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A seasonal display combines treats and Halloween decorations.</tspan></text><a href="https://www.pexels.com/photo/halloween-candy-display-with-pumpkin-bucket-29111982/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 29111982</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#353331"><tspan x="28" y="473.86">Do you like Halloween?</tspan></text><text x="28" y="530.7349999999999" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="558.399">An opening that invites a personal preference or</tspan><tspan x="28" y="590.249">experience without assuming everyone shares it.</tspan></text><text x="28" y="637.569" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="665.2330000000001">Do you like Halloween?</tspan></text><text x="28" y="712.5530000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="740.2170000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="772.0670000000001">different preference or a declined invitation without</tspan><tspan x="28" y="803.9170000000001">asking the person to justify it.</tspan></text><text x="28" y="851.2370000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="878.9010000000002">Bella: Do you like Halloween?</tspan><tspan x="28" y="910.7510000000002">Fenrir: I like carving pumpkins.</tspan><tspan x="28" y="942.6010000000002">Bella: Do you like scary houses?</tspan><tspan x="28" y="974.4510000000002">Fenrir: Not really. I prefer a quiet evening.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1286.224">Your neighbor does not celebrate Halloween. Give a</tspan><tspan x="28" y="1318.0739999999998">friendly reply and ask about the weekend. (Model:</tspan><tspan x="28" y="1349.924">That is fine. Do you have any plans for the weekend?)</tspan></text></svg>