<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/29 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cauldron is a large pot, the object named in the witches’ chant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cauldron is a large pot, the object named in the witches’ chant.</tspan></text><a href="https://www.pexels.com/photo/vintage-cauldron-on-rustic-background-showcasing-age-33635613/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 33635613</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="473.4">Double, double toil and</tspan><tspan x="28" y="525.15">trouble;</tspan><tspan x="28" y="576.9">Fire burn, and cauldron</tspan><tspan x="28" y="628.65">bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="18.000000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="657.0">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published</tspan><tspan x="28" y="678.96">1623</tspan></text><text x="28" y="728.1" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="755.46">The repeated sounds create the atmosphere of a</tspan><tspan x="28" y="786.96">fictional spell.</tspan></text><text x="28" y="833.76" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="861.1200000000001">A rhythmic chant builds a supernatural mood;</tspan><tspan x="28" y="892.6200000000001">Repeated words create a dramatic incantation</tspan></text><text x="28" y="939.42" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="966.78">At the costume gathering, we read the lines as a</tspan><tspan x="28" y="998.28">piece of theater rather than a real instruction.</tspan></text><text x="28" y="1045.0800000000002" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1072.44">The witches chant these lines in the play. Toil means</tspan><tspan x="28" y="1103.94">hard work; cauldron means a large pot. The date</tspan><tspan x="28" y="1135.44">refers to publication, not to a recorded spoken event.</tspan></text><text x="28" y="1182.2400000000002" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1209.6000000000001">A: What is a cauldron?</tspan><tspan x="28" y="1241.1000000000001">B: A large pot.</tspan><tspan x="28" y="1272.6000000000001">A: Are these words from a real instruction book?</tspan><tspan x="28" y="1304.1000000000001">B: No. They are spoken by witches in a play.</tspan></text><text x="28" y="1350.9000000000003" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1378.2600000000002">What object is named by cauldron?</tspan></text></svg>