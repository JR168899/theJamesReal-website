<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A Halloween evening that welcomes everyone</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/10/29 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A costume creates a playful Halloween character.</tspan></text><a href="https://www.pexels.com/photo/spooky-pumpkin-head-cosplay-in-urban-garden-29225548/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 29225548</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A Halloween evening that welcomes everyone</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="160.0">When we prepare a Halloween evening, a little care can make the experience better. Planning</tspan><tspan x="42" y="186.91">and thinking about other people both help.</tspan></text><text x="42" y="218.82" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="246.82">First, planning the route and the costumes helps everyone stay comfortable. For example, we</tspan><tspan x="42" y="273.73">check that costumes allow clear vision and choose a well-lit route. This is a small thing that</tspan><tspan x="42" y="300.64">makes the day easier.</tspan></text><text x="42" y="332.54999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="360.54999999999995">Second, clear choices make sharing treats more considerate. For example, we keep ingredient</tspan><tspan x="42" y="387.4599999999999">information available and offer a non-food option. We do not need a perfect day to do this well.</tspan></text><text x="42" y="419.36999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="447.36999999999995">We can prepare a Halloween evening more easily when we prepare and notice other people.</tspan><tspan x="42" y="474.28">These simple steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="524.1899999999999">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="546.15">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="568.1099999999999">argument rather than introduce a new proposal.</tspan><tspan x="42" y="590.0699999999999">Write about how you can prepare a Halloween evening. Give two small steps. Use four short paragraphs: introduction, two</tspan><tspan x="42" y="612.03">developed points, and conclusion.</tspan></text></svg>