<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/29 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pumpkins show their rounded forms and thick skins.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pumpkins show their rounded forms and thick skins.</tspan></text><a href="https://www.pexels.com/photo/vibrant-harvest-pumpkins-for-autumn-decor-38757012/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 38757012</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">What would you like to do for</tspan><tspan x="28" y="529.8075">Halloween?</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="617.5980000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="650.6730000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="728.541">What would you like to do for Halloween?</tspan></text><text x="28" y="777.6809999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="806.409">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="839.484">different preference or a declined invitation without</tspan><tspan x="28" y="872.559">asking the person to justify it.</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="950.427">A: What would you like to do for Halloween, if</tspan><tspan x="28" y="983.5020000000001">anything?</tspan><tspan x="28" y="1016.577">B: Something low-key. I am not really into haunted</tspan><tspan x="28" y="1049.652">houses.</tspan><tspan x="28" y="1082.727">A: How about carving a pumpkin and making dinner?</tspan><tspan x="28" y="1115.8020000000001">B: That sounds more like me. Have you tried an</tspan><tspan x="28" y="1148.877">elaborate design?</tspan><tspan x="28" y="1181.952">A: Once. It collapsed before we finished eating.</tspan><tspan x="28" y="1215.027">B: Then let us choose a face we can actually finish.</tspan></text><text x="28" y="1264.167" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1292.895">Your neighbor says they do not celebrate Halloween.</tspan><tspan x="28" y="1325.97">Acknowledge that and smoothly open another topic.</tspan></text></svg>