<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although and despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/12/21 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations mark a Christmas gathering.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations mark a Christmas gathering.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="480.99">Although and despite</tspan></text><text x="28" y="547.5525" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="579.9285000000001">Use although before a clause. Use despite</tspan><tspan x="28" y="617.2035000000001">before a noun or an -ing form.</tspan></text><text x="28" y="672.5835000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="704.9595000000002">Although the preparations took time, we</tspan><tspan x="28" y="742.2345000000001">enjoyed Christmas. Despite the extra work,</tspan><tspan x="28" y="779.5095000000001">we had time to talk.</tspan></text><text x="28" y="834.8895000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="867.2655000000002">Read the example together with the rule.</tspan><tspan x="28" y="904.5405000000002">Notice the verb form and keep the same</tspan><tspan x="28" y="941.8155000000002">pattern in your own sentence.</tspan></text><text x="28" y="997.1955000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1029.5715000000002">A: Could you give me an example?</tspan><tspan x="28" y="1066.8465000000003">B: Although the preparations took time, we</tspan><tspan x="28" y="1104.1215000000002">enjoyed Christmas. Despite the extra work,</tspan><tspan x="28" y="1141.3965000000003">we had time to talk.</tspan><tspan x="28" y="1178.6715000000004">A: Which pattern does that use?</tspan><tspan x="28" y="1215.9465000000002">B: Use although before a clause. Use</tspan><tspan x="28" y="1253.2215000000003">despite before a noun or an -ing form.</tspan></text><text x="28" y="1308.6015000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1340.9775000000002">Choose: Although / Despite the extra work,</tspan><tspan x="28" y="1378.2525000000003">we had time to talk. (Model: Despite)</tspan></text></svg>