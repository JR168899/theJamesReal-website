<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I will honour Christmas in my heart, and try to keep it all the year.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/12/21 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations mark a Christmas gathering.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations mark a Christmas gathering.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="39.330000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="471.33">I will honour Christmas in my</tspan><tspan x="28" y="520.4925">heart, and try to keep it all the</tspan><tspan x="28" y="569.655">year.</tspan></text><text font-family="Arial, sans-serif" font-size="17.1" font-weight="400" fill="#2c3540"><tspan x="28" y="596.5875">Charles Dickens · A Christmas Carol, Stave Four · Published 1843</tspan></text><text x="28" y="643.6124999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="669.6044999999999">The speaker promises to carry the spirit of a celebration</tspan><tspan x="28" y="699.5294999999999">into ordinary life.</tspan></text><text x="28" y="743.9894999999998" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="769.9814999999999">Keep practicing generosity beyond the holiday; Let an</tspan><tspan x="28" y="799.9064999999998">occasion influence everyday conduct</tspan></text><text x="28" y="844.3664999999997" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="870.3584999999998">After the gathering, we continue checking whether our</tspan><tspan x="28" y="900.2834999999998">neighbor needs help.</tspan></text><text x="28" y="944.7434999999997" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="970.7354999999998">Scrooge speaks this line after confronting the</tspan><tspan x="28" y="1000.6604999999997">consequences of his conduct. The quotation expresses</tspan><tspan x="28" y="1030.5854999999997">his resolution; it is not a statement that everyone</tspan><tspan x="28" y="1060.5104999999999">celebrates the holiday.</tspan></text><text x="28" y="1104.9705" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1130.9624999999999">A: Which line caught your attention?</tspan><tspan x="28" y="1160.8874999999998">B: “I will honour Christmas in my heart, and try to keep it</tspan><tspan x="28" y="1190.8124999999998">all the year.”</tspan><tspan x="28" y="1220.7375">A: How does that connect with the example?</tspan><tspan x="28" y="1250.6625">B: Continuing to help after the occasion turns a seasonal</tspan><tspan x="28" y="1280.5874999999999">promise into an everyday action.</tspan></text><text x="28" y="1325.0475" font-family="Arial, sans-serif" font-size="13.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.94" font-weight="400" fill="#2c3540"><tspan x="28" y="1351.0394999999999">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1380.9644999999998">Which detail supports your explanation?</tspan></text></svg>