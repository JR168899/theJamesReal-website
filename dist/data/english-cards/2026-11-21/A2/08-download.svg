99999997" font-weight="400" fill="#2c3540"><tspan x="28" y="839.484">For example, each friend chooses one track and</tspan><tspan x="28" y="872.5590000000001">explains what they enjoy about it.</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="950.427">This is an original James Real learning reflection.</tspan><tspan x="28" y="983.5020000000001">Explain the idea in your own words rather than</tspan><tspan x="28" y="1016.577">treating it as a factual rule.</tspan></text><text x="28" y="1065.7169999999999" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1094.445">A: How would you express this idea?</tspan><tspan x="28" y="1127.52">B: A little care can make a day easier.</tspan><tspan x="28" y="1160.595">A: What does that mean here?</tspan><tspan x="28" y="1193.6699999999998">B: An original James Real learning reflection on</tspan><tspan x="28" y="1226.745">practical consideration.</tspan></text><text x="28" y="1275.8849999999998" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1304.6129999999998">Tell a friend. Which action in today’s topic illustrates</tspan><tspan x="28" y="1337.6879999999999">this reflection? (Model: Each friend chooses one</tspan><tspan x="28" y="1370.763">track and explains what they enjoy about it.)</tspan></text></svg>