<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/11/21 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A new day begins with getting up and preparing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A new day begins with getting up and preparing.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="468.8">get ready</tspan></text><text x="28" y="518.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="543.12">prepare yourself</tspan></text><text x="28" y="584.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="609.04">prepare; make preparations</tspan></text><text x="28" y="650.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="674.9599999999999">We get ready before we leave as we prepare for Thanksgiving.</tspan></text><text x="28" y="716.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="740.8799999999999">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="768.8799999999999">changing its object or word order.</tspan></text><text x="28" y="810.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="834.7999999999998">A: How can we share a Thanksgiving meal?</tspan><tspan x="28" y="862.7999999999998">B: We get ready before we leave.</tspan><tspan x="28" y="890.7999999999998">A: That gives us a starting point.</tspan><tspan x="28" y="918.7999999999998">B: Let us try it together.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1281.1200000000001">For Thanksgiving, read, then answer. Explain “get ready” in</tspan><tspan x="28" y="1309.1200000000001">your own words, then use it in a sentence about a thanksgiving</tspan><tspan x="28" y="1337.1200000000001">table with space to listen. (Model: It means to prepare yourself.</tspan><tspan x="28" y="1365.1200000000001">Example: We get ready before we leave.)</tspan></text></svg>