<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Listening without distraction</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-11-21 · A2 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>Listening without distraction</title><desc>Original family-manga illustration: dialogue, related to Listening without distraction.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">Listening without distraction</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="163.0">When we listen to a whole album, a little care can make the experience better. Planning and</tspan><tspan x="42" y="193.42">thinking about other people both help.</tspan></text><text x="42" y="231.84" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="262.84000000000003">First, setting aside distractions lets us notice more of the music. For example, we put the phone away during the first</tspan><tspan x="42" y="293.26000000000005">song. This is a small thing that makes the day easier.</tspan></text><text x="42" y="331.68" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="362.68">Second, sharing different preferences makes listening more interesting. For example, each friend chooses one track</tspan><tspan x="42" y="393.1">and explains what they enjoy about it. We do not need a perfect day to do this well.</tspan></text><text x="42" y="431.52" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="462.52">We can listen to a whole album more easily when we prepare and notice other people. These simple steps give us a</tspan><tspan x="42" y="492.94">useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="549.36">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete example. Conclude by connecting the two</tspan><tspan x="42" y="571.36">reasons without introducing a new argument. Use the structure as a model; write about an experience of your own.</tspan><tspan x="42" y="593.36">Tell a friend. What two reasons support the main idea? Explain one example. (Model: The two reasons are that setting aside distractions lets us notice more of the music</tspan><tspan x="42" y="615.36">and that sharing different preferences makes listening more interesting. One example is that we put the phone away during the first song.)</tspan></text></svg>