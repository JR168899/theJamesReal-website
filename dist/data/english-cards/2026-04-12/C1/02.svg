<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>adaptable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/04/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A chair is positioned in a sunlit room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A chair is positioned in a sunlit room.</tspan></text><a href="https://www.pexels.com/photo/wooden-chair-in-an-empty-room-in-sunlight-10780943/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 10780943</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">adaptable</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /əˈdæptəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">adaptable · more adaptable · most adaptable; noun:</tspan><tspan x="28" y="571.7974999999999">adaptability</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">able to change to suit different needs</tspan></text><text x="28" y="709.3463" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="739.5943000000001">flexible; versatile</tspan></text><text x="28" y="791.3343000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="821.5823000000001">An adaptable room can be used for work or</tspan><tspan x="28" y="856.4073000000002">rest.</tspan></text><text x="28" y="908.1473000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953000000001">The adjective describes a person, thing or</tspan><tspan x="28" y="973.2203000000002">situation. Choose a concrete noun or context</tspan><tspan x="28" y="1008.0453000000001">that supports the description rather than using it</tspan><tspan x="28" y="1042.8703">as a general compliment.</tspan></text><text x="28" y="1094.6103000000003" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1124.8583">A: Will this room still work for a workshop?</tspan><tspan x="28" y="1159.6833000000001">B: The furniture is adaptable; the tables fold</tspan><tspan x="28" y="1194.5083000000002">and the seats move easily.</tspan><tspan x="28" y="1229.3333">A: So we can change the layout?</tspan><tspan x="28" y="1264.1583">B: Yes, without rebuilding the room.</tspan></text><text x="28" y="1315.8983000000003" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1346.1463">Name one feature that makes a room</tspan><tspan x="28" y="1380.9713000000002">adaptable for different activities.</tspan></text></svg>