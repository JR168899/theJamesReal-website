<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/04/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A visual explanation can help people check a shared understanding.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A visual explanation can help people check a shared understanding.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#2d382e"><tspan x="28" y="477.08">Let me check that I</tspan><tspan x="28" y="533.43">understand.</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="624.4720000000001">A way to confirm your understanding before</tspan><tspan x="28" y="658.772">continuing a conversation.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="739.5240000000001">Let me make sure I have this right.; Can I confirm</tspan><tspan x="28" y="773.8240000000001">what you mean?</tspan></text><text x="28" y="824.784" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="854.5760000000001">A: How should we arrange a room?</tspan><tspan x="28" y="888.8760000000001">B: Let me check that I understand.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="969.6280000000002">Use this phrase in a friendly conversation. Listen</tspan><tspan x="28" y="1003.9280000000001">to the reply before asking your next question.</tspan></text><text x="28" y="1054.8880000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="1084.68">A: How would you express this idea?</tspan><tspan x="28" y="1118.98">B: Let me check that I understand.</tspan><tspan x="28" y="1153.28">A: What does that mean here?</tspan><tspan x="28" y="1187.5800000000002">B: A way to confirm your understanding before</tspan><tspan x="28" y="1221.88">continuing a conversation.</tspan></text><text x="28" y="1272.8400000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2d382e"><tspan x="28" y="1302.632">Compare your first answer with this question:</tspan><tspan x="28" y="1336.932">When might you say “Let me check that I</tspan><tspan x="28" y="1371.232">understand.”?</tspan></text></svg>