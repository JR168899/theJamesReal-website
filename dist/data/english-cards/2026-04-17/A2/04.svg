<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>find out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/04/17 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Reference books are arranged together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Reference books are arranged together.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">find something out</tspan><tspan x="28" y="544.5">find out something</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="646.54">learn a fact</tspan></text><text x="28" y="703.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="737.18">discover; learn</tspan></text><text x="28" y="794.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="827.8199999999999">Let us find out what we need.</tspan></text><text x="28" y="885.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="918.4599999999999">Find out usually means discovering</tspan><tspan x="28" y="956.9599999999999">information. Use find for locating a physical</tspan><tspan x="28" y="995.4599999999999">object: find the keys.</tspan></text><text x="28" y="1052.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1086.1">A: Do children need a ticket?</tspan><tspan x="28" y="1124.6">B: I do not know. I will find out.</tspan><tspan x="28" y="1163.1">A: Could you check the age limit too?</tspan><tspan x="28" y="1201.6">B: Yes. I will ask the organizer.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1295.04">You need the event&#x27;s age limit and ticket</tspan><tspan x="28" y="1333.54">rule. Write one specific question to find out</tspan><tspan x="28" y="1372.04">both.</tspan></text></svg>