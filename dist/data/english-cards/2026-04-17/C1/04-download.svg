<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/04/17 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">iron something out</tspan><tspan x="28" y="525.6675">iron out something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">resolve small difficulties</tspan></text><text x="28" y="656.802" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="684.3140000000001">resolve; straighten out</tspan></text><text x="28" y="731.374" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="758.8860000000001">We can iron out the details before we begin.</tspan></text><text x="28" y="805.946" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="833.4580000000001">Separable: iron out the problems / iron the problems</tspan><tspan x="28" y="865.133">out; iron them out. Resolve difficulties rather than</tspan><tspan x="28" y="896.8080000000001">simply discover them.</tspan></text><text x="28" y="943.868" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="971.3800000000001">Kore: Two volunteers have the early shift, but nobody</tspan><tspan x="28" y="1003.0550000000001">has closing.</tspan><tspan x="28" y="1034.73">Onyx: We need to iron that out before sending the</tspan><tspan x="28" y="1066.4050000000002">rota.</tspan><tspan x="28" y="1098.0800000000002">Kore: I can move to the late shift if someone covers</tspan><tspan x="28" y="1129.755">the first half hour.</tspan><tspan x="28" y="1161.43">Onyx: I will cover it. That leaves us staffed</tspan><tspan x="28" y="1193.105">throughout.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Replace We will deal with it with a specific update</tspan><tspan x="28" y="1317.667">about an empty closing shift, using iron out. (Model:</tspan><tspan x="28" y="1349.3419999999999">We have ironed out the gap by moving one volunteer</tspan><tspan x="28" y="1381.017">to closing and arranging cover for the first half hour.)</tspan></text></svg>