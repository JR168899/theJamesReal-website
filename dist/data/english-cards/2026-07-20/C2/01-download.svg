<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intersubjective</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/07/20 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="39.56" font-weight="700" fill="#382d2e"><tspan x="28" y="471.56">intersubjective</tspan></text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="505.53">US /ˌɪntɚsəbˈdʒɛktɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="18.92" font-weight="400" fill="#382d2e"><tspan x="28" y="529.7475999999999">Adjective: intersubjective; related noun: intersubjectivity</tspan></text><text x="28" y="577.77" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="603.914">shared or established between different people’s</tspan><tspan x="28" y="634.014">perspectives</tspan></text><text x="28" y="678.734" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="704.878">shared between people; jointly understood</tspan></text><text x="28" y="749.5980000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="775.7420000000001">Their conversation created an intersubjective</tspan><tspan x="28" y="805.8420000000001">understanding of the problem.</tspan></text><text x="28" y="850.5620000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="876.7060000000001">Shared or negotiated between subjects; it is neither a</tspan><tspan x="28" y="906.8060000000002">single private opinion nor necessarily a mind-independent</tspan><tspan x="28" y="936.9060000000002">fact.</tspan></text><text x="28" y="981.6260000000002" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1007.7700000000002">A: Does the agreement exist independently of the</tspan><tspan x="28" y="1037.8700000000001">participants?</tspan><tspan x="28" y="1067.9700000000003">B: Its meaning is intersubjective: it depends on a shared</tspan><tspan x="28" y="1098.0700000000002">understanding.</tspan><tspan x="28" y="1128.1700000000003">A: Then a signature alone does not settle every</tspan><tspan x="28" y="1158.2700000000002">interpretation?</tspan><tspan x="28" y="1188.3700000000003">B: No. We also need to examine how the participants</tspan><tspan x="28" y="1218.4700000000003">understand the commitment.</tspan></text><text x="28" y="1263.1900000000003" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.3340000000003">Explain why a shared convention can be intersubjective</tspan><tspan x="28" y="1319.4340000000002">without being merely one person&#x27;s private opinion.</tspan><tspan x="28" y="1349.5340000000003">(Model: It is sustained through understandings shared</tspan><tspan x="28" y="1379.6340000000002">and negotiated among people.)</tspan></text></svg>