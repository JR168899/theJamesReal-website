<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/01/12 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">iron something out</tspan><tspan x="28" y="533.43">iron out something</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="624.4720000000001">resolve small difficulties</tspan></text><text x="28" y="675.4319999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="705.224">resolve; straighten out</tspan></text><text x="28" y="756.1839999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="785.976">We can iron out the details before we begin.</tspan></text><text x="28" y="836.9359999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="866.728">Separable: iron out the problems / iron the</tspan><tspan x="28" y="901.0279999999999">problems out; iron them out. Resolve difficulties</tspan><tspan x="28" y="935.328">rather than simply discover them.</tspan></text><text x="28" y="986.2879999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1016.0799999999999">Kore: Two volunteers have the early shift, but</tspan><tspan x="28" y="1050.3799999999999">nobody has closing.</tspan><tspan x="28" y="1084.6799999999998">Onyx: We need to iron that out before sending</tspan><tspan x="28" y="1118.98">the rota.</tspan><tspan x="28" y="1153.28">Kore: I can move to the late shift if someone</tspan><tspan x="28" y="1187.58">covers the first half hour.</tspan><tspan x="28" y="1221.8799999999999">Onyx: I will cover it. That leaves us staffed</tspan><tspan x="28" y="1256.1799999999998">throughout.</tspan></text><text x="28" y="1307.1399999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1336.9319999999998">Replace We will deal with it with a specific update</tspan><tspan x="28" y="1371.2319999999997">about an empty closing shift, using iron out.</tspan></text></svg>