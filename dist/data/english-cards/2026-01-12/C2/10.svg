<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually plan a short trip?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/01/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers look at a map to consider their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers look at a map to consider their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="49.68000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.68">How do you usually plan</tspan><tspan x="28" y="543.78">a short trip?</tspan></text><text x="28" y="611.28" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="644.112">An open question that invites a person to</tspan><tspan x="28" y="681.9119999999999">describe a familiar experience.</tspan></text><text x="28" y="738.072" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="770.904">How do you usually plan a short trip?</tspan></text><text x="28" y="827.064" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="859.896">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="897.6959999999999">answer, then ask a related follow-up.</tspan></text><text x="28" y="953.856" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="986.688">A: How do you usually plan a short trip?</tspan><tspan x="28" y="1024.488">B: I treat the plan as provisional, rather than</tspan><tspan x="28" y="1062.288">assuming that its coherence guarantees a</tspan><tspan x="28" y="1100.088">good experience.</tspan><tspan x="28" y="1137.888">A: What has helped you most?</tspan><tspan x="28" y="1175.688">B: For example, we write down the platform</tspan><tspan x="28" y="1213.488">and the time of the last train.</tspan></text><text x="28" y="1269.648" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1302.48">Explain your reasoning to a partner. Write a</tspan><tspan x="28" y="1340.28">reply of your own, then ask one related</tspan><tspan x="28" y="1378.08">question.</tspan></text></svg>