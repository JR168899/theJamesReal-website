<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intersubjective</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/01/30 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People can compare what each person means and understands.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People can compare what each person means and understands.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">intersubjective</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /ˌɪntɚsəbˈdʒɛktɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Adjective: intersubjective; related noun: intersubjectivity</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">shared or established between different people’s</tspan><tspan x="28" y="636.3630000000002">perspectives</tspan></text><text x="28" y="681.6030000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="708.0510000000002">shared between people; jointly understood</tspan></text><text x="28" y="753.291" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="779.7390000000001">Their conversation created an intersubjective</tspan><tspan x="28" y="810.1890000000002">understanding of the problem.</tspan></text><text x="28" y="855.4290000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="881.8770000000002">Topic: A conversation worth having. Write one sentence</tspan><tspan x="28" y="912.3270000000002">using this word. Check that your sentence keeps the</tspan><tspan x="28" y="942.7770000000002">meaning shown above.</tspan></text><text x="28" y="988.0170000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1014.4650000000003">A: What does “intersubjective” mean?</tspan><tspan x="28" y="1044.9150000000002">B: It means shared or established between different</tspan><tspan x="28" y="1075.3650000000002">people’s perspectives.</tspan><tspan x="28" y="1105.8150000000003">A: Can we use it in a conversation?</tspan><tspan x="28" y="1136.2650000000003">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.368">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1314.818">Which word means “shared or established between</tspan><tspan x="28" y="1345.268">different people’s perspectives”: intersubjective or</tspan><tspan x="28" y="1375.7179999999998">equivocation? (Model: intersubjective)</tspan></text></svg>