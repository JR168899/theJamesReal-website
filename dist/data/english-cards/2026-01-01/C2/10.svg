<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there one small thing you would like to try this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/01/01 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person stretches on waking.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person stretches on waking.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">Is there one small thing you</tspan><tspan x="28" y="533.43">would like to try this year?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="658.772">experience without assuming everyone shares it.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">Is there one small thing you would like to try this</tspan><tspan x="28" y="773.8240000000001">year?</tspan></text><text x="28" y="824.784" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="854.5760000000001">Follow the answer with a related question. Accept</tspan><tspan x="28" y="888.8760000000001">a different preference or a declined invitation</tspan><tspan x="28" y="923.1760000000002">without asking the person to justify it.</tspan></text><text x="28" y="974.136" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1003.9280000000001">A: Are you making a big list of goals?</tspan><tspan x="28" y="1038.228">B: No. I would like to read a little after breakfast.</tspan><tspan x="28" y="1072.528">A: What would make that easy to begin?</tspan><tspan x="28" y="1106.8280000000002">B: Leaving a book beside the kettle.</tspan><tspan x="28" y="1141.1280000000002">A: Would you like to compare what we read next</tspan><tspan x="28" y="1175.428">month?</tspan><tspan x="28" y="1209.728">B: Yes. That sounds more inviting than counting</tspan><tspan x="28" y="1244.0280000000002">pages.</tspan></text><text x="28" y="1294.988" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1324.78">Suggest a small shared New Year activity without</tspan><tspan x="28" y="1359.08">making it a competition.</tspan></text></svg>