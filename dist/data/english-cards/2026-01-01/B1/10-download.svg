<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there one small thing you would like to try this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/01/01 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#353331"><tspan x="28" y="473.4">Is there one small thing you</tspan><tspan x="28" y="525.15">would like to try this year?</tspan></text><text x="28" y="581.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="608.76">An opening that invites a personal preference or</tspan><tspan x="28" y="640.26">experience without assuming everyone shares it.</tspan></text><text x="28" y="687.06" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="714.4200000000001">Is there one small thing you would like to try this</tspan><tspan x="28" y="745.9200000000001">year?</tspan></text><text x="28" y="792.7199999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="820.0799999999999">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="851.5799999999999">different preference or a declined invitation without</tspan><tspan x="28" y="883.0799999999999">asking the person to justify it.</tspan></text><text x="28" y="929.88" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="957.24">Sky: Are you making a big list of goals?</tspan><tspan x="28" y="988.74">Michael: No. I would like to read a little after</tspan><tspan x="28" y="1020.24">breakfast.</tspan><tspan x="28" y="1051.74">Sky: What would make that easy to begin?</tspan><tspan x="28" y="1083.24">Michael: Leaving a book beside the kettle.</tspan><tspan x="28" y="1114.74">Sky: Would you like to compare what we read next</tspan><tspan x="28" y="1146.24">month?</tspan><tspan x="28" y="1177.74">Michael: Yes. That sounds more inviting than</tspan><tspan x="28" y="1209.24">counting pages.</tspan></text><text x="28" y="1258.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1285.76">Suggest a small shared New Year activity without</tspan><tspan x="28" y="1317.26">making it a competition. (Model: We could read for</tspan><tspan x="28" y="1348.76">ten minutes a few mornings a week and talk about</tspan><tspan x="28" y="1380.26">anything we enjoyed.)</tspan></text></svg>