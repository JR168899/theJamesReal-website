<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there one small thing you would like to try this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/01/01 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">Is there one small thing you</tspan><tspan x="28" y="525.6675">would like to try this year?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">Is there one small thing you would like to try this</tspan><tspan x="28" y="747.664">year?</tspan></text><text x="28" y="794.7239999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="822.236">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="853.911">different preference or a declined invitation without</tspan><tspan x="28" y="885.586">asking the person to justify it.</tspan></text><text x="28" y="932.646" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="960.158">Kore: Are you making a big list of goals?</tspan><tspan x="28" y="991.833">Onyx: No. I would like to read a little after breakfast.</tspan><tspan x="28" y="1023.508">Kore: What would make that easy to begin?</tspan><tspan x="28" y="1055.183">Onyx: Leaving a book beside the kettle.</tspan><tspan x="28" y="1086.858">Kore: Would you like to compare what we read next</tspan><tspan x="28" y="1118.533">month?</tspan><tspan x="28" y="1150.208">Onyx: Yes. That sounds more inviting than counting</tspan><tspan x="28" y="1181.883">pages.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Suggest a small shared New Year activity without</tspan><tspan x="28" y="1317.667">making it a competition. (Model: We could read for</tspan><tspan x="28" y="1349.3419999999999">ten minutes a few mornings a week and talk about</tspan><tspan x="28" y="1381.017">anything we enjoyed.)</tspan></text></svg>