<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>retrospective</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/01/01 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">retrospective</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ˌrɛtrəˈspɛktɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Adjective: retrospective; related noun: retrospect</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">looking back at past events</tspan></text><text x="28" y="659.9695" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="687.4815000000001">looking back; concerned with the past</tspan></text><text x="28" y="734.5415" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="762.0535000000001">A retrospective review helps us learn from the year.</tspan></text><text x="28" y="809.1135" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="836.6255000000001">The adjective looks back at past events. As a noun, a</tspan><tspan x="28" y="868.3005">retrospective can be a review or an exhibition</tspan><tspan x="28" y="899.9755000000001">covering earlier work.</tspan></text><text x="28" y="947.0355000000001" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="974.5475000000001">A: Are these notes for next month&#x27;s plan?</tspan><tspan x="28" y="1006.2225000000001">B: They are a retrospective account of what we</tspan><tspan x="28" y="1037.8975">actually did.</tspan><tspan x="28" y="1069.5725000000002">A: Including the things that failed?</tspan><tspan x="28" y="1101.2475000000002">B: Especially those. Otherwise we learn very little.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Does a retrospective review primarily examine past</tspan><tspan x="28" y="1317.667">events or predict future ones? Explain. (Model: It</tspan><tspan x="28" y="1349.3419999999999">examines past events so that people can understand</tspan><tspan x="28" y="1381.017">and learn from them.)</tspan></text></svg>