<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there one small thing you would like to try this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/01/01 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#353331"><tspan x="28" y="476.39">Is there one small thing you</tspan><tspan x="28" y="531.8774999999999">would like to try this year?</tspan></text><text x="28" y="592.19" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="621.526">An opening that invites a personal preference or</tspan><tspan x="28" y="655.3009999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="705.4810000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="734.817">Is there one small thing you would like to try this</tspan><tspan x="28" y="768.592">year?</tspan></text><text x="28" y="818.7720000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="848.1080000000001">Follow the answer with a related question. Accept</tspan><tspan x="28" y="881.883">a different preference or a declined invitation</tspan><tspan x="28" y="915.6580000000001">without asking the person to justify it.</tspan></text><text x="28" y="965.8380000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="995.1740000000001">Aoede: Are you making a big list of goals?</tspan><tspan x="28" y="1028.949">Echo: No. I would like to read a little after</tspan><tspan x="28" y="1062.7240000000002">breakfast.</tspan><tspan x="28" y="1096.499">Aoede: What would make that easy to begin?</tspan><tspan x="28" y="1130.2740000000001">Echo: Leaving a book beside the kettle.</tspan><tspan x="28" y="1164.0490000000002">Aoede: Would you like to compare what we read</tspan><tspan x="28" y="1197.824">next month?</tspan><tspan x="28" y="1231.5990000000002">Echo: Yes. That sounds more inviting than</tspan><tspan x="28" y="1265.3740000000003">counting pages.</tspan></text><text x="28" y="1315.554" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1344.89">Suggest a small shared New Year activity without</tspan><tspan x="28" y="1378.6650000000002">making it a competition.</tspan></text></svg>