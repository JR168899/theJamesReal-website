<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there someone you would like to thank this weekend?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/05/08 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A greeting card sits beside flowers.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A greeting card sits beside flowers.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#353331"><tspan x="28" y="476.39">Is there someone you would</tspan><tspan x="28" y="531.8774999999999">like to thank this weekend?</tspan></text><text x="28" y="592.19" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="621.526">An opening that invites a personal preference or</tspan><tspan x="28" y="655.3009999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="705.4810000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="734.817">Is there someone you would like to thank this</tspan><tspan x="28" y="768.592">weekend?</tspan></text><text x="28" y="818.7720000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="848.1080000000001">Follow the answer with a related question. Accept</tspan><tspan x="28" y="881.883">a different preference or a declined invitation</tspan><tspan x="28" y="915.6580000000001">without asking the person to justify it.</tspan></text><text x="28" y="965.8380000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="995.1740000000001">A: Are you planning something for Mother&#x27;s Day?</tspan><tspan x="28" y="1028.949">B: I am making lunch for the person who usually</tspan><tspan x="28" y="1062.7240000000002">does the cooking.</tspan><tspan x="28" y="1096.499">A: Have you asked what she would enjoy?</tspan><tspan x="28" y="1130.2740000000001">B: Yes. She asked for a quiet afternoon rather</tspan><tspan x="28" y="1164.0490000000002">than a big gathering.</tspan><tspan x="28" y="1197.824">A: That sounds easy to respect.</tspan><tspan x="28" y="1231.5990000000002">B: And it gives us a clearer plan than guessing.</tspan></text><text x="28" y="1281.7790000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1311.1150000000002">Someone asks for a quiet afternoon rather than a</tspan><tspan x="28" y="1344.8900000000003">party. Respond in a way that respects the</tspan><tspan x="28" y="1378.6650000000002">request.</tspan></text></svg>