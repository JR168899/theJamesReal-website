<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A practical way to say thank you</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/05/08 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-holding-their-child-5276077/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 5276077</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A practical way to say thank you</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="169.0">I like to show appreciation through an action. Two small things help</tspan><tspan x="42" y="206.44">me.</tspan></text><text x="42" y="239.88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="276.88">First, we say thank you for one kind thing. We explain why it helped.</tspan></text><text x="42" y="310.32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="347.32">Next, we ask what we can do. We help with a task.</tspan></text><text x="42" y="380.76" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="417.76">These two things help us. We can show appreciation through an</tspan><tspan x="42" y="455.2">action and enjoy our time together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="506.64">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="528.6">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="550.56">about an experience of your own.</tspan><tspan x="42" y="572.52">Read, then answer. What two reasons support the main idea? Explain one example.</tspan></text></svg>