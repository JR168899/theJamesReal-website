<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Mother’s Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/05/08 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#353331"><tspan x="28" y="468.0">What would you like to do for</tspan><tspan x="28" y="513.0">Mother’s Day?</tspan></text><text x="28" y="559.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="582.236">An open question that invites a person to describe a familiar</tspan><tspan x="28" y="608.136">experience.</tspan></text><text x="28" y="646.616" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="669.112">What would you like to do for Mother’s Day?</tspan></text><text x="28" y="707.592" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="730.088">Ask this as a genuine question. Listen to the answer, then ask</tspan><tspan x="28" y="755.9879999999999">a related follow-up.</tspan></text><text x="28" y="794.468" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="816.9639999999999">A: What would you like to do for Mother’s Day?</tspan><tspan x="28" y="842.8639999999999">B: I would like to show appreciation through an action.</tspan><tspan x="28" y="868.7639999999999">A: What should we prepare?</tspan><tspan x="28" y="894.664">B: For example, we name one helpful action instead of relying</tspan><tspan x="28" y="920.564">on a general compliment.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1278.336">Explain the meaning before looking at the model answer. Write</tspan><tspan x="28" y="1304.236">a reply of your own, then ask one related question. (Model: I</tspan><tspan x="28" y="1330.136">treat the plan as provisional, rather than assuming that its</tspan><tspan x="28" y="1356.036">coherence guarantees a good experience. What works best for</tspan><tspan x="28" y="1381.936">you?)</tspan></text></svg>