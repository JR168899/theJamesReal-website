<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually share a meal?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/01/02 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People share a meal and conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People share a meal and conversation.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#353331"><tspan x="28" y="470.41">How do you usually share a</tspan><tspan x="28" y="518.4225">meal?</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="595.994">An open question that invites a person to describe a</tspan><tspan x="28" y="625.219">familiar experience.</tspan></text><text x="28" y="668.639" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="694.023">How do you usually share a meal?</tspan></text><text x="28" y="737.443" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="762.827">Ask this as a genuine question. Listen to the answer, then</tspan><tspan x="28" y="792.052">ask a related follow-up.</tspan></text><text x="28" y="835.472" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="860.856">A: How do you usually share a meal?</tspan><tspan x="28" y="890.081">B: I make practical arrangements, while leaving room for</tspan><tspan x="28" y="919.306">other people’s preferences.</tspan><tspan x="28" y="948.531">A: What has helped you most?</tspan><tspan x="28" y="977.756">B: For example, we prepare the vegetables before our</tspan><tspan x="28" y="1006.981">guests arrive.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1282.7440000000001">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1311.969">Write a reply of your own, then ask one related question.</tspan><tspan x="28" y="1341.1940000000002">(Model: I make practical arrangements, while leaving room</tspan><tspan x="28" y="1370.419">for other people’s preferences. What works best for you?)</tspan></text></svg>