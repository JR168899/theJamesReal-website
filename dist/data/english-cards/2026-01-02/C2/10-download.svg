<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually share a meal?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/01/02 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People share a meal and conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People share a meal and conversation.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#353331"><tspan x="28" y="468.0">How do you usually share a meal?</tspan></text><text x="28" y="514.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="537.236">An open question that invites a person to describe a familiar</tspan><tspan x="28" y="563.136">experience.</tspan></text><text x="28" y="601.616" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="624.112">How do you usually share a meal?</tspan></text><text x="28" y="662.592" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="685.088">Ask this as a genuine question. Listen to the answer, then ask</tspan><tspan x="28" y="710.9879999999999">a related follow-up.</tspan></text><text x="28" y="749.468" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="771.9639999999999">A: How do you usually share a meal?</tspan><tspan x="28" y="797.8639999999999">B: I treat the plan as provisional, rather than assuming that its</tspan><tspan x="28" y="823.7639999999999">coherence guarantees a good experience.</tspan><tspan x="28" y="849.664">A: What has helped you most?</tspan><tspan x="28" y="875.564">B: For example, we prepare the vegetables before our guests</tspan><tspan x="28" y="901.4639999999999">arrive.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1278.336">Explain the meaning before looking at the model answer. Write</tspan><tspan x="28" y="1304.236">a reply of your own, then ask one related question. (Model: I</tspan><tspan x="28" y="1330.136">treat the plan as provisional, rather than assuming that its</tspan><tspan x="28" y="1356.036">coherence guarantees a good experience. What works best for</tspan><tspan x="28" y="1381.936">you?)</tspan></text></svg>