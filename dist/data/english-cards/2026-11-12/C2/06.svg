<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a curate’s egg</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/11/12 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>a curate’s egg</title><desc>Original family-manga illustration: egg, related to a curate’s egg.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#54b8ec"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-70C-24-70-57-9-57 22C-57 83 57 83 57 22C57-9 24-70 0-70Z" fill="#e6d5b6"/><path d="M-45 3L-18-6L-6 12L15-3L47 8"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.08" font-weight="700" fill="#383426"><tspan x="28" y="477.08">a curate’s egg</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">something with both good and bad parts; chiefly</tspan><tspan x="28" y="602.422">British</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="683.174">a mixed bag; partly successful</tspan></text><text x="28" y="734.1339999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="763.9259999999999">The elaborate arrangement was a curate’s egg.</tspan></text><text x="28" y="814.8859999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="844.6779999999999">Learn the whole expression. It is figurative</tspan><tspan x="28" y="878.9779999999998">language, so a word-for-word interpretation may</tspan><tspan x="28" y="913.2779999999999">be misleading.</tspan></text><text x="28" y="964.2379999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="994.03">A: How would you express this idea?</tspan><tspan x="28" y="1028.33">B: a curate’s egg</tspan><tspan x="28" y="1062.6299999999999">A: What does that mean here?</tspan><tspan x="28" y="1096.93">B: something with both good and bad parts;</tspan><tspan x="28" y="1131.23">chiefly British</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Make a sentence of your own, then answer: What</tspan><tspan x="28" y="1323.772">does “a curate’s egg” mean in this example? The</tspan><tspan x="28" y="1358.072">elaborate arrangement was a curate’s egg.</tspan></text></svg>