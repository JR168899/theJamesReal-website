<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>leave no stone unturned</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B2 - 2026/11/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#383426"><tspan x="28" y="476.85">leave no stone unturned</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="567.4275">try every reasonable possibility</tspan></text><text x="28" y="618.1275" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="647.7675">search exhaustively; explore every avenue</tspan></text><text x="28" y="698.4675000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="728.1075000000001">We left no stone unturned while looking for a</tspan><tspan x="28" y="762.2325000000001">solution.</tspan></text><text x="28" y="812.9325000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="842.5725000000001">A figurative expression for trying every</tspan><tspan x="28" y="876.6975000000001">reasonable avenue. Avoid using it to imply</tspan><tspan x="28" y="910.8225000000001">certainty about the result.</tspan></text><text x="28" y="961.5225000000002" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="991.1625000000001">Aoede: Have we checked every source for the</tspan><tspan x="28" y="1025.2875000000001">missing record?</tspan><tspan x="28" y="1059.4125000000001">Echo: The archive, the old catalog and the local</tspan><tspan x="28" y="1093.5375000000001">collection.</tspan><tspan x="28" y="1127.6625000000001">Aoede: Then we really have left no stone</tspan><tspan x="28" y="1161.7875000000001">unturned.</tspan><tspan x="28" y="1195.9125000000001">Echo: We should still state that the record has</tspan><tspan x="28" y="1230.0375000000001">not been found.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1310.3775">Does leaving no stone unturned guarantee finding</tspan><tspan x="28" y="1344.5025">an answer? Explain. (Model: No. It describes a</tspan><tspan x="28" y="1378.6275">thorough search, not a guaranteed result.)</tspan></text></svg>