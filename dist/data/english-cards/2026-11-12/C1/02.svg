<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discerning</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/11/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Fresh produce is displayed at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Fresh produce is displayed at a market.</tspan></text><a href="https://www.pexels.com/photo/vegetables-in-market-12527092/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12527092</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">discerning</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /dɪˈsɝnɪŋ/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">discerning · more discerning · most discerning; noun: discernment</tspan></text><text x="28" y="589.635" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="617.9069999999999">able to notice differences and make careful</tspan><tspan x="28" y="650.4569999999999">judgements</tspan></text><text x="28" y="698.817" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="727.0889999999999">perceptive; judicious</tspan></text><text x="28" y="775.449" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="803.7209999999999">A discerning shopper considers durability as well as</tspan><tspan x="28" y="836.2709999999998">price.</tspan></text><text x="28" y="884.631" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="912.9029999999999">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="945.4529999999999">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="978.0029999999999">description rather than using it as a general</tspan><tspan x="28" y="1010.5529999999999">compliment.</tspan></text><text x="28" y="1058.913" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1087.185">Kore: She did not choose the most expensive piece.</tspan><tspan x="28" y="1119.735">Onyx: She is a discerning buyer; she checks how</tspan><tspan x="28" y="1152.2849999999999">things are made.</tspan><tspan x="28" y="1184.835">Kore: What persuaded her?</tspan><tspan x="28" y="1217.385">Onyx: The repairable joints and the well-finished</tspan><tspan x="28" y="1249.935">edges.</tspan></text><text x="28" y="1298.295" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1326.567">Describe a discerning purchase without equating</tspan><tspan x="28" y="1359.117">good judgment with a high price.</tspan></text></svg>