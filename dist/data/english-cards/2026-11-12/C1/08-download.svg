<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Less is more.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/11/12 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Fresh food is displayed at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Fresh food is displayed at a market.</tspan></text><a href="https://www.pexels.com/photo/vegetables-in-market-12527092/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12527092</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2c3540"><tspan x="28" y="473.63">Less is more.</tspan></text><text font-family="Arial, sans-serif" font-size="18.1" font-weight="400" fill="#2c3540"><tspan x="28" y="502.13750000000005">Robert Browning · Andrea del Sarto · Published 1855</tspan></text><text x="28" y="551.9125" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="579.4245000000001">A simple choice can be more effective than adding</tspan><tspan x="28" y="611.0995">many things.</tspan></text><text x="28" y="658.1595" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="685.6715">Simplicity can work well; Choose what is essential</tspan></text><text x="28" y="732.7315" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="760.2435">We choose two useful decorations and leave the rest</tspan><tspan x="28" y="791.9185">of the table clear.</tspan></text><text x="28" y="838.9784999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="866.4905">This is a short excerpt from a poem. In the poem, a</tspan><tspan x="28" y="898.1655">painter considers artistic ambition; the line is not a</tspan><tspan x="28" y="929.8405">rule that less is always better.</tspan></text><text x="28" y="976.9005" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1004.4125">A: Which line caught your attention?</tspan><tspan x="28" y="1036.0875">B: “Less is more.”</tspan><tspan x="28" y="1067.7625">A: How does that connect with the example?</tspan><tspan x="28" y="1099.4375">B: The example removes unnecessary additions so</tspan><tspan x="28" y="1131.1125">that the useful choices stand out.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.992">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1317.667">Which detail supports your explanation? (Model: The</tspan><tspan x="28" y="1349.3419999999999">example removes unnecessary additions so that the</tspan><tspan x="28" y="1381.017">useful choices stand out.)</tspan></text></svg>