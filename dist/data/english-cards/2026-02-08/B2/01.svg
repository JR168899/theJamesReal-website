<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>affection</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/02/08 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A handmade card expresses a personal greeting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A handmade card expresses a personal greeting.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">affection</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /əˈfɛkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">Usually uncountable: affection; no regular plural in this sense.</tspan></text><text x="28" y="604.0425" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="634.8985">a warm feeling of fondness or care for someone</tspan></text><text x="28" y="687.6785" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="718.5345">fondness; warm feeling</tspan></text><text x="28" y="771.3145" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="802.1705">The note expresses affection without making a</tspan><tspan x="28" y="837.6954999999999">grand promise.</tspan></text><text x="28" y="890.4755" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="921.3315">Topic: A thoughtful message for Valentine’s</tspan><tspan x="28" y="956.8565">Day. Write one sentence using this word. Check</tspan><tspan x="28" y="992.3815">that your sentence keeps the meaning shown</tspan><tspan x="28" y="1027.9065">above.</tspan></text><text x="28" y="1080.6865" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1111.5425">A: What does “affection” mean?</tspan><tspan x="28" y="1147.0675">B: It means a warm feeling of fondness or care</tspan><tspan x="28" y="1182.5925">for someone.</tspan><tspan x="28" y="1218.1175">A: Can we use it when sending a greeting?</tspan><tspan x="28" y="1253.6425">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1306.4225000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1337.2785000000001">Which word means “a warm feeling of fondness</tspan><tspan x="28" y="1372.8035000000002">or care for someone”: affection or platonic?</tspan></text></svg>