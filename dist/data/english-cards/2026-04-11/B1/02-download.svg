<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>familiar</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/04/11 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">familiar</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /fəˈmɪljɚ/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">familiar · more familiar · most familiar; noun: familiarity</tspan></text><text x="28" y="609.975" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.8950000000001">known well from previous experience</tspan></text><text x="28" y="696.495" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="728.4150000000001">well-known; recognizable</tspan></text><text x="28" y="783.015" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="814.9350000000001">The familiar song brings back happy</tspan><tspan x="28" y="851.6850000000001">memories.</tspan></text><text x="28" y="906.285" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="938.205">The adjective describes a person, thing or</tspan><tspan x="28" y="974.955">situation. Choose a concrete noun or context</tspan><tspan x="28" y="1011.705">that supports the description rather than using</tspan><tspan x="28" y="1048.455">it as a general compliment.</tspan></text><text x="28" y="1103.055" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.9750000000001">A: This room feels familiar.</tspan><tspan x="28" y="1171.7250000000001">B: We met here last spring.</tspan><tspan x="28" y="1208.4750000000001">A: That explains why I recognized the window.</tspan><tspan x="28" y="1245.2250000000001">B: The furniture has changed since then.</tspan></text><text x="28" y="1299.825" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1331.7450000000001">Complete the idea: A familiar place is one you</tspan><tspan x="28" y="1368.4950000000001">have ___. (Model: seen or experienced before)</tspan></text></svg>