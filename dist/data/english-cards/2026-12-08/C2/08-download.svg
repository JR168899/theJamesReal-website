<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The significance of a decision is not exhausted by its efficiency.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/12/08 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>The significance of a decision is not exhausted by its efficiency.</title><desc>Original family-manga illustration: city, related to The significance of a decision is not exhausted by its efficiency..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-75 60V-15H-35V60M-21 60V-60H21V60M35 60V-31H75V60M-90 62H90M-64 0H-49M-64 17H-49M-64 34H-49M-9-39H9M-9-20H9M-9 0H9M-9 20H9M48-13H63M48 8H63M48 30H63" fill="#f5c488"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">The significance of a decision</tspan><tspan x="28" y="522.045">is not exhausted by its</tspan><tspan x="28" y="572.0699999999999">efficiency.</tspan></text><text x="28" y="626.445" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="652.8930000000001">A decision should be judged by its effects on people as</tspan><tspan x="28" y="683.3430000000002">well as by its use of time or resources.</tspan></text><text x="28" y="728.5830000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="755.0310000000002">A choice has value beyond its practical economy.;</tspan><tspan x="28" y="785.4810000000002">Efficiency is only one measure of a decision.</tspan></text><text x="28" y="830.7210000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="857.1690000000002">For example, we keep an entrance clear while taking a</tspan><tspan x="28" y="887.6190000000003">photograph of the street.</tspan></text><text x="28" y="932.8590000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="959.3070000000002">Read this as a reflection, not a factual rule. Relate it to a</tspan><tspan x="28" y="989.7570000000003">specific action in the example, and explain why you</tspan><tspan x="28" y="1020.2070000000002">agree or disagree.</tspan></text><text x="28" y="1065.4470000000003" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1091.8950000000002">A: What did we learn from that experience?</tspan><tspan x="28" y="1122.3450000000003">B: The significance of a decision is not exhausted by its</tspan><tspan x="28" y="1152.7950000000003">efficiency.</tspan><tspan x="28" y="1183.2450000000001">A: What do you mean?</tspan><tspan x="28" y="1213.6950000000002">B: A decision should be judged by its effects on people</tspan><tspan x="28" y="1244.1450000000002">as well as by its use of time or resources.</tspan></text><text x="28" y="1289.3850000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1315.833">Which action in today’s topic illustrates this reflection?</tspan><tspan x="28" y="1346.2830000000001">(Model: We keep an entrance clear while taking a</tspan><tspan x="28" y="1376.7330000000002">photograph of the street.)</tspan></text></svg>