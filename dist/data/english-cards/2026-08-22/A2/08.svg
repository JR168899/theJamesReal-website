<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A thing of beauty is a joy for ever:</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/08/22 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#2c3540"><tspan x="28" y="476.39">A thing of beauty is a joy for</tspan><tspan x="28" y="531.8774999999999">ever:</tspan></text><text font-family="Arial, sans-serif" font-size="19.3" font-weight="400" fill="#2c3540"><tspan x="28" y="562.275">John Keats · Endymion, Book I · Published 1818</tspan></text><text x="28" y="615.35" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="644.6859999999999">Something beautiful can continue to give pleasure</tspan><tspan x="28" y="678.4609999999999">after the first moment.</tspan></text><text x="28" y="728.6410000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="757.977">Beauty can bring lasting pleasure; A beautiful</tspan><tspan x="28" y="791.752">experience can stay with us</tspan></text><text x="28" y="841.9320000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="871.268">Long after our walk, I still remember the light on</tspan><tspan x="28" y="905.043">the trees.</tspan></text><text x="28" y="955.2230000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="984.5590000000001">The colon is retained from the opening line. For</tspan><tspan x="28" y="1018.3340000000001">ever is an older two-word spelling of forever. This</tspan><tspan x="28" y="1052.1090000000002">is a poetic claim, not a measurable promise.</tspan></text><text x="28" y="1102.2890000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1131.6250000000002">A: What do you think of this line?</tspan><tspan x="28" y="1165.4000000000003">B: It makes me think about our example.</tspan><tspan x="28" y="1199.1750000000002">A: Which part?</tspan><tspan x="28" y="1232.9500000000003">B: Long after our walk, I still remember the light</tspan><tspan x="28" y="1266.7250000000004">on the trees.</tspan></text><text x="28" y="1316.9050000000002" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1346.2410000000002">Which action in the example connects with the</tspan><tspan x="28" y="1380.0160000000003">quotation?</tspan></text></svg>