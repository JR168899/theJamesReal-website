<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>quiet</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/08/02 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Light, furniture and space affect how a room feels and can be used.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Light, furniture and space affect how a room feels and can be used.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="481.91">quiet</tspan></text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="524.7675">US /ˈkwaɪət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="23.870000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="555.3211">quiet · quieter · quietest; noun: quietness</tspan></text><text x="28" y="615.9075" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="648.8915000000001">making very little noise</tspan></text><text x="28" y="705.3115" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="738.2955000000001">peaceful; making little noise</tspan></text><text x="28" y="794.7155" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="827.6995000000001">The garden is quiet in the morning.</tspan></text><text x="28" y="884.1195" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="917.1035">Topic: Listening without distraction. Write</tspan><tspan x="28" y="955.0785000000001">one sentence using this word. Check that</tspan><tspan x="28" y="993.0535000000001">your sentence keeps the meaning shown</tspan><tspan x="28" y="1031.0285000000001">above.</tspan></text><text x="28" y="1087.4485" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1120.4325000000001">A: What does “quiet” mean?</tspan><tspan x="28" y="1158.4075">B: It means making very little noise.</tspan><tspan x="28" y="1196.3825000000002">A: Can we use it while listening to music?</tspan><tspan x="28" y="1234.3575">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1290.7775" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.7615">Look again. Which word means “making very</tspan><tspan x="28" y="1361.7365">little noise”: quiet or rhythm? (Model: quiet)</tspan></text></svg>