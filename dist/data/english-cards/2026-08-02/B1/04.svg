<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>look into</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/08/02 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">look into</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="584.04">examine or investigate</tspan></text><text x="28" y="641.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="674.68">investigate; examine</tspan></text><text x="28" y="731.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="765.3199999999999">We should look into another option.</tspan></text><text x="28" y="822.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="855.9599999999999">Look into means investigate here. It is</tspan><tspan x="28" y="894.4599999999999">inseparable: look into it, not look it into.</tspan></text><text x="28" y="951.66" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="985.0999999999999">A: The return journey looks expensive.</tspan><tspan x="28" y="1023.5999999999999">B: Could we look into another route?</tspan><tspan x="28" y="1062.1">A: I will compare the bus and the train.</tspan><tspan x="28" y="1100.6">B: Please check the last departure, not just</tspan><tspan x="28" y="1139.1">the fare.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1295.04">Before replacing a train with a bus, identify</tspan><tspan x="28" y="1333.54">two things to look into.</tspan></text></svg>