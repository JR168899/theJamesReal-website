<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Consideration becomes visible through practical decisions.</title><rect width="660" height="1434" fill="#dce5ee"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2c3540" stroke-width="1"/><text x="35" y="43" fill="#2c3540" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-12-31</tspan></text><text x="35" y="88" fill="#2c3540" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">Consideration becomes visible</tspan><tspan x="35" dy="41.4">through practical decisions.</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>Consideration becomes visible through practical decisions.</title><desc>Original hand-drawn story illustration: room, set within year. An original James Real learning reflection on practical consideration.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-1) scale(1.4)"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><g transform="translate(538 266) rotate(1) scale(0.52)"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Consideration becomes visible through practical decisions.</text></svg><text x="35" y="555.8" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An original James Real learning reflection on practical</tspan><tspan x="35" dy="24.839999999999996">consideration.</tspan></text><text x="35" y="657.0399999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="681.5999999999998" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">For example, we choose a ten-minute practice session and</tspan><tspan x="35" dy="24.839999999999996">put it on the calendar.</tspan></text><text x="35" y="758.2799999999997" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="782.8399999999997" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Make a sentence of your own, then answer: Which action in</tspan><tspan x="35" dy="24.839999999999996">today’s topic illustrates this reflection?</tspan></text><text x="35" y="1406" fill="#2c3540" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">REFLECTION   /   08 OF 11</tspan></text></svg>