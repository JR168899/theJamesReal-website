<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>remember</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/12/31 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader follows the printed text in an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader follows the printed text in an open book.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-an-open-book-with-sunlight-36324703/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 36324703</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#382d2e"><tspan x="28" y="479.84000000000003">remember</tspan></text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="520.92">US /rɪˈmɛmbɚ/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="550.2064">remember · remembers · remembered · remembered ·</tspan><tspan x="28" y="578.12">remembering (base · third person · past · past participle ·</tspan><tspan x="28" y="606.0336">-ing)</tspan></text><text x="28" y="664.1072" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="695.7232">to keep or bring something into your mind</tspan></text><text x="28" y="749.8032000000001" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="781.4192">recall; keep in mind</tspan></text><text x="28" y="835.4992000000001" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="867.1152000000001">I remember the song we heard together.</tspan></text><text x="28" y="921.1952000000001" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="952.8112000000001">Use the verb in the sense shown in the</tspan><tspan x="28" y="989.2112000000001">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1025.6112">object; the word forms above show its</tspan><tspan x="28" y="1062.0112000000001">changes.</tspan></text><text x="28" y="1116.0912000000003" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="1147.7072">Bella: Do you remember this story?</tspan><tspan x="28" y="1184.1072000000001">Fenrir: Yes. You read it to me when I was little.</tspan><tspan x="28" y="1220.5072">Bella: Would you like to read it now?</tspan><tspan x="28" y="1256.9072">Fenrir: Yes. I remember the funny ending.</tspan></text><text x="28" y="1310.9872000000003" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382d2e"><tspan x="28" y="1342.6032">Your friend cannot recall where you met. Give</tspan><tspan x="28" y="1379.0032">one helpful detail using remember.</tspan></text></svg>