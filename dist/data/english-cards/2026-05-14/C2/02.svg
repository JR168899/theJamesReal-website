<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>equanimity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/14 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader takes a quiet moment at home.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader takes a quiet moment at home.</tspan></text><a href="https://www.pexels.com/photo/woman-sitting-and-reading-book-5698385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5698385</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#382d2e"><tspan x="28" y="479.38">equanimity</tspan></text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="520.065">US /ˌikwəˈnɪməti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.66" font-weight="400" fill="#382d2e"><tspan x="28" y="549.0698">Usually uncountable: equanimity; no regular plural in this</tspan><tspan x="28" y="576.715">sense.</tspan></text><text x="28" y="634.2302" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="665.5422">calmness and balance in a difficult situation</tspan></text><text x="28" y="719.1021999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="750.4141999999999">composure; evenness of temper</tspan></text><text x="28" y="803.9741999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="835.2861999999999">She met the change of plan with equanimity.</tspan></text><text x="28" y="888.8461999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="920.1581999999999">Composure during difficulty does not mean</tspan><tspan x="28" y="956.2081999999998">indifference to the outcome.</tspan></text><text x="28" y="1009.7681999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1041.0801999999999">Sarah: She received the cancellation with</tspan><tspan x="28" y="1077.1301999999998">surprising equanimity.</tspan><tspan x="28" y="1113.1801999999998">Liam: Was she indifferent to it?</tspan><tspan x="28" y="1149.2302">Sarah: No. She was disappointed, but</tspan><tspan x="28" y="1185.2802">remained composed enough to discuss</tspan><tspan x="28" y="1221.3301999999999">alternatives.</tspan><tspan x="28" y="1257.3801999999998">Liam: That is different from not caring.</tspan></text><text x="28" y="1310.9402" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1342.2522">Distinguish equanimity from indifference when</tspan><tspan x="28" y="1378.3021999999999">a valued plan fails.</tspan></text></svg>