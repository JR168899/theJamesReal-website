fill="#3d3028"><tspan x="28" y="833.4580000000001">Keep the particle with the verb. Check a dictionary</tspan><tspan x="28" y="865.133">before changing its object or word order.</tspan></text><text x="28" y="912.193" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="939.705">A: How can we finish a task together?</tspan><tspan x="28" y="971.38">B: We can work out a plan together.</tspan><tspan x="28" y="1003.0550000000001">A: That gives us a starting point.</tspan><tspan x="28" y="1034.73">B: Let us try it together.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Explain your reasoning to a partner. Explain “work</tspan><tspan x="28" y="1317.667">out” in your own words, then use it in a sentence</tspan><tspan x="28" y="1349.3419999999999">about working together. (Model: It means to find a</tspan><tspan x="28" y="1381.017">solution. Example: We can work out a plan together.)</tspan></text></svg>