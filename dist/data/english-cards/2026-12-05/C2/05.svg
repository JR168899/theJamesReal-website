<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut the Gordian knot</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/12/05 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#383426"><tspan x="28" y="480.3">cut the Gordian knot</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="577.845">solve a complex problem with a decisive and</tspan><tspan x="28" y="614.595">direct action</tspan></text><text x="28" y="669.1949999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="701.115">take a decisive shortcut; break the deadlock</tspan></text><text x="28" y="755.7149999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="787.635">A simpler agreement cut the Gordian knot.</tspan></text><text x="28" y="842.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="874.155">Learn the whole expression. It is figurative</tspan><tspan x="28" y="910.905">language, so a word-for-word interpretation</tspan><tspan x="28" y="947.655">may be misleading.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1034.175">A: How would you express this idea?</tspan><tspan x="28" y="1070.925">B: cut the Gordian knot</tspan><tspan x="28" y="1107.675">A: What does that mean here?</tspan><tspan x="28" y="1144.425">B: solve a complex problem with a decisive</tspan><tspan x="28" y="1181.175">and direct action</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1292.72">Explain your reasoning to a partner. What does</tspan><tspan x="28" y="1329.47">“cut the Gordian knot” mean in this example? A</tspan><tspan x="28" y="1366.22">simpler agreement cut the Gordian knot.</tspan></text></svg>