<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Father’s Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/06/21 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#353331"><tspan x="28" y="482.0">What would you like to</tspan><tspan x="28" y="544.5">do for Father’s Day?</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="646.54">An open question that invites a person to</tspan><tspan x="28" y="685.04">describe a familiar experience.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="775.68">What would you like to do for Father’s Day?</tspan></text><text x="28" y="832.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="866.3199999999999">Ask this as a genuine question. Listen to</tspan><tspan x="28" y="904.8199999999999">the answer, then ask a related follow-up.</tspan></text><text x="28" y="962.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="995.4599999999999">A: What would you like to do for Father’s</tspan><tspan x="28" y="1033.96">Day?</tspan><tspan x="28" y="1072.46">B: I would like to spend time with someone</tspan><tspan x="28" y="1110.96">who cares for us.</tspan><tspan x="28" y="1149.46">A: What should we prepare?</tspan><tspan x="28" y="1187.96">B: For example, we choose a short walk</tspan><tspan x="28" y="1226.46">that suits everyone’s pace.</tspan></text><text x="28" y="1283.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1317.1">Look again. Write a reply of your own, then</tspan><tspan x="28" y="1355.6">ask one related question.</tspan></text></svg>