<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/06/21 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A new day begins with getting up and preparing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A new day begins with getting up and preparing.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#3d3028"><tspan x="28" y="472.02">get ready</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="552.8430000000001">prepare yourself</tspan></text><text x="28" y="598.083" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="624.5310000000001">prepare; make preparations</tspan></text><text x="28" y="669.771" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="696.219">We get ready before we leave as we prepare for Father’s</tspan><tspan x="28" y="726.6690000000001">Day.</tspan></text><text x="28" y="771.909" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="798.3570000000001">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="828.8070000000001">changing its object or word order.</tspan></text><text x="28" y="874.047" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="900.4950000000001">A: How can we spend time with someone who cares for</tspan><tspan x="28" y="930.9450000000002">us?</tspan><tspan x="28" y="961.3950000000001">B: We get ready before we leave.</tspan><tspan x="28" y="991.8450000000001">A: That gives us a starting point.</tspan><tspan x="28" y="1022.2950000000001">B: Let us try it together.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1284.368">For Father’s Day, look again. Explain “get ready” in your</tspan><tspan x="28" y="1314.818">own words, then use it in a sentence about making time</tspan><tspan x="28" y="1345.268">for a shared activity. (Model: It means to prepare</tspan><tspan x="28" y="1375.7179999999998">yourself. Example: We get ready before we leave.)</tspan></text></svg>