<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/06/21 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="470.41">There is nothing in the world so</tspan><tspan x="28" y="518.4225">irresistibly contagious as</tspan><tspan x="28" y="566.4350000000001">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="16.700000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="592.7375000000001">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="638.6625" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="664.0465">A cheerful mood can spread from one person to others.</tspan></text><text x="28" y="707.4665" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="732.8505">Laughter can spread through a group; Good spirits can</tspan><tspan x="28" y="762.0755">influence the people nearby</tspan></text><text x="28" y="805.4955" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="830.8795">One guest starts laughing at a gentle joke, and soon the</tspan><tspan x="28" y="860.1045">whole table is smiling.</tspan></text><text x="28" y="903.5245" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="928.9085">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="958.1335">spreading, rather than an infection. The original spelling</tspan><tspan x="28" y="987.3585">good-humour is retained.</tspan></text><text x="28" y="1030.7785" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1056.1625000000001">Kore: Why does the narrator describe laughter as</tspan><tspan x="28" y="1085.3875">contagious?</tspan><tspan x="28" y="1114.6125000000002">Onyx: Because one person&#x27;s laughter can draw others into</tspan><tspan x="28" y="1143.8375">it.</tspan><tspan x="28" y="1173.0625000000002">Kore: Is the line a medical claim?</tspan><tspan x="28" y="1202.2875000000001">Onyx: No. It is a literary comparison about a shared mood.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1282.7440000000001">Explain contagious figuratively here, without presenting</tspan><tspan x="28" y="1311.969">laughter as an illness. (Model: Laughter can spread</tspan><tspan x="28" y="1341.1940000000002">between people as a shared response; contagious is a</tspan><tspan x="28" y="1370.419">metaphor.)</tspan></text></svg>