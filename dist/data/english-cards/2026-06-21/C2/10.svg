<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Father’s Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/06/21 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="49.68000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.68">What would you like to</tspan><tspan x="28" y="543.78">do for Father’s Day?</tspan></text><text x="28" y="611.28" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="644.112">An open question that invites a person to</tspan><tspan x="28" y="681.9119999999999">describe a familiar experience.</tspan></text><text x="28" y="738.072" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="770.904">What would you like to do for Father’s Day?</tspan></text><text x="28" y="827.064" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="859.896">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="897.6959999999999">answer, then ask a related follow-up.</tspan></text><text x="28" y="953.856" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="986.688">A: What would you like to do for Father’s</tspan><tspan x="28" y="1024.488">Day?</tspan><tspan x="28" y="1062.288">B: I would like to spend time with someone</tspan><tspan x="28" y="1100.088">who cares for us.</tspan><tspan x="28" y="1137.888">A: What should we prepare?</tspan><tspan x="28" y="1175.688">B: For example, we choose a short walk that</tspan><tspan x="28" y="1213.488">suits everyone’s pace.</tspan></text><text x="28" y="1269.648" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1302.48">Compare your first answer with this question:</tspan><tspan x="28" y="1340.28">Write a reply of your own, then ask one</tspan><tspan x="28" y="1378.08">related question.</tspan></text></svg>