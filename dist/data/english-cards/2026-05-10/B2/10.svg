<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there someone you would like to thank this weekend?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/05/10 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A host serves food at a table.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A host serves food at a table.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">Is there someone you would</tspan><tspan x="28" y="529.8075">like to thank this weekend?</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="617.5980000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="650.6730000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="728.541">Is there someone you would like to thank this</tspan><tspan x="28" y="761.6160000000001">weekend?</tspan></text><text x="28" y="810.756" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="839.484">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="872.5590000000001">different preference or a declined invitation without</tspan><tspan x="28" y="905.634">asking the person to justify it.</tspan></text><text x="28" y="954.774" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="983.5020000000001">Aoede: Are you planning something for Mother&#x27;s</tspan><tspan x="28" y="1016.5770000000001">Day?</tspan><tspan x="28" y="1049.652">Echo: I am making lunch for the person who usually</tspan><tspan x="28" y="1082.727">does the cooking.</tspan><tspan x="28" y="1115.8020000000001">Aoede: Have you asked what she would enjoy?</tspan><tspan x="28" y="1148.877">Echo: Yes. She asked for a quiet afternoon rather</tspan><tspan x="28" y="1181.952">than a big gathering.</tspan><tspan x="28" y="1215.027">Aoede: That sounds easy to respect.</tspan><tspan x="28" y="1248.102">Echo: And it gives us a clearer plan than guessing.</tspan></text><text x="28" y="1297.2419999999997" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1325.9699999999998">Someone asks for a quiet afternoon rather than a</tspan><tspan x="28" y="1359.0449999999998">party. Respond in a way that respects the request.</tspan></text></svg>