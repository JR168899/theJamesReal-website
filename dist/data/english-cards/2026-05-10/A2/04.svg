<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>find out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/05/10 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Reference books help a reader discover information.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Reference books help a reader discover information.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="479.15">find something out</tspan><tspan x="28" y="538.0875">find out something</tspan></text><text x="28" y="602.15" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="633.3100000000001">learn a fact</tspan></text><text x="28" y="686.61" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="717.7700000000001">discover; learn</tspan></text><text x="28" y="771.07" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="802.2300000000001">Let us find out what we need as we prepare for</tspan><tspan x="28" y="838.1050000000001">Mother’s Day.</tspan></text><text x="28" y="891.4050000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="922.5650000000002">Keep the particle with the verb. Check a</tspan><tspan x="28" y="958.4400000000002">dictionary before changing its object or word</tspan><tspan x="28" y="994.3150000000002">order.</tspan></text><text x="28" y="1047.6150000000002" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1078.775">A: How can we show appreciation through an</tspan><tspan x="28" y="1114.65">action?</tspan><tspan x="28" y="1150.525">B: Let us find out what we need.</tspan><tspan x="28" y="1186.4">A: That gives us a starting point.</tspan><tspan x="28" y="1222.275">B: Let us try it together.</tspan></text><text x="28" y="1275.5750000000003" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1306.7350000000001">For Mother’s Day, look again. Explain “find out”</tspan><tspan x="28" y="1342.6100000000001">in your own words, then use it in a sentence</tspan><tspan x="28" y="1378.4850000000001">about a practical way to say thank you.</tspan></text></svg>