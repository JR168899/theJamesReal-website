<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>pick up</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A1 - 2026/05/10 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Lifting a box moves it up from its resting place.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Lifting a box moves it up from its resting place.</tspan></text><a href="https://www.pexels.com/photo/woman-lifting-heavy-cardboard-box-while-standing-near-floor-lamp-4245978/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4245978</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="480.3">pick something up</tspan><tspan x="28" y="540.6750000000001">pick up something</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="638.22">lift something</tspan></text><text x="28" y="692.8199999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="724.74">lift; raise</tspan></text><text x="28" y="779.3399999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="811.26">Please pick up the bag.</tspan></text><text x="28" y="865.8599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="897.78">Keep the particle with the verb. Check a</tspan><tspan x="28" y="934.53">dictionary before changing its object or word</tspan><tspan x="28" y="971.28">order.</tspan></text><text x="28" y="1025.8799999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1057.8">A: How can we show appreciation through an</tspan><tspan x="28" y="1094.55">action?</tspan><tspan x="28" y="1131.3">B: Please pick up the bag.</tspan><tspan x="28" y="1168.05">A: That gives us a starting point.</tspan><tspan x="28" y="1204.8">B: Let us try it together.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1292.72">For Mother’s Day, look again. Explain “pick up”</tspan><tspan x="28" y="1329.47">in your own words, then use it in a sentence</tspan><tspan x="28" y="1366.22">about a practical way to say thank you.</tspan></text></svg>