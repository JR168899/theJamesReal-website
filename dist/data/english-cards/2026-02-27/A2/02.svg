<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>finish</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/02/27 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Hands work on a practical repair.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Hands work on a practical repair.</tspan></text><a href="https://www.pexels.com/photo/woman-sewing-clothes-in-workshop-5526307/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5526307</text></a></svg><text font-family="Arial, sans-serif" font-size="49.220000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="481.22">finish</tspan></text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="523.485">US /ˈfɪnɪʃ/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.540000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="553.6161999999999">finish · finishes · finished · finished · finishing (base ·</tspan><tspan x="28" y="582.3349999999999">third person · past · past participle · -ing)</tspan></text><text x="28" y="642.0838" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="674.6118">to complete something</tspan></text><text x="28" y="730.2518" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="762.7798">complete; bring to an end</tspan></text><text x="28" y="818.4198" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="850.9478">Let us finish this task before starting another.</tspan></text><text x="28" y="906.5878" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="939.1158">Use the verb in the sense shown in the</tspan><tspan x="28" y="976.5658000000001">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1014.0158">object; the word forms above show its</tspan><tspan x="28" y="1051.4658">changes.</tspan></text><text x="28" y="1107.1057999999998" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1139.6338">A: Can we finish before lunch?</tspan><tspan x="28" y="1177.0838">B: Yes, if I paint and you clean the brushes.</tspan><tspan x="28" y="1214.5338000000002">A: What about the table?</tspan><tspan x="28" y="1251.9838">B: We can move it after the paint dries.</tspan></text><text x="28" y="1307.6237999999998" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.1518">Explain how two people can share work to</tspan><tspan x="28" y="1377.6018000000001">finish before lunch.</tspan></text></svg>