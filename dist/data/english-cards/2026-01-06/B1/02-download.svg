<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>considerate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/01/06 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Welcoming someone includes noticing what they need.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Welcoming someone includes noticing what they need.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">considerate</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /kənˈsɪdərət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">considerate · more considerate · most considerate; noun:</tspan><tspan x="28" y="564.7724999999999">consideration</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">thinking about other people’s needs</tspan></text><text x="28" y="695.4093000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="724.1373000000002">thoughtful; mindful of others</tspan></text><text x="28" y="773.2773000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="802.0053000000001">It is considerate to ask before opening the window.</tspan></text><text x="28" y="851.1453" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="879.8733000000001">Topic: Around the table. Write one sentence using</tspan><tspan x="28" y="912.9483000000001">this word. Check that your sentence keeps the</tspan><tspan x="28" y="946.0233000000001">meaning shown above.</tspan></text><text x="28" y="995.1633" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1023.8913000000001">A: What does “considerate” mean?</tspan><tspan x="28" y="1056.9663">B: It means thinking about other people’s needs.</tspan><tspan x="28" y="1090.0413">A: Can we use it at the table?</tspan><tspan x="28" y="1123.1163000000001">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Apply the idea to a real situation, then answer: Which</tspan><tspan x="28" y="1320.923">word means “thinking about other people’s needs”:</tspan><tspan x="28" y="1353.998">considerate or portion? (Model: considerate)</tspan></text></svg>