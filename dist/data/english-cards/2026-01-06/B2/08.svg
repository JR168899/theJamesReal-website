<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/01/06 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together outdoors.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">There is nothing in the world so</tspan><tspan x="28" y="522.045">irresistibly contagious as</tspan><tspan x="28" y="572.0699999999999">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="17.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="599.475">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="647.325" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="673.7730000000001">A cheerful mood can spread from one person to others.</tspan></text><text x="28" y="719.013" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="745.4610000000001">Laughter can spread through a group; Good spirits can</tspan><tspan x="28" y="775.9110000000002">influence the people nearby</tspan></text><text x="28" y="821.1510000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="847.5990000000002">One guest starts laughing at a gentle joke, and soon the</tspan><tspan x="28" y="878.0490000000002">whole table is smiling.</tspan></text><text x="28" y="923.2890000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="949.7370000000002">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="980.1870000000002">spreading, rather than an infection. The original spelling</tspan><tspan x="28" y="1010.6370000000002">good-humour is retained.</tspan></text><text x="28" y="1055.8770000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1082.325">Aoede: Why does the narrator describe laughter as</tspan><tspan x="28" y="1112.775">contagious?</tspan><tspan x="28" y="1143.2250000000001">Echo: Because one person&#x27;s laughter can draw others</tspan><tspan x="28" y="1173.675">into it.</tspan><tspan x="28" y="1204.125">Aoede: Is the line a medical claim?</tspan><tspan x="28" y="1234.575">Echo: No. It is a literary comparison about a shared</tspan><tspan x="28" y="1265.025">mood.</tspan></text><text x="28" y="1310.2650000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1336.7130000000002">Explain contagious figuratively here, without presenting</tspan><tspan x="28" y="1367.1630000000002">laughter as an illness.</tspan></text></svg>