<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes a meal feel welcoming to you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/01/06 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#353331"><tspan x="28" y="478.69">What makes a meal feel</tspan><tspan x="28" y="537.0525">welcoming to you?</tspan></text><text x="28" y="600.49" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="631.346">An opening that invites a personal preference</tspan><tspan x="28" y="666.871">or experience without assuming everyone</tspan><tspan x="28" y="702.396">shares it.</tspan></text><text x="28" y="755.176" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="786.032">What makes a meal feel welcoming to you?</tspan></text><text x="28" y="838.812" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="869.668">Follow the answer with a related question.</tspan><tspan x="28" y="905.193">Accept a different preference or a declined</tspan><tspan x="28" y="940.7180000000001">invitation without asking the person to justify it.</tspan></text><text x="28" y="993.498" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="1024.354">A: Do you prefer a big dinner or something</tspan><tspan x="28" y="1059.8790000000001">simple?</tspan><tspan x="28" y="1095.404">B: Something simple, if it leaves time to talk.</tspan><tspan x="28" y="1130.929">A: Would soup and bread suit you?</tspan><tspan x="28" y="1166.4540000000002">B: Perfect. I can bring the bread.</tspan><tspan x="28" y="1201.979">A: Then I will make the soup.</tspan><tspan x="28" y="1237.5040000000001">B: And we can share the washing-up afterward.</tspan></text><text x="28" y="1290.284" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="1321.14">Your guest says they prefer simple food.</tspan><tspan x="28" y="1356.6650000000002">Suggest a meal and ask one relevant follow-up.</tspan></text></svg>