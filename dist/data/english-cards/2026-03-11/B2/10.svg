<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What do you notice when you explore a new neighborhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/03/11 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#353331"><tspan x="28" y="474.32">What do you notice when you</tspan><tspan x="28" y="527.22">explore a new neighborhood?</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="612.688">An opening that invites a personal preference or</tspan><tspan x="28" y="644.888">experience without assuming everyone shares it.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="720.696">What do you notice when you explore a new</tspan><tspan x="28" y="752.8960000000001">neighborhood?</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="828.7040000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="860.9040000000001">different preference or a declined invitation without</tspan><tspan x="28" y="893.104">asking the person to justify it.</tspan></text><text x="28" y="940.9440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="968.912">Aoede: Do you head straight for the main sights?</tspan><tspan x="28" y="1001.1120000000001">Echo: I usually walk a little first.</tspan><tspan x="28" y="1033.3120000000001">Aoede: What catches your eye?</tspan><tspan x="28" y="1065.512">Echo: Small shops and places where people stop to</tspan><tspan x="28" y="1097.712">talk.</tspan><tspan x="28" y="1129.912">Aoede: Would you rather explore alone or with a</tspan><tspan x="28" y="1162.112">local?</tspan><tspan x="28" y="1194.3120000000001">Echo: Both give you a different view. A local can</tspan><tspan x="28" y="1226.5120000000002">explain things I might miss.</tspan></text><text x="28" y="1274.352" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="1302.3200000000002">A visitor enjoys small neighborhood details. Suggest</tspan><tspan x="28" y="1334.5200000000002">an outing and explain why it may appeal.</tspan></text></svg>