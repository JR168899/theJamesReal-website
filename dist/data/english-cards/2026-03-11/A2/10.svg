<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually explore a neighbourhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A2 - 2026/03/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets form a city neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets form a city neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="48.53000000000001" font-weight="700" fill="#353331"><tspan x="28" y="480.53000000000003">How do you usually</tspan><tspan x="28" y="541.1925">explore a</tspan><tspan x="28" y="601.855">neighbourhood?</tspan></text><text x="28" y="667.7925" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="699.8645">An open question that invites a person to</tspan><tspan x="28" y="736.7895">describe a familiar experience.</tspan></text><text x="28" y="791.6495000000001" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="823.7215000000001">How do you usually explore a</tspan><tspan x="28" y="860.6465000000001">neighbourhood?</tspan></text><text x="28" y="915.5065000000001" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="947.5785000000001">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="984.5035">answer, then ask a related follow-up.</tspan></text><text x="28" y="1039.3635000000002" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1071.4355">A: How do you usually explore a</tspan><tspan x="28" y="1108.3605">neighbourhood?</tspan><tspan x="28" y="1145.2855">B: I get ready first, and I ask a friend to help.</tspan><tspan x="28" y="1182.2105000000001">A: What has helped you most?</tspan><tspan x="28" y="1219.1355">B: For example, we stop to look at a doorway</tspan><tspan x="28" y="1256.0605">instead of hurrying to the next landmark.</tspan></text><text x="28" y="1310.9205000000002" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1342.9925">Try without help. Write a reply of your own,</tspan><tspan x="28" y="1379.9175">then ask one related question.</tspan></text></svg>