<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Coordinators work through an arrangement together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Coordinators work through an arrangement together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="472.94">iron something out</tspan><tspan x="28" y="524.115">iron out something</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="606.7959999999999">Resolve practical problems or disagreements so that</tspan><tspan x="28" y="637.9459999999999">an arrangement can work smoothly.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="711.2819999999999">resolve; straighten out</tspan></text><text x="28" y="757.562" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="784.6179999999999">The coordinators met to iron out an overlap in the</tspan><tspan x="28" y="815.7679999999999">volunteers’ shifts before opening night.</tspan></text><text x="28" y="862.048" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="889.1039999999999">Separable: iron out the problems / iron the problems</tspan><tspan x="28" y="920.2539999999999">out; iron them out. Use it for resolving difficulties, not</tspan><tspan x="28" y="951.404">simply discovering them.</tspan></text><text x="28" y="997.684" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="1024.74">Kore: Two volunteers are booked for the early shift,</tspan><tspan x="28" y="1055.89">but nobody is staying until closing.</tspan><tspan x="28" y="1087.04">Onyx: We need to iron that out before we send the</tspan><tspan x="28" y="1118.19">rota.</tspan><tspan x="28" y="1149.3400000000001">Kore: I can move to the late shift if someone covers</tspan><tspan x="28" y="1180.49">the first half hour.</tspan><tspan x="28" y="1211.64">Onyx: I’ll cover it. That leaves us staffed throughout.</tspan></text><text x="28" y="1258.24" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.296">Replace the vague reply “We’ll deal with it” with a</tspan><tspan x="28" y="1316.4460000000001">specific two-sentence update using iron out. The</tspan><tspan x="28" y="1347.596">problem: two volunteers have been assigned the</tspan><tspan x="28" y="1378.746">same shift and the closing shift is empty.</tspan></text></svg>