<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Coordinators work through an arrangement together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Coordinators work through an arrangement together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">iron something out</tspan><tspan x="28" y="525.6675">iron out something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">Resolve practical problems or disagreements so that</tspan><tspan x="28" y="641.417">an arrangement can work smoothly.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="715.989">resolve; straighten out</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="790.561">The coordinators met to iron out an overlap in the</tspan><tspan x="28" y="822.236">volunteers’ shifts before opening night.</tspan></text><text x="28" y="869.2959999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="896.808">Separable: iron out the problems / iron the problems</tspan><tspan x="28" y="928.483">out; iron them out. Use it for resolving difficulties, not</tspan><tspan x="28" y="960.158">simply discovering them.</tspan></text><text x="28" y="1007.218" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1034.73">A: Two volunteers are booked for the early shift, but</tspan><tspan x="28" y="1066.405">nobody is staying until closing.</tspan><tspan x="28" y="1098.08">B: We need to iron that out before we send the rota.</tspan><tspan x="28" y="1129.755">A: I can move to the late shift if someone covers the</tspan><tspan x="28" y="1161.43">first half hour.</tspan><tspan x="28" y="1193.105">B: I’ll cover it. That leaves us staffed throughout.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Replace the vague reply “We’ll deal with it” with a</tspan><tspan x="28" y="1317.667">specific two-sentence update using iron out. The</tspan><tspan x="28" y="1349.3419999999999">problem: two volunteers have been assigned the</tspan><tspan x="28" y="1381.017">same shift and the closing shift is empty.</tspan></text></svg>