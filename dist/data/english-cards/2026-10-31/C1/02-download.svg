<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>commemoration</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Memorial candles express remembrance rather than a costume celebration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Memorial candles express remembrance rather than a costume celebration.</tspan></text><a href="https://www.pexels.com/photo/votive-candles-illuminating-a-memorial-tribute-29190201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 29190201</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#382d2e"><tspan x="28" y="468.0">commemoration</tspan></text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="495.48">US /kəˌmɛməˈreɪʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="14.520000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.0656">Singular: commemoration; plural: commemorations.</tspan></text><text x="28" y="550.9200000000001" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="570.984">An act or event held to honor the memory of a person or a past event.</tspan></text><text x="28" y="605.3040000000001" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="625.368">remembrance; memorial observance · A celebration may be joyful; a</tspan><tspan x="28" y="648.4680000000001">commemoration centers on remembering and honoring.</tspan></text><text x="28" y="682.788" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="702.8520000000001">The neighborhood held a candlelit commemoration for residents who had</tspan><tspan x="28" y="725.9520000000001">died during the previous year.</tspan></text><text x="28" y="760.2720000000002" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="780.3360000000001">Common patterns: a commemoration of an event; a ceremony in</tspan><tspan x="28" y="803.4360000000001">commemoration of someone. Do not assume Halloween and remembrance</tspan><tspan x="28" y="826.5360000000002">observances are the same tradition.</tspan></text><text x="28" y="860.8560000000002" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="880.9200000000002">A: Are the candles part of the costume festival?</tspan><tspan x="28" y="904.0200000000002">B: No. They’re for a separate commemoration in the square.</tspan><tspan x="28" y="927.1200000000002">A: Is it appropriate for visitors to attend?</tspan><tspan x="28" y="950.2200000000003">B: Yes. The organizers ask people to keep their voices low and leave the</tspan><tspan x="28" y="973.3200000000002">candles undisturbed.</tspan></text><text x="28" y="1254.56" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1274.624">An invitation reads: “Come to our commemoration—a loud costume contest</tspan><tspan x="28" y="1297.724">with prizes!” What expectation does commemoration create, and which</tspan><tspan x="28" y="1320.824">word better fits the advertised event? (Model: Commemoration suggests</tspan><tspan x="28" y="1343.924">honoring a person or past event. Celebration or party better fits the costume</tspan><tspan x="28" y="1367.0240000000001">contest, unless remembrance is genuinely its purpose.)</tspan></text></svg>