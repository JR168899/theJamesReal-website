<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>commemoration</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Memorial candles express remembrance rather than a costume celebration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Memorial candles express remembrance rather than a costume celebration.</tspan></text><a href="https://www.pexels.com/photo/votive-candles-illuminating-a-memorial-tribute-29190201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 29190201</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="470.41">commemoration</tspan></text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="503.3925">US /kəˌmɛməˈreɪʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="18.37" font-weight="400" fill="#382d2e"><tspan x="28" y="526.9060999999999">Singular: commemoration; plural: commemorations.</tspan></text><text x="28" y="573.5325" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="598.9165">An act or event held to honor the memory of a person or a</tspan><tspan x="28" y="628.1415000000001">past event.</tspan></text><text x="28" y="671.5615" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="696.9455">remembrance; memorial observance · A celebration may</tspan><tspan x="28" y="726.1705000000001">be joyful; a commemoration centers on remembering and</tspan><tspan x="28" y="755.3955000000001">honoring.</tspan></text><text x="28" y="798.8155" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="824.1995000000001">The neighborhood held a candlelit commemoration for</tspan><tspan x="28" y="853.4245000000001">residents who had died during the previous year.</tspan></text><text x="28" y="896.8445" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="922.2285">Common patterns: a commemoration of an event; a</tspan><tspan x="28" y="951.4535000000001">ceremony in commemoration of someone. Do not assume</tspan><tspan x="28" y="980.6785000000001">Halloween and remembrance observances are the same</tspan><tspan x="28" y="1009.9035000000001">tradition.</tspan></text><text x="28" y="1053.3235" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1078.7075000000002">Kore: Are the candles part of the costume festival?</tspan><tspan x="28" y="1107.9325000000001">Onyx: No. They’re for a separate commemoration in the</tspan><tspan x="28" y="1137.1575000000003">square.</tspan><tspan x="28" y="1166.3825000000002">Kore: Is it appropriate for visitors to attend?</tspan><tspan x="28" y="1195.6075000000003">Onyx: Yes. The organizers ask people to keep their voices</tspan><tspan x="28" y="1224.8325000000002">low and leave the candles undisturbed.</tspan></text><text x="28" y="1268.2525" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1293.6365000000003">An invitation reads: “Come to our commemoration—a loud</tspan><tspan x="28" y="1322.8615000000002">costume contest with prizes!” What expectation does</tspan><tspan x="28" y="1352.0865000000003">commemoration create, and which word better fits the</tspan><tspan x="28" y="1381.3115000000003">advertised event?</tspan></text></svg>