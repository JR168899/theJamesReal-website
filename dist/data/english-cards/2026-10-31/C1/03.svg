<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A route takes time; a departure plan must allow for the journey.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A route takes time; a departure plan must allow for the journey.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">factor something in</tspan><tspan x="28" y="525.6675">factor in something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">Include a relevant cost, condition or amount of time in</tspan><tspan x="28" y="641.417">a calculation or decision.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="715.989">allow for; take into account</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="790.561">When choosing our departure time, we factored in the</tspan><tspan x="28" y="822.236">walk to the venue and the queue at the entrance.</tspan></text><text x="28" y="869.2959999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="896.808">Separable: factor the delay in / factor in the delay. Put</tspan><tspan x="28" y="928.483">a pronoun in the middle: factor it in. Often used when</tspan><tspan x="28" y="960.158">planning or estimating.</tspan></text><text x="28" y="1007.218" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1034.73">Kore: The lantern walk starts at seven thirty. Leaving</tspan><tspan x="28" y="1066.405">at seven twenty should be fine.</tspan><tspan x="28" y="1098.08">Onyx: Have you factored in the fifteen-minute walk?</tspan><tspan x="28" y="1129.755">Kore: I hadn’t—and the organizers expect a</tspan><tspan x="28" y="1161.43">ten-minute queue.</tspan><tspan x="28" y="1193.105">Onyx: Then let’s work backward from the start time.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">The walk starts at 7:30. Getting there takes 15</tspan><tspan x="28" y="1317.667">minutes and entry takes another 10. What is the</tspan><tspan x="28" y="1349.3419999999999">latest departure time? Explain your calculation in one</tspan><tspan x="28" y="1381.017">sentence using factor in.</tspan></text></svg>