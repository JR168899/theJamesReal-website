<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small print can contain a condition that changes the whole plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small print can contain a condition that changes the whole plan.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">the devil is in the details</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">A plan that appears straightforward may depend on</tspan><tspan x="28" y="589.3795">small, easily overlooked details.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="663.9515">small points can cause big problems; careful</tspan><tspan x="28" y="695.6265">execution matters</tspan></text><text x="28" y="742.6864999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="770.1985">The costume contest sounded open to everyone, but</tspan><tspan x="28" y="801.8734999999999">the devil was in the details: entrants needed to</tspan><tspan x="28" y="833.5485">register before noon.</tspan></text><text x="28" y="880.6084999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="908.1205">Often used as a warning after broad agreement with a</tspan><tspan x="28" y="939.7955">proposal. It draws attention to implementation; it does</tspan><tspan x="28" y="971.4705">not mean every plan is doomed.</tspan></text><text x="28" y="1018.5305" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1046.0425">A: Entry is free, so we can register when we get there.</tspan><tspan x="28" y="1077.7175">B: Read the small print. Registration closes at noon.</tspan><tspan x="28" y="1109.3925">A: Ah, the devil is in the details. I only noticed “free</tspan><tspan x="28" y="1141.0675">entry.”</tspan><tspan x="28" y="1172.7425">B: We still have twenty minutes. Let’s register now.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Which overlooked detail best justifies this idiom? A:</tspan><tspan x="28" y="1317.667">The poster is orange. B: Registration closes six hours</tspan><tspan x="28" y="1349.3419999999999">before the contest. C: The event has a cheerful name.</tspan><tspan x="28" y="1381.017">Give one practical consequence.</tspan></text></svg>