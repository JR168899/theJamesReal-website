<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small print can contain a condition that changes the whole plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small print can contain a condition that changes the whole plan.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#383426"><tspan x="28" y="472.02">the devil is in the details</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="552.8430000000001">A plan that appears straightforward may depend on</tspan><tspan x="28" y="583.2930000000001">small, easily overlooked details.</tspan></text><text x="28" y="628.533" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="654.9810000000001">small points can cause big problems; careful execution</tspan><tspan x="28" y="685.4310000000002">matters</tspan></text><text x="28" y="730.671" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="757.1190000000001">The costume contest sounded open to everyone, but the</tspan><tspan x="28" y="787.5690000000002">devil was in the details: entrants needed to register</tspan><tspan x="28" y="818.0190000000001">before noon.</tspan></text><text x="28" y="863.2590000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="889.7070000000002">Often used as a warning after broad agreement with a</tspan><tspan x="28" y="920.1570000000003">proposal. It draws attention to implementation; it does not</tspan><tspan x="28" y="950.6070000000002">mean every plan is doomed.</tspan></text><text x="28" y="995.8470000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1022.2950000000002">Kore: Entry is free, so we can register when we get</tspan><tspan x="28" y="1052.7450000000001">there.</tspan><tspan x="28" y="1083.1950000000002">Onyx: Read the small print. Registration closes at noon.</tspan><tspan x="28" y="1113.6450000000002">Kore: Ah, the devil is in the details. I only noticed “free</tspan><tspan x="28" y="1144.0950000000003">entry.”</tspan><tspan x="28" y="1174.545">Onyx: We still have twenty minutes. Let’s register now.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1284.368">Which overlooked detail best justifies this idiom? A: The</tspan><tspan x="28" y="1314.818">poster is orange. B: Registration closes six hours before</tspan><tspan x="28" y="1345.268">the contest. C: The event has a cheerful name. Give one</tspan><tspan x="28" y="1375.7179999999998">practical consequence.</tspan></text></svg>