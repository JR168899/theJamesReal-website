<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a double-edged sword</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Online sharing offers visibility but can reduce control over an image.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Online sharing offers visibility but can reduce control over an image.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#383426"><tspan x="28" y="472.48">a double-edged sword</tspan></text><text x="28" y="527.48" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="554.232">Something that brings an advantage while also</tspan><tspan x="28" y="585.0319999999999">creating a related disadvantage or risk.</tspan></text><text x="28" y="630.792" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="657.544">a mixed blessing; an advantage with a downside</tspan></text><text x="28" y="703.304" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="730.0559999999999">Posting the party photos online is a double-edged</tspan><tspan x="28" y="760.8559999999999">sword: it spreads the word, but guests may lose</tspan><tspan x="28" y="791.656">control of where their images appear.</tspan></text><text x="28" y="837.416" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="864.168">Name both edges: a benefit and a cost of the same</tspan><tspan x="28" y="894.968">thing. Two unrelated complaints do not demonstrate</tspan><tspan x="28" y="925.768">the idiom.</tspan></text><text x="28" y="971.5280000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="998.2800000000001">A: Last year’s photos brought in twice as many</tspan><tspan x="28" y="1029.0800000000002">visitors. We should post everything again.</tspan><tspan x="28" y="1059.88">B: Publicity is a double-edged sword. Some guests</tspan><tspan x="28" y="1090.68">don’t want their children’s faces online.</tspan><tspan x="28" y="1121.48">A: Could we use close-ups of the decorations</tspan><tspan x="28" y="1152.2800000000002">instead?</tspan><tspan x="28" y="1183.0800000000002">B: Yes, and ask permission before including anyone</tspan><tspan x="28" y="1213.88">identifiable.</tspan></text><text x="28" y="1259.64" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1286.3920000000003">Complete this balanced assessment with one benefit</tspan><tspan x="28" y="1317.1920000000002">and one drawback: “A public event hashtag is a</tspan><tspan x="28" y="1347.9920000000002">double-edged sword: ___, yet ___.” Keep both points</tspan><tspan x="28" y="1378.7920000000004">connected to public visibility.</tspan></text></svg>