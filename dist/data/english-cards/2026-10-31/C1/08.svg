<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cauldron is a large cooking pot: the central object in the witches’ chant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cauldron is a large cooking pot: the central object in the witches’ chant.</tspan></text><a href="https://www.pexels.com/photo/vintage-cauldron-on-rustic-background-showcasing-age-33635613/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 33635613</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="470.41">Double, double toil and trouble;</tspan><tspan x="28" y="518.4225">Fire burn, and cauldron bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="16.700000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="544.725">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published 1623</tspan></text><text x="28" y="590.65" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="616.034">A rhythmic chant that creates a supernatural atmosphere</tspan><tspan x="28" y="645.259">in a scene from Macbeth.</tspan></text><text x="28" y="688.679" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="714.063">a spell-like chant; a rhythmic incantation · These describe</tspan><tspan x="28" y="743.288">the kind of speech; they are not substitute quotations.</tspan></text><text x="28" y="786.708" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="812.092">During rehearsal, the actors stressed “Double, double”</tspan><tspan x="28" y="841.317">and the repeated b sounds to give the witches’ chant its</tspan><tspan x="28" y="870.542">driving rhythm.</tspan></text><text x="28" y="913.962" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="939.346">Macbeth, Act 4, Scene 1; first published in the First Folio</tspan><tspan x="28" y="968.571">(1623). The speakers are the witches, not Shakespeare</tspan><tspan x="28" y="997.796">speaking personally. Toil means hard work; a cauldron is a</tspan><tspan x="28" y="1027.021">large pot.</tspan></text><text x="28" y="1070.4409999999998" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1095.825">A: Shall I whisper the whole line to make it sound sinister?</tspan><tspan x="28" y="1125.05">B: Try stressing “Double, double” first. The repetition gives</tspan><tspan x="28" y="1154.275">it a pulse.</tspan><tspan x="28" y="1183.5">A: And make “burn” and “bubble” sharper?</tspan><tspan x="28" y="1212.7250000000001">B: Exactly. Let the sounds create the tension rather than</tspan><tspan x="28" y="1241.95">simply making your voice louder.</tspan></text><text x="28" y="1285.37" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1310.7540000000001">You are directing this line for a school performance.</tspan><tspan x="28" y="1339.979">Identify one repetition and one repeated consonant sound.</tspan><tspan x="28" y="1369.2040000000002">Explain how you would use them in delivery.</tspan></text></svg>