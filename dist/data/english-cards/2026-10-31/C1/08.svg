<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cauldron is a large cooking pot: the central object in the witches’ chant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cauldron is a large cooking pot: the central object in the witches’ chant.</tspan></text><a href="https://www.pexels.com/photo/vintage-cauldron-on-rustic-background-showcasing-age-33635613/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 33635613</text></a></svg><text font-family="Arial, sans-serif" font-size="37.720000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="469.72">Double, double toil and trouble;</tspan><tspan x="28" y="516.87">Fire burn, and cauldron bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="542.6999999999999">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published 1623</tspan></text><text x="28" y="587.8" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="612.728">A rhythmic chant that creates a supernatural atmosphere</tspan><tspan x="28" y="641.428">in a scene from Macbeth.</tspan></text><text x="28" y="684.068" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="708.996">a spell-like chant; a rhythmic incantation · These describe</tspan><tspan x="28" y="737.696">the kind of speech; they are not substitute quotations.</tspan></text><text x="28" y="780.336" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="805.264">During rehearsal, the actors stressed “Double, double”</tspan><tspan x="28" y="833.964">and the repeated b sounds to give the witches’ chant its</tspan><tspan x="28" y="862.664">driving rhythm.</tspan></text><text x="28" y="905.304" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="930.232">Macbeth, Act 4, Scene 1; first published in the First Folio</tspan><tspan x="28" y="958.932">(1623). The speakers are the witches, not Shakespeare</tspan><tspan x="28" y="987.632">speaking personally. Toil means hard work; a cauldron is a</tspan><tspan x="28" y="1016.332">large pot.</tspan></text><text x="28" y="1058.9719999999998" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="1083.8999999999999">Kore: Shall I whisper the whole line to make it sound</tspan><tspan x="28" y="1112.6">sinister?</tspan><tspan x="28" y="1141.3">Onyx: Try stressing “Double, double” first. The repetition</tspan><tspan x="28" y="1169.9999999999998">gives it a pulse.</tspan><tspan x="28" y="1198.6999999999998">Kore: And make “burn” and “bubble” sharper?</tspan><tspan x="28" y="1227.3999999999999">Onyx: Exactly. Let the sounds create the tension rather</tspan><tspan x="28" y="1256.1">than simply making your voice louder.</tspan></text><text x="28" y="1298.7399999999998" font-family="Arial, sans-serif" font-size="13.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.96" font-weight="400" fill="#2c3540"><tspan x="28" y="1323.668">You are directing this line for a school performance.</tspan><tspan x="28" y="1352.368">Identify one repetition and one repeated consonant sound.</tspan><tspan x="28" y="1381.068">Explain how you would use them in delivery.</tspan></text></svg>