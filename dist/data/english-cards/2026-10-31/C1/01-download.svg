<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>uncanny</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Mist makes the familiar forest difficult to recognize.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Mist makes the familiar forest difficult to recognize.</tspan></text><a href="https://www.pexels.com/photo/tall-trees-in-the-forest-covered-in-fog-5288094/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5288094</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#382d2e"><tspan x="28" y="468.0">uncanny</tspan></text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="496.46">US /ʌnˈkæni/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="15.290000000000001" font-weight="400" fill="#382d2e"><tspan x="28" y="516.0312">uncanny · more uncanny · most uncanny; noun: uncanniness</tspan></text><text x="28" y="554.84" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="575.9680000000001">Strange and difficult to explain, often in a way that makes you feel</tspan><tspan x="28" y="600.2930000000001">uneasy.</tspan></text><text x="28" y="636.433" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="657.561">eerie; strangely unsettling · Eerie emphasizes unease; uncanny can</tspan><tspan x="28" y="681.8860000000001">also describe a startling resemblance or ability.</tspan></text><text x="28" y="718.026" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="739.154">In the fog, the familiar path had an uncanny stillness, as if the whole</tspan><tspan x="28" y="763.479">forest were holding its breath.</tspan></text><text x="28" y="799.6189999999999" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="820.747">Use uncanny before a noun or after seem, feel or look. An uncanny</tspan><tspan x="28" y="845.072">resemblance is strikingly exact; it need not be frightening.</tspan></text><text x="28" y="881.2119999999999" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="902.3399999999999">Kore: This is the path we walked yesterday, isn’t it?</tspan><tspan x="28" y="926.665">Onyx: Yes, but the fog makes it feel uncanny. I can barely see the</tspan><tspan x="28" y="950.9899999999999">next tree.</tspan><tspan x="28" y="975.3149999999999">Kore: And there’s not a sound. Shall we head back?</tspan><tspan x="28" y="999.6399999999999">Onyx: Let’s. I’d rather take the road while it’s still light.</tspan></text><text x="28" y="1255.12" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1276.248">Choose the more natural use of uncanny and explain why: (a) The</tspan><tspan x="28" y="1300.573">twins, who had never met, used exactly the same unusual</tspan><tspan x="28" y="1324.8980000000001">expressions. (b) The bus arrived at its advertised time. (Model: (a).</tspan><tspan x="28" y="1349.223">Their unexpectedly exact similarity is difficult to explain. A bus arriving</tspan><tspan x="28" y="1373.548">on schedule is ordinary, so uncanny would usually be inappropriate.)</tspan></text></svg>