<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Inversion after only then</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Trying a costume on is only the first step; it must also work in motion.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Trying a costume on is only the first step; it must also work in motion.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382f40"><tspan x="28" y="475.47">Inversion after only then</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="563.2605000000001">When Only then opens a clause meaning “not until</tspan><tspan x="28" y="596.3355000000001">that moment,” place the auxiliary before the subject.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="674.2035000000001">I tried walking in the full costume. Only then did I</tspan><tspan x="28" y="707.2785000000001">realize that the mask blocked my view.</tspan></text><text x="28" y="756.4185" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="785.1465000000001">Past simple: Only then did + subject + base verb.</tspan><tspan x="28" y="818.2215000000001">Past perfect: Only then had + subject + past</tspan><tspan x="28" y="851.2965">participle. No inversion in “I only then realized…”;</tspan><tspan x="28" y="884.3715000000001">this fronted pattern is more emphatic.</tspan></text><text x="28" y="933.5115" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="962.2395">A: Did the costume work when you tried it on?</tspan><tspan x="28" y="995.3145000000001">B: It looked fine in the mirror. Then I tried going down</tspan><tspan x="28" y="1028.3895">the steps.</tspan><tspan x="28" y="1061.4645">A: What happened?</tspan><tspan x="28" y="1094.5395">B: Only then did I realize I couldn’t see my feet</tspan><tspan x="28" y="1127.6145000000001">through the mask.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="1287.848">Rewrite as one sentence beginning Only then: “We</tspan><tspan x="28" y="1320.923">tested the costume in the dark. At that moment, we</tspan><tspan x="28" y="1353.998">noticed that the sleeves covered the reflective strips.”</tspan></text></svg>