<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>uncanny</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Mist makes the familiar forest difficult to recognize.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Mist makes the familiar forest difficult to recognize.</tspan></text><a href="https://www.pexels.com/photo/tall-trees-in-the-forest-covered-in-fog-5288094/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5288094</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">uncanny</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /ʌnˈkæni/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">uncanny · more uncanny · most uncanny; noun: uncanniness</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">Strange and difficult to explain, often in a way that</tspan><tspan x="28" y="641.0609999999999">makes you feel uneasy.</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">eerie; strangely unsettling · Eerie emphasizes</tspan><tspan x="28" y="745.5469999999999">unease; uncanny can also describe a startling</tspan><tspan x="28" y="776.6969999999999">resemblance or ability.</tspan></text><text x="28" y="822.9770000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="850.033">In the fog, the familiar path had an uncanny stillness,</tspan><tspan x="28" y="881.183">as if the whole forest were holding its breath.</tspan></text><text x="28" y="927.4630000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="954.519">Use uncanny before a noun or after seem, feel or</tspan><tspan x="28" y="985.669">look. An uncanny resemblance is strikingly exact; it</tspan><tspan x="28" y="1016.819">need not be frightening.</tspan></text><text x="28" y="1063.0990000000002" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.1550000000002">Kore: This is the path we walked yesterday, isn’t it?</tspan><tspan x="28" y="1121.3050000000003">Onyx: Yes, but the fog makes it feel uncanny. I can</tspan><tspan x="28" y="1152.4550000000002">barely see the next tree.</tspan><tspan x="28" y="1183.6050000000002">Kore: And there’s not a sound. Shall we head back?</tspan><tspan x="28" y="1214.755">Onyx: Let’s. I’d rather take the road while it’s still light.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Choose the more natural use of uncanny and explain</tspan><tspan x="28" y="1319.2410000000002">why: (a) The twins, who had never met, used exactly</tspan><tspan x="28" y="1350.391">the same unusual expressions. (b) The bus arrived at</tspan><tspan x="28" y="1381.5410000000002">its advertised time.</tspan></text></svg>