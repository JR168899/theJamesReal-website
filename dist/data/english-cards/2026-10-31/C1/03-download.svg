<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A route takes time; a departure plan must allow for the journey.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A route takes time; a departure plan must allow for the journey.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">factor something in</tspan><tspan x="28" y="513.0">factor in something</tspan></text><text x="28" y="559.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="582.236">Include a relevant cost, condition or amount of time in a</tspan><tspan x="28" y="608.136">calculation or decision.</tspan></text><text x="28" y="646.616" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="669.112">allow for; take into account</tspan></text><text x="28" y="707.592" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="730.088">When choosing our departure time, we factored in the walk to</tspan><tspan x="28" y="755.9879999999999">the venue and the queue at the entrance.</tspan></text><text x="28" y="794.468" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="816.9639999999999">Separable: factor the delay in / factor in the delay. Put a</tspan><tspan x="28" y="842.8639999999999">pronoun in the middle: factor it in. Often used when planning or</tspan><tspan x="28" y="868.7639999999999">estimating.</tspan></text><text x="28" y="907.244" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="929.74">A: The lantern walk starts at seven thirty. Leaving at seven</tspan><tspan x="28" y="955.64">twenty should be fine.</tspan><tspan x="28" y="981.54">B: Have you factored in the fifteen-minute walk?</tspan><tspan x="28" y="1007.44">A: I hadn’t—and the organizers expect a ten-minute queue.</tspan><tspan x="28" y="1033.34">B: Then let’s work backward from the start time.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1278.336">The walk starts at 7:30. Getting there takes 15 minutes and</tspan><tspan x="28" y="1304.236">entry takes another 10. What is the latest departure time?</tspan><tspan x="28" y="1330.136">Explain your calculation in one sentence using factor in.</tspan><tspan x="28" y="1356.036">(Model: We should leave by 7:05 because we need to factor in</tspan><tspan x="28" y="1381.936">both the fifteen-minute walk and the ten-minute queue.)</tspan></text></svg>