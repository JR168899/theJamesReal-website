<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pumpkin carving offers a quieter alternative to a haunted attraction.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pumpkin carving offers a quieter alternative to a haunted attraction.</tspan></text><a href="https://www.pexels.com/photo/vibrant-harvest-pumpkins-for-autumn-decor-38757012/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 38757012</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#353331"><tspan x="28" y="470.41">What would you like to do for</tspan><tspan x="28" y="518.4225">Halloween?</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="595.994">An open invitation to share Halloween preferences without</tspan><tspan x="28" y="625.219">assuming that the other person celebrates it.</tspan></text><text x="28" y="668.639" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="694.023">“What would you like to do for Halloween—if you’re doing</tspan><tspan x="28" y="723.248">anything this year?”</tspan></text><text x="28" y="766.668" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="792.052">Offer a low-pressure follow-up. If someone says they do</tspan><tspan x="28" y="821.277">not celebrate, accept the answer and move to another</tspan><tspan x="28" y="850.5020000000001">topic rather than asking them to justify it.</tspan></text><text x="28" y="893.922" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="919.306">Kore: What would you like to do for Halloween, if you’re</tspan><tspan x="28" y="948.5310000000001">doing anything this year?</tspan><tspan x="28" y="977.7560000000001">Onyx: Something low-key. I’m not really into haunted</tspan><tspan x="28" y="1006.981">houses.</tspan><tspan x="28" y="1036.2060000000001">Kore: Same here. How about carving a pumpkin and</tspan><tspan x="28" y="1065.431">making dinner?</tspan><tspan x="28" y="1094.656">Onyx: That sounds more like me. Have you ever managed</tspan><tspan x="28" y="1123.881">one of those elaborate designs?</tspan><tspan x="28" y="1153.106">Kore: Once. It looked impressive for about ten minutes</tspan><tspan x="28" y="1182.3310000000001">before it collapsed.</tspan><tspan x="28" y="1211.556">Onyx: Then let’s start with a face we can actually finish.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1282.7440000000001">Your neighbor replies, “I don’t celebrate Halloween,</tspan><tspan x="28" y="1311.969">actually.” Write a friendly response that acknowledges this</tspan><tspan x="28" y="1341.1940000000002">and smoothly opens a different topic. (Model: Of course.</tspan><tspan x="28" y="1370.419">Are you doing anything nice this weekend instead?)</tspan></text></svg>