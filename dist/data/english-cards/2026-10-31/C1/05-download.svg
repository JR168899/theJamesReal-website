<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small print can contain a condition that changes the whole plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small print can contain a condition that changes the whole plan.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#383426"><tspan x="28" y="468.0">the devil is in the details</tspan></text><text x="28" y="514.23" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="536.422">A plan that appears straightforward may depend on small, easily</tspan><tspan x="28" y="561.972">overlooked details.</tspan></text><text x="28" y="599.932" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="622.1240000000001">small points can cause big problems; careful execution matters</tspan></text><text x="28" y="660.0840000000001" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="682.2760000000002">The costume contest sounded open to everyone, but the devil was</tspan><tspan x="28" y="707.8260000000001">in the details: entrants needed to register before noon.</tspan></text><text x="28" y="745.7860000000001" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="767.9780000000002">Often used as a warning after broad agreement with a proposal. It</tspan><tspan x="28" y="793.5280000000001">draws attention to implementation; it does not mean every plan is</tspan><tspan x="28" y="819.0780000000002">doomed.</tspan></text><text x="28" y="857.0380000000001" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="879.2300000000002">Kore: Entry is free, so we can register when we get there.</tspan><tspan x="28" y="904.7800000000002">Onyx: Read the small print. Registration closes at noon.</tspan><tspan x="28" y="930.3300000000003">Kore: Ah, the devil is in the details. I only noticed “free entry.”</tspan><tspan x="28" y="955.8800000000002">Onyx: We still have twenty minutes. Let’s register now.</tspan></text><text x="28" y="1255.68" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#383426"><tspan x="28" y="1277.872">Which overlooked detail best justifies this idiom? A: The poster is</tspan><tspan x="28" y="1303.422">orange. B: Registration closes six hours before the contest. C: The</tspan><tspan x="28" y="1328.972">event has a cheerful name. Give one practical consequence.</tspan><tspan x="28" y="1354.5220000000002">(Model: B. Someone arriving at the contest without registering</tspan><tspan x="28" y="1380.0720000000001">earlier could be unable to enter, even though admission is free.)</tspan></text></svg>