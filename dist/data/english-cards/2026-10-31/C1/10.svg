<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pumpkin carving offers a quieter alternative to a haunted attraction.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pumpkin carving offers a quieter alternative to a haunted attraction.</tspan></text><a href="https://www.pexels.com/photo/vibrant-harvest-pumpkins-for-autumn-decor-38757012/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 38757012</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#353331"><tspan x="28" y="472.02">What would you like to do for</tspan><tspan x="28" y="522.045">Halloween?</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="602.868">An open invitation to share Halloween preferences</tspan><tspan x="28" y="633.3180000000001">without assuming that the other person celebrates it.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="705.0060000000001">“What would you like to do for Halloween—if you’re doing</tspan><tspan x="28" y="735.4560000000001">anything this year?”</tspan></text><text x="28" y="780.696" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="807.1440000000001">Offer a low-pressure follow-up. If someone says they do</tspan><tspan x="28" y="837.5940000000002">not celebrate, accept the answer and move to another</tspan><tspan x="28" y="868.0440000000001">topic rather than asking them to justify it.</tspan></text><text x="28" y="913.284" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="939.7320000000001">A: What would you like to do for Halloween, if you’re</tspan><tspan x="28" y="970.1820000000001">doing anything this year?</tspan><tspan x="28" y="1000.6320000000001">B: Something low-key. I’m not really into haunted</tspan><tspan x="28" y="1031.082">houses.</tspan><tspan x="28" y="1061.5320000000002">A: Same here. How about carving a pumpkin and making</tspan><tspan x="28" y="1091.982">dinner?</tspan><tspan x="28" y="1122.432">B: That sounds more like me. Have you ever managed</tspan><tspan x="28" y="1152.882">one of those elaborate designs?</tspan><tspan x="28" y="1183.332">A: Once. It looked impressive for about ten minutes</tspan><tspan x="28" y="1213.7820000000002">before it collapsed.</tspan><tspan x="28" y="1244.232">B: Then let’s start with a face we can actually finish.</tspan></text><text x="28" y="1289.4720000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1315.92">Your neighbor replies, “I don’t celebrate Halloween,</tspan><tspan x="28" y="1346.3700000000001">actually.” Write a friendly response that acknowledges</tspan><tspan x="28" y="1376.8200000000002">this and smoothly opens a different topic.</tspan></text></svg>