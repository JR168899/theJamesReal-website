<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Inversion after only then</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Trying a costume on is only the first step; it must also work in motion.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Trying a costume on is only the first step; it must also work in motion.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#382f40"><tspan x="28" y="468.0">Inversion after only then</tspan></text><text x="28" y="514.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="537.236">When Only then opens a clause meaning “not until that</tspan><tspan x="28" y="563.136">moment,” place the auxiliary before the subject.</tspan></text><text x="28" y="601.616" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="624.112">I tried walking in the full costume. Only then did I realize that</tspan><tspan x="28" y="650.012">the mask blocked my view.</tspan></text><text x="28" y="688.492" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="710.9879999999999">Past simple: Only then did + subject + base verb. Past perfect:</tspan><tspan x="28" y="736.8879999999999">Only then had + subject + past participle. No inversion in “I</tspan><tspan x="28" y="762.7879999999999">only then realized…”; this fronted pattern is more emphatic.</tspan></text><text x="28" y="801.2679999999999" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="823.7639999999999">Kore: Did the costume work when you tried it on?</tspan><tspan x="28" y="849.6639999999999">Onyx: It looked fine in the mirror. Then I tried going down the</tspan><tspan x="28" y="875.5639999999999">steps.</tspan><tspan x="28" y="901.4639999999999">Kore: What happened?</tspan><tspan x="28" y="927.3639999999999">Onyx: Only then did I realize I couldn’t see my feet through the</tspan><tspan x="28" y="953.2639999999999">mask.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="1278.336">Rewrite as one sentence beginning Only then: “We tested the</tspan><tspan x="28" y="1304.236">costume in the dark. At that moment, we noticed that the</tspan><tspan x="28" y="1330.136">sleeves covered the reflective strips.” (Model: Only then did we</tspan><tspan x="28" y="1356.036">notice that the sleeves covered the reflective strips. Use</tspan><tspan x="28" y="1381.936">notice, not noticed, after did.)</tspan></text></svg>