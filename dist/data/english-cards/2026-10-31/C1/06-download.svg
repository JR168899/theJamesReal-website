<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a double-edged sword</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Online sharing offers visibility but can reduce control over an image.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Online sharing offers visibility but can reduce control over an image.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#383426"><tspan x="28" y="468.0">a double-edged sword</tspan></text><text x="28" y="512.4449999999999" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="533.573">Something that brings an advantage while also creating a related</tspan><tspan x="28" y="557.898">disadvantage or risk.</tspan></text><text x="28" y="594.038" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="615.166">a mixed blessing; an advantage with a downside</tspan></text><text x="28" y="651.306" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="672.4340000000001">Posting the party photos online is a double-edged sword: it spreads</tspan><tspan x="28" y="696.7590000000001">the word, but guests may lose control of where their images appear.</tspan></text><text x="28" y="732.899" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="754.027">Name both edges: a benefit and a cost of the same thing. Two</tspan><tspan x="28" y="778.3520000000001">unrelated complaints do not demonstrate the idiom.</tspan></text><text x="28" y="814.492" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="835.62">A: Last year’s photos brought in twice as many visitors. We should</tspan><tspan x="28" y="859.945">post everything again.</tspan><tspan x="28" y="884.27">B: Publicity is a double-edged sword. Some guests don’t want their</tspan><tspan x="28" y="908.595">children’s faces online.</tspan><tspan x="28" y="932.9200000000001">A: Could we use close-ups of the decorations instead?</tspan><tspan x="28" y="957.245">B: Yes, and ask permission before including anyone identifiable.</tspan></text><text x="28" y="1255.12" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#383426"><tspan x="28" y="1276.248">Complete this balanced assessment with one benefit and one</tspan><tspan x="28" y="1300.573">drawback: “A public event hashtag is a double-edged sword: ___, yet</tspan><tspan x="28" y="1324.8980000000001">___.” Keep both points connected to public visibility. (Model: A public</tspan><tspan x="28" y="1349.223">event hashtag is a double-edged sword: it helps people discover the</tspan><tspan x="28" y="1373.548">event, yet it can expose participants’ photos to strangers.)</tspan></text></svg>