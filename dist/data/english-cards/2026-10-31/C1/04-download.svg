<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/31 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Coordinators work through an arrangement together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Coordinators work through an arrangement together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">iron something out</tspan><tspan x="28" y="513.0">iron out something</tspan></text><text x="28" y="555.6600000000001" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="575.724">Resolve practical problems or disagreements so that an arrangement can</tspan><tspan x="28" y="598.8240000000001">work smoothly.</tspan></text><text x="28" y="633.144" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="653.2080000000001">resolve; straighten out</tspan></text><text x="28" y="687.528" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="707.5920000000001">The coordinators met to iron out an overlap in the volunteers’ shifts before</tspan><tspan x="28" y="730.6920000000001">opening night.</tspan></text><text x="28" y="765.0120000000002" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="785.0760000000001">Separable: iron out the problems / iron the problems out; iron them out. Use</tspan><tspan x="28" y="808.1760000000002">it for resolving difficulties, not simply discovering them.</tspan></text><text x="28" y="842.4960000000001" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="862.5600000000002">Kore: Two volunteers are booked for the early shift, but nobody is staying</tspan><tspan x="28" y="885.6600000000002">until closing.</tspan><tspan x="28" y="908.7600000000002">Onyx: We need to iron that out before we send the rota.</tspan><tspan x="28" y="931.8600000000001">Kore: I can move to the late shift if someone covers the first half hour.</tspan><tspan x="28" y="954.9600000000002">Onyx: I’ll cover it. That leaves us staffed throughout.</tspan></text><text x="28" y="1254.56" font-family="Arial, sans-serif" font-size="10.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="18.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1274.624">Replace the vague reply “We’ll deal with it” with a specific two-sentence</tspan><tspan x="28" y="1297.724">update using iron out. The problem: two volunteers have been assigned the</tspan><tspan x="28" y="1320.824">same shift and the closing shift is empty. (Model: We’ve ironed out the</tspan><tspan x="28" y="1343.924">overlap by moving one volunteer to the closing shift. The early team will</tspan><tspan x="28" y="1367.0240000000001">cover the first half hour until the replacement arrives.)</tspan></text></svg>