<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/10/31 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A costume creates a playful Halloween character.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A costume creates a playful Halloween character.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">Double, double toil and trouble;</tspan><tspan x="28" y="522.045">Fire burn, and cauldron bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="17.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="549.4499999999999">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published 1623</tspan></text><text x="28" y="597.3" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="623.748">The repeated sounds create the atmosphere of a fictional</tspan><tspan x="28" y="654.1980000000001">spell.</tspan></text><text x="28" y="699.438" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="725.8860000000001">A rhythmic chant builds a supernatural mood; Repeated</tspan><tspan x="28" y="756.3360000000001">words create a dramatic incantation</tspan></text><text x="28" y="801.576" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="828.0240000000001">At the costume gathering, we read the lines as a piece of</tspan><tspan x="28" y="858.4740000000002">theater rather than a real instruction.</tspan></text><text x="28" y="903.714" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="930.1620000000001">The witches chant these lines in the play. Toil means</tspan><tspan x="28" y="960.6120000000002">hard work; cauldron means a large pot. The date refers</tspan><tspan x="28" y="991.0620000000001">to publication, not to a recorded spoken event.</tspan></text><text x="28" y="1036.3020000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1062.75">A: Which line caught your attention?</tspan><tspan x="28" y="1093.2">B: “Double, double toil and trouble; Fire burn, and</tspan><tspan x="28" y="1123.65">cauldron bubble.”</tspan><tspan x="28" y="1154.1">A: How does that connect with the example?</tspan><tspan x="28" y="1184.55">B: Repetition, rhythm and the bubbling-pot image create</tspan><tspan x="28" y="1215.0">the fictional atmosphere.</tspan></text><text x="28" y="1260.2400000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.688">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1317.1380000000001">Which detail supports your explanation? (Model:</tspan><tspan x="28" y="1347.5880000000002">Repetition, rhythm and the bubbling-pot image create the</tspan><tspan x="28" y="1378.038">fictional atmosphere.)</tspan></text></svg>