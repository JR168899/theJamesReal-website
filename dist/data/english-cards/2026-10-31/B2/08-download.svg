<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A small decision matters when it helps someone else.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/10/31 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A small decision matters when it helps someone else.</title><desc>Original family-manga illustration: book, related to A small decision matters when it helps someone else..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.94" font-weight="700" fill="#2c3540"><tspan x="28" y="472.94">A small decision matters when</tspan><tspan x="28" y="524.115">it helps someone else.</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="606.7959999999999">The value of a modest choice can lie in the benefit it</tspan><tspan x="28" y="637.9459999999999">gives another person.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="711.2819999999999">A modest choice can be valuable to another person.;</tspan><tspan x="28" y="742.4319999999999">Thoughtful decisions need not be grand.</tspan></text><text x="28" y="788.712" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="815.7679999999999">For example, we explain a favourite passage to a</tspan><tspan x="28" y="846.9179999999999">friend and listen to a different interpretation.</tspan></text><text x="28" y="893.198" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="920.2539999999999">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="951.4039999999999">to a specific action in the example, and explain why</tspan><tspan x="28" y="982.5539999999999">you agree or disagree.</tspan></text><text x="28" y="1028.8339999999998" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1055.89">A: What did we learn from that experience?</tspan><tspan x="28" y="1087.0400000000002">B: A small decision matters when it helps someone</tspan><tspan x="28" y="1118.19">else.</tspan><tspan x="28" y="1149.3400000000001">A: What do you mean?</tspan><tspan x="28" y="1180.49">B: The value of a modest choice can lie in the benefit</tspan><tspan x="28" y="1211.64">it gives another person.</tspan></text><text x="28" y="1258.24" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.296">Explain your reasoning to a partner. Which action in</tspan><tspan x="28" y="1316.4460000000001">today’s topic illustrates this reflection? (Model: We</tspan><tspan x="28" y="1347.596">explain a favourite passage to a friend and listen to a</tspan><tspan x="28" y="1378.746">different interpretation.)</tspan></text></svg>