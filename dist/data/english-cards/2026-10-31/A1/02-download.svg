<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>candy</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/31 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Wrapped sweets are displayed together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Wrapped sweets are displayed together.</tspan></text><a href="https://www.pexels.com/photo/candies-wrapped-in-blue-and-red-cellophane-4115025/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4115025</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#382d2e"><tspan x="28" y="479.38">candy</tspan></text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="520.065">US /ˈkændi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.66" font-weight="400" fill="#382d2e"><tspan x="28" y="549.0698">Usually uncountable: candy; countable pieces or types:</tspan><tspan x="28" y="576.715">candies.</tspan></text><text x="28" y="634.2302" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="665.5422">sweet food made with sugar</tspan></text><text x="28" y="719.1021999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="750.4141999999999">sweets; confectionery</tspan></text><text x="28" y="803.9741999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="835.2861999999999">We put individually wrapped candy in the bowl.</tspan></text><text x="28" y="888.8461999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="920.1581999999999">Keep the sense and countability shown in the</tspan><tspan x="28" y="956.2081999999998">example. Use a singular or plural form</tspan><tspan x="28" y="992.2581999999999">appropriate to the specific person, object or</tspan><tspan x="28" y="1028.3082">event being discussed.</tspan></text><text x="28" y="1081.8682" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1113.1801999999998">A: Would you like some candy?</tspan><tspan x="28" y="1149.2301999999997">B: No, thank you. Is there another treat?</tspan><tspan x="28" y="1185.2801999999997">A: You can choose a little toy.</tspan><tspan x="28" y="1221.3301999999999">B: I would like that, please.</tspan></text><text x="28" y="1274.8901999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.2021999999997">Your friend does not want candy. Offer a small</tspan><tspan x="28" y="1342.2521999999997">toy. (Model: Would you like a small toy</tspan><tspan x="28" y="1378.3021999999996">instead?)</tspan></text></svg>