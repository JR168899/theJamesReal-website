<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A Halloween evening that welcomes everyone</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/10/31 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A costume creates a playful Halloween character.</tspan></text><a href="https://www.pexels.com/photo/spooky-pumpkin-head-cosplay-in-urban-garden-29225548/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 29225548</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A Halloween evening that welcomes everyone</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="161.0">When we prepare a Halloween evening, a little care can make the experience better. Planning</tspan><tspan x="42" y="189.07999999999998">and thinking about other people both help.</tspan></text><text x="42" y="221.16" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="250.16">First, planning the route and the costumes helps everyone stay comfortable. For example, we</tspan><tspan x="42" y="278.24">check that costumes allow clear vision and choose a well-lit route. This is a small thing that</tspan><tspan x="42" y="306.32">makes the day easier.</tspan></text><text x="42" y="338.4" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="367.4">Second, clear choices make sharing treats more considerate. For example, we keep ingredient</tspan><tspan x="42" y="395.47999999999996">information available and offer a non-food option. We do not need a perfect day to do this well.</tspan></text><text x="42" y="427.55999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="456.55999999999995">We can prepare a Halloween evening more easily when we prepare and notice other people.</tspan><tspan x="42" y="484.63999999999993">These simple steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="534.7199999999999">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="556.68">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="578.6399999999999">about an experience of your own.</tspan><tspan x="42" y="600.5999999999999">Your example. What two reasons support the main idea? Explain one example.</tspan></text></svg>