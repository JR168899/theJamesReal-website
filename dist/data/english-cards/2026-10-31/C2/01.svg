<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>liminal</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/31 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Passengers wait beside a train at a station.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Passengers wait beside a train at a station.</tspan></text><a href="https://www.pexels.com/photo/people-standing-on-a-platform-on-a-train-station-5617385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5617385</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">liminal</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˈlɪmənəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Adjective: liminal; related noun: liminality</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">relating to a threshold or a state between two</tspan><tspan x="28" y="663.3765000000001">conditions</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">transitional; at a threshold</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">The station is a liminal space between</tspan><tspan x="28" y="860.1795000000001">departure and arrival.</tspan></text><text x="28" y="911.3995" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="941.3435000000001">A threshold or transitional condition. Specify the</tspan><tspan x="28" y="975.8185000000001">states or spaces between which something is</tspan><tspan x="28" y="1010.2935000000001">positioned.</tspan></text><text x="28" y="1061.5135" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1091.4575">Sarah: Why does the essay dwell on the station</tspan><tspan x="28" y="1125.9325">entrance?</tspan><tspan x="28" y="1160.4075">Liam: It treats the threshold as a liminal space.</tspan><tspan x="28" y="1194.8825">Sarah: Between what states?</tspan><tspan x="28" y="1229.3575">Liam: Between the public street and the</tspan><tspan x="28" y="1263.8325">regulated world of the platforms.</tspan></text><text x="28" y="1315.0525" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1344.9965">Describe what makes a station threshold liminal</tspan><tspan x="28" y="1379.4714999999999">rather than simply another room.</tspan></text></svg>