<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A conversation worth having</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-11-06</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">A conversation worth having</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>A conversation worth having</title><desc>Original hand-drawn story illustration: dialogue, set within conversation. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-3) scale(1.5)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><g transform="translate(95 264) rotate(3) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A conversation worth having</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">The decision to listen to a</tspan><tspan x="36" dy="23.459999999999997">friend may appear ordinary, yet</tspan><tspan x="36" dy="23.459999999999997">it exposes a recurring tension</tspan><tspan x="36" dy="23.459999999999997">between arrangements that make</tspan><tspan x="36" dy="23.459999999999997">life manageable and experiences</tspan><tspan x="36" dy="23.459999999999997">that resist being prescribed. A</tspan><tspan x="36" dy="23.459999999999997">defensible approach combines</tspan><tspan x="36" dy="23.459999999999997">proportionate preparation with a</tspan><tspan x="36" dy="23.459999999999997">willingness to reconsider whose</tspan><tspan x="36" dy="23.459999999999997">interests a plan serves.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="384" dy="0">Preparation has value because asking</tspan><tspan x="384" dy="20.7">an open question gives the other</tspan><tspan x="384" dy="20.7">person room to explain. In the present</tspan><tspan x="384" dy="20.7">case, we ask what happened instead of</tspan><tspan x="384" dy="20.7">guessing why our friend is upset. Such</tspan><tspan x="384" dy="20.7">an intervention is modest, but that</tspan><tspan x="384" dy="20.7">modesty is its strength: it removes a</tspan><tspan x="384" dy="20.7">foreseeable obstacle without claiming</tspan><tspan x="384" dy="20.7">to determine the entire experience.</tspan><tspan x="384" dy="20.7">Structure is useful to the extent that</tspan><tspan x="384" dy="20.7">it releases attention rather than</tspan><tspan x="384" dy="20.7">consuming it.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="732" dy="0">That argument requires a</tspan><tspan x="732" dy="20.7">qualification, however: checking our</tspan><tspan x="732" dy="20.7">understanding prevents unnecessary</tspan><tspan x="732" dy="20.7">disagreement. For instance, we repeat</tspan><tspan x="732" dy="20.7">the main point in our own words before</tspan><tspan x="732" dy="20.7">offering advice. An arrangement that</tspan><tspan x="732" dy="20.7">appears efficient from one standpoint</tspan><tspan x="732" dy="20.7">may impose costs elsewhere. Listening</tspan><tspan x="732" dy="20.7">to those affected is therefore not an</tspan><tspan x="732" dy="20.7">optional gesture of goodwill; it</tspan><tspan x="732" dy="20.7">supplies information without which the</tspan><tspan x="732" dy="20.7">plan cannot be adequately evaluated.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">The resulting principle is one of</tspan><tspan x="1080" dy="23.459999999999997">proportion. Preparation deserves</tspan><tspan x="1080" dy="23.459999999999997">support when it clarifies</tspan><tspan x="1080" dy="23.459999999999997">responsibilities and protects</tspan><tspan x="1080" dy="23.459999999999997">time, while responsiveness</tspan><tspan x="1080" dy="23.459999999999997">prevents it from hardening into</tspan><tspan x="1080" dy="23.459999999999997">an end in itself. To judge the</tspan><tspan x="1080" dy="23.459999999999997">experience well is to examine</tspan><tspan x="1080" dy="23.459999999999997">both what the arrangement enables</tspan><tspan x="1080" dy="23.459999999999997">and what it may inadvertently</tspan><tspan x="1080" dy="23.459999999999997">exclude.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Compare your first answer with this question: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>