<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intersubjective</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/11/06 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">intersubjective</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /ˌɪntɚsəbˈdʒɛktɪv/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Adjective: intersubjective; related noun: intersubjectivity</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">shared or established between different people’s</tspan><tspan x="28" y="641.0609999999999">perspectives</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">shared between people; jointly understood</tspan></text><text x="28" y="760.677" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="787.733">Their conversation created an intersubjective</tspan><tspan x="28" y="818.8829999999999">understanding of the problem.</tspan></text><text x="28" y="865.163" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="892.2189999999999">Shared or negotiated between subjects; it is neither a</tspan><tspan x="28" y="923.3689999999999">single private opinion nor necessarily a</tspan><tspan x="28" y="954.519">mind-independent fact.</tspan></text><text x="28" y="1000.799" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1027.855">A: Does the agreement exist independently of the</tspan><tspan x="28" y="1059.005">participants?</tspan><tspan x="28" y="1090.155">B: Its meaning is intersubjective: it depends on a</tspan><tspan x="28" y="1121.305">shared understanding.</tspan><tspan x="28" y="1152.455">A: Then a signature alone does not settle every</tspan><tspan x="28" y="1183.605">interpretation?</tspan><tspan x="28" y="1214.755">B: No. We also need to examine how the participants</tspan><tspan x="28" y="1245.905">understand the commitment.</tspan></text><text x="28" y="1292.185" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1319.241">Explain why a shared convention can be</tspan><tspan x="28" y="1350.391">intersubjective without being merely one person&#x27;s</tspan><tspan x="28" y="1381.541">private opinion.</tspan></text></svg>