-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-63-12H63L45 55H-45Z" fill="#e9b465"/><path d="M-39-12Q-31-83 0-60Q31-83 39-12M-36 0L-27 43M-12 0L-9 43M12 0L9 43M36 0L27 43M-52 17H52M-48 34H48"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">How do you usually buy</tspan><tspan x="28" y="535.5">what we need?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">An open question that invites a person to</tspan><tspan x="28" y="663.4">describe a familiar experience.</tspan></text><text x="28" y="715.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="745.8">How do you usually buy what we need?</tspan></text><text x="28" y="797.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="828.1999999999999">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="863.1999999999999">answer, then ask a related follow-up.</tspan></text><text x="28" y="915.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="945.5999999999999">A: How do you usually buy what we need?</tspan><tspan x="28" y="980.5999999999999">B: I make a small plan.</tspan><tspan x="28" y="1015.5999999999999">A: What has helped you most?</tspan><tspan x="28" y="1050.6">B: For example, we check the kitchen before</tspan><tspan x="28" y="1085.6">choosing fruit and vegetables.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1290.4">Try without help. Write a reply of your own, then</tspan><tspan x="28" y="1325.4">ask one related question. (Model: I make a</tspan><tspan x="28" y="1360.4">small plan. What works best for you?)</tspan></text></svg>