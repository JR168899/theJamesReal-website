<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>price</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A2   2026-11-16</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">price</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>price</title><desc>Original hand-drawn story illustration: basket, set within market. the amount of money needed to buy something</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.5)"><path d="M-63-12H63L45 55H-45Z" fill="#d0b079"/><path d="M-39-12Q-31-83 0-60Q31-83 39-12M-36 0L-27 43M-12 0L-9 43M12 0L9 43M36 0L27 43M-52 17H52M-48 34H48"/></g><g transform="translate(95 264) rotate(0) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">price</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">the amount of money needed to buy something</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Topic: Choosing with care. Write one sentence using this</tspan><tspan x="35" dy="24.839999999999996">word. Check that your sentence keeps the meaning shown</tspan><tspan x="35" dy="24.839999999999996">above.</tspan></text><text x="35" y="716.8799999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="741.4399999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: What does “price” mean?</tspan><tspan x="35" dy="24.839999999999996">B: It means the amount of money needed to buy something.</tspan><tspan x="35" dy="24.839999999999996">A: Can we use it at a neighbourhood market?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. Let us think of a clear example.</tspan></text><text x="35" y="867.7999999999998" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="892.3599999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Try without help. Which word means “the amount of money</tspan><tspan x="35" dy="24.839999999999996">needed to buy something”: price or fresh?</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   01 OF 11</tspan></text></svg>