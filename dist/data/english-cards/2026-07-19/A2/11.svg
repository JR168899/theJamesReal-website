<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A conversation worth having</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/07/19 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/women-sitting-while-having-conversation-at-the-cafe-9811867/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 9811867</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A conversation worth having</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="159.0">When we listen to a friend, a little care can make the experience better. Planning and thinking about</tspan><tspan x="42" y="184.74">other people both help.</tspan></text><text x="42" y="216.48" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="243.48">First, asking an open question gives the other person room to explain. For example, we ask what</tspan><tspan x="42" y="269.21999999999997">happened instead of guessing why our friend is upset. This is a small thing that makes the day easier.</tspan></text><text x="42" y="300.96" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="327.96">Second, checking our understanding prevents unnecessary disagreement. For example, we repeat the</tspan><tspan x="42" y="353.7">main point in our own words before offering advice. We do not need a perfect day to do this well.</tspan></text><text x="42" y="385.43999999999994" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#37322b"><tspan x="42" y="412.43999999999994">We can listen to a friend more easily when we prepare and notice other people. These simple steps give</tspan><tspan x="42" y="438.17999999999995">us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="487.91999999999996">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="509.87999999999994">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="531.8399999999999">argument rather than introduce a new proposal.</tspan><tspan x="42" y="553.8">Ask a friend to help you listen to a friend. Explain two things you can do together. Use four short paragraphs: introduction, two</tspan><tspan x="42" y="575.76">developed points, and conclusion.</tspan></text></svg>