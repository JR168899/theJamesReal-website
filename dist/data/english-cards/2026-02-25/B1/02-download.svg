<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>adjust</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/02/25 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A journey can leave room to change direction or make an unexpected discovery.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A journey can leave room to change direction or make an unexpected discovery.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">adjust</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /əˈdʒʌst/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">adjust · adjusts · adjusted · adjusted · adjusting (base · third</tspan><tspan x="28" y="569.69">person · past · past participle · -ing)</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">to change something slightly to suit a situation</tspan></text><text x="28" y="705.1652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="734.9572000000002">adapt; modify</tspan></text><text x="28" y="785.9172" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="815.7092000000001">We can adjust the plan if the weather changes.</tspan></text><text x="28" y="866.6691999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="896.4612000000001">Topic: Plans for a rainy day. Write one sentence</tspan><tspan x="28" y="930.7612">using this word. Check that your sentence keeps</tspan><tspan x="28" y="965.0612000000001">the meaning shown above.</tspan></text><text x="28" y="1016.0211999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1045.8132">A: What does “adjust” mean?</tspan><tspan x="28" y="1080.1132">B: It means to change something slightly to suit a</tspan><tspan x="28" y="1114.4132">situation.</tspan><tspan x="28" y="1148.7132000000001">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1183.0132">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Review without reading the example first. Which</tspan><tspan x="28" y="1323.772">word means “to change something slightly to suit</tspan><tspan x="28" y="1358.072">a situation”: adjust or alternative? (Model: adjust)</tspan></text></svg>