<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to keep doing next year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/12/30 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">What would you like to keep</tspan><tspan x="28" y="525.6675">doing next year?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">What would you like to keep doing next year?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="822.236">different preference or a declined invitation without</tspan><tspan x="28" y="853.9110000000001">asking the person to justify it.</tspan></text><text x="28" y="900.971" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="928.4830000000001">A: Is there a change you are pleased you made?</tspan><tspan x="28" y="960.158">B: I started taking a short walk after lunch.</tspan><tspan x="28" y="991.8330000000001">A: Will you set a bigger target next year?</tspan><tspan x="28" y="1023.508">B: I might just keep the habit as it is.</tspan><tspan x="28" y="1055.183">A: Because it already does what you need?</tspan><tspan x="28" y="1086.8580000000002">B: Exactly. Not everything has to become more</tspan><tspan x="28" y="1118.5330000000001">ambitious.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Someone likes a modest habit and does not want a</tspan><tspan x="28" y="1317.667">larger target. Acknowledge that choice without</tspan><tspan x="28" y="1349.3419999999999">pushing improvement. (Model: That makes sense.</tspan><tspan x="28" y="1381.017">What do you enjoy about keeping it just as it is?)</tspan></text></svg>