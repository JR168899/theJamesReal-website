text><text x="28" y="716.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="740.8799999999999">Learn the whole expression. It is figurative language, so a</tspan><tspan x="28" y="768.8799999999999">word-for-word interpretation may be misleading.</tspan></text><text x="28" y="810.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="834.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="862.7999999999998">B: the devil is in the details</tspan><tspan x="28" y="890.7999999999998">A: What does that mean here?</tspan><tspan x="28" y="918.7999999999998">B: small details can cause important difficulties</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1281.1200000000001">Explain the meaning before looking at the model answer. What</tspan><tspan x="28" y="1309.1200000000001">does “the devil is in the details” mean in this example? The</tspan><tspan x="28" y="1337.1200000000001">broad idea is sound, but the devil is in the details. (Model:</tspan><tspan x="28" y="1365.1200000000001">Small details can cause important difficulties.)</tspan></text></svg>