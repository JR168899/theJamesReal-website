<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/12/30 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>I would distinguish between the intention and its consequences.</title><desc>Original family-manga illustration: calendar, related to I would distinguish between the intention and its consequences..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.48" font-weight="700" fill="#2d382e"><tspan x="28" y="472.48">I would distinguish between the</tspan><tspan x="28" y="523.08">intention and its consequences.</tspan></text><text x="28" y="578.08" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="604.832">A proposal to evaluate a person’s purpose separately</tspan><tspan x="28" y="635.632">from the effects of their action.</tspan></text><text x="28" y="681.392" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="708.144">I would separate the aim from the outcome.; We</tspan><tspan x="28" y="738.944">should assess purpose and effects independently.</tspan></text><text x="28" y="784.7040000000001" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="811.456">A: How should we make a realistic plan?</tspan><tspan x="28" y="842.256">B: I would distinguish between the intention and its</tspan><tspan x="28" y="873.056">consequences.</tspan></text><text x="28" y="918.8160000000001" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="945.5680000000001">Use this phrase in a friendly conversation. Listen to</tspan><tspan x="28" y="976.368">the reply before asking your next question.</tspan></text><text x="28" y="1022.1280000000002" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="1048.88">A: How would you express this idea?</tspan><tspan x="28" y="1079.68">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1110.48">consequences.</tspan><tspan x="28" y="1141.2800000000002">A: What does that mean here?</tspan><tspan x="28" y="1172.0800000000002">B: A useful way to keep an everyday conversation</tspan><tspan x="28" y="1202.88">clear and considerate.</tspan></text><text x="28" y="1258.08" font-family="Arial, sans-serif" font-size="14.08" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.64" font-weight="400" fill="#2d382e"><tspan x="28" y="1284.832">Explain the meaning before looking at the model</tspan><tspan x="28" y="1315.632">answer. When might you say “I would distinguish</tspan><tspan x="28" y="1346.432">between the intention and its consequences.”?</tspan></text></svg>