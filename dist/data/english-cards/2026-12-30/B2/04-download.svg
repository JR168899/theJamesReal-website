<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>weigh up</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/12/30 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Money and a calculator support a spending calculation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Money and a calculator support a spending calculation.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">weigh something up</tspan><tspan x="28" y="525.6675">weigh up something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">consider advantages and disadvantages</tspan></text><text x="28" y="656.802" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="684.3140000000001">assess; evaluate</tspan></text><text x="28" y="731.374" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="758.8860000000001">We weigh up the choices before deciding.</tspan></text><text x="28" y="805.946" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="833.4580000000001">Weigh up the options / weigh the options up; weigh</tspan><tspan x="28" y="865.133">them up. Common in British English; weigh the</tspan><tspan x="28" y="896.8080000000001">options is also natural.</tspan></text><text x="28" y="943.868" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="971.3800000000001">Aoede: Would you choose the cheaper venue?</tspan><tspan x="28" y="1003.0550000000001">Echo: I need to weigh up the savings against the</tspan><tspan x="28" y="1034.73">longer journey.</tspan><tspan x="28" y="1066.4050000000002">Aoede: The other one is easier to reach.</tspan><tspan x="28" y="1098.0800000000002">Echo: And that could affect who is able to attend.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Compare two venues: one is cheaper; one is easier to</tspan><tspan x="28" y="1317.667">reach. Give a balanced recommendation using weigh</tspan><tspan x="28" y="1349.3419999999999">up. (Model: We should weigh up the savings against</tspan><tspan x="28" y="1381.017">access before choosing the venue.)</tspan></text></svg>