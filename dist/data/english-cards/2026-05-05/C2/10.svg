<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you decide what is worth buying?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/05/05 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shopper chooses produce at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shopper chooses produce at a market.</tspan></text><a href="https://www.pexels.com/photo/woman-buying-fruits-in-a-supermarket-9475666/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 9475666</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">How do you decide what is</tspan><tspan x="28" y="533.43">worth buying?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="658.772">experience without assuming everyone shares it.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">How do you decide what is worth buying?</tspan></text><text x="28" y="790.484" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="820.2760000000002">Follow the answer with a related question. Accept</tspan><tspan x="28" y="854.5760000000001">a different preference or a declined invitation</tspan><tspan x="28" y="888.8760000000002">without asking the person to justify it.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="969.6280000000002">A: Do you make a list before shopping?</tspan><tspan x="28" y="1003.9280000000001">B: A short one. Otherwise I buy things I already</tspan><tspan x="28" y="1038.228">have.</tspan><tspan x="28" y="1072.5280000000002">A: Do you stick to it exactly?</tspan><tspan x="28" y="1106.8280000000002">B: Not if I find something useful at a good price.</tspan><tspan x="28" y="1141.1280000000002">A: How do you decide whether it is useful?</tspan><tspan x="28" y="1175.428">B: I ask where I would use it, rather than just</tspan><tspan x="28" y="1209.728">noticing the discount.</tspan></text><text x="28" y="1260.688" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1290.48">Someone says they bought an item because it</tspan><tspan x="28" y="1324.78">was discounted. Ask a friendly question about its</tspan><tspan x="28" y="1359.08">actual use.</tspan></text></svg>