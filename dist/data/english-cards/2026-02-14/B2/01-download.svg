<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>affection</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/02/14 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A handmade card expresses a personal greeting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A handmade card expresses a personal greeting.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">affection</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /əˈfɛkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Usually uncountable: affection; no regular plural in this sense.</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">a warm feeling of fondness or care for someone</tspan></text><text x="28" y="670.0455000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="698.7735000000001">fondness; warm feeling</tspan></text><text x="28" y="747.9135" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="776.6415000000001">The note expresses affection without making a grand</tspan><tspan x="28" y="809.7165000000001">promise.</tspan></text><text x="28" y="858.8565" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="887.5845">Topic: A thoughtful message for Valentine’s Day.</tspan><tspan x="28" y="920.6595000000001">Write one sentence using this word. Check that your</tspan><tspan x="28" y="953.7345">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1002.8745" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1031.6025">A: What does “affection” mean?</tspan><tspan x="28" y="1064.6775">B: It means a warm feeling of fondness or care for</tspan><tspan x="28" y="1097.7525">someone.</tspan><tspan x="28" y="1130.8274999999999">A: Can we use it when sending a greeting?</tspan><tspan x="28" y="1163.9025">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Review without reading the example first. Which</tspan><tspan x="28" y="1320.923">word means “a warm feeling of fondness or care for</tspan><tspan x="28" y="1353.998">someone”: affection or platonic? (Model: affection)</tspan></text></svg>