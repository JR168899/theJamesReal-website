<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you like to show someone you appreciate them?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/02/14 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Hands arrange paper around a gift.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Hands arrange paper around a gift.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-wrapping-a-gift-5272210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5272210</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">How do you like to show</tspan><tspan x="28" y="529.8075">someone you appreciate</tspan><tspan x="28" y="584.145">them?</tspan></text><text x="28" y="643.2075000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="671.9355000000002">An opening that invites a personal preference or</tspan><tspan x="28" y="705.0105000000002">experience without assuming everyone shares it.</tspan></text><text x="28" y="754.1505000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="782.8785000000001">How do you like to show someone you appreciate</tspan><tspan x="28" y="815.9535000000002">them?</tspan></text><text x="28" y="865.0935000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="893.8215000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="926.8965000000002">different preference or a declined invitation without</tspan><tspan x="28" y="959.9715000000001">asking the person to justify it.</tspan></text><text x="28" y="1009.1115000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1037.8395">Sky: Do you usually buy a Valentine&#x27;s gift?</tspan><tspan x="28" y="1070.9145">Michael: Sometimes, but I often write a note to a</tspan><tspan x="28" y="1103.9895000000001">friend.</tspan><tspan x="28" y="1137.0645">Sky: What do you put in it?</tspan><tspan x="28" y="1170.1395">Michael: One specific thing I am grateful for.</tspan><tspan x="28" y="1203.2145">Sky: That sounds less pressured than a grand</tspan><tspan x="28" y="1236.2895">gesture.</tspan><tspan x="28" y="1269.3645000000001">Michael: It feels more like what I actually want to say.</tspan></text><text x="28" y="1318.5045" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1347.2325">A friend prefers a personal note to an expensive gift.</tspan><tspan x="28" y="1380.3075000000001">Ask about a specific kind act they might mention.</tspan></text></svg>