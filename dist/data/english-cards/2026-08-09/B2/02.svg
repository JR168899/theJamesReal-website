<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>anticipate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/08/09 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Dark clouds gather over a landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Dark clouds gather over a landscape.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">anticipate</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /ænˈtɪsəˌpeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">anticipate · anticipates · anticipated · anticipated · anticipating</tspan><tspan x="28" y="574.6075000000001">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to expect something and prepare for it</tspan></text><text x="28" y="714.9210999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="745.7770999999999">expect; foresee</tspan></text><text x="28" y="798.5570999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="829.4130999999999">We anticipate a busy morning and prepare the</tspan><tspan x="28" y="864.9380999999998">materials early.</tspan></text><text x="28" y="917.7180999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="948.5740999999999">Use the verb in the sense shown in the</tspan><tspan x="28" y="984.0990999999999">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1019.6241">object; the word forms above show its changes.</tspan></text><text x="28" y="1072.4041" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1103.2601">A: Did you anticipate this many visitors?</tspan><tspan x="28" y="1138.7851">B: We expected a crowd, but not a queue this</tspan><tspan x="28" y="1174.3101">long.</tspan><tspan x="28" y="1209.8351">A: Can we open the second entrance?</tspan><tspan x="28" y="1245.3600999999999">B: Only after someone checks that it is staffed.</tspan></text><text x="28" y="1298.1401" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1328.9961">Distinguish anticipating a problem from</tspan><tspan x="28" y="1364.5211000000002">responding only after it occurs.</tspan></text></svg>