<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you keep even if it offered no measurable benefit?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Musicians work together on a piece of music.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Musicians work together on a piece of music.</tspan></text><a href="https://www.pexels.com/photo/couple-playing-music-in-living-room-3978313/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3978313</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#353331"><tspan x="28" y="472.02">What would you keep even if it</tspan><tspan x="28" y="522.045">offered no measurable benefit?</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="602.868">An opening that invites a personal preference or</tspan><tspan x="28" y="633.3180000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="705.0060000000001">What would you keep even if it offered no measurable</tspan><tspan x="28" y="735.4560000000001">benefit?</tspan></text><text x="28" y="780.696" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="807.1440000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="837.5940000000002">different preference or a declined invitation without</tspan><tspan x="28" y="868.0440000000001">asking the person to justify it.</tspan></text><text x="28" y="913.284" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="939.7320000000001">A: What would you keep even if it offered no measurable</tspan><tspan x="28" y="970.1820000000001">benefit?</tspan><tspan x="28" y="1000.6320000000001">B: The unplanned conversations after our meetings.</tspan><tspan x="28" y="1031.082">A: Would you say they serve no purpose?</tspan><tspan x="28" y="1061.5320000000002">B: Not quite. I would resist reducing their value to a</tspan><tspan x="28" y="1091.982">target.</tspan><tspan x="28" y="1122.432">A: Then the problem may be the measure rather than the</tspan><tspan x="28" y="1152.882">conversation.</tspan><tspan x="28" y="1183.332">B: Or the assumption that value must always justify itself</tspan><tspan x="28" y="1213.7820000000002">in measurable terms.</tspan></text><text x="28" y="1259.0220000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1285.47">Distinguish something having no measured benefit from</tspan><tspan x="28" y="1315.92">having no value. (Model: A measure may fail to capture</tspan><tspan x="28" y="1346.3700000000001">an experience&#x27;s relational, emotional or intrinsic value.)</tspan></text></svg>