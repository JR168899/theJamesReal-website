<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>leave well enough alone</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives hands-on care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives hands-on care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#383426"><tspan x="28" y="481.91">leave well enough alone</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="582.7065000000001">To refrain from altering a situation that is</tspan><tspan x="28" y="620.6815000000001">already satisfactory.</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="710.0855000000001">let things be; avoid unnecessary changes</tspan></text><text x="28" y="766.5055000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="799.4895000000001">The routine was pleasant and workable, so I</tspan><tspan x="28" y="837.4645000000002">decided to leave well enough alone.</tspan></text><text x="28" y="893.8845000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="926.8685000000002">Often advice against unnecessary change.</tspan><tspan x="28" y="964.8435000000002">American English; British English also uses</tspan><tspan x="28" y="1002.8185000000002">leave well alone.</tspan></text><text x="28" y="1059.2385000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1092.2225000000003">Sarah: The routine finally feels manageable.</tspan><tspan x="28" y="1130.1975000000002">Liam: Are you going to optimize it again?</tspan><tspan x="28" y="1168.1725000000004">Sarah: I think I will leave well enough alone.</tspan><tspan x="28" y="1206.1475000000003">Liam: Then you can spend the time enjoying</tspan><tspan x="28" y="1244.1225000000004">what it supports.</tspan></text><text x="28" y="1300.5425000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1333.5265000000004">Explain why leaving well enough alone need</tspan><tspan x="28" y="1371.5015000000003">not mean refusing every improvement.</tspan></text></svg>