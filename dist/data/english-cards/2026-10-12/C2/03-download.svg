<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>make allowance for</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A clock makes the passage of time visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A clock makes the passage of time visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-on-hands-of-clock-13151698/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13151698</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">make allowance for</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">To adjust a judgement or arrangement in recognition</tspan><tspan x="28" y="589.3795">of a relevant circumstance.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="663.9515">take into account; adjust for</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="738.5235">The schedule makes allowance for uneven energy</tspan><tspan x="28" y="770.1985">and unexpected demands.</tspan></text><text x="28" y="817.2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="844.7705">Make allowance for a circumstance means adjust a</tspan><tspan x="28" y="876.4454999999999">judgment or arrangement in recognition of it; it need</tspan><tspan x="28" y="908.1205">not excuse every outcome.</tspan></text><text x="28" y="955.1804999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="982.6925">Sarah: The route estimate assumes everyone walks</tspan><tspan x="28" y="1014.3675">at the same pace.</tspan><tspan x="28" y="1046.0425">Liam: We should make allowance for slower walkers.</tspan><tspan x="28" y="1077.7175">Sarah: Would an extra ten minutes be enough?</tspan><tspan x="28" y="1109.3925">Liam: Let us ask the group before fixing the departure</tspan><tspan x="28" y="1141.0675">time.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Explain why making allowance for different walking</tspan><tspan x="28" y="1317.667">speeds can improve an estimate. (Model: It</tspan><tspan x="28" y="1349.3419999999999">recognizes a relevant difference instead of treating</tspan><tspan x="28" y="1381.017">one pace as universal.)</tspan></text></svg>