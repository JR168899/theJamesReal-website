<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>make allowance for</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - Phrasal verbs</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#3d3028">2026-10-12 · C2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>make allowance for</title><desc>Original family-manga illustration: path, related to make allowance for.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#54b8ec"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#3d3028"><tspan x="28" y="476.85">make allowance for</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="567.4275">To adjust a judgement or arrangement in</tspan><tspan x="28" y="601.5525">recognition of a relevant circumstance.</tspan></text><text x="28" y="652.2525" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="681.8924999999999">To adjust a judgement or arrangement in</tspan><tspan x="28" y="716.0174999999999">recognition of a relevant circumstance</tspan></text><text x="28" y="766.7175000000001" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="796.3575000000001">The schedule makes allowance for uneven</tspan><tspan x="28" y="830.4825000000001">energy and unexpected demands.</tspan></text><text x="28" y="881.1825000000001" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="910.8225">Use make allowance for + a noun. The phrase</tspan><tspan x="28" y="944.9475">signals accommodation, not necessarily approval</tspan><tspan x="28" y="979.0725">of what is being accommodated.</tspan></text><text x="28" y="1029.7725" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="1059.4125000000001">A: Why does the plan include spare time?</tspan><tspan x="28" y="1093.5375000000001">B: It makes allowance for the unpredictability of</tspan><tspan x="28" y="1127.6625000000001">ordinary life.</tspan><tspan x="28" y="1161.7875000000001">A: How much flexibility should a routine allow?</tspan><tspan x="28" y="1195.9125000000001">B: Enough to respond to circumstances without</tspan><tspan x="28" y="1230.0375000000001">losing its guiding purpose.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#3d3028"><tspan x="28" y="1310.3775">Rewrite using this phrase: The plan</tspan><tspan x="28" y="1344.5025">accommodates interruptions. (Model: The plan</tspan><tspan x="28" y="1378.6275">makes allowance for interruptions.)</tspan></text></svg>