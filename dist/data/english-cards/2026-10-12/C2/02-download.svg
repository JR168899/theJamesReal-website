<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>instrumentalise</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A list can organize actions, responsibilities and repeated practice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A list can organize actions, responsibilities and repeated practice.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">instrumentalise</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /ˌɪnstrəˈmentəlaɪz/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">instrumentalise · instrumentalises · instrumentalised · instrumentalised</tspan><tspan x="28" y="554.235">· instrumentalising (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="602.8158" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="629.2638000000001">To treat a person, activity, or experience primarily as a</tspan><tspan x="28" y="659.7138000000001">means to another end.</tspan></text><text x="28" y="704.9538" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="731.4018000000001">use as a means; treat as a tool · These capture the</tspan><tspan x="28" y="761.8518000000001">critical emphasis on using something for an external</tspan><tspan x="28" y="792.3018000000001">purpose.</tspan></text><text x="28" y="837.5418000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="863.9898000000002">We risk instrumentalising leisure when its only defence is</tspan><tspan x="28" y="894.4398000000002">improved productivity.</tspan></text><text x="28" y="939.6798000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="966.1278000000002">Often critical in tone, implying that intrinsic value or</tspan><tspan x="28" y="996.5778000000003">agency is being overlooked. Instrumentalize is the</tspan><tspan x="28" y="1027.0278000000003">common American spelling.</tspan></text><text x="28" y="1072.2678000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1098.7158000000002">A: Must a hobby make us better workers?</tspan><tspan x="28" y="1129.1658000000002">B: Framing it that way may instrumentalise the activity.</tspan><tspan x="28" y="1159.6158000000003">A: Could improved productivity still be a welcome effect?</tspan><tspan x="28" y="1190.0658">B: Certainly, provided it does not become the activity&#x27;s</tspan><tspan x="28" y="1220.5158000000001">only justification.</tspan></text><text x="28" y="1265.7558000000004" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1292.2038000000002">Why might “instrumentalise leisure” be critical in tone?</tspan><tspan x="28" y="1322.6538000000003">(Model: It suggests reducing leisure to a tool for another</tspan><tspan x="28" y="1353.1038000000003">goal and overlooking its intrinsic value.)</tspan></text></svg>