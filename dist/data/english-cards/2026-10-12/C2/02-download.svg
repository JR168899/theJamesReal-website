<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>instrumentalise</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="39.790000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="471.79">instrumentalise</tspan></text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="505.95750000000004">US /ˌɪnstrəˈmentəlaɪz/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.03" font-weight="400" fill="#382d2e"><tspan x="28" y="530.3159">instrumentalise · instrumentalises · instrumentalised · instrumentalised</tspan><tspan x="28" y="553.5325">· instrumentalising (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="601.8341" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.1301000000001">To treat a person, activity, or experience primarily as a</tspan><tspan x="28" y="658.4051000000001">means to another end.</tspan></text><text x="28" y="703.3851000000001" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="729.6811000000001">use as a means; treat as a tool · These capture the</tspan><tspan x="28" y="759.9561000000001">critical emphasis on using something for an external</tspan><tspan x="28" y="790.2311000000001">purpose.</tspan></text><text x="28" y="835.2111000000001" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="861.5071000000002">We risk instrumentalising leisure when its only defence is</tspan><tspan x="28" y="891.7821000000001">improved productivity.</tspan></text><text x="28" y="936.7621000000001" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="963.0581000000002">British spelling; American English often uses</tspan><tspan x="28" y="993.3331000000002">instrumentalize. The concern is treating something</tspan><tspan x="28" y="1023.6081000000001">primarily as a means to another end.</tspan></text><text x="28" y="1068.5881" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1094.8841">Sarah: The club now measures every conversation by</tspan><tspan x="28" y="1125.1591">how many new members it recruits.</tspan><tspan x="28" y="1155.4341">Liam: That risks instrumentalising relationships.</tspan><tspan x="28" y="1185.7091">Sarah: Because people become means to a target?</tspan><tspan x="28" y="1215.9841">Liam: Yes, rather than participants whose company has</tspan><tspan x="28" y="1246.2591">value in itself.</tspan></text><text x="28" y="1291.2391" font-family="Arial, sans-serif" font-size="13.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.220000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1317.5351">Explain the concern when a friendship is valued only as a</tspan><tspan x="28" y="1347.8101000000001">source of professional contacts. (Model: The friendship is</tspan><tspan x="28" y="1378.0851">being treated primarily as a means to another end.)</tspan></text></svg>