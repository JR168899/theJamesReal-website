<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you keep even if it offered no measurable benefit?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Musicians work together on a piece of music.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Musicians work together on a piece of music.</tspan></text><a href="https://www.pexels.com/photo/couple-playing-music-in-living-room-3978313/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3978313</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#353331"><tspan x="28" y="472.48">What would you keep even if it</tspan><tspan x="28" y="523.08">offered no measurable benefit?</tspan></text><text x="28" y="578.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="604.832">An opening that invites a personal preference or</tspan><tspan x="28" y="635.632">experience without assuming everyone shares it.</tspan></text><text x="28" y="681.392" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="708.144">What would you keep even if it offered no measurable</tspan><tspan x="28" y="738.944">benefit?</tspan></text><text x="28" y="784.7040000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="811.456">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="842.256">different preference or a declined invitation without</tspan><tspan x="28" y="873.056">asking the person to justify it.</tspan></text><text x="28" y="918.8160000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="945.5680000000001">A: What would you keep even if it offered no</tspan><tspan x="28" y="976.368">measurable benefit?</tspan><tspan x="28" y="1007.1680000000001">B: The unplanned conversations after our meetings.</tspan><tspan x="28" y="1037.968">A: Would you say they serve no purpose?</tspan><tspan x="28" y="1068.768">B: Not quite. I would resist reducing their value to a</tspan><tspan x="28" y="1099.5680000000002">target.</tspan><tspan x="28" y="1130.3680000000002">A: Then the problem may be the measure rather than</tspan><tspan x="28" y="1161.1680000000001">the conversation.</tspan><tspan x="28" y="1191.968">B: Or the assumption that value must always justify</tspan><tspan x="28" y="1222.768">itself in measurable terms.</tspan></text><text x="28" y="1268.528" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1295.2800000000002">Distinguish something having no measured benefit</tspan><tspan x="28" y="1326.0800000000002">from having no value.</tspan></text></svg>