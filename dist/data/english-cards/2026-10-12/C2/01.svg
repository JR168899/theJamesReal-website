<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contingency</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">contingency</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /kənˈtɪndʒənsi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Singular: contingency; plural: contingencies.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">The possibility of unforeseen events or</tspan><tspan x="28" y="655.1550000000001">circumstances affecting an outcome.</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">uncertainty; unforeseen possibility · Uncertainty</tspan><tspan x="28" y="766.6850000000001">is broader; a countable contingency is a possible</tspan><tspan x="28" y="799.9350000000001">future circumstance.</tspan></text><text x="28" y="849.335" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="878.215">A humane routine accommodates contingency</tspan><tspan x="28" y="911.465">rather than treating every interruption as failure.</tspan></text><text x="28" y="960.865" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="989.745">Usually uncountable in this abstract sense. A</tspan><tspan x="28" y="1022.995">contingency can also be a specific possible event</tspan><tspan x="28" y="1056.245">for which a plan is prepared.</tspan></text><text x="28" y="1105.645" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.5249999999999">A: What is our contingency if the ferry is</tspan><tspan x="28" y="1167.7749999999999">cancelled?</tspan><tspan x="28" y="1201.0249999999999">B: We can take the coastal bus.</tspan><tspan x="28" y="1234.2749999999999">A: Have you checked the timetable?</tspan><tspan x="28" y="1267.5249999999999">B: Yes. The last one leaves at six.</tspan></text><text x="28" y="1316.925" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1345.8049999999998">A ferry may be cancelled. Name the information a</tspan><tspan x="28" y="1379.0549999999998">useful contingency plan should include.</tspan></text></svg>