<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the tail wagging the dog</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#383426"><tspan x="28" y="477.08">the tail wagging the dog</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">A situation in which a secondary element comes</tspan><tspan x="28" y="602.422">to control the larger purpose it should serve.</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="683.1740000000001">a side issue taking over; misplaced priorities</tspan></text><text x="28" y="734.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="763.926">When the tracker dictates the walk, the tail is</tspan><tspan x="28" y="798.226">wagging the dog.</tspan></text><text x="28" y="849.1859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="878.9780000000001">A secondary element controls the larger purpose</tspan><tspan x="28" y="913.278">it is meant to support. Name both to make the</tspan><tspan x="28" y="947.5780000000001">metaphor precise.</tspan></text><text x="28" y="998.5379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1028.33">Sarah: The tracker says I should walk another</tspan><tspan x="28" y="1062.6299999999999">kilometer.</tspan><tspan x="28" y="1096.9299999999998">Liam: But you planned a short walk with a friend.</tspan><tspan x="28" y="1131.23">Sarah: The tail is wagging the dog if the number</tspan><tspan x="28" y="1165.53">dictates the whole outing.</tspan><tspan x="28" y="1199.83">Liam: Then decide what the walk is for before</tspan><tspan x="28" y="1234.1299999999999">following the display.</tspan></text><text x="28" y="1285.09" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1314.8819999999998">Identify the tail and the dog when a tracking</tspan><tspan x="28" y="1349.1819999999998">target overrides a walk intended for conversation.</tspan></text></svg>