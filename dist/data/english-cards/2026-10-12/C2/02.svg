<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>instrumentalise</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="40.71000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="472.71000000000004">instrumentalise</tspan></text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="507.6675">US /ˌɪnstrəˈmentəlaɪz/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.470000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="532.5891">instrumentalise · instrumentalises · instrumentalised · instrumentalised</tspan><tspan x="28" y="556.3425000000001">· instrumentalising (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="605.7609" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="632.6649">To treat a person, activity, or experience primarily as</tspan><tspan x="28" y="663.6399">a means to another end.</tspan></text><text x="28" y="709.6599" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="736.5639">use as a means; treat as a tool · These capture the</tspan><tspan x="28" y="767.5389">critical emphasis on using something for an external</tspan><tspan x="28" y="798.5139">purpose.</tspan></text><text x="28" y="844.5339" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="871.4379">We risk instrumentalising leisure when its only</tspan><tspan x="28" y="902.4129">defence is improved productivity.</tspan></text><text x="28" y="948.4329" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="975.3369">British spelling; American English often uses</tspan><tspan x="28" y="1006.3119">instrumentalize. The concern is treating something</tspan><tspan x="28" y="1037.2869">primarily as a means to another end.</tspan></text><text x="28" y="1083.3069000000003" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1110.2109000000003">Sarah: The club now measures every conversation by</tspan><tspan x="28" y="1141.1859000000002">how many new members it recruits.</tspan><tspan x="28" y="1172.1609000000003">Liam: That risks instrumentalising relationships.</tspan><tspan x="28" y="1203.1359000000002">Sarah: Because people become means to a target?</tspan><tspan x="28" y="1234.1109000000004">Liam: Yes, rather than participants whose company</tspan><tspan x="28" y="1265.0859000000003">has value in itself.</tspan></text><text x="28" y="1311.1059000000002" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1338.0099000000002">Explain the concern when a friendship is valued only</tspan><tspan x="28" y="1368.9849000000002">as a source of professional contacts.</tspan></text></svg>