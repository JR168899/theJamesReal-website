<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the tail wagging the dog</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">the tail wagging the dog</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">A situation in which a secondary element comes to</tspan><tspan x="28" y="589.3795">control the larger purpose it should serve.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="663.9515">a side issue taking over; misplaced priorities</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="738.5235">When the tracker dictates the walk, the tail is wagging</tspan><tspan x="28" y="770.1985">the dog.</tspan></text><text x="28" y="817.2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="844.7705">A secondary element controls the larger purpose it is</tspan><tspan x="28" y="876.4454999999999">meant to support. Name both to make the metaphor</tspan><tspan x="28" y="908.1205">precise.</tspan></text><text x="28" y="955.1804999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="982.6925">Sarah: The tracker says I should walk another</tspan><tspan x="28" y="1014.3675">kilometer.</tspan><tspan x="28" y="1046.0425">Liam: But you planned a short walk with a friend.</tspan><tspan x="28" y="1077.7175">Sarah: The tail is wagging the dog if the number</tspan><tspan x="28" y="1109.3925">dictates the whole outing.</tspan><tspan x="28" y="1141.0675">Liam: Then decide what the walk is for before</tspan><tspan x="28" y="1172.7425">following the display.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Identify the tail and the dog when a tracking target</tspan><tspan x="28" y="1317.667">overrides a walk intended for conversation. (Model:</tspan><tspan x="28" y="1349.3419999999999">The metric is the secondary tool; the shared walk and</tspan><tspan x="28" y="1381.017">its purpose are the larger activity it should serve.)</tspan></text></svg>