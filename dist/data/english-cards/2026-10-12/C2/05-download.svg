<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the tail wagging the dog</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#383426"><tspan x="28" y="477.08">the tail wagging the dog</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">A situation in which a secondary element comes</tspan><tspan x="28" y="602.422">to control the larger purpose it should serve.</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="683.1740000000001">a side issue taking over; misplaced priorities</tspan></text><text x="28" y="734.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="763.926">When the tracker dictates the walk, the tail is</tspan><tspan x="28" y="798.226">wagging the dog.</tspan></text><text x="28" y="849.1859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="878.9780000000001">The idiom usually criticises a reversal of priorities.</tspan><tspan x="28" y="913.278">Explain which element is the tool and which is the</tspan><tspan x="28" y="947.5780000000001">purpose.</tspan></text><text x="28" y="998.5379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1028.33">A: I walked only to reach a number on my screen.</tspan><tspan x="28" y="1062.6299999999999">B: That sounds like the tail wagging the dog.</tspan><tspan x="28" y="1096.9299999999998">A: Would you stop using the tracker?</tspan><tspan x="28" y="1131.23">B: Perhaps, or keep it only where it supports the</tspan><tspan x="28" y="1165.53">walk rather than directs it.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Identify the “tail” and “dog” in the example.</tspan><tspan x="28" y="1323.772">(Model: The tracker is the tail; the walk and its</tspan><tspan x="28" y="1358.072">purpose are the dog.)</tspan></text></svg>