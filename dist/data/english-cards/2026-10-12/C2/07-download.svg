<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A life cannot be judged solely by the efficiency of its arrangements.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader takes a quiet moment without rushing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader takes a quiet moment without rushing.</tspan></text><a href="https://www.pexels.com/photo/woman-sitting-and-reading-book-5698385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5698385</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="473.4">A life cannot be judged solely</tspan><tspan x="28" y="525.15">by the efficiency of its</tspan><tspan x="28" y="576.9">arrangements.</tspan></text><text x="28" y="633.15" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="660.51">The value of a life cannot be assessed only by how</tspan><tspan x="28" y="692.01">efficiently its activities are organised.</tspan></text><text x="28" y="738.81" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="766.1700000000001">A well-run schedule is not the whole measure of a</tspan><tspan x="28" y="797.6700000000001">life.; Human value exceeds efficient organization.</tspan></text><text x="28" y="844.4699999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="871.8299999999999">A life cannot be judged solely by the efficiency of its</tspan><tspan x="28" y="903.3299999999999">arrangements.</tspan></text><text x="28" y="950.1299999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="977.49">Solely restricts the criticism: efficiency is not</tspan><tspan x="28" y="1008.99">excluded as a consideration, but it cannot be the only</tspan><tspan x="28" y="1040.49">criterion.</tspan></text><text x="28" y="1087.29" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1114.6499999999999">A: The afternoon produced nothing measurable.</tspan><tspan x="28" y="1146.1499999999999">B: That does not mean it lacked value.</tspan><tspan x="28" y="1177.6499999999999">A: Then efficiency has no value at all?</tspan><tspan x="28" y="1209.1499999999999">B: That does not follow. The claim rejects it as the</tspan><tspan x="28" y="1240.6499999999999">sole criterion.</tspan></text><text x="28" y="1287.45" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1314.81">Paraphrase the sentence while preserving “solely”.</tspan><tspan x="28" y="1346.31">(Model: The efficiency of our plans cannot be the sole</tspan><tspan x="28" y="1377.81">measure of a life’s value.)</tspan></text></svg>