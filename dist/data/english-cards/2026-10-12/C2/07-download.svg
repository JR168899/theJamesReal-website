<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A life cannot be judged solely by the efficiency of its arrangements.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader takes a quiet moment at home.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader takes a quiet moment at home.</tspan></text><a href="https://www.pexels.com/photo/woman-sitting-and-reading-book-5698385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5698385</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2d382e"><tspan x="28" y="472.02">A life cannot be judged solely</tspan><tspan x="28" y="522.045">by the efficiency of its</tspan><tspan x="28" y="572.0699999999999">arrangements.</tspan></text><text x="28" y="626.445" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="652.8930000000001">The value of a life cannot be assessed only by how</tspan><tspan x="28" y="683.3430000000002">efficiently its activities are organised.</tspan></text><text x="28" y="728.5830000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="755.0310000000002">A well-run schedule is not the whole measure of a life.;</tspan><tspan x="28" y="785.4810000000002">Human value exceeds efficient organization.</tspan></text><text x="28" y="830.7210000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="857.1690000000002">A life cannot be judged solely by the efficiency of its</tspan><tspan x="28" y="887.6190000000003">arrangements.</tspan></text><text x="28" y="932.8590000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="959.3070000000002">Solely limits the claim: efficiency is relevant but</tspan><tspan x="28" y="989.7570000000003">insufficient. The phrase does not say efficiency has no</tspan><tspan x="28" y="1020.2070000000002">value.</tspan></text><text x="28" y="1065.4470000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1091.8950000000002">A: The revised routine saves forty minutes a day.</tspan><tspan x="28" y="1122.3450000000003">B: Does that tell us whether the day is better?</tspan><tspan x="28" y="1152.7950000000003">A: Not by itself.</tspan><tspan x="28" y="1183.2450000000001">B: A life cannot be judged solely by the efficiency of its</tspan><tspan x="28" y="1213.6950000000002">arrangements.</tspan></text><text x="28" y="1258.9350000000004" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1285.3830000000003">A routine saves time but removes valued conversations.</tspan><tspan x="28" y="1315.8330000000003">Explain why efficiency alone cannot settle its merit.</tspan><tspan x="28" y="1346.2830000000004">(Model: The saved time is one benefit, but losing</tspan><tspan x="28" y="1376.7330000000002">meaningful relationships or experiences may outweigh it.)</tspan></text></svg>