<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>stand back from</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="475.47">stand back from</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="563.2605000000001">To gain perspective by temporarily distancing</tspan><tspan x="28" y="596.3355000000001">yourself from immediate involvement.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="674.2035000000001">gain distance from; take a broader view of</tspan></text><text x="28" y="723.3435000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="752.0715000000001">It helps to stand back from the routine and ask what it</tspan><tspan x="28" y="785.1465000000002">serves.</tspan></text><text x="28" y="834.2865" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="863.0145000000001">This use is figurative. Stand back from an argument</tspan><tspan x="28" y="896.0895000000002">or process to examine its assumptions and purpose.</tspan></text><text x="28" y="945.2295" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="973.9575000000001">A: Should I add another tracking tool?</tspan><tspan x="28" y="1007.0325000000001">B: First, stand back from the system and consider its</tspan><tspan x="28" y="1040.1075">purpose.</tspan><tspan x="28" y="1073.1825000000001">A: What might that distance reveal?</tspan><tspan x="28" y="1106.2575000000002">B: That a useful tool has quietly become the measure</tspan><tspan x="28" y="1139.3325">of success itself.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1287.848">What mental action does “stand back from” describe</tspan><tspan x="28" y="1320.923">here? (Model: Gaining perspective by temporarily</tspan><tspan x="28" y="1353.998">stepping away from immediate involvement.)</tspan></text></svg>