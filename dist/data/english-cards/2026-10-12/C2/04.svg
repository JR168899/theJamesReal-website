<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>stand back from</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="480.3">stand back from</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="577.845">To gain perspective by temporarily distancing</tspan><tspan x="28" y="614.595">yourself from immediate involvement.</tspan></text><text x="28" y="669.1949999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="701.115">gain distance from; take a broader view of</tspan></text><text x="28" y="755.7149999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="787.635">It helps to stand back from the routine and ask</tspan><tspan x="28" y="824.385">what it serves.</tspan></text><text x="28" y="878.9849999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="910.905">This use is figurative. Stand back from an</tspan><tspan x="28" y="947.655">argument or process to examine its</tspan><tspan x="28" y="984.405">assumptions and purpose.</tspan></text><text x="28" y="1039.0049999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1070.925">A: Should I add another tracking tool?</tspan><tspan x="28" y="1107.675">B: First, stand back from the system and</tspan><tspan x="28" y="1144.425">consider its purpose.</tspan><tspan x="28" y="1181.175">A: What might that distance reveal?</tspan><tspan x="28" y="1217.925">B: That a useful tool has quietly become the</tspan><tspan x="28" y="1254.675">measure of success itself.</tspan></text><text x="28" y="1309.2749999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1341.195">What mental action does “stand back from”</tspan><tspan x="28" y="1377.945">describe here?</tspan></text></svg>