<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contingency</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A route can be planned, checked and changed when necessary.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A route can be planned, checked and changed when necessary.</tspan></text><a href="https://www.pexels.com/photo/unrecognizable-man-examining-map-while-planning-travel-at-home-6108074/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6108074</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">contingency</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /kənˈtɪndʒənsi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Singular: contingency; plural: contingencies.</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">The possibility of unforeseen events or circumstances</tspan><tspan x="28" y="641.0609999999999">affecting an outcome.</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">uncertainty; unforeseen possibility · Uncertainty is</tspan><tspan x="28" y="745.5469999999999">broader; a countable contingency is a possible future</tspan><tspan x="28" y="776.6969999999999">circumstance.</tspan></text><text x="28" y="822.9770000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="850.033">A humane routine accommodates contingency rather</tspan><tspan x="28" y="881.183">than treating every interruption as failure.</tspan></text><text x="28" y="927.4630000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="954.519">Usually uncountable in this abstract sense. A</tspan><tspan x="28" y="985.669">contingency can also be a specific possible event for</tspan><tspan x="28" y="1016.819">which a plan is prepared.</tspan></text><text x="28" y="1063.0990000000002" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.1550000000002">A: Why leave part of the afternoon unplanned?</tspan><tspan x="28" y="1121.3050000000003">B: To acknowledge contingency instead of pretending</tspan><tspan x="28" y="1152.4550000000002">it away.</tspan><tspan x="28" y="1183.6050000000002">A: Does that mean abandoning plans altogether?</tspan><tspan x="28" y="1214.755">B: No. It means treating them as provisional</tspan><tspan x="28" y="1245.9050000000002">responses to changing circumstances.</tspan></text><text x="28" y="1292.1850000000002" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1319.2410000000002">Explain contingency in the context of a daily plan.</tspan><tspan x="28" y="1350.3910000000003">(Model: It is the possibility that circumstances or</tspan><tspan x="28" y="1381.5410000000002">unexpected events will alter what happens.)</tspan></text></svg>