<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contingency</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - Vocabulary</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#382d2e">2026-10-12 · C2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>contingency</title><desc>Original family-manga illustration: path, related to contingency.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.94" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">contingency</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /kənˈtɪndʒənsi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Forms: contingency · contingencies</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">The possibility of unforeseen events or circumstances</tspan><tspan x="28" y="641.0609999999999">affecting an outcome.</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">uncertainty; unforeseen possibility · Uncertainty is</tspan><tspan x="28" y="745.5469999999999">broader; a countable contingency is a possible future</tspan><tspan x="28" y="776.6969999999999">circumstance.</tspan></text><text x="28" y="822.977" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="850.0329999999999">A humane routine accommodates contingency rather</tspan><tspan x="28" y="881.1829999999999">than treating every interruption as failure.</tspan></text><text x="28" y="927.463" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="954.5189999999999">Usually uncountable in this abstract sense. A</tspan><tspan x="28" y="985.6689999999999">contingency can also be a specific possible event for</tspan><tspan x="28" y="1016.8189999999998">which a plan is prepared.</tspan></text><text x="28" y="1063.099" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.155">A: Why leave part of the afternoon unplanned?</tspan><tspan x="28" y="1121.305">B: To acknowledge contingency instead of pretending</tspan><tspan x="28" y="1152.455">it away.</tspan><tspan x="28" y="1183.605">A: Does that mean abandoning plans altogether?</tspan><tspan x="28" y="1214.7549999999999">B: No. It means treating them as provisional</tspan><tspan x="28" y="1245.905">responses to changing circumstances.</tspan></text><text x="28" y="1292.185" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1319.241">Explain contingency in the context of a daily plan.</tspan><tspan x="28" y="1350.391">(Model: It is the possibility that circumstances or</tspan><tspan x="28" y="1381.541">unexpected events will alter what happens.)</tspan></text></svg>