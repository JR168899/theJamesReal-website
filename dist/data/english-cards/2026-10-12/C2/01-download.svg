<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contingency</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">contingency</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /kənˈtɪndʒənsi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: contingency; plural: contingencies.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">The possibility of unforeseen events or circumstances</tspan><tspan x="28" y="644.5845">affecting an outcome.</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">uncertainty; unforeseen possibility · Uncertainty is</tspan><tspan x="28" y="750.8315">broader; a countable contingency is a possible future</tspan><tspan x="28" y="782.5065000000001">circumstance.</tspan></text><text x="28" y="829.5665" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="857.0785000000001">A humane routine accommodates contingency rather</tspan><tspan x="28" y="888.7535">than treating every interruption as failure.</tspan></text><text x="28" y="935.8135" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="963.3255">Usually uncountable in this abstract sense. A</tspan><tspan x="28" y="995.0005">contingency can also be a specific possible event for</tspan><tspan x="28" y="1026.6755">which a plan is prepared.</tspan></text><text x="28" y="1073.7355" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1101.2475">A: What is our contingency if the ferry is cancelled?</tspan><tspan x="28" y="1132.9225">B: We can take the coastal bus.</tspan><tspan x="28" y="1164.5974999999999">A: Have you checked the timetable?</tspan><tspan x="28" y="1196.2725">B: Yes. The last one leaves at six.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">A ferry may be cancelled. Name the information a</tspan><tspan x="28" y="1317.667">useful contingency plan should include. (Model: An</tspan><tspan x="28" y="1349.3419999999999">alternative route, its departure times and any booking</tspan><tspan x="28" y="1381.017">or access requirements.)</tspan></text></svg>