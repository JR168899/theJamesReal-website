<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I have time for one small thing.</title><rect width="660" height="1434" fill="#dce6d8"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2d382e" stroke-width="1"/><text x="35" y="43" fill="#2d382e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A1   2026-10-12</tspan></text><text x="35" y="88" fill="#2d382e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">I have time for one small thing.</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>I have time for one small thing.</title><desc>Original hand-drawn story illustration: clock, set within conversation. I can use a little time to do one simple activity.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-3) scale(1.4)"><circle r="63" fill="#cfdbd3"/><path d="M0-40V0L29 17M0-55V-46M55 0H47M0 55V47M-55 0H-47"/></g><g transform="translate(94 266) rotate(3) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">I have time for one small thing.</text></svg><text x="35" y="514.4" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">I can use a little time to do one simple activity.</tspan></text><text x="35" y="590.8" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">I have time for one small thing. I can read a page.</tspan></text><text x="35" y="667.1999999999999" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Use have time for + a thing: I have time for a book. Use</tspan><tspan x="35" dy="24.839999999999996">have time to + a verb: I have time to read.</tspan></text><text x="35" y="768.4399999999998" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="792.9999999999998" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Do you have time to read?</tspan><tspan x="35" dy="24.839999999999996">B: Yes, I have time for one page.</tspan></text><text x="35" y="869.6799999999997" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="894.2399999999997" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: I have time ____ one small thing.</tspan></text><text x="35" y="1406" fill="#2d382e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">DAILY   /   07 OF 11</tspan></text></svg>