<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I have time for one small thing.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2d382e"><tspan x="28" y="482.0">I have time for one small</tspan><tspan x="28" y="544.5">thing.</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="646.54">I can use a little time to do one simple</tspan><tspan x="28" y="685.04">activity.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="775.68">I can fit in one little task.; I have a few</tspan><tspan x="28" y="814.18">minutes to spare.</tspan></text><text x="28" y="871.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="904.8199999999999">I have time for one small thing. I can read a</tspan><tspan x="28" y="943.3199999999999">page.</tspan></text><text x="28" y="1000.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1033.96">Use have time for + a thing: I have time for</tspan><tspan x="28" y="1072.46">a book. Use have time to + a verb: I have</tspan><tspan x="28" y="1110.96">time to read.</tspan></text><text x="28" y="1168.1599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1201.6">A: Do you have time to read?</tspan><tspan x="28" y="1240.1">B: Yes, I have time for one page.</tspan></text><text x="28" y="1297.2999999999997" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1330.7399999999998">Complete: I have time ____ one small</tspan><tspan x="28" y="1369.2399999999998">thing.</tspan></text></svg>