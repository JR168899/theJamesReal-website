<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I have time for one small thing.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cup of tea offers a simple refreshment.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cup of tea offers a simple refreshment.</tspan></text><a href="https://www.pexels.com/photo/cup-of-tea-on-a-table-16921454/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16921454</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="479.15">I have time for one small</tspan><tspan x="28" y="538.0875">thing.</tspan></text><text x="28" y="602.15" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="633.3100000000001">I can use a little time to do one simple activity.</tspan></text><text x="28" y="686.61" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="717.7700000000001">I can fit in one little task.; I have a few minutes</tspan><tspan x="28" y="753.6450000000001">to spare.</tspan></text><text x="28" y="806.945" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="838.1050000000001">I have time for one small thing. I can read a</tspan><tspan x="28" y="873.9800000000001">page.</tspan></text><text x="28" y="927.2800000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="958.4400000000002">One small thing limits the commitment. Choose</tspan><tspan x="28" y="994.3150000000002">a task that genuinely fits rather than naming</tspan><tspan x="28" y="1030.1900000000003">several tasks as one.</tspan></text><text x="28" y="1083.4900000000002" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1114.65">Heart: Do you want to start a big job before</tspan><tspan x="28" y="1150.525">breakfast?</tspan><tspan x="28" y="1186.4">Puck: I have time for one small thing.</tspan><tspan x="28" y="1222.275">Heart: What will you do?</tspan><tspan x="28" y="1258.15">Puck: Read one page and then leave.</tspan></text><text x="28" y="1311.4500000000003" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1342.6100000000001">Choose one small activity that fits a ten-minute</tspan><tspan x="28" y="1378.4850000000001">gap.</tspan></text></svg>