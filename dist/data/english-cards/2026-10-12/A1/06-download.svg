<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>so far, so good</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">so far, so good</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">Everything is going well up to now.</tspan></text><text x="28" y="625.7635" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="656.6195">all is well up to now; things are going smoothly</tspan></text><text x="28" y="709.3995" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="740.2555">My morning? So far, so good.</tspan></text><text x="28" y="793.0355" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="823.8915">A cautious positive report about progress to</tspan><tspan x="28" y="859.4164999999999">date, not a guarantee about the future.</tspan></text><text x="28" y="912.1965" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="943.0525">Heart: How is your new routine going?</tspan><tspan x="28" y="978.5775">Puck: So far, so good.</tspan><tspan x="28" y="1014.1025">Heart: Have you tried it on a busy day yet?</tspan><tspan x="28" y="1049.6275">Puck: Not yet. That will be the real test.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1291.096">Does So far, so good promise that future results</tspan><tspan x="28" y="1326.621">will also be good? Explain. (Model: No. It says</tspan><tspan x="28" y="1362.146">things have gone well up to the present point.)</tspan></text></svg>