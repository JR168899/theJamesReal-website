<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>One quiet morning</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/10/12 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A quiet morning can begin with a cup of coffee.</tspan></text><a href="https://www.pexels.com/photo/woman-enjoying-morning-coffee-through-window-reflection-29457512/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 29457512</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">One quiet morning</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#37322b"><tspan x="42" y="168.0">A quiet morning helps me start my day. I have a good breakfast and</tspan><tspan x="42" y="204.26999999999998">time for my book.</tspan></text><text x="42" y="237.54" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#37322b"><tspan x="42" y="273.53999999999996">First, I eat breakfast at seven. I choose bread and eggs. I drink some</tspan><tspan x="42" y="309.80999999999995">water too. The food is good.</tspan></text><text x="42" y="343.08" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#37322b"><tspan x="42" y="379.08">Next, I read a page in my book. I sit by the window. I have time for one</tspan><tspan x="42" y="415.34999999999997">small thing I like.</tspan></text><text x="42" y="448.62" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#37322b"><tspan x="42" y="484.62">Breakfast and a book make my morning nice. I feel good and I am ready</tspan><tspan x="42" y="520.89">for my day.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="572.16">BUILD YOUR OWN · Main idea: a nice morning. Reason 1: breakfast. Reason 2: a book. End: put the two reasons together.</tspan><tspan x="42" y="594.12">Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="616.0799999999999">What two things make the writer’s morning nice? (Model: Breakfast and reading a book make the writer’s morning nice.)</tspan></text></svg>