<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How is your morning?</title><rect width="660" height="1434" fill="#e3e1df"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#353331" stroke-width="1"/><text x="35" y="43" fill="#353331" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A1   2026-10-12</tspan></text><text x="35" y="88" fill="#353331" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">How is your morning?</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>How is your morning?</title><desc>Original hand-drawn story illustration: sun, set within conversation. A friendly question about someone&#x27;s morning.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><circle r="38" fill="#e4bd7b"/><path d="M0-57V-78M0 57V78M57 0H78M-57 0H-78M41-41L55-55M-41-41L-55-55M41 41L55 55M-41 41L-55 55"/></g><g transform="translate(538 266) rotate(0) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">How is your morning?</text></svg><text x="35" y="514.4" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A friendly question about someone&#x27;s morning.</tspan></text><text x="35" y="590.8" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">How is your morning?</tspan></text><text x="35" y="667.1999999999999" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">You can answer Good, thank you and then ask How about you?</tspan></text><text x="35" y="743.5999999999999" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="768.1599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: How is your morning?</tspan><tspan x="35" dy="24.839999999999996">B: Good, thank you. How about you?</tspan></text><text x="35" y="844.8399999999998" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="869.3999999999997" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Reply and ask the question back.</tspan></text><text x="35" y="1406" fill="#353331" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">SMALLTALK   /   10 OF 11</tspan></text></svg>