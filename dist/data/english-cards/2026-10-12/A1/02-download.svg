<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>choose</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Fresh produce is displayed at a market.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Fresh produce is displayed at a market.</tspan></text><a href="https://www.pexels.com/photo/vegetables-in-market-12527092/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12527092</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#382d2e"><tspan x="28" y="479.38">choose</tspan></text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="520.065">US /tʃuːz/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.66" font-weight="400" fill="#382d2e"><tspan x="28" y="549.0698">choose · chooses · chose · chosen · choosing (base ·</tspan><tspan x="28" y="576.715">third person · past · past participle · -ing)</tspan></text><text x="28" y="634.2302" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="665.5422">To pick the thing you want from two or more</tspan><tspan x="28" y="701.5921999999999">things.</tspan></text><text x="28" y="755.1522" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="786.4642">pick; select · Pick is common in everyday</tspan><tspan x="28" y="822.5142">speech.</tspan></text><text x="28" y="876.0742" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="907.3862">I choose a blue cup.</tspan></text><text x="28" y="960.9462" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="992.2582">Say choose a cup or choose a book. The past</tspan><tspan x="28" y="1028.3082">form is chose.</tspan></text><text x="28" y="1081.8682" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1113.1801999999998">Heart: Which one will you choose?</tspan><tspan x="28" y="1149.2301999999997">Puck: The blue coat.</tspan><tspan x="28" y="1185.2801999999997">Heart: Why that one?</tspan><tspan x="28" y="1221.3301999999999">Puck: It fits me better.</tspan></text><text x="28" y="1274.8901999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.2021999999997">Give a reason for choosing one coat over</tspan><tspan x="28" y="1342.2521999999997">another. (Model: I will choose the blue coat</tspan><tspan x="28" y="1378.3021999999996">because it fits better.)</tspan></text></svg>