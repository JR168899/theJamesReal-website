<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>morning</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person stretches on waking.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person stretches on waking.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="481.91">morning</tspan></text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="524.7675">US /ˈmɔːrnɪŋ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.870000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="555.3211">Singular: morning; plural: mornings.</tspan></text><text x="28" y="615.9075" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="648.8915000000001">The early part of the day, before the</tspan><tspan x="28" y="686.8665000000001">afternoon.</tspan></text><text x="28" y="743.2865" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="776.2705000000001">early part of the day; time before noon ·</tspan><tspan x="28" y="814.2455000000001">These phrases explain the time of day.</tspan></text><text x="28" y="870.6655000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="903.6495000000001">I read in the morning.</tspan></text><text x="28" y="960.0695000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="993.0535000000001">Say in the morning. Use at with a time: at</tspan><tspan x="28" y="1031.0285000000001">seven.</tspan></text><text x="28" y="1087.4485" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1120.4325000000001">Heart: Are you free this morning?</tspan><tspan x="28" y="1158.4075">Puck: Yes, until ten.</tspan><tspan x="28" y="1196.3825000000002">Heart: Would you like some tea?</tspan><tspan x="28" y="1234.3575">Puck: Yes, please.</tspan></text><text x="28" y="1290.7775" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.7615">Suggest a morning meeting that ends before</tspan><tspan x="28" y="1361.7365">ten. (Model: Shall we meet for tea at nine?)</tspan></text></svg>