<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I have time for one small thing.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cup of tea offers a simple refreshment.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cup of tea offers a simple refreshment.</tspan></text><a href="https://www.pexels.com/photo/cup-of-tea-on-a-table-16921454/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16921454</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="477.54">I have time for one small</tspan><tspan x="28" y="534.465">thing.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="626.436">I can use a little time to do one simple activity.</tspan></text><text x="28" y="677.916" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="708.0120000000001">I can fit in one little task.; I have a few minutes</tspan><tspan x="28" y="742.662">to spare.</tspan></text><text x="28" y="794.142" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="824.238">I have time for one small thing. I can read a</tspan><tspan x="28" y="858.888">page.</tspan></text><text x="28" y="910.368" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="940.464">One small thing limits the commitment. Choose</tspan><tspan x="28" y="975.114">a task that genuinely fits rather than naming</tspan><tspan x="28" y="1009.7640000000001">several tasks as one.</tspan></text><text x="28" y="1061.244" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1091.34">Heart: Do you want to start a big job before</tspan><tspan x="28" y="1125.99">breakfast?</tspan><tspan x="28" y="1160.6399999999999">Puck: I have time for one small thing.</tspan><tspan x="28" y="1195.29">Heart: What will you do?</tspan><tspan x="28" y="1229.94">Puck: Read one page and then leave.</tspan></text><text x="28" y="1281.4199999999998" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1311.5159999999998">Choose one small activity that fits a ten-minute</tspan><tspan x="28" y="1346.166">gap. (Model: I can read a page or make a cup</tspan><tspan x="28" y="1380.8159999999998">of tea.)</tspan></text></svg>