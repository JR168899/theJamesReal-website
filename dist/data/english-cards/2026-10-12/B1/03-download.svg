<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut back on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Money and a calculator support a spending calculation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Money and a calculator support a spending calculation.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">cut back on</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">To reduce the amount of something you use or do.</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="632.2765">use less of; reduce</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="706.8485000000001">I want to cut back on checking my phone during</tspan><tspan x="28" y="738.5235">dinner.</tspan></text><text x="28" y="785.5835" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="813.0955">Cut back on + noun or -ing form. The expression is</tspan><tspan x="28" y="844.7705">not separable: cut back on it.</tspan></text><text x="28" y="891.8304999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="919.3425">Sky: You have left the phone in another room.</tspan><tspan x="28" y="951.0174999999999">Michael: I am trying to cut back on checking it during</tspan><tspan x="28" y="982.6925">dinner.</tspan><tspan x="28" y="1014.3675">Sky: Will you stop using it altogether?</tspan><tspan x="28" y="1046.0425">Michael: No. I just want fewer interruptions.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Explain why cutting back on phone use does not</tspan><tspan x="28" y="1317.667">necessarily mean giving it up completely. (Model: It</tspan><tspan x="28" y="1349.3419999999999">means reducing the amount or frequency rather than</tspan><tspan x="28" y="1381.017">necessarily stopping.)</tspan></text></svg>