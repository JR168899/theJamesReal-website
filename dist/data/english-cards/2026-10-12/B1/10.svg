<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Have you tried anything new lately?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people play guitars together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people play guitars together.</tspan></text><a href="https://www.pexels.com/photo/men-playing-the-guitars-and-smiling-4670179/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4670179</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">Have you tried anything</tspan><tspan x="28" y="533.43">new lately?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="658.772">experience without assuming everyone shares it.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">Have you tried anything new lately?</tspan></text><text x="28" y="790.484" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="820.2760000000002">Follow the answer with a related question. Accept</tspan><tspan x="28" y="854.5760000000001">a different preference or a declined invitation</tspan><tspan x="28" y="888.8760000000002">without asking the person to justify it.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="969.6280000000002">Sky: Have you tried anything new lately?</tspan><tspan x="28" y="1003.9280000000001">Michael: I have started learning a few guitar</tspan><tspan x="28" y="1038.228">chords.</tspan><tspan x="28" y="1072.5280000000002">Sky: Was it difficult to begin?</tspan><tspan x="28" y="1106.8280000000002">Michael: My fingers were slow, but I could play a</tspan><tspan x="28" y="1141.1280000000002">simple pattern.</tspan><tspan x="28" y="1175.428">Sky: What made you keep going?</tspan><tspan x="28" y="1209.728">Michael: Hearing a little improvement after a</tspan><tspan x="28" y="1244.0280000000002">week.</tspan></text><text x="28" y="1294.988" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1324.78">Encourage a beginner without describing the</tspan><tspan x="28" y="1359.08">activity as easy.</tspan></text></svg>