<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Have you tried anything new lately?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people play guitars together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people play guitars together.</tspan></text><a href="https://www.pexels.com/photo/men-playing-the-guitars-and-smiling-4670179/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4670179</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#353331"><tspan x="28" y="479.84000000000003">Have you tried anything</tspan><tspan x="28" y="539.64">new lately?</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="636.256">An opening that invites a personal preference</tspan><tspan x="28" y="672.656">or experience without assuming everyone</tspan><tspan x="28" y="709.0559999999999">shares it.</tspan></text><text x="28" y="763.136" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="794.752">Have you tried anything new lately?</tspan></text><text x="28" y="848.832" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="880.448">Follow the answer with a related question.</tspan><tspan x="28" y="916.848">Accept a different preference or a declined</tspan><tspan x="28" y="953.2479999999999">invitation without asking the person to justify it.</tspan></text><text x="28" y="1007.328" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1038.944">A: Have you tried anything new lately?</tspan><tspan x="28" y="1075.344">B: I have started learning a few guitar chords.</tspan><tspan x="28" y="1111.744">A: Was it difficult to begin?</tspan><tspan x="28" y="1148.144">B: My fingers were slow, but I could play a</tspan><tspan x="28" y="1184.5439999999999">simple pattern.</tspan><tspan x="28" y="1220.944">A: What made you keep going?</tspan><tspan x="28" y="1257.344">B: Hearing a little improvement after a week.</tspan></text><text x="28" y="1311.4240000000002" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1343.04">Encourage a beginner without describing the</tspan><tspan x="28" y="1379.44">activity as easy.</tspan></text></svg>