<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A routine that fits</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-12</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">A routine that fits</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>A routine that fits</title><desc>Original hand-drawn story illustration: clock, set within conversation. Why a small, realistic routine can be easier to keep than an ambitious plan.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><circle r="63" fill="#cfdbd3"/><path d="M0-40V0L29 17M0-55V-46M55 0H47M0 55V47M-55 0H-47"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A routine that fits</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A useful routine should fit real</tspan><tspan x="36" dy="23.459999999999997">life. I learned that choosing one</tspan><tspan x="36" dy="23.459999999999997">realistic priority and returning</tspan><tspan x="36" dy="23.459999999999997">after interruptions work better</tspan><tspan x="36" dy="23.459999999999997">than making an ambitious plan I</tspan><tspan x="36" dy="23.459999999999997">cannot keep.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">First, a small priority is easier</tspan><tspan x="384" dy="23.459999999999997">to act on. I used to plan several</tspan><tspan x="384" dy="23.459999999999997">new activities every day, but I</tspan><tspan x="384" dy="23.459999999999997">usually fell behind. Then I chose</tspan><tspan x="384" dy="23.459999999999997">ten minutes of reading after</tspan><tspan x="384" dy="23.459999999999997">dinner and put a book beside my</tspan><tspan x="384" dy="23.459999999999997">chair. The clear, simple task was</tspan><tspan x="384" dy="23.459999999999997">easier to remember.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Second, a flexible routine</tspan><tspan x="732" dy="23.459999999999997">survives ordinary interruptions.</tspan><tspan x="732" dy="23.459999999999997">Sometimes a visitor arrived or</tspan><tspan x="732" dy="23.459999999999997">another task took longer than</tspan><tspan x="732" dy="23.459999999999997">expected. Instead of giving up, I</tspan><tspan x="732" dy="23.459999999999997">returned to reading the next</tspan><tspan x="732" dy="23.459999999999997">evening. Missing one day did not</tspan><tspan x="732" dy="23.459999999999997">mean abandoning the whole plan.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Realistic goals and flexible</tspan><tspan x="1080" dy="23.459999999999997">expectations helped reading</tspan><tspan x="1080" dy="23.459999999999997">become part of my day. A routine</tspan><tspan x="1080" dy="23.459999999999997">does not need to be impressive to</tspan><tspan x="1080" dy="23.459999999999997">be useful. It succeeds when it is</tspan><tspan x="1080" dy="23.459999999999997">simple enough to start and</tspan><tspan x="1080" dy="23.459999999999997">forgiving enough to continue.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Why was the smaller plan easier to keep?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>