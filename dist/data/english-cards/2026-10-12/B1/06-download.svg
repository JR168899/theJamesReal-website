<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>break the ice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A conversation begins by making contact and listening.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A conversation begins by making contact and listening.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">break the ice</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="583.633">To make people feel more relaxed at the</tspan><tspan x="28" y="621.9580000000001">start of a conversation or meeting.</tspan></text><text x="28" y="678.898" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="712.186">put people at ease; start a friendly</tspan><tspan x="28" y="750.5110000000001">exchange</tspan></text><text x="28" y="807.451" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="840.739">Asking about the book on her desk helped</tspan><tspan x="28" y="879.0640000000001">break the ice.</tspan></text><text x="28" y="936.004" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="969.292">An easy, friendly question can break the</tspan><tspan x="28" y="1007.6170000000001">ice. Avoid personal questions that could</tspan><tspan x="28" y="1045.942">make someone uncomfortable.</tspan></text><text x="28" y="1102.882" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1136.17">A: How did you start talking to your new</tspan><tspan x="28" y="1174.4950000000001">neighbour?</tspan><tspan x="28" y="1212.8200000000002">B: I asked about her dog to break the ice.</tspan></text><text x="28" y="1269.76" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1303.048">Suggest one question that could break the</tspan><tspan x="28" y="1341.373">ice. (Model: Have you lived in this</tspan><tspan x="28" y="1379.698">neighbourhood long?)</tspan></text></svg>