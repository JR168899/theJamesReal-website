<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>break the ice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#383426"><tspan x="28" y="480.3">break the ice</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="577.845">To make people feel more relaxed at the start</tspan><tspan x="28" y="614.595">of a conversation or meeting.</tspan></text><text x="28" y="669.1949999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="701.115">put people at ease; start a friendly exchange</tspan></text><text x="28" y="755.7149999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="787.635">Asking about the book on her desk helped</tspan><tspan x="28" y="824.385">break the ice.</tspan></text><text x="28" y="878.9849999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="910.905">An informal expression for easing initial social</tspan><tspan x="28" y="947.655">awkwardness, not forcing private disclosure.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1034.175">A: Nobody at the table knows one another.</tspan><tspan x="28" y="1070.925">B: I might ask about the books people brought.</tspan><tspan x="28" y="1107.675">A: That could break the ice.</tspan><tspan x="28" y="1144.425">B: And give everyone an easy way into the</tspan><tspan x="28" y="1181.175">conversation.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1292.72">Choose an opening question for strangers that</tspan><tspan x="28" y="1329.47">is easy to answer and not intrusive. (Model:</tspan><tspan x="28" y="1366.22">What brought you to today&#x27;s book swap?)</tspan></text></svg>