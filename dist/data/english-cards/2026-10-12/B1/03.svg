<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut back on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Money and a calculator support a spending calculation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Money and a calculator support a spending calculation.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="481.91">cut back on</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="582.7065000000001">To reduce the amount of something you use</tspan><tspan x="28" y="620.6815000000001">or do.</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="710.0855000000001">use less of; reduce</tspan></text><text x="28" y="766.5055000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="799.4895000000001">I want to cut back on checking my phone</tspan><tspan x="28" y="837.4645000000002">during dinner.</tspan></text><text x="28" y="893.8845000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="926.8685000000002">Cut back on + noun or -ing form. The</tspan><tspan x="28" y="964.8435000000002">expression is not separable: cut back on it.</tspan></text><text x="28" y="1021.2635000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1054.2475000000002">Sky: You have left the phone in another</tspan><tspan x="28" y="1092.2225">room.</tspan><tspan x="28" y="1130.1975000000002">Michael: I am trying to cut back on checking</tspan><tspan x="28" y="1168.1725000000001">it during dinner.</tspan><tspan x="28" y="1206.1475000000003">Sky: Will you stop using it altogether?</tspan><tspan x="28" y="1244.1225000000002">Michael: No. I just want fewer interruptions.</tspan></text><text x="28" y="1300.5425" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1333.5265000000002">Explain why cutting back on phone use does</tspan><tspan x="28" y="1371.5015">not necessarily mean giving it up completely.</tspan></text></svg>