<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut back on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Money and a calculator support a spending calculation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Money and a calculator support a spending calculation.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">cut back on</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="583.633">To reduce the amount of something you</tspan><tspan x="28" y="621.9580000000001">use or do.</tspan></text><text x="28" y="678.898" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="712.186">use less of; reduce</tspan></text><text x="28" y="769.1260000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="802.4140000000001">I want to cut back on checking my phone</tspan><tspan x="28" y="840.7390000000001">during dinner.</tspan></text><text x="28" y="897.6790000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="930.9670000000001">Cut back on + noun or -ing form. The</tspan><tspan x="28" y="969.2920000000001">expression is not separable: cut back on it.</tspan></text><text x="28" y="1026.2320000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1059.5200000000002">A: You have left the phone in another room.</tspan><tspan x="28" y="1097.8450000000003">B: I am trying to cut back on checking it</tspan><tspan x="28" y="1136.1700000000003">during dinner.</tspan><tspan x="28" y="1174.4950000000003">A: Will you stop using it altogether?</tspan><tspan x="28" y="1212.8200000000002">B: No. I just want fewer interruptions.</tspan></text><text x="28" y="1269.7600000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1303.0480000000002">Explain why cutting back on phone use</tspan><tspan x="28" y="1341.3730000000003">does not necessarily mean giving it up</tspan><tspan x="28" y="1379.6980000000003">completely.</tspan></text></svg>