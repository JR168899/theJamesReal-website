<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>routine</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-12</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">routine</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>routine</title><desc>Original hand-drawn story illustration: clock, set within conversation. The usual order or way in which you do regular activities.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><circle r="63" fill="#cfdbd3"/><path d="M0-40V0L29 17M0-55V-46M55 0H47M0 55V47M-55 0H-47"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">routine</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">US PRONUNCIATION</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">/ruːˈtiːn/ noun</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">The usual order or way in which you do regular activities.</tspan></text><text x="35" y="667.1999999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">WORD FORMS</tspan></text><text x="35" y="691.7599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Forms: routine · routines</tspan></text><text x="35" y="743.5999999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="768.1599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A simple evening routine helps me remember what I need for</tspan><tspan x="35" dy="24.839999999999996">tomorrow.</tspan></text><text x="35" y="844.8399999999998" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="869.3999999999997" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A morning routine describes your normal morning</tspan><tspan x="35" dy="24.839999999999996">activities. Routine can be a noun or an adjective; here it</tspan><tspan x="35" dy="24.839999999999996">is a noun.</tspan></text><text x="35" y="970.9199999999997" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="995.4799999999997" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Has your routine changed?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. I pack my bag in the evening now.</tspan></text><text x="35" y="1072.1599999999996" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1096.7199999999996" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: Packing my bag is part of my evening ____.</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   01 OF 11</tspan></text></svg>