<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>routine</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A list can organize actions, responsibilities and repeated practice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A list can organize actions, responsibilities and repeated practice.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="48.760000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="480.76">routine</tspan></text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="522.63">US /ruːˈtiːn/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.32" font-weight="400" fill="#382d2e"><tspan x="28" y="552.4796">Singular: routine; plural: routines.</tspan></text><text x="28" y="611.67" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="643.8939999999999">The usual order or way in which you do</tspan><tspan x="28" y="680.9939999999999">regular activities.</tspan></text><text x="28" y="736.114" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="768.338">usual pattern; regular schedule · A routine</tspan><tspan x="28" y="805.438">can include several habits; a schedule</tspan><tspan x="28" y="842.538">focuses on their timing.</tspan></text><text x="28" y="897.658" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="929.882">A simple evening routine helps me</tspan><tspan x="28" y="966.982">remember what I need for tomorrow.</tspan></text><text x="28" y="1022.1020000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1054.326">A morning routine describes your normal</tspan><tspan x="28" y="1091.426">morning activities. Routine can be a noun or</tspan><tspan x="28" y="1128.526">an adjective; here it is a noun.</tspan></text><text x="28" y="1183.6460000000002" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1215.8700000000001">A: Has your routine changed?</tspan><tspan x="28" y="1252.97">B: Yes. I pack my bag in the evening now.</tspan></text><text x="28" y="1308.0900000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.314">Complete: Packing my bag is part of my</tspan><tspan x="28" y="1377.414">evening ____.</tspan></text></svg>