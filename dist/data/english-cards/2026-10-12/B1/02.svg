<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>priority</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written plan connects limited time with a chosen purpose.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written plan connects limited time with a chosen purpose.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382d2e"><tspan x="28" y="482.0">priority</tspan></text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="525.3">US /praɪˈɔːrəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="24.200000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="556.2760000000001">Singular: priority; plural: priorities.</tspan></text><text x="28" y="617.7" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="651.14">Something you think is more important than</tspan><tspan x="28" y="689.64">other things and should receive attention</tspan><tspan x="28" y="728.14">first.</tspan></text><text x="28" y="785.34" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="818.78">main concern; important task · A priority</tspan><tspan x="28" y="857.28">receives attention before less important</tspan><tspan x="28" y="895.78">matters.</tspan></text><text x="28" y="952.98" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="986.42">Spending time with my family is a priority</tspan><tspan x="28" y="1024.92">this week.</tspan></text><text x="28" y="1082.12" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1115.56">Say a priority or your main priority. Priorities</tspan><tspan x="28" y="1154.06">is the plural form.</tspan></text><text x="28" y="1211.2599999999998" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1244.6999999999998">A: What is your main priority today?</tspan><tspan x="28" y="1283.1999999999998">B: Finishing the letter I promised to write.</tspan></text><text x="28" y="1340.3999999999996" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1373.8399999999997">Name one priority for your day.</tspan></text></svg>