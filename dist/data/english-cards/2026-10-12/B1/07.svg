<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would rather make a small change that I can keep.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A clock makes the passage of time visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A clock makes the passage of time visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-on-hands-of-clock-13151698/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13151698</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="475.47">I would rather make a small</tspan><tspan x="28" y="529.8075">change that I can keep.</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="617.5980000000001">A way to express a preference for a manageable</tspan><tspan x="28" y="650.6730000000001">change that can continue over time.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="728.541">I prefer a manageable, lasting adjustment.; I would</tspan><tspan x="28" y="761.6160000000001">choose a modest change I can maintain.</tspan></text><text x="28" y="810.756" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="839.484">I would rather make a small change that I can keep.</tspan></text><text x="28" y="888.6239999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="917.352">Would rather + base verb expresses a preference.</tspan><tspan x="28" y="950.427">Do not add to before the verb: would rather make.</tspan></text><text x="28" y="999.5669999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1028.2949999999998">A: Are you going to study for two hours every</tspan><tspan x="28" y="1061.37">morning?</tspan><tspan x="28" y="1094.445">B: I would rather make a small change that I can</tspan><tspan x="28" y="1127.5199999999998">keep.</tspan><tspan x="28" y="1160.5949999999998">A: What seems manageable?</tspan><tspan x="28" y="1193.6699999999998">B: Ten minutes after breakfast, at least to begin with.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1287.848">Replace an unrealistic two-hour daily promise with a</tspan><tspan x="28" y="1320.923">sustainable alternative using would rather.</tspan></text></svg>