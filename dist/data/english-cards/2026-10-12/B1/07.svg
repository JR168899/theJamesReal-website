<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would rather make a small change that I can keep.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A plant develops through successive stages.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A plant develops through successive stages.</tspan></text><a href="https://www.pexels.com/photo/uprooted-plants-on-white-surface-4377079/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4377079</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#2d382e"><tspan x="28" y="478.69">I would rather make a</tspan><tspan x="28" y="537.0525">small change that I can</tspan><tspan x="28" y="595.415">keep.</tspan></text><text x="28" y="658.8525000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="689.7085000000001">A way to express a preference for a</tspan><tspan x="28" y="725.2335">manageable change that can continue over</tspan><tspan x="28" y="760.7585000000001">time.</tspan></text><text x="28" y="813.5385000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="844.3945000000001">I prefer a manageable, lasting adjustment.; I</tspan><tspan x="28" y="879.9195000000001">would choose a modest change I can maintain.</tspan></text><text x="28" y="932.6995000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="963.5555000000002">I would rather make a small change that I can</tspan><tspan x="28" y="999.0805000000001">keep.</tspan></text><text x="28" y="1051.8605000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="1082.7165000000002">Use would rather + the base verb, without to: I</tspan><tspan x="28" y="1118.2415000000003">would rather start small.</tspan></text><text x="28" y="1171.0215000000003" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="1201.8775000000003">A: Why not change your whole schedule?</tspan><tspan x="28" y="1237.4025000000004">B: I would rather make a small change that I</tspan><tspan x="28" y="1272.9275000000002">can keep.</tspan></text><text x="28" y="1325.7075000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2d382e"><tspan x="28" y="1356.5635000000002">Complete: I would rather ____ one useful habit.</tspan></text></svg>