<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>stick to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">stick to</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="584.04">To continue following a plan, decision, or</tspan><tspan x="28" y="622.54">habit.</tspan></text><text x="28" y="679.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="713.18">adhere to; keep to</tspan></text><text x="28" y="770.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="803.8199999999999">It is easier to stick to a plan when it is</tspan><tspan x="28" y="842.3199999999999">realistic.</tspan></text><text x="28" y="899.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="932.9599999999999">Use stick to + a noun or -ing: stick to a</tspan><tspan x="28" y="971.4599999999999">plan. The past form is stuck to.</tspan></text><text x="28" y="1028.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1062.1">A: How is your new reading plan?</tspan><tspan x="28" y="1100.6">B: I can stick to ten minutes a day.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1295.04">Complete: I can stick ____ a simple plan.</tspan></text></svg>