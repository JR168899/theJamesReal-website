<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would rather make a small change that I can keep.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A plant develops through successive stages.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A plant develops through successive stages.</tspan></text><a href="https://www.pexels.com/photo/uprooted-plants-on-white-surface-4377079/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4377079</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#2d382e"><tspan x="28" y="478.0">I would rather make a</tspan><tspan x="28" y="535.5">small change that I can</tspan><tspan x="28" y="593.0">keep.</tspan></text><text x="28" y="655.5" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="685.9">A way to express a preference for a</tspan><tspan x="28" y="720.9">manageable change that can continue over</tspan><tspan x="28" y="755.9">time.</tspan></text><text x="28" y="807.9" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="838.3">I prefer a manageable, lasting adjustment.; I</tspan><tspan x="28" y="873.3">would choose a modest change I can maintain.</tspan></text><text x="28" y="925.3" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="955.6999999999999">I would rather make a small change that I can</tspan><tspan x="28" y="990.6999999999999">keep.</tspan></text><text x="28" y="1042.7" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="1073.1000000000001">Use would rather + the base verb, without to: I</tspan><tspan x="28" y="1108.1000000000001">would rather start small.</tspan></text><text x="28" y="1160.1000000000001" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="1190.5000000000002">A: Why not change your whole schedule?</tspan><tspan x="28" y="1225.5000000000002">B: I would rather make a small change that I</tspan><tspan x="28" y="1260.5000000000002">can keep.</tspan></text><text x="28" y="1312.5000000000002" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#2d382e"><tspan x="28" y="1342.9000000000003">Complete: I would rather ____ one useful habit.</tspan><tspan x="28" y="1377.9000000000003">(Model: build)</tspan></text></svg>