<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>distraction</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">distraction</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /dɪˈstrækʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: distraction; plural: distractions.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">Something that takes your attention away from what</tspan><tspan x="28" y="644.5845">you are doing.</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">interruption; diversion · An interruption stops an</tspan><tspan x="28" y="750.8315">activity; a distraction may only take attention away.</tspan></text><text x="28" y="797.8915" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="825.4035">Even a quiet notification can become a distraction.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Use a distraction from an activity. In this context it</tspan><tspan x="28" y="931.6505">interrupts concentration, though a distraction can</tspan><tspan x="28" y="963.3255">sometimes be welcome.</tspan></text><text x="28" y="1010.3855" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8975">A: I keep losing my place in this chapter.</tspan><tspan x="28" y="1069.5725">B: Is the phone becoming a distraction?</tspan><tspan x="28" y="1101.2475">A: Yes. Every message makes me stop.</tspan><tspan x="28" y="1132.9225000000001">B: Would leaving it in another room help?</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Suggest one change that could reduce a</tspan><tspan x="28" y="1317.667">phone-related distraction while reading. (Model: Put</tspan><tspan x="28" y="1349.3419999999999">the phone in another room or silence notifications for</tspan><tspan x="28" y="1381.017">the reading session.)</tspan></text></svg>