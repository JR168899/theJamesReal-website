<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I want my schedule to reflect what matters to me.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A clock makes the passage of time visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A clock makes the passage of time visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-on-hands-of-clock-13151698/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13151698</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="474.32">I want my schedule to reflect</tspan><tspan x="28" y="527.22">what matters to me.</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="612.688">A way to say that your use of time should show your</tspan><tspan x="28" y="644.888">personal values.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="720.696">I want to make time for my priorities.; My timetable</tspan><tspan x="28" y="752.8960000000001">should express my values.</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="828.7040000000001">I want my schedule to reflect what matters to me,</tspan><tspan x="28" y="860.9040000000001">even in small ways.</tspan></text><text x="28" y="908.7440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="936.7120000000001">Reflect means show or express here. Link the value</tspan><tspan x="28" y="968.9120000000001">to an actual allocation of time rather than only an</tspan><tspan x="28" y="1001.1120000000001">aspiration.</tspan></text><text x="28" y="1048.9520000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1076.9200000000003">Aoede: Your calendar is full, but you sound</tspan><tspan x="28" y="1109.1200000000003">dissatisfied.</tspan><tspan x="28" y="1141.3200000000004">Echo: I want my schedule to reflect what matters to</tspan><tspan x="28" y="1173.5200000000002">me.</tspan><tspan x="28" y="1205.7200000000003">Aoede: What is missing?</tspan><tspan x="28" y="1237.9200000000003">Echo: Time with my sister. I keep treating it as</tspan><tspan x="28" y="1270.1200000000003">optional.</tspan></text><text x="28" y="1317.9600000000003" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1345.9280000000003">Name one calendar change that makes a stated</tspan><tspan x="28" y="1378.1280000000004">priority visible in practice.</tspan></text></svg>