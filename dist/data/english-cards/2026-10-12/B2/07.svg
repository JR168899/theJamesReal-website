<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I want my schedule to reflect what matters to me.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="477.54">I want my schedule to</tspan><tspan x="28" y="534.465">reflect what matters to me.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="626.436">A way to say that your use of time should show</tspan><tspan x="28" y="661.086">your personal values.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="742.662">I want to make time for my priorities.; My</tspan><tspan x="28" y="777.312">timetable should express my values.</tspan></text><text x="28" y="828.792" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="858.888">I want my schedule to reflect what matters to</tspan><tspan x="28" y="893.538">me, even in small ways.</tspan></text><text x="28" y="945.018" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="975.114">Reflect here means express or represent. What</tspan><tspan x="28" y="1009.764">matters to me is a noun clause meaning what I</tspan><tspan x="28" y="1044.414">consider important.</tspan></text><text x="28" y="1095.894" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1125.99">A: Why did you reserve Friday evenings?</tspan><tspan x="28" y="1160.64">B: I want my schedule to reflect what matters to</tspan><tspan x="28" y="1195.29">me.</tspan><tspan x="28" y="1229.94">A: What will you use those evenings for?</tspan><tspan x="28" y="1264.5900000000001">B: Spending time with my family and reading</tspan><tspan x="28" y="1299.24">without rushing.</tspan></text><text x="28" y="1350.72" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1380.816">Paraphrase “reflect what matters to me”.</tspan></text></svg>