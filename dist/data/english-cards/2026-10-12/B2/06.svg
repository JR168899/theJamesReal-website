<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a change of pace</title><rect width="660" height="1434" fill="#efe6bd"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#383426" stroke-width="1"/><text x="35" y="43" fill="#383426" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-12</tspan></text><text x="35" y="88" fill="#383426" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">a change of pace</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>a change of pace</title><desc>Original hand-drawn story illustration: path, set within conversation. An activity or rhythm that is pleasantly different from your usual one.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-1) scale(1.4)"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><g transform="translate(538 266) rotate(1) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">a change of pace</text></svg><text x="35" y="514.4" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An activity or rhythm that is pleasantly different from</tspan><tspan x="35" dy="24.839999999999996">your usual one.</tspan></text><text x="35" y="615.6399999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="640.1999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An afternoon in the garden was a welcome change of pace.</tspan></text><text x="35" y="692.0399999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="716.5999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A change of pace can be slower or faster. The phrase</tspan><tspan x="35" dy="24.839999999999996">highlights variety, not necessarily relaxation.</tspan></text><text x="35" y="793.2799999999997" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="817.8399999999997" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: How was the pottery class?</tspan><tspan x="35" dy="24.839999999999996">B: It was a lovely change of pace after a busy week.</tspan><tspan x="35" dy="24.839999999999996">A: Would you like to try it again?</tspan><tspan x="35" dy="24.839999999999996">B: Definitely. Working with my hands felt refreshing.</tspan></text><text x="35" y="944.1999999999997" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="968.7599999999996" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Describe a change of pace you would enjoy.</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   06 OF 11</tspan></text></svg>