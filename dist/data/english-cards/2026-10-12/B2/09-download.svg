<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Present perfect continuous</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives hands-on care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives hands-on care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382f40"><tspan x="28" y="477.08">Present perfect continuous</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="568.1220000000001">Use have or has been + -ing for an activity</tspan><tspan x="28" y="602.422">continuing from the past to now, or a recent</tspan><tspan x="28" y="636.7220000000001">activity with a present result.</tspan></text><text x="28" y="687.6819999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="717.474">I have been trying to leave more space between</tspan><tspan x="28" y="751.774">appointments.</tspan></text><text x="28" y="802.7339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="832.5260000000001">Have/has been + -ing can describe an activity</tspan><tspan x="28" y="866.826">continuing to now. Since introduces a starting</tspan><tspan x="28" y="901.1260000000001">point; for introduces a duration.</tspan></text><text x="28" y="952.0859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="981.878">A: How long have you been keeping these</tspan><tspan x="28" y="1016.178">garden notes?</tspan><tspan x="28" y="1050.478">B: I have been recording the changes since</tspan><tspan x="28" y="1084.778">March.</tspan><tspan x="28" y="1119.078">A: Every day?</tspan><tspan x="28" y="1153.3780000000002">B: Most days, especially when new leaves</tspan><tspan x="28" y="1187.678">appear.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="1289.472">Complete with since or for: I have been recording</tspan><tspan x="28" y="1323.772">changes ___ March and ___ several months.</tspan><tspan x="28" y="1358.072">(Model: since March; for several months)</tspan></text></svg>