<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a change of pace</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">a change of pace</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">An activity or rhythm that is pleasantly different</tspan><tspan x="28" y="607.6389999999999">from your usual one.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="690.8629999999999">a welcome variation; a break from routine</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="774.0869999999999">An afternoon in the garden was a welcome</tspan><tspan x="28" y="809.4369999999999">change of pace.</tspan></text><text x="28" y="861.957" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="892.661">A different activity or rhythm, often welcome. It</tspan><tspan x="28" y="928.011">need not be faster, more difficult or more</tspan><tspan x="28" y="963.361">productive.</tspan></text><text x="28" y="1015.881" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1046.585">A: You usually spend Sunday at your desk.</tspan><tspan x="28" y="1081.935">B: An afternoon in the garden would be a</tspan><tspan x="28" y="1117.285">change of pace.</tspan><tspan x="28" y="1152.635">A: Would it have to be productive?</tspan><tspan x="28" y="1187.9850000000001">B: No. Doing something different would be</tspan><tspan x="28" y="1223.335">enough.</tspan></text><text x="28" y="1275.8550000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1306.5590000000002">Suggest a change of pace for someone who</tspan><tspan x="28" y="1341.909">has spent the week indoors at a desk. (Model:</tspan><tspan x="28" y="1377.2590000000002">A gentle walk or an afternoon in the garden.)</tspan></text></svg>