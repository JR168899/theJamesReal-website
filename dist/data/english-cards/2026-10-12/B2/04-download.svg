<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get around to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader follows the printed text in an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader follows the printed text in an open book.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-an-open-book-with-sunlight-36324703/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 36324703</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">get around to</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">To finally find the time to do something you intended</tspan><tspan x="28" y="589.3795">to do.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="663.9515">eventually tackle; finally make time for</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="738.5235">I finally got around to organising my photographs.</tspan></text><text x="28" y="785.5835" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="813.0955">Get around to + noun or -ing: get around to sorting,</tspan><tspan x="28" y="844.7705">not get around to sort. British English also uses get</tspan><tspan x="28" y="876.4455">round to.</tspan></text><text x="28" y="923.5055" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="951.0175">A: Have you sorted the photographs yet?</tspan><tspan x="28" y="982.6925">B: I finally got around to it yesterday.</tspan><tspan x="28" y="1014.3675000000001">A: What made it possible?</tspan><tspan x="28" y="1046.0425">B: I stopped waiting for a whole free weekend.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Explain what finally suggests in I finally got around to</tspan><tspan x="28" y="1317.667">sorting the photographs. (Model: The task had been</tspan><tspan x="28" y="1349.3419999999999">intended or postponed for some time before it was</tspan><tspan x="28" y="1381.017">done.)</tspan></text></svg>