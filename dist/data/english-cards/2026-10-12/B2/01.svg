<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>deliberate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Writing down a choice gives time to consider it carefully.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Writing down a choice gives time to consider it carefully.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">deliberate</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /dɪˈlɪbərət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Adjective: deliberate; related noun: deliberation</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">Done intentionally and with thought, rather than</tspan><tspan x="28" y="655.1550000000001">by accident.</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">intentional; considered · Intentional means not</tspan><tspan x="28" y="766.6850000000001">accidental; considered also suggests careful</tspan><tspan x="28" y="799.9350000000001">thought.</tspan></text><text x="28" y="849.335" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="878.215">Leaving my phone in another room was a</tspan><tspan x="28" y="911.465">deliberate choice.</tspan></text><text x="28" y="960.865" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="989.745">Here deliberate is an adjective. Its final syllable is</tspan><tspan x="28" y="1022.995">weak; the verb deliberate has a different</tspan><tspan x="28" y="1056.245">pronunciation and means consider carefully.</tspan></text><text x="28" y="1105.645" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.5249999999999">A: Did you forget your phone?</tspan><tspan x="28" y="1167.7749999999999">B: No. It was a deliberate decision to leave it</tspan><tspan x="28" y="1201.0249999999999">behind.</tspan><tspan x="28" y="1234.2749999999999">A: Did leaving it behind make a difference?</tspan><tspan x="28" y="1267.5249999999999">B: Yes. I found it easier to stay with the</tspan><tspan x="28" y="1300.7749999999999">conversation.</tspan></text><text x="28" y="1350.175" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1379.0549999999998">Complete: It was a ____ choice, not an accident.</tspan></text></svg>