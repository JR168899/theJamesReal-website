<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>deliberate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>deliberate</title><desc>Original family-manga illustration: magnifier, related to deliberate.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.699999999999996" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">deliberate</tspan></text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /dɪˈlɪbərət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.9" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Forms: more deliberate · most deliberate</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">Done intentionally and with thought, rather than</tspan><tspan x="28" y="655.1550000000001">by accident.</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">intentional; considered · Intentional means not</tspan><tspan x="28" y="766.6850000000001">accidental; considered also suggests careful</tspan><tspan x="28" y="799.9350000000001">thought.</tspan></text><text x="28" y="849.335" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="878.215">Leaving my phone in another room was a</tspan><tspan x="28" y="911.465">deliberate choice.</tspan></text><text x="28" y="960.865" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="989.745">Here deliberate is an adjective. Its final syllable is</tspan><tspan x="28" y="1022.995">weak; the verb deliberate has a different</tspan><tspan x="28" y="1056.245">pronunciation and means consider carefully.</tspan></text><text x="28" y="1105.645" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.5249999999999">A: Did you forget your phone?</tspan><tspan x="28" y="1167.7749999999999">B: No. It was a deliberate decision to leave it</tspan><tspan x="28" y="1201.0249999999999">behind.</tspan><tspan x="28" y="1234.2749999999999">A: Did leaving it behind make a difference?</tspan><tspan x="28" y="1267.5249999999999">B: Yes. I found it easier to stay with the</tspan><tspan x="28" y="1300.7749999999999">conversation.</tspan></text><text x="28" y="1350.175" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1379.0549999999998">Complete: It was a ____ choice, not an accident.</tspan></text></svg>