<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Designing a day with breathing room</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-12</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Designing a day with breathing room</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Designing a day with breathing room</title><desc>Original hand-drawn story illustration: room, set within conversation. How deliberate choices about time can leave more room for attention.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(2) scale(1.4)"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><g transform="translate(94 266) rotate(-2) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Designing a day with breathing room</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A meaningful schedule needs more</tspan><tspan x="36" dy="23.459999999999997">than a full calendar. Protecting</tspan><tspan x="36" dy="23.459999999999997">valued activities and leaving</tspan><tspan x="36" dy="23.459999999999997">gaps between commitments can</tspan><tspan x="36" dy="23.459999999999997">create the breathing room needed</tspan><tspan x="36" dy="23.459999999999997">for sustained attention.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">First, protecting one priority</tspan><tspan x="384" dy="23.459999999999997">makes it easier to act on what</tspan><tspan x="384" dy="23.459999999999997">matters. I made a deliberate</tspan><tspan x="384" dy="23.459999999999997">adjustment by setting aside time</tspan><tspan x="384" dy="23.459999999999997">to read before opening my</tspan><tspan x="384" dy="23.459999999999997">messages. Some replies had to</tspan><tspan x="384" dy="23.459999999999997">wait, but reading finally became</tspan><tspan x="384" dy="23.459999999999997">part of my day rather than a</tspan><tspan x="384" dy="23.459999999999997">postponed intention.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Second, small gaps prevent</tspan><tspan x="732" dy="23.459999999999997">commitments from competing for</tspan><tspan x="732" dy="23.459999999999997">every available minute. I began</tspan><tspan x="732" dy="23.459999999999997">leaving a short break after</tspan><tspan x="732" dy="23.459999999999997">meetings instead of scheduling</tspan><tspan x="732" dy="23.459999999999997">another task immediately. That</tspan><tspan x="732" dy="23.459999999999997">pause helped me recognise when I</tspan><tspan x="732" dy="23.459999999999997">was spreading myself too thin and</tspan><tspan x="732" dy="23.459999999999997">adjust the rest of the day.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Protected priorities and</tspan><tspan x="1080" dy="23.459999999999997">deliberate gaps both make</tspan><tspan x="1080" dy="23.459999999999997">attention more sustainable.</tspan><tspan x="1080" dy="23.459999999999997">Neither requires a completely</tspan><tspan x="1080" dy="23.459999999999997">empty calendar; each requires</tspan><tspan x="1080" dy="23.459999999999997">accepting limits. I now judge my</tspan><tspan x="1080" dy="23.459999999999997">schedule by the room it gives</tspan><tspan x="1080" dy="23.459999999999997">meaningful activities, as well as</tspan><tspan x="1080" dy="23.459999999999997">the tasks it contains.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · What two changes does the writer recommend, and what trade-off is involved?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>