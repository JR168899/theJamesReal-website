<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get around to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader follows the printed text in an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader follows the printed text in an open book.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-an-open-book-with-sunlight-36324703/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 36324703</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="480.3">get around to</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="577.845">To finally find the time to do something you</tspan><tspan x="28" y="614.595">intended to do.</tspan></text><text x="28" y="669.1949999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="701.115">eventually tackle; finally make time for</tspan></text><text x="28" y="755.7149999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="787.635">I finally got around to organising my</tspan><tspan x="28" y="824.385">photographs.</tspan></text><text x="28" y="878.9849999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="910.905">Get around to + noun or -ing: get around to</tspan><tspan x="28" y="947.655">sorting, not get around to sort. British English</tspan><tspan x="28" y="984.405">also uses get round to.</tspan></text><text x="28" y="1039.0049999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1070.925">Aoede: Have you sorted the photographs yet?</tspan><tspan x="28" y="1107.675">Echo: I finally got around to it yesterday.</tspan><tspan x="28" y="1144.425">Aoede: What made it possible?</tspan><tspan x="28" y="1181.175">Echo: I stopped waiting for a whole free</tspan><tspan x="28" y="1217.925">weekend.</tspan></text><text x="28" y="1272.5249999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1304.445">Explain what finally suggests in I finally got</tspan><tspan x="28" y="1341.195">around to sorting the photographs.</tspan></text></svg>