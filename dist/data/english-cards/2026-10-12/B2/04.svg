<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get around to</title><rect width="660" height="1434" fill="#f1dfcf"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#3d3028" stroke-width="1"/><text x="35" y="43" fill="#3d3028" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-12</tspan></text><text x="35" y="88" fill="#3d3028" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">get around to</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>get around to</title><desc>Original hand-drawn story illustration: path, set within conversation. To finally find the time to do something you intended to do.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-1) scale(1.4)"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><g transform="translate(538 266) rotate(1) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">get around to</text></svg><text x="35" y="514.4" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">To finally find the time to do something you intended to</tspan><tspan x="35" dy="24.839999999999996">do.</tspan></text><text x="35" y="615.6399999999999" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="640.1999999999998" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">I finally got around to organising my photographs.</tspan></text><text x="35" y="692.0399999999998" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="716.5999999999998" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">To is a preposition here, so use a noun or -ing: get</tspan><tspan x="35" dy="24.839999999999996">around to organising the photos.</tspan></text><text x="35" y="793.2799999999997" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="817.8399999999997" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Did you sort out your photos?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. I got around to it last weekend.</tspan><tspan x="35" dy="24.839999999999996">A: What helped you finally begin?</tspan><tspan x="35" dy="24.839999999999996">B: I chose a small group of photos instead of the entire</tspan><tspan x="35" dy="24.839999999999996">collection.</tspan></text><text x="35" y="969.0399999999997" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="993.5999999999997" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: I got around to ____ my photographs. (organise)</tspan></text><text x="35" y="1406" fill="#3d3028" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">PHRASES   /   04 OF 11</tspan></text></svg>