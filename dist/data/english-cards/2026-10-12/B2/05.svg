<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>spread yourself too thin</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">spread yourself too thin</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">To take on so many activities that you cannot</tspan><tspan x="28" y="608.5085">give each enough time or attention.</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="692.1445000000001">overcommit; take on too much</tspan></text><text x="28" y="744.9245000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="775.7805000000001">Taking on four new activities left me spread too</tspan><tspan x="28" y="811.3055">thin.</tspan></text><text x="28" y="864.0855000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="894.9415000000001">Taking on more commitments than you can give</tspan><tspan x="28" y="930.4665000000001">adequate attention to. It concerns limited</tspan><tspan x="28" y="965.9915000000001">capacity, not simply being busy.</tspan></text><text x="28" y="1018.7715000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1049.6275000000003">A: You have promised to run four new activities.</tspan><tspan x="28" y="1085.1525000000004">B: I may be spreading myself too thin.</tspan><tspan x="28" y="1120.6775000000002">A: Which commitment could someone else</tspan><tspan x="28" y="1156.2025000000003">take?</tspan><tspan x="28" y="1191.7275000000004">B: I will ask the group before I agree to anything</tspan><tspan x="28" y="1227.2525000000003">more.</tspan></text><text x="28" y="1280.0325000000003" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1310.8885000000002">Name one practical response to being spread</tspan><tspan x="28" y="1346.4135000000003">too thin.</tspan></text></svg>