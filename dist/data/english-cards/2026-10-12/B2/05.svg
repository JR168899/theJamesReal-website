<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>spread yourself too thin</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar makes time, commitments and priorities visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar makes time, commitments and priorities visible.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">spread yourself too thin</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="583.633">To take on so many activities that you</tspan><tspan x="28" y="621.9580000000001">cannot give each enough time or attention.</tspan></text><text x="28" y="678.898" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="712.186">overcommit; take on too much</tspan></text><text x="28" y="769.1260000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="802.4140000000001">Taking on four new activities left me spread</tspan><tspan x="28" y="840.7390000000001">too thin.</tspan></text><text x="28" y="897.6790000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="930.9670000000001">The expression is informal and often warns</tspan><tspan x="28" y="969.2920000000001">about overcommitment. Change yourself to</tspan><tspan x="28" y="1007.6170000000001">match the subject: I spread myself too thin.</tspan></text><text x="28" y="1064.557" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1097.845">A: Why did you leave one club?</tspan><tspan x="28" y="1136.17">B: I was spreading myself too thin.</tspan><tspan x="28" y="1174.4950000000001">A: Has having fewer commitments helped?</tspan><tspan x="28" y="1212.8200000000002">B: Yes. I can give more attention to the</tspan><tspan x="28" y="1251.145">activities I kept.</tspan></text><text x="28" y="1308.085" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1341.373">What practical problem does this</tspan><tspan x="28" y="1379.698">expression describe?</tspan></text></svg>