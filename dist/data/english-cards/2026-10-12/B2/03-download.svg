<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>set aside</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a budget and checks available money.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a budget and checks available money.</tspan></text><a href="https://www.pexels.com/photo/a-person-writing-on-notebook-using-a-pen-6328972/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6328972</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="477.54">set something aside</tspan><tspan x="28" y="534.465">set aside something</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="626.436">To reserve time, money, or another resource for</tspan><tspan x="28" y="661.086">a particular purpose.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="742.662">reserve; earmark</tspan></text><text x="28" y="794.142" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="824.238">I set aside twenty minutes to read without</tspan><tspan x="28" y="858.888">interruptions.</tspan></text><text x="28" y="910.368" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="940.464">Separable: set aside the time / set the time</tspan><tspan x="28" y="975.114">aside; set it aside. State what the reserved</tspan><tspan x="28" y="1009.7640000000001">resource is for.</tspan></text><text x="28" y="1061.244" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1091.34">Aoede: When will you prepare the talk?</tspan><tspan x="28" y="1125.99">Echo: I have set aside twenty minutes this</tspan><tspan x="28" y="1160.6399999999999">afternoon.</tspan><tspan x="28" y="1195.29">Aoede: Will messages interrupt you?</tspan><tspan x="28" y="1229.94">Echo: I will silence them for that period.</tspan></text><text x="28" y="1281.4199999999998" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1311.5159999999998">Reserve a specific amount of time for a task</tspan><tspan x="28" y="1346.166">using set aside. (Model: I will set aside twenty</tspan><tspan x="28" y="1380.8159999999998">minutes this afternoon to prepare the talk.)</tspan></text></svg>