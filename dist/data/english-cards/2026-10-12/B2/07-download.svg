<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I want my schedule to reflect what matters to me.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A clock makes the passage of time visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A clock makes the passage of time visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-on-hands-of-clock-13151698/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13151698</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#2d382e"><tspan x="28" y="472.94">I want my schedule to reflect</tspan><tspan x="28" y="524.115">what matters to me.</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="606.7959999999999">A way to say that your use of time should show your</tspan><tspan x="28" y="637.9459999999999">personal values.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="711.2819999999999">I want to make time for my priorities.; My timetable</tspan><tspan x="28" y="742.4319999999999">should express my values.</tspan></text><text x="28" y="788.712" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="815.7679999999999">I want my schedule to reflect what matters to me,</tspan><tspan x="28" y="846.9179999999999">even in small ways.</tspan></text><text x="28" y="893.198" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="920.2539999999999">Reflect means show or express here. Link the value</tspan><tspan x="28" y="951.4039999999999">to an actual allocation of time rather than only an</tspan><tspan x="28" y="982.5539999999999">aspiration.</tspan></text><text x="28" y="1028.834" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="1055.89">Aoede: Your calendar is full, but you sound</tspan><tspan x="28" y="1087.0400000000002">dissatisfied.</tspan><tspan x="28" y="1118.19">Echo: I want my schedule to reflect what matters to</tspan><tspan x="28" y="1149.3400000000001">me.</tspan><tspan x="28" y="1180.4900000000002">Aoede: What is missing?</tspan><tspan x="28" y="1211.64">Echo: Time with my sister. I keep treating it as</tspan><tspan x="28" y="1242.7900000000002">optional.</tspan></text><text x="28" y="1289.0700000000002" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="1316.1260000000002">Name one calendar change that makes a stated</tspan><tspan x="28" y="1347.2760000000003">priority visible in practice. (Model: Reserve a regular</tspan><tspan x="28" y="1378.4260000000002">time to see the person you say matters to you.)</tspan></text></svg>