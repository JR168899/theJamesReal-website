<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I want my schedule to reflect what matters to me.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="43.93000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="475.93">I want my schedule to reflect</tspan><tspan x="28" y="530.8425">what matters to me.</tspan></text><text x="28" y="590.53" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="619.562">A way to say that your use of time should show</tspan><tspan x="28" y="652.987">your personal values.</tspan></text><text x="28" y="702.6469999999999" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="731.679">I want to make time for my priorities.; My</tspan><tspan x="28" y="765.1039999999999">timetable should express my values.</tspan></text><text x="28" y="814.7639999999999" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="843.7959999999999">I want my schedule to reflect what matters to me,</tspan><tspan x="28" y="877.2209999999999">even in small ways.</tspan></text><text x="28" y="926.8809999999999" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="955.9129999999999">Reflect here means express or represent. What</tspan><tspan x="28" y="989.3379999999999">matters to me is a noun clause meaning what I</tspan><tspan x="28" y="1022.7629999999999">consider important.</tspan></text><text x="28" y="1072.4229999999998" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1101.4549999999997">A: Why did you reserve Friday evenings?</tspan><tspan x="28" y="1134.8799999999997">B: I want my schedule to reflect what matters to</tspan><tspan x="28" y="1168.3049999999996">me.</tspan><tspan x="28" y="1201.7299999999998">A: What will you use those evenings for?</tspan><tspan x="28" y="1235.1549999999997">B: Spending time with my family and reading</tspan><tspan x="28" y="1268.5799999999997">without rushing.</tspan></text><text x="28" y="1318.2399999999998" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1347.2719999999997">Paraphrase “reflect what matters to me”. (Model:</tspan><tspan x="28" y="1380.6969999999997">Show what I consider important.)</tspan></text></svg>