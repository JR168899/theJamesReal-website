<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Present perfect continuous</title><rect width="660" height="1434" fill="#e7dfec"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382f40" stroke-width="1"/><text x="35" y="43" fill="#382f40" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-12</tspan></text><text x="35" y="88" fill="#382f40" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">Present perfect continuous</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>Present perfect continuous</title><desc>Original hand-drawn story illustration: notebook, set within conversation. Use have or has been + -ing for an activity continuing from the past to now, or a recent activity with a present result.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><g transform="translate(94 266) rotate(-1) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Present perfect continuous</text></svg><text x="35" y="514.4" fill="#382f40" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#382f40" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Use have or has been + -ing for an activity continuing</tspan><tspan x="35" dy="24.839999999999996">from the past to now, or a recent activity with a present</tspan><tspan x="35" dy="24.839999999999996">result.</tspan></text><text x="35" y="640.4799999999999" fill="#382f40" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="665.0399999999998" fill="#382f40" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">I have been trying to leave more space between</tspan><tspan x="35" dy="24.839999999999996">appointments.</tspan></text><text x="35" y="741.7199999999998" fill="#382f40" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="766.2799999999997" fill="#382f40" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">I have been reading focuses on the activity. I have read</tspan><tspan x="35" dy="24.839999999999996">the book often presents it as completed. Avoid the</tspan><tspan x="35" dy="24.839999999999996">continuous with most stative verbs.</tspan></text><text x="35" y="867.7999999999997" fill="#382f40" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="892.3599999999997" fill="#382f40" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Why do your afternoons feel different?</tspan><tspan x="35" dy="24.839999999999996">B: I have been scheduling fewer meetings.</tspan><tspan x="35" dy="24.839999999999996">A: Has the change helped?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. I have more time to finish one task before</tspan><tspan x="35" dy="24.839999999999996">starting another.</tspan></text><text x="35" y="1043.5599999999997" fill="#382f40" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1068.1199999999997" fill="#382f40" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: She has been ____ more time for drawing. (make)</tspan></text><text x="35" y="1406" fill="#382f40" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">GRAMMAR   /   09 OF 11</tspan></text></svg>