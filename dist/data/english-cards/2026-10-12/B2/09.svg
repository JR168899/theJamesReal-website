<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Present perfect continuous</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives hands-on care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives hands-on care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#382f40"><tspan x="28" y="478.46">Present perfect continuous</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#382f40"><tspan x="28" y="572.2889999999999">Use have or has been + -ing for an activity</tspan><tspan x="28" y="607.6389999999999">continuing from the past to now, or a recent</tspan><tspan x="28" y="642.9889999999999">activity with a present result.</tspan></text><text x="28" y="695.5089999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#382f40"><tspan x="28" y="726.2129999999999">I have been trying to leave more space</tspan><tspan x="28" y="761.5629999999999">between appointments.</tspan></text><text x="28" y="814.083" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#382f40"><tspan x="28" y="844.7869999999999">Have/has been + -ing can describe an activity</tspan><tspan x="28" y="880.137">continuing to now. Since introduces a starting</tspan><tspan x="28" y="915.487">point; for introduces a duration.</tspan></text><text x="28" y="968.007" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#382f40"><tspan x="28" y="998.7109999999999">A: How long have you been keeping these</tspan><tspan x="28" y="1034.061">garden notes?</tspan><tspan x="28" y="1069.4109999999998">B: I have been recording the changes since</tspan><tspan x="28" y="1104.761">March.</tspan><tspan x="28" y="1140.1109999999999">A: Every day?</tspan><tspan x="28" y="1175.4609999999998">B: Most days, especially when new leaves</tspan><tspan x="28" y="1210.811">appear.</tspan></text><text x="28" y="1263.3310000000001" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#382f40"><tspan x="28" y="1294.035">Complete with since or for: I have been</tspan><tspan x="28" y="1329.385">recording changes ___ March and ___ several</tspan><tspan x="28" y="1364.7350000000001">months.</tspan></text></svg>