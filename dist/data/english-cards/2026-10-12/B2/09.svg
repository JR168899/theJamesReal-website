<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Present perfect continuous</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives water and care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives water and care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#382f40"><tspan x="28" y="479.84000000000003">Present perfect</tspan><tspan x="28" y="539.64">continuous</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382f40"><tspan x="28" y="636.256">Use have or has been + -ing for an activity</tspan><tspan x="28" y="672.656">continuing from the past to now, or a recent</tspan><tspan x="28" y="709.0559999999999">activity with a present result.</tspan></text><text x="28" y="763.136" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382f40"><tspan x="28" y="794.752">I have been trying to leave more space</tspan><tspan x="28" y="831.1519999999999">between appointments.</tspan></text><text x="28" y="885.232" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382f40"><tspan x="28" y="916.848">I have been reading focuses on the activity. I</tspan><tspan x="28" y="953.2479999999999">have read the book often presents it as</tspan><tspan x="28" y="989.6479999999999">completed. Avoid the continuous with most</tspan><tspan x="28" y="1026.048">stative verbs.</tspan></text><text x="28" y="1080.1280000000002" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382f40"><tspan x="28" y="1111.744">A: Why do your afternoons feel different?</tspan><tspan x="28" y="1148.144">B: I have been scheduling fewer meetings.</tspan><tspan x="28" y="1184.5439999999999">A: Has the change helped?</tspan><tspan x="28" y="1220.944">B: Yes. I have more time to finish one task</tspan><tspan x="28" y="1257.3439999999998">before starting another.</tspan></text><text x="28" y="1311.4240000000002" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#382f40"><tspan x="28" y="1343.04">Complete: She has been ____ more time for</tspan><tspan x="28" y="1379.44">drawing. (make)</tspan></text></svg>