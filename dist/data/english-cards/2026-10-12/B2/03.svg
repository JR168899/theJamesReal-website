<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>set aside</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a budget and checks available money.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a budget and checks available money.</tspan></text><a href="https://www.pexels.com/photo/a-person-writing-on-notebook-using-a-pen-6328972/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6328972</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="479.15">set something aside</tspan><tspan x="28" y="538.0875">set aside something</tspan></text><text x="28" y="602.15" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="633.3100000000001">To reserve time, money, or another resource</tspan><tspan x="28" y="669.1850000000001">for a particular purpose.</tspan></text><text x="28" y="722.485" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="753.6450000000001">reserve; earmark</tspan></text><text x="28" y="806.945" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="838.1050000000001">I set aside twenty minutes to read without</tspan><tspan x="28" y="873.9800000000001">interruptions.</tspan></text><text x="28" y="927.2800000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="958.4400000000002">Separable: set aside the time / set the time</tspan><tspan x="28" y="994.3150000000002">aside; set it aside. State what the reserved</tspan><tspan x="28" y="1030.1900000000003">resource is for.</tspan></text><text x="28" y="1083.4900000000002" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1114.65">A: When will you prepare the talk?</tspan><tspan x="28" y="1150.525">B: I have set aside twenty minutes this</tspan><tspan x="28" y="1186.4">afternoon.</tspan><tspan x="28" y="1222.275">A: Will messages interrupt you?</tspan><tspan x="28" y="1258.15">B: I will silence them for that period.</tspan></text><text x="28" y="1311.4500000000003" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1342.6100000000001">Reserve a specific amount of time for a task</tspan><tspan x="28" y="1378.4850000000001">using set aside.</tspan></text></svg>