<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>deliberate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="474.32">deliberate</tspan></text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="510.65999999999997">US /dɪˈlɪbərət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.240000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="536.5672">Adjective: deliberate; related noun: deliberation</tspan></text><text x="28" y="587.94" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="615.908">Done intentionally and with thought, rather than by</tspan><tspan x="28" y="648.1080000000001">accident.</tspan></text><text x="28" y="695.9480000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="723.916">intentional; considered · Intentional means not</tspan><tspan x="28" y="756.1160000000001">accidental; considered also suggests careful thought.</tspan></text><text x="28" y="803.9560000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="831.9240000000001">Leaving my phone in another room was a deliberate</tspan><tspan x="28" y="864.1240000000001">choice.</tspan></text><text x="28" y="911.9640000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="939.9320000000001">Here deliberate is an adjective. Its final syllable is</tspan><tspan x="28" y="972.1320000000002">weak; the verb deliberate has a different</tspan><tspan x="28" y="1004.3320000000001">pronunciation and means consider carefully.</tspan></text><text x="28" y="1052.1720000000003" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1080.1400000000003">Aoede: You have turned off the notifications.</tspan><tspan x="28" y="1112.3400000000004">Echo: It was a deliberate choice, not a fault with the</tspan><tspan x="28" y="1144.5400000000004">phone.</tspan><tspan x="28" y="1176.7400000000002">Aoede: What are you hoping to change?</tspan><tspan x="28" y="1208.9400000000003">Echo: I want to finish one piece of work without</tspan><tspan x="28" y="1241.1400000000003">checking messages.</tspan></text><text x="28" y="1288.9800000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1316.9480000000003">Distinguish a deliberate choice from an accidental</tspan><tspan x="28" y="1349.1480000000004">change in phone settings. (Model: A deliberate</tspan><tspan x="28" y="1381.3480000000004">choice is made intentionally for a reason.)</tspan></text></svg>