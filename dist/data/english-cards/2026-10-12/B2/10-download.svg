<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been a welcome change of pace for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A gardener waters a plant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A gardener waters a plant.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-person-watering-a-potted-plant-with-spray-bottle-5622461/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622461</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#353331"><tspan x="28" y="473.4">What has been a welcome</tspan><tspan x="28" y="525.15">change of pace for you?</tspan></text><text x="28" y="581.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="608.76">An opening that invites a personal preference or</tspan><tspan x="28" y="640.26">experience without assuming everyone shares it.</tspan></text><text x="28" y="687.06" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="714.4200000000001">What has been a welcome change of pace for you?</tspan></text><text x="28" y="761.2199999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="788.5799999999999">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="820.0799999999999">different preference or a declined invitation without</tspan><tspan x="28" y="851.5799999999999">asking the person to justify it.</tspan></text><text x="28" y="898.38" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="925.74">Aoede: What has been a welcome change of pace</tspan><tspan x="28" y="957.24">lately?</tspan><tspan x="28" y="988.74">Echo: Helping in the garden after a week of desk</tspan><tspan x="28" y="1020.24">work.</tspan><tspan x="28" y="1051.74">Aoede: Was it the activity or the company that</tspan><tspan x="28" y="1083.24">mattered?</tspan><tspan x="28" y="1114.74">Echo: A bit of both. I stopped watching the clock.</tspan><tspan x="28" y="1146.24">Aoede: Would you make it a regular commitment?</tspan><tspan x="28" y="1177.74">Echo: Perhaps, but I would like to keep some of that</tspan><tspan x="28" y="1209.24">openness.</tspan></text><text x="28" y="1258.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1285.76">A friend enjoys an activity because it feels</tspan><tspan x="28" y="1317.26">open-ended. Ask about repeating it without imposing</tspan><tspan x="28" y="1348.76">a target. (Model: Would you enjoy doing it again when</tspan><tspan x="28" y="1380.26">you have the chance?)</tspan></text></svg>