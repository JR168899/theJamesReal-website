<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been a welcome change of pace for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">What has been a welcome</tspan><tspan x="28" y="535.5">change of pace for you?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">A question inviting someone to describe a</tspan><tspan x="28" y="663.4">recent activity that felt different and welcome.</tspan></text><text x="28" y="715.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="745.8">What has been a welcome change of pace for</tspan><tspan x="28" y="780.8">you recently?</tspan></text><text x="28" y="832.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="863.1999999999999">The present perfect connects the experience to</tspan><tspan x="28" y="898.1999999999999">the present. Follow up on what made the</tspan><tspan x="28" y="933.1999999999999">change enjoyable.</tspan></text><text x="28" y="985.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1015.5999999999999">A: What has been a welcome change of pace</tspan><tspan x="28" y="1050.6">for you?</tspan><tspan x="28" y="1085.6">B: Taking a beginner’s pottery class. It feels</tspan><tspan x="28" y="1120.6">good to make something slowly.</tspan><tspan x="28" y="1155.6">A: Is the pace different from your usual work?</tspan><tspan x="28" y="1190.6">B: Very different. I have to pay attention to the</tspan><tspan x="28" y="1225.6">material itself.</tspan></text><text x="28" y="1277.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1308.0">Ask a follow-up that explores the experience.</tspan><tspan x="28" y="1343.0">(Model: What do you enjoy most about working</tspan><tspan x="28" y="1378.0">with clay?)</tspan></text></svg>