<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been a welcome change of pace for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>What has been a welcome change of pace for you?</title><desc>Original family-manga illustration: path, related to What has been a welcome change of pace for you?.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">What has been a welcome</tspan><tspan x="28" y="535.5">change of pace for you?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">A question inviting someone to describe a</tspan><tspan x="28" y="663.4">recent activity that felt different and welcome.</tspan></text><text x="28" y="715.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="745.8">What has been a welcome change of pace for</tspan><tspan x="28" y="780.8">you recently?</tspan></text><text x="28" y="832.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="863.1999999999999">The present perfect connects the experience to</tspan><tspan x="28" y="898.1999999999999">the present. Follow up on what made the</tspan><tspan x="28" y="933.1999999999999">change enjoyable.</tspan></text><text x="28" y="985.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1015.5999999999999">A: What has been a welcome change of pace</tspan><tspan x="28" y="1050.6">for you?</tspan><tspan x="28" y="1085.6">B: Taking a beginner’s pottery class. It feels</tspan><tspan x="28" y="1120.6">good to make something slowly.</tspan><tspan x="28" y="1155.6">A: Is the pace different from your usual work?</tspan><tspan x="28" y="1190.6">B: Very different. I have to pay attention to the</tspan><tspan x="28" y="1225.6">material itself.</tspan></text><text x="28" y="1277.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1308.0">Ask a follow-up that explores the experience.</tspan><tspan x="28" y="1343.0">(Model: What do you enjoy most about working</tspan><tspan x="28" y="1378.0">with clay?)</tspan></text></svg>