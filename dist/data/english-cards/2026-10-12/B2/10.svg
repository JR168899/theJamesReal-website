<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been a welcome change of pace for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#353331"><tspan x="28" y="480.3">What has been a welcome</tspan><tspan x="28" y="540.6750000000001">change of pace for you?</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="638.22">A question inviting someone to describe a</tspan><tspan x="28" y="674.97">recent activity that felt different and welcome.</tspan></text><text x="28" y="729.5699999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="761.49">What has been a welcome change of pace for</tspan><tspan x="28" y="798.24">you recently?</tspan></text><text x="28" y="852.8399999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="884.76">The present perfect connects the experience</tspan><tspan x="28" y="921.51">to the present. Follow up on what made the</tspan><tspan x="28" y="958.26">change enjoyable.</tspan></text><text x="28" y="1012.8599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1044.78">A: What has been a welcome change of pace</tspan><tspan x="28" y="1081.53">for you?</tspan><tspan x="28" y="1118.28">B: Taking a beginner’s pottery class. It feels</tspan><tspan x="28" y="1155.03">good to make something slowly.</tspan><tspan x="28" y="1191.78">A: Is the pace different from your usual work?</tspan><tspan x="28" y="1228.53">B: Very different. I have to pay attention to the</tspan><tspan x="28" y="1265.28">material itself.</tspan></text><text x="28" y="1319.8799999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1351.8">Ask a follow-up that explores the experience.</tspan></text></svg>