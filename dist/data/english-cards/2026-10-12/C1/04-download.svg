<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>carve out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar makes time, commitments and priorities visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar makes time, commitments and priorities visible.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="477.54">carve something out</tspan><tspan x="28" y="534.465">carve out something</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="626.436">To secure time, space, or an opportunity</tspan><tspan x="28" y="661.086">despite competing demands.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="742.662">create space for; secure</tspan></text><text x="28" y="794.142" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="824.238">She carved out a quiet hour for her writing.</tspan></text><text x="28" y="875.7180000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="905.8140000000001">Carve out time for something suggests effort in</tspan><tspan x="28" y="940.464">protecting a limited resource. With a pronoun,</tspan><tspan x="28" y="975.114">say carve it out.</tspan></text><text x="28" y="1026.594" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1056.69">A: How do you keep your creative work going?</tspan><tspan x="28" y="1091.3400000000001">B: I carve out a little time before the day</tspan><tspan x="28" y="1125.99">becomes busy.</tspan><tspan x="28" y="1160.64">A: How do you protect that time?</tspan><tspan x="28" y="1195.29">B: I keep the commitment small enough to</tspan><tspan x="28" y="1229.94">sustain.</tspan></text><text x="28" y="1281.42" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1311.516">Rewrite using “carve out”: She made time for</tspan><tspan x="28" y="1346.1660000000002">reflection. (Model: She carved out time for</tspan><tspan x="28" y="1380.816">reflection.)</tspan></text></svg>