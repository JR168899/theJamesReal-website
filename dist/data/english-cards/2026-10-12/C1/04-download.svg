ne"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.93" font-weight="700" fill="#3d3028"><tspan x="28" y="475.93">carve something out</tspan><tspan x="28" y="530.8425">carve out something</tspan></text><text x="28" y="590.53" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="619.562">To secure time, space, or an opportunity despite</tspan><tspan x="28" y="652.987">competing demands.</tspan></text><text x="28" y="702.6469999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="731.679">To secure time, space, or an opportunity despite</tspan><tspan x="28" y="765.1039999999999">competing demands</tspan></text><text x="28" y="814.7639999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="843.7959999999999">She carved out a quiet hour for her writing.</tspan></text><text x="28" y="893.4559999999999" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="922.4879999999999">Carve out time for something suggests effort in</tspan><tspan x="28" y="955.9129999999999">protecting a limited resource. With a pronoun, say</tspan><tspan x="28" y="989.338">carve it out.</tspan></text><text x="28" y="1038.998" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="1068.03">A: How do you keep your creative work going?</tspan><tspan x="28" y="1101.455">B: I carve out a little time before the day becomes</tspan><tspan x="28" y="1134.8799999999999">busy.</tspan><tspan x="28" y="1168.305">A: How do you protect that time?</tspan><tspan x="28" y="1201.73">B: I keep the commitment small enough to</tspan><tspan x="28" y="1235.155">sustain.</tspan></text><text x="28" y="1284.8149999999998" font-family="Arial, sans-serif" font-size="15.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.74" font-weight="400" fill="#3d3028"><tspan x="28" y="1313.8469999999998">Rewrite using “carve out”: She made time for</tspan><tspan x="28" y="1347.2719999999997">reflection. (Model: She carved out time for</tspan><tspan x="28" y="1380.6969999999997">reflection.)</tspan></text></svg>