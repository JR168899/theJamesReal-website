<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Which part of your routine feels most like a choice?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#353331"><tspan x="28" y="473.4">Which part of your routine</tspan><tspan x="28" y="525.15">feels most like a choice?</tspan></text><text x="28" y="581.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="608.76">An opening that invites a personal preference or</tspan><tspan x="28" y="640.26">experience without assuming everyone shares it.</tspan></text><text x="28" y="687.06" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="714.4200000000001">Which part of your routine feels most like a choice?</tspan></text><text x="28" y="761.2199999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="788.5799999999999">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="820.0799999999999">different preference or a declined invitation without</tspan><tspan x="28" y="851.5799999999999">asking the person to justify it.</tspan></text><text x="28" y="898.38" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="925.74">Kore: Which part of your routine feels most like a</tspan><tspan x="28" y="957.24">choice?</tspan><tspan x="28" y="988.74">Onyx: The walk I take before going home.</tspan><tspan x="28" y="1020.24">Kore: What makes it different from the rest of the</tspan><tspan x="28" y="1051.74">day?</tspan><tspan x="28" y="1083.24">Onyx: I do not measure it or use it to finish another</tspan><tspan x="28" y="1114.74">task.</tspan><tspan x="28" y="1146.24">Kore: Would fixing a target improve it?</tspan><tspan x="28" y="1177.74">Onyx: For me, that might remove what I value about</tspan><tspan x="28" y="1209.24">it.</tspan></text><text x="28" y="1258.4" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1285.76">Someone values an unmeasured walk. Respond</tspan><tspan x="28" y="1317.26">without turning it into another goal. (Model: It sounds</tspan><tspan x="28" y="1348.76">as though the freedom is part of what makes it</tspan><tspan x="28" y="1380.26">worthwhile.)</tspan></text></svg>