<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Which part of your routine feels most like a choice?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">Which part of your routine</tspan><tspan x="28" y="533.43">feels most like a choice?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">A reflective question about which regular activity</tspan><tspan x="28" y="658.772">feels consciously chosen rather than automatic.</tspan></text><text x="28" y="709.732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="739.5240000000001">Which part of your routine feels most like a</tspan><tspan x="28" y="773.8240000000001">choice?</tspan></text><text x="28" y="824.784" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="854.5760000000001">The phrase most like a choice invites</tspan><tspan x="28" y="888.8760000000001">interpretation. It does not imply that habits and</tspan><tspan x="28" y="923.1760000000002">choices are mutually exclusive.</tspan></text><text x="28" y="974.136" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1003.9280000000001">A: Which part of your routine feels most like a</tspan><tspan x="28" y="1038.228">choice?</tspan><tspan x="28" y="1072.528">B: Walking home by the river. I could take a</tspan><tspan x="28" y="1106.8280000000002">faster route, but I enjoy the extra time.</tspan><tspan x="28" y="1141.1280000000002">A: What does the slower route give you?</tspan><tspan x="28" y="1175.428">B: A sense that the day includes something</tspan><tspan x="28" y="1209.728">chosen for its own sake.</tspan></text><text x="28" y="1260.688" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1290.48">Ask a follow-up about the value behind that</tspan><tspan x="28" y="1324.78">choice. (Model: What does that extra time by the</tspan><tspan x="28" y="1359.08">river give you?)</tspan></text></svg>