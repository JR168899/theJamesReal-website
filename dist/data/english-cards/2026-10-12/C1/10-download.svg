<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Which part of your routine feels most like a choice?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">Which part of your routine</tspan><tspan x="28" y="525.6675">feels most like a choice?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">Which part of your routine feels most like a choice?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="822.236">different preference or a declined invitation without</tspan><tspan x="28" y="853.9110000000001">asking the person to justify it.</tspan></text><text x="28" y="900.971" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="928.4830000000001">A: Which part of your routine feels most like a</tspan><tspan x="28" y="960.158">choice?</tspan><tspan x="28" y="991.8330000000001">B: The walk I take before going home.</tspan><tspan x="28" y="1023.508">A: What makes it different from the rest of the day?</tspan><tspan x="28" y="1055.183">B: I do not measure it or use it to finish another task.</tspan><tspan x="28" y="1086.8580000000002">A: Would fixing a target improve it?</tspan><tspan x="28" y="1118.5330000000001">B: For me, that might remove what I value about it.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Someone values an unmeasured walk. Respond</tspan><tspan x="28" y="1317.667">without turning it into another goal. (Model: It sounds</tspan><tspan x="28" y="1349.3419999999999">as though the freedom is part of what makes it</tspan><tspan x="28" y="1381.017">worthwhile.)</tspan></text></svg>