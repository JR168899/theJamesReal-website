<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>friction</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">friction</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /ˈfrɪkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Usually uncountable: friction; no regular plural in this sense.</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">Resistance or difficulty that makes an action harder to</tspan><tspan x="28" y="636.3630000000002">begin or complete.</tspan></text><text x="28" y="681.6030000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="708.0510000000002">resistance; difficulty · These fit the figurative sense of</tspan><tspan x="28" y="738.5010000000002">obstacles to starting or continuing an activity.</tspan></text><text x="28" y="783.7410000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="810.1890000000002">Keeping materials within reach reduces the friction of</tspan><tspan x="28" y="840.6390000000002">getting started.</tspan></text><text x="28" y="885.8790000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="912.3270000000002">Figurative in a discussion of habits: effort or</tspan><tspan x="28" y="942.7770000000003">inconvenience affecting an action, rather than physical</tspan><tspan x="28" y="973.2270000000002">resistance between surfaces.</tspan></text><text x="28" y="1018.4670000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1044.9150000000002">Kore: Why leave the book on the desk before breakfast?</tspan><tspan x="28" y="1075.3650000000002">Onyx: It reduces the friction involved in starting to read.</tspan><tspan x="28" y="1105.8150000000003">Kore: And moving the phone away adds friction to</tspan><tspan x="28" y="1136.265">checking it?</tspan><tspan x="28" y="1166.7150000000001">Onyx: Exactly. The arrangement makes one action</tspan><tspan x="28" y="1197.1650000000002">easier and another less automatic.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.368">In a discussion of habits, explain friction without referring</tspan><tspan x="28" y="1314.818">to a physical force. (Model: It is the effort or</tspan><tspan x="28" y="1345.268">inconvenience that makes an action harder to begin or</tspan><tspan x="28" y="1375.7179999999998">repeat.)</tspan></text></svg>