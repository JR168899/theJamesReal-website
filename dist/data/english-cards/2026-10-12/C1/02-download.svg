<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>friction</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>friction</title><desc>Original family-manga illustration: magnifier, related to friction.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">friction</tspan></text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˈfrɪkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.79" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Form: friction (usually uncountable)</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">Resistance or difficulty that makes an action harder</tspan><tspan x="28" y="653.9805000000001">to begin or complete.</tspan></text><text x="28" y="703.1205" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="731.8485000000001">resistance; difficulty · These fit the figurative sense of</tspan><tspan x="28" y="764.9235000000001">obstacles to starting or continuing an activity.</tspan></text><text x="28" y="814.0635" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="842.7915">Keeping materials within reach reduces the friction of</tspan><tspan x="28" y="875.8665000000001">getting started.</tspan></text><text x="28" y="925.0065" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="953.7345">This is a figurative use. Reducing friction means</tspan><tspan x="28" y="986.8095000000001">removing obstacles, not necessarily removing every</tspan><tspan x="28" y="1019.8845">effort involved in an activity.</tspan></text><text x="28" y="1069.0244999999998" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="1097.7524999999998">A: Why leave the sketchbook open?</tspan><tspan x="28" y="1130.8274999999999">B: It reduces the friction of beginning.</tspan><tspan x="28" y="1163.9025">A: Does that remove the need for effort?</tspan><tspan x="28" y="1196.9774999999997">B: No, but it makes the first action less demanding.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Give an example of reducing friction for reading.</tspan><tspan x="28" y="1320.923">(Model: Keeping a book beside your usual chair can</tspan><tspan x="28" y="1353.998">reduce the friction of starting.)</tspan></text></svg>