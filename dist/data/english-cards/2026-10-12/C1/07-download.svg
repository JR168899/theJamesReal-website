<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The aim is to make the valued choice easier to repeat.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader follows the printed text in an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader follows the printed text in an open book.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-an-open-book-with-sunlight-36324703/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 36324703</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2d382e"><tspan x="28" y="472.02">The aim is to make the valued</tspan><tspan x="28" y="522.045">choice easier to repeat.</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="602.868">A statement that the goal is to help someone repeat an</tspan><tspan x="28" y="633.3180000000001">action they already consider worthwhile.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="705.0060000000001">The goal is to support a worthwhile habit.; We want the</tspan><tspan x="28" y="735.4560000000001">desired action to become more accessible.</tspan></text><text x="28" y="780.696" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="807.1440000000001">The aim is to make the valued choice easier to repeat,</tspan><tspan x="28" y="837.5940000000002">not to perfect every minute.</tspan></text><text x="28" y="882.8340000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="909.2820000000002">Valued means regarded as worthwhile. Making a choice</tspan><tspan x="28" y="939.7320000000002">easier should support agency, not remove the ability to</tspan><tspan x="28" y="970.1820000000001">choose otherwise.</tspan></text><text x="28" y="1015.4220000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1041.8700000000001">A: Why leave the book beside the kettle?</tspan><tspan x="28" y="1072.3200000000002">B: The aim is to make the valued choice easier to repeat.</tspan><tspan x="28" y="1102.7700000000002">A: So you are changing the setting rather than</tspan><tspan x="28" y="1133.22">demanding more willpower?</tspan><tspan x="28" y="1163.67">B: Exactly. The cue helps me begin reading while the</tspan><tspan x="28" y="1194.1200000000001">water heats.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1284.368">Suggest one environmental change that makes a valued</tspan><tspan x="28" y="1314.818">reading habit easier to repeat. (Model: Leave a book</tspan><tspan x="28" y="1345.268">where the routine already pauses, such as beside the</tspan><tspan x="28" y="1375.7179999999998">kettle.)</tspan></text></svg>