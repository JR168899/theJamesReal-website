<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The aim is to make the valued choice easier to repeat.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - Life phrases</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#2d382e">2026-10-12 · C1 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>The aim is to make the valued choice easier to repeat.</title><desc>Original family-manga illustration: scales, related to The aim is to make the valued choice easier to repeat..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-60V59M-45 64H45M-63-34H63M-48-34L-70 18H-24ZM48-34L24 18H70Z" fill="#d9bf85"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="42.32" font-weight="700" fill="#2d382e"><tspan x="28" y="474.32">The aim is to make the valued</tspan><tspan x="28" y="527.22">choice easier to repeat.</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="612.688">A statement that the goal is to help someone repeat</tspan><tspan x="28" y="644.888">an action they already consider worthwhile.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="720.696">A statement that the goal is to help someone repeat</tspan><tspan x="28" y="752.8960000000001">an action they already consider worthwhile</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="828.7040000000001">The aim is to make the valued choice easier to</tspan><tspan x="28" y="860.9040000000001">repeat, not to perfect every minute.</tspan></text><text x="28" y="908.7440000000001" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="936.7120000000001">Valued identifies the action&#x27;s significance to the</tspan><tspan x="28" y="968.9120000000001">person. Easier to repeat concerns its conditions, not</tspan><tspan x="28" y="1001.1120000000001">a demand for perfect consistency.</tspan></text><text x="28" y="1048.9520000000002" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="1076.9200000000003">A: Why place your guitar beside the sofa?</tspan><tspan x="28" y="1109.1200000000003">B: The aim is to make the valued choice easier to</tspan><tspan x="28" y="1141.3200000000004">repeat.</tspan><tspan x="28" y="1173.5200000000002">A: Does the arrangement work on difficult days?</tspan><tspan x="28" y="1205.7200000000003">B: It helps, but I also allow the routine to change.</tspan></text><text x="28" y="1258.72" font-family="Arial, sans-serif" font-size="14.72" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.76" font-weight="400" fill="#2d382e"><tspan x="28" y="1286.688">Explain this aim using a specific example. (Model:</tspan><tspan x="28" y="1318.8880000000001">Keeping art supplies ready makes it easier to choose</tspan><tspan x="28" y="1351.0880000000002">drawing again.)</tspan></text></svg>