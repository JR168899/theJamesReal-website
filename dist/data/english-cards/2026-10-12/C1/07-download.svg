<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The aim is to make the valued choice easier to repeat.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written list makes tasks and priorities visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written list makes tasks and priorities visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="474.32">The aim is to make the valued</tspan><tspan x="28" y="527.22">choice easier to repeat.</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="612.688">A statement that the goal is to help someone repeat</tspan><tspan x="28" y="644.888">an action they already consider worthwhile.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="720.696">The goal is to support a worthwhile habit.; We want</tspan><tspan x="28" y="752.8960000000001">the desired action to become more accessible.</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="828.7040000000001">The aim is to make the valued choice easier to</tspan><tspan x="28" y="860.9040000000001">repeat, not to perfect every minute.</tspan></text><text x="28" y="908.7440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="936.7120000000001">Valued identifies the action&#x27;s significance to the</tspan><tspan x="28" y="968.9120000000001">person. Easier to repeat concerns its conditions, not</tspan><tspan x="28" y="1001.1120000000001">a demand for perfect consistency.</tspan></text><text x="28" y="1048.9520000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1076.9200000000003">A: Why place your guitar beside the sofa?</tspan><tspan x="28" y="1109.1200000000003">B: The aim is to make the valued choice easier to</tspan><tspan x="28" y="1141.3200000000004">repeat.</tspan><tspan x="28" y="1173.5200000000002">A: Does the arrangement work on difficult days?</tspan><tspan x="28" y="1205.7200000000003">B: It helps, but I also allow the routine to change.</tspan></text><text x="28" y="1258.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1286.688">Explain this aim using a specific example. (Model:</tspan><tspan x="28" y="1318.8880000000001">Keeping art supplies ready makes it easier to choose</tspan><tspan x="28" y="1351.0880000000002">drawing again.)</tspan></text></svg>