<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The aim is to make the valued choice easier to repeat.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader follows the printed text in an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader follows the printed text in an open book.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-an-open-book-with-sunlight-36324703/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 36324703</text></a></svg><text font-family="Arial, sans-serif" font-size="39.56" font-weight="700" fill="#2d382e"><tspan x="28" y="471.56">The aim is to make the valued</tspan><tspan x="28" y="521.01">choice easier to repeat.</tspan></text><text x="28" y="574.76" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="600.904">A statement that the goal is to help someone repeat an</tspan><tspan x="28" y="631.004">action they already consider worthwhile.</tspan></text><text x="28" y="675.724" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="701.868">The goal is to support a worthwhile habit.; We want the</tspan><tspan x="28" y="731.9680000000001">desired action to become more accessible.</tspan></text><text x="28" y="776.6880000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="802.8320000000001">The aim is to make the valued choice easier to repeat,</tspan><tspan x="28" y="832.9320000000001">not to perfect every minute.</tspan></text><text x="28" y="877.6520000000002" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="903.7960000000002">Valued means regarded as worthwhile. Making a choice</tspan><tspan x="28" y="933.8960000000002">easier should support agency, not remove the ability to</tspan><tspan x="28" y="963.9960000000002">choose otherwise.</tspan></text><text x="28" y="1008.7160000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1034.8600000000001">Kore: Why leave the book beside the kettle?</tspan><tspan x="28" y="1064.96">Onyx: The aim is to make the valued choice easier to</tspan><tspan x="28" y="1095.0600000000002">repeat.</tspan><tspan x="28" y="1125.16">Kore: So you are changing the setting rather than</tspan><tspan x="28" y="1155.2600000000002">demanding more willpower?</tspan><tspan x="28" y="1185.3600000000001">Onyx: Exactly. The cue helps me begin reading while the</tspan><tspan x="28" y="1215.46">water heats.</tspan></text><text x="28" y="1260.18" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1286.324">Suggest one environmental change that makes a valued</tspan><tspan x="28" y="1316.424">reading habit easier to repeat. (Model: Leave a book</tspan><tspan x="28" y="1346.5240000000001">where the routine already pauses, such as beside the</tspan><tspan x="28" y="1376.624">kettle.)</tspan></text></svg>