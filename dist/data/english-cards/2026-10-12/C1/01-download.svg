<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intentionality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Writing gives us a way to examine an experience and our own assumptions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Writing gives us a way to examine an experience and our own assumptions.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">intentionality</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /ɪnˌtenʃəˈnæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">Usually uncountable: intentionality; no regular plural in this sense.</tspan></text><text x="28" y="589.635" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="617.9069999999999">The quality of acting with conscious purpose or a</tspan><tspan x="28" y="650.4569999999999">considered aim.</tspan></text><text x="28" y="698.817" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="727.0889999999999">purposefulness; deliberateness · These fit the</tspan><tspan x="28" y="759.6389999999999">everyday sense here, not every specialised use of</tspan><tspan x="28" y="792.189">intentionality.</tspan></text><text x="28" y="840.549" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="868.8209999999999">Intentionality can be expressed through modest,</tspan><tspan x="28" y="901.3709999999999">repeatable choices.</tspan></text><text x="28" y="949.731" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="978.0029999999999">Usually uncountable. In everyday discussion it</tspan><tspan x="28" y="1010.5529999999999">concerns purposeful action; in philosophy the term</tspan><tspan x="28" y="1043.1029999999998">also has a distinct technical sense.</tspan></text><text x="28" y="1091.4630000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1119.7350000000001">A: Does every habit need a grand purpose?</tspan><tspan x="28" y="1152.285">B: No. Intentionality can be quiet and practical.</tspan><tspan x="28" y="1184.835">A: What makes an ordinary choice intentional?</tspan><tspan x="28" y="1217.3850000000002">B: Knowing why it matters and choosing it with that</tspan><tspan x="28" y="1249.9350000000002">purpose in mind.</tspan></text><text x="28" y="1298.2950000000003" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1326.5670000000002">Complete: Her choices showed care and ____.</tspan><tspan x="28" y="1359.1170000000002">(Model: intentionality)</tspan></text></svg>