<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intentionality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="39.56" font-weight="700" fill="#382d2e"><tspan x="28" y="471.56">intentionality</tspan></text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="505.53">US /ɪnˌtenʃəˈnæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="18.92" font-weight="400" fill="#382d2e"><tspan x="28" y="529.7475999999999">Usually uncountable: intentionality; no regular plural in this sense.</tspan></text><text x="28" y="577.77" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="603.914">The quality of acting with conscious purpose or a</tspan><tspan x="28" y="634.014">considered aim.</tspan></text><text x="28" y="678.734" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="704.878">purposefulness; deliberateness · These fit the everyday</tspan><tspan x="28" y="734.9780000000001">sense here, not every specialised use of intentionality.</tspan></text><text x="28" y="779.6980000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="805.8420000000001">Intentionality can be expressed through modest,</tspan><tspan x="28" y="835.9420000000001">repeatable choices.</tspan></text><text x="28" y="880.6620000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8060000000002">Here it concerns what an action or mental state is</tspan><tspan x="28" y="936.9060000000002">directed toward. Related discussions may use the word</tspan><tspan x="28" y="967.0060000000002">more broadly for purposiveness.</tspan></text><text x="28" y="1011.7260000000001" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8700000000001">Kore: Are you describing an aim or merely a repeated</tspan><tspan x="28" y="1067.97">action?</tspan><tspan x="28" y="1098.0700000000002">Onyx: The distinction matters to intentionality in this</tspan><tspan x="28" y="1128.17">account.</tspan><tspan x="28" y="1158.2700000000002">Kore: Then a routine can look similar while serving</tspan><tspan x="28" y="1188.3700000000001">different purposes?</tspan><tspan x="28" y="1218.4700000000003">Onyx: Yes. We need to ask what the action is directed</tspan><tspan x="28" y="1248.5700000000002">toward.</tspan></text><text x="28" y="1293.2900000000002" font-family="Arial, sans-serif" font-size="13.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.080000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1319.4340000000002">Why might two identical routines differ in intentionality?</tspan><tspan x="28" y="1349.534">(Model: The actions may be directed toward different</tspan><tspan x="28" y="1379.6340000000002">purposes or objects despite looking the same.)</tspan></text></svg>