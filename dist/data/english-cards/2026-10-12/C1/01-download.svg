<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>intentionality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">intentionality</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /ɪnˌtenʃəˈnæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Usually uncountable: intentionality; no regular plural in this sense.</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">The quality of acting with conscious purpose or a</tspan><tspan x="28" y="636.3630000000002">considered aim.</tspan></text><text x="28" y="681.6030000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="708.0510000000002">purposefulness; deliberateness · These fit the everyday</tspan><tspan x="28" y="738.5010000000002">sense here, not every specialised use of intentionality.</tspan></text><text x="28" y="783.7410000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="810.1890000000002">Intentionality can be expressed through modest,</tspan><tspan x="28" y="840.6390000000002">repeatable choices.</tspan></text><text x="28" y="885.8790000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="912.3270000000002">Here it concerns what an action or mental state is</tspan><tspan x="28" y="942.7770000000003">directed toward. Related discussions may use the word</tspan><tspan x="28" y="973.2270000000002">more broadly for purposiveness.</tspan></text><text x="28" y="1018.4670000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1044.9150000000002">A: Are you describing an aim or merely a repeated</tspan><tspan x="28" y="1075.3650000000002">action?</tspan><tspan x="28" y="1105.8150000000003">B: The distinction matters to intentionality in this account.</tspan><tspan x="28" y="1136.265">A: Then a routine can look similar while serving different</tspan><tspan x="28" y="1166.7150000000001">purposes?</tspan><tspan x="28" y="1197.1650000000002">B: Yes. We need to ask what the action is directed</tspan><tspan x="28" y="1227.6150000000002">toward.</tspan></text><text x="28" y="1272.8550000000005" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1299.3030000000003">Why might two identical routines differ in intentionality?</tspan><tspan x="28" y="1329.7530000000004">(Model: The actions may be directed toward different</tspan><tspan x="28" y="1360.2030000000004">purposes or objects despite looking the same.)</tspan></text></svg>