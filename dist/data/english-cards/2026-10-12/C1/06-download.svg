<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>lose sight of</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person checks the time beside a bed.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person checks the time beside a bed.</tspan></text><a href="https://www.pexels.com/photo/woman-wearing-headscarf-lying-in-bed-8090973/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8090973</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">lose sight of</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">To stop keeping an important purpose or fact in mind.</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="632.2765">forget about; overlook</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="706.8485000000001">We can lose sight of enjoyment when every hobby</tspan><tspan x="28" y="738.5235">becomes a target.</tspan></text><text x="28" y="785.5835" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="813.0955">Lose sight of is figurative here: stop keeping a</tspan><tspan x="28" y="844.7705">purpose or fact in mind. It does not require literal loss</tspan><tspan x="28" y="876.4455">of vision.</tspan></text><text x="28" y="923.5055" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="951.0175">Kore: The hobby now has weekly performance</tspan><tspan x="28" y="982.6925">targets.</tspan><tspan x="28" y="1014.3675000000001">Onyx: Have we lost sight of why we began?</tspan><tspan x="28" y="1046.0425">Kore: We wanted to enjoy making things together.</tspan><tspan x="28" y="1077.7175">Onyx: Then the targets should support that rather</tspan><tspan x="28" y="1109.3925">than replace it.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">A hobby becomes stressful because every session is</tspan><tspan x="28" y="1317.667">measured. Identify what participants may have lost</tspan><tspan x="28" y="1349.3419999999999">sight of. (Model: The enjoyment or shared activity that</tspan><tspan x="28" y="1381.017">originally motivated the hobby.)</tspan></text></svg>