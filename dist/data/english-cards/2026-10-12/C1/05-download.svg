<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>go through the motions</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">go through the motions</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">To perform an activity mechanically without real</tspan><tspan x="28" y="589.3795">interest, commitment, or attention.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="663.9515">act mechanically; perform without engagement</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="738.5235">I was attending every meeting but merely going</tspan><tspan x="28" y="770.1985">through the motions.</tspan></text><text x="28" y="817.2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="844.7705">Usually critical or self-critical. It describes mechanical</tspan><tspan x="28" y="876.4454999999999">participation, not merely following a necessary</tspan><tspan x="28" y="908.1205">procedure carefully.</tspan></text><text x="28" y="955.1804999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="982.6925">Kore: You attend every meeting but hardly remember</tspan><tspan x="28" y="1014.3675">the discussion.</tspan><tspan x="28" y="1046.0425">Onyx: I think I have been going through the motions.</tspan><tspan x="28" y="1077.7175">Kore: Would changing your role help?</tspan><tspan x="28" y="1109.3925">Onyx: Perhaps, but first I need to decide whether the</tspan><tspan x="28" y="1141.0675">meetings serve a useful purpose.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Distinguish going through the motions from being</tspan><tspan x="28" y="1317.667">actively engaged. (Model: The outward activity is</tspan><tspan x="28" y="1349.3419999999999">performed without genuine attention, interest or</tspan><tspan x="28" y="1381.017">commitment.)</tspan></text></svg>