<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>go through the motions</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - Idioms &amp; slang</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#383426">2026-10-12 · C1 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>go through the motions</title><desc>Original family-manga illustration: compass, related to go through the motions.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle r="67" fill="#c8d0c1"/><path d="M-16 15L26-40L15 16L-27 41Z" fill="#c18e7a"/><path d="M0-59V-45M59 0H45M0 59V45M-59 0H-45"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.08" font-weight="700" fill="#383426"><tspan x="28" y="477.08">go through the motions</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">To perform an activity mechanically without real</tspan><tspan x="28" y="602.422">interest, commitment, or attention.</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="683.174">To perform an activity mechanically without real</tspan><tspan x="28" y="717.4739999999999">interest, commitment, or attention</tspan></text><text x="28" y="768.434" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="798.2260000000001">I was attending every meeting but merely going</tspan><tspan x="28" y="832.5260000000001">through the motions.</tspan></text><text x="28" y="883.486" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="913.278">Usually critical or self-critical. The outward</tspan><tspan x="28" y="947.578">actions occur, but the speaker questions the</tspan><tspan x="28" y="981.878">engagement behind them.</tspan></text><text x="28" y="1032.838" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="1062.63">A: Did you enjoy the activity?</tspan><tspan x="28" y="1096.93">B: Honestly, I was just going through the motions.</tspan><tspan x="28" y="1131.23">A: What would help you reconnect with it?</tspan><tspan x="28" y="1165.5300000000002">B: Remembering what interested me before it</tspan><tspan x="28" y="1199.8300000000002">became another obligation.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">What is missing when someone goes through the</tspan><tspan x="28" y="1323.772">motions? (Model: Genuine attention, enthusiasm</tspan><tspan x="28" y="1358.072">or engagement.)</tspan></text></svg>