<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>default to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">default to</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">To adopt a familiar option automatically when no</tspan><tspan x="28" y="589.3795">deliberate alternative is chosen.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="663.9515">fall back on; automatically choose</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="738.5235">When I feel rushed, I default to checking messages.</tspan></text><text x="28" y="785.5835" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="813.0955">Default to + noun or -ing form. It describes the option</tspan><tspan x="28" y="844.7705">adopted automatically when an alternative is not</tspan><tspan x="28" y="876.4455">actively selected.</tspan></text><text x="28" y="923.5055" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="951.0175">Kore: What happens when the schedule becomes</tspan><tspan x="28" y="982.6925">unclear?</tspan><tspan x="28" y="1014.3675000000001">Onyx: I default to checking messages.</tspan><tspan x="28" y="1046.0425">Kore: Does that help decide what matters next?</tspan><tspan x="28" y="1077.7175">Onyx: Usually not. It simply fills the gap with a</tspan><tspan x="28" y="1109.3925">familiar action.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Identify the automatic choice in I default to checking</tspan><tspan x="28" y="1317.667">messages whenever I feel uncertain. (Model:</tspan><tspan x="28" y="1349.3419999999999">Checking messages becomes the familiar option</tspan><tspan x="28" y="1381.017">without a deliberate decision.)</tspan></text></svg>