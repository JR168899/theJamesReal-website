<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>friction</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-10-12</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">friction</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>friction</title><desc>Original hand-drawn story illustration: magnifier, set within conversation. Resistance or difficulty that makes an action harder to begin or complete.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><g transform="translate(538 266) rotate(-3) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">friction</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">US PRONUNCIATION</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">/ˈfrɪkʃən/ noun</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Resistance or difficulty that makes an action harder to</tspan><tspan x="35" dy="24.839999999999996">begin or complete.</tspan></text><text x="35" y="692.0399999999998" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">WORD FORMS</tspan></text><text x="35" y="716.5999999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Form: friction (usually uncountable)</tspan></text><text x="35" y="768.4399999999998" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="792.9999999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Keeping materials within reach reduces the friction of</tspan><tspan x="35" dy="24.839999999999996">getting started.</tspan></text><text x="35" y="869.6799999999997" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="894.2399999999997" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">This is a figurative use. Reducing friction means removing</tspan><tspan x="35" dy="24.839999999999996">obstacles, not necessarily removing every effort involved</tspan><tspan x="35" dy="24.839999999999996">in an activity.</tspan></text><text x="35" y="995.7599999999996" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="1020.3199999999996" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Why leave the sketchbook open?</tspan><tspan x="35" dy="24.839999999999996">B: It reduces the friction of beginning.</tspan><tspan x="35" dy="24.839999999999996">A: Does that remove the need for effort?</tspan><tspan x="35" dy="24.839999999999996">B: No, but it makes the first action less demanding.</tspan></text><text x="35" y="1146.6799999999996" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1171.2399999999996" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Give an example of reducing friction for reading.</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   02 OF 11</tspan></text></svg>