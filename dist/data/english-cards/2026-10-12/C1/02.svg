<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>friction</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">friction</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /ˈfrɪkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Usually uncountable: friction; no regular plural in this sense.</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">Resistance or difficulty that makes an action harder to</tspan><tspan x="28" y="641.0609999999999">begin or complete.</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">resistance; difficulty · These fit the figurative sense of</tspan><tspan x="28" y="745.5469999999999">obstacles to starting or continuing an activity.</tspan></text><text x="28" y="791.827" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="818.8829999999999">Keeping materials within reach reduces the friction of</tspan><tspan x="28" y="850.0329999999999">getting started.</tspan></text><text x="28" y="896.313" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="923.3689999999999">Figurative in a discussion of habits: effort or</tspan><tspan x="28" y="954.5189999999999">inconvenience affecting an action, rather than</tspan><tspan x="28" y="985.6689999999999">physical resistance between surfaces.</tspan></text><text x="28" y="1031.949" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1059.005">Kore: Why leave the book on the desk before</tspan><tspan x="28" y="1090.1550000000002">breakfast?</tspan><tspan x="28" y="1121.305">Onyx: It reduces the friction involved in starting to</tspan><tspan x="28" y="1152.4550000000002">read.</tspan><tspan x="28" y="1183.605">Kore: And moving the phone away adds friction to</tspan><tspan x="28" y="1214.755">checking it?</tspan><tspan x="28" y="1245.9050000000002">Onyx: Exactly. The arrangement makes one action</tspan><tspan x="28" y="1277.055">easier and another less automatic.</tspan></text><text x="28" y="1323.335" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1350.391">In a discussion of habits, explain friction without</tspan><tspan x="28" y="1381.5410000000002">referring to a physical force.</tspan></text></svg>