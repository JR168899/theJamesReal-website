<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>lose sight of</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person checks the time beside a bed.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person checks the time beside a bed.</tspan></text><a href="https://www.pexels.com/photo/woman-wearing-headscarf-lying-in-bed-8090973/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8090973</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#383426"><tspan x="28" y="476.85">lose sight of</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="567.4275">To stop keeping an important purpose or fact in</tspan><tspan x="28" y="601.5525">mind.</tspan></text><text x="28" y="652.2525" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="681.8925">forget about; overlook</tspan></text><text x="28" y="732.5925000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="762.2325000000001">We can lose sight of enjoyment when every</tspan><tspan x="28" y="796.3575000000001">hobby becomes a target.</tspan></text><text x="28" y="847.0575000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="876.6975000000001">Lose sight of is figurative here: stop keeping a</tspan><tspan x="28" y="910.8225000000001">purpose or fact in mind. It does not require literal</tspan><tspan x="28" y="944.9475000000001">loss of vision.</tspan></text><text x="28" y="995.6475000000002" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1025.2875000000001">Kore: The hobby now has weekly performance</tspan><tspan x="28" y="1059.4125000000001">targets.</tspan><tspan x="28" y="1093.5375000000001">Onyx: Have we lost sight of why we began?</tspan><tspan x="28" y="1127.6625000000001">Kore: We wanted to enjoy making things</tspan><tspan x="28" y="1161.7875000000001">together.</tspan><tspan x="28" y="1195.9125000000001">Onyx: Then the targets should support that rather</tspan><tspan x="28" y="1230.0375000000001">than replace it.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1310.3775">A hobby becomes stressful because every</tspan><tspan x="28" y="1344.5025">session is measured. Identify what participants</tspan><tspan x="28" y="1378.6275">may have lost sight of.</tspan></text></svg>