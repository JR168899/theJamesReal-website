<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>default to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">default to</tspan></text><text x="28" y="550.345" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="583.633">To adopt a familiar option automatically</tspan><tspan x="28" y="621.9580000000001">when no deliberate alternative is chosen.</tspan></text><text x="28" y="678.898" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="712.186">fall back on; automatically choose</tspan></text><text x="28" y="769.1260000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="802.4140000000001">When I feel rushed, I default to checking</tspan><tspan x="28" y="840.7390000000001">messages.</tspan></text><text x="28" y="897.6790000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="930.9670000000001">Use default to + a noun or -ing. It can</tspan><tspan x="28" y="969.2920000000001">describe a useful standard choice or an</tspan><tspan x="28" y="1007.6170000000001">unexamined habit, depending on context.</tspan></text><text x="28" y="1064.557" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1097.845">A: Why did you open the app again?</tspan><tspan x="28" y="1136.17">B: I tend to default to it between tasks.</tspan><tspan x="28" y="1174.4950000000001">A: Would moving the app help?</tspan><tspan x="28" y="1212.8200000000002">B: It might create a pause in which I can</tspan><tspan x="28" y="1251.145">choose more deliberately.</tspan></text><text x="28" y="1308.085" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1341.373">Complete: Under pressure, I default ____</tspan><tspan x="28" y="1379.698">familiar routines.</tspan></text></svg>