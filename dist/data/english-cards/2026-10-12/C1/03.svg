<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>default to</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="478.69">default to</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="572.9835">To adopt a familiar option automatically when</tspan><tspan x="28" y="608.5085">no deliberate alternative is chosen.</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="692.1445000000001">fall back on; automatically choose</tspan></text><text x="28" y="744.9245000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="775.7805000000001">When I feel rushed, I default to checking</tspan><tspan x="28" y="811.3055">messages.</tspan></text><text x="28" y="864.0855000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="894.9415000000001">Default to + noun or -ing form. It describes the</tspan><tspan x="28" y="930.4665000000001">option adopted automatically when an</tspan><tspan x="28" y="965.9915000000001">alternative is not actively selected.</tspan></text><text x="28" y="1018.7715000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1049.6275000000003">Kore: What happens when the schedule</tspan><tspan x="28" y="1085.1525000000004">becomes unclear?</tspan><tspan x="28" y="1120.6775000000002">Onyx: I default to checking messages.</tspan><tspan x="28" y="1156.2025000000003">Kore: Does that help decide what matters next?</tspan><tspan x="28" y="1191.7275000000004">Onyx: Usually not. It simply fills the gap with a</tspan><tspan x="28" y="1227.2525000000003">familiar action.</tspan></text><text x="28" y="1280.0325000000003" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1310.8885000000002">Identify the automatic choice in I default to</tspan><tspan x="28" y="1346.4135000000003">checking messages whenever I feel uncertain.</tspan></text></svg>