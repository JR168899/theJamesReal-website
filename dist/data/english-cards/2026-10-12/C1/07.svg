<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The aim is to make the valued choice easier to repeat.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written list makes tasks and priorities visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written list makes tasks and priorities visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="475.47">The aim is to make the</tspan><tspan x="28" y="529.8075">valued choice easier to</tspan><tspan x="28" y="584.145">repeat.</tspan></text><text x="28" y="643.2075000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="671.9355000000002">A statement that the goal is to help someone repeat</tspan><tspan x="28" y="705.0105000000002">an action they already consider worthwhile.</tspan></text><text x="28" y="754.1505000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="782.8785000000001">The goal is to support a worthwhile habit.; We want</tspan><tspan x="28" y="815.9535000000002">the desired action to become more accessible.</tspan></text><text x="28" y="865.0935000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="893.8215000000001">The aim is to make the valued choice easier to</tspan><tspan x="28" y="926.8965000000002">repeat, not to perfect every minute.</tspan></text><text x="28" y="976.0365" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1004.7645000000001">Valued identifies the action&#x27;s significance to the</tspan><tspan x="28" y="1037.8395">person. Easier to repeat concerns its conditions, not</tspan><tspan x="28" y="1070.9145">a demand for perfect consistency.</tspan></text><text x="28" y="1120.0545" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1148.7825">A: Why place your guitar beside the sofa?</tspan><tspan x="28" y="1181.8575">B: The aim is to make the valued choice easier to</tspan><tspan x="28" y="1214.9325000000001">repeat.</tspan><tspan x="28" y="1248.0075">A: Does the arrangement work on difficult days?</tspan><tspan x="28" y="1281.0825">B: It helps, but I also allow the routine to change.</tspan></text><text x="28" y="1330.2224999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1358.9505">Explain this aim using a specific example.</tspan></text></svg>