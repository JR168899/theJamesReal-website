<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What-cleft sentences</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382f40"><tspan x="28" y="480.3">What-cleft sentences</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="577.845">A sentence pattern using a what-clause and be</tspan><tspan x="28" y="614.595">to focus attention on particular information.</tspan></text><text x="28" y="669.1949999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="701.115">What I needed was a routine that allowed for</tspan><tspan x="28" y="737.865">interruptions.</tspan></text><text x="28" y="792.4649999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="824.385">What I needed was flexibility. The focused</tspan><tspan x="28" y="861.135">element follows be. Maintain suitable tense and</tspan><tspan x="28" y="897.885">agreement rather than treating the pattern as a</tspan><tspan x="28" y="934.635">fixed slogan.</tspan></text><text x="28" y="989.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="1021.155">A: Was stricter planning the solution?</tspan><tspan x="28" y="1057.905">B: No. What helped was making the first step</tspan><tspan x="28" y="1094.655">smaller.</tspan><tspan x="28" y="1131.405">A: Why did that make a difference?</tspan><tspan x="28" y="1168.155">B: It replaced an intimidating goal with</tspan><tspan x="28" y="1204.905">something I could begin.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382f40"><tspan x="28" y="1292.72">Emphasise “a little flexibility”: I needed a little</tspan><tspan x="28" y="1329.47">flexibility. (Model: What I needed was a little</tspan><tspan x="28" y="1366.22">flexibility.)</tspan></text></svg>