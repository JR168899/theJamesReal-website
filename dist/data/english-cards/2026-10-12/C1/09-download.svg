<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What-cleft sentences</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A clock makes the passage of time visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A clock makes the passage of time visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-on-hands-of-clock-13151698/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13151698</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382f40"><tspan x="28" y="475.47">What-cleft sentences</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="563.2605000000001">A sentence pattern using a what-clause and be to</tspan><tspan x="28" y="596.3355000000001">focus attention on particular information.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="674.2035000000001">What I needed was a routine that allowed for</tspan><tspan x="28" y="707.2785000000001">interruptions.</tspan></text><text x="28" y="756.4185" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="785.1465000000001">A what-clause plus be focuses attention on particular</tspan><tspan x="28" y="818.2215000000001">information: What I needed was X. Keep the tense</tspan><tspan x="28" y="851.2965">appropriate to the context.</tspan></text><text x="28" y="900.4365" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="929.1645000000001">Kore: Did the new planner solve the problem?</tspan><tspan x="28" y="962.2395000000001">Onyx: What I needed was more space between</tspan><tspan x="28" y="995.3145000000001">appointments.</tspan><tspan x="28" y="1028.3895">Kore: Not a more detailed timetable?</tspan><tspan x="28" y="1061.4645">Onyx: Exactly. I was solving the wrong problem.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="1287.848">Emphasize the needed thing with a what-cleft: I</tspan><tspan x="28" y="1320.923">needed a quiet place, not another app. (Model: What</tspan><tspan x="28" y="1353.998">I needed was a quiet place, not another app.)</tspan></text></svg>