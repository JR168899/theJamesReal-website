<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Which part of your routine feels most like a choice?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">Which part of your routine</tspan><tspan x="28" y="535.5">feels most like a choice?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">A reflective question about which regular</tspan><tspan x="28" y="663.4">activity feels consciously chosen rather than</tspan><tspan x="28" y="698.4">automatic.</tspan></text><text x="28" y="750.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="780.8">Which part of your routine feels most like a</tspan><tspan x="28" y="815.8">choice?</tspan></text><text x="28" y="867.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="898.1999999999999">The phrase most like a choice invites</tspan><tspan x="28" y="933.1999999999999">interpretation. It does not imply that habits and</tspan><tspan x="28" y="968.1999999999999">choices are mutually exclusive.</tspan></text><text x="28" y="1020.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1050.6">A: Which part of your routine feels most like a</tspan><tspan x="28" y="1085.6">choice?</tspan><tspan x="28" y="1120.6">B: Walking home by the river. I could take a</tspan><tspan x="28" y="1155.6">faster route, but I enjoy the extra time.</tspan><tspan x="28" y="1190.6">A: What does the slower route give you?</tspan><tspan x="28" y="1225.6">B: A sense that the day includes something</tspan><tspan x="28" y="1260.6">chosen for its own sake.</tspan></text><text x="28" y="1312.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1343.0">Ask a follow-up about the value behind that</tspan><tspan x="28" y="1378.0">choice.</tspan></text></svg>