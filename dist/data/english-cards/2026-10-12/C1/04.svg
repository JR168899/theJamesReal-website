<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>carve out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar makes time, commitments and priorities visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar makes time, commitments and priorities visible.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="479.15">carve something out</tspan><tspan x="28" y="538.0875">carve out something</tspan></text><text x="28" y="602.15" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="633.3100000000001">To secure time, space, or an opportunity</tspan><tspan x="28" y="669.1850000000001">despite competing demands.</tspan></text><text x="28" y="722.485" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="753.6450000000001">create space for; secure</tspan></text><text x="28" y="806.945" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="838.1050000000001">She carved out a quiet hour for her writing.</tspan></text><text x="28" y="891.4050000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="922.5650000000002">Carve out time for something suggests effort in</tspan><tspan x="28" y="958.4400000000002">protecting a limited resource. With a pronoun,</tspan><tspan x="28" y="994.3150000000002">say carve it out.</tspan></text><text x="28" y="1047.6150000000002" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1078.775">A: How do you keep your creative work going?</tspan><tspan x="28" y="1114.65">B: I carve out a little time before the day</tspan><tspan x="28" y="1150.525">becomes busy.</tspan><tspan x="28" y="1186.4">A: How do you protect that time?</tspan><tspan x="28" y="1222.275">B: I keep the commitment small enough to</tspan><tspan x="28" y="1258.15">sustain.</tspan></text><text x="28" y="1311.4500000000003" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1342.6100000000001">Rewrite using “carve out”: She made time for</tspan><tspan x="28" y="1378.4850000000001">reflection.</tspan></text></svg>