<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>carve out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader takes a quiet moment at home.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader takes a quiet moment at home.</tspan></text><a href="https://www.pexels.com/photo/woman-sitting-and-reading-book-5698385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5698385</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="480.99">carve something out</tspan><tspan x="28" y="542.2275">carve out something</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="641.166">To secure time, space, or an opportunity</tspan><tspan x="28" y="678.441">despite competing demands.</tspan></text><text x="28" y="733.821" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="766.1970000000001">create space for; secure</tspan></text><text x="28" y="821.577" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="853.9530000000001">She carved out a quiet hour for her writing.</tspan></text><text x="28" y="909.333" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="941.7090000000001">Separable: carve out an hour / carve an hour</tspan><tspan x="28" y="978.984">out. Often used for securing time, space or</tspan><tspan x="28" y="1016.259">an opportunity with effort.</tspan></text><text x="28" y="1071.6390000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1104.015">A: How did you find an hour for writing?</tspan><tspan x="28" y="1141.2900000000002">B: I carved it out by moving two optional</tspan><tspan x="28" y="1178.565">meetings.</tspan><tspan x="28" y="1215.8400000000001">A: Then it was not simply unused time?</tspan><tspan x="28" y="1253.1150000000002">B: No. I had to protect it from other demands.</tspan></text><text x="28" y="1308.4950000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1340.871">Distinguish carving out time from happening</tspan><tspan x="28" y="1378.1460000000002">to have nothing scheduled.</tspan></text></svg>