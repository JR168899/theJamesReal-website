<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Making room for what matters</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-10-12 · C1 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>Making room for what matters</title><desc>Original family-manga illustration: room, related to Making room for what matters.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">Making room for what matters</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="157.0">Everyday change depends on more than willpower. Meaningful routines are more likely to last when environments</tspan><tspan x="42" y="180.4">reduce friction and expectations remain flexible enough to preserve the value of the activity itself.</tspan></text><text x="42" y="217.8" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="242.8">Reducing friction makes a valued choice easier to begin. A notebook left open or reading materials prepared in advance removes a small but repeated</tspan><tspan x="42" y="266.2">obstacle. Someone who wants to write after dinner, for instance, can prepare a quiet space before the evening becomes crowded with other demands.</tspan></text><text x="42" y="303.6" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="328.6">Flexible expectations protect the purpose behind the routine. A reader who treats a daily page target as compulsory may lose the pleasure that</tspan><tspan x="42" y="352.0">motivated the habit. Allowing a shorter session on a demanding day preserves engagement without making measurement the activity’s sole justification.</tspan></text><text x="42" y="389.40000000000003" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="414.40000000000003">What I find useful is therefore a balance between supportive structure and permission to adapt. The former eases the first step; the latter preserves</tspan><tspan x="42" y="437.8">meaning when circumstances change. Intentionality works best when it supports ordinary life rather than demanding perfect predictability.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="493.20000000000005">BUILD YOUR OWN · Establish two conditions for lasting routines. Explain reduced friction and flexible expectations with distinct examples. Synthesize their</tspan><tspan x="42" y="515.2">complementary roles. Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="537.2">What risk does the third paragraph identify?</tspan></text></svg>