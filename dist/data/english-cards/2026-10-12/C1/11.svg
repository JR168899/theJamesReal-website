<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Making room for what matters</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-10-12</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Making room for what matters</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Making room for what matters</title><desc>Original hand-drawn story illustration: room, set within conversation. How environments and flexible routines can support activities we value.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><g transform="translate(94 266) rotate(-3) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Making room for what matters</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">Everyday change depends on more</tspan><tspan x="36" dy="23.459999999999997">than willpower. Meaningful</tspan><tspan x="36" dy="23.459999999999997">routines are more likely to last</tspan><tspan x="36" dy="23.459999999999997">when environments reduce friction</tspan><tspan x="36" dy="23.459999999999997">and expectations remain flexible</tspan><tspan x="36" dy="23.459999999999997">enough to preserve the value of</tspan><tspan x="36" dy="23.459999999999997">the activity itself.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">Reducing friction makes a valued</tspan><tspan x="384" dy="23.459999999999997">choice easier to begin. A</tspan><tspan x="384" dy="23.459999999999997">notebook left open or reading</tspan><tspan x="384" dy="23.459999999999997">materials prepared in advance</tspan><tspan x="384" dy="23.459999999999997">removes a small but repeated</tspan><tspan x="384" dy="23.459999999999997">obstacle. Someone who wants to</tspan><tspan x="384" dy="23.459999999999997">write after dinner, for instance,</tspan><tspan x="384" dy="23.459999999999997">can prepare a quiet space before</tspan><tspan x="384" dy="23.459999999999997">the evening becomes crowded with</tspan><tspan x="384" dy="23.459999999999997">other demands.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Flexible expectations protect the</tspan><tspan x="732" dy="23.459999999999997">purpose behind the routine. A</tspan><tspan x="732" dy="23.459999999999997">reader who treats a daily page</tspan><tspan x="732" dy="23.459999999999997">target as compulsory may lose the</tspan><tspan x="732" dy="23.459999999999997">pleasure that motivated the</tspan><tspan x="732" dy="23.459999999999997">habit. Allowing a shorter session</tspan><tspan x="732" dy="23.459999999999997">on a demanding day preserves</tspan><tspan x="732" dy="23.459999999999997">engagement without making</tspan><tspan x="732" dy="23.459999999999997">measurement the activity’s sole</tspan><tspan x="732" dy="23.459999999999997">justification.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">What I find useful is therefore a</tspan><tspan x="1080" dy="23.459999999999997">balance between supportive</tspan><tspan x="1080" dy="23.459999999999997">structure and permission to</tspan><tspan x="1080" dy="23.459999999999997">adapt. The former eases the first</tspan><tspan x="1080" dy="23.459999999999997">step; the latter preserves</tspan><tspan x="1080" dy="23.459999999999997">meaning when circumstances</tspan><tspan x="1080" dy="23.459999999999997">change. Intentionality works best</tspan><tspan x="1080" dy="23.459999999999997">when it supports ordinary life</tspan><tspan x="1080" dy="23.459999999999997">rather than demanding perfect</tspan><tspan x="1080" dy="23.459999999999997">predictability.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · What risk does the third paragraph identify?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>