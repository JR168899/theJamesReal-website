<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>go through the motions</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/12 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">go through the motions</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">To perform an activity mechanically without real</tspan><tspan x="28" y="607.6389999999999">interest, commitment, or attention.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="690.8629999999999">act mechanically; perform without engagement</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="774.0869999999999">I was attending every meeting but merely going</tspan><tspan x="28" y="809.4369999999999">through the motions.</tspan></text><text x="28" y="861.957" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="892.661">Usually critical or self-critical. It describes</tspan><tspan x="28" y="928.011">mechanical participation, not merely following a</tspan><tspan x="28" y="963.361">necessary procedure carefully.</tspan></text><text x="28" y="1015.881" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1046.585">Kore: You attend every meeting but hardly</tspan><tspan x="28" y="1081.935">remember the discussion.</tspan><tspan x="28" y="1117.285">Onyx: I think I have been going through the</tspan><tspan x="28" y="1152.635">motions.</tspan><tspan x="28" y="1187.9850000000001">Kore: Would changing your role help?</tspan><tspan x="28" y="1223.335">Onyx: Perhaps, but first I need to decide</tspan><tspan x="28" y="1258.685">whether the meetings serve a useful purpose.</tspan></text><text x="28" y="1311.2050000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1341.909">Distinguish going through the motions from</tspan><tspan x="28" y="1377.259">being actively engaged.</tspan></text></svg>