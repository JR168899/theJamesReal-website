999">Use it when the speed is too fast: Please slow</tspan><tspan x="28" y="853.0999999999999">down. You can also slow something down.</tspan></text><text x="28" y="905.0999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#3d3028"><tspan x="28" y="935.4999999999999">A: You are walking very fast.</tspan><tspan x="28" y="970.4999999999999">B: You’re right. Let’s slow down.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#3d3028"><tspan x="28" y="1290.4">Complete: Let’s slow ____ and look around.</tspan></text></svg>