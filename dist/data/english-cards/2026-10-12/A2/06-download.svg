<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>less is more</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">less is more</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="584.04">A saying that a simple choice can</tspan><tspan x="28" y="622.54">sometimes be better than a complicated</tspan><tspan x="28" y="661.04">one.</tspan></text><text x="28" y="718.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="751.68">simplicity can be effective; choose quality</tspan><tspan x="28" y="790.18">over excess</tspan></text><text x="28" y="847.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="880.8199999999999">I keep only three things on my desk. Less</tspan><tspan x="28" y="919.3199999999999">is more.</tspan></text><text x="28" y="976.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1009.9599999999999">It does not mean that less is always better.</tspan><tspan x="28" y="1048.46">Use it when keeping things simple helps.</tspan></text><text x="28" y="1105.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1139.1">A: Your desk looks simple.</tspan><tspan x="28" y="1177.6">B: Yes. For me, less is more.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1295.04">What does “less is more” suggest here?</tspan><tspan x="28" y="1333.54">(Model: A simpler desk works better for this</tspan><tspan x="28" y="1372.04">person.)</tspan></text></svg>