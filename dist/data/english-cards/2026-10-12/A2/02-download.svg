<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>notice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">notice</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ˈnoʊtɪs/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">notice · notices · noticed · noticed · noticing (base · third</tspan><tspan x="28" y="579.5250000000001">person · past · past participle · -ing)</tspan></text><text x="28" y="638.157" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="670.0770000000001">To see or become aware of something.</tspan></text><text x="28" y="724.677" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="756.5970000000001">see; become aware of · Notice adds the idea</tspan><tspan x="28" y="793.3470000000001">that something reaches your attention.</tspan></text><text x="28" y="847.947" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="879.8670000000001">I notice the flowers on my way to work.</tspan></text><text x="28" y="934.467" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="966.3870000000001">Use notice + a thing: notice a bird. Use notice</tspan><tspan x="28" y="1003.1370000000001">that + a sentence: notice that it is raining.</tspan></text><text x="28" y="1057.737" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1089.6570000000002">A: Did you notice the new sign?</tspan><tspan x="28" y="1126.4070000000002">B: Only after I passed the entrance.</tspan><tspan x="28" y="1163.1570000000002">A: Was it hidden?</tspan><tspan x="28" y="1199.9070000000002">B: No, but its color blended into the wall.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1292.72">Name a reason people might fail to notice a</tspan><tspan x="28" y="1329.47">visible sign. (Model: It may blend into its</tspan><tspan x="28" y="1366.22">surroundings or be outside their line of sight.)</tspan></text></svg>