<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I am trying to do one thing at a time.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record and reflect.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record and reflect.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2d382e"><tspan x="28" y="482.0">I am trying to do one</tspan><tspan x="28" y="544.5">thing at a time.</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="646.54">A way to say that you are practising doing</tspan><tspan x="28" y="685.04">one task before starting another.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="775.68">I am focusing on a single task.; I am</tspan><tspan x="28" y="814.18">avoiding multitasking.</tspan></text><text x="28" y="871.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="904.8199999999999">I am trying to do one thing at a time.</tspan></text><text x="28" y="962.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="995.4599999999999">Try to + a verb describes an effort. One</tspan><tspan x="28" y="1033.96">thing at a time means doing tasks</tspan><tspan x="28" y="1072.46">separately.</tspan></text><text x="28" y="1129.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1163.1">A: Are you checking your phone while</tspan><tspan x="28" y="1201.6">reading?</tspan><tspan x="28" y="1240.1">B: No. I am trying to do one thing at a time.</tspan></text><text x="28" y="1297.3" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1330.74">Complete: I am trying to do one thing ____</tspan><tspan x="28" y="1369.24">a time.</tspan></text></svg>