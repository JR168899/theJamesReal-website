<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I am trying to do one thing at a time.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="480.3">I am trying to do one thing</tspan><tspan x="28" y="540.6750000000001">at a time.</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="638.22">A way to say that you are practising doing one</tspan><tspan x="28" y="674.97">task before starting another.</tspan></text><text x="28" y="729.5699999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="761.49">I am focusing on a single task.; I am avoiding</tspan><tspan x="28" y="798.24">multitasking.</tspan></text><text x="28" y="852.8399999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="884.76">I am trying to do one thing at a time.</tspan></text><text x="28" y="939.3599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="971.28">The present continuous describes a current</tspan><tspan x="28" y="1008.03">effort. Trying does not claim the habit is</tspan><tspan x="28" y="1044.78">already perfect.</tspan></text><text x="28" y="1099.3799999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1131.3">A: You have put your phone away.</tspan><tspan x="28" y="1168.05">B: I am trying to do one thing at a time.</tspan><tspan x="28" y="1204.8">A: Are you finishing the letter first?</tspan><tspan x="28" y="1241.55">B: Yes. I will check messages afterward.</tspan></text><text x="28" y="1296.1499999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1328.07">A friend interrupts your letter with a non-urgent</tspan><tspan x="28" y="1364.82">message. Explain when you will respond.</tspan></text></svg>