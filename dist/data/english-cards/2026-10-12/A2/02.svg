<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>notice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="49.220000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="481.22">notice</tspan></text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="523.485">US /ˈnoʊtɪs/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.540000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="553.6161999999999">notice · notices · noticed · noticed · noticing (base · third</tspan><tspan x="28" y="582.3349999999999">person · past · past participle · -ing)</tspan></text><text x="28" y="642.0838" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="674.6118">To see or become aware of something.</tspan></text><text x="28" y="730.2518" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="762.7798">see; become aware of · Notice adds the idea</tspan><tspan x="28" y="800.2298000000001">that something reaches your attention.</tspan></text><text x="28" y="855.8698" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="888.3978000000001">I notice the flowers on my way to work.</tspan></text><text x="28" y="944.0378000000001" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="976.5658000000001">Use notice + a thing: notice a bird. Use</tspan><tspan x="28" y="1014.0158000000001">notice that + a sentence: notice that it is</tspan><tspan x="28" y="1051.4658000000002">raining.</tspan></text><text x="28" y="1107.1058" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1139.6338000000003">A: Did you notice the new sign?</tspan><tspan x="28" y="1177.0838000000003">B: Only after I passed the entrance.</tspan><tspan x="28" y="1214.5338000000004">A: Was it hidden?</tspan><tspan x="28" y="1251.9838000000002">B: No, but its color blended into the wall.</tspan></text><text x="28" y="1307.6238" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.1518000000003">Name a reason people might fail to notice a</tspan><tspan x="28" y="1377.6018000000004">visible sign.</tspan></text></svg>