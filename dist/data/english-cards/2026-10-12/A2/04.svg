<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>make time for</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#3d3028"><tspan x="28" y="482.0">make time for</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="584.04">To arrange your day so that you can do</tspan><tspan x="28" y="622.54">something.</tspan></text><text x="28" y="679.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="713.18">prioritize; fit into your schedule</tspan></text><text x="28" y="770.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="803.8199999999999">I make time for a short walk after lunch.</tspan></text><text x="28" y="861.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="894.4599999999999">Make time for a person or activity; make</tspan><tspan x="28" y="932.9599999999999">time to do something. It implies arranging</tspan><tspan x="28" y="971.4599999999999">priorities, not creating extra hours.</tspan></text><text x="28" y="1028.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1062.1">Bella: You keep postponing the walk.</tspan><tspan x="28" y="1100.6">Fenrir: I need to make time for it rather than</tspan><tspan x="28" y="1139.1">wait for a free afternoon.</tspan><tspan x="28" y="1177.6">Bella: Would ten minutes after lunch work?</tspan><tspan x="28" y="1216.1">Fenrir: Yes. I can put that in the calendar.</tspan></text><text x="28" y="1273.3" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1306.74">Turn I will walk when I am free into a</tspan><tspan x="28" y="1345.24">specific plan that makes time for it.</tspan></text></svg>