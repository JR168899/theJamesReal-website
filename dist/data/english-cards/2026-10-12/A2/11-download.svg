<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Ten minutes for myself</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/10/12 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A reader takes a quiet moment without rushing.</tspan></text><a href="https://www.pexels.com/photo/woman-reading-a-book-6344242/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 6344242</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Ten minutes for myself</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="162.0">Ten quiet minutes can make a busy morning better. I use this time to enjoy breakfast and</tspan><tspan x="42" y="191.25">read a little. These two small habits help me start the day calmly.</tspan></text><text x="42" y="223.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="253.5">First, a slow breakfast helps me notice the world around me. I usually leave my phone on</tspan><tspan x="42" y="282.75">the shelf for ten minutes. I sit by the window and eat slowly. Sometimes I watch birds in</tspan><tspan x="42" y="312.0">the tree outside.</tspan></text><text x="42" y="344.25" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="374.25">Second, a little reading gives me time for something I enjoy. I read one or two pages after</tspan><tspan x="42" y="403.5">breakfast. I do not need to finish a whole chapter. I build this habit step by step.</tspan></text><text x="42" y="435.75" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="465.75">Eating slowly and reading a little make my mornings more enjoyable. My day is still busy,</tspan><tspan x="42" y="495.0">but I have made time for myself. I want to keep these simple habits.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="545.25">BUILD YOUR OWN · Introduce two helpful habits. Give a breakfast example and a reading example in separate paragraphs.</tspan><tspan x="42" y="567.21">Finish by restating their shared benefit. Follow the main idea through two supported points. The conclusion brings both points</tspan><tspan x="42" y="589.17">together without adding a new reason.</tspan><tspan x="42" y="611.13">Where does the writer leave the phone, and for how long? (Model: The writer leaves the phone on the shelf for ten minutes.)</tspan></text></svg>