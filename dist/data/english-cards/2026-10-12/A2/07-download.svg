<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I am trying to do one thing at a time.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person uses a smartphone at a desk.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person uses a smartphone at a desk.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2d382e"><tspan x="28" y="473.63">I am trying to do one thing at</tspan><tspan x="28" y="525.6675">a time.</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="609.7420000000001">A way to say that you are practising doing one task</tspan><tspan x="28" y="641.417">before starting another.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="715.989">I am focusing on a single task.; I am avoiding</tspan><tspan x="28" y="747.664">multitasking.</tspan></text><text x="28" y="794.7239999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="822.236">I am trying to do one thing at a time.</tspan></text><text x="28" y="869.2959999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="896.808">The present continuous describes a current effort.</tspan><tspan x="28" y="928.483">Trying does not claim the habit is already perfect.</tspan></text><text x="28" y="975.5429999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1003.055">A: You have put your phone away.</tspan><tspan x="28" y="1034.73">B: I am trying to do one thing at a time.</tspan><tspan x="28" y="1066.405">A: Are you finishing the letter first?</tspan><tspan x="28" y="1098.08">B: Yes. I will check messages afterward.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1285.992">A friend interrupts your letter with a non-urgent</tspan><tspan x="28" y="1317.667">message. Explain when you will respond. (Model: I</tspan><tspan x="28" y="1349.3419999999999">am trying to do one thing at a time. I will reply after I</tspan><tspan x="28" y="1381.017">finish the letter.)</tspan></text></svg>