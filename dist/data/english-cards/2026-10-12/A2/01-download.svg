<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>habit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/12 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cup of tea offers a simple refreshment.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cup of tea offers a simple refreshment.</tspan></text><a href="https://www.pexels.com/photo/cup-of-tea-on-a-table-16921454/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16921454</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="473.86">habit</tspan></text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="509.805">US /ˈhæbɪt/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.020000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="535.4306">Singular: habit; plural: habits.</tspan></text><text x="28" y="586.2450000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="613.9090000000001">Something you do often, sometimes without thinking</tspan><tspan x="28" y="645.7590000000001">about it.</tspan></text><text x="28" y="693.0790000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="720.7430000000002">regular practice; usual behaviour · A habit often</tspan><tspan x="28" y="752.5930000000002">happens without much thought.</tspan></text><text x="28" y="799.9130000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="827.5770000000002">Reading after breakfast is a new habit for me.</tspan></text><text x="28" y="874.8970000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="902.5610000000003">A habit can be good or bad. Use a habit of + -ing: a</tspan><tspan x="28" y="934.4110000000003">habit of reading before bed.</tspan></text><text x="28" y="981.7310000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1009.3950000000003">A: You bring your own cup every morning.</tspan><tspan x="28" y="1041.2450000000003">B: Yes. It is a habit now.</tspan><tspan x="28" y="1073.0950000000003">A: Do you ever forget it?</tspan><tspan x="28" y="1104.9450000000004">B: Only when I leave in a hurry.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1286.224">Which is a habit: buying tea once, or bringing a cup</tspan><tspan x="28" y="1318.0739999999998">every morning? Explain. (Model: Bringing a cup every</tspan><tspan x="28" y="1349.924">morning is a habit because it happens regularly.)</tspan></text></svg>