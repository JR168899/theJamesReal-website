<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>charitable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/12/20 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">charitable</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˈtʃærətəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">charitable · more charitable · most charitable; noun: charity</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">intended to help people who need support</tspan></text><text x="28" y="671.3050000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="700.1850000000001">benevolent; philanthropic</tspan></text><text x="28" y="749.585" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="778.465">The group organizes a charitable food collection.</tspan></text><text x="28" y="827.865" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="856.745">The adjective describes a person, thing or</tspan><tspan x="28" y="889.995">situation. Choose a concrete noun or context that</tspan><tspan x="28" y="923.245">supports the description rather than using it as a</tspan><tspan x="28" y="956.495">general compliment.</tspan></text><text x="28" y="1005.895" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1034.7749999999999">Aoede: Is buying a ticket itself a charitable</tspan><tspan x="28" y="1068.0249999999999">donation?</tspan><tspan x="28" y="1101.2749999999999">Echo: Part of the price supports the charity, but</tspan><tspan x="28" y="1134.5249999999999">the amount should be clear.</tspan><tspan x="28" y="1167.7749999999999">Aoede: Then the publicity needs to explain the</tspan><tspan x="28" y="1201.0249999999999">split.</tspan><tspan x="28" y="1234.2749999999999">Echo: Yes. A charitable purpose does not remove</tspan><tspan x="28" y="1267.5249999999999">the need for accurate information.</tspan></text><text x="28" y="1316.925" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1345.8049999999998">A ticket supports a charity only in part. What</tspan><tspan x="28" y="1379.0549999999998">should the publicity state clearly?</tspan></text></svg>