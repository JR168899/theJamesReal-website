width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#83cf6e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">How do you usually care for a</tspan><tspan x="28" y="525.6675">plant?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An open question that invites a person to describe a</tspan><tspan x="28" y="641.417">familiar experience.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">How do you usually care for a plant?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Ask this as a genuine question. Listen to the answer,</tspan><tspan x="28" y="822.236">then ask a related follow-up.</tspan></text><text x="28" y="869.2959999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="896.808">A: How do you usually care for a plant?</tspan><tspan x="28" y="928.483">B: I try to prepare without deciding every detail in</tspan><tspan x="28" y="960.158">advance.</tspan><tspan x="28" y="991.833">A: What has helped you most?</tspan><tspan x="28" y="1023.508">B: For example, we check whether the soil feels dry</tspan><tspan x="28" y="1055.183">before adding water.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Apply the idea to a real situation, then answer: Write</tspan><tspan x="28" y="1317.667">a reply of your own, then ask one related question.</tspan><tspan x="28" y="1349.3419999999999">(Model: I try to prepare without deciding every detail</tspan><tspan x="28" y="1381.017">in advance. What works best for you?)</tspan></text></svg>