<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>generosity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/12/20 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">generosity</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˌdʒɛnəˈrɑsəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Usually uncountable: generosity; no regular plural in this</tspan><tspan x="28" y="564.7724999999999">sense.</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">a willingness to give time, help or possessions to</tspan><tspan x="28" y="679.3443000000002">others</tspan></text><text x="28" y="728.4843000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="757.2123000000001">willingness to give; liberality</tspan></text><text x="28" y="806.3523000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="835.0803000000002">Her generosity made the shared celebration</tspan><tspan x="28" y="868.1553000000002">possible.</tspan></text><text x="28" y="917.2953000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="946.0233000000002">Keep the sense and countability shown in the</tspan><tspan x="28" y="979.0983000000002">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="1012.1733000000002">the specific person, object or event being discussed.</tspan></text><text x="28" y="1061.3133" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0413">Sky: The gift is generous, but can she afford it?</tspan><tspan x="28" y="1123.1163000000001">Michael: Generosity should not require spending</tspan><tspan x="28" y="1156.1913000000002">beyond her means.</tspan><tspan x="28" y="1189.2663">Sky: Could we suggest another way to help?</tspan><tspan x="28" y="1222.3413">Michael: Her time and practical support would matter</tspan><tspan x="28" y="1255.4163">too.</tspan></text><text x="28" y="1304.5563" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1333.2843">Name a generous action that does not depend on</tspan><tspan x="28" y="1366.3593">spending much money.</tspan></text></svg>