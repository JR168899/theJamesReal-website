"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#83cf6e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.25" font-weight="700" fill="#3d3028"><tspan x="28" y="472.25">work something out</tspan><tspan x="28" y="522.5625">work out something</tspan></text><text x="28" y="577.25" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="603.85">find a solution</tspan></text><text x="28" y="649.35" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="675.95">find a solution</tspan></text><text x="28" y="721.45" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="748.0500000000001">We can work out a plan together.</tspan></text><text x="28" y="793.5500000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="820.1500000000001">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="850.7750000000001">changing its object or word order.</tspan></text><text x="28" y="896.2750000000001" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="922.8750000000001">A: How can we care for a plant?</tspan><tspan x="28" y="953.5000000000001">B: We can work out a plan together.</tspan><tspan x="28" y="984.1250000000001">A: That gives us a starting point.</tspan><tspan x="28" y="1014.7500000000001">B: Let us try it together.</tspan></text><text x="28" y="1258.0" font-family="Arial, sans-serif" font-size="14.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.5" font-weight="400" fill="#3d3028"><tspan x="28" y="1284.6">Apply the idea to a real situation, then answer: Explain</tspan><tspan x="28" y="1315.225">“work out” in your own words, then use it in a sentence</tspan><tspan x="28" y="1345.85">about growing something small. (Model: It means to find</tspan><tspan x="28" y="1376.475">a solution. Example: We can work out a plan together.)</tspan></text></svg>