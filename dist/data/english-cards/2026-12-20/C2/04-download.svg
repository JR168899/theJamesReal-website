<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/12/20 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">dispense with</tspan></text><text x="28" y="514.23" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="536.422">manage without something unnecessary</tspan></text><text x="28" y="574.382" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="596.5740000000001">do without; forgo</tspan></text><text x="28" y="634.534" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="656.7260000000001">We can dispense with a rule that serves no useful purpose.</tspan></text><text x="28" y="694.686" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="716.8780000000002">Keep the particle with the verb. Check a dictionary before changing</tspan><tspan x="28" y="742.4280000000001">its object or word order.</tspan></text><text x="28" y="780.388" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="802.5800000000002">A: How can we prepare a Christmas gathering?</tspan><tspan x="28" y="828.1300000000001">B: We can dispense with a rule that serves no useful purpose.</tspan><tspan x="28" y="853.6800000000002">A: That gives us a starting point.</tspan><tspan x="28" y="879.2300000000001">B: Let us try it together.</tspan></text><text x="28" y="1255.68" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1277.872">For Christmas, explain the meaning before looking at the model</tspan><tspan x="28" y="1303.422">answer. Explain “dispense with” in your own words, then use it in a</tspan><tspan x="28" y="1328.972">sentence about a christmas celebration shaped by care. (Model: It</tspan><tspan x="28" y="1354.5220000000002">means to manage without something unnecessary. Example: We</tspan><tspan x="28" y="1380.0720000000001">can dispense with a rule that serves no useful purpose.)</tspan></text></svg>