<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually make a realistic plan?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/09/04 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#353331"><tspan x="28" y="479.84000000000003">How do you usually make</tspan><tspan x="28" y="539.64">a realistic plan?</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="636.256">An open question that invites a person to</tspan><tspan x="28" y="672.656">describe a familiar experience.</tspan></text><text x="28" y="726.736" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="758.352">How do you usually make a realistic plan?</tspan></text><text x="28" y="812.432" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="844.048">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="880.448">answer, then ask a related follow-up.</tspan></text><text x="28" y="934.528" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="966.144">A: How do you usually make a realistic plan?</tspan><tspan x="28" y="1002.544">B: I treat the plan as provisional, rather than</tspan><tspan x="28" y="1038.944">assuming that its coherence guarantees a</tspan><tspan x="28" y="1075.344">good experience.</tspan><tspan x="28" y="1111.744">A: What has helped you most?</tspan><tspan x="28" y="1148.144">B: For example, we describe one habit that</tspan><tspan x="28" y="1184.5439999999999">helped us instead of calling the whole year</tspan><tspan x="28" y="1220.944">good or bad.</tspan></text><text x="28" y="1275.0240000000001" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1306.6399999999999">Explain the meaning before looking at the</tspan><tspan x="28" y="1343.04">model answer. Write a reply of your own, then</tspan><tspan x="28" y="1379.4399999999998">ask one related question.</tspan></text></svg>