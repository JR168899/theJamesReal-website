<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Consideration becomes visible through practical decisions.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/12/15 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Consideration becomes visible through practical decisions.</title><desc>Original family-manga illustration: plant, related to Consideration becomes visible through practical decisions..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#83cf6e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="41.4" font-weight="700" fill="#2c3540"><tspan x="28" y="473.4">Consideration becomes visible</tspan><tspan x="28" y="525.15">through practical decisions.</tspan></text><text x="28" y="581.4" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="608.76">Care for other people is demonstrated by choices that</tspan><tspan x="28" y="640.26">respond to their actual needs.</tspan></text><text x="28" y="687.06" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="714.42">Thoughtfulness shows in what we do.; Care takes</tspan><tspan x="28" y="745.92">shape in everyday choices.</tspan></text><text x="28" y="792.7199999999999" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="820.0799999999999">For example, we note which window gives the plant</tspan><tspan x="28" y="851.5799999999999">enough light without scorching its leaves.</tspan></text><text x="28" y="898.3799999999999" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="925.7399999999999">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="957.2399999999999">to a specific action in the example, and explain why</tspan><tspan x="28" y="988.7399999999999">you agree or disagree.</tspan></text><text x="28" y="1035.54" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="1062.8999999999999">A: What did we learn from that experience?</tspan><tspan x="28" y="1094.3999999999999">B: Consideration becomes visible through practical</tspan><tspan x="28" y="1125.8999999999999">decisions.</tspan><tspan x="28" y="1157.3999999999999">A: What do you mean?</tspan><tspan x="28" y="1188.8999999999999">B: Care for other people is demonstrated by choices</tspan><tspan x="28" y="1220.3999999999999">that respond to their actual needs.</tspan></text><text x="28" y="1267.2" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="1294.56">Which action in today’s topic illustrates this</tspan><tspan x="28" y="1326.06">reflection? (Model: We note which window gives the</tspan><tspan x="28" y="1357.56">plant enough light without scorching its leaves.)</tspan></text></svg>