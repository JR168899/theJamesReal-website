<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>symbiosis</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/12/15 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A bee and a flowering plant benefit from their interaction.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A bee and a flowering plant benefit from their interaction.</tspan></text><a href="https://www.pexels.com/photo/macro-view-of-bee-on-flower-collecting-pollen-34256469/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34256469</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">symbiosis</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˌsɪmbaɪˈoʊsɪs/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Singular: symbiosis; plural: symbioses.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">a close relationship in which different organisms</tspan><tspan x="28" y="655.1550000000001">or groups interact</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">close biological association; interdependent</tspan><tspan x="28" y="766.6850000000001">relationship</tspan></text><text x="28" y="816.085" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="844.965">The garden offers examples of symbiosis</tspan><tspan x="28" y="878.215">between different organisms.</tspan></text><text x="28" y="927.615" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="956.495">Topic: Growing something small. Write one</tspan><tspan x="28" y="989.745">sentence using this word. Check that your</tspan><tspan x="28" y="1022.995">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1072.395" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1101.2749999999999">A: What does “symbiosis” mean?</tspan><tspan x="28" y="1134.5249999999999">B: It means a close relationship in which different</tspan><tspan x="28" y="1167.7749999999999">organisms or groups interact.</tspan><tspan x="28" y="1201.0249999999999">A: Can we use it in a small garden?</tspan><tspan x="28" y="1234.2749999999999">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1283.675" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1312.5549999999998">Which word means “a close relationship in which</tspan><tspan x="28" y="1345.8049999999998">different organisms or groups interact”: symbiosis</tspan><tspan x="28" y="1379.0549999999998">or phenology? (Model: symbiosis)</tspan></text></svg>