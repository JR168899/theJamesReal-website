<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>stewardship</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/04/19 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">stewardship</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /ˈstuɚdˌʃɪp/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">Usually uncountable: stewardship; no regular plural in this sense.</tspan></text><text x="28" y="589.635" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="617.9069999999999">responsible care for something entrusted to you</tspan></text><text x="28" y="666.2669999999999" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="694.5389999999999">responsible care; careful management</tspan></text><text x="28" y="742.899" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="771.1709999999999">Good stewardship protects the garden for future</tspan><tspan x="28" y="803.7209999999999">visitors.</tspan></text><text x="28" y="852.081" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="880.353">Keep the sense and countability shown in the</tspan><tspan x="28" y="912.9029999999999">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="945.453">the specific person, object or event being discussed.</tspan></text><text x="28" y="993.813" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1022.0849999999999">Aoede: Who owns the community garden?</tspan><tspan x="28" y="1054.635">Echo: That question is different from who exercises</tspan><tspan x="28" y="1087.185">stewardship.</tspan><tspan x="28" y="1119.735">Aoede: What responsibilities does stewardship</tspan><tspan x="28" y="1152.2849999999999">imply?</tspan><tspan x="28" y="1184.835">Echo: Caring for the space and considering those</tspan><tspan x="28" y="1217.385">who will use it after us.</tspan></text><text x="28" y="1265.7450000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1294.017">Explain stewardship as more than possessing a</tspan><tspan x="28" y="1326.567">resource. (Model: It involves responsible care and</tspan><tspan x="28" y="1359.117">regard for its continued use by others.)</tspan></text></svg>