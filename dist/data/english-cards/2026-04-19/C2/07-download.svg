<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/04/19 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives water and care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives water and care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#2d382e"><tspan x="28" y="468.0">I would distinguish between the</tspan><tspan x="28" y="513.0">intention and its consequences.</tspan></text><text x="28" y="559.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="582.236">A proposal to evaluate a person’s purpose separately from the</tspan><tspan x="28" y="608.136">effects of their action.</tspan></text><text x="28" y="646.616" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="669.112">I would separate the aim from the outcome.; We should assess</tspan><tspan x="28" y="695.012">purpose and effects independently.</tspan></text><text x="28" y="733.492" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="755.9879999999999">A: How should we reduce everyday waste?</tspan><tspan x="28" y="781.8879999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="807.7879999999999">consequences.</tspan></text><text x="28" y="846.2679999999999" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="868.7639999999999">Use this phrase in a friendly conversation. Listen to the reply</tspan><tspan x="28" y="894.6639999999999">before asking your next question.</tspan></text><text x="28" y="933.1439999999999" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="955.6399999999999">A: How would you express this idea?</tspan><tspan x="28" y="981.5399999999998">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1007.4399999999998">consequences.</tspan><tspan x="28" y="1033.34">A: What does that mean here?</tspan><tspan x="28" y="1059.2399999999998">B: A proposal to evaluate a person’s purpose separately from</tspan><tspan x="28" y="1085.1399999999999">the effects of their action.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1278.336">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1304.236">When might you say “I would distinguish between the intention</tspan><tspan x="28" y="1330.136">and its consequences.”? (Model: You could say it during an</tspan><tspan x="28" y="1356.036">Earth Day activity, when you want to ask for help or make your</tspan><tspan x="28" y="1381.936">understanding clear.)</tspan></text></svg>