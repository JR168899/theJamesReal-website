<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although / despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382f40"><tspan x="28" y="482.0">Although / despite</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="584.04">Use although before a clause, and despite</tspan><tspan x="28" y="622.54">before a noun phrase or an -ing form, to</tspan><tspan x="28" y="661.04">express contrast.</tspan></text><text x="28" y="718.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="751.68">Although time was limited, we tested the</tspan><tspan x="28" y="790.18">plan. Despite the time limit, we tested it.</tspan></text><text x="28" y="847.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="880.8199999999999">Although the budget was limited; despite</tspan><tspan x="28" y="919.3199999999999">the limited budget; despite having little</tspan><tspan x="28" y="957.8199999999999">time. Do not write despite of.</tspan></text><text x="28" y="1015.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1048.46">A: Did the constraints stop the trial?</tspan><tspan x="28" y="1086.96">B: No. Despite having little time, we</tspan><tspan x="28" y="1125.46">completed it.</tspan><tspan x="28" y="1163.96">A: Did the consultation change the plan?</tspan><tspan x="28" y="1202.46">B: Yes. We revised the entrance and</tspan><tspan x="28" y="1240.96">simplified the labels.</tspan></text><text x="28" y="1298.1599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1331.6">Rewrite with “despite”: Although the budget</tspan><tspan x="28" y="1370.1">was limited, we consulted residents.</tspan></text></svg>