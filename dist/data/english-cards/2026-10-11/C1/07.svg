<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Before we optimise the process, let’s clarify its purpose.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session brings different perspectives together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session brings different perspectives together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="473.86">Before we optimise the</tspan><tspan x="28" y="526.1850000000001">process, let’s clarify its</tspan><tspan x="28" y="578.51">purpose.</tspan></text><text x="28" y="635.385" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="663.0490000000001">A reminder to establish what a process is for before</tspan><tspan x="28" y="694.8990000000001">trying to make it more efficient.</tspan></text><text x="28" y="742.219" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="769.8830000000002">Let’s establish the goal before improving the method.;</tspan><tspan x="28" y="801.7330000000002">First ask what the procedure is meant to achieve.</tspan></text><text x="28" y="849.0530000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="876.7170000000002">Before we optimise the process, let’s clarify its</tspan><tspan x="28" y="908.5670000000002">purpose.</tspan></text><text x="28" y="955.8870000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="983.5510000000003">Optimise concerns how well a process works; clarify</tspan><tspan x="28" y="1015.4010000000003">its purpose asks whether the intended goal is</tspan><tspan x="28" y="1047.2510000000002">understood.</tspan></text><text x="28" y="1094.5710000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1122.2350000000001">A: Could we make the review faster?</tspan><tspan x="28" y="1154.085">B: Yes, but first let’s clarify what it is intended to</tspan><tspan x="28" y="1185.9350000000002">achieve.</tspan><tspan x="28" y="1217.785">A: What is the review supposed to protect?</tspan><tspan x="28" y="1249.6350000000002">B: Accuracy, accessibility, and the chance to</tspan><tspan x="28" y="1281.4850000000001">challenge assumptions.</tspan></text><text x="28" y="1328.8050000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1356.4690000000003">Paraphrase “clarify its purpose”.</tspan></text></svg>