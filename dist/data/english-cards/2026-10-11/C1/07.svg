<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Before we optimise the process, let’s clarify its purpose.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person explains information beside a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person explains information beside a board.</tspan></text><a href="https://www.pexels.com/photo/colleagues-working-and-discussing-inside-an-office-room-7652134/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7652134</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2d382e"><tspan x="28" y="472.02">Before we optimise the</tspan><tspan x="28" y="522.045">process, let’s clarify its</tspan><tspan x="28" y="572.0699999999999">purpose.</tspan></text><text x="28" y="626.445" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="652.8930000000001">A reminder to establish what a process is for before</tspan><tspan x="28" y="683.3430000000002">trying to make it more efficient.</tspan></text><text x="28" y="728.5830000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="755.0310000000002">Let’s establish the goal before improving the method.;</tspan><tspan x="28" y="785.4810000000002">First ask what the procedure is meant to achieve.</tspan></text><text x="28" y="830.7210000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="857.1690000000002">Before we optimise the process, let’s clarify its purpose.</tspan></text><text x="28" y="902.4090000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="928.8570000000002">Optimise is British spelling; optimize is American spelling.</tspan><tspan x="28" y="959.3070000000002">A faster process is not automatically better if it loses its</tspan><tspan x="28" y="989.7570000000002">purpose.</tspan></text><text x="28" y="1034.9970000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1061.4450000000002">A: The new form would make registration two minutes</tspan><tspan x="28" y="1091.8950000000002">faster.</tspan><tspan x="28" y="1122.3450000000003">B: Before we optimise the process, let&#x27;s clarify its</tspan><tspan x="28" y="1152.795">purpose.</tspan><tspan x="28" y="1183.2450000000001">A: Do you mean speed may not be the main objective?</tspan><tspan x="28" y="1213.6950000000002">B: Yes. Clear access for people unfamiliar with the</tspan><tspan x="28" y="1244.1450000000002">system matters too.</tspan></text><text x="28" y="1289.3850000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1315.833">A team measures only registration speed. State another</tspan><tspan x="28" y="1346.2830000000001">relevant purpose and how it could change the design.</tspan></text></svg>