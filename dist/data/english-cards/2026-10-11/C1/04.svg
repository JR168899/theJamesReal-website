<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>build on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">build on</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="568.1220000000001">To use an existing achievement, idea, or</tspan><tspan x="28" y="602.422">resource as a basis for further development.</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="683.1740000000001">develop further; extend</tspan></text><text x="28" y="734.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="763.926">The revised proposal builds on what residents</tspan><tspan x="28" y="798.226">told us.</tspan></text><text x="28" y="849.1859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="878.9780000000001">Build on is inseparable: build on it. It uses an</tspan><tspan x="28" y="913.278">existing idea, resource or achievement as a basis</tspan><tspan x="28" y="947.5780000000001">for development.</tspan></text><text x="28" y="998.5379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1028.33">Kore: Should we discard last month&#x27;s feedback?</tspan><tspan x="28" y="1062.6299999999999">Onyx: The new proposal should build on it.</tspan><tspan x="28" y="1096.9299999999998">Kore: Even the comments that challenge our</tspan><tspan x="28" y="1131.23">idea?</tspan><tspan x="28" y="1165.53">Onyx: Those may be the most useful starting</tspan><tspan x="28" y="1199.83">point.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">Explain how a revised proposal can build on</tspan><tspan x="28" y="1323.772">criticism rather than merely repeat the first</tspan><tspan x="28" y="1358.072">proposal.</tspan></text></svg>