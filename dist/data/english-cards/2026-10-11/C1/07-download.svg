<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Before we optimise the process, let’s clarify its purpose.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person explains information beside a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person explains information beside a board.</tspan></text><a href="https://www.pexels.com/photo/colleagues-working-and-discussing-inside-an-office-room-7652134/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7652134</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="468.8">Before we optimise the process,</tspan><tspan x="28" y="514.8000000000001">let’s clarify its purpose.</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="589.12">A reminder to establish what a process is for before trying to</tspan><tspan x="28" y="617.12">make it more efficient.</tspan></text><text x="28" y="658.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="683.04">Let’s establish the goal before improving the method.; First ask</tspan><tspan x="28" y="711.04">what the procedure is meant to achieve.</tspan></text><text x="28" y="752.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="776.9599999999999">Before we optimise the process, let’s clarify its purpose.</tspan></text><text x="28" y="818.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="842.8799999999999">Optimise is British spelling; optimize is American spelling. A</tspan><tspan x="28" y="870.8799999999999">faster process is not automatically better if it loses its purpose.</tspan></text><text x="28" y="912.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="936.7999999999998">A: The new form would make registration two minutes faster.</tspan><tspan x="28" y="964.7999999999998">B: Before we optimise the process, let&#x27;s clarify its purpose.</tspan><tspan x="28" y="992.7999999999998">A: Do you mean speed may not be the main objective?</tspan><tspan x="28" y="1020.7999999999998">B: Yes. Clear access for people unfamiliar with the system</tspan><tspan x="28" y="1048.7999999999997">matters too.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">A team measures only registration speed. State another</tspan><tspan x="28" y="1309.1200000000001">relevant purpose and how it could change the design. (Model:</tspan><tspan x="28" y="1337.1200000000001">If the purpose includes access for newcomers, the form may</tspan><tspan x="28" y="1365.1200000000001">need clearer guidance even if it takes slightly longer.)</tspan></text></svg>