<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Before we optimise the process, let’s clarify its purpose.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session brings different perspectives together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session brings different perspectives together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="473.4">Before we optimise the</tspan><tspan x="28" y="525.15">process, let’s clarify its</tspan><tspan x="28" y="576.9">purpose.</tspan></text><text x="28" y="633.15" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="660.51">A reminder to establish what a process is for before</tspan><tspan x="28" y="692.01">trying to make it more efficient.</tspan></text><text x="28" y="738.81" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="766.1700000000001">Let’s establish the goal before improving the method.;</tspan><tspan x="28" y="797.6700000000001">First ask what the procedure is meant to achieve.</tspan></text><text x="28" y="844.4699999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="871.8299999999999">Before we optimise the process, let’s clarify its</tspan><tspan x="28" y="903.3299999999999">purpose.</tspan></text><text x="28" y="950.1299999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="977.49">Optimise concerns how well a process works; clarify</tspan><tspan x="28" y="1008.99">its purpose asks whether the intended goal is</tspan><tspan x="28" y="1040.49">understood.</tspan></text><text x="28" y="1087.29" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1114.6499999999999">A: Could we make the review faster?</tspan><tspan x="28" y="1146.1499999999999">B: Yes, but first let’s clarify what it is intended to</tspan><tspan x="28" y="1177.6499999999999">achieve.</tspan><tspan x="28" y="1209.1499999999999">A: What is the review supposed to protect?</tspan><tspan x="28" y="1240.6499999999999">B: Accuracy, accessibility, and the chance to</tspan><tspan x="28" y="1272.1499999999999">challenge assumptions.</tspan></text><text x="28" y="1318.95" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1346.31">Paraphrase “clarify its purpose”. (Model: Make clear</tspan><tspan x="28" y="1377.81">what it is meant to achieve.)</tspan></text></svg>