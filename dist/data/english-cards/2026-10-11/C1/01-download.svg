<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>interdependence</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>interdependence</title><desc>Original family-manga illustration: people, related to interdependence.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#76c6f3"/><path d="M-9 6L9 17L21 3"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.699999999999996" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">interdependence</tspan></text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˌɪntərdɪˈpendəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.9" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Form: interdependence (uncountable)</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">A situation in which people or things depend on</tspan><tspan x="28" y="655.1550000000001">one another.</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">mutual dependence; mutual reliance · These</tspan><tspan x="28" y="766.6850000000001">describe reliance in both directions.</tspan></text><text x="28" y="816.085" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="844.965">The project’s interdependence made isolated</tspan><tspan x="28" y="878.215">planning ineffective.</tspan></text><text x="28" y="927.615" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="956.495">Usually uncountable. Interdependence between</tspan><tspan x="28" y="989.745">teams means one team&#x27;s decisions can affect</tspan><tspan x="28" y="1022.995">another&#x27;s work.</tspan></text><text x="28" y="1072.395" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1101.2749999999999">A: Why did one delay affect three teams?</tspan><tspan x="28" y="1134.5249999999999">B: The level of interdependence was higher than</tspan><tspan x="28" y="1167.7749999999999">we realised.</tspan><tspan x="28" y="1201.0249999999999">A: Would separate deadlines help?</tspan><tspan x="28" y="1234.2749999999999">B: Only if we also made the dependencies</tspan><tspan x="28" y="1267.5249999999999">explicit.</tspan></text><text x="28" y="1316.925" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.599999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1345.8049999999998">Complete: Their mutual reliance reflects a high</tspan><tspan x="28" y="1379.0549999999998">degree of ____. (Model: interdependence)</tspan></text></svg>