<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>interdependence</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="40.71000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="472.71000000000004">interdependence</tspan></text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="507.6675">US /ˌɪntərdɪˈpendəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.470000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="532.5891">Usually uncountable: interdependence; no regular plural in this sense.</tspan></text><text x="28" y="582.0075" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="608.9115">A situation in which people or things depend on one</tspan><tspan x="28" y="639.8865000000001">another.</tspan></text><text x="28" y="685.9065" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="712.8105">mutual dependence; mutual reliance · These describe</tspan><tspan x="28" y="743.7855000000001">reliance in both directions.</tspan></text><text x="28" y="789.8055" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="816.7095">The project’s interdependence made isolated</tspan><tspan x="28" y="847.6845000000001">planning ineffective.</tspan></text><text x="28" y="893.7045" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="920.6085">Usually uncountable. Interdependence between</tspan><tspan x="28" y="951.5835000000001">teams means one team&#x27;s decisions can affect</tspan><tspan x="28" y="982.5585000000001">another&#x27;s work.</tspan></text><text x="28" y="1028.5785" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1055.4825">Kore: Could either team finish the project alone?</tspan><tspan x="28" y="1086.4575">Onyx: No. Their interdependence is built into the</tspan><tspan x="28" y="1117.4325000000001">work.</tspan><tspan x="28" y="1148.4075">Kore: Then one delayed handover affects the other</tspan><tspan x="28" y="1179.3825000000002">team?</tspan><tspan x="28" y="1210.3575">Onyx: Exactly. Their responsibilities cannot be</tspan><tspan x="28" y="1241.3325">understood in isolation.</tspan></text><text x="28" y="1287.3525000000002" font-family="Arial, sans-serif" font-size="14.160000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.780000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1314.2565000000002">Explain interdependence using two teams that need</tspan><tspan x="28" y="1345.2315">each other&#x27;s work. (Model: Each team&#x27;s progress</tspan><tspan x="28" y="1376.2065000000002">depends partly on what the other team provides.)</tspan></text></svg>