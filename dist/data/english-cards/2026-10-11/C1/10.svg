<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Has this changed the way you approach teamwork?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People work together in a shared space.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People work together in a shared space.</tspan></text><a href="https://www.pexels.com/photo/colleagues-working-and-discussing-inside-an-office-room-7652134/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7652134</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">Has this changed the way</tspan><tspan x="28" y="533.43">you approach teamwork?</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="624.4720000000001">A reflective question about whether an</tspan><tspan x="28" y="658.772">experience has influenced someone&#x27;s way of</tspan><tspan x="28" y="693.0720000000001">collaborating.</tspan></text><text x="28" y="744.0319999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="773.8240000000001">Has this project changed the way you approach</tspan><tspan x="28" y="808.124">teamwork?</tspan></text><text x="28" y="859.084" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="888.8760000000001">The present perfect connects a past experience</tspan><tspan x="28" y="923.176">with the person&#x27;s current approach. Invite an</tspan><tspan x="28" y="957.4760000000001">example rather than assuming change occurred.</tspan></text><text x="28" y="1008.4359999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1038.228">A: Has this changed the way you approach</tspan><tspan x="28" y="1072.528">teamwork?</tspan><tspan x="28" y="1106.828">B: Yes. I now ask about expectations much</tspan><tspan x="28" y="1141.1280000000002">earlier.</tspan><tspan x="28" y="1175.428">A: Which expectations would you ask about first?</tspan><tspan x="28" y="1209.728">B: Who can decide, who should be consulted,</tspan><tspan x="28" y="1244.028">and what success means.</tspan></text><text x="28" y="1294.988" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1324.78">Ask a thoughtful follow-up.</tspan></text></svg>