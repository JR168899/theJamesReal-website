<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Has this changed how you approach teamwork?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Volunteers work together to prepare donated supplies.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Volunteers work together to prepare donated supplies.</tspan></text><a href="https://www.pexels.com/photo/two-volunteers-packing-the-charity-goods-6590929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6590929</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#353331"><tspan x="28" y="476.39">Has this changed how you</tspan><tspan x="28" y="531.8774999999999">approach teamwork?</tspan></text><text x="28" y="592.19" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="621.526">An opening that invites a personal preference or</tspan><tspan x="28" y="655.3009999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="705.4810000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="734.817">Has this changed how you approach teamwork?</tspan></text><text x="28" y="784.9970000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="814.333">Follow the answer with a related question. Accept</tspan><tspan x="28" y="848.108">a different preference or a declined invitation</tspan><tspan x="28" y="881.883">without asking the person to justify it.</tspan></text><text x="28" y="932.0630000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="961.399">Kore: Has the workshop changed how you work</tspan><tspan x="28" y="995.174">with other people?</tspan><tspan x="28" y="1028.949">Onyx: I now explain what a handover needs to</tspan><tspan x="28" y="1062.724">include.</tspan><tspan x="28" y="1096.499">Kore: Did that solve every difficulty?</tspan><tspan x="28" y="1130.2740000000001">Onyx: No, but fewer tasks fall between roles.</tspan><tspan x="28" y="1164.049">Kore: What would you try next?</tspan><tspan x="28" y="1197.824">Onyx: Making space for people to say when an</tspan><tspan x="28" y="1231.5990000000002">arrangement is not working.</tspan></text><text x="28" y="1281.779" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1311.115">Invite a concrete example of improved teamwork</tspan><tspan x="28" y="1344.89">without assuming all difficulties have</tspan><tspan x="28" y="1378.665">disappeared.</tspan></text></svg>