<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>see the wood for the trees</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A map shows an overall route while leaving choices about the journey.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A map shows an overall route while leaving choices about the journey.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">see the wood for the trees</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">To recognise the overall situation without</tspan><tspan x="28" y="608.5085">becoming distracted by details.</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="692.1445000000001">see the big picture; keep an overall perspective</tspan></text><text x="28" y="744.9245000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="775.7805000000001">We were so focused on wording that we could</tspan><tspan x="28" y="811.3055">not see the wood for the trees.</tspan></text><text x="28" y="864.0855000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="894.9415000000001">Usually found with can&#x27;t or couldn&#x27;t. This is the</tspan><tspan x="28" y="930.4665000000001">British form; American English commonly uses</tspan><tspan x="28" y="965.9915000000001">forest instead of wood.</tspan></text><text x="28" y="1018.7715000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1049.6275000000003">A: Are these tiny edits helping?</tspan><tspan x="28" y="1085.1525000000004">B: Perhaps we need to step back and see the</tspan><tspan x="28" y="1120.6775000000002">wood for the trees.</tspan><tspan x="28" y="1156.2025000000003">A: What is the exhibition meant to achieve?</tspan><tspan x="28" y="1191.7275000000004">B: It should help residents see their</tspan><tspan x="28" y="1227.2525000000003">experiences represented.</tspan></text><text x="28" y="1280.0325000000003" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1310.8885000000002">What is the equivalent American expression?</tspan><tspan x="28" y="1346.4135000000003">(Model: See the forest for the trees.)</tspan></text></svg>