<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>interdependence</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="42.550000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="474.55">interdependence</tspan></text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="511.0875">US /ˌɪntərdɪˈpendəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.35" font-weight="400" fill="#382d2e"><tspan x="28" y="537.1355">Usually uncountable: interdependence; no regular plural in this</tspan><tspan x="28" y="561.9625">sense.</tspan></text><text x="28" y="613.6144999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.7344999999999">A situation in which people or things depend on one</tspan><tspan x="28" y="674.1094999999999">another.</tspan></text><text x="28" y="722.2094999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="750.3294999999999">mutual dependence; mutual reliance · These</tspan><tspan x="28" y="782.7044999999999">describe reliance in both directions.</tspan></text><text x="28" y="830.8045" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="858.9245">The project’s interdependence made isolated</tspan><tspan x="28" y="891.2995">planning ineffective.</tspan></text><text x="28" y="939.3995" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="967.5195">Usually uncountable. Interdependence between</tspan><tspan x="28" y="999.8945">teams means one team&#x27;s decisions can affect</tspan><tspan x="28" y="1032.2694999999999">another&#x27;s work.</tspan></text><text x="28" y="1080.3695" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1108.4895000000001">A: Could either team finish the project alone?</tspan><tspan x="28" y="1140.8645000000001">B: No. Their interdependence is built into the work.</tspan><tspan x="28" y="1173.2395000000001">A: Then one delayed handover affects the other</tspan><tspan x="28" y="1205.6145000000001">team?</tspan><tspan x="28" y="1237.9895000000001">B: Exactly. Their responsibilities cannot be</tspan><tspan x="28" y="1270.3645000000001">understood in isolation.</tspan></text><text x="28" y="1318.4645" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1346.5845000000002">Explain interdependence using two teams that need</tspan><tspan x="28" y="1378.9595000000002">each other&#x27;s work.</tspan></text></svg>