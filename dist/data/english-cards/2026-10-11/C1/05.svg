<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>see the wood for the trees</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group develops a shared plan around a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group develops a shared plan around a board.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">see the wood for the trees</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">To recognise the overall situation without</tspan><tspan x="28" y="607.6389999999999">becoming distracted by details.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="690.8629999999999">see the big picture; keep an overall perspective</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="774.0869999999999">We were so focused on wording that we could</tspan><tspan x="28" y="809.4369999999999">not see the wood for the trees.</tspan></text><text x="28" y="861.957" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="892.661">Chiefly British; American English commonly</tspan><tspan x="28" y="928.011">uses see the forest for the trees. Both contrast</tspan><tspan x="28" y="963.361">detail with the larger picture.</tspan></text><text x="28" y="1015.881" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1046.585">A: We have spent an hour comparing fonts.</tspan><tspan x="28" y="1081.935">B: Are we losing the ability to see the wood for</tspan><tspan x="28" y="1117.285">the trees?</tspan><tspan x="28" y="1152.635">A: Perhaps. The real question is whether</tspan><tspan x="28" y="1187.9850000000001">people can find the entrance.</tspan><tspan x="28" y="1223.335">B: Then let us test the sign on the street.</tspan></text><text x="28" y="1275.8550000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1306.5590000000002">A team debates fonts while visitors cannot find</tspan><tspan x="28" y="1341.909">the door. Identify the larger issue they are</tspan><tspan x="28" y="1377.2590000000002">overlooking.</tspan></text></svg>