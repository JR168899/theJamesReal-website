<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>meet halfway</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#383426"><tspan x="28" y="475.47">meet halfway</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">To reach a compromise in which both sides make</tspan><tspan x="28" y="596.3355000000001">concessions.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="674.2035000000001">compromise; find middle ground</tspan></text><text x="28" y="723.3435000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="752.0715000000001">Both teams agreed to meet halfway on the format.</tspan></text><text x="28" y="801.2115" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="829.9395000000001">Figurative meeting halfway means mutual</tspan><tspan x="28" y="863.0145000000001">compromise. It need not concern a geographical</tspan><tspan x="28" y="896.0895">midpoint.</tspan></text><text x="28" y="945.2295" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="973.9575000000001">Kore: I cannot leave as early as you want.</tspan><tspan x="28" y="1007.0325000000001">Onyx: Could we meet halfway and take the ten-thirty</tspan><tspan x="28" y="1040.1075">train?</tspan><tspan x="28" y="1073.1825000000001">Kore: That would let me finish work first.</tspan><tspan x="28" y="1106.2575000000002">Onyx: And still give us an afternoon at the coast.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Suggest a compromise between a ten o&#x27;clock</tspan><tspan x="28" y="1320.923">departure and an eleven o&#x27;clock departure. (Model:</tspan><tspan x="28" y="1353.998">Could we meet halfway and leave at ten thirty?)</tspan></text></svg>