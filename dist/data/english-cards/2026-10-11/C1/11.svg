<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Making disagreement productive</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-10-11</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Making disagreement productive</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Making disagreement productive</title><desc>Original hand-drawn story illustration: book, set within conversation. Why constructive disagreement can strengthen collective judgement.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(2) scale(1.4)"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#a8bbaa"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><g transform="translate(94 266) rotate(-2) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Making disagreement productive</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">Collaboration gains value from</tspan><tspan x="36" dy="23.459999999999997">constructive disagreement, not</tspan><tspan x="36" dy="23.459999999999997">merely smooth agreement. Two</tspan><tspan x="36" dy="23.459999999999997">conditions make dissent</tspan><tspan x="36" dy="23.459999999999997">productive: a shared purpose that</tspan><tspan x="36" dy="23.459999999999997">disciplines the discussion and</tspan><tspan x="36" dy="23.459999999999997">relevant evidence that helps</tspan><tspan x="36" dy="23.459999999999997">participants revise their views.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">A shared purpose gives</tspan><tspan x="384" dy="23.459999999999997">disagreement a useful boundary.</tspan><tspan x="384" dy="23.459999999999997">In a community exhibition</tspan><tspan x="384" dy="23.459999999999997">project, debates about the format</tspan><tspan x="384" dy="23.459999999999997">initially reflected personal</tspan><tspan x="384" dy="23.459999999999997">preferences. Once the team agreed</tspan><tspan x="384" dy="23.459999999999997">that residents’ access mattered</tspan><tspan x="384" dy="23.459999999999997">most, we could distinguish</tspan><tspan x="384" dy="23.459999999999997">essential requirements from</tspan><tspan x="384" dy="23.459999999999997">choices open to negotiation.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Evidence then turns that common</tspan><tspan x="732" dy="23.459999999999997">purpose into better decisions.</tspan><tspan x="732" dy="23.459999999999997">Residents’ feedback revealed that</tspan><tspan x="732" dy="23.459999999999997">the proposed layout was difficult</tspan><tspan x="732" dy="23.459999999999997">to navigate. This concrete</tspan><tspan x="732" dy="23.459999999999997">finding allowed us to reconcile</tspan><tspan x="732" dy="23.459999999999997">accessibility with creative</tspan><tspan x="732" dy="23.459999999999997">ambitions, replacing competing</tspan><tspan x="732" dy="23.459999999999997">tastes with a problem we could</tspan><tspan x="732" dy="23.459999999999997">solve together.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Constructive disagreement thus</tspan><tspan x="1080" dy="23.459999999999997">depends on both common aims and a</tspan><tspan x="1080" dy="23.459999999999997">willingness to respond to</tspan><tspan x="1080" dy="23.459999999999997">evidence. Consensus is more</tspan><tspan x="1080" dy="23.459999999999997">valuable when it emerges from</tspan><tspan x="1080" dy="23.459999999999997">this inquiry. Good collaboration</tspan><tspan x="1080" dy="23.459999999999997">makes the reasoning behind</tspan><tspan x="1080" dy="23.459999999999997">agreement visible rather than</tspan><tspan x="1080" dy="23.459999999999997">treating agreement itself as</tspan><tspan x="1080" dy="23.459999999999997">proof of success.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · According to the essay, what makes disagreement productive?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>