<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although / despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People continue a city journey in rainy weather.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People continue a city journey in rainy weather.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382f40"><tspan x="28" y="472.02">Although / despite</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="552.8430000000001">Use although before a clause, and despite before a noun</tspan><tspan x="28" y="583.2930000000001">phrase or an -ing form, to express contrast.</tspan></text><text x="28" y="628.533" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="654.9810000000001">Although time was limited, we tested the plan. Despite</tspan><tspan x="28" y="685.4310000000002">the time limit, we tested it.</tspan></text><text x="28" y="730.671" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="757.1190000000001">Although + clause; despite + noun phrase or -ing form. A</tspan><tspan x="28" y="787.5690000000002">different structure is needed after each connector.</tspan></text><text x="28" y="832.8090000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="859.2570000000002">A: Did the time limit prevent testing?</tspan><tspan x="28" y="889.7070000000002">B: Although time was limited, we tested the plan.</tspan><tspan x="28" y="920.1570000000002">A: So the main checks were completed?</tspan><tspan x="28" y="950.6070000000002">B: Yes, despite the short session.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382f40"><tspan x="28" y="1284.368">Choose the grammatical option and explain: Although the</tspan><tspan x="28" y="1314.818">short session / Despite the short session, we completed</tspan><tspan x="28" y="1345.268">the checks. (Model: Despite the short session is</tspan><tspan x="28" y="1375.7179999999998">grammatical because it is followed by a noun phrase.)</tspan></text></svg>