<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although / despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/11 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382f40"><tspan x="28" y="478.69">Although / despite</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="572.9835">Use although before a clause, and despite</tspan><tspan x="28" y="608.5085">before a noun phrase or an -ing form, to</tspan><tspan x="28" y="644.0335">express contrast.</tspan></text><text x="28" y="696.8135000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="727.6695000000001">Although time was limited, we tested the plan.</tspan><tspan x="28" y="763.1945000000001">Despite the time limit, we tested it.</tspan></text><text x="28" y="815.9745000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="846.8305000000001">Although the budget was limited; despite the</tspan><tspan x="28" y="882.3555000000001">limited budget; despite having little time. Do not</tspan><tspan x="28" y="917.8805000000002">write despite of.</tspan></text><text x="28" y="970.6605000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="1001.5165000000002">A: Did the constraints stop the trial?</tspan><tspan x="28" y="1037.0415000000003">B: No. Despite having little time, we completed</tspan><tspan x="28" y="1072.5665000000001">it.</tspan><tspan x="28" y="1108.0915000000002">A: Did the consultation change the plan?</tspan><tspan x="28" y="1143.6165">B: Yes. We revised the entrance and simplified</tspan><tspan x="28" y="1179.1415000000002">the labels.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382f40"><tspan x="28" y="1291.096">Rewrite with “despite”: Although the budget was</tspan><tspan x="28" y="1326.621">limited, we consulted residents. (Model: Despite</tspan><tspan x="28" y="1362.146">the limited budget, we consulted residents.)</tspan></text></svg>