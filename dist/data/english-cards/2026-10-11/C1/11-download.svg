<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Making disagreement productive</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-10-11 · C1 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>Making disagreement productive</title><desc>Original family-manga illustration: book, related to Making disagreement productive.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">Making disagreement productive</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="157.0">Collaboration gains value from constructive disagreement, not merely smooth agreement. Two conditions make</tspan><tspan x="42" y="180.4">dissent productive: a shared purpose that disciplines the discussion and relevant evidence that helps participants</tspan><tspan x="42" y="203.8">revise their views.</tspan></text><text x="42" y="241.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="266.2">A shared purpose gives disagreement a useful boundary. In a community exhibition project, debates about the format initially reflected personal</tspan><tspan x="42" y="289.59999999999997">preferences. Once the team agreed that residents’ access mattered most, we could distinguish essential requirements from choices open to</tspan><tspan x="42" y="313.0">negotiation.</tspan></text><text x="42" y="350.4" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="375.4">Evidence then turns that common purpose into better decisions. Residents’ feedback revealed that the proposed layout was difficult to navigate. This</tspan><tspan x="42" y="398.79999999999995">concrete finding allowed us to reconcile accessibility with creative ambitions, replacing competing tastes with a problem we could solve together.</tspan></text><text x="42" y="436.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="461.2">Constructive disagreement thus depends on both common aims and a willingness to respond to evidence. Consensus is more valuable when it emerges</tspan><tspan x="42" y="484.59999999999997">from this inquiry. Good collaboration makes the reasoning behind agreement visible rather than treating agreement itself as proof of success.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="540.0">BUILD YOUR OWN · State two conditions for productive dissent. Develop shared purpose and evidence in separate example-led paragraphs. Synthesise their</tspan><tspan x="42" y="562.0">contribution to sound agreement. Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="584.0">According to the essay, what makes disagreement productive? (Model: A shared purpose, a distinction between requirements and preferences, and visible reasoning</tspan><tspan x="42" y="606.0">help turn disagreement into useful inquiry.)</tspan></text></svg>