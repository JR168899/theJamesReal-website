<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Good collaboration makes disagreement usable.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - Quote</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#2c3540">2026-10-11 · C1 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Good collaboration makes disagreement usable.</title><desc>Original family-manga illustration: light, related to Good collaboration makes disagreement usable..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-31-33Q-31-68 0-68Q32-68 32-33Q32-11 15 3V28H-15V3Q-31-11-31-33Z" fill="#e5c47d"/><path d="M-15 13H15M-14 37H14M-8 45H8M0-87V-100M-48-73L-59-84M48-73L59-84M-60-38H-78M60-38H78"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.54" font-weight="700" fill="#2c3540"><tspan x="28" y="477.54">Good collaboration makes</tspan><tspan x="28" y="534.465">disagreement usable.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="626.436">Constructive cooperation can turn differences of</tspan><tspan x="28" y="661.086">opinion into useful insight.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="742.662">Constructive cooperation can turn differences of</tspan><tspan x="28" y="777.312">opinion into useful insight</tspan></text><text x="28" y="828.792" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="858.888">Different views helped us identify a weak</tspan><tspan x="28" y="893.538">assumption. Good collaboration makes</tspan><tspan x="28" y="928.188">disagreement usable.</tspan></text><text x="28" y="979.668" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="1009.764">This is an original practice reflection. Usable</tspan><tspan x="28" y="1044.414">suggests disagreement can inform a decision,</tspan><tspan x="28" y="1079.064">not that every objection is correct.</tspan></text><text x="28" y="1130.5439999999999" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="1160.6399999999999">A: I thought disagreement would slow us down.</tspan><tspan x="28" y="1195.29">B: It helped us ask a better question.</tspan><tspan x="28" y="1229.9399999999998">A: What made the objection useful?</tspan><tspan x="28" y="1264.59">B: It pointed to a need we had not yet</tspan><tspan x="28" y="1299.2399999999998">considered.</tspan></text><text x="28" y="1350.7199999999998" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="1380.8159999999998">Explain how disagreement can help a project.</tspan></text></svg>