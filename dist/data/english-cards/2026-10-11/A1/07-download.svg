<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let’s make lunch together.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#2d382e"><tspan x="28" y="479.38">Let’s make lunch together.</tspan></text><text x="28" y="543.755" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="575.067">A friendly way to ask someone to make lunch</tspan><tspan x="28" y="611.117">with you.</tspan></text><text x="28" y="664.677" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="695.989">Shall we prepare lunch as a team?; Would you</tspan><tspan x="28" y="732.039">like to help me cook lunch?</tspan></text><text x="28" y="785.599" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="816.9110000000001">Let’s make lunch together.</tspan></text><text x="28" y="870.471" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="901.783">Let&#x27;s suggests doing something together. It is</tspan><tspan x="28" y="937.833">different from telling the other person to do the</tspan><tspan x="28" y="973.883">whole task.</tspan></text><text x="28" y="1027.443" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="1058.7549999999999">Heart: Let&#x27;s make lunch together.</tspan><tspan x="28" y="1094.8049999999998">Puck: Good idea. What can I do?</tspan><tspan x="28" y="1130.8549999999998">Heart: You can wash the vegetables.</tspan><tspan x="28" y="1166.905">Puck: And you can make the soup.</tspan></text><text x="28" y="1260.48" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#2d382e"><tspan x="28" y="1291.792">Invite someone to make lunch and give them</tspan><tspan x="28" y="1327.8419999999999">one clear task. (Model: Let&#x27;s make lunch</tspan><tspan x="28" y="1363.8919999999998">together. Could you wash the vegetables?)</tspan></text></svg>