<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Lunch with a friend</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/10/11 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">People share a meal and conversation.</tspan></text><a href="https://www.pexels.com/photo/plate-of-food-served-on-the-table-9220890/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 9220890</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Lunch with a friend</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="167.0">Lunch with my friend Mia is fun. We make food and help each other.</tspan></text><text x="42" y="200.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="235.1">First, we make lunch together. I wash an apple. Mia makes two</tspan><tspan x="42" y="270.2">sandwiches. We sit down and share the food.</tspan></text><text x="42" y="303.29999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="338.29999999999995">We also help each other. After lunch, Mia washes the cups. I put them</tspan><tspan x="42" y="373.4">away. She is a big help.</tspan></text><text x="42" y="406.49999999999994" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="441.49999999999994">Lunch with Mia is a good time. We have nice food and work together. I am</tspan><tspan x="42" y="476.5999999999999">happy with my friend.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="527.6999999999999">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="549.66">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="571.6199999999999">argument rather than introduce a new proposal.</tspan><tspan x="42" y="593.5799999999999">Ask a friend to help you share a meal. Explain two things you can do together. Use four short paragraphs: introduction, two</tspan><tspan x="42" y="615.54">developed points, and conclusion.</tspan></text></svg>