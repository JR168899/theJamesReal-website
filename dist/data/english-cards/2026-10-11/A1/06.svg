"Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="803.8199999999999">“Thank you!” “No problem!”</tspan></text><text x="28" y="861.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="894.4599999999999">Use it after a request or after Thank you.</tspan></text><text x="28" y="951.66" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="985.0999999999999">A: Can you help me?</tspan><tspan x="28" y="1023.5999999999999">B: No problem.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1295.04">Reply to “Thank you!” with this expression.</tspan></text></svg>