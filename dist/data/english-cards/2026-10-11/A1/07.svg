<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let’s make lunch together.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A1 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="480.99">Let’s make lunch</tspan><tspan x="28" y="542.2275">together.</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="641.166">A friendly way to ask someone to make</tspan><tspan x="28" y="678.441">lunch with you.</tspan></text><text x="28" y="733.821" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="766.1970000000001">Shall we prepare lunch as a team?; Would</tspan><tspan x="28" y="803.4720000000001">you like to help me cook lunch?</tspan></text><text x="28" y="858.8520000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="891.2280000000002">Let’s make lunch together.</tspan></text><text x="28" y="946.6080000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="978.9840000000002">Let&#x27;s suggests doing something together. It is</tspan><tspan x="28" y="1016.2590000000001">different from telling the other person to do</tspan><tspan x="28" y="1053.534">the whole task.</tspan></text><text x="28" y="1108.9140000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1141.2900000000002">A: Let&#x27;s make lunch together.</tspan><tspan x="28" y="1178.5650000000003">B: Good idea. What can I do?</tspan><tspan x="28" y="1215.8400000000001">A: You can wash the vegetables.</tspan><tspan x="28" y="1253.1150000000002">B: And you can make the soup.</tspan></text><text x="28" y="1308.4950000000003" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1340.8710000000003">Invite someone to make lunch and give them</tspan><tspan x="28" y="1378.1460000000004">one clear task.</tspan></text></svg>