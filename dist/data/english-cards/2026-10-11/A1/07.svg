<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let’s make lunch together.</title><rect width="660" height="1434" fill="#dce6d8"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2d382e" stroke-width="1"/><text x="35" y="43" fill="#2d382e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A1   2026-10-11</tspan></text><text x="35" y="88" fill="#2d382e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">Let’s make lunch together.</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>Let’s make lunch together.</title><desc>Original hand-drawn story illustration: people, set within conversation. A friendly way to ask someone to make lunch with you.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(2) scale(1.4)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><g transform="translate(94 266) rotate(-2) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Let’s make lunch together.</text></svg><text x="35" y="514.4" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A friendly way to ask someone to make lunch with you.</tspan></text><text x="35" y="590.8" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Let’s make lunch together.</tspan></text><text x="35" y="667.1999999999999" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Use Let&#x27;s + a verb: Let&#x27;s cook. Let&#x27;s eat. Let&#x27;s share.</tspan></text><text x="35" y="743.5999999999999" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="768.1599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: I am hungry.</tspan><tspan x="35" dy="24.839999999999996">B: Let’s make lunch together.</tspan></text><text x="35" y="844.8399999999998" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="869.3999999999997" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: Let’s ____ lunch together.</tspan></text><text x="35" y="1406" fill="#2d382e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">DAILY   /   07 OF 11</tspan></text></svg>