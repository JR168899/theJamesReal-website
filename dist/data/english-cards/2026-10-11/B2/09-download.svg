<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If we had…, we could…</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="473.86">If we had…, we could…</tspan></text><text x="28" y="530.7349999999999" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="558.399">Use if + past simple and could + a verb to discuss an</tspan><tspan x="28" y="590.249">imagined situation and a possible result.</tspan></text><text x="28" y="637.569" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="665.2330000000001">If we had a larger room, we could include more</tspan><tspan x="28" y="697.0830000000001">exhibits.</tspan></text><text x="28" y="744.403" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="772.0670000000001">If + past simple can present an unreal or hypothetical</tspan><tspan x="28" y="803.9170000000001">current situation; could expresses a possible result,</tspan><tspan x="28" y="835.7670000000002">not a guarantee.</tspan></text><text x="28" y="883.087" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="910.7510000000001">Aoede: Could we include another display?</tspan><tspan x="28" y="942.6010000000001">Echo: If we had a larger room, we could.</tspan><tspan x="28" y="974.4510000000001">Aoede: But the current room is already full.</tspan><tspan x="28" y="1006.3010000000002">Echo: Then we should not promise the extra display.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1286.224">You do not have a larger room. Rewrite A larger room</tspan><tspan x="28" y="1318.0739999999998">would let us add seating using If we had. (Model: If</tspan><tspan x="28" y="1349.924">we had a larger room, we could add seating.)</tspan></text></svg>