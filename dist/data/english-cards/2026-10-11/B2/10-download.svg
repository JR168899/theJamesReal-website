<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been the most rewarding part so far?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People work together on a shared outdoor task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People work together on a shared outdoor task.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#353331"><tspan x="28" y="479.84000000000003">What has been the most</tspan><tspan x="28" y="539.64">rewarding part so far?</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="636.256">A friendly question about what has felt most</tspan><tspan x="28" y="672.656">worthwhile during a project.</tspan></text><text x="28" y="726.736" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="758.352">What has been the most rewarding part of the</tspan><tspan x="28" y="794.752">project so far?</tspan></text><text x="28" y="848.832" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="880.448">So far means from the start until now.</tspan><tspan x="28" y="916.848">Rewarding asks about satisfaction, rather than</tspan><tspan x="28" y="953.2479999999999">financial payment.</tspan></text><text x="28" y="1007.328" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1038.944">A: What has been the most rewarding part so</tspan><tspan x="28" y="1075.344">far?</tspan><tspan x="28" y="1111.744">B: Seeing ideas from different people come</tspan><tspan x="28" y="1148.144">together.</tspan><tspan x="28" y="1184.5439999999999">A: Was there a moment when that became</tspan><tspan x="28" y="1220.944">clear?</tspan><tspan x="28" y="1257.344">B: Yes, during the first trial run with visitors.</tspan></text><text x="28" y="1311.4240000000002" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1343.04">Ask a follow-up about a challenge. (Model:</tspan><tspan x="28" y="1379.44">What has been the biggest challenge so far?)</tspan></text></svg>