<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People work together in a shared space.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People work together in a shared space.</tspan></text><a href="https://www.pexels.com/photo/colleagues-working-and-discussing-inside-an-office-room-7652134/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7652134</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="477.54">What would make this plan</tspan><tspan x="28" y="534.465">workable for everyone?</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="626.436">A question inviting people to identify changes</tspan><tspan x="28" y="661.086">that would make a plan practical.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="742.662">How could we adapt the plan to suit the group?;</tspan><tspan x="28" y="777.312">What changes would make this practical for all</tspan><tspan x="28" y="811.962">of us?</tspan></text><text x="28" y="863.4420000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="893.5380000000001">What would make this plan workable for</tspan><tspan x="28" y="928.1880000000001">everyone involved?</tspan></text><text x="28" y="979.6680000000001" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1009.7640000000001">Workable means possible to carry out. The</tspan><tspan x="28" y="1044.4140000000002">question invites solutions without assuming</tspan><tspan x="28" y="1079.064">everyone has the same needs.</tspan></text><text x="28" y="1130.544" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1160.64">A: Some volunteers cannot arrive early.</tspan><tspan x="28" y="1195.2900000000002">B: What would make this plan workable for</tspan><tspan x="28" y="1229.94">everyone?</tspan><tspan x="28" y="1264.5900000000001">A: Could we divide the setup into two shifts?</tspan><tspan x="28" y="1299.2400000000002">B: That would let more people take part.</tspan></text><text x="28" y="1350.72" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1380.816">Replace “possible to carry out” with one word.</tspan></text></svg>