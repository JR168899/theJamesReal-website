<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#dce6d8"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2d382e" stroke-width="1"/><text x="35" y="43" fill="#2d382e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-11</tspan></text><text x="35" y="88" fill="#2d382e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">What would make this plan workable</tspan><tspan x="35" dy="41.4">for everyone?</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>What would make this plan workable for everyone?</title><desc>Original hand-drawn story illustration: desk, set within conversation. A question inviting people to identify changes that would make a plan practical.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">What would make this plan workable for everyone?</text></svg><text x="35" y="555.8" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A question inviting people to identify changes that would</tspan><tspan x="35" dy="24.839999999999996">make a plan practical.</tspan></text><text x="35" y="657.0399999999998" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="681.5999999999998" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">What would make this plan workable for everyone involved?</tspan></text><text x="35" y="733.4399999999998" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="757.9999999999998" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Workable means possible to carry out. The question invites</tspan><tspan x="35" dy="24.839999999999996">solutions without assuming everyone has the same needs.</tspan></text><text x="35" y="834.6799999999997" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="859.2399999999997" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Some volunteers cannot arrive early.</tspan><tspan x="35" dy="24.839999999999996">B: What would make this plan workable for everyone?</tspan><tspan x="35" dy="24.839999999999996">A: Could we divide the setup into two shifts?</tspan><tspan x="35" dy="24.839999999999996">B: That would let more people take part.</tspan></text><text x="35" y="985.5999999999997" fill="#2d382e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1010.1599999999996" fill="#2d382e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Replace “possible to carry out” with one word.</tspan></text><text x="35" y="1406" fill="#2d382e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">DAILY   /   07 OF 11</tspan></text></svg>