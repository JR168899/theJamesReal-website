<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener gives attention to another speaker.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener gives attention to another speaker.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="474.32">What would make this plan</tspan><tspan x="28" y="527.22">workable for everyone?</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="612.688">A question inviting people to identify changes that</tspan><tspan x="28" y="644.888">would make a plan practical.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="720.696">How could we adapt the plan to suit the group?; What</tspan><tspan x="28" y="752.8960000000001">changes would make this practical for all of us?</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="828.7040000000001">What would make this plan workable for everyone</tspan><tspan x="28" y="860.9040000000001">involved?</tspan></text><text x="28" y="908.7440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="936.7120000000001">Workable means possible to carry out in practice.</tspan><tspan x="28" y="968.9120000000001">Invite constraints and specific adjustments, not</tspan><tspan x="28" y="1001.1120000000001">merely a general vote of approval.</tspan></text><text x="28" y="1048.9520000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1076.9200000000003">A: The afternoon slot works for most people.</tspan><tspan x="28" y="1109.1200000000003">B: What would make this plan workable for</tspan><tspan x="28" y="1141.3200000000004">everyone?</tspan><tspan x="28" y="1173.5200000000002">A: One volunteer cannot arrive before three.</tspan><tspan x="28" y="1205.7200000000003">B: We could give her the later shift and confirm cover</tspan><tspan x="28" y="1237.9200000000003">for the opening.</tspan></text><text x="28" y="1285.7600000000002" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2d382e"><tspan x="28" y="1313.7280000000003">A volunteer cannot arrive before three. Propose a</tspan><tspan x="28" y="1345.9280000000003">change that preserves coverage without dismissing</tspan><tspan x="28" y="1378.1280000000004">the constraint.</tspan></text></svg>