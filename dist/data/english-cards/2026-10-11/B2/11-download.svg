<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A good plan makes room for people</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-10-11 · B2 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>A good plan makes room for people</title><desc>Original family-manga illustration: room, related to A good plan makes room for people.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">A good plan makes room for people</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="160.0">A good collaborative plan should provide direction while leaving room for change. Preparing a small</tspan><tspan x="42" y="186.91">exhibition at our neighbourhood library taught us that shared priorities and practical testing make this</tspan><tspan x="42" y="213.82">balance possible.</tspan></text><text x="42" y="251.73" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="279.73">First, agreeing on constraints gives a team a useful starting point. With a narrow room and a modest budget, we mapped out the</tspan><tspan x="42" y="306.64">visitor’s journey before choosing displays. This shared reference point helped us decide which ideas were workable.</tspan></text><text x="42" y="344.54999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="372.54999999999995">Second, testing a plan makes flexibility practical. Our trial run revealed that the entrance would become crowded. We moved the</tspan><tspan x="42" y="399.4599999999999">introductory panel further inside, solving the problem before it required a costly last-minute change.</tspan></text><text x="42" y="437.36999999999995" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="465.36999999999995">Effective coordination therefore combines clear priorities with opportunities to adjust. By making decisions visible and checking in</tspan><tspan x="42" y="492.28">before the deadline, a team can remain organised without becoming rigid. That is what makes a plan work for people.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="548.1899999999999">BUILD YOUR OWN · Thesis: direction plus flexibility. Body 1: shared priorities, with a planning example. Body 2: testing, with a revision example. Conclude by</tspan><tspan x="42" y="570.1899999999999">connecting both. Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="592.1899999999999">What did the trial run reveal, and how did the team respond? (Model: It revealed that the entrance would become crowded. The team moved the introductory panel further</tspan><tspan x="42" y="614.1899999999999">inside.)</tspan></text></svg>