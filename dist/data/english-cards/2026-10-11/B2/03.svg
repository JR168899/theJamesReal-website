<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>map out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers trace a route on a map.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers trace a route on a map.</tspan></text><a href="https://www.pexels.com/photo/unrecognizable-man-examining-map-while-planning-travel-at-home-6108074/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6108074</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="480.99">map something out</tspan><tspan x="28" y="542.2275">map out something</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="641.166">To plan something in detail before doing it.</tspan></text><text x="28" y="696.5459999999999" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="728.922">plan in detail; chart</tspan></text><text x="28" y="784.3019999999999" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="816.678">Let’s map out the visitor’s journey before</tspan><tspan x="28" y="853.953">designing signs.</tspan></text><text x="28" y="909.333" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="941.7090000000001">Map out is separable: map the route out /</tspan><tspan x="28" y="978.984">map it out. It can refer to a detailed plan, not</tspan><tspan x="28" y="1016.259">only a physical map.</tspan></text><text x="28" y="1071.6390000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1104.015">A: Shall we start designing the signs?</tspan><tspan x="28" y="1141.2900000000002">B: Let us map out the visitor&#x27;s route first.</tspan><tspan x="28" y="1178.565">A: From the entrance to the exit?</tspan><tspan x="28" y="1215.8400000000001">B: Yes, including the points where someone</tspan><tspan x="28" y="1253.1150000000002">might need help.</tspan></text><text x="28" y="1308.4950000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1340.871">Before designing signs, identify two parts of</tspan><tspan x="28" y="1378.1460000000002">a visitor&#x27;s route worth mapping out.</tspan></text></svg>