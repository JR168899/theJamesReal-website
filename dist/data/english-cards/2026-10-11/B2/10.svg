<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What has been the most rewarding part so far?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#353331"><tspan x="28" y="476.39">What has been the most</tspan><tspan x="28" y="531.8774999999999">rewarding part so far?</tspan></text><text x="28" y="592.19" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="621.526">An opening that invites a personal preference or</tspan><tspan x="28" y="655.3009999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="705.4810000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="734.817">What has been the most rewarding part so far?</tspan></text><text x="28" y="784.9970000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="814.333">Follow the answer with a related question. Accept</tspan><tspan x="28" y="848.108">a different preference or a declined invitation</tspan><tspan x="28" y="881.883">without asking the person to justify it.</tspan></text><text x="28" y="932.0630000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="961.399">A: What has been the most rewarding part of the</tspan><tspan x="28" y="995.174">garden project?</tspan><tspan x="28" y="1028.949">B: Seeing people return and help one another.</tspan><tspan x="28" y="1062.724">A: Not just watching the plants grow?</tspan><tspan x="28" y="1096.499">B: That matters too, but the connections were the</tspan><tspan x="28" y="1130.2740000000001">surprise.</tspan><tspan x="28" y="1164.049">A: Was there a moment when you noticed that</tspan><tspan x="28" y="1197.824">change?</tspan><tspan x="28" y="1231.5990000000002">B: When a new volunteer came back simply to</tspan><tspan x="28" y="1265.374">check on someone else.</tspan></text><text x="28" y="1315.554" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1344.89">Ask a follow-up about a specific moment that</tspan><tspan x="28" y="1378.6650000000002">made a project feel rewarding.</tspan></text></svg>