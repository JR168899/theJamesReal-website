<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener gives attention to another speaker.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener gives attention to another speaker.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#2d382e"><tspan x="28" y="472.94">What would make this plan</tspan><tspan x="28" y="524.115">workable for everyone?</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="606.7959999999999">A question inviting people to identify changes that</tspan><tspan x="28" y="637.9459999999999">would make a plan practical.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="711.2819999999999">How could we adapt the plan to suit the group?; What</tspan><tspan x="28" y="742.4319999999999">changes would make this practical for all of us?</tspan></text><text x="28" y="788.712" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="815.7679999999999">What would make this plan workable for everyone</tspan><tspan x="28" y="846.9179999999999">involved?</tspan></text><text x="28" y="893.198" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="920.2539999999999">Workable means possible to carry out in practice.</tspan><tspan x="28" y="951.4039999999999">Invite constraints and specific adjustments, not</tspan><tspan x="28" y="982.5539999999999">merely a general vote of approval.</tspan></text><text x="28" y="1028.834" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="1055.89">Aoede: The afternoon slot works for most people.</tspan><tspan x="28" y="1087.0400000000002">Echo: What would make this plan workable for</tspan><tspan x="28" y="1118.19">everyone?</tspan><tspan x="28" y="1149.3400000000001">Aoede: One volunteer cannot arrive before three.</tspan><tspan x="28" y="1180.4900000000002">Echo: We could give her the later shift and confirm</tspan><tspan x="28" y="1211.64">cover for the opening.</tspan></text><text x="28" y="1258.24" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2d382e"><tspan x="28" y="1285.296">A volunteer cannot arrive before three. Propose a</tspan><tspan x="28" y="1316.4460000000001">change that preserves coverage without dismissing</tspan><tspan x="28" y="1347.596">the constraint. (Model: Assign her the later shift and</tspan><tspan x="28" y="1378.746">arrange cover for the opening.)</tspan></text></svg>