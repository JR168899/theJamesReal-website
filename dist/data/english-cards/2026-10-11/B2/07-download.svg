<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People work together in a shared space.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People work together in a shared space.</tspan></text><a href="https://www.pexels.com/photo/colleagues-working-and-discussing-inside-an-office-room-7652134/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7652134</text></a></svg><text font-family="Arial, sans-serif" font-size="43.93000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="475.93">What would make this plan</tspan><tspan x="28" y="530.8425">workable for everyone?</tspan></text><text x="28" y="590.53" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="619.562">A question inviting people to identify changes that</tspan><tspan x="28" y="652.987">would make a plan practical.</tspan></text><text x="28" y="702.6469999999999" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="731.679">How could we adapt the plan to suit the group?;</tspan><tspan x="28" y="765.1039999999999">What changes would make this practical for all of</tspan><tspan x="28" y="798.529">us?</tspan></text><text x="28" y="848.189" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="877.221">What would make this plan workable for everyone</tspan><tspan x="28" y="910.646">involved?</tspan></text><text x="28" y="960.306" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="989.3380000000001">Workable means possible to carry out. The</tspan><tspan x="28" y="1022.763">question invites solutions without assuming</tspan><tspan x="28" y="1056.188">everyone has the same needs.</tspan></text><text x="28" y="1105.848" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1134.8799999999999">A: Some volunteers cannot arrive early.</tspan><tspan x="28" y="1168.3049999999998">B: What would make this plan workable for</tspan><tspan x="28" y="1201.7299999999998">everyone?</tspan><tspan x="28" y="1235.155">A: Could we divide the setup into two shifts?</tspan><tspan x="28" y="1268.58">B: That would let more people take part.</tspan></text><text x="28" y="1318.24" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1347.272">Replace “possible to carry out” with one word.</tspan><tspan x="28" y="1380.697">(Model: workable)</tspan></text></svg>