<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would make this plan workable for everyone?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener gives attention to another speaker.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener gives attention to another speaker.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2d382e"><tspan x="28" y="473.63">What would make this plan</tspan><tspan x="28" y="525.6675">workable for everyone?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="609.7420000000001">A question inviting people to identify changes that</tspan><tspan x="28" y="641.417">would make a plan practical.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="715.989">How could we adapt the plan to suit the group?; What</tspan><tspan x="28" y="747.664">changes would make this practical for all of us?</tspan></text><text x="28" y="794.7239999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="822.236">What would make this plan workable for everyone</tspan><tspan x="28" y="853.911">involved?</tspan></text><text x="28" y="900.9709999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="928.483">Workable means possible to carry out in practice.</tspan><tspan x="28" y="960.1579999999999">Invite constraints and specific adjustments, not</tspan><tspan x="28" y="991.833">merely a general vote of approval.</tspan></text><text x="28" y="1038.8929999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1066.4049999999997">A: The afternoon slot works for most people.</tspan><tspan x="28" y="1098.0799999999997">B: What would make this plan workable for everyone?</tspan><tspan x="28" y="1129.7549999999997">A: One volunteer cannot arrive before three.</tspan><tspan x="28" y="1161.4299999999998">B: We could give her the later shift and confirm cover</tspan><tspan x="28" y="1193.1049999999998">for the opening.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1285.992">A volunteer cannot arrive before three. Propose a</tspan><tspan x="28" y="1317.667">change that preserves coverage without dismissing</tspan><tspan x="28" y="1349.3419999999999">the constraint. (Model: Assign her the later shift and</tspan><tspan x="28" y="1381.017">arrange cover for the opening.)</tspan></text></svg>