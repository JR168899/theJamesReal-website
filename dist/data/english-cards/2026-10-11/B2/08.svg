<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Clarity is a form of care in a shared project.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - Quote</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#2c3540">2026-10-11 · B2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Clarity is a form of care in a shared project.</title><desc>Original family-manga illustration: light, related to Clarity is a form of care in a shared project..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-31-33Q-31-68 0-68Q32-68 32-33Q32-11 15 3V28H-15V3Q-31-11-31-33Z" fill="#e5c47d"/><path d="M-15 13H15M-14 37H14M-8 45H8M0-87V-100M-48-73L-59-84M48-73L59-84M-60-38H-78M60-38H78"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.54" font-weight="700" fill="#2c3540"><tspan x="28" y="477.54">Clarity is a form of care in</tspan><tspan x="28" y="534.465">a shared project.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="626.436">Clear communication can show consideration</tspan><tspan x="28" y="661.086">for the people doing shared work.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="742.662">Clear communication can show consideration</tspan><tspan x="28" y="777.312">for the people doing shared work</tspan></text><text x="28" y="828.792" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="858.888">A clear brief saves people from guessing.</tspan><tspan x="28" y="893.538">Clarity is a form of care in a shared project.</tspan></text><text x="28" y="945.018" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="975.114">This is an original practice reflection. Explain</tspan><tspan x="28" y="1009.764">how clarity helps, for example by reducing</tspan><tspan x="28" y="1044.414">uncertainty about deadlines.</tspan></text><text x="28" y="1095.894" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="1125.99">A: Why did you rewrite the brief?</tspan><tspan x="28" y="1160.64">B: I wanted everyone to know what was</tspan><tspan x="28" y="1195.29">expected.</tspan><tspan x="28" y="1229.94">A: Did the volunteers find it useful?</tspan><tspan x="28" y="1264.59">B: Yes. They could plan their time without</tspan><tspan x="28" y="1299.24">guessing.</tspan></text><text x="28" y="1350.72" font-family="Arial, sans-serif" font-size="15.84" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.72" font-weight="400" fill="#2c3540"><tspan x="28" y="1380.816">Give an example of clarity helping a team.</tspan></text></svg>