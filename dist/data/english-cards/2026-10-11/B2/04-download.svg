<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>check in with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A conversation begins by making contact and listening.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A conversation begins by making contact and listening.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="481.91">check in with</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="582.7065000000001">To contact someone briefly to learn how</tspan><tspan x="28" y="620.6815000000001">things are going.</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="710.0855000000001">touch base with; contact briefly</tspan></text><text x="28" y="766.5055000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="799.4895000000001">I will check in with the designer on Thursday.</tspan></text><text x="28" y="855.9095000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="888.8935000000001">Check in with a person and check on a task.</tspan><tspan x="28" y="926.8685000000002">Here, check in does not mean registering at</tspan><tspan x="28" y="964.8435000000002">a hotel.</tspan></text><text x="28" y="1021.2635000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1054.2475000000002">A: Have the labels been approved?</tspan><tspan x="28" y="1092.2225">B: I will check in with the designer today.</tspan><tspan x="28" y="1130.1975000000002">A: Could you ask about the final deadline</tspan><tspan x="28" y="1168.1725000000001">too?</tspan><tspan x="28" y="1206.1475000000003">B: Of course. I will confirm both details.</tspan></text><text x="28" y="1262.5675" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1295.5515000000003">Write a sentence arranging a progress</tspan><tspan x="28" y="1333.5265000000002">check. (Model: I will check in with the team</tspan><tspan x="28" y="1371.5015000000003">tomorrow.)</tspan></text></svg>