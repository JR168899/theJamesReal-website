<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>coordinate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.17" font-weight="700" fill="#382d2e"><tspan x="28" y="473.17">coordinate</tspan></text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="508.5225">US /koʊˈɔːrdɪneɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.69" font-weight="400" fill="#382d2e"><tspan x="28" y="533.7257000000001">coordinate · coordinates · coordinated · coordinated · coordinating</tspan><tspan x="28" y="557.7475000000001">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="607.7243000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="634.9322999999999">To organise people or activities so that they work well</tspan><tspan x="28" y="666.2573">together.</tspan></text><text x="28" y="712.7973000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="740.0053">organise; bring together · Coordinate emphasises</tspan><tspan x="28" y="771.3303000000001">how different parts work together.</tspan></text><text x="28" y="817.8703" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="845.0782999999999">We need to coordinate the exhibition with the library</tspan><tspan x="28" y="876.4033">team.</tspan></text><text x="28" y="922.9433" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="950.1513">Coordinate a project, a team, or a schedule.</tspan><tspan x="28" y="981.4763">Coordinate with someone identifies a partner in the</tspan><tspan x="28" y="1012.8013">planning.</tspan></text><text x="28" y="1059.3412999999998" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1086.5493">A: Both teams are using the same room at ten.</tspan><tspan x="28" y="1117.8743">B: Who is coordinating the bookings?</tspan><tspan x="28" y="1149.1993">A: I am. I will move the smaller meeting.</tspan><tspan x="28" y="1180.5242999999998">B: Please confirm the new room with everyone</tspan><tspan x="28" y="1211.8492999999999">involved.</tspan></text><text x="28" y="1258.3892999999998" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.5973">Two meetings have the same room and time. Name</tspan><tspan x="28" y="1316.9223">two steps needed to coordinate a solution. (Model:</tspan><tspan x="28" y="1348.2473">Arrange another suitable room or time, then confirm</tspan><tspan x="28" y="1379.5722999999998">the change with both teams.)</tspan></text></svg>