<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>coordinate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team sets out how separate activities will fit together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team sets out how separate activities will fit together.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">coordinate</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /koʊˈɔːrdɪneɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">coordinate · coordinates · coordinated · coordinated ·</tspan><tspan x="28" y="575.3100000000001">coordinating (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="632.2668000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="663.2748000000001">To organise people or activities so that they</tspan><tspan x="28" y="698.9748000000002">work well together.</tspan></text><text x="28" y="752.0148000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="783.0228000000002">organise; bring together · Coordinate</tspan><tspan x="28" y="818.7228000000002">emphasises how different parts work together.</tspan></text><text x="28" y="871.7628000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="902.7708000000002">We need to coordinate the exhibition with the</tspan><tspan x="28" y="938.4708000000003">library team.</tspan></text><text x="28" y="991.5108000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1022.5188000000003">Coordinate a project, a team, or a schedule.</tspan><tspan x="28" y="1058.2188000000003">Coordinate with someone identifies a partner in</tspan><tspan x="28" y="1093.9188000000004">the planning.</tspan></text><text x="28" y="1146.9588" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1177.9668000000001">A: Who is managing the schedule?</tspan><tspan x="28" y="1213.6668000000002">B: Maya will coordinate the different groups.</tspan><tspan x="28" y="1249.3668000000002">A: Should we send her our available dates?</tspan><tspan x="28" y="1285.0668">B: Yes, that will help her avoid clashes.</tspan></text><text x="28" y="1338.1068000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1369.1148000000003">Complete: Maya will ____ the different groups.</tspan></text></svg>