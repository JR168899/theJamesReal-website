<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A good plan makes room for people</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-10-11</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">A good plan makes room for people</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>A good plan makes room for people</title><desc>Original hand-drawn story illustration: room, set within conversation. How clear planning and practical flexibility help people collaborate confidently.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A good plan makes room for people</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A good collaborative plan should</tspan><tspan x="36" dy="23.459999999999997">provide direction while leaving</tspan><tspan x="36" dy="23.459999999999997">room for change. Preparing a</tspan><tspan x="36" dy="23.459999999999997">small exhibition at our</tspan><tspan x="36" dy="23.459999999999997">neighbourhood library taught us</tspan><tspan x="36" dy="23.459999999999997">that shared priorities and</tspan><tspan x="36" dy="23.459999999999997">practical testing make this</tspan><tspan x="36" dy="23.459999999999997">balance possible.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">First, agreeing on constraints</tspan><tspan x="384" dy="23.459999999999997">gives a team a useful starting</tspan><tspan x="384" dy="23.459999999999997">point. With a narrow room and a</tspan><tspan x="384" dy="23.459999999999997">modest budget, we mapped out the</tspan><tspan x="384" dy="23.459999999999997">visitor’s journey before choosing</tspan><tspan x="384" dy="23.459999999999997">displays. This shared reference</tspan><tspan x="384" dy="23.459999999999997">point helped us decide which</tspan><tspan x="384" dy="23.459999999999997">ideas were workable.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Second, testing a plan makes</tspan><tspan x="732" dy="23.459999999999997">flexibility practical. Our trial</tspan><tspan x="732" dy="23.459999999999997">run revealed that the entrance</tspan><tspan x="732" dy="23.459999999999997">would become crowded. We moved</tspan><tspan x="732" dy="23.459999999999997">the introductory panel further</tspan><tspan x="732" dy="23.459999999999997">inside, solving the problem</tspan><tspan x="732" dy="23.459999999999997">before it required a costly last-</tspan><tspan x="732" dy="23.459999999999997">minute change.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Effective coordination therefore</tspan><tspan x="1080" dy="23.459999999999997">combines clear priorities with</tspan><tspan x="1080" dy="23.459999999999997">opportunities to adjust. By</tspan><tspan x="1080" dy="23.459999999999997">making decisions visible and</tspan><tspan x="1080" dy="23.459999999999997">checking in before the deadline,</tspan><tspan x="1080" dy="23.459999999999997">a team can remain organised</tspan><tspan x="1080" dy="23.459999999999997">without becoming rigid. That is</tspan><tspan x="1080" dy="23.459999999999997">what makes a plan work for</tspan><tspan x="1080" dy="23.459999999999997">people.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · What did the trial run reveal, and how did the team respond?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>