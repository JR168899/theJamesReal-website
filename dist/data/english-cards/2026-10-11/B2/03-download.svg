<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>map out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/10/11 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers trace a route on a map.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers trace a route on a map.</tspan></text><a href="https://www.pexels.com/photo/unrecognizable-man-examining-map-while-planning-travel-at-home-6108074/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6108074</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">map something out</tspan><tspan x="28" y="525.6675">map out something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">To plan something in detail before doing it.</tspan></text><text x="28" y="656.802" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="684.3140000000001">plan in detail; chart</tspan></text><text x="28" y="731.374" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="758.8860000000001">Let’s map out the visitor’s journey before designing</tspan><tspan x="28" y="790.561">signs.</tspan></text><text x="28" y="837.621" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="865.133">Map out is separable: map the route out / map it out.</tspan><tspan x="28" y="896.808">It can refer to a detailed plan, not only a physical</tspan><tspan x="28" y="928.4830000000001">map.</tspan></text><text x="28" y="975.543" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1003.0550000000001">Aoede: Shall we start designing the signs?</tspan><tspan x="28" y="1034.73">Echo: Let us map out the visitor&#x27;s route first.</tspan><tspan x="28" y="1066.405">Aoede: From the entrance to the exit?</tspan><tspan x="28" y="1098.0800000000002">Echo: Yes, including the points where someone might</tspan><tspan x="28" y="1129.755">need help.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Before designing signs, identify two parts of a visitor&#x27;s</tspan><tspan x="28" y="1317.667">route worth mapping out. (Model: Where visitors enter</tspan><tspan x="28" y="1349.3419999999999">and where they must choose between different</tspan><tspan x="28" y="1381.017">directions.)</tspan></text></svg>