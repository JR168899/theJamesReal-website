<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>responsibility</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A workspace brings together the tools needed for a task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A workspace brings together the tools needed for a task.</tspan></text><a href="https://www.pexels.com/photo/office-tools-and-equipment-on-a-desk-8296953/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8296953</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382d2e"><tspan x="28" y="482.0">responsibility</tspan></text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="525.3">US /rɪˌspɑːnsəˈbɪləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="24.200000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="556.2760000000001">Singular: responsibility; plural: responsibilities.</tspan></text><text x="28" y="617.7" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="651.14">A task or duty that you are expected to take</tspan><tspan x="28" y="689.64">care of.</tspan></text><text x="28" y="746.84" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="780.28">duty; obligation · Duty and obligation may</tspan><tspan x="28" y="818.78">suggest stronger requirements.</tspan></text><text x="28" y="875.98" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="909.42">Watering the plants is my responsibility this</tspan><tspan x="28" y="947.92">week.</tspan></text><text x="28" y="1005.12" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1038.56">Use responsibility for + a noun or -ing:</tspan><tspan x="28" y="1077.06">responsibility for watering the plants.</tspan></text><text x="28" y="1134.2599999999998" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1167.6999999999998">A: Who will check the plants?</tspan><tspan x="28" y="1206.1999999999998">B: That is my responsibility.</tspan></text><text x="28" y="1263.3999999999996" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1296.8399999999997">Name one responsibility in a shared</tspan><tspan x="28" y="1335.3399999999997">garden.</tspan></text></svg>