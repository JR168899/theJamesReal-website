<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>follow through</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#3d3028"><tspan x="28" y="478.46">follow through</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="572.2889999999999">To complete something you have promised or</tspan><tspan x="28" y="607.6389999999999">started.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="690.8629999999999">carry out a commitment; see it through</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="774.0869999999999">It matters that we follow through on our</tspan><tspan x="28" y="809.4369999999999">promises.</tspan></text><text x="28" y="861.957" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="892.661">Follow through on a promise or commitment.</tspan><tspan x="28" y="928.011">Distinguish taking the first step from carrying</tspan><tspan x="28" y="963.361">the task to completion.</tspan></text><text x="28" y="1015.881" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1046.585">Sky: The group agreed to repair the gate.</tspan><tspan x="28" y="1081.935">Michael: Has anyone followed through?</tspan><tspan x="28" y="1117.285">Sky: A volunteer ordered the parts, and the</tspan><tspan x="28" y="1152.635">work is booked for Friday.</tspan><tspan x="28" y="1187.9850000000001">Michael: Then the promise has turned into an</tspan><tspan x="28" y="1223.335">actual arrangement.</tspan></text><text x="28" y="1275.8550000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1306.5590000000002">Which better demonstrates following through:</tspan><tspan x="28" y="1341.909">suggesting a repair or booking the work after</tspan><tspan x="28" y="1377.2590000000002">agreeing to arrange it? Explain.</tspan></text></svg>