<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something together</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-11</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Growing something together</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Growing something together</title><desc>Original hand-drawn story illustration: plant, set within conversation. How a community garden teaches neighbours to share responsibility and follow through.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-2) scale(1.4)"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#9db8a0"/></g><g transform="translate(94 266) rotate(2) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Growing something together</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A community garden needs more</tspan><tspan x="36" dy="23.459999999999997">than seeds and tools. Our</tspan><tspan x="36" dy="23.459999999999997">neighbourhood project showed that</tspan><tspan x="36" dy="23.459999999999997">sharing responsibility and</tspan><tspan x="36" dy="23.459999999999997">communicating clearly help people</tspan><tspan x="36" dy="23.459999999999997">work well together.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">First, dividing the work gives</tspan><tspan x="384" dy="23.459999999999997">everyone a way to contribute. We</tspan><tspan x="384" dy="23.459999999999997">started small: two neighbours</tspan><tspan x="384" dy="23.459999999999997">brought tools, while others</tspan><tspan x="384" dy="23.459999999999997">bought seeds. We also worked out</tspan><tspan x="384" dy="23.459999999999997">a watering schedule so that the</tspan><tspan x="384" dy="23.459999999999997">garden was never just one</tspan><tspan x="384" dy="23.459999999999997">person’s responsibility.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Second, clear communication helps</tspan><tspan x="732" dy="23.459999999999997">a group solve problems. When</tspan><tspan x="732" dy="23.459999999999997">someone forgot to water the</tspan><tspan x="732" dy="23.459999999999997">plants, we checked the schedule</tspan><tspan x="732" dy="23.459999999999997">together. We made the</tspan><tspan x="732" dy="23.459999999999997">instructions clearer instead of</tspan><tspan x="732" dy="23.459999999999997">blaming the person, so everyone</tspan><tspan x="732" dy="23.459999999999997">could follow through.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">The garden taught us two useful</tspan><tspan x="1080" dy="23.459999999999997">lessons: share the work fairly</tspan><tspan x="1080" dy="23.459999999999997">and discuss problems openly.</tspan><tspan x="1080" dy="23.459999999999997">These habits helped our plants</tspan><tspan x="1080" dy="23.459999999999997">grow and made us a stronger team.</tspan><tspan x="1080" dy="23.459999999999997">Other community projects can</tspan><tspan x="1080" dy="23.459999999999997">benefit from the same approach.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Why did the neighbours make the instructions clearer?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>