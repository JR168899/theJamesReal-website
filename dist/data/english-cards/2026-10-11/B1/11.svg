<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something together</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-10-11 · B1 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>Growing something together</title><desc>Original family-manga illustration: plant, related to Growing something together.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#83cf6e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">Growing something together</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="162.0">A community garden needs more than seeds and tools. Our neighbourhood project showed</tspan><tspan x="42" y="191.25">that sharing responsibility and communicating clearly help people work well together.</tspan></text><text x="42" y="229.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="259.5">First, dividing the work gives everyone a way to contribute. We started small: two neighbours brought tools, while others</tspan><tspan x="42" y="288.75">bought seeds. We also worked out a watering schedule so that the garden was never just one person’s responsibility.</tspan></text><text x="42" y="327.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="357.0">Second, clear communication helps a group solve problems. When someone forgot to water the plants, we checked the</tspan><tspan x="42" y="386.25">schedule together. We made the instructions clearer instead of blaming the person, so everyone could follow through.</tspan></text><text x="42" y="424.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="454.5">The garden taught us two useful lessons: share the work fairly and discuss problems openly. These habits helped our</tspan><tspan x="42" y="483.75">plants grow and made us a stronger team. Other community projects can benefit from the same approach.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="540.0">BUILD YOUR OWN · Claim: teamwork needs shared duties and clear communication. Develop each reason with a garden example. Reconnect both reasons to the</tspan><tspan x="42" y="562.0">claim. Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="584.0">Why did the neighbours make the instructions clearer?</tspan></text></svg>