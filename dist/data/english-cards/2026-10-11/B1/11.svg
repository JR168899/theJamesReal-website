<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something together</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - B1 - 2026/10/11 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Hands cultivate a garden with care.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-gardening-7729129/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 7729129</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Growing something together</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="157.0">A community garden needs more than seeds and tools. Our neighbourhood project showed that sharing</tspan><tspan x="42" y="180.4">responsibility and communicating clearly help people work well together.</tspan></text><text x="42" y="211.8" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="236.8">First, dividing the work gives everyone a way to contribute. We started small: two neighbours brought tools,</tspan><tspan x="42" y="260.2">while others bought seeds. We also worked out a watering schedule so that the garden was never just one</tspan><tspan x="42" y="283.6">person’s responsibility.</tspan></text><text x="42" y="315.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="340.0">Second, clear communication helps a group solve problems. When someone forgot to water the plants, we</tspan><tspan x="42" y="363.4">checked the schedule together. We made the instructions clearer instead of blaming the person, so everyone</tspan><tspan x="42" y="386.8">could follow through.</tspan></text><text x="42" y="418.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="443.2">The garden taught us two useful lessons: share the work fairly and discuss problems openly. These habits</tspan><tspan x="42" y="466.59999999999997">helped our plants grow and made us a stronger team. Other community projects can benefit from the same</tspan><tspan x="42" y="490.0">approach.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="539.4">BUILD YOUR OWN · Claim: teamwork needs shared duties and clear communication. Develop each reason with a garden</tspan><tspan x="42" y="561.36">example. Reconnect both reasons to the claim. Follow the main idea through two supported points. The conclusion brings</tspan><tspan x="42" y="583.3199999999999">both points together without adding a new reason.</tspan><tspan x="42" y="605.28">Why did the neighbours make the instructions clearer?</tspan></text></svg>