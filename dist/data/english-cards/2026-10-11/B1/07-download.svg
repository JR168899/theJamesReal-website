<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Could we agree on who will do each task?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team uses a whiteboard to explain a plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team uses a whiteboard to explain a plan.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#2d382e"><tspan x="28" y="480.99">Could we agree on who</tspan><tspan x="28" y="542.2275">will do each task?</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="641.166">A polite way to ask a group to decide who is</tspan><tspan x="28" y="678.441">responsible for each job.</tspan></text><text x="28" y="733.821" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="766.1970000000001">Can we divide up the jobs?; Shall we decide</tspan><tspan x="28" y="803.4720000000001">who is responsible for what?</tspan></text><text x="28" y="858.8520000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="891.2280000000002">Could we agree on who will do each task</tspan><tspan x="28" y="928.5030000000002">before we start?</tspan></text><text x="28" y="983.8830000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1016.2590000000002">Could we makes the request cooperative.</tspan><tspan x="28" y="1053.5340000000003">Follow it with a clear task or decision.</tspan></text><text x="28" y="1108.9140000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1141.2900000000002">A: We have seeds and tools.</tspan><tspan x="28" y="1178.5650000000003">B: Great. Could we agree on who will do</tspan><tspan x="28" y="1215.8400000000001">each task?</tspan></text><text x="28" y="1271.2200000000003" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1303.5960000000002">Rewrite politely: “Tell me who does each</tspan><tspan x="28" y="1340.8710000000003">task.” (Model: Could we agree on who will do</tspan><tspan x="28" y="1378.1460000000002">each task?)</tspan></text></svg>