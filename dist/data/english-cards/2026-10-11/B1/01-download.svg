<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contribute</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">contribute</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /kənˈtrɪbjuːt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">contribute · contributes · contributed · contributed · contributing</tspan><tspan x="28" y="564.7724999999999">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">To give time, money, skills, or ideas to help a shared</tspan><tspan x="28" y="679.3443000000002">goal.</tspan></text><text x="28" y="728.4843000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="757.2123000000001">give; add · The shared purpose is important when</tspan><tspan x="28" y="790.2873000000002">using contribute.</tspan></text><text x="28" y="839.4273000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="868.1553000000001">Everyone can contribute an idea to the garden</tspan><tspan x="28" y="901.2303000000002">project.</tspan></text><text x="28" y="950.3703" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="979.0983000000001">Use contribute something to a project. You can also</tspan><tspan x="28" y="1012.1733000000002">contribute by helping with a task.</tspan></text><text x="28" y="1061.3133" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0413">Sky: Do I need to lead an activity to contribute?</tspan><tspan x="28" y="1123.1163000000001">Michael: No. Helping prepare the room is useful too.</tspan><tspan x="28" y="1156.1913000000002">Sky: I could label the tables.</tspan><tspan x="28" y="1189.2663">Michael: That would make the event easier to</tspan><tspan x="28" y="1222.3413">navigate.</tspan></text><text x="28" y="1271.4813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1300.2093">Name a useful contribution from someone who does</tspan><tspan x="28" y="1333.2843">not want a public-facing role. (Model: Preparing</tspan><tspan x="28" y="1366.3593">materials or labeling the tables.)</tspan></text></svg>