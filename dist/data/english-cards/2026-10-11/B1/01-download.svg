<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contribute</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">contribute</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /kənˈtrɪbjuːt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">contribute · contributes · contributed · contributed · contributing</tspan><tspan x="28" y="569.69">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">To give time, money, skills, or ideas to help a</tspan><tspan x="28" y="688.5052000000001">shared goal.</tspan></text><text x="28" y="739.4652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="769.2572000000001">give; add · The shared purpose is important when</tspan><tspan x="28" y="803.5572000000001">using contribute.</tspan></text><text x="28" y="854.5172" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="884.3092000000001">Everyone can contribute an idea to the garden</tspan><tspan x="28" y="918.6092000000001">project.</tspan></text><text x="28" y="969.5692" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="999.3612000000002">Use contribute something to a project. You can</tspan><tspan x="28" y="1033.6612000000002">also contribute by helping with a task.</tspan></text><text x="28" y="1084.6212" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1114.4132">A: Do I need to lead an activity to contribute?</tspan><tspan x="28" y="1148.7132">B: No. Helping prepare the room is useful too.</tspan><tspan x="28" y="1183.0131999999999">A: I could label the tables.</tspan><tspan x="28" y="1217.3132">B: That would make the event easier to navigate.</tspan></text><text x="28" y="1268.2732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1298.0652">Name a useful contribution from someone who</tspan><tspan x="28" y="1332.3652">does not want a public-facing role. (Model:</tspan><tspan x="28" y="1366.6652">Preparing materials or labeling the tables.)</tspan></text></svg>