<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Could we agree on who will do each task?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="475.47">Could we agree on who will</tspan><tspan x="28" y="529.8075">do each task?</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="617.5980000000001">A polite way to ask a group to decide who is</tspan><tspan x="28" y="650.6730000000001">responsible for each job.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="728.541">Can we divide up the jobs?; Shall we decide who is</tspan><tspan x="28" y="761.6160000000001">responsible for what?</tspan></text><text x="28" y="810.756" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="839.484">Could we agree on who will do each task before we</tspan><tspan x="28" y="872.5590000000001">start?</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="950.427">Clarify responsibility, timing and any handover.</tspan><tspan x="28" y="983.5020000000001">Saying everyone will help can leave essential tasks</tspan><tspan x="28" y="1016.577">unowned.</tspan></text><text x="28" y="1065.7169999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1094.445">Sky: Everyone has offered to help, but no jobs are</tspan><tspan x="28" y="1127.52">assigned.</tspan><tspan x="28" y="1160.595">Michael: Could we agree on who will do each task?</tspan><tspan x="28" y="1193.6699999999998">Sky: I will handle registration. Could you prepare the</tspan><tspan x="28" y="1226.745">tables?</tspan><tspan x="28" y="1259.82">Michael: Yes. Who will lock up afterward?</tspan></text><text x="28" y="1308.9599999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1337.6879999999999">A group has volunteers but no assigned closing task.</tspan><tspan x="28" y="1370.763">Ask a question that makes responsibility clear.</tspan></text></svg>