<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Could we agree on who will do each task?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team uses a whiteboard to explain a plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team uses a whiteboard to explain a plan.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2d382e"><tspan x="28" y="482.0">Could we agree on who</tspan><tspan x="28" y="544.5">will do each task?</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="646.54">A polite way to ask a group to decide who</tspan><tspan x="28" y="685.04">is responsible for each job.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="775.68">Can we divide up the jobs?; Shall we</tspan><tspan x="28" y="814.18">decide who is responsible for what?</tspan></text><text x="28" y="871.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="904.8199999999999">Could we agree on who will do each task</tspan><tspan x="28" y="943.3199999999999">before we start?</tspan></text><text x="28" y="1000.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1033.96">Could we makes the request cooperative.</tspan><tspan x="28" y="1072.46">Follow it with a clear task or decision.</tspan></text><text x="28" y="1129.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1163.1">A: We have seeds and tools.</tspan><tspan x="28" y="1201.6">B: Great. Could we agree on who will do</tspan><tspan x="28" y="1240.1">each task?</tspan></text><text x="28" y="1297.3" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1330.74">Rewrite politely: “Tell me who does each</tspan><tspan x="28" y="1369.24">task.”</tspan></text></svg>