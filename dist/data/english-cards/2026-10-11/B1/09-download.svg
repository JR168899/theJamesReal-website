<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If + present, will + verb</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Volunteers work together to prepare donated supplies.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Volunteers work together to prepare donated supplies.</tspan></text><a href="https://www.pexels.com/photo/two-volunteers-packing-the-charity-goods-6590929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6590929</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382f40"><tspan x="28" y="477.08">If + present, will + verb</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="568.1220000000001">Use if + present simple and will + a verb for a</tspan><tspan x="28" y="602.422">possible future condition and result.</tspan></text><text x="28" y="653.382" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="683.1740000000001">If we share the work, we will finish before lunch.</tspan></text><text x="28" y="734.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="763.926">Use present simple in the if-clause and will +</tspan><tspan x="28" y="798.226">base verb in the result clause for this possible</tspan><tspan x="28" y="832.5260000000001">future outcome.</tspan></text><text x="28" y="883.4859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="913.278">A: Can we finish before lunch?</tspan><tspan x="28" y="947.578">B: If we share the work, we will finish in time.</tspan><tspan x="28" y="981.878">A: Then I can prepare the tables.</tspan><tspan x="28" y="1016.178">B: And I will organize the materials.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382f40"><tspan x="28" y="1289.472">Combine these ideas in a first conditional: We</tspan><tspan x="28" y="1323.772">share the work. We finish before lunch. (Model: If</tspan><tspan x="28" y="1358.072">we share the work, we will finish before lunch.)</tspan></text></svg>