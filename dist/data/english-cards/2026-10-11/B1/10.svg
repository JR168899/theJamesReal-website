ily="Georgia,serif" font-size="14" font-style="italic">How did you get interested in gardening?</text></svg><text x="35" y="555.8" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An open question about how someone&#x27;s interest in gardening</tspan><tspan x="35" dy="24.839999999999996">began.</tspan></text><text x="35" y="657.0399999999998" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="681.5999999999998" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">How did you get interested in gardening?</tspan></text><text x="35" y="733.4399999999998" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="757.9999999999998" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Get interested in + a noun or -ing. Follow up with a</tspan><tspan x="35" dy="24.839999999999996">question about what the person enjoys.</tspan></text><text x="35" y="834.6799999999997" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="859.2399999999997" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: How did you get interested in gardening?</tspan><tspan x="35" dy="24.839999999999996">B: My grandfather taught me. What about you?</tspan></text><text x="35" y="935.9199999999996" fill="#353331" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="960.4799999999996" fill="#353331" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Ask a follow-up question about this hobby.</tspan></text><text x="35" y="1406" fill="#353331" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">SMALLTALK   /   10 OF 11</tspan></text></svg>