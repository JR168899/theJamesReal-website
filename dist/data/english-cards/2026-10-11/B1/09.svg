<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If + present, will + verb</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Volunteers work together to prepare donated supplies.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Volunteers work together to prepare donated supplies.</tspan></text><a href="https://www.pexels.com/photo/two-volunteers-packing-the-charity-goods-6590929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6590929</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382f40"><tspan x="28" y="482.0">If + present, will + verb</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="584.04">Use if + present simple and will + a verb for</tspan><tspan x="28" y="622.54">a possible future condition and result.</tspan></text><text x="28" y="679.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="713.18">If we share the work, we will finish before</tspan><tspan x="28" y="751.68">lunch.</tspan></text><text x="28" y="808.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="842.3199999999999">Use present simple in the if-clause and will</tspan><tspan x="28" y="880.8199999999999">+ base verb in the result clause for this</tspan><tspan x="28" y="919.3199999999999">possible future outcome.</tspan></text><text x="28" y="976.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1009.9599999999999">Sky: Can we finish before lunch?</tspan><tspan x="28" y="1048.46">Michael: If we share the work, we will finish</tspan><tspan x="28" y="1086.96">in time.</tspan><tspan x="28" y="1125.46">Sky: Then I can prepare the tables.</tspan><tspan x="28" y="1163.96">Michael: And I will organize the materials.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1295.04">Combine these ideas in a first conditional:</tspan><tspan x="28" y="1333.54">We share the work. We finish before lunch.</tspan></text></svg>