<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>many hands make light work</title><rect width="660" height="1434" fill="#efe6bd"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#383426" stroke-width="1"/><text x="35" y="43" fill="#383426" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-11</tspan></text><text x="35" y="88" fill="#383426" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">many hands make light work</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>many hands make light work</title><desc>Original hand-drawn story illustration: desk, set within conversation. A saying that work becomes easier when many people help.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><g transform="translate(538 266) rotate(-3) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">many hands make light work</text></svg><text x="35" y="514.4" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A saying that work becomes easier when many people help.</tspan></text><text x="35" y="590.8" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">We finished planting quickly: many hands make light work.</tspan></text><text x="35" y="667.1999999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Use the whole saying after a group finishes a task. It</tspan><tspan x="35" dy="24.839999999999996">does not refer to the weight of people&#x27;s hands.</tspan></text><text x="35" y="768.4399999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="792.9999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: That was faster than I expected.</tspan><tspan x="35" dy="24.839999999999996">B: Many hands make light work.</tspan></text><text x="35" y="869.6799999999997" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="894.2399999999997" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Complete: Many hands make ____ work.</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   06 OF 11</tspan></text></svg>