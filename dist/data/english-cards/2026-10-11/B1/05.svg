<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>pull your weight</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#383426"><tspan x="28" y="480.3">pull your weight</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="577.845">To do your fair share of the work.</tspan></text><text x="28" y="632.4449999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="664.365">do your part; contribute fairly</tspan></text><text x="28" y="718.9649999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="750.885">The garden succeeds when everyone pulls</tspan><tspan x="28" y="787.635">their weight.</tspan></text><text x="28" y="842.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="874.155">An informal expression about doing a fair</tspan><tspan x="28" y="910.905">share. It can sound accusatory; specify the</tspan><tspan x="28" y="947.655">imbalance and a workable change.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1034.175">A: I have done the shopping and the</tspan><tspan x="28" y="1070.925">washing-up this week.</tspan><tspan x="28" y="1107.675">B: You are right. I have not been pulling my</tspan><tspan x="28" y="1144.425">weight.</tspan><tspan x="28" y="1181.175">A: Could you take responsibility for dinner</tspan><tspan x="28" y="1217.925">tomorrow?</tspan><tspan x="28" y="1254.675">B: Yes. I will plan it and clear up afterward.</tspan></text><text x="28" y="1309.2749999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1341.195">Replace a vague promise to pull your weight</tspan><tspan x="28" y="1377.945">with one specific responsibility.</tspan></text></svg>