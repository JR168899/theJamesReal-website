<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>pull your weight</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">pull your weight</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">To do your fair share of the work.</tspan></text><text x="28" y="624.8089999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="655.5129999999998">do your part; contribute fairly</tspan></text><text x="28" y="708.0329999999998" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="738.7369999999997">The garden succeeds when everyone pulls their</tspan><tspan x="28" y="774.0869999999998">weight.</tspan></text><text x="28" y="826.6069999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="857.3109999999998">An informal expression about doing a fair share.</tspan><tspan x="28" y="892.6609999999998">It can sound accusatory; specify the imbalance</tspan><tspan x="28" y="928.0109999999999">and a workable change.</tspan></text><text x="28" y="980.5309999999998" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1011.2349999999998">Sky: I have done the shopping and the</tspan><tspan x="28" y="1046.5849999999998">washing-up this week.</tspan><tspan x="28" y="1081.9349999999997">Michael: You are right. I have not been pulling</tspan><tspan x="28" y="1117.2849999999999">my weight.</tspan><tspan x="28" y="1152.6349999999998">Sky: Could you take responsibility for dinner</tspan><tspan x="28" y="1187.9849999999997">tomorrow?</tspan><tspan x="28" y="1223.3349999999998">Michael: Yes. I will plan it and clear up</tspan><tspan x="28" y="1258.6849999999997">afterward.</tspan></text><text x="28" y="1311.205" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1341.9089999999999">Replace a vague promise to pull your weight</tspan><tspan x="28" y="1377.2589999999998">with one specific responsibility.</tspan></text></svg>