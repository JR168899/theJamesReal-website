<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Trust grows when small promises become actions.</title><rect width="660" height="1434" fill="#dce5ee"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2c3540" stroke-width="1"/><text x="35" y="43" fill="#2c3540" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-11</tspan></text><text x="35" y="88" fill="#2c3540" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">Trust grows when small promises</tspan><tspan x="35" dy="41.4">become actions.</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>Trust grows when small promises become actions.</title><desc>Original hand-drawn story illustration: plant, set within conversation. People learn to trust each other when promises are kept.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#9db8a0"/></g><g transform="translate(538 266) rotate(0) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Trust grows when small promises become actions.</text></svg><text x="35" y="555.8" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">People learn to trust each other when promises are kept.</tspan></text><text x="35" y="632.1999999999999" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="656.7599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">She arrives every Saturday as promised. Trust grows when</tspan><tspan x="35" dy="24.839999999999996">small promises become actions.</tspan></text><text x="35" y="733.4399999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="757.9999999999998" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">This is an original practice reflection. Support the idea</tspan><tspan x="35" dy="24.839999999999996">with a specific action, such as arriving on time.</tspan></text><text x="35" y="834.6799999999997" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="859.2399999999997" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Can we depend on Rosa?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. She always does what she promises.</tspan></text><text x="35" y="935.9199999999996" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="960.4799999999996" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Describe one action that builds trust.</tspan></text><text x="35" y="1406" fill="#2c3540" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">REFLECTION   /   08 OF 11</tspan></text></svg>