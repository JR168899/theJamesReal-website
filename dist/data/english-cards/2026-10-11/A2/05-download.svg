<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>lend a hand</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people share the effort of moving furniture.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people share the effort of moving furniture.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-men-carrying-a-couch-7464393/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7464393</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#383426"><tspan x="28" y="475.47">lend a hand</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">To help someone with a task.</tspan></text><text x="28" y="612.4005000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="641.1285000000001">pitch in; help out</tspan></text><text x="28" y="690.2685" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="718.9965000000001">Can you lend a hand with the bags?</tspan></text><text x="28" y="768.1365" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="796.8645">Figurative: lend a hand means help. It does not imply</tspan><tspan x="28" y="829.9395000000001">a later repayment of the same kind.</tspan></text><text x="28" y="879.0794999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="907.8075">Bella: Could anyone lend a hand with the tables?</tspan><tspan x="28" y="940.8825">Fenrir: I can help for fifteen minutes.</tspan><tspan x="28" y="973.9575">Bella: That is enough to move these two.</tspan><tspan x="28" y="1007.0325">Fenrir: Then let us start with the one near the door.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Offer to lend a hand while giving a clear limit on your</tspan><tspan x="28" y="1320.923">availability. (Model: I can lend a hand for fifteen</tspan><tspan x="28" y="1353.998">minutes. Which table should we move first?)</tspan></text></svg>