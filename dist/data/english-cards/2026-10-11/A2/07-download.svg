<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I can bring fruit if you bring bread.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Vegetables are arranged for selection.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Vegetables are arranged for selection.</tspan></text><a href="https://www.pexels.com/photo/assorted-fresh-ripe-vegetables-in-market-stall-3873912/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3873912</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="477.54">I can bring fruit if you bring</tspan><tspan x="28" y="534.465">bread.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="626.436">A way to suggest that each person brings part</tspan><tspan x="28" y="661.086">of the food.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="742.662">Shall I bring fruit while you bring bread?; We</tspan><tspan x="28" y="777.312">could each bring part of the food.</tspan></text><text x="28" y="828.792" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="858.888">I can bring fruit if you bring bread.</tspan></text><text x="28" y="910.368" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="940.464">The if-clause makes the arrangement</tspan><tspan x="28" y="975.114">conditional. Confirm the other person agrees</tspan><tspan x="28" y="1009.7640000000001">rather than treating the offer as an assignment.</tspan></text><text x="28" y="1061.244" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1091.34">Bella: I can bring fruit if you bring bread.</tspan><tspan x="28" y="1125.99">Fenrir: That works. How many people are</tspan><tspan x="28" y="1160.6399999999999">coming?</tspan><tspan x="28" y="1195.29">Bella: Four.</tspan><tspan x="28" y="1229.94">Fenrir: Then I will bring enough bread for four.</tspan></text><text x="28" y="1281.4199999999998" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1311.5159999999998">Agree on contributions to a picnic for four</tspan><tspan x="28" y="1346.166">people using if. (Model: I can bring fruit if you</tspan><tspan x="28" y="1380.8159999999998">bring enough bread for four people.)</tspan></text></svg>