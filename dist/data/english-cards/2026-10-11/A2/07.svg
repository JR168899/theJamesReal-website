<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I can bring fruit if you bring bread.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Vegetables are arranged for selection.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Vegetables are arranged for selection.</tspan></text><a href="https://www.pexels.com/photo/assorted-fresh-ripe-vegetables-in-market-stall-3873912/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3873912</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="480.3">I can bring fruit if you</tspan><tspan x="28" y="540.6750000000001">bring bread.</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="638.22">A way to suggest that each person brings part</tspan><tspan x="28" y="674.97">of the food.</tspan></text><text x="28" y="729.5699999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="761.49">Shall I bring fruit while you bring bread?; We</tspan><tspan x="28" y="798.24">could each bring part of the food.</tspan></text><text x="28" y="852.8399999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="884.76">I can bring fruit if you bring bread.</tspan></text><text x="28" y="939.3599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="971.28">The if-clause makes the arrangement</tspan><tspan x="28" y="1008.03">conditional. Confirm the other person agrees</tspan><tspan x="28" y="1044.78">rather than treating the offer as an assignment.</tspan></text><text x="28" y="1099.3799999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1131.3">A: I can bring fruit if you bring bread.</tspan><tspan x="28" y="1168.05">B: That works. How many people are coming?</tspan><tspan x="28" y="1204.8">A: Four.</tspan><tspan x="28" y="1241.55">B: Then I will bring enough bread for four.</tspan></text><text x="28" y="1296.1499999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1328.07">Agree on contributions to a picnic for four</tspan><tspan x="28" y="1364.82">people using if.</tspan></text></svg>