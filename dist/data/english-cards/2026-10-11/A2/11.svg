<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A picnic that works for everyone</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A2   2026-10-11</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">A picnic that works for everyone</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>A picnic that works for everyone</title><desc>Original hand-drawn story illustration: desk, set within conversation. A story about friends planning a picnic and helping one another.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#b7bec8"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A picnic that works for everyone</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A picnic is more fun when friends</tspan><tspan x="36" dy="23.459999999999997">plan ahead and help each other.</tspan><tspan x="36" dy="23.459999999999997">Our picnic near the lake on</tspan><tspan x="36" dy="23.459999999999997">Sunday is a good example.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">First, a clear plan helps us</tspan><tspan x="384" dy="23.459999999999997">prepare. We are going to meet at</tspan><tspan x="384" dy="23.459999999999997">ten. I am going to bring</tspan><tspan x="384" dy="23.459999999999997">sandwiches, Lina can bring fruit,</tspan><tspan x="384" dy="23.459999999999997">and Omar can bring water.</tspan><tspan x="384" dy="23.459999999999997">Everyone knows what to do.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Second, helping each other makes</tspan><tspan x="732" dy="23.459999999999997">the work easier. Omar has a heavy</tspan><tspan x="732" dy="23.459999999999997">bag, so we take turns carrying</tspan><tspan x="732" dy="23.459999999999997">it. After lunch, we all help to</tspan><tspan x="732" dy="23.459999999999997">clean up.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Planning and helping make our</tspan><tspan x="1080" dy="23.459999999999997">picnic a good day for everyone.</tspan><tspan x="1080" dy="23.459999999999997">We enjoy our food and our time</tspan><tspan x="1080" dy="23.459999999999997">together. Next time, we want to</tspan><tspan x="1080" dy="23.459999999999997">work together again.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · How do the friends help Omar?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>