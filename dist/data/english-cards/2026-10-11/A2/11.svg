<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A picnic that works for everyone</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/10/11 - 01 - Essay</tspan></text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>A picnic that works for everyone</title><desc>Original family-manga illustration: desk, related to A picnic that works for everyone.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#7fc4ef"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">A picnic that works for everyone</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="163.0">A picnic is more fun when friends plan ahead and help each other. Our picnic near the lake</tspan><tspan x="42" y="193.42">on Sunday is a good example.</tspan></text><text x="42" y="231.84" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="262.84000000000003">First, a clear plan helps us prepare. We are going to meet at ten. I am going to bring sandwiches, Lina can bring fruit,</tspan><tspan x="42" y="293.26000000000005">and Omar can bring water. Everyone knows what to do.</tspan></text><text x="42" y="331.68" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="362.68">Second, helping each other makes the work easier. Omar has a heavy bag, so we take turns carrying it. After lunch, we</tspan><tspan x="42" y="393.1">all help to clean up.</tspan></text><text x="42" y="431.52" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#37322b"><tspan x="42" y="462.52">Planning and helping make our picnic a good day for everyone. We enjoy our food and our time together. Next time, we</tspan><tspan x="42" y="492.94">want to work together again.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="549.36">BUILD YOUR OWN · Introduce two reasons. Explain planning with an example. Explain helping with an example. Restate both reasons. Follow the main idea through</tspan><tspan x="42" y="571.36">two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="593.36">How do the friends help Omar?</tspan></text></svg>