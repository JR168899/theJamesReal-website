<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>prepare</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A host serves food at a table.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A host serves food at a table.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">prepare</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /prɪˈper/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">prepare · prepares · prepared · prepared · preparing (base ·</tspan><tspan x="28" y="574.6075000000001">third person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">To make something ready before you use it or</tspan><tspan x="28" y="697.6660999999999">need it.</tspan></text><text x="28" y="750.4461" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="781.3021">get ready; make ready · Use get ready for</tspan><tspan x="28" y="816.8271">yourself; make ready usually takes a thing.</tspan></text><text x="28" y="869.6071000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="900.4631">We need to prepare lunch before we leave.</tspan></text><text x="28" y="953.2431" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="984.0991">You can prepare food, a bag, or a room.</tspan><tspan x="28" y="1019.6241">Prepare for + an event: prepare for a picnic.</tspan></text><text x="28" y="1072.4041" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1103.2601">Bella: Can I help you prepare lunch?</tspan><tspan x="28" y="1138.7851">Fenrir: Please wash the carrots.</tspan><tspan x="28" y="1174.3101">Bella: Should I cut them too?</tspan><tspan x="28" y="1209.8351">Fenrir: Yes, but wash them first.</tspan></text><text x="28" y="1262.6151" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1293.4711">Put these actions in order: cut the carrots; wash</tspan><tspan x="28" y="1328.9961">the carrots; serve the soup. (Model: Wash the</tspan><tspan x="28" y="1364.5211">carrots, cut them, then serve the soup.)</tspan></text></svg>