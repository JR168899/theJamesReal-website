<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>prepare</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A host serves food at a table.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A host serves food at a table.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="49.220000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="481.22">prepare</tspan></text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="523.485">US /prɪˈper/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.540000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="553.6161999999999">prepare · prepares · prepared · prepared · preparing</tspan><tspan x="28" y="582.3349999999999">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="642.0838" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="674.6118">To make something ready before you use it</tspan><tspan x="28" y="712.0618000000001">or need it.</tspan></text><text x="28" y="767.7018" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="800.2298000000001">get ready; make ready · Use get ready for</tspan><tspan x="28" y="837.6798000000001">yourself; make ready usually takes a thing.</tspan></text><text x="28" y="893.3198000000001" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="925.8478000000001">We need to prepare lunch before we leave.</tspan></text><text x="28" y="981.4878000000001" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1014.0158000000001">You can prepare food, a bag, or a room.</tspan><tspan x="28" y="1051.4658000000002">Prepare for + an event: prepare for a picnic.</tspan></text><text x="28" y="1107.1058" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1139.6338000000003">A: Can I help you prepare lunch?</tspan><tspan x="28" y="1177.0838000000003">B: Please wash the carrots.</tspan><tspan x="28" y="1214.5338000000004">A: Should I cut them too?</tspan><tspan x="28" y="1251.9838000000002">B: Yes, but wash them first.</tspan></text><text x="28" y="1307.6238" font-family="Arial, sans-serif" font-size="17.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.96" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.1518000000003">Put these actions in order: cut the carrots;</tspan><tspan x="28" y="1377.6018000000004">wash the carrots; serve the soup.</tspan></text></svg>