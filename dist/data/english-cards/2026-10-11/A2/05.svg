<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>lend a hand</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people share the effort of moving furniture.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people share the effort of moving furniture.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-men-carrying-a-couch-7464393/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7464393</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#383426"><tspan x="28" y="482.0">lend a hand</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="584.04">To help someone with a task.</tspan></text><text x="28" y="641.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="674.68">pitch in; help out</tspan></text><text x="28" y="731.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="765.3199999999999">Can you lend a hand with the bags?</tspan></text><text x="28" y="822.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="855.9599999999999">Figurative: lend a hand means help. It does</tspan><tspan x="28" y="894.4599999999999">not imply a later repayment of the same</tspan><tspan x="28" y="932.9599999999999">kind.</tspan></text><text x="28" y="990.16" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1023.5999999999999">A: Could anyone lend a hand with the</tspan><tspan x="28" y="1062.1">tables?</tspan><tspan x="28" y="1100.6">B: I can help for fifteen minutes.</tspan><tspan x="28" y="1139.1">A: That is enough to move these two.</tspan><tspan x="28" y="1177.6">B: Then let us start with the one near the</tspan><tspan x="28" y="1216.1">door.</tspan></text><text x="28" y="1273.2999999999997" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1306.7399999999998">Offer to lend a hand while giving a clear</tspan><tspan x="28" y="1345.2399999999998">limit on your availability.</tspan></text></svg>