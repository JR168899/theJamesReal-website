<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Agreement is meaningful only when dissent remains possible.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#2d382e"><tspan x="28" y="474.78">Agreement is meaningful</tspan><tspan x="28" y="528.255">only when dissent remains</tspan><tspan x="28" y="581.73">possible.</tspan></text><text x="28" y="639.8549999999999" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="668.1269999999998">An agreement has substance only if people are still</tspan><tspan x="28" y="700.6769999999998">free to express disagreement.</tspan></text><text x="28" y="749.0369999999999" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="777.3089999999999">Real consent requires room for disagreement.; A</tspan><tspan x="28" y="809.8589999999998">shared position must permit challenge.</tspan></text><text x="28" y="858.2189999999999" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="886.4909999999999">Agreement is meaningful only when dissent remains</tspan><tspan x="28" y="919.0409999999998">possible.</tspan></text><text x="28" y="967.401" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="995.6729999999999">Only when sets a necessary condition. It does not</tspan><tspan x="28" y="1028.223">claim that allowing dissent is sufficient to make every</tspan><tspan x="28" y="1060.773">agreement legitimate.</tspan></text><text x="28" y="1109.133" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1137.405">A: Nobody objected during the meeting.</tspan><tspan x="28" y="1169.955">B: Did everyone feel able to object?</tspan><tspan x="28" y="1202.5049999999999">A: Would allowing objections guarantee a sound</tspan><tspan x="28" y="1235.055">decision?</tspan><tspan x="28" y="1267.605">B: No. It is a necessary condition in this claim, not a</tspan><tspan x="28" y="1300.155">sufficient one.</tspan></text><text x="28" y="1348.515" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1376.787">Paraphrase the sentence without “dissent”.</tspan></text></svg>