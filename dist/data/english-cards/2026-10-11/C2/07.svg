<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Agreement is meaningful only when dissent remains possible.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group develops a shared plan around a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group develops a shared plan around a board.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="472.48">Agreement is meaningful only</tspan><tspan x="28" y="523.08">when dissent remains possible.</tspan></text><text x="28" y="578.08" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="604.832">An agreement has substance only if people are still</tspan><tspan x="28" y="635.632">free to express disagreement.</tspan></text><text x="28" y="681.392" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="708.144">Real consent requires room for disagreement.; A</tspan><tspan x="28" y="738.944">shared position must permit challenge.</tspan></text><text x="28" y="784.7040000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="811.456">Agreement is meaningful only when dissent remains</tspan><tspan x="28" y="842.256">possible.</tspan></text><text x="28" y="888.0160000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="914.768">Dissent means expressing disagreement. The</tspan><tspan x="28" y="945.568">statement concerns conditions for meaningful</tspan><tspan x="28" y="976.368">agreement, not a requirement that someone must</tspan><tspan x="28" y="1007.168">always object.</tspan></text><text x="28" y="1052.9279999999999" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1079.68">A: Everyone approved the plan in the meeting.</tspan><tspan x="28" y="1110.48">B: Could anyone object without risking their place in</tspan><tspan x="28" y="1141.28">the group?</tspan><tspan x="28" y="1172.0800000000002">A: I am not sure.</tspan><tspan x="28" y="1202.88">B: Agreement is meaningful only when dissent</tspan><tspan x="28" y="1233.68">remains possible.</tspan></text><text x="28" y="1279.4399999999998" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2d382e"><tspan x="28" y="1306.192">Explain why unanimous approval may not establish</tspan><tspan x="28" y="1336.992">genuine consent if people fear consequences for</tspan><tspan x="28" y="1367.792">objecting.</tspan></text></svg>