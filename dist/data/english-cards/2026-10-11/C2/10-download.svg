<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What assumption did the discussion leave unexamined?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">What assumption did the</tspan><tspan x="28" y="529.8075">discussion leave</tspan><tspan x="28" y="584.145">unexamined?</tspan></text><text x="28" y="643.2075000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="671.9355000000002">A question inviting scrutiny of a belief that a</tspan><tspan x="28" y="705.0105000000002">discussion may have taken for granted.</tspan></text><text x="28" y="754.1505000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="782.8785000000001">What assumption did the discussion leave</tspan><tspan x="28" y="815.9535000000002">unexamined?</tspan></text><text x="28" y="865.0935000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="893.8215000000001">Unexamined does not necessarily mean false. Ask</tspan><tspan x="28" y="926.8965000000002">what evidence or alternative perspective might test</tspan><tspan x="28" y="959.9715000000001">the assumption.</tspan></text><text x="28" y="1009.1115000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1037.8395">A: What assumption did the discussion leave</tspan><tspan x="28" y="1070.9145">unexamined?</tspan><tspan x="28" y="1103.9895000000001">B: That everyone had the same freedom to</tspan><tspan x="28" y="1137.0645">participate.</tspan><tspan x="28" y="1170.1395">A: How might we test that assumption?</tspan><tspan x="28" y="1203.2145">B: We could ask whose evidence or experience</tspan><tspan x="28" y="1236.2895">might challenge it.</tspan></text><text x="28" y="1285.4295" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1314.1575">Offer a follow-up that invites nuance rather than a</tspan><tspan x="28" y="1347.2325">yes/no answer. (Model: How might unequal freedom</tspan><tspan x="28" y="1380.3075000000001">to participate have shaped the apparent consensus?)</tspan></text></svg>