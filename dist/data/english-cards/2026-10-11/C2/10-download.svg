<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What assumption did the discussion leave unexamined?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>What assumption did the discussion leave unexamined?</title><desc>Original family-manga illustration: magnifier, related to What assumption did the discussion leave unexamined?.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f5c64e"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-12" cy="-12" r="42" fill="#c8d9d5"/><path d="M19 19L61 61M-30-32Q-45-16-30 2"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#353331"><tspan x="28" y="475.47">What assumption did the</tspan><tspan x="28" y="529.8075">discussion leave</tspan><tspan x="28" y="584.145">unexamined?</tspan></text><text x="28" y="643.2075000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#353331"><tspan x="28" y="671.9355000000002">A question inviting scrutiny of a belief that a</tspan><tspan x="28" y="705.0105000000002">discussion may have taken for granted.</tspan></text><text x="28" y="754.1505000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#353331"><tspan x="28" y="782.8785000000001">What assumption did the discussion leave</tspan><tspan x="28" y="815.9535000000002">unexamined?</tspan></text><text x="28" y="865.0935000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#353331"><tspan x="28" y="893.8215000000001">Unexamined does not necessarily mean false. Ask</tspan><tspan x="28" y="926.8965000000002">what evidence or alternative perspective might test</tspan><tspan x="28" y="959.9715000000001">the assumption.</tspan></text><text x="28" y="1009.1115000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#353331"><tspan x="28" y="1037.8395">A: What assumption did the discussion leave</tspan><tspan x="28" y="1070.9145">unexamined?</tspan><tspan x="28" y="1103.9895000000001">B: That everyone had the same freedom to</tspan><tspan x="28" y="1137.0645">participate.</tspan><tspan x="28" y="1170.1395">A: How might we test that assumption?</tspan><tspan x="28" y="1203.2145">B: We could ask whose evidence or experience</tspan><tspan x="28" y="1236.2895">might challenge it.</tspan></text><text x="28" y="1285.4295" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#353331"><tspan x="28" y="1314.1575">Offer a follow-up that invites nuance rather than a</tspan><tspan x="28" y="1347.2325">yes/no answer. (Model: How might unequal freedom</tspan><tspan x="28" y="1380.3075000000001">to participate have shaped the apparent consensus?)</tspan></text></svg>