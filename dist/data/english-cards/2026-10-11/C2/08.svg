<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A collective voice should not erase the voices that compose it.</title><rect width="660" height="1434" fill="#dce5ee"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2c3540" stroke-width="1"/><text x="35" y="43" fill="#2c3540" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-10-11</tspan></text><text x="35" y="88" fill="#2c3540" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">A collective voice should not</tspan><tspan x="35" dy="41.4">erase the voices that compose it.</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>A collective voice should not erase the voices that compose it.</title><desc>Original hand-drawn story illustration: light, set within conversation. A group&#x27;s shared position should preserve accountability to the different people within it.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><path d="M-31-33Q-31-68 0-68Q32-68 32-33Q32-11 15 3V28H-15V3Q-31-11-31-33Z" fill="#e5c47d"/><path d="M-15 13H15M-14 37H14M-8 45H8M0-87V-100M-48-73L-59-84M48-73L59-84M-60-38H-78M60-38H78"/></g><g transform="translate(538 266) rotate(-3) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A collective voice should not erase the voices that compose it.</text></svg><text x="35" y="555.8" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A group&#x27;s shared position should preserve accountability</tspan><tspan x="35" dy="24.839999999999996">to the different people within it.</tspan></text><text x="35" y="657.0399999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="681.5999999999998" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A unanimous statement can conceal unresolved concerns. A</tspan><tspan x="35" dy="24.839999999999996">collective voice should not erase the voices that compose</tspan><tspan x="35" dy="24.839999999999996">it.</tspan></text><text x="35" y="783.1199999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="807.6799999999997" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">This is an original practice reflection. Voice is</tspan><tspan x="35" dy="24.839999999999996">metaphorical: it refers to expression, participation, and</tspan><tspan x="35" dy="24.839999999999996">representation.</tspan></text><text x="35" y="909.1999999999997" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="933.7599999999996" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: Should we remove the minority view from the report?</tspan><tspan x="35" dy="24.839999999999996">B: No. We can document it alongside the decision.</tspan><tspan x="35" dy="24.839999999999996">A: How could the group preserve those differences?</tspan><tspan x="35" dy="24.839999999999996">B: By recording unresolved concerns and explaining how</tspan><tspan x="35" dy="24.839999999999996">they affected the decision.</tspan></text><text x="35" y="1084.9599999999996" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1109.5199999999995" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Explain the tension in this reflection.</tspan></text><text x="35" y="1406" fill="#2c3540" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">REFLECTION   /   08 OF 11</tspan></text></svg>