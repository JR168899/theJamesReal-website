<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>move the goalposts</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#383426"><tspan x="28" y="478.69">move the goalposts</tspan></text><text x="28" y="542.1275" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="572.9835">To change the requirements for success after a</tspan><tspan x="28" y="608.5085">process has begun.</tspan></text><text x="28" y="661.2885000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="692.1445000000001">change the rules midway; shift the requirements</tspan></text><text x="28" y="744.9245000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="775.7805000000001">Changing the criteria after submission felt like</tspan><tspan x="28" y="811.3055">moving the goalposts.</tspan></text><text x="28" y="864.0855000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="894.9415000000001">Usually critical: the speaker suggests the</tspan><tspan x="28" y="930.4665000000001">change is unfair or makes achievement</tspan><tspan x="28" y="965.9915000000001">unnecessarily difficult.</tspan></text><text x="28" y="1018.7715000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1049.6275000000003">A: The proposal met every published</tspan><tspan x="28" y="1085.1525000000004">requirement.</tspan><tspan x="28" y="1120.6775000000002">B: Then adding a new condition now would</tspan><tspan x="28" y="1156.2025000000003">move the goalposts.</tspan><tspan x="28" y="1191.7275000000004">A: Could the new requirement still be justified?</tspan><tspan x="28" y="1227.2525000000003">B: Yes, but its rationale and consequences</tspan><tspan x="28" y="1262.7775000000004">should be made explicit.</tspan></text><text x="28" y="1315.5575000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#383426"><tspan x="28" y="1346.4135">Why might this expression imply unfairness?</tspan></text></svg>