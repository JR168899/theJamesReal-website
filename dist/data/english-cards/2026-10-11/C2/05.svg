<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>move the goalposts</title><rect width="660" height="1434" fill="#efe6bd"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#383426" stroke-width="1"/><text x="35" y="43" fill="#383426" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-10-11</tspan></text><text x="35" y="88" fill="#383426" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">move the goalposts</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>move the goalposts</title><desc>Original hand-drawn story illustration: calendar, set within conversation. To change the requirements for success after a process has begun.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-2) scale(1.4)"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><g transform="translate(94 266) rotate(2) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">move the goalposts</text></svg><text x="35" y="514.4" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">To change the requirements for success after a process has</tspan><tspan x="35" dy="24.839999999999996">begun.</tspan></text><text x="35" y="615.6399999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="640.1999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Changing the criteria after submission felt like moving</tspan><tspan x="35" dy="24.839999999999996">the goalposts.</tspan></text><text x="35" y="716.8799999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="741.4399999999997" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Usually critical: the speaker suggests the change is</tspan><tspan x="35" dy="24.839999999999996">unfair or makes achievement unnecessarily difficult.</tspan></text><text x="35" y="818.1199999999997" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="842.6799999999996" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: The proposal met every published requirement.</tspan><tspan x="35" dy="24.839999999999996">B: Then adding a new condition now would move the</tspan><tspan x="35" dy="24.839999999999996">goalposts.</tspan><tspan x="35" dy="24.839999999999996">A: Could the new requirement still be justified?</tspan><tspan x="35" dy="24.839999999999996">B: Yes, but its rationale and consequences should be made</tspan><tspan x="35" dy="24.839999999999996">explicit.</tspan></text><text x="35" y="1018.7199999999996" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="1043.2799999999995" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Why might this expression imply unfairness?</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   05 OF 11</tspan></text></svg>