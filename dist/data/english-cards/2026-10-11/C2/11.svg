<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>The limits of consensus</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - Essay</tspan></text><text x="1392" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#37322b">2026-10-11 · C2 · PT</text><svg x="1132" y="70" width="260" height="134" viewBox="0 0 660 338"><title>The limits of consensus</title><desc>Original family-manga illustration: book, related to The limits of consensus.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#37322b"><tspan x="42" y="90">The limits of consensus</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="157.0">Consensus can legitimise collective action, but unanimity alone proves little. Agreement deserves authority when</tspan><tspan x="42" y="180.4">participation is substantively fair and decisions remain open to revision; these conditions matter more than the</tspan><tspan x="42" y="203.8">appearance of complete alignment.</tspan></text><text x="42" y="241.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="266.2">Fair participation requires scrutiny of how alternatives are framed. A neighbourhood committee may vote unanimously for a venue after consulting only</tspan><tspan x="42" y="289.59999999999997">residents who can attend evening meetings. The result appears orderly, yet excludes relevant experience. Such omissions bear on legitimacy even</tspan><tspan x="42" y="313.0">when formal procedures are followed.</tspan></text><text x="42" y="350.4" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="375.4">Revisability provides a second safeguard against premature closure. The committee could circumscribe its decision-making authority, record objections</tspan><tspan x="42" y="398.79999999999995">and review the venue after a trial event. This approach enables action while preserving a route for overlooked needs to influence the outcome.</tspan></text><text x="42" y="436.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#37322b"><tspan x="42" y="461.2">Legitimate consensus therefore combines inclusive deliberation with accountable revision. It holds decisiveness and openness in tension, allowing</tspan><tspan x="42" y="484.59999999999997">people to act together without pretending that differences have disappeared. A collective voice earns authority by remaining answerable to its</tspan><tspan x="42" y="508.0">constituent voices.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="563.4">BUILD YOUR OWN · Qualify the claim that consensus legitimises action. Examine inclusive participation, then revisability, using a connected example. Synthesize the</tspan><tspan x="42" y="585.4">conditions of legitimate agreement. Follow the main idea through two supported points. The conclusion brings both points together without adding a new reason.</tspan><tspan x="42" y="607.4">Why does the writer distinguish unanimity from legitimate agreement?</tspan></text></svg>