<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>The limits of consensus</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-10-11</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">The limits of consensus</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>The limits of consensus</title><desc>Original hand-drawn story illustration: book, set within conversation. An examination of the conditions under which consensus can support legitimate collective action.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(3) scale(1.4)"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#a8bbaa"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><g transform="translate(94 266) rotate(-3) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">The limits of consensus</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — main idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">Consensus can legitimise</tspan><tspan x="36" dy="23.459999999999997">collective action, but unanimity</tspan><tspan x="36" dy="23.459999999999997">alone proves little. Agreement</tspan><tspan x="36" dy="23.459999999999997">deserves authority when</tspan><tspan x="36" dy="23.459999999999997">participation is substantively</tspan><tspan x="36" dy="23.459999999999997">fair and decisions remain open to</tspan><tspan x="36" dy="23.459999999999997">revision; these conditions matter</tspan><tspan x="36" dy="23.459999999999997">more than the appearance of</tspan><tspan x="36" dy="23.459999999999997">complete alignment.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — point + example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="384" dy="0">Fair participation requires</tspan><tspan x="384" dy="23.459999999999997">scrutiny of how alternatives are</tspan><tspan x="384" dy="23.459999999999997">framed. A neighbourhood committee</tspan><tspan x="384" dy="23.459999999999997">may vote unanimously for a venue</tspan><tspan x="384" dy="23.459999999999997">after consulting only residents</tspan><tspan x="384" dy="23.459999999999997">who can attend evening meetings.</tspan><tspan x="384" dy="23.459999999999997">The result appears orderly, yet</tspan><tspan x="384" dy="23.459999999999997">excludes relevant experience.</tspan><tspan x="384" dy="23.459999999999997">Such omissions bear on legitimacy</tspan><tspan x="384" dy="23.459999999999997">even when formal procedures are</tspan><tspan x="384" dy="23.459999999999997">followed.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — point + example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="732" dy="0">Revisability provides a second</tspan><tspan x="732" dy="23.459999999999997">safeguard against premature</tspan><tspan x="732" dy="23.459999999999997">closure. The committee could</tspan><tspan x="732" dy="23.459999999999997">circumscribe its decision-making</tspan><tspan x="732" dy="23.459999999999997">authority, record objections and</tspan><tspan x="732" dy="23.459999999999997">review the venue after a trial</tspan><tspan x="732" dy="23.459999999999997">event. This approach enables</tspan><tspan x="732" dy="23.459999999999997">action while preserving a route</tspan><tspan x="732" dy="23.459999999999997">for overlooked needs to influence</tspan><tspan x="732" dy="23.459999999999997">the outcome.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — restate + close</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="1080" dy="0">Legitimate consensus therefore</tspan><tspan x="1080" dy="23.459999999999997">combines inclusive deliberation</tspan><tspan x="1080" dy="23.459999999999997">with accountable revision. It</tspan><tspan x="1080" dy="23.459999999999997">holds decisiveness and openness</tspan><tspan x="1080" dy="23.459999999999997">in tension, allowing people to</tspan><tspan x="1080" dy="23.459999999999997">act together without pretending</tspan><tspan x="1080" dy="23.459999999999997">that differences have</tspan><tspan x="1080" dy="23.459999999999997">disappeared. A collective voice</tspan><tspan x="1080" dy="23.459999999999997">earns authority by remaining</tspan><tspan x="1080" dy="23.459999999999997">answerable to its constituent</tspan><tspan x="1080" dy="23.459999999999997">voices.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Why does the writer distinguish unanimity from legitimate agreement?</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>