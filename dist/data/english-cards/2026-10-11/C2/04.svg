<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hold in tension</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#3d3028"><tspan x="28" y="478.46">hold in tension</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="572.2889999999999">To recognise competing ideas or values without</tspan><tspan x="28" y="607.6389999999999">prematurely resolving or dismissing either.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="690.8629999999999">keep both in view; acknowledge a competing</tspan><tspan x="28" y="726.213">claim</tspan></text><text x="28" y="778.7330000000001" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="809.437">We must hold openness and accountability in</tspan><tspan x="28" y="844.787">tension.</tspan></text><text x="28" y="897.3070000000001" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="928.0110000000001">Hold two values in tension recognizes their</tspan><tspan x="28" y="963.3610000000001">competing claims without pretending the</tspan><tspan x="28" y="998.7110000000001">difficulty has disappeared.</tspan></text><text x="28" y="1051.2310000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1081.9350000000002">A: Can we resolve openness and privacy with a</tspan><tspan x="28" y="1117.285">single rule?</tspan><tspan x="28" y="1152.6350000000002">B: We may need to hold them in tension.</tspan><tspan x="28" y="1187.9850000000001">A: Rather than declare one value irrelevant?</tspan><tspan x="28" y="1223.3350000000003">B: Yes. The arrangement must remain</tspan><tspan x="28" y="1258.6850000000002">answerable to both.</tspan></text><text x="28" y="1311.2050000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1341.909">Describe a choice that holds openness and</tspan><tspan x="28" y="1377.259">privacy in tension without dismissing either.</tspan></text></svg>