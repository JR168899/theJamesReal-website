<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Not until… did…</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team uses a whiteboard to explain a plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team uses a whiteboard to explain a plan.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="481.91">Not until… did…</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="582.7065000000001">After a fronted Not until phrase or clause,</tspan><tspan x="28" y="620.6815000000001">invert the auxiliary and subject in the main</tspan><tspan x="28" y="658.6565000000002">clause.</tspan></text><text x="28" y="715.0765000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="748.0605000000002">Not until the assumptions were made explicit</tspan><tspan x="28" y="786.0355000000002">did the disagreement become manageable.</tspan></text><text x="28" y="842.4555000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="875.4395000000002">Not until everyone had spoken did we vote.</tspan><tspan x="28" y="913.4145000000002">Keep normal word order inside the</tspan><tspan x="28" y="951.3895000000002">until-clause; inversion follows it.</tspan></text><text x="28" y="1007.8095000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1040.7935000000002">A: When did the discussion improve?</tspan><tspan x="28" y="1078.7685000000001">B: Not until we named the underlying</tspan><tspan x="28" y="1116.7435000000003">assumptions did we make progress.</tspan><tspan x="28" y="1154.7185000000002">A: Why is did placed before the subject?</tspan><tspan x="28" y="1192.6935000000003">B: The fronted negative expression triggers</tspan><tspan x="28" y="1230.6685000000002">inversion in the main clause.</tspan></text><text x="28" y="1287.0885" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#382f40"><tspan x="28" y="1320.0725000000002">Rewrite: We understood the objection only</tspan><tspan x="28" y="1358.0475000000001">after we read the full account.</tspan></text></svg>