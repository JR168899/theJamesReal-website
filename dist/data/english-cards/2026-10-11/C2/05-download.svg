<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>move the goalposts</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>move the goalposts</title><desc>Original family-manga illustration: calendar, related to move the goalposts.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-63" y="-46" width="126" height="108" rx="7" fill="#e2c6b6"/><path d="M-63-15H63M-37-62V-32M37-62V-32M-39 4H-25M-7 4H7M25 4H39M-39 24H-25M-7 24H7M25 24H39M-39 44H-25M-7 44H7"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#383426"><tspan x="28" y="476.85">move the goalposts</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="567.4275">To change the requirements for success after a</tspan><tspan x="28" y="601.5525">process has begun.</tspan></text><text x="28" y="652.2525" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="681.8924999999999">change the rules midway; shift the requirements</tspan></text><text x="28" y="732.5925000000001" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="762.2325000000001">Changing the criteria after submission felt like</tspan><tspan x="28" y="796.3575000000001">moving the goalposts.</tspan></text><text x="28" y="847.0575000000001" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="876.6975">Usually critical: the speaker suggests the change</tspan><tspan x="28" y="910.8225">is unfair or makes achievement unnecessarily</tspan><tspan x="28" y="944.9475">difficult.</tspan></text><text x="28" y="995.6475000000002" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="1025.2875000000001">A: The proposal met every published</tspan><tspan x="28" y="1059.4125000000001">requirement.</tspan><tspan x="28" y="1093.5375000000001">B: Then adding a new condition now would move</tspan><tspan x="28" y="1127.6625000000001">the goalposts.</tspan><tspan x="28" y="1161.7875000000001">A: Could the new requirement still be justified?</tspan><tspan x="28" y="1195.9125000000001">B: Yes, but its rationale and consequences</tspan><tspan x="28" y="1230.0375000000001">should be made explicit.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.3" font-weight="400" fill="#383426"><tspan x="28" y="1310.3775">Why might this expression imply unfairness?</tspan><tspan x="28" y="1344.5025">(Model: People are judged against criteria that</tspan><tspan x="28" y="1378.6275">changed after they acted.)</tspan></text></svg>