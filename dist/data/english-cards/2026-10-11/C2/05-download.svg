<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>move the goalposts</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">move the goalposts</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">To change the requirements for success after a</tspan><tspan x="28" y="589.3795">process has begun.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="663.9515">change the rules midway; shift the requirements</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="738.5235">Changing the criteria after submission felt like moving</tspan><tspan x="28" y="770.1985">the goalposts.</tspan></text><text x="28" y="817.2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="844.7705">Usually critical: changing the requirements in a way</tspan><tspan x="28" y="876.4454999999999">that makes success harder or less predictable.</tspan></text><text x="28" y="923.5054999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="951.0174999999999">A: We submitted the design against the agreed</tspan><tspan x="28" y="982.6924999999999">criteria.</tspan><tspan x="28" y="1014.3675">B: Now they want a different size and an additional</tspan><tspan x="28" y="1046.0425">room.</tspan><tspan x="28" y="1077.7175">A: That feels like moving the goalposts.</tspan><tspan x="28" y="1109.3925">B: We should ask whether the new requirements will</tspan><tspan x="28" y="1141.0674999999999">change the deadline.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Explain why adding new criteria after submission may</tspan><tspan x="28" y="1317.667">be described as moving the goalposts. (Model: The</tspan><tspan x="28" y="1349.3419999999999">standards for success change after people have</tspan><tspan x="28" y="1381.017">already worked toward the original ones.)</tspan></text></svg>