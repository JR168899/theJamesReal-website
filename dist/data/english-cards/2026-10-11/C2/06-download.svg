<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the detail</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written list makes tasks visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written list makes tasks visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#383426"><tspan x="28" y="475.47">the devil is in the detail</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">A saying that apparently minor details can determine</tspan><tspan x="28" y="596.3355000000001">whether a plan succeeds or creates difficulties.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="674.2035000000001">small points can cause big problems; careful</tspan><tspan x="28" y="707.2785000000001">execution matters</tspan></text><text x="28" y="756.4185" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="785.1465000000001">The agreement sounds fair, but the devil is in the</tspan><tspan x="28" y="818.2215000000001">detail.</tspan></text><text x="28" y="867.3615" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="896.0895">A variant of the devil is in the details. Either form</tspan><tspan x="28" y="929.1645000000001">needs a consequential detail, not a trivial</tspan><tspan x="28" y="962.2395">observation.</tspan></text><text x="28" y="1011.3795" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1040.1075">Sarah: The agreement sounds straightforward.</tspan><tspan x="28" y="1073.1825000000001">Liam: Check the cancellation clause before we</tspan><tspan x="28" y="1106.2575000000002">accept it.</tspan><tspan x="28" y="1139.3325">Sarah: The devil is in the detail, then?</tspan><tspan x="28" y="1172.4075">Liam: Yes. The deposit is refundable only until</tspan><tspan x="28" y="1205.4825">tomorrow.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Why is a refund deadline a relevant example of this</tspan><tspan x="28" y="1320.923">idiom? (Model: A small contractual condition can</tspan><tspan x="28" y="1353.998">have a substantial practical consequence.)</tspan></text></svg>