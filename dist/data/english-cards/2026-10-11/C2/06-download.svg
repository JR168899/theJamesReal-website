<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the detail</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small details in a document can have important consequences.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small details in a document can have important consequences.</tspan></text><a href="https://www.pexels.com/photo/person-holding-silver-pen-signing-photographers-signature-175045/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 175045</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#383426"><tspan x="28" y="476.85">the devil is in the detail</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="567.4275">A saying that apparently minor details can</tspan><tspan x="28" y="601.5525">determine whether a plan succeeds or creates</tspan><tspan x="28" y="635.6775">difficulties.</tspan></text><text x="28" y="686.3775" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="716.0175">small points can cause big problems; careful</tspan><tspan x="28" y="750.1425">execution matters</tspan></text><text x="28" y="800.8425000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="830.4825000000001">The agreement sounds fair, but the devil is in the</tspan><tspan x="28" y="864.6075000000001">detail.</tspan></text><text x="28" y="915.3075000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="944.9475000000001">Use it to direct attention to implementation. Detail</tspan><tspan x="28" y="979.0725000000001">is commonly singular in this established form,</tspan><tspan x="28" y="1013.1975000000001">though details also occurs.</tspan></text><text x="28" y="1063.8975" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1093.5375000000001">A: Everyone supports shared ownership.</tspan><tspan x="28" y="1127.6625000000001">B: Yes, but the devil is in the detail: who can veto</tspan><tspan x="28" y="1161.7875000000001">a decision?</tspan><tspan x="28" y="1195.9125000000001">A: Which detail could alter the outcome?</tspan><tspan x="28" y="1230.0375000000001">B: Who has the authority to revisit the decision.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1310.3775">Give one detail that could complicate shared</tspan><tspan x="28" y="1344.5025">ownership. (Model: The rules governing who can</tspan><tspan x="28" y="1378.6275">veto a decision.)</tspan></text></svg>