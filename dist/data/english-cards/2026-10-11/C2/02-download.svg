<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>circumscribe</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written plan connects limited time with a chosen purpose.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written plan connects limited time with a chosen purpose.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">circumscribe</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /ˈsɜːrkəmskraɪb/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">circumscribe · circumscribes · circumscribed · circumscribed ·</tspan><tspan x="28" y="562.6650000000001">circumscribing (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="614.5962000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="642.8682">To restrict something within defined boundaries.</tspan></text><text x="28" y="691.2282000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="719.5002000000001">delimit; restrict · Delimit stresses defining</tspan><tspan x="28" y="752.0502">boundaries; restrict stresses limiting freedom or</tspan><tspan x="28" y="784.6002000000001">scope.</tspan></text><text x="28" y="832.9602000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="861.2322">The brief circumscribes the committee’s authority</tspan><tspan x="28" y="893.7822">without dictating every decision.</tspan></text><text x="28" y="942.1422000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="970.4142">A formal verb, often used of authority, discretion, or</tspan><tspan x="28" y="1002.9642">possibilities. It emphasises setting limits rather than</tspan><tspan x="28" y="1035.5142">necessarily eliminating something.</tspan></text><text x="28" y="1083.8742000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1112.1462000000001">A: Can the committee change the project’s purpose?</tspan><tspan x="28" y="1144.6962">B: No. Its authority is circumscribed by the brief.</tspan><tspan x="28" y="1177.2462">A: Would those limits prevent useful action?</tspan><tspan x="28" y="1209.7962000000002">B: They could clarify which decisions require wider</tspan><tspan x="28" y="1242.3462000000002">consent.</tspan></text><text x="28" y="1290.7062000000003" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1318.9782000000002">Complete: The brief ____ the committee’s authority.</tspan><tspan x="28" y="1351.5282000000002">(Model: circumscribes)</tspan></text></svg>