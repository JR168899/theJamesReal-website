<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>circumscribe</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="41.17" font-weight="700" fill="#382d2e"><tspan x="28" y="473.17">circumscribe</tspan></text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="508.5225">US /ˈsɜːrkəmskraɪb/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.69" font-weight="400" fill="#382d2e"><tspan x="28" y="533.7257000000001">circumscribe · circumscribes · circumscribed · circumscribed ·</tspan><tspan x="28" y="557.7475000000001">circumscribing (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="607.7243000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="634.9322999999999">To restrict something within defined boundaries.</tspan></text><text x="28" y="681.4723000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="708.6803">delimit; restrict · Delimit stresses defining boundaries;</tspan><tspan x="28" y="740.0053">restrict stresses limiting freedom or scope.</tspan></text><text x="28" y="786.5453000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="813.7533000000001">The brief circumscribes the committee’s authority</tspan><tspan x="28" y="845.0783000000001">without dictating every decision.</tspan></text><text x="28" y="891.6183000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="918.8263">A formal verb, often used of authority, discretion, or</tspan><tspan x="28" y="950.1513">possibilities. It emphasises setting limits rather than</tspan><tspan x="28" y="981.4762999999999">necessarily eliminating something.</tspan></text><text x="28" y="1028.0163" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1055.2243">A: The volunteers can make some decisions</tspan><tspan x="28" y="1086.5493000000001">independently.</tspan><tspan x="28" y="1117.8743000000002">B: What circumscribes their authority?</tspan><tspan x="28" y="1149.1993">A: They can change seating but cannot alter the</tspan><tspan x="28" y="1180.5243">building&#x27;s access arrangements.</tspan><tspan x="28" y="1211.8493">B: Then those limits should be explicit.</tspan></text><text x="28" y="1258.3893" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.5973000000001">Give one sentence circumscribing a volunteer&#x27;s</tspan><tspan x="28" y="1316.9223000000002">authority without making the role useless. (Model:</tspan><tspan x="28" y="1348.2473000000002">You may rearrange movable chairs, but you must</tspan><tspan x="28" y="1379.5723">keep the marked access routes clear.)</tspan></text></svg>