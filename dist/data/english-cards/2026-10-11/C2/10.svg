<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What assumption did the discussion leave unexamined?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener gives attention to another speaker.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener gives attention to another speaker.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#353331"><tspan x="28" y="473.86">What assumption did the</tspan><tspan x="28" y="526.1850000000001">discussion leave</tspan><tspan x="28" y="578.51">unexamined?</tspan></text><text x="28" y="635.385" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="663.0490000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="694.8990000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="742.219" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="769.8830000000002">What assumption did the discussion leave</tspan><tspan x="28" y="801.7330000000002">unexamined?</tspan></text><text x="28" y="849.0530000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="876.7170000000002">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="908.5670000000002">different preference or a declined invitation without</tspan><tspan x="28" y="940.4170000000003">asking the person to justify it.</tspan></text><text x="28" y="987.7370000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1015.4010000000002">A: What assumption did the discussion leave</tspan><tspan x="28" y="1047.2510000000002">unexamined?</tspan><tspan x="28" y="1079.101">B: That everyone could book online.</tspan><tspan x="28" y="1110.9510000000002">A: Was that ever stated as a condition?</tspan><tspan x="28" y="1142.8010000000002">B: No. It shaped the proposal without becoming</tspan><tspan x="28" y="1174.6510000000003">visible.</tspan><tspan x="28" y="1206.5010000000002">A: How could the next discussion test it?</tspan><tspan x="28" y="1238.351">B: By asking who would be excluded and what an</tspan><tspan x="28" y="1270.2010000000002">alternative would require.</tspan></text><text x="28" y="1317.5210000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1345.1850000000002">Identify an assumption in a phone-only booking</tspan><tspan x="28" y="1377.035">proposal and suggest a question that tests it.</tspan></text></svg>