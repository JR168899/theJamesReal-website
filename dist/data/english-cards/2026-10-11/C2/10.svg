<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What assumption did the discussion leave unexamined?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">What assumption did the</tspan><tspan x="28" y="533.43">discussion leave</tspan><tspan x="28" y="589.78">unexamined?</tspan></text><text x="28" y="651.0299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="680.822">A question inviting scrutiny of a belief that a</tspan><tspan x="28" y="715.122">discussion may have taken for granted.</tspan></text><text x="28" y="766.0819999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="795.874">What assumption did the discussion leave</tspan><tspan x="28" y="830.174">unexamined?</tspan></text><text x="28" y="881.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="910.926">Unexamined does not necessarily mean false.</tspan><tspan x="28" y="945.226">Ask what evidence or alternative perspective</tspan><tspan x="28" y="979.5260000000001">might test the assumption.</tspan></text><text x="28" y="1030.4859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1060.278">A: What assumption did the discussion leave</tspan><tspan x="28" y="1094.578">unexamined?</tspan><tspan x="28" y="1128.878">B: That everyone had the same freedom to</tspan><tspan x="28" y="1163.178">participate.</tspan><tspan x="28" y="1197.478">A: How might we test that assumption?</tspan><tspan x="28" y="1231.778">B: We could ask whose evidence or experience</tspan><tspan x="28" y="1266.078">might challenge it.</tspan></text><text x="28" y="1317.038" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1346.83">Offer a follow-up that invites nuance rather than a</tspan><tspan x="28" y="1381.1299999999999">yes/no answer.</tspan></text></svg>