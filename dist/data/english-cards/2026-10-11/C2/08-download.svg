<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A collective voice should not erase the voices that compose it.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - Quote</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#2c3540">2026-10-11 · C2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A collective voice should not erase the voices that compose it.</title><desc>Original family-manga illustration: light, related to A collective voice should not erase the voices that compose it..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-31-33Q-31-68 0-68Q32-68 32-33Q32-11 15 3V28H-15V3Q-31-11-31-33Z" fill="#e5c47d"/><path d="M-15 13H15M-14 37H14M-8 45H8M0-87V-100M-48-73L-59-84M48-73L59-84M-60-38H-78M60-38H78"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">A collective voice should not</tspan><tspan x="28" y="522.045">erase the voices that compose</tspan><tspan x="28" y="572.0699999999999">it.</tspan></text><text x="28" y="626.445" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="652.8930000000001">A group&#x27;s shared position should preserve accountability</tspan><tspan x="28" y="683.3430000000002">to the different people within it.</tspan></text><text x="28" y="728.5830000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="755.0310000000002">A group&#x27;s shared position should preserve accountability</tspan><tspan x="28" y="785.4810000000002">to the different people within it</tspan></text><text x="28" y="830.7210000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="857.1690000000002">A unanimous statement can conceal unresolved</tspan><tspan x="28" y="887.6190000000003">concerns. A collective voice should not erase the voices</tspan><tspan x="28" y="918.0690000000002">that compose it.</tspan></text><text x="28" y="963.3090000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="989.7570000000002">This is an original practice reflection. Voice is</tspan><tspan x="28" y="1020.2070000000002">metaphorical: it refers to expression, participation, and</tspan><tspan x="28" y="1050.6570000000002">representation.</tspan></text><text x="28" y="1095.8970000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1122.345">A: Should we remove the minority view from the report?</tspan><tspan x="28" y="1152.795">B: No. We can document it alongside the decision.</tspan><tspan x="28" y="1183.2450000000001">A: How could the group preserve those differences?</tspan><tspan x="28" y="1213.695">B: By recording unresolved concerns and explaining how</tspan><tspan x="28" y="1244.145">they affected the decision.</tspan></text><text x="28" y="1289.3850000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1315.833">Explain the tension in this reflection. (Model: A group</tspan><tspan x="28" y="1346.2830000000001">needs a shared position while still acknowledging the</tspan><tspan x="28" y="1376.7330000000002">distinct views of its members.)</tspan></text></svg>