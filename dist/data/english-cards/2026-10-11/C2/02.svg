<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>circumscribe</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="42.550000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="474.55">circumscribe</tspan></text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="511.0875">US /ˈsɜːrkəmskraɪb/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.35" font-weight="400" fill="#382d2e"><tspan x="28" y="537.1355">circumscribe · circumscribes · circumscribed · circumscribed ·</tspan><tspan x="28" y="561.9625">circumscribing (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="613.6144999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.7344999999999">To restrict something within defined boundaries.</tspan></text><text x="28" y="689.8344999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="717.9544999999999">delimit; restrict · Delimit stresses defining</tspan><tspan x="28" y="750.3294999999999">boundaries; restrict stresses limiting freedom or</tspan><tspan x="28" y="782.7044999999999">scope.</tspan></text><text x="28" y="830.8045" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="858.9245">The brief circumscribes the committee’s authority</tspan><tspan x="28" y="891.2995">without dictating every decision.</tspan></text><text x="28" y="939.3995" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="967.5195">A formal verb, often used of authority, discretion, or</tspan><tspan x="28" y="999.8945">possibilities. It emphasises setting limits rather than</tspan><tspan x="28" y="1032.2694999999999">necessarily eliminating something.</tspan></text><text x="28" y="1080.3695" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1108.4895000000001">A: The volunteers can make some decisions</tspan><tspan x="28" y="1140.8645000000001">independently.</tspan><tspan x="28" y="1173.2395000000001">B: What circumscribes their authority?</tspan><tspan x="28" y="1205.6145000000001">A: They can change seating but cannot alter the</tspan><tspan x="28" y="1237.9895000000001">building&#x27;s access arrangements.</tspan><tspan x="28" y="1270.3645000000001">B: Then those limits should be explicit.</tspan></text><text x="28" y="1318.4645" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1346.5845000000002">Give one sentence circumscribing a volunteer&#x27;s</tspan><tspan x="28" y="1378.9595000000002">authority without making the role useless.</tspan></text></svg>