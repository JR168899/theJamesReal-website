<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>circumscribe</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written plan connects limited time with a chosen purpose.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written plan connects limited time with a chosen purpose.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">circumscribe</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˈsɜːrkəmskraɪb/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">circumscribe · circumscribes · circumscribed · circumscribed ·</tspan><tspan x="28" y="564.7724999999999">circumscribing (base · third person · past · past participle ·</tspan><tspan x="28" y="590.1363">-ing)</tspan></text><text x="28" y="642.9051000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="671.6331000000001">To restrict something within defined boundaries.</tspan></text><text x="28" y="720.7731" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="749.5011000000001">delimit; restrict · Delimit stresses defining</tspan><tspan x="28" y="782.5761000000001">boundaries; restrict stresses limiting freedom or</tspan><tspan x="28" y="815.6511">scope.</tspan></text><text x="28" y="864.7911" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="893.5191000000001">The brief circumscribes the committee’s authority</tspan><tspan x="28" y="926.5941000000001">without dictating every decision.</tspan></text><text x="28" y="975.7341" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1004.4621000000001">A formal verb, often used of authority, discretion, or</tspan><tspan x="28" y="1037.5371">possibilities. It emphasises setting limits rather than</tspan><tspan x="28" y="1070.6121">necessarily eliminating something.</tspan></text><text x="28" y="1119.7521" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1148.4801">A: Can the committee change the project’s purpose?</tspan><tspan x="28" y="1181.5551">B: No. Its authority is circumscribed by the brief.</tspan><tspan x="28" y="1214.6301">A: Would those limits prevent useful action?</tspan><tspan x="28" y="1247.7051">B: They could clarify which decisions require wider</tspan><tspan x="28" y="1280.7801">consent.</tspan></text><text x="28" y="1329.9200999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1358.6480999999999">Complete: The brief ____ the committee’s authority.</tspan></text></svg>