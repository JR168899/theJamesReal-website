<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the detail</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small details in a document can have important consequences.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small details in a document can have important consequences.</tspan></text><a href="https://www.pexels.com/photo/person-holding-silver-pen-signing-photographers-signature-175045/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 175045</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">the devil is in the detail</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">A saying that apparently minor details can</tspan><tspan x="28" y="607.6389999999999">determine whether a plan succeeds or creates</tspan><tspan x="28" y="642.9889999999999">difficulties.</tspan></text><text x="28" y="695.5089999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="726.2129999999999">small points can cause big problems; careful</tspan><tspan x="28" y="761.5629999999999">execution matters</tspan></text><text x="28" y="814.083" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="844.7869999999999">The agreement sounds fair, but the devil is in</tspan><tspan x="28" y="880.137">the detail.</tspan></text><text x="28" y="932.657" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="963.361">Use it to direct attention to implementation.</tspan><tspan x="28" y="998.711">Detail is commonly singular in this established</tspan><tspan x="28" y="1034.061">form, though details also occurs.</tspan></text><text x="28" y="1086.5810000000001" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1117.285">A: Everyone supports shared ownership.</tspan><tspan x="28" y="1152.635">B: Yes, but the devil is in the detail: who can</tspan><tspan x="28" y="1187.9850000000001">veto a decision?</tspan><tspan x="28" y="1223.335">A: Which detail could alter the outcome?</tspan><tspan x="28" y="1258.6850000000002">B: Who has the authority to revisit the decision.</tspan></text><text x="28" y="1311.2050000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1341.909">Give one detail that could complicate shared</tspan><tspan x="28" y="1377.259">ownership.</tspan></text></svg>