<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the detail</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written list makes tasks visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written list makes tasks visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#383426"><tspan x="28" y="476.85">the devil is in the detail</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="567.4275">A saying that apparently minor details can</tspan><tspan x="28" y="601.5525">determine whether a plan succeeds or creates</tspan><tspan x="28" y="635.6775">difficulties.</tspan></text><text x="28" y="686.3775" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="716.0175">small points can cause big problems; careful</tspan><tspan x="28" y="750.1425">execution matters</tspan></text><text x="28" y="800.8425000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="830.4825000000001">The agreement sounds fair, but the devil is in the</tspan><tspan x="28" y="864.6075000000001">detail.</tspan></text><text x="28" y="915.3075000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="944.9475000000001">A variant of the devil is in the details. Either form</tspan><tspan x="28" y="979.0725000000001">needs a consequential detail, not a trivial</tspan><tspan x="28" y="1013.1975000000001">observation.</tspan></text><text x="28" y="1063.8975" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1093.5375000000001">Sarah: The agreement sounds straightforward.</tspan><tspan x="28" y="1127.6625000000001">Liam: Check the cancellation clause before we</tspan><tspan x="28" y="1161.7875000000001">accept it.</tspan><tspan x="28" y="1195.9125000000001">Sarah: The devil is in the detail, then?</tspan><tspan x="28" y="1230.0375000000001">Liam: Yes. The deposit is refundable only until</tspan><tspan x="28" y="1264.1625000000001">tomorrow.</tspan></text><text x="28" y="1314.8625" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#383426"><tspan x="28" y="1344.5025">Why is a refund deadline a relevant example of</tspan><tspan x="28" y="1378.6275">this idiom?</tspan></text></svg>