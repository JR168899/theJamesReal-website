<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#3d3028"><tspan x="28" y="478.46">bear on</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="572.2889999999999">To be relevant to, or have an effect on, a matter</tspan><tspan x="28" y="607.6389999999999">under consideration.</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="690.8629999999999">relate to; have a bearing on</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="774.0869999999999">The history of the site bears directly on the</tspan><tspan x="28" y="809.4369999999999">proposed design.</tspan></text><text x="28" y="861.957" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="892.661">Use bear on a question, judgement, or</tspan><tspan x="28" y="928.011">outcome. It does not mean physically carrying</tspan><tspan x="28" y="963.361">something in this sense.</tspan></text><text x="28" y="1015.881" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1046.585">A: Is the earlier dispute relevant?</tspan><tspan x="28" y="1081.935">B: Yes. It bears on how residents interpret the</tspan><tspan x="28" y="1117.285">proposal.</tspan><tspan x="28" y="1152.635">A: So procedural fairness is not the whole</tspan><tspan x="28" y="1187.9850000000001">question?</tspan><tspan x="28" y="1223.335">B: Correct. We must also ask whose</tspan><tspan x="28" y="1258.685">experiences the process recognises.</tspan></text><text x="28" y="1311.2050000000002" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#3d3028"><tspan x="28" y="1341.909">Rewrite with “bear on”: This evidence is relevant</tspan><tspan x="28" y="1377.259">to our decision.</tspan></text></svg>