<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Agreement is meaningful only when dissent remains possible.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group develops a shared plan around a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group develops a shared plan around a board.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="468.8">Agreement is meaningful only</tspan><tspan x="28" y="514.8000000000001">when dissent remains possible.</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="589.12">An agreement has substance only if people are still free to</tspan><tspan x="28" y="617.12">express disagreement.</tspan></text><text x="28" y="658.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="683.04">Real consent requires room for disagreement.; A shared</tspan><tspan x="28" y="711.04">position must permit challenge.</tspan></text><text x="28" y="752.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="776.9599999999999">Agreement is meaningful only when dissent remains possible.</tspan></text><text x="28" y="818.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="842.8799999999999">Dissent means expressing disagreement. The statement</tspan><tspan x="28" y="870.8799999999999">concerns conditions for meaningful agreement, not a</tspan><tspan x="28" y="898.8799999999999">requirement that someone must always object.</tspan></text><text x="28" y="940.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="964.7999999999998">A: Everyone approved the plan in the meeting.</tspan><tspan x="28" y="992.7999999999998">B: Could anyone object without risking their place in the</tspan><tspan x="28" y="1020.7999999999998">group?</tspan><tspan x="28" y="1048.7999999999997">A: I am not sure.</tspan><tspan x="28" y="1076.7999999999997">B: Agreement is meaningful only when dissent remains</tspan><tspan x="28" y="1104.7999999999997">possible.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">Explain why unanimous approval may not establish genuine</tspan><tspan x="28" y="1309.1200000000001">consent if people fear consequences for objecting. (Model:</tspan><tspan x="28" y="1337.1200000000001">People may comply because dissent feels unsafe, so apparent</tspan><tspan x="28" y="1365.1200000000001">agreement may not express their actual judgment.)</tspan></text></svg>