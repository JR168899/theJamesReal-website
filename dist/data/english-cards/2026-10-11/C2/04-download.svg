<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hold in tension</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Comparing alternatives helps clarify competing benefits and drawbacks.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Comparing alternatives helps clarify competing benefits and drawbacks.</tspan></text><a href="https://www.pexels.com/photo/colleagues-using-a-laptop-7212946/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7212946</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#3d3028"><tspan x="28" y="476.85">hold in tension</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="567.4275">To recognise competing ideas or values without</tspan><tspan x="28" y="601.5525">prematurely resolving or dismissing either.</tspan></text><text x="28" y="652.2525" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="681.8925">keep both in view; acknowledge a competing</tspan><tspan x="28" y="716.0175">claim</tspan></text><text x="28" y="766.7175000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="796.3575000000001">We must hold openness and accountability in</tspan><tspan x="28" y="830.4825000000001">tension.</tspan></text><text x="28" y="881.1825000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="910.8225000000001">Common in analytical discussion. Holding two</tspan><tspan x="28" y="944.9475000000001">values in tension allows their competing demands</tspan><tspan x="28" y="979.0725000000001">to remain visible.</tspan></text><text x="28" y="1029.7725" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1059.4125000000001">A: Can one principle settle the matter?</tspan><tspan x="28" y="1093.5375000000001">B: Probably not. We need to hold both concerns</tspan><tspan x="28" y="1127.6625000000001">in tension.</tspan><tspan x="28" y="1161.7875000000001">A: Must we choose one value over the other?</tspan><tspan x="28" y="1195.9125000000001">B: Not immediately; preserving the tension can</tspan><tspan x="28" y="1230.0375000000001">improve the decision.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1310.3775">What does this phrase suggest about conflicting</tspan><tspan x="28" y="1344.5025">values? (Model: They may need to coexist</tspan><tspan x="28" y="1378.6275">without being reduced to a single simple rule.)</tspan></text></svg>