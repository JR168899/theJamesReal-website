<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hold in tension</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">hold in tension</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">To recognise competing ideas or values without</tspan><tspan x="28" y="589.3795">prematurely resolving or dismissing either.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="663.9515">keep both in view; acknowledge a competing claim</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="738.5235">We must hold openness and accountability in</tspan><tspan x="28" y="770.1985">tension.</tspan></text><text x="28" y="817.2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="844.7705">Hold two values in tension recognizes their</tspan><tspan x="28" y="876.4454999999999">competing claims without pretending the difficulty has</tspan><tspan x="28" y="908.1205">disappeared.</tspan></text><text x="28" y="955.1804999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="982.6925">Sarah: Can we resolve openness and privacy with a</tspan><tspan x="28" y="1014.3675">single rule?</tspan><tspan x="28" y="1046.0425">Liam: We may need to hold them in tension.</tspan><tspan x="28" y="1077.7175">Sarah: Rather than declare one value irrelevant?</tspan><tspan x="28" y="1109.3925">Liam: Yes. The arrangement must remain answerable</tspan><tspan x="28" y="1141.0675">to both.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">Describe a choice that holds openness and privacy in</tspan><tspan x="28" y="1317.667">tension without dismissing either. (Model: Publish</tspan><tspan x="28" y="1349.3419999999999">useful information about the event while protecting</tspan><tspan x="28" y="1381.017">participants&#x27; private details.)</tspan></text></svg>