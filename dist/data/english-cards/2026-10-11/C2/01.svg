<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>reciprocity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="474.32">reciprocity</tspan></text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="510.65999999999997">US /ˌresɪˈprɑːsəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.240000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="536.5672">Usually uncountable: reciprocity; no regular plural in this sense.</tspan></text><text x="28" y="587.94" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="615.908">The practice or principle of mutual exchange,</tspan><tspan x="28" y="648.1080000000001">response, or obligation.</tspan></text><text x="28" y="695.9480000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="723.916">mutual exchange; mutuality · Mutuality is broader;</tspan><tspan x="28" y="756.1160000000001">reciprocity often involves a responding act or</tspan><tspan x="28" y="788.316">obligation.</tspan></text><text x="28" y="836.1560000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="864.124">Meaningful reciprocity cannot always be reduced to</tspan><tspan x="28" y="896.3240000000001">an exchange of equal favours.</tspan></text><text x="28" y="944.1640000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="972.1320000000001">Usually uncountable. Reciprocity need not imply</tspan><tspan x="28" y="1004.3320000000001">identical contributions, immediate repayment, or</tspan><tspan x="28" y="1036.5320000000002">perfectly equal power.</tspan></text><text x="28" y="1084.372" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1112.3400000000001">Sarah: Do we owe them exactly the same favor?</tspan><tspan x="28" y="1144.5400000000002">Liam: Reciprocity need not mean keeping an exact</tspan><tspan x="28" y="1176.7400000000002">account.</tspan><tspan x="28" y="1208.94">Sarah: How might we respond, then?</tspan><tspan x="28" y="1241.14">Liam: Offer help when they need it, rather than</tspan><tspan x="28" y="1273.3400000000001">calculating an equal return.</tspan></text><text x="28" y="1321.18" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#382d2e"><tspan x="28" y="1349.1480000000001">Distinguish reciprocity from a commercial exchange</tspan><tspan x="28" y="1381.3480000000002">with a fixed price.</tspan></text></svg>