<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="44.85" font-weight="700" fill="#3d3028"><tspan x="28" y="476.85">bear on</tspan></text><text x="28" y="537.7875" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="567.4275">To be relevant to, or have an effect on, a matter</tspan><tspan x="28" y="601.5525">under consideration.</tspan></text><text x="28" y="652.2525" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="681.8925">relate to; have a bearing on</tspan></text><text x="28" y="732.5925000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="762.2325000000001">The history of the site bears directly on the</tspan><tspan x="28" y="796.3575000000001">proposed design.</tspan></text><text x="28" y="847.0575000000001" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="876.6975000000001">Use bear on a question, judgement, or outcome.</tspan><tspan x="28" y="910.8225000000001">It does not mean physically carrying something in</tspan><tspan x="28" y="944.9475000000001">this sense.</tspan></text><text x="28" y="995.6475000000002" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1025.2875000000001">A: Is the earlier dispute relevant?</tspan><tspan x="28" y="1059.4125000000001">B: Yes. It bears on how residents interpret the</tspan><tspan x="28" y="1093.5375000000001">proposal.</tspan><tspan x="28" y="1127.6625000000001">A: So procedural fairness is not the whole</tspan><tspan x="28" y="1161.7875000000001">question?</tspan><tspan x="28" y="1195.9125000000001">B: Correct. We must also ask whose experiences</tspan><tspan x="28" y="1230.0375000000001">the process recognises.</tspan></text><text x="28" y="1280.7375" font-family="Arial, sans-serif" font-size="15.600000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.300000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1310.3775">Rewrite with “bear on”: This evidence is relevant</tspan><tspan x="28" y="1344.5025">to our decision. (Model: This evidence bears on</tspan><tspan x="28" y="1378.6275">our decision.)</tspan></text></svg>