<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear on</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets shape a neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets shape a neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="475.47">bear on</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="563.2605000000001">To be relevant to, or have an effect on, a matter</tspan><tspan x="28" y="596.3355000000001">under consideration.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="674.2035000000001">relate to; have a bearing on</tspan></text><text x="28" y="723.3435000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="752.0715000000001">The history of the site bears directly on the proposed</tspan><tspan x="28" y="785.1465000000002">design.</tspan></text><text x="28" y="834.2865" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="863.0145000000001">Bear on means be relevant to or affect. Do not</tspan><tspan x="28" y="896.0895000000002">confuse it with bear out, which means support a</tspan><tspan x="28" y="929.1645000000001">claim.</tspan></text><text x="28" y="978.3045000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1007.0325000000001">A: Why include the site&#x27;s earlier use in this</tspan><tspan x="28" y="1040.1075">discussion?</tspan><tspan x="28" y="1073.1825000000001">B: It bears directly on who can use the entrance now.</tspan><tspan x="28" y="1106.2575000000002">A: Then it is relevant to the current decision?</tspan><tspan x="28" y="1139.3325000000002">B: Yes, rather than just an interesting historical aside.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1287.848">Does a fact bear on a decision merely because it is</tspan><tspan x="28" y="1320.923">interesting? Explain. (Model: No. It must be relevant</tspan><tspan x="28" y="1353.998">to, or affect, the matter being considered.)</tspan></text></svg>