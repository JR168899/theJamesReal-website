<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Not until… did…</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C2 - 2026/10/11 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team uses a whiteboard to explain a plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team uses a whiteboard to explain a plan.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382f40"><tspan x="28" y="475.47">Not until… did…</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="563.2605000000001">After a fronted Not until phrase or clause, invert the</tspan><tspan x="28" y="596.3355000000001">auxiliary and subject in the main clause.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="674.2035000000001">Not until the assumptions were made explicit did the</tspan><tspan x="28" y="707.2785000000001">disagreement become manageable.</tspan></text><text x="28" y="756.4185" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="785.1465000000001">Not until everyone had spoken did we vote. Keep</tspan><tspan x="28" y="818.2215000000001">normal word order inside the until-clause; inversion</tspan><tspan x="28" y="851.2965">follows it.</tspan></text><text x="28" y="900.4365" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="929.1645000000001">A: When did the discussion improve?</tspan><tspan x="28" y="962.2395000000001">B: Not until we named the underlying assumptions</tspan><tspan x="28" y="995.3145000000001">did we make progress.</tspan><tspan x="28" y="1028.3895">A: Why is did placed before the subject?</tspan><tspan x="28" y="1061.4645">B: The fronted negative expression triggers inversion</tspan><tspan x="28" y="1094.5395">in the main clause.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382f40"><tspan x="28" y="1287.848">Rewrite: We understood the objection only after we</tspan><tspan x="28" y="1320.923">read the full account. (Model: Not until we had read</tspan><tspan x="28" y="1353.998">the full account did we understand the objection.)</tspan></text></svg>