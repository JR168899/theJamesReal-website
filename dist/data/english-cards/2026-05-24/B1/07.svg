<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/05/24 - Life phrases - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="475.47">Let me check that I</tspan><tspan x="28" y="529.8075">understand.</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="617.5980000000001">A way to confirm your understanding before</tspan><tspan x="28" y="650.6730000000001">continuing a conversation.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="728.541">Let me make sure I have this right.; Can I confirm</tspan><tspan x="28" y="761.6160000000001">what you mean?</tspan></text><text x="28" y="810.756" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="839.484">A: Let me check that I understand.</tspan><tspan x="28" y="872.5590000000001">B: Go ahead.</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="950.427">Follow the phrase with your own paraphrase, then</tspan><tspan x="28" y="983.5020000000001">leave room for correction. It is a check, not a</tspan><tspan x="28" y="1016.577">declaration that your account is final.</tspan></text><text x="28" y="1065.7169999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1094.445">A: Let me check that I understand.</tspan><tspan x="28" y="1127.52">B: Go ahead.</tspan><tspan x="28" y="1160.595">A: We book the room now, but confirm the guest list</tspan><tspan x="28" y="1193.6699999999998">on Friday?</tspan><tspan x="28" y="1226.745">B: Exactly. The room booking does not depend on</tspan><tspan x="28" y="1259.82">the final number.</tspan></text><text x="28" y="1308.9599999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2d382e"><tspan x="28" y="1337.6879999999999">Check an arrangement in which the room is booked</tspan><tspan x="28" y="1370.763">today and the guest list is confirmed on Friday.</tspan></text></svg>