<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually care for a plant?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/08/28 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives water and care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives water and care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#353331"><tspan x="28" y="480.3">How do you usually care</tspan><tspan x="28" y="540.6750000000001">for a plant?</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="638.22">An open question that invites a person to</tspan><tspan x="28" y="674.97">describe a familiar experience.</tspan></text><text x="28" y="729.5699999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="761.49">How do you usually care for a plant?</tspan></text><text x="28" y="816.0899999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="848.01">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="884.76">answer, then ask a related follow-up.</tspan></text><text x="28" y="939.3599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="971.28">A: How do you usually care for a plant?</tspan><tspan x="28" y="1008.03">B: I make a small plan.</tspan><tspan x="28" y="1044.78">A: What has helped you most?</tspan><tspan x="28" y="1081.53">B: For example, we check whether the soil</tspan><tspan x="28" y="1118.28">feels dry before adding water.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1292.72">Read, then answer. Write a reply of your own,</tspan><tspan x="28" y="1329.47">then ask one related question. (Model: I make</tspan><tspan x="28" y="1366.22">a small plan. What works best for you?)</tspan></text></svg>