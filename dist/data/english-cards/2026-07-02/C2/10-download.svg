<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Are you going to the neighborhood celebration?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/07/02 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A flag is carried in a public parade.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A flag is carried in a public parade.</tspan></text><a href="https://www.pexels.com/photo/people-horseback-riding-holding-american-flags-during-a-parade-12711524/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12711524</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#353331"><tspan x="28" y="470.41">Are you going to the</tspan><tspan x="28" y="518.4225">neighborhood celebration?</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="595.994">An opening that invites a personal preference or</tspan><tspan x="28" y="625.219">experience without assuming everyone shares it.</tspan></text><text x="28" y="668.639" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="694.023">Are you going to the neighborhood celebration?</tspan></text><text x="28" y="737.443" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="762.827">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="792.052">different preference or a declined invitation without asking</tspan><tspan x="28" y="821.277">the person to justify it.</tspan></text><text x="28" y="864.697" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="890.081">A: Will you watch the parade?</tspan><tspan x="28" y="919.306">B: For a little while. I prefer a quieter place afterward.</tspan><tspan x="28" y="948.5310000000001">A: Do you have a meeting point?</tspan><tspan x="28" y="977.7560000000001">B: Yes, beside the library entrance.</tspan><tspan x="28" y="1006.981">A: I will let you know if I join you.</tspan><tspan x="28" y="1036.2060000000001">B: Please do. It can be hard to find people once it gets</tspan><tspan x="28" y="1065.431">busy.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1282.7440000000001">A friend may join you at a crowded parade. Give a clear</tspan><tspan x="28" y="1311.969">meeting arrangement without promising instant contact by</tspan><tspan x="28" y="1341.1940000000002">phone. (Model: Meet us beside the library entrance at</tspan><tspan x="28" y="1370.419">eleven; if the plan changes, I will tell you before we leave.)</tspan></text></svg>