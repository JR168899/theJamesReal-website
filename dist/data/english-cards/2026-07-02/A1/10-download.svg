<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Are you watching the parade?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/07/02 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.91">Are you watching the</tspan><tspan x="28" y="544.2975">parade?</tspan></text><text x="28" y="612.1100000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="645.0940000000002">An opening that invites a personal</tspan><tspan x="28" y="683.0690000000002">preference or experience without assuming</tspan><tspan x="28" y="721.0440000000002">everyone shares it.</tspan></text><text x="28" y="777.4640000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="810.4480000000002">Are you watching the parade?</tspan></text><text x="28" y="866.8680000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="899.8520000000002">Follow the answer with a related question.</tspan><tspan x="28" y="937.8270000000002">Accept a different preference or a declined</tspan><tspan x="28" y="975.8020000000002">invitation without asking the person to justify</tspan><tspan x="28" y="1013.7770000000003">it.</tspan></text><text x="28" y="1070.1970000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1103.1810000000003">Heart: Are you watching the parade?</tspan><tspan x="28" y="1141.1560000000002">Puck: Yes. Where shall we meet?</tspan><tspan x="28" y="1179.1310000000003">Heart: By the library at eleven.</tspan><tspan x="28" y="1217.1060000000002">Puck: I will see you there.</tspan></text><text x="28" y="1273.526" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1306.5100000000002">Set a meeting place and time for the parade.</tspan><tspan x="28" y="1344.4850000000001">(Model: Let us meet by the library at eleven.)</tspan></text></svg>