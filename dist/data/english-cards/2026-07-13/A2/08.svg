<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Reading maketh a full man; conference a ready man; and writing an exact man.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/07/13 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">Reading maketh a full man;</tspan><tspan x="28" y="522.045">conference a ready man; and</tspan><tspan x="28" y="572.0699999999999">writing an exact man.</tspan></text><text font-family="Arial, sans-serif" font-size="17.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="599.475">Francis Bacon · Of Studies, Essays (1625 edition) · Published 1625</tspan></text><text x="28" y="647.325" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="673.7730000000001">Reading builds knowledge, discussion develops</tspan><tspan x="28" y="704.2230000000002">readiness, and writing encourages precision.</tspan></text><text x="28" y="749.4630000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="775.9110000000002">Read to learn, discuss to respond, and write to be</tspan><tspan x="28" y="806.3610000000002">precise; Different forms of study develop different</tspan><tspan x="28" y="836.8110000000001">abilities</tspan></text><text x="28" y="882.051" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="908.4990000000001">We read the passage, discuss an interpretation, and</tspan><tspan x="28" y="938.9490000000002">write a precise summary.</tspan></text><text x="28" y="984.1890000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1010.6370000000002">Maketh means makes; conference here means</tspan><tspan x="28" y="1041.0870000000002">discussion. The historical use of man is retained in the</tspan><tspan x="28" y="1071.5370000000003">quotation. These claims describe an educational ideal.</tspan></text><text x="28" y="1116.7770000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1143.2250000000001">A: What do you think of this line?</tspan><tspan x="28" y="1173.6750000000002">B: It makes me think about our example.</tspan><tspan x="28" y="1204.1250000000002">A: Which part?</tspan><tspan x="28" y="1234.575">B: We read the passage, discuss an interpretation, and</tspan><tspan x="28" y="1265.025">write a precise summary.</tspan></text><text x="28" y="1310.2650000000003" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1336.7130000000002">Which action in the example connects with the</tspan><tspan x="28" y="1367.1630000000002">quotation?</tspan></text></svg>