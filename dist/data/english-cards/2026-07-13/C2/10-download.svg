<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually read a short book?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/07/13 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#353331"><tspan x="28" y="470.41">How do you usually read a short</tspan><tspan x="28" y="518.4225">book?</tspan></text><text x="28" y="570.61" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="595.994">An open question that invites a person to describe a</tspan><tspan x="28" y="625.219">familiar experience.</tspan></text><text x="28" y="668.639" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="694.023">How do you usually read a short book?</tspan></text><text x="28" y="737.443" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="762.827">Ask this as a genuine question. Listen to the answer, then</tspan><tspan x="28" y="792.052">ask a related follow-up.</tspan></text><text x="28" y="835.472" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="860.856">A: How do you usually read a short book?</tspan><tspan x="28" y="890.081">B: I treat the plan as provisional, rather than assuming that</tspan><tspan x="28" y="919.306">its coherence guarantees a good experience.</tspan><tspan x="28" y="948.531">A: What has helped you most?</tspan><tspan x="28" y="977.756">B: For example, we read five pages after lunch rather than</tspan><tspan x="28" y="1006.981">wait for a free afternoon.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1282.7440000000001">Explain your reasoning to a partner. Write a reply of your</tspan><tspan x="28" y="1311.969">own, then ask one related question. (Model: I treat the plan</tspan><tspan x="28" y="1341.1940000000002">as provisional, rather than assuming that its coherence</tspan><tspan x="28" y="1370.419">guarantees a good experience. What works best for you?)</tspan></text></svg>