<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>alternative</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/08/11 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A route can be planned, checked and changed when necessary.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A route can be planned, checked and changed when necessary.</tspan></text><a href="https://www.pexels.com/photo/unrecognizable-man-examining-map-while-planning-travel-at-home-6108074/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6108074</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">alternative</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ɔlˈtɝnətɪv/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">Singular: alternative; plural: alternatives.</tspan></text><text x="28" y="609.975" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.8950000000001">another possible choice</tspan></text><text x="28" y="696.495" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="728.4150000000001">another option; substitute</tspan></text><text x="28" y="783.015" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="814.9350000000001">The bus is a useful alternative to driving.</tspan></text><text x="28" y="869.535" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="901.455">Topic: Plans for a rainy day. Write one</tspan><tspan x="28" y="938.205">sentence using this word. Check that your</tspan><tspan x="28" y="974.955">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1029.555" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1061.4750000000001">A: What does “alternative” mean?</tspan><tspan x="28" y="1098.2250000000001">B: It means another possible choice.</tspan><tspan x="28" y="1134.9750000000001">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1171.7250000000001">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1292.72">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1329.47">Which word means “another possible choice”:</tspan><tspan x="28" y="1366.22">alternative or adjust? (Model: alternative)</tspan></text></svg>