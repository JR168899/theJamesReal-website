<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>anticipate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/08/11 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Dark clouds gather over a landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Dark clouds gather over a landscape.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">anticipate</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ænˈtɪsəˌpeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">anticipate · anticipates · anticipated · anticipated · anticipating (base</tspan><tspan x="28" y="559.1525">· third person · past · past participle · -ing)</tspan></text><text x="28" y="609.6877" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="637.1997">to expect something and prepare for it</tspan></text><text x="28" y="684.2597" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="711.7717">expect; foresee</tspan></text><text x="28" y="758.8317" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="786.3437">We anticipate a busy morning and prepare the</tspan><tspan x="28" y="818.0187">materials early.</tspan></text><text x="28" y="865.0786999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="892.5907">Use the verb in the sense shown in the exchange.</tspan><tspan x="28" y="924.2656999999999">Notice the subject, tense and any object; the word</tspan><tspan x="28" y="955.9407">forms above show its changes.</tspan></text><text x="28" y="1003.0006999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1030.5127">Aoede: Did you anticipate this many visitors?</tspan><tspan x="28" y="1062.1877">Echo: We expected a crowd, but not a queue this</tspan><tspan x="28" y="1093.8627">long.</tspan><tspan x="28" y="1125.5377">Aoede: Can we open the second entrance?</tspan><tspan x="28" y="1157.2127">Echo: Only after someone checks that it is staffed.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Distinguish anticipating a problem from responding</tspan><tspan x="28" y="1317.667">only after it occurs. (Model: Anticipating involves</tspan><tspan x="28" y="1349.3419999999999">considering it beforehand and preparing for the</tspan><tspan x="28" y="1381.017">possibility.)</tspan></text></svg>