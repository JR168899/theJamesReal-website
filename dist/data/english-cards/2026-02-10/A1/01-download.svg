<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>flower</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/02/10 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A handmade card expresses a personal greeting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A handmade card expresses a personal greeting.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">flower</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˈflaʊɚ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Singular: flower; plural: flowers.</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">the part of a plant that produces seeds and</tspan><tspan x="28" y="663.3765000000001">often has colored petals</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">blossom; bloom</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">A flower sits beside the handwritten card.</tspan></text><text x="28" y="876.9245" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8685">Topic: A thoughtful message for Valentine’s</tspan><tspan x="28" y="941.3435000000001">Day. Write one sentence using this word. Check</tspan><tspan x="28" y="975.8185000000001">that your sentence keeps the meaning shown</tspan><tspan x="28" y="1010.2935">above.</tspan></text><text x="28" y="1061.5135" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1091.4575">A: What does “flower” mean?</tspan><tspan x="28" y="1125.9325">B: It means the part of a plant that produces</tspan><tspan x="28" y="1160.4075">seeds and often has colored petals.</tspan><tspan x="28" y="1194.8825">A: Can we use it when sending a greeting?</tspan><tspan x="28" y="1229.3575">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Try it. Which word means “the part of a plant</tspan><tspan x="28" y="1344.9965">that produces seeds and often has colored</tspan><tspan x="28" y="1379.4715">petals”: flower or card? (Model: flower)</tspan></text></svg>