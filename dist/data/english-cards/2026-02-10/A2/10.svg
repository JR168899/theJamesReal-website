<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Valentine’s Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A2 - 2026/02/10 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A handmade greeting creates a personal message.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A handmade greeting creates a personal message.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#353331"><tspan x="28" y="482.0">What would you like to</tspan><tspan x="28" y="544.5">do for Valentine’s Day?</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="646.54">An open question that invites a person to</tspan><tspan x="28" y="685.04">describe a familiar experience.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="775.68">What would you like to do for Valentine’s</tspan><tspan x="28" y="814.18">Day?</tspan></text><text x="28" y="871.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="904.8199999999999">Ask this as a genuine question. Listen to</tspan><tspan x="28" y="943.3199999999999">the answer, then ask a related follow-up.</tspan></text><text x="28" y="1000.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1033.96">A: What would you like to do for Valentine’s</tspan><tspan x="28" y="1072.46">Day?</tspan><tspan x="28" y="1110.96">B: I would like to send a thoughtful greeting.</tspan><tspan x="28" y="1149.46">A: What should we prepare?</tspan><tspan x="28" y="1187.96">B: For example, we thank a friend for a</tspan><tspan x="28" y="1226.46">particular act of kindness.</tspan></text><text x="28" y="1283.6599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1317.1">Try it. Write a reply of your own, then ask</tspan><tspan x="28" y="1355.6">one related question.</tspan></text></svg>