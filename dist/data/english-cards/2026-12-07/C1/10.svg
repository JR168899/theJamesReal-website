<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes working together easier for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/12/07 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people share the effort of moving furniture.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people share the effort of moving furniture.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-men-carrying-a-couch-7464393/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7464393</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#353331"><tspan x="28" y="478.69">What makes working</tspan><tspan x="28" y="537.0525">together easier for you?</tspan></text><text x="28" y="600.49" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="631.346">An opening that invites a personal preference</tspan><tspan x="28" y="666.871">or experience without assuming everyone</tspan><tspan x="28" y="702.396">shares it.</tspan></text><text x="28" y="755.176" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="786.032">What makes working together easier for you?</tspan></text><text x="28" y="838.812" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="869.668">Follow the answer with a related question.</tspan><tspan x="28" y="905.193">Accept a different preference or a declined</tspan><tspan x="28" y="940.7180000000001">invitation without asking the person to justify it.</tspan></text><text x="28" y="993.498" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="1024.354">A: What helped the group finish on time?</tspan><tspan x="28" y="1059.8790000000001">B: Knowing who was responsible for each task.</tspan><tspan x="28" y="1095.404">A: Did you have to supervise everyone?</tspan><tspan x="28" y="1130.929">B: No. We agreed when to check in and let</tspan><tspan x="28" y="1166.4540000000002">people get on with it.</tspan><tspan x="28" y="1201.979">A: Would you change anything next time?</tspan><tspan x="28" y="1237.5040000000001">B: Leave more time for the final cleanup.</tspan></text><text x="28" y="1290.284" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#353331"><tspan x="28" y="1321.14">Your colleague mentions a smooth handover.</tspan><tspan x="28" y="1356.6650000000002">Ask what specifically made it work.</tspan></text></svg>