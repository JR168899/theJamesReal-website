<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>interdependence</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/12/07 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="42.550000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="474.55">interdependence</tspan></text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="511.0875">US /ˌɪntɚdɪˈpɛndəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.35" font-weight="400" fill="#382d2e"><tspan x="28" y="537.1355">Usually uncountable: interdependence; no regular plural in this</tspan><tspan x="28" y="561.9625">sense.</tspan></text><text x="28" y="613.6144999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.7344999999999">a situation in which people or things rely on each</tspan><tspan x="28" y="674.1094999999999">other</tspan></text><text x="28" y="722.2094999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="750.3294999999999">mutual dependence; mutual reliance</tspan></text><text x="28" y="798.4295" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="826.5495">The garden illustrates the interdependence of plants</tspan><tspan x="28" y="858.9245">and insects.</tspan></text><text x="28" y="907.0245" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="935.1445">Keep the sense and countability shown in the</tspan><tspan x="28" y="967.5195">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="999.8945">the specific person, object or event being discussed.</tspan></text><text x="28" y="1047.9945" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1076.1145000000001">A: Could either team finish the project alone?</tspan><tspan x="28" y="1108.4895000000001">B: No. Their interdependence is built into the work.</tspan><tspan x="28" y="1140.8645000000001">A: Then one delayed handover affects the other</tspan><tspan x="28" y="1173.2395000000001">team?</tspan><tspan x="28" y="1205.6145000000001">B: Exactly. Their responsibilities cannot be</tspan><tspan x="28" y="1237.9895000000001">understood in isolation.</tspan></text><text x="28" y="1286.0895" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1314.2095000000002">Explain interdependence using two teams that need</tspan><tspan x="28" y="1346.5845000000002">each other&#x27;s work. (Model: Each team&#x27;s progress</tspan><tspan x="28" y="1378.9595000000002">depends partly on what the other team provides.)</tspan></text></svg>