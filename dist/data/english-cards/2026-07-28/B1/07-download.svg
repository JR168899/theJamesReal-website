<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/07/28 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A visual explanation can help people check a shared understanding.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A visual explanation can help people check a shared understanding.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2d382e"><tspan x="28" y="472.02">Let me check that I understand.</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="552.8430000000001">A way to confirm your understanding before continuing a</tspan><tspan x="28" y="583.2930000000001">conversation.</tspan></text><text x="28" y="628.533" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="654.9810000000001">Let me make sure I have this right.; Can I confirm what</tspan><tspan x="28" y="685.4310000000002">you mean?</tspan></text><text x="28" y="730.671" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="757.1190000000001">A: How should we buy what we need?</tspan><tspan x="28" y="787.5690000000002">B: Let me check that I understand.</tspan></text><text x="28" y="832.8090000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="859.2570000000002">Use this phrase in a friendly conversation. Listen to the</tspan><tspan x="28" y="889.7070000000002">reply before asking your next question.</tspan></text><text x="28" y="934.9470000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="961.3950000000002">A: How would you express this idea?</tspan><tspan x="28" y="991.8450000000003">B: Let me check that I understand.</tspan><tspan x="28" y="1022.2950000000002">A: What does that mean here?</tspan><tspan x="28" y="1052.7450000000001">B: A way to confirm your understanding before continuing</tspan><tspan x="28" y="1083.1950000000002">a conversation.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2d382e"><tspan x="28" y="1284.368">Apply the idea to a real situation, then answer: When</tspan><tspan x="28" y="1314.818">might you say “Let me check that I understand.”? (Model:</tspan><tspan x="28" y="1345.268">You could say it at a neighbourhood market, when you</tspan><tspan x="28" y="1375.7179999999998">want to ask for help or make your understanding clear.)</tspan></text></svg>