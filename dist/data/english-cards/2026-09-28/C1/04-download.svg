<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/09/28 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="468.8">iron something out</tspan><tspan x="28" y="514.8000000000001">iron out something</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="589.12">resolve small difficulties</tspan></text><text x="28" y="630.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="655.04">resolve; straighten out</tspan></text><text x="28" y="696.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="720.9599999999999">We can iron out the details before we begin.</tspan></text><text x="28" y="762.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="786.8799999999999">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="814.8799999999999">changing its object or word order.</tspan></text><text x="28" y="856.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="880.7999999999998">A: How can we arrange a room?</tspan><tspan x="28" y="908.7999999999998">B: We can iron out the details before we begin.</tspan><tspan x="28" y="936.7999999999998">A: That gives us a starting point.</tspan><tspan x="28" y="964.7999999999998">B: Let us try it together.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1281.1200000000001">Explain your reasoning to a partner. Explain “iron out” in your</tspan><tspan x="28" y="1309.1200000000001">own words, then use it in a sentence about making a room</tspan><tspan x="28" y="1337.1200000000001">your own. (Model: It means to resolve small difficulties.</tspan><tspan x="28" y="1365.1200000000001">Example: We can iron out the details before we begin.)</tspan></text></svg>