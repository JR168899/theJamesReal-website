<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something small</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/12/18 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Hands cultivate a garden with care.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-gardening-7729129/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 7729129</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Growing something small</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="167.0">I like to care for a plant. Two small things help me.</tspan></text><text x="42" y="200.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="235.1">First, we touch the soil before we water the plant. Sometimes it is still wet.</tspan></text><text x="42" y="268.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="303.2">Next, we write down where the plant grows well. We can remember next</tspan><tspan x="42" y="338.29999999999995">time.</tspan></text><text x="42" y="371.4" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#37322b"><tspan x="42" y="406.4">These two things help us. We can care for a plant and enjoy our time</tspan><tspan x="42" y="441.5">together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="492.59999999999997">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="514.56">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="536.52">argument rather than introduce a new proposal.</tspan><tspan x="42" y="558.48">Tell a friend about a time you tried to care for a plant. What did you do? What would you change? Use four short paragraphs:</tspan><tspan x="42" y="580.4399999999999">introduction, two developed points, and conclusion.</tspan></text></svg>