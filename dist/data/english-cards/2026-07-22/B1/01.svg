<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>clarify</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/07/22 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">clarify</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /ˈklærəˌfaɪ/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">clarify · clarifies · clarified · clarified · clarifying (base · third</tspan><tspan x="28" y="574.6075000000001">person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to make a statement or situation easier to</tspan><tspan x="28" y="697.6660999999999">understand</tspan></text><text x="28" y="750.4461" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="781.3021">make clear; explain</tspan></text><text x="28" y="834.0821" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="864.9381">Could you clarify which task comes first?</tspan></text><text x="28" y="917.7180999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="948.5740999999999">Use the verb in the sense shown in the</tspan><tspan x="28" y="984.0990999999999">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1019.6241">object; the word forms above show its changes.</tspan></text><text x="28" y="1072.4041" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1103.2601">A: Could you clarify what you mean by early?</tspan><tspan x="28" y="1138.7851">B: I mean before eight, not before the usual</tspan><tspan x="28" y="1174.3101">opening time.</tspan><tspan x="28" y="1209.8351">A: That is helpful. I had understood it differently.</tspan><tspan x="28" y="1245.3600999999999">B: I will add the exact time to the message.</tspan></text><text x="28" y="1298.1401" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1328.9961">Replace Please arrive early with a clearer</tspan><tspan x="28" y="1364.5211000000002">instruction that removes the ambiguity.</tspan></text></svg>