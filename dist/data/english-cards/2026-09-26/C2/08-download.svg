<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Less is more.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/09/26 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="472.94">Less is more.</tspan></text><text font-family="Arial, sans-serif" font-size="17.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="500.975">Robert Browning · Andrea del Sarto · Published 1855</tspan></text><text x="28" y="549.9250000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="576.981">A simple choice can be more effective than adding</tspan><tspan x="28" y="608.131">many things.</tspan></text><text x="28" y="654.4110000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="681.467">Simplicity can work well; Choose what is essential</tspan></text><text x="28" y="727.7470000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="754.803">We choose two useful decorations and leave the rest</tspan><tspan x="28" y="785.953">of the table clear.</tspan></text><text x="28" y="832.2330000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="859.289">This is a short excerpt from a poem. In the poem, a</tspan><tspan x="28" y="890.439">painter considers artistic ambition; the line is not a</tspan><tspan x="28" y="921.5889999999999">rule that less is always better.</tspan></text><text x="28" y="967.8690000000001" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="994.9250000000001">Sarah: Should we put another display by the</tspan><tspan x="28" y="1026.075">entrance?</tspan><tspan x="28" y="1057.2250000000001">Liam: The existing one is clearer without it. Less is</tspan><tspan x="28" y="1088.375">more.</tspan><tspan x="28" y="1119.525">Sarah: Then we are removing clutter, not useful</tspan><tspan x="28" y="1150.6750000000002">information?</tspan><tspan x="28" y="1181.825">Liam: Exactly. The essential directions must stay</tspan><tspan x="28" y="1212.9750000000001">visible.</tspan></text><text x="28" y="1259.255" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.3110000000001">Would fewer signs always be better? Explain one</tspan><tspan x="28" y="1317.4610000000002">case where this saying would not justify removing a</tspan><tspan x="28" y="1348.611">sign. (Model: No. Removing an essential direction</tspan><tspan x="28" y="1379.7610000000002">could make the space harder to use.)</tspan></text></svg>