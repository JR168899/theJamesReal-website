178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="35.19" font-weight="700" fill="#3d3028"><tspan x="28" y="467.19">factor something in</tspan><tspan x="28" y="511.1775">factor in something</tspan></text><text x="28" y="558.99" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="582.246">include something when making a judgement</tspan></text><text x="28" y="622.0260000000001" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="645.282">allow for; take into account</tspan></text><text x="28" y="685.0620000000001" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="708.3180000000001">We factor in the time other people need.</tspan></text><text x="28" y="748.0980000000002" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="771.3540000000002">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="798.1290000000001">changing its object or word order.</tspan></text><text x="28" y="837.9090000000002" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="861.1650000000002">A: How can we read a short book?</tspan><tspan x="28" y="887.9400000000002">B: We factor in the time other people need.</tspan><tspan x="28" y="914.7150000000001">A: That gives us a starting point.</tspan><tspan x="28" y="941.4900000000002">B: Let us try it together.</tspan></text><text x="28" y="1256.24" font-family="Arial, sans-serif" font-size="12.24" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1279.496">Compare your first answer with this question: Explain “factor in”</tspan><tspan x="28" y="1306.2710000000002">in your own words, then use it in a sentence about a little time</tspan><tspan x="28" y="1333.046">to read. (Model: It means to include something when making a</tspan><tspan x="28" y="1359.8210000000001">judgement. Example: We factor in the time other people need.)</tspan></text></svg>