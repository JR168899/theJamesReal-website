<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sit down</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A1 - 2026/10/30 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person takes a seat.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person takes a seat.</tspan></text><a href="https://www.pexels.com/photo/an-elderly-man-sitting-on-a-lounge-chair-7544847/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7544847</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#3d3028"><tspan x="28" y="472.02">sit down</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="552.8430000000001">take a seat</tspan></text><text x="28" y="598.083" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="624.5310000000001">be seated; take a chair</tspan></text><text x="28" y="669.771" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="696.219">Please sit down here.</tspan></text><text x="28" y="741.459" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="767.907">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="798.3570000000001">changing its object or word order.</tspan></text><text x="28" y="843.597" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="870.0450000000001">A: How can we prepare a Halloween evening?</tspan><tspan x="28" y="900.4950000000001">B: Please sit down here.</tspan><tspan x="28" y="930.945">A: That gives us a starting point.</tspan><tspan x="28" y="961.3950000000001">B: Let us try it together.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1284.368">For Halloween, tell a friend. Explain “sit down” in your</tspan><tspan x="28" y="1314.818">own words, then use it in a sentence about a halloween</tspan><tspan x="28" y="1345.268">evening that welcomes everyone. (Model: It means to</tspan><tspan x="28" y="1375.7179999999998">take a seat. Example: Please sit down here.)</tspan></text></svg>