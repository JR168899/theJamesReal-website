<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A Halloween evening that welcomes everyone</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/10/30 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">A costume creates a playful Halloween character.</tspan></text><a href="https://www.pexels.com/photo/spooky-pumpkin-head-cosplay-in-urban-garden-29225548/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 29225548</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A Halloween evening that welcomes everyone</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="169.0">I like to prepare a Halloween evening. Two small things help me.</tspan></text><text x="42" y="202.44" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="239.44">First, we check our costumes. We can see and walk safely.</tspan></text><text x="42" y="272.88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="309.88">Next, we offer a small toy as well as candy. Our guests can choose.</tspan></text><text x="42" y="343.32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="380.32">These two things help us. We can prepare a Halloween evening and</tspan><tspan x="42" y="417.76">enjoy our time together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="469.2">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="491.15999999999997">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="513.12">about an experience of your own.</tspan><tspan x="42" y="535.0799999999999">Tell a friend. What two reasons support the main idea? Explain one example. (Model: The two reasons are that planning the</tspan><tspan x="42" y="557.04">route and the costumes helps everyone stay comfortable and that clear choices make sharing treats more considerate. One</tspan><tspan x="42" y="579.0">example is that we check that costumes allow clear vision and choose a well-lit route.)</tspan></text></svg>