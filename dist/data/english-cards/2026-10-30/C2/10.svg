<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/10/30 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pumpkins show their rounded forms and thick skins.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pumpkins show their rounded forms and thick skins.</tspan></text><a href="https://www.pexels.com/photo/vibrant-harvest-pumpkins-for-autumn-decor-38757012/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 38757012</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#353331"><tspan x="28" y="474.78">What would you like to do for</tspan><tspan x="28" y="528.255">Halloween?</tspan></text><text x="28" y="586.38" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#353331"><tspan x="28" y="614.6519999999999">An opening that invites a personal preference or</tspan><tspan x="28" y="647.2019999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="695.562" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#353331"><tspan x="28" y="723.834">What would you like to do for Halloween?</tspan></text><text x="28" y="772.1940000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#353331"><tspan x="28" y="800.466">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="833.016">different preference or a declined invitation without</tspan><tspan x="28" y="865.566">asking the person to justify it.</tspan></text><text x="28" y="913.926" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#353331"><tspan x="28" y="942.198">Sarah: What would you like to do for Halloween, if</tspan><tspan x="28" y="974.7479999999999">anything?</tspan><tspan x="28" y="1007.298">Liam: Something low-key. I am not really into</tspan><tspan x="28" y="1039.848">haunted houses.</tspan><tspan x="28" y="1072.398">Sarah: How about carving a pumpkin and making</tspan><tspan x="28" y="1104.948">dinner?</tspan><tspan x="28" y="1137.498">Liam: That sounds more like me. Have you tried an</tspan><tspan x="28" y="1170.048">elaborate design?</tspan><tspan x="28" y="1202.598">Sarah: Once. It collapsed before we finished eating.</tspan><tspan x="28" y="1235.1480000000001">Liam: Then let us choose a face we can actually</tspan><tspan x="28" y="1267.698">finish.</tspan></text><text x="28" y="1316.0580000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1344.3300000000002">Your neighbor says they do not celebrate Halloween.</tspan><tspan x="28" y="1376.88">Acknowledge that and smoothly open another topic.</tspan></text></svg>