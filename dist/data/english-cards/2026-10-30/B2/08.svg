<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/10/30 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cauldron is a large pot, the object named in the witches’ chant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cauldron is a large pot, the object named in the witches’ chant.</tspan></text><a href="https://www.pexels.com/photo/vintage-cauldron-on-rustic-background-showcasing-age-33635613/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 33635613</text></a></svg><text font-family="Arial, sans-serif" font-size="40.480000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="472.48">Double, double toil and trouble;</tspan><tspan x="28" y="523.08">Fire burn, and cauldron bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="17.6" font-weight="400" fill="#2c3540"><tspan x="28" y="550.8000000000001">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published</tspan><tspan x="28" y="572.272">1623</tspan></text><text x="28" y="620.32" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="647.072">The repeated sounds create the atmosphere of a</tspan><tspan x="28" y="677.872">fictional spell.</tspan></text><text x="28" y="723.6320000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="750.384">A rhythmic chant builds a supernatural mood;</tspan><tspan x="28" y="781.184">Repeated words create a dramatic incantation</tspan></text><text x="28" y="826.9440000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="853.696">At the costume gathering, we read the lines as a</tspan><tspan x="28" y="884.496">piece of theater rather than a real instruction.</tspan></text><text x="28" y="930.2560000000001" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="957.008">The witches chant these lines in the play. Toil means</tspan><tspan x="28" y="987.808">hard work; cauldron means a large pot. The date</tspan><tspan x="28" y="1018.6080000000001">refers to publication, not to a recorded spoken event.</tspan></text><text x="28" y="1064.368" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1091.1200000000001">Aoede: Shall I whisper the whole chant?</tspan><tspan x="28" y="1121.92">Echo: Try stressing Double, double first. The</tspan><tspan x="28" y="1152.72">repetition gives it a pulse.</tspan><tspan x="28" y="1183.5200000000002">Aoede: And make burn and bubble sharper?</tspan><tspan x="28" y="1214.3200000000002">Echo: Yes. Let the repeated sounds help create the</tspan><tspan x="28" y="1245.1200000000001">tension.</tspan></text><text x="28" y="1290.8799999999999" font-family="Arial, sans-serif" font-size="14.080000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.640000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1317.632">Identify one repetition and one repeated consonant</tspan><tspan x="28" y="1348.432">sound, then suggest how an actor could use them.</tspan></text></svg>