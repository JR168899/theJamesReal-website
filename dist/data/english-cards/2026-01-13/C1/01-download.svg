<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>contingency</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/01/13 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Dark clouds gather over a landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Dark clouds gather over a landscape.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">contingency</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /kənˈtɪndʒənsi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: contingency; plural: contingencies.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">a possible future event that may require a different</tspan><tspan x="28" y="644.5845">plan</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">possible eventuality; unforeseen circumstance</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">We have a contingency plan in case the train is</tspan><tspan x="28" y="825.4035">canceled.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Keep the sense and countability shown in the</tspan><tspan x="28" y="931.6505">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="963.3255">the specific person, object or event being discussed.</tspan></text><text x="28" y="1010.3855" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8975">Kore: What is our contingency if the ferry is</tspan><tspan x="28" y="1069.5725">cancelled?</tspan><tspan x="28" y="1101.2475">Onyx: We can take the coastal bus.</tspan><tspan x="28" y="1132.9225000000001">Kore: Have you checked the timetable?</tspan><tspan x="28" y="1164.5975">Onyx: Yes. The last one leaves at six.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">A ferry may be cancelled. Name the information a</tspan><tspan x="28" y="1317.667">useful contingency plan should include. (Model: An</tspan><tspan x="28" y="1349.3419999999999">alternative route, its departure times and any booking</tspan><tspan x="28" y="1381.017">or access requirements.)</tspan></text></svg>