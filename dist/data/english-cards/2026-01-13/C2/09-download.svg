<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Concessive fronting</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C2 - 2026/01/13 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A useful plan can still leave circumstances unanticipated.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A useful plan can still leave circumstances unanticipated.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382f40"><tspan x="28" y="473.63">Concessive fronting</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="557.7045">An adjective can precede as + subject + verb to</tspan><tspan x="28" y="589.3795">concede a point in formal writing.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="663.9515">Useful as the plan was, it could not anticipate every</tspan><tspan x="28" y="695.6265">circumstance.</tspan></text><text x="28" y="742.6864999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="770.1985">Read the example together with the rule. Notice the</tspan><tspan x="28" y="801.8734999999999">verb form and keep the same pattern in your own</tspan><tspan x="28" y="833.5485">sentence.</tspan></text><text x="28" y="880.6084999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="908.1205">A: Could you give me an example?</tspan><tspan x="28" y="939.7955">B: Useful as the plan was, it could not anticipate</tspan><tspan x="28" y="971.4705">every circumstance.</tspan><tspan x="28" y="1003.1455">A: Which pattern does that use?</tspan><tspan x="28" y="1034.8205">B: An adjective can precede as + subject + verb to</tspan><tspan x="28" y="1066.4955">concede a point in formal writing.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="1285.992">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1317.667">Rewrite with concessive fronting: Although the plan</tspan><tspan x="28" y="1349.3419999999999">was useful, it had limits. (Model: Useful as the plan</tspan><tspan x="28" y="1381.017">was, it had limits.)</tspan></text></svg>