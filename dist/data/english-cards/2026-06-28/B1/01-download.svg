<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>connection</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/06/28 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Passengers wait beside a train at a station.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Passengers wait beside a train at a station.</tspan></text><a href="https://www.pexels.com/photo/people-standing-on-a-platform-on-a-train-station-5617385/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5617385</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">connection</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /kəˈnɛkʃən/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Singular: connection; plural: connections.</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">a second vehicle you take as part of a journey</tspan></text><text x="28" y="651.153" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="677.6010000000001">connecting service; onward link</tspan></text><text x="28" y="722.841" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="749.2890000000001">We have ten minutes to make our connection.</tspan></text><text x="28" y="794.529" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="820.9770000000001">Keep the sense and countability shown in the example.</tspan><tspan x="28" y="851.4270000000001">Use a singular or plural form appropriate to the specific</tspan><tspan x="28" y="881.8770000000001">person, object or event being discussed.</tspan></text><text x="28" y="927.1170000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="953.5650000000002">Sky: Our first train is running late.</tspan><tspan x="28" y="984.0150000000002">Michael: Will we miss the connection?</tspan><tspan x="28" y="1014.4650000000001">Sky: There are twenty minutes between trains, so we</tspan><tspan x="28" y="1044.9150000000002">may still make it.</tspan><tspan x="28" y="1075.3650000000002">Michael: Let us check the next departure as well.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.368">A connection leaves five minutes after your delayed train</tspan><tspan x="28" y="1314.818">arrives on a distant platform. What should you check?</tspan><tspan x="28" y="1345.268">(Model: Check the transfer time and the next available</tspan><tspan x="28" y="1375.7179999999998">service rather than assuming the connection is possible.)</tspan></text></svg>