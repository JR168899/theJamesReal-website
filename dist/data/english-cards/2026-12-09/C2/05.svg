2584999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="844.7705">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="876.4454999999999">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="923.5054999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="951.0174999999999">A: How would you express this idea?</tspan><tspan x="28" y="982.6924999999999">B: cut the Gordian knot</tspan><tspan x="28" y="1014.3675">A: What does that mean here?</tspan><tspan x="28" y="1046.0425">B: solve a complex problem with a decisive and direct</tspan><tspan x="28" y="1077.7175">action</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Explain the meaning before looking at the model</tspan><tspan x="28" y="1317.667">answer. What does “cut the Gordian knot” mean in</tspan><tspan x="28" y="1349.3419999999999">this example? A simpler agreement cut the Gordian</tspan><tspan x="28" y="1381.017">knot.</tspan></text></svg>