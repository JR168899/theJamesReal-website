<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>character</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/12/09 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets shape a neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets shape a neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">character</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˈkærɪktɚ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Usually uncountable: character; no regular plural in this sense.</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">the features that make a place distinctive</tspan></text><text x="28" y="680.1215" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="710.0655">distinctive quality; identity</tspan></text><text x="28" y="761.2855" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="791.2295">Small shops give the street its character.</tspan></text><text x="28" y="842.4495" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="872.3935">Keep the sense and countability shown in the</tspan><tspan x="28" y="906.8685">example. Use a singular or plural form</tspan><tspan x="28" y="941.3435000000001">appropriate to the specific person, object or</tspan><tspan x="28" y="975.8185000000001">event being discussed.</tspan></text><text x="28" y="1027.0384999999999" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1056.9824999999998">Aoede: The new paving looks very neat.</tspan><tspan x="28" y="1091.4574999999998">Echo: Do you think it changes the street&#x27;s</tspan><tspan x="28" y="1125.9325">character?</tspan><tspan x="28" y="1160.4074999999998">Aoede: A little. The old market stalls gave it a</tspan><tspan x="28" y="1194.8825">different atmosphere.</tspan><tspan x="28" y="1229.3574999999998">Echo: Then we should record more than the</tspan><tspan x="28" y="1263.8325">surface materials.</tspan></text><text x="28" y="1315.0525" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1344.9965">Describe a street&#x27;s character using one social</tspan><tspan x="28" y="1379.4714999999999">detail and one visual detail.</tspan></text></svg>