<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although and despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - B2 - 2026/08/23 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People continue a city journey in rainy weather.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People continue a city journey in rainy weather.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#382f40"><tspan x="28" y="480.99">Although and despite</tspan></text><text x="28" y="547.5525" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="579.9285000000001">Use although before a clause. Use despite</tspan><tspan x="28" y="617.2035000000001">before a noun or an -ing form.</tspan></text><text x="28" y="672.5835000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="704.9595000000002">Although it was difficult, we continued.</tspan><tspan x="28" y="742.2345000000001">Despite the difficulty, we continued.</tspan></text><text x="28" y="797.6145000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="829.9905000000002">Although introduces a clause with a subject</tspan><tspan x="28" y="867.2655000000002">and verb; despite takes a noun phrase or an</tspan><tspan x="28" y="904.5405000000003">-ing form. Avoid despite of.</tspan></text><text x="28" y="959.9205000000002" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="992.2965000000003">Aoede: Was the train delay enough to cancel</tspan><tspan x="28" y="1029.5715000000002">the visit?</tspan><tspan x="28" y="1066.8465000000003">Echo: Although we arrived late, we still saw</tspan><tspan x="28" y="1104.1215000000002">the exhibition.</tspan><tspan x="28" y="1141.3965000000003">Aoede: Did you have to hurry?</tspan><tspan x="28" y="1178.6715000000004">Echo: Yes, but despite the delay, the visit</tspan><tspan x="28" y="1215.9465000000002">was worthwhile.</tspan></text><text x="28" y="1271.3265000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1303.7025">Rewrite Although the train was late, we</tspan><tspan x="28" y="1340.9775000000002">enjoyed the visit using despite. (Model:</tspan><tspan x="28" y="1378.2525">Despite the late train, we enjoyed the visit.)</tspan></text></svg>