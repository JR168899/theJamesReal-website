<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>uncanny</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/26 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Mist gives a familiar forest an unfamiliar, unsettling atmosphere.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Mist gives a familiar forest an unfamiliar, unsettling atmosphere.</tspan></text><a href="https://www.pexels.com/photo/tall-trees-in-the-forest-covered-in-fog-5288094/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5288094</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">uncanny</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ʌnˈkæni/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">uncanny · more uncanny · most uncanny; noun: uncanniness</tspan></text><text x="28" y="598.11" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="627.9020000000002">strange in a way that feels mysterious or</tspan><tspan x="28" y="662.2020000000001">unsettling</tspan></text><text x="28" y="713.162" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="742.9540000000002">eerie; strangely unsettling</tspan></text><text x="28" y="793.9140000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="823.7060000000002">The empty costume looked uncanny in the dim</tspan><tspan x="28" y="858.0060000000002">light.</tspan></text><text x="28" y="908.9660000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="938.7580000000003">An uncanny resemblance is strikingly exact and</tspan><tspan x="28" y="973.0580000000002">need not be frightening. An uncanny atmosphere</tspan><tspan x="28" y="1007.3580000000003">emphasizes a strange, unsettling quality.</tspan></text><text x="28" y="1058.3180000000002" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1088.1100000000001">A: This is the path we walked yesterday, isn&#x27;t it?</tspan><tspan x="28" y="1122.41">B: Yes, but the fog makes it feel uncanny.</tspan><tspan x="28" y="1156.71">A: And there is not a sound. Shall we head back?</tspan><tspan x="28" y="1191.0100000000002">B: Let us take the road while it is still light.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Which is more naturally uncanny: an unexplained</tspan><tspan x="28" y="1323.772">exact resemblance, or a bus arriving on</tspan><tspan x="28" y="1358.072">schedule? Explain.</tspan></text></svg>