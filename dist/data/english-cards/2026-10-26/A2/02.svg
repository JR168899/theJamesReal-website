y="688.9380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="719.9460000000001">winter squash; orange squash</tspan></text><text x="28" y="772.9860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="803.9940000000001">We put a pumpkin beside the front door.</tspan></text><text x="28" y="857.0340000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="888.0420000000001">Topic: A Halloween evening that welcomes</tspan><tspan x="28" y="923.7420000000002">everyone. Write one sentence using this word.</tspan><tspan x="28" y="959.4420000000001">Check that your sentence keeps the meaning</tspan><tspan x="28" y="995.1420000000002">shown above.</tspan></text><text x="28" y="1048.182" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1079.19">A: What does “pumpkin” mean?</tspan><tspan x="28" y="1114.89">B: It means a large round orange fruit with a</tspan><tspan x="28" y="1150.5900000000001">thick skin.</tspan><tspan x="28" y="1186.29">A: Can we use it during a Halloween</tspan><tspan x="28" y="1221.99">gathering?</tspan><tspan x="28" y="1257.69">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1310.73" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1341.738">Which word means “a large round orange fruit</tspan><tspan x="28" y="1377.438">with a thick skin”: pumpkin or costume?</tspan></text></svg>