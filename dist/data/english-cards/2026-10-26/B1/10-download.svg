<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Halloween?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/10/26 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pumpkins show their rounded forms and thick skins.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pumpkins show their rounded forms and thick skins.</tspan></text><a href="https://www.pexels.com/photo/vibrant-harvest-pumpkins-for-autumn-decor-38757012/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 38757012</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#353331"><tspan x="28" y="472.02">What would you like to do for</tspan><tspan x="28" y="522.045">Halloween?</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="602.868">An opening that invites a personal preference or</tspan><tspan x="28" y="633.3180000000001">experience without assuming everyone shares it.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="705.0060000000001">What would you like to do for Halloween?</tspan></text><text x="28" y="750.246" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="776.6940000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="807.1440000000001">different preference or a declined invitation without</tspan><tspan x="28" y="837.594">asking the person to justify it.</tspan></text><text x="28" y="882.834" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="909.282">Sky: What would you like to do for Halloween, if</tspan><tspan x="28" y="939.7320000000001">anything?</tspan><tspan x="28" y="970.182">Michael: Something low-key. I am not really into haunted</tspan><tspan x="28" y="1000.6320000000001">houses.</tspan><tspan x="28" y="1031.082">Sky: How about carving a pumpkin and making dinner?</tspan><tspan x="28" y="1061.5320000000002">Michael: That sounds more like me. Have you tried an</tspan><tspan x="28" y="1091.982">elaborate design?</tspan><tspan x="28" y="1122.432">Sky: Once. It collapsed before we finished eating.</tspan><tspan x="28" y="1152.882">Michael: Then let us choose a face we can actually</tspan><tspan x="28" y="1183.332">finish.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1284.368">Your neighbor says they do not celebrate Halloween.</tspan><tspan x="28" y="1314.818">Acknowledge that and smoothly open another topic.</tspan><tspan x="28" y="1345.268">(Model: Of course. Are you doing anything nice this</tspan><tspan x="28" y="1375.7179999999998">weekend instead?)</tspan></text></svg>