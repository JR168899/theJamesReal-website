#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="776.9599999999999">A: How should we arrange a room?</tspan><tspan x="28" y="804.9599999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="832.9599999999999">consequences.</tspan></text><text x="28" y="874.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="898.8799999999999">Use this phrase in a friendly conversation. Listen to the reply</tspan><tspan x="28" y="926.8799999999999">before asking your next question.</tspan></text><text x="28" y="968.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="992.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="1020.7999999999998">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1048.7999999999997">consequences.</tspan><tspan x="28" y="1076.7999999999997">A: What does that mean here?</tspan><tspan x="28" y="1104.7999999999997">B: A useful way to keep an everyday conversation clear and</tspan><tspan x="28" y="1132.7999999999997">considerate.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">Review without reading the example first. When might you say</tspan><tspan x="28" y="1309.1200000000001">“I would distinguish between the intention and its</tspan><tspan x="28" y="1337.1200000000001">consequences.”? (Model: You could say it at home, when you</tspan><tspan x="28" y="1365.1200000000001">want to ask for help or make your understanding clear.)</tspan></text></svg>