<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>folklore</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/26 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">folklore</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ˈfoʊkˌlɔr/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">Usually uncountable: folklore; no regular plural in this sense.</tspan></text><text x="28" y="598.11" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="627.9020000000002">the traditional stories and beliefs of a community</tspan></text><text x="28" y="678.862" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="708.6540000000001">traditional stories; folk tradition</tspan></text><text x="28" y="759.6139999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="789.4060000000001">The class compares Halloween stories with local</tspan><tspan x="28" y="823.706">folklore.</tspan></text><text x="28" y="874.6659999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="904.4580000000001">Keep the sense and countability shown in the</tspan><tspan x="28" y="938.758">example. Use a singular or plural form</tspan><tspan x="28" y="973.0580000000001">appropriate to the specific person, object or event</tspan><tspan x="28" y="1007.3580000000001">being discussed.</tspan></text><text x="28" y="1058.318" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1088.11">Aoede: Is that story part of the town&#x27;s official</tspan><tspan x="28" y="1122.4099999999999">history?</tspan><tspan x="28" y="1156.7099999999998">Echo: It belongs to local folklore.</tspan><tspan x="28" y="1191.01">Aoede: So there may be several versions?</tspan><tspan x="28" y="1225.31">Echo: Yes. It has been passed on through stories</tspan><tspan x="28" y="1259.61">rather than one fixed account.</tspan></text><text x="28" y="1310.57" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.3619999999999">Why might a local folklore story exist in different</tspan><tspan x="28" y="1374.6619999999998">versions?</tspan></text></svg>