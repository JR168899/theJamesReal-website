<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Plans for a rainy day</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-11-25</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Plans for a rainy day</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Plans for a rainy day</title><desc>Original hand-drawn story illustration: umbrella, set within weather. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-3) scale(1.5)"><path d="M-72-4Q0-108 72-4Q48-26 24-4Q0-26-24-4Q-48-26-72-4Z" fill="#c7a1a3"/><path d="M0-62V49Q0 78-23 63M-72-4Q-32-72 0-62Q32-72 72-4M-52 19L-59 33M45 22L39 37"/></g><g transform="translate(95 264) rotate(3) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Plans for a rainy day</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="17" font-weight="normal"><tspan x="36" dy="0">A good way to change our plans</tspan><tspan x="36" dy="23.459999999999997">combines practical structure with</tspan><tspan x="36" dy="23.459999999999997">an awareness of other people.</tspan><tspan x="36" dy="23.459999999999997">Neither a rigid plan nor complete</tspan><tspan x="36" dy="23.459999999999997">improvisation is sufficient on</tspan><tspan x="36" dy="23.459999999999997">its own; both need to be judged</tspan><tspan x="36" dy="23.459999999999997">in context.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="384" dy="0">The practical case is</tspan><tspan x="384" dy="22.08">straightforward: a backup plan</tspan><tspan x="384" dy="22.08">makes a change less disappointing.</tspan><tspan x="384" dy="22.08">Consider how we choose a museum</tspan><tspan x="384" dy="22.08">when rain makes the outdoor walk</tspan><tspan x="384" dy="22.08">uncomfortable. The benefit is not</tspan><tspan x="384" dy="22.08">merely efficiency. A modest</tspan><tspan x="384" dy="22.08">arrangement prevents avoidable</tspan><tspan x="384" dy="22.08">confusion, leaving attention</tspan><tspan x="384" dy="22.08">available for the activity itself</tspan><tspan x="384" dy="22.08">rather than for problems that could</tspan><tspan x="384" dy="22.08">have been anticipated.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="732" dy="0">Consideration adds a second,</tspan><tspan x="732" dy="22.08">equally important dimension:</tspan><tspan x="732" dy="22.08">telling other people early helps</tspan><tspan x="732" dy="22.08">everyone adjust. In this situation,</tspan><tspan x="732" dy="22.08">we send a clear message about the</tspan><tspan x="732" dy="22.08">new meeting place before anyone</tspan><tspan x="732" dy="22.08">leaves home. A decision can be</tspan><tspan x="732" dy="22.08">convenient for one person while</tspan><tspan x="732" dy="22.08">creating difficulty for another, so</tspan><tspan x="732" dy="22.08">its value depends partly on whose</tspan><tspan x="732" dy="22.08">needs it recognises.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">The most useful approach therefore</tspan><tspan x="1080" dy="22.08">brings structure and consideration</tspan><tspan x="1080" dy="22.08">together. Preparation establishes a</tspan><tspan x="1080" dy="22.08">workable starting point; attention</tspan><tspan x="1080" dy="22.08">to other people keeps it</tspan><tspan x="1080" dy="22.08">responsive. Success should be</tspan><tspan x="1080" dy="22.08">assessed by how well the</tspan><tspan x="1080" dy="22.08">arrangement serves the experience,</tspan><tspan x="1080" dy="22.08">rather than by how closely events</tspan><tspan x="1080" dy="22.08">follow the original plan.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Explain the meaning before looking at the model answer. What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>