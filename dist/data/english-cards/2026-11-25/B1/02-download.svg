<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>invite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/11/25 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>We invite a neighbor to join our meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">We invite a neighbor to join our meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">invite</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ɪnˈvaɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">invite · invites · invited · invited · inviting (base · third person · past ·</tspan><tspan x="28" y="559.1525">past participle · -ing)</tspan></text><text x="28" y="609.6877" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="637.1997">to ask someone to come to an event or take part in an</tspan><tspan x="28" y="668.8747">activity</tspan></text><text x="28" y="715.9346999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="743.4467">ask to attend; welcome</tspan></text><text x="28" y="790.5066999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="818.0187">We invite a neighbor to join our meal.</tspan></text><text x="28" y="865.0786999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="892.5907">Topic: A Thanksgiving table with space to listen.</tspan><tspan x="28" y="924.2656999999999">Write one sentence using this word. Check that your</tspan><tspan x="28" y="955.9407">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1003.0006999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1030.5127">A: What does “invite” mean?</tspan><tspan x="28" y="1062.1877">B: It means to ask someone to come to an event or</tspan><tspan x="28" y="1093.8627">take part in an activity.</tspan><tspan x="28" y="1125.5377">A: Can we use it at a Thanksgiving gathering?</tspan><tspan x="28" y="1157.2127">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Apply the idea to a real situation, then answer: Which</tspan><tspan x="28" y="1317.667">word means “to ask someone to come to an event or</tspan><tspan x="28" y="1349.3419999999999">take part in an activity”: invite or volunteer? (Model:</tspan><tspan x="28" y="1381.017">invite)</tspan></text></svg>