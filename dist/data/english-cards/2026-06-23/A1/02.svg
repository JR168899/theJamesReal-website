<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cup</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/06/23 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cup of tea offers a simple refreshment.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cup of tea offers a simple refreshment.</tspan></text><a href="https://www.pexels.com/photo/cup-of-tea-on-a-table-16921454/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16921454</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382d2e"><tspan x="28" y="482.0">cup</tspan></text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="525.3">US /kʌp/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="24.200000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="556.2760000000001">Singular: cup; plural: cups.</tspan></text><text x="28" y="617.7" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="651.14">a small container used for a drink</tspan></text><text x="28" y="708.34" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="741.78">drinking vessel; small mug</tspan></text><text x="28" y="798.98" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="832.42">Would you like a cup of tea?</tspan></text><text x="28" y="889.62" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="923.06">Keep the sense and countability shown in</tspan><tspan x="28" y="961.56">the example. Use a singular or plural form</tspan><tspan x="28" y="1000.06">appropriate to the specific person, object or</tspan><tspan x="28" y="1038.56">event being discussed.</tspan></text><text x="28" y="1095.76" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1129.2">Heart: Is this your cup?</tspan><tspan x="28" y="1167.7">Puck: Yes. My tea is in it.</tspan><tspan x="28" y="1206.2">Heart: Can I use the blue one?</tspan><tspan x="28" y="1244.7">Puck: Of course. It is clean.</tspan></text><text x="28" y="1301.9" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1335.3400000000001">Offer your visitor a cup of tea in one short</tspan><tspan x="28" y="1373.8400000000001">question.</tspan></text></svg>