<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/03/05 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A budget helps someone allow for costs and limits.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A budget helps someone allow for costs and limits.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="48.99000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="480.99">factor something in</tspan><tspan x="28" y="542.2275">factor in something</tspan></text><text x="28" y="608.79" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="641.166">include something when making a</tspan><tspan x="28" y="678.441">judgement</tspan></text><text x="28" y="733.821" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="766.1970000000001">allow for; take into account</tspan></text><text x="28" y="821.577" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="853.9530000000001">We factor in the time other people need.</tspan></text><text x="28" y="909.333" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="941.7090000000001">Keep the particle with the verb. Check a</tspan><tspan x="28" y="978.984">dictionary before changing its object or word</tspan><tspan x="28" y="1016.259">order.</tspan></text><text x="28" y="1071.6390000000001" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1104.015">A: How can we explore a neighbourhood?</tspan><tspan x="28" y="1141.2900000000002">B: We factor in the time other people need.</tspan><tspan x="28" y="1178.565">A: That gives us a starting point.</tspan><tspan x="28" y="1215.8400000000001">B: Let us try it together.</tspan></text><text x="28" y="1271.2200000000003" font-family="Arial, sans-serif" font-size="17.040000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.820000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1303.5960000000002">Explain “factor in” in your own words, then</tspan><tspan x="28" y="1340.8710000000003">use it in a sentence about getting to know a</tspan><tspan x="28" y="1378.1460000000002">city.</tspan></text></svg>