<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut the Gordian knot</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/03/05 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#383426"><tspan x="28" y="481.91">cut the Gordian knot</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="582.7065000000001">solve a complex problem with a decisive and</tspan><tspan x="28" y="620.6815000000001">direct action</tspan></text><text x="28" y="677.1015000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="710.0855000000001">take a decisive shortcut; break the deadlock</tspan></text><text x="28" y="766.5055000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="799.4895000000001">A simpler agreement cut the Gordian knot.</tspan></text><text x="28" y="855.9095000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="888.8935000000001">Learn the whole expression. It is figurative</tspan><tspan x="28" y="926.8685000000002">language, so a word-for-word interpretation</tspan><tspan x="28" y="964.8435000000002">may be misleading.</tspan></text><text x="28" y="1021.2635000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1054.2475000000002">A: How would you express this idea?</tspan><tspan x="28" y="1092.2225">B: cut the Gordian knot</tspan><tspan x="28" y="1130.1975000000002">A: What does that mean here?</tspan><tspan x="28" y="1168.1725000000001">B: solve a complex problem with a decisive</tspan><tspan x="28" y="1206.1475000000003">and direct action</tspan></text><text x="28" y="1262.5675" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1295.5515000000003">What does “cut the Gordian knot” mean in</tspan><tspan x="28" y="1333.5265000000002">this example? A simpler agreement cut the</tspan><tspan x="28" y="1371.5015000000003">Gordian knot.</tspan></text></svg>