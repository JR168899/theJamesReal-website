<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>functional</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/01/15 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple workspace leaves room for a single task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple workspace leaves room for a single task.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">functional</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /ˈfʌŋkʃənəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">Adjective: functional; related noun: function</tspan></text><text x="28" y="604.8900000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="635.8980000000001">designed to be useful and to work well</tspan></text><text x="28" y="688.9380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="719.9460000000001">practical; useful</tspan></text><text x="28" y="772.9860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="803.9940000000001">The room is small but functional.</tspan></text><text x="28" y="857.0340000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="888.0420000000001">The adjective describes a person, thing or</tspan><tspan x="28" y="923.7420000000002">situation. Choose a concrete noun or context</tspan><tspan x="28" y="959.4420000000001">that supports the description rather than using</tspan><tspan x="28" y="995.1420000000002">it as a general compliment.</tspan></text><text x="28" y="1048.182" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1079.19">A: The entrance is attractive, but is it</tspan><tspan x="28" y="1114.89">functional?</tspan><tspan x="28" y="1150.5900000000001">B: Not while that table blocks the doorway.</tspan><tspan x="28" y="1186.29">A: We could move it against the wall.</tspan><tspan x="28" y="1221.99">B: Then people could enter without squeezing</tspan><tspan x="28" y="1257.69">past it.</tspan></text><text x="28" y="1310.73" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1341.738">Improve the function of an entrance where a</tspan><tspan x="28" y="1377.438">table blocks the doorway.</tspan></text></svg>