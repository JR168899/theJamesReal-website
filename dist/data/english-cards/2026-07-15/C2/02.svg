<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hermeneutic</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/07/15 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Looking closely at words helps a reader distinguish meanings.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Looking closely at words helps a reader distinguish meanings.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">hermeneutic</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ˌhɝməˈnutɪk/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">Adjective: hermeneutic; related noun: hermeneutics</tspan></text><text x="28" y="598.11" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="627.9020000000002">concerned with the interpretation of texts and</tspan><tspan x="28" y="662.2020000000001">meanings</tspan></text><text x="28" y="713.162" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="742.9540000000002">interpretive; concerned with interpretation</tspan></text><text x="28" y="793.9140000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="823.7060000000002">A hermeneutic approach asks how the reader</tspan><tspan x="28" y="858.0060000000002">understands the text.</tspan></text><text x="28" y="908.9660000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="938.7580000000003">Topic: A little time to read. Write one sentence</tspan><tspan x="28" y="973.0580000000002">using this word. Check that your sentence keeps</tspan><tspan x="28" y="1007.3580000000003">the meaning shown above.</tspan></text><text x="28" y="1058.3180000000002" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1088.1100000000001">A: What does “hermeneutic” mean?</tspan><tspan x="28" y="1122.41">B: It means concerned with the interpretation of</tspan><tspan x="28" y="1156.71">texts and meanings.</tspan><tspan x="28" y="1191.0100000000002">A: Can we use it in a quiet reading corner?</tspan><tspan x="28" y="1225.3100000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1276.2700000000002" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.0620000000001">Review without reading the example first. Which</tspan><tspan x="28" y="1340.362">word means “concerned with the interpretation of</tspan><tspan x="28" y="1374.662">texts and meanings”: hermeneutic or polysemy?</tspan></text></svg>