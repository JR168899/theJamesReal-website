<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>symbiosis</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/06/08 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A bee visits a flowering plant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A bee visits a flowering plant.</tspan></text><a href="https://www.pexels.com/photo/macro-view-of-bee-on-flower-collecting-pollen-34256469/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34256469</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">symbiosis</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /ˌsɪmbaɪˈoʊsɪs/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Singular: symbiosis; plural: symbioses.</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">a close relationship in which different organisms or</tspan><tspan x="28" y="636.3630000000002">groups interact</tspan></text><text x="28" y="681.6030000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="708.0510000000002">close biological association; interdependent relationship</tspan></text><text x="28" y="753.291" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="779.7390000000001">The garden offers examples of symbiosis between</tspan><tspan x="28" y="810.1890000000002">different organisms.</tspan></text><text x="28" y="855.4290000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="881.8770000000002">In broad biological usage this is a close association</tspan><tspan x="28" y="912.3270000000002">between species. Mutualism specifies a relationship</tspan><tspan x="28" y="942.7770000000002">benefiting both.</tspan></text><text x="28" y="988.0170000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1014.4650000000003">Sarah: Does symbiosis always mean both organisms</tspan><tspan x="28" y="1044.9150000000002">benefit?</tspan><tspan x="28" y="1075.3650000000002">Liam: In broad biological usage, no. It refers to a close</tspan><tspan x="28" y="1105.8150000000003">association between species.</tspan><tspan x="28" y="1136.2650000000003">Sarah: Then we need to identify the particular</tspan><tspan x="28" y="1166.7150000000001">relationship?</tspan><tspan x="28" y="1197.1650000000002">Liam: Yes. Mutualism is the term when both benefit.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.368">Which is more precise for a relationship benefiting both</tspan><tspan x="28" y="1314.818">species: symbiosis alone or mutualism? Explain. (Model:</tspan><tspan x="28" y="1345.268">Mutualism specifies that both benefit; symbiosis is</tspan><tspan x="28" y="1375.7179999999998">broader.)</tspan></text></svg>