<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>stewardship</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/06/08 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">stewardship</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /ˈstuɚdˌʃɪp/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Usually uncountable: stewardship; no regular plural in this</tspan><tspan x="28" y="564.7724999999999">sense.</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">responsible care for something entrusted to you</tspan></text><text x="28" y="695.4093000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="724.1373000000002">responsible care; careful management</tspan></text><text x="28" y="773.2773000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="802.0053000000001">Good stewardship protects the garden for future</tspan><tspan x="28" y="835.0803000000002">visitors.</tspan></text><text x="28" y="884.2203000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="912.9483000000001">Keep the sense and countability shown in the</tspan><tspan x="28" y="946.0233000000002">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="979.0983000000001">the specific person, object or event being discussed.</tspan></text><text x="28" y="1028.2383" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1056.9663">Kore: Who owns the community garden?</tspan><tspan x="28" y="1090.0413">Onyx: That question is different from who exercises</tspan><tspan x="28" y="1123.1163000000001">stewardship.</tspan><tspan x="28" y="1156.1913">Kore: What responsibilities does stewardship imply?</tspan><tspan x="28" y="1189.2663">Onyx: Caring for the space and considering those</tspan><tspan x="28" y="1222.3413">who will use it after us.</tspan></text><text x="28" y="1271.4813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1300.2093">Explain stewardship as more than possessing a</tspan><tspan x="28" y="1333.2843">resource.</tspan></text></svg>