<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>We need the tonic of wildness</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/06/08 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A potted plant receives water and care.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A potted plant receives water and care.</tspan></text><a href="https://www.pexels.com/photo/a-person-watering-a-plant-7659467/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7659467</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="474.32">We need the tonic of wildness</tspan></text><text font-family="Arial, sans-serif" font-size="18.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="503.29999999999995">Henry David Thoreau · Walden, Spring · Published 1854</tspan></text><text x="28" y="553.9" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="581.8679999999999">Time in untamed nature can refresh people who</tspan><tspan x="28" y="614.068">spend much of life within familiar routines.</tspan></text><text x="28" y="661.908" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="689.876">Nature can restore our energy; Wild places can offer</tspan><tspan x="28" y="722.076">renewal</tspan></text><text x="28" y="769.916" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="797.884">After a day indoors, we spend a quiet hour beside the</tspan><tspan x="28" y="830.0840000000001">trees.</tspan></text><text x="28" y="877.9240000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="905.892">This is an excerpt. Tonic means something that</tspan><tspan x="28" y="938.0920000000001">refreshes or restores, not a literal drink. The passage</tspan><tspan x="28" y="970.292">contrasts familiar village life with the surrounding wild</tspan><tspan x="28" y="1002.4920000000001">landscape.</tspan></text><text x="28" y="1050.332" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="1078.3000000000002">A: What do you think of this line?</tspan><tspan x="28" y="1110.5000000000002">B: It makes me think about our example.</tspan><tspan x="28" y="1142.7000000000003">A: Which part?</tspan><tspan x="28" y="1174.9">B: After a day indoors, we spend a quiet hour beside</tspan><tspan x="28" y="1207.1000000000001">the trees.</tspan></text><text x="28" y="1258.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.688">Which action in the example connects with the</tspan><tspan x="28" y="1318.8880000000001">quotation? (Model: The example uses time outdoors</tspan><tspan x="28" y="1351.0880000000002">as a restorative change from an indoor routine.)</tspan></text></svg>