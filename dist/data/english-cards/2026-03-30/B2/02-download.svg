<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>observance</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/03/30 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Eggs are arranged in a woven basket.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Eggs are arranged in a woven basket.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-eggs-in-a-basket-15428991/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 15428991</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">observance</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /əbˈzɝvəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Singular: observance; plural: observances.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">the practice of following a custom or marking a</tspan><tspan x="28" y="655.1550000000001">special occasion</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">commemoration; customary practice</tspan></text><text x="28" y="782.835" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="811.715">The reading distinguishes religious observance</tspan><tspan x="28" y="844.965">from a public celebration.</tspan></text><text x="28" y="894.365" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="923.245">Topic: An Easter gathering with room for</tspan><tspan x="28" y="956.495">everyone. Write one sentence using this word.</tspan><tspan x="28" y="989.745">Check that your sentence keeps the meaning</tspan><tspan x="28" y="1022.995">shown above.</tspan></text><text x="28" y="1072.395" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1101.2749999999999">A: What does “observance” mean?</tspan><tspan x="28" y="1134.5249999999999">B: It means the practice of following a custom or</tspan><tspan x="28" y="1167.7749999999999">marking a special occasion.</tspan><tspan x="28" y="1201.0249999999999">A: Can we use it at an Easter gathering?</tspan><tspan x="28" y="1234.2749999999999">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1283.675" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1312.5549999999998">Which word means “the practice of following a</tspan><tspan x="28" y="1345.8049999999998">custom or marking a special occasion”:</tspan><tspan x="28" y="1379.0549999999998">observance or renewal? (Model: observance)</tspan></text></svg>