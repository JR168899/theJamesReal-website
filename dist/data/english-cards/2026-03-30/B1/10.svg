<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Are you doing anything for Easter this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/03/30 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Children search outdoors with baskets.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Children search outdoors with baskets.</tspan></text><a href="https://www.pexels.com/photo/content-diverse-girls-looking-for-easter-eggs-in-garden-7169576/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7169576</text></a></svg><text font-family="Arial, sans-serif" font-size="44.39" font-weight="700" fill="#353331"><tspan x="28" y="476.39">Are you doing anything for</tspan><tspan x="28" y="531.8774999999999">Easter this year?</tspan></text><text x="28" y="592.19" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="621.526">An opening that invites a personal preference or</tspan><tspan x="28" y="655.3009999999999">experience without assuming everyone shares it.</tspan></text><text x="28" y="705.4810000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="734.817">Are you doing anything for Easter this year?</tspan></text><text x="28" y="784.9970000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="814.333">Follow the answer with a related question. Accept</tspan><tspan x="28" y="848.108">a different preference or a declined invitation</tspan><tspan x="28" y="881.883">without asking the person to justify it.</tspan></text><text x="28" y="932.0630000000001" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="961.399">Sky: Are you organizing the egg hunt?</tspan><tspan x="28" y="995.174">Michael: Yes, but there will be another activity for</tspan><tspan x="28" y="1028.949">anyone who prefers it.</tspan><tspan x="28" y="1062.724">Sky: What will that be?</tspan><tspan x="28" y="1096.499">Michael: Decorating cards at the table.</tspan><tspan x="28" y="1130.2740000000001">Sky: Can I help explain the boundary for the</tspan><tspan x="28" y="1164.049">hunt?</tspan><tspan x="28" y="1197.824">Michael: That would be useful. We want the</tspan><tspan x="28" y="1231.5990000000002">instructions to be clear.</tspan></text><text x="28" y="1281.779" font-family="Arial, sans-serif" font-size="15.440000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.020000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1311.115">A guest prefers not to join the egg hunt. Offer</tspan><tspan x="28" y="1344.89">another activity without asking them to justify the</tspan><tspan x="28" y="1378.665">choice.</tspan></text></svg>