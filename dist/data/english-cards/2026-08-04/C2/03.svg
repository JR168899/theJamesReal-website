y="756.1839999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="785.976">The experience did not bear out our initial</tspan><tspan x="28" y="820.276">assumption.</tspan></text><text x="28" y="871.2359999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="901.028">Keep the particle with the verb. Check a</tspan><tspan x="28" y="935.328">dictionary before changing its object or word</tspan><tspan x="28" y="969.628">order.</tspan></text><text x="28" y="1020.5879999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1050.3799999999999">A: How can we listen to a whole album?</tspan><tspan x="28" y="1084.6799999999998">B: The experience did not bear out our initial</tspan><tspan x="28" y="1118.9799999999998">assumption.</tspan><tspan x="28" y="1153.28">A: That gives us a starting point.</tspan><tspan x="28" y="1187.58">B: Let us try it together.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1323.772">Explain “bear out” in your own words, then use it</tspan><tspan x="28" y="1358.072">in a sentence about listening without distraction.</tspan></text></svg>