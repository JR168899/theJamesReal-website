<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If music be the food of love, play on;</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/05/13 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people play guitars together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people play guitars together.</tspan></text><a href="https://www.pexels.com/photo/men-playing-the-guitars-and-smiling-4670179/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4670179</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="473.86">If music be the food of love,</tspan><tspan x="28" y="526.1850000000001">play on;</tspan></text><text font-family="Arial, sans-serif" font-size="18.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="554.85">William Shakespeare · Twelfth Night, Act I, Scene 1 (First Folio) · Published</tspan><tspan x="28" y="577.054">1623</tspan></text><text x="28" y="626.74" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="654.404">The speaker imagines music as something that feeds</tspan><tspan x="28" y="686.254">or sustains a feeling of love.</tspan></text><text x="28" y="733.5740000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="761.238">Music can nourish emotion; Sound is compared to</tspan><tspan x="28" y="793.0880000000001">emotional nourishment</tspan></text><text x="28" y="840.4080000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="868.0720000000001">The melody changes the mood in the room, and we</tspan><tspan x="28" y="899.9220000000001">listen to the next phrase.</tspan></text><text x="28" y="947.2420000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="974.9060000000002">Orsino speaks this line. Be is an older subjunctive</tspan><tspan x="28" y="1006.7560000000002">form here. Food of love is a metaphor, and the</tspan><tspan x="28" y="1038.6060000000002">speech goes on to complicate the speaker’s desire.</tspan></text><text x="28" y="1085.9260000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1113.5900000000001">A: Why does the speaker compare music to food?</tspan><tspan x="28" y="1145.44">B: He imagines it feeding an emotional appetite.</tspan><tspan x="28" y="1177.2900000000002">A: Is that the same as saying music is literally edible?</tspan><tspan x="28" y="1209.14">B: No. The metaphor connects listening with desire</tspan><tspan x="28" y="1240.9900000000002">and nourishment.</tspan></text><text x="28" y="1288.3100000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1315.9740000000002">Explain the food metaphor without treating it as a</tspan><tspan x="28" y="1347.824">literal definition of music.</tspan></text></svg>