<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discern</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/01/22 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="42.550000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="474.55">discern</tspan></text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="511.0875">US /dɪˈsɝn/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.35" font-weight="400" fill="#382d2e"><tspan x="28" y="537.1355">discern · discerns · discerned · discerned · discerning (base · third</tspan><tspan x="28" y="561.9625">person · past · past participle · -ing)</tspan></text><text x="28" y="613.6144999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.7344999999999">to recognise a detail or difference that is not</tspan><tspan x="28" y="674.1094999999999">immediately obvious</tspan></text><text x="28" y="722.2094999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="750.3294999999999">perceive; distinguish</tspan></text><text x="28" y="798.4295" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="826.5495">With careful listening, we can discern a second</tspan><tspan x="28" y="858.9245">melody.</tspan></text><text x="28" y="907.0245" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="935.1445">Use the verb in the sense shown in the exchange.</tspan><tspan x="28" y="967.5195">Notice the subject, tense and any object; the word</tspan><tspan x="28" y="999.8945">forms above show its changes.</tspan></text><text x="28" y="1047.9945" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1076.1145000000001">Kore: Can you discern a change in the narrator&#x27;s</tspan><tspan x="28" y="1108.4895000000001">tone?</tspan><tspan x="28" y="1140.8645000000001">Onyx: The last paragraph is much less confident.</tspan><tspan x="28" y="1173.2395000000001">Kore: Which words give that impression?</tspan><tspan x="28" y="1205.6145000000001">Onyx: The repeated perhaps and the unanswered</tspan><tspan x="28" y="1237.9895000000001">questions.</tspan></text><text x="28" y="1286.0895" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1314.2095000000002">Name two textual clues that could help someone</tspan><tspan x="28" y="1346.5845000000002">discern uncertainty. (Model: Hedging words such as</tspan><tspan x="28" y="1378.9595000000002">perhaps and questions left unanswered.)</tspan></text></svg>