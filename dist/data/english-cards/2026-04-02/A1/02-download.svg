<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>basket</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/04/02 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Woven material forms a carrying basket.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Woven material forms a carrying basket.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-wicker-basket-7232501/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7232501</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">basket</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ˈbæskɪt/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">Singular: basket; plural: baskets.</tspan></text><text x="28" y="609.975" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.8950000000001">a container made from woven material, often</tspan><tspan x="28" y="678.6450000000001">with a handle</tspan></text><text x="28" y="733.245" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="765.1650000000001">woven container; carrying container</tspan></text><text x="28" y="819.765" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="851.6850000000001">The children carry a basket for the egg hunt.</tspan></text><text x="28" y="906.285" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="938.205">Keep the sense and countability shown in the</tspan><tspan x="28" y="974.955">example. Use a singular or plural form</tspan><tspan x="28" y="1011.705">appropriate to the specific person, object or</tspan><tspan x="28" y="1048.455">event being discussed.</tspan></text><text x="28" y="1103.055" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.9750000000001">A: Where shall I put the apples?</tspan><tspan x="28" y="1171.7250000000001">B: In the basket.</tspan><tspan x="28" y="1208.4750000000001">A: Can I carry it by myself?</tspan><tspan x="28" y="1245.2250000000001">B: Yes, but leave room for the bread.</tspan></text><text x="28" y="1299.825" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1331.7450000000001">Explain one practical use of a basket. (Model:</tspan><tspan x="28" y="1368.4950000000001">It can hold and carry food or other items.)</tspan></text></svg>