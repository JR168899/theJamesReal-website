<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>An Easter gathering with room for everyone</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/04/02 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Eggs are arranged together for a seasonal activity.</tspan></text><a href="https://www.pexels.com/photo/easter-eggs-in-a-basket-20821490/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 20821490</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">An Easter gathering with room for everyone</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="169.0">I like to prepare an Easter gathering. Two small things help me.</tspan></text><text x="42" y="202.44" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="239.44">First, we put eggs in a basket. We explain the game.</tspan></text><text x="42" y="272.88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="309.88">Next, we ask what our guests enjoy. Everyone can choose an activity.</tspan></text><text x="42" y="343.32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="380.32">These two things help us. We can prepare an Easter gathering and</tspan><tspan x="42" y="417.76">enjoy our time together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="469.2">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="491.15999999999997">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="513.12">about an experience of your own.</tspan><tspan x="42" y="535.0799999999999">Look again. What two reasons support the main idea? Explain one example. (Model: The two reasons are that clear</tspan><tspan x="42" y="557.04">instructions help children join an activity safely and that recognizing different practices makes the gathering welcoming. One</tspan><tspan x="42" y="579.0">example is that we mark the egg-hunt area and explain which places are out of bounds.)</tspan></text></svg>