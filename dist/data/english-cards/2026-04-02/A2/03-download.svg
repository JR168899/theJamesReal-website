<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/04/02 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A new day begins with getting up and preparing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A new day begins with getting up and preparing.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="470.41">get ready</tspan></text><text x="28" y="522.5975" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="547.9815">prepare yourself</tspan></text><text x="28" y="591.4015" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="616.7855000000001">prepare; make preparations</tspan></text><text x="28" y="660.2055" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="685.5895">We get ready before we leave as we prepare for Easter.</tspan></text><text x="28" y="729.0095" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="754.3935">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="783.6185">changing its object or word order.</tspan></text><text x="28" y="827.0385" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="852.4225">A: How can we prepare an Easter gathering?</tspan><tspan x="28" y="881.6475">B: We get ready before we leave.</tspan><tspan x="28" y="910.8725000000001">A: That gives us a starting point.</tspan><tspan x="28" y="940.0975000000001">B: Let us try it together.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1282.7440000000001">For Easter, look again. Explain “get ready” in your own</tspan><tspan x="28" y="1311.969">words, then use it in a sentence about an easter gathering</tspan><tspan x="28" y="1341.1940000000002">with room for everyone. (Model: It means to prepare</tspan><tspan x="28" y="1370.419">yourself. Example: We get ready before we leave.)</tspan></text></svg>