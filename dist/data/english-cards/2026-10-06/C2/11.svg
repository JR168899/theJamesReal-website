<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Around the table</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-10-06</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Around the table</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Around the table</title><desc>Original hand-drawn story illustration: plate, set within table. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-3) scale(1.5)"><ellipse rx="65" ry="38" fill="#e9d2a9"/><ellipse rx="43" ry="23"/><path d="M-84-40V43M-94-40V-13Q-84 1-74-13V-40M85-40V43M85-40Q59-12 85-4"/></g><g transform="translate(95 264) rotate(3) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Around the table</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="36" dy="0">To share a meal is to negotiate a</tspan><tspan x="36" dy="22.08">familiar but frequently obscured</tspan><tspan x="36" dy="22.08">relationship between intentional</tspan><tspan x="36" dy="22.08">design and the contingencies of</tspan><tspan x="36" dy="22.08">shared experience. The question is</tspan><tspan x="36" dy="22.08">not whether arrangements are</tspan><tspan x="36" dy="22.08">desirable, but what authority they</tspan><tspan x="36" dy="22.08">should acquire. A credible position</tspan><tspan x="36" dy="22.08">supports preparation while</tspan><tspan x="36" dy="22.08">withholding the assumption that</tspan><tspan x="36" dy="22.08">procedural coherence is equivalent</tspan><tspan x="36" dy="22.08">to human value.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="384" dy="0">There is a substantive case for</tspan><tspan x="384" dy="20.7">structure: a simple plan leaves time</tspan><tspan x="384" dy="20.7">for conversation. Here, we prepare the</tspan><tspan x="384" dy="20.7">vegetables before our guests arrive.</tspan><tspan x="384" dy="20.7">The arrangement earns its legitimacy</tspan><tspan x="384" dy="20.7">through the specific difficulty it</tspan><tspan x="384" dy="20.7">alleviates, not through its conformity</tspan><tspan x="384" dy="20.7">to an abstract ideal of order. Its</tspan><tspan x="384" dy="20.7">success is consequently conditional.</tspan><tspan x="384" dy="20.7">Once the intervention demands more</tspan><tspan x="384" dy="20.7">attention than the obstacle it</tspan><tspan x="384" dy="20.7">removes, the original justification</tspan><tspan x="384" dy="20.7">begins to unravel.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="14" font-weight="normal"><tspan x="732" dy="0">An assessment confined to that practical</tspan><tspan x="732" dy="19.32">benefit would nevertheless be</tspan><tspan x="732" dy="19.32">incomplete, since sharing the work helps</tspan><tspan x="732" dy="19.32">everyone feel included. In concrete</tspan><tspan x="732" dy="19.32">terms, each guest brings one dish and</tspan><tspan x="732" dy="19.32">helps clear the table. This introduces a</tspan><tspan x="732" dy="19.32">problem of perspective: whose</tspan><tspan x="732" dy="19.32">convenience supplies the standard</tspan><tspan x="732" dy="19.32">against which improvement is measured?</tspan><tspan x="732" dy="19.32">An apparently neutral procedure may</tspan><tspan x="732" dy="19.32">privilege the preferences of its</tspan><tspan x="732" dy="19.32">designer. Attentiveness to others makes</tspan><tspan x="732" dy="19.32">that asymmetry visible and creates</tspan><tspan x="732" dy="19.32">grounds for revision.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">What emerges is a qualified defence</tspan><tspan x="1080" dy="22.08">of planning, rather than a</tspan><tspan x="1080" dy="22.08">celebration of either control or</tspan><tspan x="1080" dy="22.08">spontaneity. Arrangements can</tspan><tspan x="1080" dy="22.08">sustain an experience without</tspan><tspan x="1080" dy="22.08">exhausting its meaning. Their</tspan><tspan x="1080" dy="22.08">authority should remain answerable</tspan><tspan x="1080" dy="22.08">to the people and circumstances</tspan><tspan x="1080" dy="22.08">they affect; otherwise, a means of</tspan><tspan x="1080" dy="22.08">making life more habitable risks</tspan><tspan x="1080" dy="22.08">becoming the criterion to which</tspan><tspan x="1080" dy="22.08">life must conform.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>