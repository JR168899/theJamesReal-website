<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>reciprocity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/10/06 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People contribute to an experience they enjoy together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People contribute to an experience they enjoy together.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">reciprocity</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /ˌrɛsəˈprɑsəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">Usually uncountable: reciprocity; no regular plural in this</tspan><tspan x="28" y="571.7974999999999">sense.</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">the practice of responding to another person’s</tspan><tspan x="28" y="692.4313000000001">action with a similar action</tspan></text><text x="28" y="744.1713" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="774.4193">mutual exchange; give-and-take</tspan></text><text x="28" y="826.1592999999999" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="856.4073">Sharing the work creates a sense of reciprocity.</tspan></text><text x="28" y="908.1473" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953">Topic: Around the table. Write one sentence</tspan><tspan x="28" y="973.2203000000001">using this word. Check that your sentence</tspan><tspan x="28" y="1008.0453">keeps the meaning shown above.</tspan></text><text x="28" y="1059.7853" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0332999999998">A: What does “reciprocity” mean?</tspan><tspan x="28" y="1124.8582999999999">B: It means the practice of responding to</tspan><tspan x="28" y="1159.6833">another person’s action with a similar action.</tspan><tspan x="28" y="1194.5082999999997">A: Can we use it at the table?</tspan><tspan x="28" y="1229.3332999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1281.0733" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1311.3212999999998">Which word means “the practice of responding</tspan><tspan x="28" y="1346.1462999999999">to another person’s action with a similar action”:</tspan><tspan x="28" y="1380.9713">reciprocity or convivial? (Model: reciprocity)</tspan></text></svg>