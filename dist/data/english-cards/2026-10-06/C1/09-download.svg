<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Inversion after only then</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - C1 - 2026/10/06 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pumpkin-head costume changes a familiar human appearance.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pumpkin-head costume changes a familiar human appearance.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382f40"><tspan x="28" y="473.63">Inversion after only then</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="557.7045">Put an auxiliary before the subject when Only then</tspan><tspan x="28" y="589.3795">begins a sentence in this pattern.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="663.9515">Only then did we understand the problem.</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="738.5235">After fronted Only then use auxiliary + subject + main</tspan><tspan x="28" y="770.1985">verb. Past simple uses did + base verb: did we</tspan><tspan x="28" y="801.8735">understand, not understood.</tspan></text><text x="28" y="848.9335" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="876.4455">A: Did you notice the missing condition at once?</tspan><tspan x="28" y="908.1205">B: No. I read the second page first.</tspan><tspan x="28" y="939.7955000000001">A: And after that?</tspan><tspan x="28" y="971.4705">B: Only then did I realize that advance registration</tspan><tspan x="28" y="1003.1455000000001">was required.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="1285.992">Rewrite We read the second page. At that moment</tspan><tspan x="28" y="1317.667">we understood the deadline as a sentence beginning</tspan><tspan x="28" y="1349.3419999999999">Only then. (Model: Only then did we understand the</tspan><tspan x="28" y="1381.017">deadline.)</tspan></text></svg>