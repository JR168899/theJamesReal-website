<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually arrange a room?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/10/25 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#353331"><tspan x="28" y="479.84000000000003">How do you usually</tspan><tspan x="28" y="539.64">arrange a room?</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="636.256">An open question that invites a person to</tspan><tspan x="28" y="672.656">describe a familiar experience.</tspan></text><text x="28" y="726.736" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="758.352">How do you usually arrange a room?</tspan></text><text x="28" y="812.432" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="844.048">How do you usually ...? asks about a habit.</tspan><tspan x="28" y="880.448">Answer the question, then ask a related</tspan><tspan x="28" y="916.848">question of your own.</tspan></text><text x="28" y="970.928" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1002.544">A: How do you usually arrange a room?</tspan><tspan x="28" y="1038.944">B: I put a chair near the window.</tspan><tspan x="28" y="1075.344">A: Where do you keep your books?</tspan><tspan x="28" y="1111.744">B: On a shelf beside the chair.</tspan><tspan x="28" y="1148.144">A: Why do you put them there?</tspan><tspan x="28" y="1184.5439999999999">B: I can reach them easily.</tspan><tspan x="28" y="1220.944">A: Would you like a plant by the window?</tspan><tspan x="28" y="1257.344">B: Yes. That would be nice.</tspan></text><text x="28" y="1311.4240000000002" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1343.04">Your example. Write a reply of your own, then</tspan><tspan x="28" y="1379.44">ask one related question.</tspan></text></svg>