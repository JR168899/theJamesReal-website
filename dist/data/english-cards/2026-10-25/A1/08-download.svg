see it from our chair.</tspan></text><text x="28" y="848.9334999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="876.4454999999999">This is an original James Real learning reflection.</tspan><tspan x="28" y="908.1204999999999">Explain the idea in your own words rather than</tspan><tspan x="28" y="939.7955">treating it as a factual rule.</tspan></text><text x="28" y="986.8554999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1014.3675">A: How would you express this idea?</tspan><tspan x="28" y="1046.0425">B: Small things can help.</tspan><tspan x="28" y="1077.7175">A: What does that mean here?</tspan><tspan x="28" y="1109.3925">B: An original James Real learning reflection on</tspan><tspan x="28" y="1141.0674999999999">practical consideration.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.992">Your example. Which action in today’s topic</tspan><tspan x="28" y="1317.667">illustrates this reflection? (Model: We place a</tspan><tspan x="28" y="1349.3419999999999">favourite photograph where we can see it from our</tspan><tspan x="28" y="1381.017">chair.)</tspan></text></svg>