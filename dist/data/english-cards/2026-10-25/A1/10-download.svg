<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually arrange a room?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/10/25 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Furniture, light and space shape an everyday room.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Furniture, light and space shape an everyday room.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">How do you usually</tspan><tspan x="28" y="535.5">arrange a room?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">An open question that invites a person to</tspan><tspan x="28" y="663.4">describe a familiar experience.</tspan></text><text x="28" y="715.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="745.8">How do you usually arrange a room?</tspan></text><text x="28" y="797.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="828.1999999999999">How do you usually ...? asks about a habit.</tspan><tspan x="28" y="863.1999999999999">Answer the question, then ask a related</tspan><tspan x="28" y="898.1999999999999">question of your own.</tspan></text><text x="28" y="950.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="980.5999999999999">A: How do you usually arrange a room?</tspan><tspan x="28" y="1015.5999999999999">B: I put a chair near the window.</tspan><tspan x="28" y="1050.6">A: Where do you keep your books?</tspan><tspan x="28" y="1085.6">B: On a shelf beside the chair.</tspan><tspan x="28" y="1120.6">A: Why do you put them there?</tspan><tspan x="28" y="1155.6">B: I can reach them easily.</tspan><tspan x="28" y="1190.6">A: Would you like a plant by the window?</tspan><tspan x="28" y="1225.6">B: Yes. That would be nice.</tspan></text><text x="28" y="1277.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1308.0">Your example. Write a reply of your own, then</tspan><tspan x="28" y="1343.0">ask one related question. (Model: I make a</tspan><tspan x="28" y="1378.0">small plan. What works best for you?)</tspan></text></svg>