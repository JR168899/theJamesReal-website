<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes a room comfortable for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/25 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Light enters through a narrow window.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Light enters through a narrow window.</tspan></text><a href="https://www.pexels.com/photo/sunlight-streaming-into-a-dark-room-through-a-lone-window-18820283/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 18820283</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">What makes a room</tspan><tspan x="28" y="535.5">comfortable for you?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">An opening that invites a personal preference</tspan><tspan x="28" y="663.4">or experience without assuming everyone</tspan><tspan x="28" y="698.4">shares it.</tspan></text><text x="28" y="750.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="780.8">What makes a room comfortable for you?</tspan></text><text x="28" y="832.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="863.1999999999999">Follow the answer with a related question.</tspan><tspan x="28" y="898.1999999999999">Accept a different preference or a declined</tspan><tspan x="28" y="933.1999999999999">invitation without asking the person to justify it.</tspan></text><text x="28" y="985.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1015.5999999999999">A: Have you changed anything in your room</tspan><tspan x="28" y="1050.6">recently?</tspan><tspan x="28" y="1085.6">B: I moved the chair closer to the window.</tspan><tspan x="28" y="1120.6">A: Has it made much difference?</tspan><tspan x="28" y="1155.6">B: I read there more often now.</tspan><tspan x="28" y="1190.6">A: Did you need to buy anything?</tspan><tspan x="28" y="1225.6">B: No. Moving what I already had was enough.</tspan></text><text x="28" y="1277.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1308.0">A friend says moving a chair made the room</tspan><tspan x="28" y="1343.0">better. Ask a relevant follow-up without turning</tspan><tspan x="28" y="1378.0">it into a shopping recommendation.</tspan></text></svg>