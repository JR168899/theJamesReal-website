<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>work out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B1 - 2026/10/25 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="478.69">work something out</tspan><tspan x="28" y="537.0525">work out something</tspan></text><text x="28" y="600.49" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="631.346">find a solution</tspan></text><text x="28" y="684.126" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="714.982">solve; figure out</tspan></text><text x="28" y="767.762" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="798.6179999999999">We can work out a plan together.</tspan></text><text x="28" y="851.3979999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="882.2539999999999">Keep the particle with the verb. Check a</tspan><tspan x="28" y="917.7789999999999">dictionary before changing its object or word</tspan><tspan x="28" y="953.3039999999999">order.</tspan></text><text x="28" y="1006.084" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1036.94">A: How can we arrange a room?</tspan><tspan x="28" y="1072.4650000000001">B: We can work out a plan together.</tspan><tspan x="28" y="1107.99">A: That gives us a starting point.</tspan><tspan x="28" y="1143.515">B: Let us try it together.</tspan></text><text x="28" y="1260.24" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1291.096">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1326.621">Explain “work out” in your own words, then use</tspan><tspan x="28" y="1362.146">it in a sentence about making a room your own.</tspan></text></svg>