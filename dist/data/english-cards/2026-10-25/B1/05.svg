<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>play it by ear</title><rect width="660" height="1434" fill="#efe6bd"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#383426" stroke-width="1"/><text x="35" y="43" fill="#383426" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-10-25</tspan></text><text x="35" y="88" fill="#383426" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">play it by ear</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>play it by ear</title><desc>Original hand-drawn story illustration: path, set within home. decide what to do as events develop</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><path d="M-15 70Q-53 14-13-4Q29-22-11-69M28 70Q-6 12 29-1L72-41" fill="none"/><path d="M58-43L73-42L69-26M-16-59L-11-70L0-61"/></g><g transform="translate(94 266) rotate(-1) scale(0.52)"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">play it by ear</text></svg><text x="35" y="514.4" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">decide what to do as events develop</tspan></text><text x="35" y="590.8" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">We have a rough plan, but we can play it by ear.</tspan></text><text x="35" y="667.1999999999999" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Learn the whole expression. It is figurative language, so</tspan><tspan x="35" dy="24.839999999999996">a word-for-word interpretation may be misleading.</tspan></text><text x="35" y="768.4399999999998" fill="#383426" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="792.9999999999998" fill="#383426" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Apply the idea to a real situation, then answer: What does</tspan><tspan x="35" dy="24.839999999999996">“play it by ear” mean in this example? We have a rough</tspan><tspan x="35" dy="24.839999999999996">plan, but we can play it by ear.</tspan></text><text x="35" y="1406" fill="#383426" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">IDIOMS   /   05 OF 11</tspan></text></svg>