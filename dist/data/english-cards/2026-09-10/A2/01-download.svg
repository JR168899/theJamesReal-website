<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>guest</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/09/10 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A host serves food at a table.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A host serves food at a table.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="48.760000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="480.76">guest</tspan></text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="522.63">US /ɡɛst/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.32" font-weight="400" fill="#382d2e"><tspan x="28" y="552.4796">Singular: guest; plural: guests.</tspan></text><text x="28" y="611.67" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="643.8939999999999">someone you invite to visit</tspan></text><text x="28" y="699.0139999999999" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="731.2379999999998">visitor; invited person</tspan></text><text x="28" y="786.358" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="818.5819999999999">Each guest brings a dish to share.</tspan></text><text x="28" y="873.702" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="905.9259999999999">Keep the sense and countability shown in</tspan><tspan x="28" y="943.026">the example. Use a singular or plural form</tspan><tspan x="28" y="980.126">appropriate to the specific person, object or</tspan><tspan x="28" y="1017.2259999999999">event being discussed.</tspan></text><text x="28" y="1072.346" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1104.57">Bella: Is Mia eating with us?</tspan><tspan x="28" y="1141.6699999999998">Fenrir: Yes. She is our guest today.</tspan><tspan x="28" y="1178.77">Bella: Shall I get another chair?</tspan><tspan x="28" y="1215.87">Fenrir: Yes, and a plate, please.</tspan></text><text x="28" y="1270.99" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1303.214">There are four family members and one</tspan><tspan x="28" y="1340.3139999999999">invited guest. How many places are needed?</tspan><tspan x="28" y="1377.414">(Model: Five places.)</tspan></text></svg>