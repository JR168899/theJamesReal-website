 stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">The significance of a decision</tspan><tspan x="28" y="522.045">is not exhausted by its</tspan><tspan x="28" y="572.0699999999999">efficiency.</tspan></text><text x="28" y="626.445" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="652.8930000000001">An original James Real learning reflection on practical</tspan><tspan x="28" y="683.3430000000002">consideration.</tspan></text><text x="28" y="728.5830000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="755.0310000000002">An original James Real learning reflection on practical</tspan><tspan x="28" y="785.4810000000002">consideration</tspan></text><text x="28" y="830.7210000000001" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="857.1690000000002">For example, we explain a favourite passage to a friend</tspan><tspan x="28" y="887.6190000000003">and listen to a different interpretation.</tspan></text><text x="28" y="932.8590000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="959.3070000000002">This is an original James Real learning reflection. Explain</tspan><tspan x="28" y="989.7570000000003">the idea in your own words rather than treating it as a</tspan><tspan x="28" y="1020.2070000000002">factual rule.</tspan></text><text x="28" y="1065.4470000000003" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1091.8950000000002">A: How would you express this idea?</tspan><tspan x="28" y="1122.3450000000003">B: The significance of a decision is not exhausted by its</tspan><tspan x="28" y="1152.7950000000003">efficiency.</tspan><tspan x="28" y="1183.2450000000001">A: What does that mean here?</tspan><tspan x="28" y="1213.6950000000002">B: An original James Real learning reflection on practical</tspan><tspan x="28" y="1244.1450000000002">consideration.</tspan></text><text x="28" y="1289.3850000000002" font-family="Arial, sans-serif" font-size="13.92" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.36" font-weight="400" fill="#2c3540"><tspan x="28" y="1315.833">Which action in today’s topic illustrates this reflection?</tspan><tspan x="28" y="1346.2830000000001">(Model: We explain a favourite passage to a friend and</tspan><tspan x="28" y="1376.7330000000002">listen to a different interpretation.)</tspan></text></svg>