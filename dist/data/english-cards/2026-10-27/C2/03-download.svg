<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/27 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">bear something out</tspan><tspan x="28" y="513.0">bear out something</tspan></text><text x="28" y="559.2299999999999" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="581.422">support or confirm a claim</tspan></text><text x="28" y="619.382" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="641.5740000000001">corroborate; substantiate</tspan></text><text x="28" y="679.534" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="701.7260000000001">The experience did not bear out our initial assumption.</tspan></text><text x="28" y="739.686" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="761.8780000000002">Keep the particle with the verb. Check a dictionary before changing</tspan><tspan x="28" y="787.4280000000001">its object or word order.</tspan></text><text x="28" y="825.388" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="847.5800000000002">A: How can we prepare a Halloween evening?</tspan><tspan x="28" y="873.1300000000001">B: The experience did not bear out our initial assumption.</tspan><tspan x="28" y="898.6800000000002">A: That gives us a starting point.</tspan><tspan x="28" y="924.2300000000001">B: Let us try it together.</tspan></text><text x="28" y="1255.68" font-family="Arial, sans-serif" font-size="11.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1277.872">For Halloween, explain the meaning before looking at the model</tspan><tspan x="28" y="1303.422">answer. Explain “bear out” in your own words, then use it in a</tspan><tspan x="28" y="1328.972">sentence about a halloween evening that welcomes everyone.</tspan><tspan x="28" y="1354.5220000000002">(Model: It means to support or confirm a claim. Example: The</tspan><tspan x="28" y="1380.0720000000001">experience did not bear out our initial assumption.)</tspan></text></svg>