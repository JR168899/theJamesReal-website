<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Marilla, isn&#x27;t it nice to think that tomorrow is a new day with no mistakes in it yet?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/27 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cake recalls the baking mistake behind Anne&#x27;s hopeful words.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cake recalls the baking mistake behind Anne&#x27;s hopeful words.</tspan></text><a href="https://www.pexels.com/photo/cake-on-a-table-7855284/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Anna Pyshniuk / Pexels · 7855284</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="477.08">Marilla, isn&#x27;t it nice to think</tspan><tspan x="28" y="533.43">that tomorrow is a new day</tspan><tspan x="28" y="589.78">with no mistakes in it yet?</tspan></text><text font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#2c3540"><tspan x="28" y="620.65">Anne Shirley (fictional character) · L. M. Montgomery · Anne of</tspan><tspan x="28" y="644.562">Green Gables, Chapter XXI · Published 1908</tspan></text><text x="28" y="698.0699999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="727.862">Anne makes a cake for visitors. But she uses</tspan><tspan x="28" y="762.1619999999999">medicine instead of vanilla, and the cake tastes</tspan><tspan x="28" y="796.462">terrible. She is very upset. Mrs. Allan is kind to</tspan><tspan x="28" y="830.762">her, so Anne feels better. Later, Anne says these</tspan><tspan x="28" y="865.062">words to Marilla. The day has gone wrong, but</tspan><tspan x="28" y="899.362">tomorrow is still new. She can learn from her</tspan><tspan x="28" y="933.662">mistake and try again.</tspan></text><text x="28" y="984.6219999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1014.414">The word yet means before now. Tomorrow has</tspan><tspan x="28" y="1048.714">no mistakes yet because it has not started. Anne</tspan><tspan x="28" y="1083.014">is looking for a fresh start.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1289.472">Why does Anne feel hopeful about tomorrow after</tspan><tspan x="28" y="1323.772">making a bad cake? (Model: Tomorrow gives her</tspan><tspan x="28" y="1358.072">another chance to learn and do better.)</tspan></text></svg>