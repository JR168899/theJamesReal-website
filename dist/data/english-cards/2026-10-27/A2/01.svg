<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>costume</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/10/27 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pumpkin-head costume changes a familiar human appearance.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pumpkin-head costume changes a familiar human appearance.</tspan></text><a href="https://www.pexels.com/photo/person-wearing-halloween-pumpkin-head-costume-28958109/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 28958109</text></a></svg><text font-family="Arial, sans-serif" font-size="48.760000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="480.76">costume</tspan></text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="522.63">US /ˈkɑstum/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.32" font-weight="400" fill="#382d2e"><tspan x="28" y="552.4796">Singular: costume; plural: costumes.</tspan></text><text x="28" y="611.67" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="643.8939999999999">clothes worn to look like a character or a</tspan><tspan x="28" y="680.9939999999999">particular kind of person</tspan></text><text x="28" y="736.114" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="768.338">outfit; fancy dress</tspan></text><text x="28" y="823.4580000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="855.682">Her Halloween costume includes a cape.</tspan></text><text x="28" y="910.8020000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="943.0260000000001">Keep the sense and countability shown in</tspan><tspan x="28" y="980.1260000000001">the example. Use a singular or plural form</tspan><tspan x="28" y="1017.2260000000001">appropriate to the specific person, object or</tspan><tspan x="28" y="1054.326">event being discussed.</tspan></text><text x="28" y="1109.4460000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1141.67">A: Is your costume ready?</tspan><tspan x="28" y="1178.77">B: Almost. The sleeves are too long.</tspan><tspan x="28" y="1215.8700000000001">A: Can you shorten them?</tspan><tspan x="28" y="1252.97">B: Yes. I need my hands free.</tspan></text><text x="28" y="1308.0900000000001" font-family="Arial, sans-serif" font-size="16.96" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.68" font-weight="400" fill="#382d2e"><tspan x="28" y="1340.314">Explain one reason to check the fit of a</tspan><tspan x="28" y="1377.414">costume before an event.</tspan></text></svg>