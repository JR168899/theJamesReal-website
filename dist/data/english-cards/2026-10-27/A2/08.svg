<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Marilla, isn&#x27;t it nice to think that tomorrow is a new day with no mistakes in it yet?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/27 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cake recalls the baking mistake behind Anne&#x27;s hopeful words.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cake recalls the baking mistake behind Anne&#x27;s hopeful words.</tspan></text><a href="https://www.pexels.com/photo/cake-on-a-table-7855284/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Anna Pyshniuk / Pexels · 7855284</text></a></svg><text font-family="Arial, sans-serif" font-size="49.68000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="481.68">Marilla, isn&#x27;t it nice to</tspan><tspan x="28" y="543.78">think that tomorrow is a</tspan><tspan x="28" y="605.88">new day with no</tspan><tspan x="28" y="667.98">mistakes in it yet?</tspan></text><text font-family="Arial, sans-serif" font-size="21.6" font-weight="400" fill="#2c3540"><tspan x="28" y="702.0000000000001">Anne Shirley (fictional character) · L. M. Montgomery · Anne of</tspan><tspan x="28" y="728.3520000000001">Green Gables, Chapter XXI · Published 1908</tspan></text><text x="28" y="787.32" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="820.152">Anne makes a cake for visitors. But she uses</tspan><tspan x="28" y="857.952">medicine instead of vanilla, and the cake</tspan><tspan x="28" y="895.7520000000001">tastes terrible. She is very upset. Mrs. Allan</tspan><tspan x="28" y="933.552">is kind to her, so Anne feels better. Later,</tspan><tspan x="28" y="971.3520000000001">Anne says these words to Marilla. The day</tspan><tspan x="28" y="1009.152">has gone wrong, but tomorrow is still new.</tspan><tspan x="28" y="1046.952">She can learn from her mistake and try</tspan><tspan x="28" y="1084.752">again.</tspan></text><text x="28" y="1140.912" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="1173.7440000000001">The word yet means before now. Tomorrow</tspan><tspan x="28" y="1211.544">has no mistakes yet because it has not</tspan><tspan x="28" y="1249.344">started. Anne is looking for a fresh start.</tspan></text><text x="28" y="1305.5040000000001" font-family="Arial, sans-serif" font-size="17.28" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.240000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="1338.3360000000002">Why does Anne feel hopeful about tomorrow</tspan><tspan x="28" y="1376.1360000000002">after making a bad cake?</tspan></text></svg>