th d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-34Q-32-54-72-36V47Q-31 32 0 50Q32 32 72 47V-36Q32-54 0-34Z" fill="#5db8ed"/><path d="M0-34V50M-57-20L-14-10M-57-2L-14 8M15-10L56-20M15 8L56-2M15 26L56 16"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#383426"><tspan x="28" y="478.0">on the same page</tspan></text><text x="28" y="540.5" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="570.9">in agreement or sharing an understanding</tspan></text><text x="28" y="622.9" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="653.3">in accord; of the same understanding</tspan></text><text x="28" y="705.3" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="735.6999999999999">Are we on the same page about the plan?</tspan></text><text x="28" y="787.6999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="818.0999999999999">Learn the whole expression. It is figurative</tspan><tspan x="28" y="853.0999999999999">language, so a word-for-word interpretation may</tspan><tspan x="28" y="888.0999999999999">be misleading.</tspan></text><text x="28" y="940.0999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="970.4999999999999">A: How would you express this idea?</tspan><tspan x="28" y="1005.4999999999999">B: on the same page</tspan><tspan x="28" y="1040.5">A: What does that mean here?</tspan><tspan x="28" y="1075.5">B: in agreement or sharing an understanding</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#383426"><tspan x="28" y="1290.4">What does “on the same page” mean in this</tspan><tspan x="28" y="1325.4">example? Are we on the same page about the</tspan><tspan x="28" y="1360.4">plan?</tspan></text></svg>