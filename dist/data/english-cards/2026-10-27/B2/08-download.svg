<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Double, double toil and trouble;
Fire burn, and cauldron bubble.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/10/27 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A cauldron is a large pot, the object named in the witches’ chant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A cauldron is a large pot, the object named in the witches’ chant.</tspan></text><a href="https://www.pexels.com/photo/vintage-cauldron-on-rustic-background-showcasing-age-33635613/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 33635613</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="470.41">Double, double toil and trouble;</tspan><tspan x="28" y="518.4225">Fire burn, and cauldron bubble.</tspan></text><text font-family="Arial, sans-serif" font-size="16.700000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="544.725">William Shakespeare · Macbeth, Act IV, Scene 1 (First Folio) · Published 1623</tspan></text><text x="28" y="590.65" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="616.034">The repeated sounds create the atmosphere of a fictional</tspan><tspan x="28" y="645.259">spell.</tspan></text><text x="28" y="688.679" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="714.063">A rhythmic chant builds a supernatural mood; Repeated</tspan><tspan x="28" y="743.288">words create a dramatic incantation</tspan></text><text x="28" y="786.708" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="812.092">At the costume gathering, we read the lines as a piece of</tspan><tspan x="28" y="841.317">theater rather than a real instruction.</tspan></text><text x="28" y="884.737" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="910.121">The witches chant these lines in the play. Toil means hard</tspan><tspan x="28" y="939.346">work; cauldron means a large pot. The date refers to</tspan><tspan x="28" y="968.571">publication, not to a recorded spoken event.</tspan></text><text x="28" y="1011.991" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1037.375">Aoede: Shall I whisper the whole chant?</tspan><tspan x="28" y="1066.6">Echo: Try stressing Double, double first. The repetition</tspan><tspan x="28" y="1095.825">gives it a pulse.</tspan><tspan x="28" y="1125.05">Aoede: And make burn and bubble sharper?</tspan><tspan x="28" y="1154.275">Echo: Yes. Let the repeated sounds help create the</tspan><tspan x="28" y="1183.5">tension.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1282.7440000000001">Identify one repetition and one repeated consonant sound,</tspan><tspan x="28" y="1311.969">then suggest how an actor could use them. (Model: Stress</tspan><tspan x="28" y="1341.1940000000002">Double, double to establish a pulse and the b sound in</tspan><tspan x="28" y="1370.419">burn and bubble to make the chant insistent.)</tspan></text></svg>