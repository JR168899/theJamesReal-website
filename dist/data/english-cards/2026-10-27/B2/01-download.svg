<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>folklore</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/27 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">folklore</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˈfoʊkˌlɔr/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Usually uncountable: folklore; no regular plural in this sense.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">the traditional stories and beliefs of a community</tspan></text><text x="28" y="671.3050000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="700.1850000000001">traditional stories; folk tradition</tspan></text><text x="28" y="749.585" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="778.465">The class compares Halloween stories with local</tspan><tspan x="28" y="811.715">folklore.</tspan></text><text x="28" y="861.115" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="889.995">Keep the sense and countability shown in the</tspan><tspan x="28" y="923.245">example. Use a singular or plural form</tspan><tspan x="28" y="956.495">appropriate to the specific person, object or event</tspan><tspan x="28" y="989.745">being discussed.</tspan></text><text x="28" y="1039.145" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1068.0249999999999">Aoede: Is that story part of the town&#x27;s official</tspan><tspan x="28" y="1101.2749999999999">history?</tspan><tspan x="28" y="1134.5249999999999">Echo: It belongs to local folklore.</tspan><tspan x="28" y="1167.7749999999999">Aoede: So there may be several versions?</tspan><tspan x="28" y="1201.0249999999999">Echo: Yes. It has been passed on through stories</tspan><tspan x="28" y="1234.2749999999999">rather than one fixed account.</tspan></text><text x="28" y="1283.675" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1312.5549999999998">Why might a local folklore story exist in different</tspan><tspan x="28" y="1345.8049999999998">versions? (Model: Stories passed between people</tspan><tspan x="28" y="1379.0549999999998">can change with each retelling.)</tspan></text></svg>