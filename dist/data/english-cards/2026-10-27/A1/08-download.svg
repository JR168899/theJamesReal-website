<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is no place like home.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/10/27 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A familiar living room connects the photograph with Dorothy&#x27;s idea of home.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A familiar living room connects the photograph with Dorothy&#x27;s idea of home.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2c3540"><tspan x="28" y="482.0">There is no place like</tspan><tspan x="28" y="544.5">home.</tspan></text><text font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#2c3540"><tspan x="28" y="579.0">Dorothy (fictional character) · L. Frank Baum · The Wonderful</tspan><tspan x="28" y="605.84">Wizard of Oz, Chapter IV · Published 1900</tspan></text><text x="28" y="665.9" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="699.3399999999999">Dorothy is far from home. She walks with</tspan><tspan x="28" y="737.8399999999999">the Scarecrow. He likes the beautiful land.</tspan><tspan x="28" y="776.3399999999999">But Dorothy wants to go back to Kansas.</tspan><tspan x="28" y="814.8399999999999">Her home is not bright or beautiful. It is</tspan><tspan x="28" y="853.3399999999999">special to her. She says these words to her</tspan><tspan x="28" y="891.8399999999999">friend. This is a line in a story.</tspan></text><text x="28" y="949.04" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="982.4799999999999">Home is a special place for Dorothy. A</tspan><tspan x="28" y="1020.9799999999999">beautiful place is not always the place she</tspan><tspan x="28" y="1059.48">wants to live.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1295.04">Does Dorothy want a beautiful new home,</tspan><tspan x="28" y="1333.54">or her old home in Kansas? (Model: She</tspan><tspan x="28" y="1372.04">wants her old home in Kansas.)</tspan></text></svg>