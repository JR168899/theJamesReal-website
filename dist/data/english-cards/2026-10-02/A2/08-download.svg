<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Reading maketh a full man; conference a ready man; and writing an exact man.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/02 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="473.86">Reading maketh a full man;</tspan><tspan x="28" y="526.1850000000001">conference a ready man; and</tspan><tspan x="28" y="578.51">writing an exact man.</tspan></text><text font-family="Arial, sans-serif" font-size="18.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="607.1750000000001">Francis Bacon · Of Studies, Essays (1625 edition) · Published 1625</tspan></text><text x="28" y="657.2250000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="684.8890000000001">Reading builds knowledge, discussion develops</tspan><tspan x="28" y="716.7390000000001">readiness, and writing encourages precision.</tspan></text><text x="28" y="764.0590000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="791.7230000000002">Read to learn, discuss to respond, and write to be</tspan><tspan x="28" y="823.5730000000002">precise; Different forms of study develop different</tspan><tspan x="28" y="855.4230000000002">abilities</tspan></text><text x="28" y="902.7430000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="930.4070000000003">We read the passage, discuss an interpretation, and</tspan><tspan x="28" y="962.2570000000003">write a precise summary.</tspan></text><text x="28" y="1009.5770000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1037.2410000000002">Maketh means makes; conference here means</tspan><tspan x="28" y="1069.0910000000001">discussion. The historical use of man is retained in</tspan><tspan x="28" y="1100.9410000000003">the quotation. These claims describe an educational</tspan><tspan x="28" y="1132.7910000000002">ideal.</tspan></text><text x="28" y="1180.1110000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1207.7750000000003">A: What are the three activities?</tspan><tspan x="28" y="1239.6250000000002">B: Reading, talking and writing.</tspan><tspan x="28" y="1271.4750000000004">A: Is maketh a modern verb form?</tspan><tspan x="28" y="1303.3250000000003">B: No. We normally say makes.</tspan></text><text x="28" y="1350.6450000000004" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1378.3090000000004">Give the modern form of maketh. (Model: makes)</tspan></text></svg>