<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sustainable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/03/22 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">sustainable</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /səˈsteɪnəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">sustainable · more sustainable · most sustainable; noun:</tspan><tspan x="28" y="559.1525">sustainability</tspan></text><text x="28" y="609.6877" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="637.1997">able to continue over time without exhausting</tspan><tspan x="28" y="668.8747">resources</tspan></text><text x="28" y="715.9346999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="743.4467">maintainable; viable over time</tspan></text><text x="28" y="790.5066999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="818.0187">A sustainable routine leaves time for rest.</tspan></text><text x="28" y="865.0786999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="892.5907">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="924.2656999999999">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="955.9407">description rather than using it as a general</tspan><tspan x="28" y="987.6157">compliment.</tspan></text><text x="28" y="1034.6756999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1062.1876999999997">A: We managed an hour every evening this week.</tspan><tspan x="28" y="1093.8626999999997">B: But is that pace sustainable once work gets busy?</tspan><tspan x="28" y="1125.5376999999996">A: Probably not. Twenty minutes would be easier to</tspan><tspan x="28" y="1157.2126999999998">maintain.</tspan><tspan x="28" y="1188.8876999999998">B: Then let us build the routine around that.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">A learner studies three hours daily, becomes</tspan><tspan x="28" y="1317.667">exhausted and stops. Propose a more sustainable</tspan><tspan x="28" y="1349.3419999999999">arrangement. (Model: A shorter regular session with</tspan><tspan x="28" y="1381.017">time to rest would be easier to maintain.)</tspan></text></svg>