y="832.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="866.3199999999999">We factor in the time other people need.</tspan></text><text x="28" y="923.52" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="956.9599999999999">Keep the particle with the verb. Check a</tspan><tspan x="28" y="995.4599999999999">dictionary before changing its object or</tspan><tspan x="28" y="1033.96">word order.</tspan></text><text x="28" y="1091.1599999999999" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1124.6">A: How can we finish a task together?</tspan><tspan x="28" y="1163.1">B: We factor in the time other people need.</tspan><tspan x="28" y="1201.6">A: That gives us a starting point.</tspan><tspan x="28" y="1240.1">B: Let us try it together.</tspan></text><text x="28" y="1297.3" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1330.74">Explain “factor in” in your own words, then</tspan><tspan x="28" y="1369.24">use it in a sentence about working together.</tspan></text></svg>