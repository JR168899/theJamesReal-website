<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>forecast</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/02/24 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Dark clouds gather over a landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Dark clouds gather over a landscape.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="45.31" font-weight="700" fill="#382d2e"><tspan x="28" y="477.31">forecast</tspan></text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="516.2175">US /ˈfɔrˌkæst/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.67" font-weight="400" fill="#382d2e"><tspan x="28" y="543.9550999999999">Singular: forecast; plural: forecasts.</tspan></text><text x="28" y="598.9575" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="628.9015">a statement about what the weather is</tspan><tspan x="28" y="663.3765000000001">expected to be like</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">prediction; weather outlook</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">The forecast says it will rain this afternoon.</tspan></text><text x="28" y="876.9245" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8685">Keep the sense and countability shown in the</tspan><tspan x="28" y="941.3435000000001">example. Use a singular or plural form</tspan><tspan x="28" y="975.8185000000001">appropriate to the specific person, object or</tspan><tspan x="28" y="1010.2935">event being discussed.</tspan></text><text x="28" y="1061.5135" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1091.4575">Bella: What does the forecast say?</tspan><tspan x="28" y="1125.9325">Fenrir: Rain after three.</tspan><tspan x="28" y="1160.4075">Bella: Then shall we walk in the morning?</tspan><tspan x="28" y="1194.8825">Fenrir: That would give us a better chance of</tspan><tspan x="28" y="1229.3575">staying dry.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Use a forecast of rain after three to suggest</tspan><tspan x="28" y="1344.9965">when to take a walk. (Model: Let us walk in the</tspan><tspan x="28" y="1379.4715">morning, before the rain is expected.)</tspan></text></svg>