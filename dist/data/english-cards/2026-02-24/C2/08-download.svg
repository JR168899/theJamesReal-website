<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>We need the tonic of wildness</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/02/24 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Changing leaves mark the passing of seasons.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Changing leaves mark the passing of seasons.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2c3540"><tspan x="28" y="473.63">We need the tonic of wildness</tspan></text><text font-family="Arial, sans-serif" font-size="18.1" font-weight="400" fill="#2c3540"><tspan x="28" y="502.13750000000005">Henry David Thoreau · Walden, Spring · Published 1854</tspan></text><text x="28" y="551.9125" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="579.4245000000001">Time in untamed nature can refresh people who</tspan><tspan x="28" y="611.0995">spend much of life within familiar routines.</tspan></text><text x="28" y="658.1595" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="685.6715">Nature can restore our energy; Wild places can offer</tspan><tspan x="28" y="717.3465">renewal</tspan></text><text x="28" y="764.4064999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="791.9185">After a day indoors, we spend a quiet hour beside the</tspan><tspan x="28" y="823.5935">trees.</tspan></text><text x="28" y="870.6534999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="898.1655">This is an excerpt. Tonic means something that</tspan><tspan x="28" y="929.8404999999999">refreshes or restores, not a literal drink. The passage</tspan><tspan x="28" y="961.5155">contrasts familiar village life with the surrounding wild</tspan><tspan x="28" y="993.1904999999999">landscape.</tspan></text><text x="28" y="1040.2504999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1067.7624999999998">Sarah: What does tonic suggest in the passage?</tspan><tspan x="28" y="1099.4374999999998">Liam: Something that restores or refreshes us.</tspan><tspan x="28" y="1131.1124999999997">Sarah: Is the writer prescribing a particular medicine?</tspan><tspan x="28" y="1162.7875">Liam: No. The landscape is described as renewing</tspan><tspan x="28" y="1194.4624999999999">the person&#x27;s experience.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.992">How does tonic shape the way wildness is</tspan><tspan x="28" y="1317.667">presented? (Model: It presents contact with wildness</tspan><tspan x="28" y="1349.3419999999999">as refreshing or restorative rather than as literal</tspan><tspan x="28" y="1381.017">medicine.)</tspan></text></svg>