<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>evaluate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/09/05 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">evaluate</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /ɪˈvæljuˌeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">evaluate · evaluates · evaluated · evaluated · evaluating (base</tspan><tspan x="28" y="571.7974999999999">· third person · past · past participle · -ing)</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">to judge something carefully using relevant</tspan><tspan x="28" y="692.4313000000001">information</tspan></text><text x="28" y="744.1713" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="774.4193">assess; appraise</tspan></text><text x="28" y="826.1592999999999" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="856.4073">We evaluate the plan after trying it for a week.</tspan></text><text x="28" y="908.1473" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953">Use the verb in the sense shown in the</tspan><tspan x="28" y="973.2203000000001">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1008.0453">object; the word forms above show its changes.</tspan></text><text x="28" y="1059.7853" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0332999999998">Aoede: Did the new schedule work?</tspan><tspan x="28" y="1124.8582999999999">Echo: We need to evaluate more than whether</tspan><tspan x="28" y="1159.6833">it saved time.</tspan><tspan x="28" y="1194.5082999999997">Aoede: What else should we examine?</tspan><tspan x="28" y="1229.3332999999998">Echo: Whether people could participate and</tspan><tspan x="28" y="1264.1582999999998">which tasks were left unfinished.</tspan></text><text x="28" y="1315.8983" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1346.1462999999999">Suggest two criteria for evaluating a community</tspan><tspan x="28" y="1380.9713">workshop beyond attendance.</tspan></text></svg>