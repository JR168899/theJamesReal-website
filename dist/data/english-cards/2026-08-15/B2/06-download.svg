<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>leave no stone unturned</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B2 - 2026/08/15 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#383426"><tspan x="28" y="477.08">leave no stone unturned</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">try every reasonable possibility</tspan></text><text x="28" y="619.082" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="648.8740000000001">search exhaustively; explore every avenue</tspan></text><text x="28" y="699.834" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="729.6260000000001">We left no stone unturned while looking for a</tspan><tspan x="28" y="763.926">solution.</tspan></text><text x="28" y="814.886" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="844.6780000000001">A figurative expression for trying every</tspan><tspan x="28" y="878.9780000000001">reasonable avenue. Avoid using it to imply</tspan><tspan x="28" y="913.2780000000001">certainty about the result.</tspan></text><text x="28" y="964.2379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="994.0300000000001">A: Have we checked every source for the missing</tspan><tspan x="28" y="1028.3300000000002">record?</tspan><tspan x="28" y="1062.63">B: The archive, the old catalog and the local</tspan><tspan x="28" y="1096.93">collection.</tspan><tspan x="28" y="1131.23">A: Then we really have left no stone unturned.</tspan><tspan x="28" y="1165.5300000000002">B: We should still state that the record has not</tspan><tspan x="28" y="1199.8300000000002">been found.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Does leaving no stone unturned guarantee finding</tspan><tspan x="28" y="1323.772">an answer? Explain. (Model: No. It describes a</tspan><tspan x="28" y="1358.072">thorough search, not a guaranteed result.)</tspan></text></svg>