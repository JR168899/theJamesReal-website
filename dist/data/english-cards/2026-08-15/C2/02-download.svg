<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>asymmetry</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/08/15 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people discuss an issue face to face.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people discuss an issue face to face.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">asymmetry</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /eɪˈsɪmətri/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Singular: asymmetry; plural: asymmetries.</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">an imbalance or difference between corresponding</tspan><tspan x="28" y="641.0609999999999">parts</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">imbalance; lack of symmetry</tspan></text><text x="28" y="760.677" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="787.733">The discussion revealed an asymmetry between who</tspan><tspan x="28" y="818.8829999999999">planned the event and who did the work.</tspan></text><text x="28" y="865.163" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="892.2189999999999">Specify the unequal relation: asymmetry of</tspan><tspan x="28" y="923.3689999999999">information, power or resources.</tspan></text><text x="28" y="969.649" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="996.7049999999999">Sarah: Both sides signed, but did they negotiate on</tspan><tspan x="28" y="1027.855">equal terms?</tspan><tspan x="28" y="1059.0049999999999">Liam: There was a substantial asymmetry of</tspan><tspan x="28" y="1090.155">information.</tspan><tspan x="28" y="1121.3049999999998">Sarah: One party knew the likely costs and the other</tspan><tspan x="28" y="1152.455">did not?</tspan><tspan x="28" y="1183.605">Liam: Exactly. Formal agreement alone does not</tspan><tspan x="28" y="1214.7549999999999">remove that imbalance.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Explain an information asymmetry without assuming</tspan><tspan x="28" y="1319.2410000000002">that both parties know the same facts. (Model: One</tspan><tspan x="28" y="1350.391">party has relevant knowledge that the other lacks,</tspan><tspan x="28" y="1381.5410000000002">affecting their ability to judge the arrangement.)</tspan></text></svg>