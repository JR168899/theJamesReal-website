<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hunt</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/04/04 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Children search outdoors with baskets.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Children search outdoors with baskets.</tspan></text><a href="https://www.pexels.com/photo/content-diverse-girls-looking-for-easter-eggs-in-garden-7169576/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7169576</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">hunt</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /hʌnt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">hunt · hunts · hunted · hunted · hunting (base · third person ·</tspan><tspan x="28" y="574.6075000000001">past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to search carefully for something</tspan></text><text x="28" y="714.9210999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="745.7770999999999">search for; look for</tspan></text><text x="28" y="798.5570999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="829.4130999999999">The children hunt for decorated eggs in the</tspan><tspan x="28" y="864.9380999999998">garden.</tspan></text><text x="28" y="917.7180999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="948.5740999999999">Use the verb in the sense shown in the</tspan><tspan x="28" y="984.0990999999999">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1019.6241">object; the word forms above show its changes.</tspan></text><text x="28" y="1072.4041" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1103.2601">A: Where does the egg hunt start?</tspan><tspan x="28" y="1138.7851">B: By the gate.</tspan><tspan x="28" y="1174.3101">A: Can the children look behind the shed?</tspan><tspan x="28" y="1209.8351">B: No. That area is outside the game.</tspan></text><text x="28" y="1262.6151" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1293.4711">Give a clear boundary for an egg hunt. (Model:</tspan><tspan x="28" y="1328.9961">Please search inside the marked garden and</tspan><tspan x="28" y="1364.5211">do not go behind the shed.)</tspan></text></svg>