<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What do you enjoy doing with someone who has cared for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/06/18 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#353331"><tspan x="28" y="477.08">What do you enjoy doing</tspan><tspan x="28" y="533.43">with someone who has</tspan><tspan x="28" y="589.78">cared for you?</tspan></text><text x="28" y="651.0299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="680.822">An opening that invites a personal preference or</tspan><tspan x="28" y="715.122">experience without assuming everyone shares it.</tspan></text><text x="28" y="766.0819999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="795.874">What do you enjoy doing with someone who has</tspan><tspan x="28" y="830.174">cared for you?</tspan></text><text x="28" y="881.1339999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="910.926">Follow the answer with a related question. Accept</tspan><tspan x="28" y="945.226">a different preference or a declined invitation</tspan><tspan x="28" y="979.5260000000001">without asking the person to justify it.</tspan></text><text x="28" y="1030.4859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1060.278">A: Have you chosen a Father&#x27;s Day activity?</tspan><tspan x="28" y="1094.578">B: We are going for a short walk.</tspan><tspan x="28" y="1128.878">A: Does he enjoy long routes?</tspan><tspan x="28" y="1163.178">B: No, so we will stay near home and stop for</tspan><tspan x="28" y="1197.478">tea.</tspan><tspan x="28" y="1231.778">A: A familiar route can leave more space to talk.</tspan><tspan x="28" y="1266.078">B: That is what we are looking forward to.</tspan></text><text x="28" y="1317.038" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#353331"><tspan x="28" y="1346.83">Suggest a shared activity for someone who</tspan><tspan x="28" y="1381.1299999999999">enjoys conversation but prefers not to walk far.</tspan></text></svg>