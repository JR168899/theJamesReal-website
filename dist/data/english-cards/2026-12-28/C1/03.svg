<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/12/28 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A budget helps someone allow for costs and limits.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A budget helps someone allow for costs and limits.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#3d3028"><tspan x="28" y="477.08">factor something in</tspan><tspan x="28" y="533.43">factor in something</tspan></text><text x="28" y="594.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="624.4720000000001">include something when making a judgement</tspan></text><text x="28" y="675.4319999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="705.224">allow for; take into account</tspan></text><text x="28" y="756.1839999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="785.976">We factor in the time other people need.</tspan></text><text x="28" y="836.9359999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="866.728">Keep the particle with the verb. Check a</tspan><tspan x="28" y="901.0279999999999">dictionary before changing its object or word</tspan><tspan x="28" y="935.328">order.</tspan></text><text x="28" y="986.2879999999998" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1016.0799999999999">A: How can we make a realistic plan?</tspan><tspan x="28" y="1050.3799999999999">B: We factor in the time other people need.</tspan><tspan x="28" y="1084.6799999999998">A: That gives us a starting point.</tspan><tspan x="28" y="1118.98">B: Let us try it together.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#3d3028"><tspan x="28" y="1289.472">Review without reading the example first. Explain</tspan><tspan x="28" y="1323.772">“factor in” in your own words, then use it in a</tspan><tspan x="28" y="1358.072">sentence about looking back and looking ahead.</tspan></text></svg>