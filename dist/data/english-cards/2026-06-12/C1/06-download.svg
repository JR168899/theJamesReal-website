<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a double-edged sword</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/06/12 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A phone offers useful tools but can also interrupt concentration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A phone offers useful tools but can also interrupt concentration.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#383426"><tspan x="28" y="470.41">a double-edged sword</tspan></text><text x="28" y="522.5975" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="547.9815">something with both benefits and disadvantages</tspan></text><text x="28" y="591.4015" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="616.7855000000001">a mixed blessing; an advantage with a downside</tspan></text><text x="28" y="660.2055" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="685.5895">A fixed routine can be a double-edged sword.</tspan></text><text x="28" y="729.0095" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="754.3935">Learn the whole expression. It is figurative language, so a</tspan><tspan x="28" y="783.6185">word-for-word interpretation may be misleading.</tspan></text><text x="28" y="827.0385" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="852.4225">A: How would you express this idea?</tspan><tspan x="28" y="881.6475">B: a double-edged sword</tspan><tspan x="28" y="910.8725000000001">A: What does that mean here?</tspan><tspan x="28" y="940.0975000000001">B: something with both benefits and disadvantages</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1282.7440000000001">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1311.969">What does “a double-edged sword” mean in this example?</tspan><tspan x="28" y="1341.1940000000002">A fixed routine can be a double-edged sword. (Model:</tspan><tspan x="28" y="1370.419">Something with both benefits and disadvantages.)</tspan></text></svg>