<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/05/15 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="475.47">bear something out</tspan><tspan x="28" y="529.8075">bear out something</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="617.5980000000001">support or confirm a claim</tspan></text><text x="28" y="666.7379999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="695.466">corroborate; substantiate</tspan></text><text x="28" y="744.6059999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="773.334">The experience did not bear out our initial</tspan><tspan x="28" y="806.409">assumption.</tspan></text><text x="28" y="855.5489999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="884.2769999999999">Keep the particle with the verb. Check a dictionary</tspan><tspan x="28" y="917.352">before changing its object or word order.</tspan></text><text x="28" y="966.4919999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="995.2199999999999">A: How can we change our plans?</tspan><tspan x="28" y="1028.2949999999998">B: The experience did not bear out our initial</tspan><tspan x="28" y="1061.37">assumption.</tspan><tspan x="28" y="1094.445">A: That gives us a starting point.</tspan><tspan x="28" y="1127.52">B: Let us try it together.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1287.848">Explain the meaning before looking at the model</tspan><tspan x="28" y="1320.923">answer. Explain “bear out” in your own words, then</tspan><tspan x="28" y="1353.998">use it in a sentence about plans for a rainy day.</tspan></text></svg>