<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Present simple</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - A1 - 2026/01/21 - 01 - Grammar</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A morning routine provides a context for describing repeated actions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A morning routine provides a context for describing repeated actions.</tspan></text><a href="https://www.pexels.com/photo/sleepy-woman-waking-up-on-bed-in-morning-7622509/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7622509</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#382f40"><tspan x="28" y="482.0">Present simple</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="584.04">Use the base verb after I, you, we and they.</tspan><tspan x="28" y="622.54">Add -s or -es after he, she and it.</tspan></text><text x="28" y="679.74" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="713.18">We make a plan. She makes a plan.</tspan></text><text x="28" y="770.38" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="803.8199999999999">Read the example together with the rule.</tspan><tspan x="28" y="842.3199999999999">Notice the verb form and keep the same</tspan><tspan x="28" y="880.8199999999999">pattern in your own sentence.</tspan></text><text x="28" y="938.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="971.4599999999999">A: Could you give me an example?</tspan><tspan x="28" y="1009.9599999999999">B: We make a plan. She makes a plan.</tspan><tspan x="28" y="1048.46">A: Which pattern does that use?</tspan><tspan x="28" y="1086.96">B: Use the base verb after I, you, we and</tspan><tspan x="28" y="1125.46">they. Add -s or -es after he, she and it.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#382f40"><tspan x="28" y="1295.04">Try without help. Choose: She make /</tspan><tspan x="28" y="1333.54">makes a plan. (Model: makes)</tspan></text></svg>