<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discern</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/01/24 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold a collection of books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold a collection of books.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">discern</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /dɪˈsɝn/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">discern · discerns · discerned · discerned · discerning (base ·</tspan><tspan x="28" y="564.7724999999999">third person · past · past participle · -ing)</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">to recognise a detail or difference that is not</tspan><tspan x="28" y="679.3443000000002">immediately obvious</tspan></text><text x="28" y="728.4843000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="757.2123000000001">perceive; distinguish</tspan></text><text x="28" y="806.3523000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="835.0803000000002">With careful listening, we can discern a second</tspan><tspan x="28" y="868.1553000000002">melody.</tspan></text><text x="28" y="917.2953000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="946.0233000000002">Use the verb in the sense shown in the exchange.</tspan><tspan x="28" y="979.0983000000002">Notice the subject, tense and any object; the word</tspan><tspan x="28" y="1012.1733000000002">forms above show its changes.</tspan></text><text x="28" y="1061.3133" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0413">A: Can you discern a change in the narrator&#x27;s tone?</tspan><tspan x="28" y="1123.1163000000001">B: The last paragraph is much less confident.</tspan><tspan x="28" y="1156.1913000000002">A: Which words give that impression?</tspan><tspan x="28" y="1189.2663">B: The repeated perhaps and the unanswered</tspan><tspan x="28" y="1222.3413">questions.</tspan></text><text x="28" y="1271.4813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1300.2093">Name two textual clues that could help someone</tspan><tspan x="28" y="1333.2843">discern uncertainty. (Model: Hedging words such as</tspan><tspan x="28" y="1366.3593">perhaps and questions left unanswered.)</tspan></text></svg>