<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Small things can help.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/11/11 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small things can help.</title><desc>Original family-manga illustration: hand, related to Small things can help..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-65 36L-38 12L-2 12L24-7Q42-17 43-1L18 26H52Q73 24 72 38L27 62H-18L-42 77" fill="#d5ad8e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="41.86" font-weight="700" fill="#2c3540"><tspan x="28" y="473.86">Small things can help.</tspan></text><text x="28" y="530.7349999999999" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="558.399">A simple action can make a task easier or improve</tspan><tspan x="28" y="590.249">someone’s situation.</tspan></text><text x="28" y="637.569" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="665.2330000000001">Little actions can make a difference.; Even a small</tspan><tspan x="28" y="697.0830000000001">effort can be useful.</tspan></text><text x="28" y="744.403" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="772.0670000000001">For example, we ask how long the bread will keep</tspan><tspan x="28" y="803.9170000000001">before deciding how much to buy.</tspan></text><text x="28" y="851.2370000000001" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="878.9010000000002">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="910.7510000000002">to a specific action in the example, and explain why</tspan><tspan x="28" y="942.6010000000002">you agree or disagree.</tspan></text><text x="28" y="989.921" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="1017.5850000000002">A: What did we learn from that experience?</tspan><tspan x="28" y="1049.4350000000002">B: Small things can help.</tspan><tspan x="28" y="1081.285">A: What do you mean?</tspan><tspan x="28" y="1113.1350000000002">B: A simple action can make a task easier or improve</tspan><tspan x="28" y="1144.9850000000001">someone’s situation.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.56" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.48" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.224">Read, then answer. Which action in today’s topic</tspan><tspan x="28" y="1318.0739999999998">illustrates this reflection? (Model: We ask how long</tspan><tspan x="28" y="1349.924">the bread will keep before deciding how much to buy.)</tspan></text></svg>