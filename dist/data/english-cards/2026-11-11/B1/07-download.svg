"730.9599999999999">A: How should we buy what we need?</tspan><tspan x="28" y="758.9599999999999">B: Let me check that I understand.</tspan></text><text x="28" y="800.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="824.8799999999999">Use this phrase in a friendly conversation. Listen to the reply</tspan><tspan x="28" y="852.8799999999999">before asking your next question.</tspan></text><text x="28" y="894.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="918.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="946.7999999999998">B: Let me check that I understand.</tspan><tspan x="28" y="974.7999999999998">A: What does that mean here?</tspan><tspan x="28" y="1002.7999999999998">B: A useful way to keep an everyday conversation clear and</tspan><tspan x="28" y="1030.7999999999997">considerate.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">Explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1309.1200000000001">When might you say “Let me check that I understand.”?</tspan><tspan x="28" y="1337.1200000000001">(Model: You could say it at a neighbourhood market, when you</tspan><tspan x="28" y="1365.1200000000001">want to ask for help or make your understanding clear.)</tspan></text></svg>