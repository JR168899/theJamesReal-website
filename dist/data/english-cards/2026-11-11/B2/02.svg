<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>durable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/11/11 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>durable</title><desc>Original family-manga illustration: fabric, related to durable.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-62-61Q-31-48 0-61Q31-75 62-61V60Q31 45 0 60Q-31 76-62 60Z" fill="#bca5ad"/><path d="M-45-50V62M-23-50V65M0-59V59M23-63V48M45-63V51M-62-30Q0-9 62-30M-62 0Q0 21 62 0M-62 31Q0 51 62 31"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.08" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">durable</tspan></text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="515.79">US /ˈdʊrəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.56" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">Adjective. Learn the word in the sense shown below.</tspan></text><text x="28" y="598.1099999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="627.902">able to remain in good condition for a long time</tspan></text><text x="28" y="678.8619999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="708.654">long-lasting; hard-wearing</tspan></text><text x="28" y="759.6139999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="789.406">A durable bag can be repaired and used for</tspan><tspan x="28" y="823.7059999999999">years.</tspan></text><text x="28" y="874.6659999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="904.4579999999999">Topic: Choosing with care. Write one sentence</tspan><tspan x="28" y="938.7579999999998">using this word. Check that your sentence keeps</tspan><tspan x="28" y="973.0579999999999">the meaning shown above.</tspan></text><text x="28" y="1024.0179999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1053.81">A: What does “durable” mean?</tspan><tspan x="28" y="1088.11">B: It means able to remain in good condition for a</tspan><tspan x="28" y="1122.4099999999999">long time.</tspan><tspan x="28" y="1156.71">A: Can we use it at a neighbourhood market?</tspan><tspan x="28" y="1191.01">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Explain the meaning before looking at the model</tspan><tspan x="28" y="1323.772">answer. Which word means “able to remain in</tspan><tspan x="28" y="1358.072">good condition for a long time”: durable or value?</tspan></text></svg>