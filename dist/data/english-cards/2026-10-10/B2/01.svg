<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>hospitality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/10/10 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A host serves food at a table.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A host serves food at a table.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">hospitality</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /ˌhɑspɪˈtæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">Usually uncountable: hospitality; no regular plural in this</tspan><tspan x="28" y="566.88">sense.</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">friendly and generous treatment of guests</tspan></text><text x="28" y="699.5904" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="728.7744">warm welcome; generous treatment of guests</tspan></text><text x="28" y="778.6944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="807.8784">Thank you for your hospitality and the lovely</tspan><tspan x="28" y="841.4784000000001">meal.</tspan></text><text x="28" y="891.3984000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="920.5824000000001">Keep the sense and countability shown in the</tspan><tspan x="28" y="954.1824000000001">example. Use a singular or plural form</tspan><tspan x="28" y="987.7824000000002">appropriate to the specific person, object or event</tspan><tspan x="28" y="1021.3824000000002">being discussed.</tspan></text><text x="28" y="1071.3024" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1100.4864000000002">A: I was worried about arriving so late.</tspan><tspan x="28" y="1134.0864000000001">B: You were still welcome. Hospitality does not</tspan><tspan x="28" y="1167.6864000000003">end at eight.</tspan><tspan x="28" y="1201.2864000000002">A: Even after everyone had eaten?</tspan><tspan x="28" y="1234.8864000000003">B: We kept a plate for you and made some tea.</tspan></text><text x="28" y="1284.8064" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1313.9904000000001">Which demonstrates hospitality more clearly: an</tspan><tspan x="28" y="1347.5904">expensive room or making a late guest feel</tspan><tspan x="28" y="1381.1904000000002">welcome? Explain.</tspan></text></svg>