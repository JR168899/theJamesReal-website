<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/10/10 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together outdoors.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="37.95" font-weight="700" fill="#2c3540"><tspan x="28" y="469.95">There is nothing in the world so</tspan><tspan x="28" y="517.3875">irresistibly contagious as</tspan><tspan x="28" y="564.825">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="16.5" font-weight="400" fill="#2c3540"><tspan x="28" y="590.8125">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="636.1875" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="661.2674999999999">A cheerful mood can spread from one person to others.</tspan></text><text x="28" y="704.1675" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="729.2475">Laughter can spread through a group; Good spirits can</tspan><tspan x="28" y="758.1225">influence the people nearby</tspan></text><text x="28" y="801.0225" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="826.1025">One guest starts laughing at a gentle joke, and soon the</tspan><tspan x="28" y="854.9775">whole table is smiling.</tspan></text><text x="28" y="897.8775" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="922.9575">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="951.8325">spreading, rather than an infection. The original spelling</tspan><tspan x="28" y="980.7075">good-humour is retained.</tspan></text><text x="28" y="1023.6075000000001" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1048.6875">Sky: Why does the narrator describe laughter as</tspan><tspan x="28" y="1077.5625">contagious?</tspan><tspan x="28" y="1106.4375">Michael: Because one person&#x27;s laughter can draw others</tspan><tspan x="28" y="1135.3125">into it.</tspan><tspan x="28" y="1164.1875">Sky: Is the line a medical claim?</tspan><tspan x="28" y="1193.0625">Michael: No. It is a literary comparison about a shared</tspan><tspan x="28" y="1221.9375">mood.</tspan></text><text x="28" y="1264.8375" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1289.9175">Explain contagious figuratively here, without presenting</tspan><tspan x="28" y="1318.7925">laughter as an illness. (Model: Laughter can spread</tspan><tspan x="28" y="1347.6675">between people as a shared response; contagious is a</tspan><tspan x="28" y="1376.5425">metaphor.)</tspan></text></svg>