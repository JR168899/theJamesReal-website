<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>A conversation worth having</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/02/02 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/women-sitting-while-having-conversation-at-the-cafe-9811867/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 9811867</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">A conversation worth having</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="169.0">I like to listen to a friend. Two small things help me.</tspan></text><text x="42" y="202.44" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="239.44">First, we ask our friend a question. We wait and listen.</tspan></text><text x="42" y="272.88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="309.88">Next, we say what we understand. Our friend can tell us if we are</tspan><tspan x="42" y="347.32">wrong.</tspan></text><text x="42" y="380.76" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="417.76">These two things help us. We can listen to a friend and enjoy our time</tspan><tspan x="42" y="455.2">together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="506.64">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="528.6">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="550.56">argument rather than introduce a new proposal.</tspan><tspan x="42" y="572.52">You want to listen to a friend, but one thing is difficult. Say what it is and give two ways to help. Use four short paragraphs:</tspan><tspan x="42" y="594.48">introduction, two developed points, and conclusion.</tspan></text></svg>