<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>brevity is the soul of wit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/02/02 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A notebook provides space to record a thought.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A notebook provides space to record a thought.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="477.08">brevity is the soul of wit</tspan></text><text font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#2c3540"><tspan x="28" y="507.95000000000005">William Shakespeare · Hamlet, Act II, Scene 2 (First Folio) ·</tspan><tspan x="28" y="531.8620000000001">Published 1623</tspan></text><text x="28" y="585.3699999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="615.162">Expressing an idea briefly can make it more</tspan><tspan x="28" y="649.462">effective or clever.</tspan></text><text x="28" y="700.4219999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="730.214">Concise expression can be powerful; Wit often</tspan><tspan x="28" y="764.514">benefits from economy</tspan></text><text x="28" y="815.4739999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="845.2660000000001">Instead of repeating the explanation, I give one</tspan><tspan x="28" y="879.566">clear sentence and wait for a reply.</tspan></text><text x="28" y="930.526" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="960.3180000000001">This is an excerpt from a speech by Polonius. His</tspan><tspan x="28" y="994.618">lengthy speech creates irony, so the dramatic</tspan><tspan x="28" y="1028.9180000000001">context matters. The date refers to the First Folio</tspan><tspan x="28" y="1063.218">publication.</tspan></text><text x="28" y="1114.178" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1143.97">A: Is the message long?</tspan><tspan x="28" y="1178.27">B: Very long.</tspan><tspan x="28" y="1212.57">A: Could it be shorter and still clear?</tspan><tspan x="28" y="1246.8700000000001">B: Yes. We can remove the repeated information.</tspan></text><text x="28" y="1297.8300000000002" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1327.622">Make this shorter: Please meet me at ten o&#x27;clock,</tspan><tspan x="28" y="1361.922">which is the time of our meeting.</tspan></text></svg>