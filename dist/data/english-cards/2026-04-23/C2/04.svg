<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/04/23 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple workspace leaves room for a single task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple workspace leaves room for a single task.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#3d3028"><tspan x="28" y="480.3">dispense with</tspan></text><text x="28" y="545.925" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="577.845">manage without something unnecessary</tspan></text><text x="28" y="632.4449999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="664.365">do without; forgo</tspan></text><text x="28" y="718.9649999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="750.885">We can dispense with a rule that serves no</tspan><tspan x="28" y="787.635">useful purpose.</tspan></text><text x="28" y="842.2349999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="874.155">Dispense with is inseparable: dispense with it.</tspan><tspan x="28" y="910.905">It means manage without or remove something</tspan><tspan x="28" y="947.655">regarded as unnecessary.</tspan></text><text x="28" y="1002.2549999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1034.175">Sarah: Do we need another approval form?</tspan><tspan x="28" y="1070.925">Liam: If it serves no useful purpose, we can</tspan><tspan x="28" y="1107.675">dispense with it.</tspan><tspan x="28" y="1144.425">Sarah: Would that remove the safety check</tspan><tspan x="28" y="1181.175">too?</tspan><tspan x="28" y="1217.925">Liam: No. We should remove duplication, not</tspan><tspan x="28" y="1254.675">the check itself.</tspan></text><text x="28" y="1309.2749999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1341.195">Distinguish dispensing with a duplicate form</tspan><tspan x="28" y="1377.945">from abandoning an essential check.</tspan></text></svg>