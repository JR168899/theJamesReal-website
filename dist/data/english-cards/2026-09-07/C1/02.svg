<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sustainable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/09/07 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">sustainable</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /səˈsteɪnəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">sustainable · more sustainable · most sustainable; noun:</tspan><tspan x="28" y="564.7724999999999">sustainability</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">able to continue over time without exhausting</tspan><tspan x="28" y="679.3443000000002">resources</tspan></text><text x="28" y="728.4843000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="757.2123000000001">maintainable; viable over time</tspan></text><text x="28" y="806.3523000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="835.0803000000002">A sustainable routine leaves time for rest.</tspan></text><text x="28" y="884.2203000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="912.9483000000001">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="946.0233000000002">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="979.0983000000001">description rather than using it as a general</tspan><tspan x="28" y="1012.1733000000002">compliment.</tspan></text><text x="28" y="1061.3133" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0413">A: We managed an hour every evening this week.</tspan><tspan x="28" y="1123.1163000000001">B: But is that pace sustainable once work gets busy?</tspan><tspan x="28" y="1156.1913000000002">A: Probably not. Twenty minutes would be easier to</tspan><tspan x="28" y="1189.2663">maintain.</tspan><tspan x="28" y="1222.3413">B: Then let us build the routine around that.</tspan></text><text x="28" y="1271.4813" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1300.2093">A learner studies three hours daily, becomes</tspan><tspan x="28" y="1333.2843">exhausted and stops. Propose a more sustainable</tspan><tspan x="28" y="1366.3593">arrangement.</tspan></text></svg>