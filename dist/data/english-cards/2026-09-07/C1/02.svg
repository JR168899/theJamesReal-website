<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sustainable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/09/07 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="42.550000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="474.55">sustainable</tspan></text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="511.0875">US /səˈsteɪnəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.35" font-weight="400" fill="#382d2e"><tspan x="28" y="537.1355">sustainable · more sustainable · most sustainable; noun:</tspan><tspan x="28" y="561.9625">sustainability</tspan></text><text x="28" y="613.6144999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.7344999999999">able to continue over time without exhausting</tspan><tspan x="28" y="674.1094999999999">resources</tspan></text><text x="28" y="722.2094999999999" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="750.3294999999999">maintainable; viable over time</tspan></text><text x="28" y="798.4295" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="826.5495">A sustainable routine leaves time for rest.</tspan></text><text x="28" y="874.6495" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="902.7695">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="935.1445">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="967.5195">description rather than using it as a general</tspan><tspan x="28" y="999.8945">compliment.</tspan></text><text x="28" y="1047.9945" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1076.1145000000001">Kore: We managed an hour every evening this week.</tspan><tspan x="28" y="1108.4895000000001">Onyx: But is that pace sustainable once work gets</tspan><tspan x="28" y="1140.8645000000001">busy?</tspan><tspan x="28" y="1173.2395000000001">Kore: Probably not. Twenty minutes would be easier</tspan><tspan x="28" y="1205.6145000000001">to maintain.</tspan><tspan x="28" y="1237.9895000000001">Onyx: Then let us build the routine around that.</tspan></text><text x="28" y="1286.0895" font-family="Arial, sans-serif" font-size="14.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1314.2095000000002">A learner studies three hours daily, becomes</tspan><tspan x="28" y="1346.5845000000002">exhausted and stops. Propose a more sustainable</tspan><tspan x="28" y="1378.9595000000002">arrangement.</tspan></text></svg>