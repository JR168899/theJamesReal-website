<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get ready</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/01/11 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A coat hangs ready to be worn.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A coat hangs ready to be worn.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-arranging-clothes-8580761/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8580761</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="473.86">get ready</tspan></text><text x="28" y="530.7349999999999" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="558.399">prepare yourself</tspan></text><text x="28" y="605.719" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="633.383">prepare; make preparations</tspan></text><text x="28" y="680.703" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="708.3670000000001">We get ready before we leave.</tspan></text><text x="28" y="755.6870000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="783.3510000000001">Get ready describes preparing yourself; be ready</tspan><tspan x="28" y="815.2010000000001">describes the state after preparation.</tspan></text><text x="28" y="862.5210000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="890.1850000000002">A: Are you ready to leave?</tspan><tspan x="28" y="922.0350000000002">B: Not yet. I need to get ready.</tspan><tspan x="28" y="953.8850000000002">A: What do you still need?</tspan><tspan x="28" y="985.7350000000001">B: My coat and my keys.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1286.224">You have your shoes on but cannot find your keys.</tspan><tspan x="28" y="1318.0739999999998">Say what you still need to do before leaving. (Model: I</tspan><tspan x="28" y="1349.924">still need to find my keys before I am ready to leave.)</tspan></text></svg>