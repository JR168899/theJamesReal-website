<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/01/11 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A visual explanation can help people check a shared understanding.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A visual explanation can help people check a shared understanding.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2d382e"><tspan x="28" y="473.63">Let me check that I</tspan><tspan x="28" y="525.6675">understand.</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="609.7420000000001">A way to confirm your understanding before</tspan><tspan x="28" y="641.417">continuing a conversation.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="715.989">Let me make sure I have this right.; Can I confirm</tspan><tspan x="28" y="747.664">what you mean?</tspan></text><text x="28" y="794.7239999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="822.236">A: How should we plan a short trip?</tspan><tspan x="28" y="853.911">B: Let me check that I understand.</tspan></text><text x="28" y="900.9709999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="928.483">Use this phrase in a friendly conversation. Listen to</tspan><tspan x="28" y="960.1579999999999">the reply before asking your next question.</tspan></text><text x="28" y="1007.2179999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1034.7299999999998">A: How would you express this idea?</tspan><tspan x="28" y="1066.4049999999997">B: Let me check that I understand.</tspan><tspan x="28" y="1098.0799999999997">A: What does that mean here?</tspan><tspan x="28" y="1129.7549999999999">B: A way to confirm your understanding before</tspan><tspan x="28" y="1161.4299999999998">continuing a conversation.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2d382e"><tspan x="28" y="1285.992">Compare your first answer with this question: When</tspan><tspan x="28" y="1317.667">might you say “Let me check that I understand.”?</tspan><tspan x="28" y="1349.3419999999999">(Model: You could say it on a journey, when you want</tspan><tspan x="28" y="1381.017">to ask for help or make your understanding clear.)</tspan></text></svg>