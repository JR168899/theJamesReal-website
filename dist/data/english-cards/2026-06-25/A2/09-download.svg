<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Going to for plans</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - A2 - 2026/06/25 - Grammar - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person records a plan on a calendar.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person records a plan on a calendar.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382f40"><tspan x="28" y="473.63">Going to for plans</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="557.7045">Use am, is or are + going to + base verb for an</tspan><tspan x="28" y="589.3795">intended future action.</tspan></text><text x="28" y="636.4395" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="663.9515">We are going to make a plan.</tspan></text><text x="28" y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="738.5235">Use am, is or are + going to + base verb for an</tspan><tspan x="28" y="770.1985">intended action. Match be to the subject; do not</tspan><tspan x="28" y="801.8735">change the main verb.</tspan></text><text x="28" y="848.9335" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="876.4455">A: What are you going to do on Saturday?</tspan><tspan x="28" y="908.1205">B: I am going to visit the museum.</tspan><tspan x="28" y="939.7955000000001">A: Is your brother coming?</tspan><tspan x="28" y="971.4705">B: Yes. We are going to meet at the entrance.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382f40"><tspan x="28" y="1285.992">Your friend has already decided to visit the museum.</tspan><tspan x="28" y="1317.667">Complete: She ___ going to visit it. We ___ going to</tspan><tspan x="28" y="1349.3419999999999">meet her. (Model: She is going to visit it. We are</tspan><tspan x="28" y="1381.017">going to meet her.)</tspan></text></svg>