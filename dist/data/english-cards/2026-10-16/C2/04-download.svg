<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/10/16 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">dispense with</tspan></text><text x="28" y="514.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="537.236">manage without something unnecessary</tspan></text><text x="28" y="575.716" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="598.212">do without; forgo</tspan></text><text x="28" y="636.692" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="659.188">We can dispense with a rule that serves no useful purpose.</tspan></text><text x="28" y="697.668" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="720.164">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="746.064">changing its object or word order.</tspan></text><text x="28" y="784.544" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="807.04">A: How can we plan a short trip?</tspan><tspan x="28" y="832.9399999999999">B: We can dispense with a rule that serves no useful purpose.</tspan><tspan x="28" y="858.8399999999999">A: That gives us a starting point.</tspan><tspan x="28" y="884.74">B: Let us try it together.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1278.336">Compare your first answer with this question: Explain</tspan><tspan x="28" y="1304.236">“dispense with” in your own words, then use it in a sentence</tspan><tspan x="28" y="1330.136">about a journey with room to spare. (Model: It means to</tspan><tspan x="28" y="1356.036">manage without something unnecessary. Example: We can</tspan><tspan x="28" y="1381.936">dispense with a rule that serves no useful purpose.)</tspan></text></svg>