<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>subsidiarity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/12/06 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">subsidiarity</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /səbˌsɪdiˈɛrəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Usually uncountable: subsidiarity; no regular plural in this sense.</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">the principle that a matter should be handled at the</tspan><tspan x="28" y="641.0609999999999">most local competent level</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">local decision-making principle; responsibility at the</tspan><tspan x="28" y="745.5469999999999">appropriate local level</tspan></text><text x="28" y="791.827" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="818.8829999999999">Subsidiarity allows local teams to make decisions</tspan><tspan x="28" y="850.0329999999999">they are equipped to handle.</tspan></text><text x="28" y="896.313" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="923.3689999999999">Decisions at the lowest appropriate level, taking</tspan><tspan x="28" y="954.5189999999999">capacity and wider responsibilities into account.</tspan></text><text x="28" y="1000.799" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1027.855">A: Must the central office approve every garden</tspan><tspan x="28" y="1059.005">purchase?</tspan><tspan x="28" y="1090.155">B: Subsidiarity suggests decisions should stay at the</tspan><tspan x="28" y="1121.305">lowest appropriate level.</tspan><tspan x="28" y="1152.455">A: Provided that level has the capacity?</tspan><tspan x="28" y="1183.605">B: Yes. Local control is not a reason to withhold</tspan><tspan x="28" y="1214.755">necessary support.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Does subsidiarity require every decision to be made</tspan><tspan x="28" y="1319.2410000000002">locally regardless of capacity? Explain. (Model: No. It</tspan><tspan x="28" y="1350.391">favors the lowest appropriate level while recognizing</tspan><tspan x="28" y="1381.5410000000002">competence, support and wider responsibilities.)</tspan></text></svg>