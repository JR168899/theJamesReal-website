<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>delegate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/12/06 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>delegate</title><desc>Original family-manga illustration: desk, related to delegate.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-79 13H79V28H-79ZM-60 28V73M60 28V73M-35-46H40V2H-35ZM-46 7H51" fill="#7fc4ef"/><path d="M52-7L67-30M67-30L82-21M67-30V-56"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">delegate</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ˈdɛləˌɡeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Verb. Learn the word in the sense shown below.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">to give a task and appropriate responsibility to</tspan><tspan x="28" y="644.5845">another person</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">assign; entrust</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">We delegate one task to each volunteer.</tspan></text><text x="28" y="840.7885" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="868.3005">Topic: Working together. Write one sentence using</tspan><tspan x="28" y="899.9755">this word. Check that your sentence keeps the</tspan><tspan x="28" y="931.6505000000001">meaning shown above.</tspan></text><text x="28" y="978.7105" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1006.2225000000001">A: What does “delegate” mean?</tspan><tspan x="28" y="1037.8975">B: It means to give a task and appropriate</tspan><tspan x="28" y="1069.5725">responsibility to another person.</tspan><tspan x="28" y="1101.2475000000002">A: Can we use it during a shared project?</tspan><tspan x="28" y="1132.9225000000001">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Apply the idea to a real situation, then answer: Which</tspan><tspan x="28" y="1317.667">word means “to give a task and appropriate</tspan><tspan x="28" y="1349.3419999999999">responsibility to another person”: delegate or</tspan><tspan x="28" y="1381.017">interdependence? (Model: delegate)</tspan></text></svg>