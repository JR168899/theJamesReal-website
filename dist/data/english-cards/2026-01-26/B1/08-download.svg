<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Reading maketh a full man; conference a ready man; and writing an exact man.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/01/26 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Reference books are arranged together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Reference books are arranged together.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#2c3540"><tspan x="28" y="470.41">Reading maketh a full man;</tspan><tspan x="28" y="518.4225">conference a ready man; and</tspan><tspan x="28" y="566.4350000000001">writing an exact man.</tspan></text><text font-family="Arial, sans-serif" font-size="16.700000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="592.7375000000001">Francis Bacon · Of Studies, Essays (1625 edition) · Published 1625</tspan></text><text x="28" y="638.6625" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="664.0465">Reading builds knowledge, discussion develops</tspan><tspan x="28" y="693.2715000000001">readiness, and writing encourages precision.</tspan></text><text x="28" y="736.6915" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="762.0755">Read to learn, discuss to respond, and write to be precise;</tspan><tspan x="28" y="791.3005">Different forms of study develop different abilities</tspan></text><text x="28" y="834.7205" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="860.1045">We read the passage, discuss an interpretation, and write</tspan><tspan x="28" y="889.3295">a precise summary.</tspan></text><text x="28" y="932.7495" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="958.1335">Maketh means makes; conference here means</tspan><tspan x="28" y="987.3585">discussion. The historical use of man is retained in the</tspan><tspan x="28" y="1016.5835000000001">quotation. These claims describe an educational ideal.</tspan></text><text x="28" y="1060.0035" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1085.3875000000003">Sky: Does conference mean a large formal event here?</tspan><tspan x="28" y="1114.6125000000002">Michael: It refers to discussion or conversation.</tspan><tspan x="28" y="1143.8375000000003">Sky: Then the three activities develop different capacities?</tspan><tspan x="28" y="1173.0625000000002">Michael: That is the contrast: reading, discussion and</tspan><tspan x="28" y="1202.2875000000004">careful writing.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1282.7440000000001">In this quotation, distinguish the older sense of conference</tspan><tspan x="28" y="1311.969">from a modern conference venue. (Model: Conference</tspan><tspan x="28" y="1341.1940000000002">refers to discussion, not specifically to a large organized</tspan><tspan x="28" y="1370.419">event or its building.)</tspan></text></svg>