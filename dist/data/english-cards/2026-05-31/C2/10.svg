<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually explore a neighbourhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/05/31 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets form a city neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets form a city neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="47.84" font-weight="700" fill="#353331"><tspan x="28" y="479.84000000000003">How do you usually</tspan><tspan x="28" y="539.64">explore a neighbourhood?</tspan></text><text x="28" y="604.64" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="636.256">An open question that invites a person to</tspan><tspan x="28" y="672.656">describe a familiar experience.</tspan></text><text x="28" y="726.736" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="758.352">How do you usually explore a neighbourhood?</tspan></text><text x="28" y="812.432" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="844.048">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="880.448">answer, then ask a related follow-up.</tspan></text><text x="28" y="934.528" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="966.144">A: How do you usually explore a</tspan><tspan x="28" y="1002.544">neighbourhood?</tspan><tspan x="28" y="1038.944">B: I treat the plan as provisional, rather than</tspan><tspan x="28" y="1075.344">assuming that its coherence guarantees a</tspan><tspan x="28" y="1111.744">good experience.</tspan><tspan x="28" y="1148.144">A: What has helped you most?</tspan><tspan x="28" y="1184.5439999999999">B: For example, we stop to look at a doorway</tspan><tspan x="28" y="1220.944">instead of hurrying to the next landmark.</tspan></text><text x="28" y="1275.0240000000001" font-family="Arial, sans-serif" font-size="16.64" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.12" font-weight="400" fill="#353331"><tspan x="28" y="1306.6399999999999">Compare your first answer with this question:</tspan><tspan x="28" y="1343.04">Write a reply of your own, then ask one related</tspan><tspan x="28" y="1379.4399999999998">question.</tspan></text></svg>