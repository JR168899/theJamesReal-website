lipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="41.4" font-weight="700" fill="#2c3540"><tspan x="28" y="473.4">Consideration becomes visible</tspan><tspan x="28" y="525.15">through practical decisions.</tspan></text><text x="28" y="581.4" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="608.76">An original James Real learning reflection on</tspan><tspan x="28" y="640.26">practical consideration.</tspan></text><text x="28" y="687.06" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="714.42">An original James Real learning reflection on</tspan><tspan x="28" y="745.92">practical consideration</tspan></text><text x="28" y="792.7199999999999" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="820.0799999999999">For example, we repeat the main point in our own</tspan><tspan x="28" y="851.5799999999999">words before offering advice.</tspan></text><text x="28" y="898.3799999999999" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="925.7399999999999">This is an original James Real learning reflection.</tspan><tspan x="28" y="957.2399999999999">Explain the idea in your own words rather than</tspan><tspan x="28" y="988.7399999999999">treating it as a factual rule.</tspan></text><text x="28" y="1035.54" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="1062.8999999999999">A: How would you express this idea?</tspan><tspan x="28" y="1094.3999999999999">B: Consideration becomes visible through practical</tspan><tspan x="28" y="1125.8999999999999">decisions.</tspan><tspan x="28" y="1157.3999999999999">A: What does that mean here?</tspan><tspan x="28" y="1188.8999999999999">B: An original James Real learning reflection on</tspan><tspan x="28" y="1220.3999999999999">practical consideration.</tspan></text><text x="28" y="1267.2" font-family="Arial, sans-serif" font-size="14.4" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.2" font-weight="400" fill="#2c3540"><tspan x="28" y="1294.56">Review without reading the example first. Which</tspan><tspan x="28" y="1326.06">action in today’s topic illustrates this reflection?</tspan></text></svg>