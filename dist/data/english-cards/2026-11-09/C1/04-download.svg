<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>iron out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/11/09 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A shared planning session helps people reconsider and resolve a difficulty.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A shared planning session helps people reconsider and resolve a difficulty.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">iron something out</tspan><tspan x="28" y="513.0">iron out something</tspan></text><text x="28" y="561.015" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="584.271">resolve small difficulties</tspan></text><text x="28" y="624.051" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="647.307">resolve; straighten out</tspan></text><text x="28" y="687.0870000000001" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="710.3430000000001">We can iron out the details before we begin.</tspan></text><text x="28" y="750.1230000000002" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="773.3790000000001">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="800.1540000000001">changing its object or word order.</tspan></text><text x="28" y="839.9340000000002" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="863.1900000000002">A: How can we listen to a friend?</tspan><tspan x="28" y="889.9650000000001">B: We can iron out the details before we begin.</tspan><tspan x="28" y="916.7400000000002">A: That gives us a starting point.</tspan><tspan x="28" y="943.5150000000002">B: Let us try it together.</tspan></text><text x="28" y="1256.24" font-family="Arial, sans-serif" font-size="12.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="21.42" font-weight="400" fill="#3d3028"><tspan x="28" y="1279.496">Review without reading the example first. Explain “iron out” in</tspan><tspan x="28" y="1306.2710000000002">your own words, then use it in a sentence about a conversation</tspan><tspan x="28" y="1333.046">worth having. (Model: It means to resolve small difficulties.</tspan><tspan x="28" y="1359.8210000000001">Example: We can iron out the details before we begin.)</tspan></text></svg>