<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>brevity is the soul of wit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/11/09 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">brevity is the soul of wit</tspan></text><text font-family="Arial, sans-serif" font-size="18.900000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="505.23749999999995">William Shakespeare · Hamlet, Act II, Scene 2 (First Folio) · Published</tspan><tspan x="28" y="528.2955">1623</tspan></text><text x="28" y="579.8925" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="608.6205000000001">Expressing an idea briefly can make it more effective</tspan><tspan x="28" y="641.6955000000002">or clever.</tspan></text><text x="28" y="690.8355" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="719.5635000000001">Concise expression can be powerful; Wit often</tspan><tspan x="28" y="752.6385000000001">benefits from economy</tspan></text><text x="28" y="801.7785" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="830.5065000000001">Instead of repeating the explanation, I give one clear</tspan><tspan x="28" y="863.5815000000001">sentence and wait for a reply.</tspan></text><text x="28" y="912.7215" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="941.4495000000001">This is an excerpt from a speech by Polonius. His</tspan><tspan x="28" y="974.5245000000001">lengthy speech creates irony, so the dramatic context</tspan><tspan x="28" y="1007.5995">matters. The date refers to the First Folio publication.</tspan></text><text x="28" y="1056.7395" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1085.4675">A: What do you think of this line?</tspan><tspan x="28" y="1118.5425">B: It makes me think about our example.</tspan><tspan x="28" y="1151.6175">A: Which part?</tspan><tspan x="28" y="1184.6924999999999">B: Instead of repeating the explanation, I give one</tspan><tspan x="28" y="1217.7675">clear sentence and wait for a reply.</tspan></text><text x="28" y="1266.9074999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1295.6354999999999">Which action in the example connects with the</tspan><tspan x="28" y="1328.7105">quotation? (Model: The example removes repetition</tspan><tspan x="28" y="1361.7855">while keeping the important idea.)</tspan></text></svg>