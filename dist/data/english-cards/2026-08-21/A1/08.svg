<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A thing of beauty is a joy for ever:</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/08/21 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A greeting card sits beside flowers.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A greeting card sits beside flowers.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="477.08">A thing of beauty is a joy</tspan><tspan x="28" y="533.43">for ever:</tspan></text><text font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#2c3540"><tspan x="28" y="564.3000000000001">John Keats · Endymion, Book I · Published 1818</tspan></text><text x="28" y="618.1999999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="647.9920000000001">Something beautiful can continue to give pleasure</tspan><tspan x="28" y="682.292">after the first moment.</tspan></text><text x="28" y="733.252" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="763.0440000000001">Beauty can bring lasting pleasure; A beautiful</tspan><tspan x="28" y="797.344">experience can stay with us</tspan></text><text x="28" y="848.304" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="878.0960000000001">Long after our walk, I still remember the light on</tspan><tspan x="28" y="912.3960000000001">the trees.</tspan></text><text x="28" y="963.356" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="993.1480000000001">The colon is retained from the opening line. For</tspan><tspan x="28" y="1027.448">ever is an older two-word spelling of forever. This</tspan><tspan x="28" y="1061.748">is a poetic claim, not a measurable promise.</tspan></text><text x="28" y="1112.708" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1142.5">Heart: Do you still remember that garden?</tspan><tspan x="28" y="1176.8">Puck: Yes. I liked the flowers.</tspan><tspan x="28" y="1211.1">Heart: Does the memory make you smile?</tspan><tspan x="28" y="1245.4">Puck: It does.</tspan></text><text x="28" y="1296.3600000000001" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1326.152">Name a beautiful thing you remember and one</tspan><tspan x="28" y="1360.452">feeling it brings back.</tspan></text></svg>