<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A thing of beauty is a joy for ever:</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/08/21 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A greeting card sits beside flowers.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A greeting card sits beside flowers.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="41.400000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="473.4">A thing of beauty is a joy for</tspan><tspan x="28" y="525.15">ever:</tspan></text><text font-family="Arial, sans-serif" font-size="18.000000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="553.5">John Keats · Endymion, Book I · Published 1818</tspan></text><text x="28" y="603.0" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="630.3600000000001">Something beautiful can continue to give pleasure</tspan><tspan x="28" y="661.8600000000001">after the first moment.</tspan></text><text x="28" y="708.66" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="736.02">Beauty can bring lasting pleasure; A beautiful</tspan><tspan x="28" y="767.52">experience can stay with us</tspan></text><text x="28" y="814.3199999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="841.6800000000001">Long after our walk, I still remember the light on the</tspan><tspan x="28" y="873.1800000000001">trees.</tspan></text><text x="28" y="919.9799999999999" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="947.3399999999999">The colon is retained from the opening line. For ever</tspan><tspan x="28" y="978.8399999999999">is an older two-word spelling of forever. This is a</tspan><tspan x="28" y="1010.3399999999999">poetic claim, not a measurable promise.</tspan></text><text x="28" y="1057.14" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1084.5">Aoede: Why would a beautiful thing continue to give</tspan><tspan x="28" y="1116.0">joy?</tspan><tspan x="28" y="1147.5">Echo: Its memory or influence may last after the first</tspan><tspan x="28" y="1179.0">encounter.</tspan><tspan x="28" y="1210.5">Aoede: Must everyone find the same thing beautiful?</tspan><tspan x="28" y="1242.0">Echo: No. The line invites reflection rather than</tspan><tspan x="28" y="1273.5">establishing a universal preference.</tspan></text><text x="28" y="1320.3000000000002" font-family="Arial, sans-serif" font-size="14.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1347.66">Name one way an encounter with beauty can remain</tspan><tspan x="28" y="1379.16">meaningful after the object is no longer present.</tspan></text></svg>