<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>lantern</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/02/16 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Decorative lanterns light a festival setting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Decorative lanterns light a festival setting.</tspan></text><a href="https://www.pexels.com/photo/vibrant-red-lanterns-illuminating-festival-night-34224305/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34224305</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">lantern</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /ˈlæntɚn/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">Singular: lantern; plural: lanterns.</tspan></text><text x="28" y="604.8900000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="635.8980000000001">a light with a protective or decorative cover</tspan></text><text x="28" y="688.9380000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="719.9460000000001">portable light; lamp</tspan></text><text x="28" y="772.9860000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="803.9940000000001">A red lantern hangs above the entrance.</tspan></text><text x="28" y="857.0340000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="888.0420000000001">Topic: Welcoming the Lunar New Year. Write</tspan><tspan x="28" y="923.7420000000002">one sentence using this word. Check that your</tspan><tspan x="28" y="959.4420000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1012.4820000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1043.49">A: What does “lantern” mean?</tspan><tspan x="28" y="1079.19">B: It means a light with a protective or</tspan><tspan x="28" y="1114.89">decorative cover.</tspan><tspan x="28" y="1150.59">A: Can we use it at a Lunar New Year</tspan><tspan x="28" y="1186.29">gathering?</tspan><tspan x="28" y="1221.99">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1275.03" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.038">Read, then answer. Which word means “a light</tspan><tspan x="28" y="1341.738">with a protective or decorative cover”: lantern</tspan><tspan x="28" y="1377.438">or envelope? (Model: lantern)</tspan></text></svg>