<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Welcoming the Lunar New Year</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/02/16 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Red envelopes are part of a Lunar New Year greeting.</tspan></text><a href="https://www.pexels.com/photo/woman-holding-a-red-envelope-6864751/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 6864751</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Welcoming the Lunar New Year</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="162.0">When we welcome the new year together, a little care can make the experience better.</tspan><tspan x="42" y="191.25">Planning and thinking about other people both help.</tspan></text><text x="42" y="223.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="253.5">First, asking about a custom prevents careless assumptions. For example, we ask the</tspan><tspan x="42" y="282.75">host how their family exchanges greetings. This is a small thing that makes the day</tspan><tspan x="42" y="312.0">easier.</tspan></text><text x="42" y="344.25" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="374.25">Second, sharing time connects generations. For example, we invite an older relative to</tspan><tspan x="42" y="403.5">explain a family recipe. We do not need a perfect day to do this well.</tspan></text><text x="42" y="435.75" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#37322b"><tspan x="42" y="465.75">We can welcome the new year together more easily when we prepare and notice other</tspan><tspan x="42" y="495.0">people. These simple steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="545.25">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="567.21">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="589.17">about an experience of your own.</tspan><tspan x="42" y="611.13">Read, then answer. What two reasons support the main idea? Explain one example.</tspan></text></svg>