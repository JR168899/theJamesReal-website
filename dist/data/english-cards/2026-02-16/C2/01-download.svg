<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>diaspora</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/02/16 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together outdoors.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#382d2e"><tspan x="28" y="472.02">diaspora</tspan></text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="506.385">US /daɪˈæspərə/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.14" font-weight="400" fill="#382d2e"><tspan x="28" y="530.8842">Singular: diaspora; plural: diasporas.</tspan></text><text x="28" y="579.465" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="605.9130000000001">a population living outside its ancestral homeland</tspan></text><text x="28" y="651.153" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="677.6010000000001">dispersed community; population living abroad</tspan></text><text x="28" y="722.841" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="749.2890000000001">The essay considers how a diaspora adapts familiar</tspan><tspan x="28" y="779.7390000000001">traditions.</tspan></text><text x="28" y="824.979" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="851.4270000000001">Keep the sense and countability shown in the example.</tspan><tspan x="28" y="881.8770000000002">Use a singular or plural form appropriate to the specific</tspan><tspan x="28" y="912.3270000000001">person, object or event being discussed.</tspan></text><text x="28" y="957.5670000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="984.0150000000002">A: The exhibition follows families across several</tspan><tspan x="28" y="1014.4650000000003">countries.</tspan><tspan x="28" y="1044.9150000000002">B: Does it treat the diaspora as a single, uniform</tspan><tspan x="28" y="1075.3650000000002">community?</tspan><tspan x="28" y="1105.8150000000003">A: No. It records different relationships with places of</tspan><tspan x="28" y="1136.2650000000003">origin.</tspan><tspan x="28" y="1166.7150000000001">B: That seems essential to understanding the variety of</tspan><tspan x="28" y="1197.1650000000002">their experiences.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1284.368">Why should an account of a diaspora avoid assuming</tspan><tspan x="28" y="1314.818">that every member has the same experience? (Model:</tspan><tspan x="28" y="1345.268">Dispersed communities contain different histories,</tspan><tspan x="28" y="1375.7179999999998">identities and relationships to places of origin.)</tspan></text></svg>