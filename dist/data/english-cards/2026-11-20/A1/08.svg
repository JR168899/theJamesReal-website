<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Small things can help.</title><rect width="660" height="1434" fill="#dce5ee"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2c3540" stroke-width="1"/><text x="35" y="43" fill="#2c3540" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   A1   2026-11-20</tspan></text><text x="35" y="88" fill="#2c3540" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">Small things can help.</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>Small things can help.</title><desc>Original hand-drawn story illustration: music, set within music. An original James Real learning reflection on practical consideration.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-2) scale(1.5)"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#b7a3bf"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#b7a3bf"/></g><g transform="translate(95 264) rotate(2) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Small things can help.</text></svg><text x="35" y="514.4" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An original James Real learning reflection on practical</tspan><tspan x="35" dy="24.839999999999996">consideration.</tspan></text><text x="35" y="615.6399999999999" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="640.1999999999998" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">For example, each friend chooses one track and explains</tspan><tspan x="35" dy="24.839999999999996">what they enjoy about it.</tspan></text><text x="35" y="716.8799999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="741.4399999999997" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Look again. Which action in today’s topic illustrates this</tspan><tspan x="35" dy="24.839999999999996">reflection?</tspan></text><text x="35" y="1406" fill="#2c3540" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">REFLECTION   /   08 OF 11</tspan></text></svg>