<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>harvest</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/11/20 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Vegetables are arranged for selection.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Vegetables are arranged for selection.</tspan></text><a href="https://www.pexels.com/photo/assorted-fresh-ripe-vegetables-in-market-stall-3873912/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3873912</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">harvest</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /ˈhɑrvəst/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">Singular: harvest; plural: harvests.</tspan></text><text x="28" y="604.0425" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="634.8985">the gathering of crops, or the crops gathered</tspan></text><text x="28" y="687.6785" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="718.5345">crop gathering; gathered crops</tspan></text><text x="28" y="771.3145" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="802.1705">The market displays vegetables from the</tspan><tspan x="28" y="837.6954999999999">autumn harvest.</tspan></text><text x="28" y="890.4755" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="921.3315">The noun can mean the gathering of crops or</tspan><tspan x="28" y="956.8565">the crops gathered. Compare the verb: harvest</tspan><tspan x="28" y="992.3815">the vegetables.</tspan></text><text x="28" y="1045.1615" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1076.0175">A: Was it a good harvest?</tspan><tspan x="28" y="1111.5425">B: We gathered plenty of carrots, but fewer</tspan><tspan x="28" y="1147.0674999999999">tomatoes.</tspan><tspan x="28" y="1182.5925">A: What will you do with the extra carrots?</tspan><tspan x="28" y="1218.1174999999998">B: Share them with the neighbors.</tspan></text><text x="28" y="1270.8975" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1301.7535">Why might a gardener harvest some vegetables</tspan><tspan x="28" y="1337.2785000000001">before others? (Model: Different plants or fruits</tspan><tspan x="28" y="1372.8035">may reach readiness at different times.)</tspan></text></svg>