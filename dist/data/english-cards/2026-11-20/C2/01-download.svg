<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>commensality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/11/20 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People sit together for a shared meal.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People sit together for a shared meal.</tspan></text><a href="https://www.pexels.com/photo/a-high-angle-shot-of-people-sitting-near-the-table-while-having-dinner-5791670/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5791670</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">commensality</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /kəˌmɛnˈsæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Usually uncountable: commensality; no regular plural in this sense.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">the practice of eating together</tspan></text><text x="28" y="659.9695" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="687.4815000000001">shared dining; eating together</tspan></text><text x="28" y="734.5415" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="762.0535000000001">The shared table made commensality part of</tspan><tspan x="28" y="793.7285">neighborhood life.</tspan></text><text x="28" y="840.7885" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="868.3005">The practice of eating together. It concerns social</tspan><tspan x="28" y="899.9755">relations and participation as well as food.</tspan></text><text x="28" y="947.0355" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="974.5475">A: The project records more than what families eat.</tspan><tspan x="28" y="1006.2225">B: Does it also examine who shares the table?</tspan><tspan x="28" y="1037.8975">A: Yes. Commensality is central to the study.</tspan><tspan x="28" y="1069.5725">B: Then seating, invitation and exclusion matter as</tspan><tspan x="28" y="1101.2475">much as the menu.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Why might a study of commensality record who is</tspan><tspan x="28" y="1317.667">invited to eat, rather than only the ingredients?</tspan><tspan x="28" y="1349.3419999999999">(Model: Eating together is a social practice shaped by</tspan><tspan x="28" y="1381.017">relationships, participation and exclusion.)</tspan></text></svg>