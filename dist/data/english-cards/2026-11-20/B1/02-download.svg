<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>invite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/11/20 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">invite</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /ɪnˈvaɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">invite · invites · invited · invited · inviting (base · third person ·</tspan><tspan x="28" y="571.7974999999999">past · past participle · -ing)</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">to ask someone to come to an event or take</tspan><tspan x="28" y="692.4313000000001">part in an activity</tspan></text><text x="28" y="744.1713" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="774.4193">ask to attend; welcome</tspan></text><text x="28" y="826.1592999999999" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="856.4073">We invite a neighbor to join our meal.</tspan></text><text x="28" y="908.1473" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953">Use the verb in the sense shown in the</tspan><tspan x="28" y="973.2203000000001">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1008.0453">object; the word forms above show its changes.</tspan></text><text x="28" y="1059.7853" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0332999999998">Sky: Shall we invite our new neighbor?</tspan><tspan x="28" y="1124.8582999999999">Michael: Yes. Ask whether Saturday suits her.</tspan><tspan x="28" y="1159.6833">Sky: Should I mention the food?</tspan><tspan x="28" y="1194.5082999999997">Michael: Tell her it is a simple lunch, so she</tspan><tspan x="28" y="1229.3332999999998">knows what to expect.</tspan></text><text x="28" y="1281.0733" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1311.3212999999998">Invite a neighbor to lunch and give a day.</tspan><tspan x="28" y="1346.1462999999999">(Model: Would you like to join us for lunch on</tspan><tspan x="28" y="1380.9713">Saturday?)</tspan></text></svg>