<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>volunteer</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/11/20 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">volunteer</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /ˌvɑlənˈtɪr/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">volunteer · volunteers · volunteered · volunteered ·</tspan><tspan x="28" y="575.3100000000001">volunteering (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="632.2668000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="663.2748000000001">to offer to do something without being forced or</tspan><tspan x="28" y="698.9748000000002">paid</tspan></text><text x="28" y="752.0148000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="783.0228000000002">offer to help; give time freely</tspan></text><text x="28" y="836.0628000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="867.0708000000002">I volunteer to help clear the table.</tspan></text><text x="28" y="920.1108000000002" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="951.1188000000002">Use the verb in the sense shown in the</tspan><tspan x="28" y="986.8188000000002">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="1022.5188000000002">object; the word forms above show its</tspan><tspan x="28" y="1058.2188">changes.</tspan></text><text x="28" y="1111.2588" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1142.2668">Sky: Are you paid to help at the garden?</tspan><tspan x="28" y="1177.9668000000001">Michael: No. I am a volunteer.</tspan><tspan x="28" y="1213.6668000000002">Sky: How often do you come?</tspan><tspan x="28" y="1249.3668">Michael: One Saturday a month.</tspan></text><text x="28" y="1302.4068" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1333.4148">A volunteer can help once a month. Make a</tspan><tspan x="28" y="1369.1148">clear offer rather than an unlimited promise.</tspan></text></svg>