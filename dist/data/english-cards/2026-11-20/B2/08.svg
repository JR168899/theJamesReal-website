<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A small decision matters when it helps someone else.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/11/20 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A small decision matters when it helps someone else.</title><desc>Original family-manga illustration: music, related to A small decision matters when it helps someone else..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#d59bea"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#d59bea"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">A small decision matters</tspan><tspan x="28" y="529.8075">when it helps someone else.</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="617.5980000000001">The value of a modest choice can lie in the benefit it</tspan><tspan x="28" y="650.6730000000001">gives another person.</tspan></text><text x="28" y="699.813" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="728.541">A modest choice can be valuable to another person.;</tspan><tspan x="28" y="761.6160000000001">Thoughtful decisions need not be grand.</tspan></text><text x="28" y="810.756" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="839.484">For example, each friend chooses one track and</tspan><tspan x="28" y="872.5590000000001">explains what they enjoy about it.</tspan></text><text x="28" y="921.699" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="950.427">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="983.5020000000001">to a specific action in the example, and explain why</tspan><tspan x="28" y="1016.577">you agree or disagree.</tspan></text><text x="28" y="1065.7169999999999" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1094.445">A: What did we learn from that experience?</tspan><tspan x="28" y="1127.52">B: A small decision matters when it helps someone</tspan><tspan x="28" y="1160.595">else.</tspan><tspan x="28" y="1193.6699999999998">A: What do you mean?</tspan><tspan x="28" y="1226.745">B: The value of a modest choice can lie in the benefit</tspan><tspan x="28" y="1259.82">it gives another person.</tspan></text><text x="28" y="1308.9599999999998" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1337.6879999999999">Compare your first answer with this question: Which</tspan><tspan x="28" y="1370.763">action in today’s topic illustrates this reflection?</tspan></text></svg>