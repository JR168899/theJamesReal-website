<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>There is nothing in the world so irresistibly contagious as laughter and good-humour.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/01/04 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family spends time together outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family spends time together outdoors.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="473.86">There is nothing in the world</tspan><tspan x="28" y="526.1850000000001">so irresistibly contagious as</tspan><tspan x="28" y="578.51">laughter and good-humour.</tspan></text><text font-family="Arial, sans-serif" font-size="18.200000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="607.1750000000001">Charles Dickens · A Christmas Carol, Stave Three · Published 1843</tspan></text><text x="28" y="657.2250000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="684.8890000000001">A cheerful mood can spread from one person to</tspan><tspan x="28" y="716.7390000000001">others.</tspan></text><text x="28" y="764.0590000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="791.7230000000002">Laughter can spread through a group; Good spirits</tspan><tspan x="28" y="823.5730000000002">can influence the people nearby</tspan></text><text x="28" y="870.8930000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="898.5570000000002">One guest starts laughing at a gentle joke, and soon</tspan><tspan x="28" y="930.4070000000003">the whole table is smiling.</tspan></text><text x="28" y="977.7270000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1005.3910000000003">Contagious is figurative here: it describes an emotion</tspan><tspan x="28" y="1037.2410000000002">spreading, rather than an infection. The original</tspan><tspan x="28" y="1069.0910000000003">spelling good-humour is retained.</tspan></text><text x="28" y="1116.4110000000003" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1144.0750000000003">A: Why are they all laughing?</tspan><tspan x="28" y="1175.9250000000002">B: One person told a funny story.</tspan><tspan x="28" y="1207.7750000000003">A: Did the others join in?</tspan><tspan x="28" y="1239.6250000000002">B: Yes. The good mood spread.</tspan></text><text x="28" y="1286.9450000000004" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1314.6090000000004">Does contagious mean an illness in this sentence?</tspan><tspan x="28" y="1346.4590000000003">(Model: No. It describes laughter spreading from</tspan><tspan x="28" y="1378.3090000000004">person to person.)</tspan></text></svg>