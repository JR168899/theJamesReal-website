<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>borrow</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/07/12 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books and share what they discover.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books and share what they discover.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="47.38" font-weight="700" fill="#382d2e"><tspan x="28" y="479.38">borrow</tspan></text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="520.065">US /ˈbɑroʊ/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.66" font-weight="400" fill="#382d2e"><tspan x="28" y="549.0698">borrow · borrows · borrowed · borrowed · borrowing (base</tspan><tspan x="28" y="576.715">· third person · past · past participle · -ing)</tspan></text><text x="28" y="634.2302" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="665.5422">to use something temporarily and then return it</tspan></text><text x="28" y="719.1021999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="750.4141999999999">take on loan; use temporarily</tspan></text><text x="28" y="803.9741999999999" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="835.2861999999999">May I borrow this book until Friday?</tspan></text><text x="28" y="888.8461999999998" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="920.1581999999999">Topic: A little time to read. Write one sentence</tspan><tspan x="28" y="956.2081999999998">using this word. Check that your sentence</tspan><tspan x="28" y="992.2581999999999">keeps the meaning shown above.</tspan></text><text x="28" y="1045.8182" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1077.1301999999998">A: What does “borrow” mean?</tspan><tspan x="28" y="1113.1801999999998">B: It means to use something temporarily and</tspan><tspan x="28" y="1149.2301999999997">then return it.</tspan><tspan x="28" y="1185.2802">A: Can we use it in a quiet reading corner?</tspan><tspan x="28" y="1221.3301999999999">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1274.8902" font-family="Arial, sans-serif" font-size="16.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.84" font-weight="400" fill="#382d2e"><tspan x="28" y="1306.2022">Look again. Which word means “to use</tspan><tspan x="28" y="1342.2522">something temporarily and then return it”:</tspan><tspan x="28" y="1378.3021999999999">borrow or chapter?</tspan></text></svg>