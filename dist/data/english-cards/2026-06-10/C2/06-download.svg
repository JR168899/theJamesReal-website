y="711.0115" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="738.5235">The elaborate arrangement was a curate’s egg.</tspan></text><text x="28" y="785.5835" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="813.0955">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="844.7705">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="891.8304999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="919.3425">A: How would you express this idea?</tspan><tspan x="28" y="951.0174999999999">B: a curate’s egg</tspan><tspan x="28" y="982.6925">A: What does that mean here?</tspan><tspan x="28" y="1014.3675">B: something with both good and bad parts; chiefly</tspan><tspan x="28" y="1046.0425">British</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Review without reading the example first. What does</tspan><tspan x="28" y="1317.667">“a curate’s egg” mean in this example? The elaborate</tspan><tspan x="28" y="1349.3419999999999">arrangement was a curate’s egg. (Model: Something</tspan><tspan x="28" y="1381.017">with both good and bad parts; chiefly British.)</tspan></text></svg>