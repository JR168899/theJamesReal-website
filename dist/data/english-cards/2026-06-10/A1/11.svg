<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something small</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A1 - 2026/06/10 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Hands cultivate a garden with care.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-gardening-7729129/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 7729129</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Growing something small</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="169.0">I like to care for a plant. Two small things help me.</tspan></text><text x="42" y="202.44" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="239.44">First, we touch the soil before we water the plant. Sometimes it is still</tspan><tspan x="42" y="276.88">wet.</tspan></text><text x="42" y="310.32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="347.32">Next, we write down where the plant grows well. We can remember</tspan><tspan x="42" y="384.76">next time.</tspan></text><text x="42" y="418.2" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#37322b"><tspan x="42" y="455.2">These two things help us. We can care for a plant and enjoy our time</tspan><tspan x="42" y="492.64">together.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="544.0799999999999">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="566.04">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="587.9999999999999">about an experience of your own.</tspan><tspan x="42" y="609.9599999999999">Try without help. What two reasons support the main idea? Explain one example.</tspan></text></svg>