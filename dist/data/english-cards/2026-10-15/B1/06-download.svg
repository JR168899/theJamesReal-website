<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get the ball rolling</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/15 - Idioms &amp; slang - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group develops a shared plan around a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group develops a shared plan around a board.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#383426"><tspan x="28" y="477.08">get the ball rolling</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">start an activity</tspan></text><text x="28" y="619.082" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="648.8740000000001">make a start; set things in motion</tspan></text><text x="28" y="699.834" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="729.6260000000001">One question can get the ball rolling.</tspan></text><text x="28" y="780.5859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="810.378">An informal way to say start an activity or</tspan><tspan x="28" y="844.678">process. A small first action can get the ball</tspan><tspan x="28" y="878.9780000000001">rolling.</tspan></text><text x="28" y="929.9379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="959.73">Sky: Nobody seems ready to speak.</tspan><tspan x="28" y="994.03">Michael: I can get the ball rolling with one</tspan><tspan x="28" y="1028.33">question.</tspan><tspan x="28" y="1062.63">Sky: Which one?</tspan><tspan x="28" y="1096.93">Michael: What made the last workshop difficult to</tspan><tspan x="28" y="1131.23">join?</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Write one concrete opening question to get a</tspan><tspan x="28" y="1323.772">planning discussion started. (Model: What made</tspan><tspan x="28" y="1358.072">the last workshop difficult for newcomers to join?)</tspan></text></svg>