<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>phenology</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/04/01 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Changing leaves mark the passing of seasons.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Changing leaves mark the passing of seasons.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">phenology</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /fəˈnɑlədʒi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">Usually uncountable: phenology; no regular plural in this</tspan><tspan x="28" y="569.69">sense.</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">the study of seasonal events in living things</tspan></text><text x="28" y="705.1652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="734.9572000000002">study of seasonal biological timing</tspan></text><text x="28" y="785.9172" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="815.7092000000001">Phenology records when plants flower and birds</tspan><tspan x="28" y="850.0092000000001">migrate.</tspan></text><text x="28" y="900.9692" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="930.7612000000001">Phenology concerns the timing of recurring</tspan><tspan x="28" y="965.0612000000001">biological events, such as flowering or migration,</tspan><tspan x="28" y="999.3612000000002">not simply identifying species.</tspan></text><text x="28" y="1050.3212" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1080.1132">A: Why record the first flowering date each year?</tspan><tspan x="28" y="1114.4132">B: It gives us phenological observations.</tspan><tspan x="28" y="1148.7132">A: Not simply a list of species?</tspan><tspan x="28" y="1183.0132">B: No. Phenology concerns the timing of recurring</tspan><tspan x="28" y="1217.3132">biological events.</tspan></text><text x="28" y="1268.2732" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1298.0652">Would recording a plant&#x27;s first flowering date</tspan><tspan x="28" y="1332.3652">contribute to phenology? Explain. (Model: Yes. It</tspan><tspan x="28" y="1366.6652">records the timing of a recurring biological event.)</tspan></text></svg>