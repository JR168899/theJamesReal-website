<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/09/25 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small details in a document can have important consequences.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small details in a document can have important consequences.</tspan></text><a href="https://www.pexels.com/photo/person-holding-silver-pen-signing-photographers-signature-175045/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 175045</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#383426"><tspan x="28" y="468.8">the devil is in the details</tspan></text><text x="28" y="518.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="543.12">small details can cause important difficulties</tspan></text><text x="28" y="584.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="609.04">small points can cause big problems; careful execution matters</tspan></text><text x="28" y="650.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="674.9599999999999">The broad idea is sound, but the devil is in the details.</tspan></text><text x="28" y="716.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="740.8799999999999">Learn the whole expression. It is figurative language, so a</tspan><tspan x="28" y="768.8799999999999">word-for-word interpretation may be misleading.</tspan></text><text x="28" y="810.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="834.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="862.7999999999998">B: the devil is in the details</tspan><tspan x="28" y="890.7999999999998">A: What does that mean here?</tspan><tspan x="28" y="918.7999999999998">B: small details can cause important difficulties</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#383426"><tspan x="28" y="1281.1200000000001">Explain the meaning before looking at the model answer. What</tspan><tspan x="28" y="1309.1200000000001">does “the devil is in the details” mean in this example? The</tspan><tspan x="28" y="1337.1200000000001">broad idea is sound, but the devil is in the details. (Model:</tspan><tspan x="28" y="1365.1200000000001">Small details can cause important difficulties.)</tspan></text></svg>