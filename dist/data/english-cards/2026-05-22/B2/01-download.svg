<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>coordinate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/05/22 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">coordinate</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /koʊˈɔrdəˌneɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">coordinate · coordinates · coordinated · coordinated · coordinating</tspan><tspan x="28" y="559.1525">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="609.6877" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="637.1997">to organise people or activities so they work together</tspan></text><text x="28" y="684.2597" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="711.7717">organize jointly; bring together</tspan></text><text x="28" y="758.8317" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="786.3437">I coordinate the tasks so that nobody does the same</tspan><tspan x="28" y="818.0187">job twice.</tspan></text><text x="28" y="865.0786999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="892.5907">Use the verb in the sense shown in the exchange.</tspan><tspan x="28" y="924.2656999999999">Notice the subject, tense and any object; the word</tspan><tspan x="28" y="955.9407">forms above show its changes.</tspan></text><text x="28" y="1003.0006999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1030.5127">Aoede: Both teams are using the same room at ten.</tspan><tspan x="28" y="1062.1877">Echo: Who is coordinating the bookings?</tspan><tspan x="28" y="1093.8627">Aoede: I am. I will move the smaller meeting.</tspan><tspan x="28" y="1125.5377">Echo: Please confirm the new room with everyone</tspan><tspan x="28" y="1157.2127">involved.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Two meetings have the same room and time. Name</tspan><tspan x="28" y="1317.667">two steps needed to coordinate a solution. (Model:</tspan><tspan x="28" y="1349.3419999999999">Arrange another suitable room or time, then confirm</tspan><tspan x="28" y="1381.017">the change with both teams.)</tspan></text></svg>