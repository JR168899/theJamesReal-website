<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>accountable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/05/22 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="40.940000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="472.94">accountable</tspan></text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="508.095">US /əˈkaʊntəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="533.1574">Adjective: accountable; related noun: accountability</tspan></text><text x="28" y="582.855" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="609.911">expected to explain and take responsibility for an</tspan><tspan x="28" y="641.0609999999999">action</tspan></text><text x="28" y="687.341" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="714.3969999999999">responsible; answerable</tspan></text><text x="28" y="760.677" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="787.733">Each person is accountable for one part of the</tspan><tspan x="28" y="818.8829999999999">project.</tspan></text><text x="28" y="865.163" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="892.2189999999999">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="923.3689999999999">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="954.519">description rather than using it as a general</tspan><tspan x="28" y="985.669">compliment.</tspan></text><text x="28" y="1031.949" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1059.005">Aoede: Who is accountable for approving the final</tspan><tspan x="28" y="1090.1550000000002">version?</tspan><tspan x="28" y="1121.305">Echo: I am, although several people will contribute.</tspan><tspan x="28" y="1152.4550000000002">Aoede: Then comments should come to you?</tspan><tspan x="28" y="1183.605">Echo: Yes, so the approval does not become</tspan><tspan x="28" y="1214.755">ambiguous.</tspan></text><text x="28" y="1261.035" font-family="Arial, sans-serif" font-size="14.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#382d2e"><tspan x="28" y="1288.0910000000001">Distinguish being accountable for approval from</tspan><tspan x="28" y="1319.2410000000002">merely contributing a suggestion. (Model: The</tspan><tspan x="28" y="1350.391">accountable person must answer for the final</tspan><tspan x="28" y="1381.5410000000002">approval; a contributor supplies input.)</tspan></text></svg>