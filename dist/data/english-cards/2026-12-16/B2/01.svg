<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cultivate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/12/16 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A gardener waters a plant.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A gardener waters a plant.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-person-watering-a-potted-plant-with-spray-bottle-5622461/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622461</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">cultivate</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /ˈkʌltəˌveɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">cultivate · cultivates · cultivated · cultivated · cultivating (base ·</tspan><tspan x="28" y="571.7974999999999">third person · past · past participle · -ing)</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">to prepare and care for plants or develop a skill</tspan></text><text x="28" y="709.3463" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="739.5943000000001">grow; nurture</tspan></text><text x="28" y="791.3343000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="821.5823000000001">We cultivate herbs in a small garden.</tspan></text><text x="28" y="873.3223000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="903.5703000000002">Use the verb in the sense shown in the</tspan><tspan x="28" y="938.3953000000002">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="973.2203000000002">object; the word forms above show its changes.</tspan></text><text x="28" y="1024.9603000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1055.2083000000002">Aoede: The group is cultivating a small garden</tspan><tspan x="28" y="1090.0333000000003">behind the hall.</tspan><tspan x="28" y="1124.8583000000003">Echo: Are they starting with seeds?</tspan><tspan x="28" y="1159.6833000000001">Aoede: Some seeds and a few established</tspan><tspan x="28" y="1194.5083000000002">plants.</tspan><tspan x="28" y="1229.3333000000002">Echo: Then the work will include both planting</tspan><tspan x="28" y="1264.1583000000003">and continued care.</tspan></text><text x="28" y="1315.8983000000003" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1346.1463">Does cultivate refer only to putting a seed in the</tspan><tspan x="28" y="1380.9713000000002">ground? Explain.</tspan></text></svg>