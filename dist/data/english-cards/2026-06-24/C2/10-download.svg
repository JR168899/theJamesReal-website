<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes a meal feel welcoming to you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/06/24 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">What makes a meal feel</tspan><tspan x="28" y="525.6675">welcoming to you?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">What makes a meal feel welcoming to you?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="822.236">different preference or a declined invitation without</tspan><tspan x="28" y="853.9110000000001">asking the person to justify it.</tspan></text><text x="28" y="900.971" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="928.4830000000001">A: Do you prefer a big dinner or something simple?</tspan><tspan x="28" y="960.158">B: Something simple, if it leaves time to talk.</tspan><tspan x="28" y="991.8330000000001">A: Would soup and bread suit you?</tspan><tspan x="28" y="1023.508">B: Perfect. I can bring the bread.</tspan><tspan x="28" y="1055.183">A: Then I will make the soup.</tspan><tspan x="28" y="1086.8580000000002">B: And we can share the washing-up afterward.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Your guest says they prefer simple food. Suggest a</tspan><tspan x="28" y="1317.667">meal and ask one relevant follow-up. (Model: How</tspan><tspan x="28" y="1349.3419999999999">about soup and bread? Is there anything you would</tspan><tspan x="28" y="1381.017">prefer not to eat?)</tspan></text></svg>