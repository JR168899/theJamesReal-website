<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cut the Gordian knot</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C2 - 2026/03/18 - Idioms &amp; slang - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two colleagues coordinate a plan at a board.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two colleagues coordinate a plan at a board.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="46.46" font-weight="700" fill="#383426"><tspan x="28" y="478.46">cut the Gordian knot</tspan></text><text x="28" y="541.5849999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="572.2889999999999">solve a complex problem with a decisive and</tspan><tspan x="28" y="607.6389999999999">direct action</tspan></text><text x="28" y="660.159" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="690.8629999999999">take a decisive shortcut; break the deadlock</tspan></text><text x="28" y="743.3829999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="774.0869999999999">A simpler agreement cut the Gordian knot.</tspan></text><text x="28" y="826.6069999999999" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="857.3109999999998">A literary allusion to a decisive solution. More</tspan><tspan x="28" y="892.6609999999998">formal than sort it out; not simply any small</tspan><tspan x="28" y="928.0109999999999">adjustment.</tspan></text><text x="28" y="980.5309999999998" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1011.2349999999998">Sarah: The committee keeps arguing over</tspan><tspan x="28" y="1046.5849999999998">twenty overlapping rules.</tspan><tspan x="28" y="1081.9349999999997">Liam: Could one clear access policy cut the</tspan><tspan x="28" y="1117.2849999999999">Gordian knot?</tspan><tspan x="28" y="1152.6349999999998">Sarah: Perhaps, if it removes duplication</tspan><tspan x="28" y="1187.9849999999997">without hiding the real conflicts.</tspan><tspan x="28" y="1223.3349999999998">Liam: Then we should test what the simpler rule</tspan><tspan x="28" y="1258.6849999999997">actually settles.</tspan></text><text x="28" y="1311.205" font-family="Arial, sans-serif" font-size="16.16" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.28" font-weight="400" fill="#383426"><tspan x="28" y="1341.9089999999999">Does cutting the Gordian knot always mean</tspan><tspan x="28" y="1377.2589999999998">ignoring important complexity? Explain.</tspan></text></svg>