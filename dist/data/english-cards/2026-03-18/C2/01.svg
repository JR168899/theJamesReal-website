<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>symbiosis</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/03/18 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A bee and a flowering plant benefit from their interaction.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A bee and a flowering plant benefit from their interaction.</tspan></text><a href="https://www.pexels.com/photo/macro-view-of-bee-on-flower-collecting-pollen-34256469/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34256469</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">symbiosis</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /ˌsɪmbaɪˈoʊsɪs/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: symbiosis; plural: symbioses.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">a close relationship in which different organisms or</tspan><tspan x="28" y="644.5845">groups interact</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">close biological association; interdependent</tspan><tspan x="28" y="750.8315">relationship</tspan></text><text x="28" y="797.8915" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="825.4035">The garden offers examples of symbiosis between</tspan><tspan x="28" y="857.0785">different organisms.</tspan></text><text x="28" y="904.1384999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="931.6505">Topic: Growing something small. Write one sentence</tspan><tspan x="28" y="963.3254999999999">using this word. Check that your sentence keeps the</tspan><tspan x="28" y="995.0005">meaning shown above.</tspan></text><text x="28" y="1042.0604999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1069.5724999999998">A: What does “symbiosis” mean?</tspan><tspan x="28" y="1101.2474999999997">B: It means a close relationship in which different</tspan><tspan x="28" y="1132.9224999999997">organisms or groups interact.</tspan><tspan x="28" y="1164.5974999999999">A: Can we use it in a small garden?</tspan><tspan x="28" y="1196.2724999999998">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Review without reading the example first. Which word</tspan><tspan x="28" y="1317.667">means “a close relationship in which different</tspan><tspan x="28" y="1349.3419999999999">organisms or groups interact”: symbiosis or</tspan><tspan x="28" y="1381.017">phenology?</tspan></text></svg>