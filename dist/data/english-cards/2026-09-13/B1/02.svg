<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>considerate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/09/13 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener gives attention to another speaker.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener gives attention to another speaker.</tspan></text><a href="https://www.pexels.com/photo/a-man-listening-to-his-colleague-7432245/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7432245</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">considerate</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /kənˈsɪdərət/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">considerate · more considerate · most considerate; noun:</tspan><tspan x="28" y="566.88">consideration</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">thinking about other people’s needs</tspan></text><text x="28" y="699.5904" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="728.7744">thoughtful; mindful of others</tspan></text><text x="28" y="778.6944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="807.8784">It is considerate to ask before opening the</tspan><tspan x="28" y="841.4784000000001">window.</tspan></text><text x="28" y="891.3984000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="920.5824000000001">The adjective describes a person, thing or</tspan><tspan x="28" y="954.1824000000001">situation. Choose a concrete noun or context that</tspan><tspan x="28" y="987.7824000000002">supports the description rather than using it as a</tspan><tspan x="28" y="1021.3824000000002">general compliment.</tspan></text><text x="28" y="1071.3024" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1100.4864000000002">Sky: You saved the quiet seat for Daniel.</tspan><tspan x="28" y="1134.0864000000001">Michael: Yes. He said conversation is easier</tspan><tspan x="28" y="1167.6864000000003">away from the speaker.</tspan><tspan x="28" y="1201.2864000000002">Sky: That was considerate of you.</tspan><tspan x="28" y="1234.8864000000003">Michael: It was a small change, but it made a</tspan><tspan x="28" y="1268.4864000000002">difference.</tspan></text><text x="28" y="1318.4064" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1347.5904000000003">A guest asks for a quieter seat. Name a</tspan><tspan x="28" y="1381.1904000000002">considerate response.</tspan></text></svg>