<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>weigh up</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/09/13 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Comparing alternatives helps clarify competing benefits and drawbacks.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Comparing alternatives helps clarify competing benefits and drawbacks.</tspan></text><a href="https://www.pexels.com/photo/colleagues-using-a-laptop-7212946/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7212946</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="481.91">weigh something up</tspan><tspan x="28" y="544.2975">weigh up something</tspan></text><text x="28" y="612.1100000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="645.0940000000002">consider advantages and disadvantages</tspan></text><text x="28" y="701.5140000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="734.4980000000002">assess; evaluate</tspan></text><text x="28" y="790.9180000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="823.9020000000002">We weigh up the choices before deciding.</tspan></text><text x="28" y="880.3220000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="913.3060000000002">Keep the particle with the verb. Check a</tspan><tspan x="28" y="951.2810000000002">dictionary before changing its object or word</tspan><tspan x="28" y="989.2560000000002">order.</tspan></text><text x="28" y="1045.6760000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1078.6600000000003">A: How can we share a meal?</tspan><tspan x="28" y="1116.6350000000002">B: We weigh up the choices before deciding.</tspan><tspan x="28" y="1154.6100000000004">A: That gives us a starting point.</tspan><tspan x="28" y="1192.5850000000003">B: Let us try it together.</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1294.344">Compare your first answer with this question:</tspan><tspan x="28" y="1332.319">Explain “weigh up” in your own words, then</tspan><tspan x="28" y="1370.294">use it in a sentence about around the table.</tspan></text></svg>