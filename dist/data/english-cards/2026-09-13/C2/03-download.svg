<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/09/13 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Examining information helps someone check an explanation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Examining information helps someone check an explanation.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">bear something out</tspan><tspan x="28" y="513.0">bear out something</tspan></text><text x="28" y="559.74" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="582.236">support or confirm a claim</tspan></text><text x="28" y="620.716" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="643.212">corroborate; substantiate</tspan></text><text x="28" y="681.692" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="704.188">The experience did not bear out our initial assumption.</tspan></text><text x="28" y="742.668" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="765.164">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="791.064">changing its object or word order.</tspan></text><text x="28" y="829.544" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="852.04">A: How can we share a meal?</tspan><tspan x="28" y="877.9399999999999">B: The experience did not bear out our initial assumption.</tspan><tspan x="28" y="903.8399999999999">A: That gives us a starting point.</tspan><tspan x="28" y="929.74">B: Let us try it together.</tspan></text><text x="28" y="1255.84" font-family="Arial, sans-serif" font-size="11.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="20.720000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1278.336">Compare your first answer with this question: Explain “bear</tspan><tspan x="28" y="1304.236">out” in your own words, then use it in a sentence about around</tspan><tspan x="28" y="1330.136">the table. (Model: It means to support or confirm a claim.</tspan><tspan x="28" y="1356.036">Example: The experience did not bear out our initial</tspan><tspan x="28" y="1381.936">assumption.)</tspan></text></svg>