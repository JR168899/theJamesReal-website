<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>discerning</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/02/05 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Looking at alternatives helps people make a considered choice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Looking at alternatives helps people make a considered choice.</tspan></text><a href="https://www.pexels.com/photo/colleagues-using-a-laptop-7212946/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7212946</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">discerning</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /dɪˈsɝnɪŋ/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">discerning · more discerning · most discerning; noun:</tspan><tspan x="28" y="566.88">discernment</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">able to notice differences and make careful</tspan><tspan x="28" y="683.2704">judgements</tspan></text><text x="28" y="733.1904000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="762.3744">perceptive; judicious</tspan></text><text x="28" y="812.2944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="841.4784000000001">A discerning shopper considers durability as well</tspan><tspan x="28" y="875.0784000000001">as price.</tspan></text><text x="28" y="924.9984000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="954.1824">Topic: Choosing with care. Write one sentence</tspan><tspan x="28" y="987.7824">using this word. Check that your sentence keeps</tspan><tspan x="28" y="1021.3824000000001">the meaning shown above.</tspan></text><text x="28" y="1071.3024" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1100.4864000000002">A: What does “discerning” mean?</tspan><tspan x="28" y="1134.0864000000001">B: It means able to notice differences and make</tspan><tspan x="28" y="1167.6864000000003">careful judgements.</tspan><tspan x="28" y="1201.2864000000002">A: Can we use it at a neighbourhood market?</tspan><tspan x="28" y="1234.8864000000003">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1284.8064" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1313.9904000000001">Which word means “able to notice differences</tspan><tspan x="28" y="1347.5904">and make careful judgements”: discerning or</tspan><tspan x="28" y="1381.1904000000002">provenance?</tspan></text></svg>