<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>The significance of a decision is not exhausted by its efficiency.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C2 - 2026/12/19 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>The significance of a decision is not exhausted by its efficiency.</title><desc>Original family-manga illustration: plant, related to The significance of a decision is not exhausted by its efficiency..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#83cf6e"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="38.87" font-weight="700" fill="#2c3540"><tspan x="28" y="470.87">The significance of a decision</tspan><tspan x="28" y="519.4575">is not exhausted by its</tspan><tspan x="28" y="568.045">efficiency.</tspan></text><text x="28" y="620.8575000000001" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="646.5455000000001">A decision should be judged by its effects on people as</tspan><tspan x="28" y="676.1205000000001">well as by its use of time or resources.</tspan></text><text x="28" y="720.0605" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="745.7485">A choice has value beyond its practical economy.;</tspan><tspan x="28" y="775.3235000000001">Efficiency is only one measure of a decision.</tspan></text><text x="28" y="819.2635" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="844.9515">For example, we note which window gives the plant</tspan><tspan x="28" y="874.5265">enough light without scorching its leaves.</tspan></text><text x="28" y="918.4665" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="944.1545">Read this as a reflection, not a factual rule. Relate it to a</tspan><tspan x="28" y="973.7295">specific action in the example, and explain why you</tspan><tspan x="28" y="1003.3045">agree or disagree.</tspan></text><text x="28" y="1047.2445" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="1072.9325000000001">A: What did we learn from that experience?</tspan><tspan x="28" y="1102.5075000000002">B: The significance of a decision is not exhausted by its</tspan><tspan x="28" y="1132.0825000000002">efficiency.</tspan><tspan x="28" y="1161.6575">A: What do you mean?</tspan><tspan x="28" y="1191.2325">B: A decision should be judged by its effects on people</tspan><tspan x="28" y="1220.8075000000001">as well as by its use of time or resources.</tspan></text><text x="28" y="1264.7475" font-family="Arial, sans-serif" font-size="13.52" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.66" font-weight="400" fill="#2c3540"><tspan x="28" y="1290.4355">Explain your reasoning to a partner. Which action in</tspan><tspan x="28" y="1320.0105">today’s topic illustrates this reflection? (Model: We note</tspan><tspan x="28" y="1349.5855000000001">which window gives the plant enough light without</tspan><tspan x="28" y="1379.1605">scorching its leaves.)</tspan></text></svg>