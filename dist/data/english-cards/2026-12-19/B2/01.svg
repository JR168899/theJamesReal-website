y="663.3765000000001">community or situation</tspan></text><text x="28" y="714.5965" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="744.5405000000001">tradition; customary practice</tspan></text><text x="28" y="795.7605" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="825.7045">Our neighbors explained their holiday custom.</tspan></text><text x="28" y="876.9245" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="906.8685">Topic: A Christmas celebration shaped by care.</tspan><tspan x="28" y="941.3435000000001">Write one sentence using this word. Check that</tspan><tspan x="28" y="975.8185000000001">your sentence keeps the meaning shown</tspan><tspan x="28" y="1010.2935">above.</tspan></text><text x="28" y="1061.5135" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1091.4575">A: What does “custom” mean?</tspan><tspan x="28" y="1125.9325">B: It means a usual way of behaving in a</tspan><tspan x="28" y="1160.4075">particular community or situation.</tspan><tspan x="28" y="1194.8825">A: Can we use it at a Christmas gathering?</tspan><tspan x="28" y="1229.3575">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1280.5775" font-family="Arial, sans-serif" font-size="15.760000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.580000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1310.5215">Which word means “a usual way of behaving in</tspan><tspan x="28" y="1344.9965">a particular community or situation”: custom or</tspan><tspan x="28" y="1379.4715">charitable?</tspan></text></svg>