<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I will honour Christmas in my heart, and try to keep it all the year.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/12/19 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations mark a Christmas gathering.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations mark a Christmas gathering.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="37.03000000000001" font-weight="700" fill="#2c3540"><tspan x="28" y="469.03000000000003">I will honour Christmas in my</tspan><tspan x="28" y="515.3175">heart, and try to keep it all the</tspan><tspan x="28" y="561.605">year.</tspan></text><text font-family="Arial, sans-serif" font-size="16.1" font-weight="400" fill="#2c3540"><tspan x="28" y="586.9625000000001">Charles Dickens · A Christmas Carol, Stave Four · Published 1843</tspan></text><text x="28" y="631.2375000000001" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="655.7095">The speaker promises to carry the spirit of a celebration</tspan><tspan x="28" y="683.8845">into ordinary life.</tspan></text><text x="28" y="725.7445000000001" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="750.2165000000001">Keep practicing generosity beyond the holiday; Let an</tspan><tspan x="28" y="778.3915000000001">occasion influence everyday conduct</tspan></text><text x="28" y="820.2515000000002" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="844.7235000000002">After the gathering, we continue checking whether our</tspan><tspan x="28" y="872.8985000000001">neighbor needs help.</tspan></text><text x="28" y="914.7585000000003" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="939.2305000000002">Scrooge speaks this line after confronting the</tspan><tspan x="28" y="967.4055000000002">consequences of his conduct. The quotation expresses his</tspan><tspan x="28" y="995.5805000000003">resolution; it is not a statement that everyone celebrates</tspan><tspan x="28" y="1023.7555000000002">the holiday.</tspan></text><text x="28" y="1065.6155000000003" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="1090.0875">A: Which line caught your attention?</tspan><tspan x="28" y="1118.2625">B: “I will honour Christmas in my heart, and try to keep it all</tspan><tspan x="28" y="1146.4375">the year.”</tspan><tspan x="28" y="1174.6125000000002">A: How does that connect with the example?</tspan><tspan x="28" y="1202.7875000000001">B: Continuing to help after the occasion turns a seasonal</tspan><tspan x="28" y="1230.9625">promise into an everyday action.</tspan></text><text x="28" y="1272.8225000000004" font-family="Arial, sans-serif" font-size="12.880000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.540000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="1297.2945000000002">Explain how the example illustrates the quoted idea. Which</tspan><tspan x="28" y="1325.4695000000002">detail supports your explanation? (Model: Continuing to</tspan><tspan x="28" y="1353.6445">help after the occasion turns a seasonal promise into an</tspan><tspan x="28" y="1381.8195000000003">everyday action.)</tspan></text></svg>