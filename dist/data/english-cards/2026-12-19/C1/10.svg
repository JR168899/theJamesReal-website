<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Christmas?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/12/19 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Gifts and decorations mark a Christmas gathering.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Gifts and decorations mark a Christmas gathering.</tspan></text><a href="https://www.pexels.com/photo/family-christmas-celebration-with-tree-and-gifts-35281507/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35281507</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#353331"><tspan x="28" y="482.0">What would you like to</tspan><tspan x="28" y="544.5">do for Christmas?</tspan></text><text x="28" y="613.1" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="646.54">An open question that invites a person to</tspan><tspan x="28" y="685.04">describe a familiar experience.</tspan></text><text x="28" y="742.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="775.68">What would you like to do for Christmas?</tspan></text><text x="28" y="832.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="866.3199999999999">Ask this as a genuine question. Listen to</tspan><tspan x="28" y="904.8199999999999">the answer, then ask a related follow-up.</tspan></text><text x="28" y="962.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="995.4599999999999">A: What would you like to do for Christmas?</tspan><tspan x="28" y="1033.96">B: I would like to prepare a Christmas</tspan><tspan x="28" y="1072.46">gathering.</tspan><tspan x="28" y="1110.96">A: What should we prepare?</tspan><tspan x="28" y="1149.46">B: For example, we agree on a small gift</tspan><tspan x="28" y="1187.96">budget and reuse wrapping materials.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1295.04">Write a reply of your own, then ask one</tspan><tspan x="28" y="1333.54">related question.</tspan></text></svg>