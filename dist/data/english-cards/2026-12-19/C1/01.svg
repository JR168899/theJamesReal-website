<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>incremental</title><rect width="660" height="1434" fill="#efd6d5"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#382d2e" stroke-width="1"/><text x="35" y="43" fill="#382d2e" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C1   2026-12-19</tspan></text><text x="35" y="88" fill="#382d2e" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">incremental</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>incremental</title><desc>Original hand-drawn story illustration: ladder, set within garden. happening through a series of small changes</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(0) scale(1.4)"><path d="M-40 70L-15-73M25 70L50-73M-12-55H47M-20-20H40M-26 15H34M-33 50H28"/></g><g transform="translate(94 266) rotate(0) scale(0.52)"><path d="M-35 20H35L23 65H-23Z" fill="#d7a27c"/><path d="M0 22V-65M0-18Q-73-24-45-67Q-1-67 0-18ZM0 0Q64-6 49-47Q8-50 0 0Z" fill="#9db8a0"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">incremental</text></svg><text x="35" y="514.4" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">happening through a series of small changes</tspan></text><text x="35" y="590.8" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="615.3599999999999" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Topic: Growing something small. Write one sentence using</tspan><tspan x="35" dy="24.839999999999996">this word. Check that your sentence keeps the meaning</tspan><tspan x="35" dy="24.839999999999996">shown above.</tspan></text><text x="35" y="716.8799999999999" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="741.4399999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: What does “incremental” mean?</tspan><tspan x="35" dy="24.839999999999996">B: It means happening through a series of small changes.</tspan><tspan x="35" dy="24.839999999999996">A: Can we use it in a small garden?</tspan><tspan x="35" dy="24.839999999999996">B: Yes. Let us think of a clear example.</tspan></text><text x="35" y="867.7999999999998" fill="#382d2e" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="892.3599999999998" fill="#382d2e" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Explain your reasoning to a partner. Which word means</tspan><tspan x="35" dy="24.839999999999996">“happening through a series of small changes”: incremental</tspan><tspan x="35" dy="24.839999999999996">or stewardship?</tspan></text><text x="35" y="1406" fill="#382d2e" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">VOCABULARY   /   01 OF 11</tspan></text></svg>