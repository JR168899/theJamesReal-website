<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>implicit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/07/11 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A reader makes notes beside an open book.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A reader makes notes beside an open book.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="38.410000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="470.41">implicit</tspan></text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="503.3925">US /ɪmˈplɪsɪt/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="18.37" font-weight="400" fill="#382d2e"><tspan x="28" y="526.9060999999999">Adjective: implicit; related noun: implication</tspan></text><text x="28" y="573.5325" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="598.9165">suggested without being stated directly</tspan></text><text x="28" y="642.3365" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="667.7205">implied; unstated</tspan></text><text x="28" y="711.1405" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="736.5245">There is an implicit agreement to help clear the table.</tspan></text><text x="28" y="779.9445" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="805.3285">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="834.5535">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="863.7785">description rather than using it as a general compliment.</tspan></text><text x="28" y="907.1985" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="932.5825">Kore: The invitation never says we must bring food.</tspan><tspan x="28" y="961.8075">Onyx: But that expectation seems implicit in the list of</tspan><tspan x="28" y="991.0325">dishes.</tspan><tspan x="28" y="1020.2574999999999">Kore: We should check rather than assume.</tspan><tspan x="28" y="1049.4825">Onyx: I will ask the host directly.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.380000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1282.7440000000001">An invitation lists guests beside dishes but gives no direct</tspan><tspan x="28" y="1311.969">instruction. Identify the possible implicit expectation.</tspan><tspan x="28" y="1341.1940000000002">(Model: Guests may be expected to bring the dish beside</tspan><tspan x="28" y="1370.419">their name, but the expectation should be checked.)</tspan></text></svg>