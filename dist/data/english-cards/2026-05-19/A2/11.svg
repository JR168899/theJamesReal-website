<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Plans for a rainy day</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/05/19 - Essay - 01</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">People continue their journey in rainy weather.</tspan></text><a href="https://www.pexels.com/photo/unrecognizable-person-walking-in-rain-under-umbrella-12327578/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 12327578</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Plans for a rainy day</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="160.0">When we change our plans, a little care can make the experience better. Planning and thinking</tspan><tspan x="42" y="186.91">about other people both help.</tspan></text><text x="42" y="218.82" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="246.82">First, a backup plan makes a change less disappointing. For example, we choose a museum</tspan><tspan x="42" y="273.73">when rain makes the outdoor walk uncomfortable. This is a small thing that makes the day easier.</tspan></text><text x="42" y="305.64" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="333.64">Second, telling other people early helps everyone adjust. For example, we send a clear message</tspan><tspan x="42" y="360.54999999999995">about the new meeting place before anyone leaves home. We do not need a perfect day to do</tspan><tspan x="42" y="387.46">this well.</tspan></text><text x="42" y="419.37" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#37322b"><tspan x="42" y="447.37">We can change our plans more easily when we prepare and notice other people. These simple</tspan><tspan x="42" y="474.28">steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="524.19">BUILD YOUR OWN · State a clear main idea; develop two different points with examples; bring them together in the</tspan><tspan x="42" y="546.1500000000001">conclusion. Each body paragraph needs a distinct point and a concrete example. The conclusion should connect the</tspan><tspan x="42" y="568.11">argument rather than introduce a new proposal.</tspan><tspan x="42" y="590.07">Describe a small change that helps you change our plans. Give two examples. Use four short paragraphs: introduction, two</tspan><tspan x="42" y="612.0300000000001">developed points, and conclusion.</tspan></text></svg>