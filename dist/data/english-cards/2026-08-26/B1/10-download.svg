<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What do you notice when you explore a new neighborhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/08/26 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pedestrians share a street crossing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pedestrians share a street crossing.</tspan></text><a href="https://www.pexels.com/photo/people-walking-on-pedestrian-lane-during-daytime-109919/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 109919</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">What do you notice when you</tspan><tspan x="28" y="525.6675">explore a new neighborhood?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">What do you notice when you explore a new</tspan><tspan x="28" y="747.664">neighborhood?</tspan></text><text x="28" y="794.7239999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="822.236">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="853.911">different preference or a declined invitation without</tspan><tspan x="28" y="885.586">asking the person to justify it.</tspan></text><text x="28" y="932.646" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="960.158">Sky: Do you head straight for the main sights?</tspan><tspan x="28" y="991.833">Michael: I usually walk a little first.</tspan><tspan x="28" y="1023.508">Sky: What catches your eye?</tspan><tspan x="28" y="1055.183">Michael: Small shops and places where people stop</tspan><tspan x="28" y="1086.858">to talk.</tspan><tspan x="28" y="1118.533">Sky: Would you rather explore alone or with a local?</tspan><tspan x="28" y="1150.208">Michael: Both give you a different view. A local can</tspan><tspan x="28" y="1181.883">explain things I might miss.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">A visitor enjoys small neighborhood details. Suggest</tspan><tspan x="28" y="1317.667">an outing and explain why it may appeal. (Model: We</tspan><tspan x="28" y="1349.3419999999999">could walk through the market street; you can see the</tspan><tspan x="28" y="1381.017">small shops and how people use the space.)</tspan></text></svg>