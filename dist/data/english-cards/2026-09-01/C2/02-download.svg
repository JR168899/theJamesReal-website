<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>phenology</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/09/01 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Changing leaves mark the passing of seasons.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Changing leaves mark the passing of seasons.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="44.160000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="476.16">phenology</tspan></text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="514.08">US /fəˈnɑlədʒi/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="21.12" font-weight="400" fill="#382d2e"><tspan x="28" y="541.1136">Usually uncountable: phenology; no regular plural in this</tspan><tspan x="28" y="566.88">sense.</tspan></text><text x="28" y="620.4864" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="649.6704">the study of seasonal events in living things</tspan></text><text x="28" y="699.5904" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="728.7744">study of seasonal biological timing</tspan></text><text x="28" y="778.6944000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="807.8784">Phenology records when plants flower and birds</tspan><tspan x="28" y="841.4784000000001">migrate.</tspan></text><text x="28" y="891.3984000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="920.5824000000001">Phenology concerns the timing of recurring</tspan><tspan x="28" y="954.1824000000001">biological events, such as flowering or migration,</tspan><tspan x="28" y="987.7824000000002">not simply identifying species.</tspan></text><text x="28" y="1037.7024000000001" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1066.8864000000003">Sarah: Why record the first flowering date each</tspan><tspan x="28" y="1100.4864000000002">year?</tspan><tspan x="28" y="1134.0864000000004">Liam: It gives us phenological observations.</tspan><tspan x="28" y="1167.6864000000003">Sarah: Not simply a list of species?</tspan><tspan x="28" y="1201.2864000000004">Liam: No. Phenology concerns the timing of</tspan><tspan x="28" y="1234.8864000000003">recurring biological events.</tspan></text><text x="28" y="1284.8064000000002" font-family="Arial, sans-serif" font-size="15.360000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.880000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1313.9904000000004">Would recording a plant&#x27;s first flowering date</tspan><tspan x="28" y="1347.5904000000003">contribute to phenology? Explain. (Model: Yes. It</tspan><tspan x="28" y="1381.1904000000004">records the timing of a recurring biological event.)</tspan></text></svg>