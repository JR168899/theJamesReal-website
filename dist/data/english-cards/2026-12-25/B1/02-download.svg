<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>generosity</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/12/25 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#382d2e"><tspan x="28" y="474.78">generosity</tspan></text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="511.51500000000004">US /ˌdʒɛnəˈrɑsəti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.46" font-weight="400" fill="#382d2e"><tspan x="28" y="537.7038000000001">Usually uncountable: generosity; no regular plural in this sense.</tspan></text><text x="28" y="589.635" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="617.9069999999999">a willingness to give time, help or possessions to</tspan><tspan x="28" y="650.4569999999999">others</tspan></text><text x="28" y="698.817" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="727.0889999999999">willingness to give; liberality</tspan></text><text x="28" y="775.449" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="803.7209999999999">Her generosity made the shared celebration</tspan><tspan x="28" y="836.2709999999998">possible.</tspan></text><text x="28" y="884.631" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="912.9029999999999">Keep the sense and countability shown in the</tspan><tspan x="28" y="945.4529999999999">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="978.0029999999999">the specific person, object or event being discussed.</tspan></text><text x="28" y="1026.363" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1054.635">Sky: The gift is generous, but can she afford it?</tspan><tspan x="28" y="1087.185">Michael: Generosity should not require spending</tspan><tspan x="28" y="1119.735">beyond her means.</tspan><tspan x="28" y="1152.285">Sky: Could we suggest another way to help?</tspan><tspan x="28" y="1184.835">Michael: Her time and practical support would matter</tspan><tspan x="28" y="1217.385">too.</tspan></text><text x="28" y="1265.7450000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1294.017">Name a generous action that does not depend on</tspan><tspan x="28" y="1326.567">spending much money. (Model: Offer time or</tspan><tspan x="28" y="1359.117">practical help with a task someone finds difficult.)</tspan></text></svg>