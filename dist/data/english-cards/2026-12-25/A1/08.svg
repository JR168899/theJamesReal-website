<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I will honour Christmas in my heart, and try to keep it all the year.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/12/25 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="43.24" font-weight="700" fill="#2c3540"><tspan x="28" y="475.24">I will honour Christmas in my</tspan><tspan x="28" y="529.29">heart, and try to keep it all</tspan><tspan x="28" y="583.34">the year.</tspan></text><text font-family="Arial, sans-serif" font-size="18.8" font-weight="400" fill="#2c3540"><tspan x="28" y="612.9499999999999">Charles Dickens · A Christmas Carol, Stave Four · Published 1843</tspan></text><text x="28" y="664.65" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="693.2260000000001">The speaker promises to carry the spirit of a</tspan><tspan x="28" y="726.1260000000001">celebration into ordinary life.</tspan></text><text x="28" y="775.006" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="803.5820000000001">Keep practicing generosity beyond the holiday; Let</tspan><tspan x="28" y="836.4820000000001">an occasion influence everyday conduct</tspan></text><text x="28" y="885.362" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="913.9380000000001">After the gathering, we continue checking whether</tspan><tspan x="28" y="946.8380000000001">our neighbor needs help.</tspan></text><text x="28" y="995.718" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="1024.294">Scrooge speaks this line after confronting the</tspan><tspan x="28" y="1057.1940000000002">consequences of his conduct. The quotation</tspan><tspan x="28" y="1090.094">expresses his resolution; it is not a statement that</tspan><tspan x="28" y="1122.9940000000001">everyone celebrates the holiday.</tspan></text><text x="28" y="1171.874" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="1200.45">A: Does the promise end after Christmas?</tspan><tspan x="28" y="1233.3500000000001">B: No. He wants to keep it all year.</tspan><tspan x="28" y="1266.25">A: How could he show that?</tspan><tspan x="28" y="1299.15">B: By continuing to be kind to people.</tspan></text><text x="28" y="1348.03" font-family="Arial, sans-serif" font-size="15.040000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.32" font-weight="400" fill="#2c3540"><tspan x="28" y="1376.606">Give one example of kindness after a holiday is over.</tspan></text></svg>