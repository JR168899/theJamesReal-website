<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I will honour Christmas in my heart, and try to keep it all the year.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/12/25 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Friends share food and conversation outdoors.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Friends share food and conversation outdoors.</tspan></text><a href="https://www.pexels.com/photo/friends-sharing-snacks-to-each-other-7624934/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7624934</text></a></svg><text font-family="Arial, sans-serif" font-size="37.95" font-weight="700" fill="#2c3540"><tspan x="28" y="469.95">I will honour Christmas in my</tspan><tspan x="28" y="517.3875">heart, and try to keep it all the</tspan><tspan x="28" y="564.825">year.</tspan></text><text font-family="Arial, sans-serif" font-size="16.5" font-weight="400" fill="#2c3540"><tspan x="28" y="590.8125">Charles Dickens · A Christmas Carol, Stave Four · Published 1843</tspan></text><text x="28" y="636.1875" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="661.2674999999999">The speaker promises to carry the spirit of a celebration</tspan><tspan x="28" y="690.1424999999999">into ordinary life.</tspan></text><text x="28" y="733.0425" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="758.1225">Keep practicing generosity beyond the holiday; Let an</tspan><tspan x="28" y="786.9975">occasion influence everyday conduct</tspan></text><text x="28" y="829.8975" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="854.9775">After the gathering, we continue checking whether our</tspan><tspan x="28" y="883.8525">neighbor needs help.</tspan></text><text x="28" y="926.7525" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="951.8325">Scrooge speaks this line after confronting the</tspan><tspan x="28" y="980.7075">consequences of his conduct. The quotation expresses his</tspan><tspan x="28" y="1009.5825">resolution; it is not a statement that everyone celebrates</tspan><tspan x="28" y="1038.4575">the holiday.</tspan></text><text x="28" y="1081.3575" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1106.4375">Kore: Why does Scrooge say all the year?</tspan><tspan x="28" y="1135.3125">Onyx: He wants the change to outlast the holiday.</tspan><tspan x="28" y="1164.1875">Kore: So the promise is about continuing conduct?</tspan><tspan x="28" y="1193.0625">Onyx: Yes. Its meaning depends on how he treats people</tspan><tspan x="28" y="1221.9375">afterward.</tspan></text><text x="28" y="1264.8375" font-family="Arial, sans-serif" font-size="13.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#2c3540"><tspan x="28" y="1289.9175">Suggest one action that could give practical meaning to</tspan><tspan x="28" y="1318.7925">keeping generosity beyond a holiday. (Model: Continue</tspan><tspan x="28" y="1347.6675">offering considerate help during ordinary weeks, rather</tspan><tspan x="28" y="1376.5425">than limiting it to the celebration.)</tspan></text></svg>