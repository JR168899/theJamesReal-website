<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Consideration becomes visible through practical decisions.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - C1 - 2026/10/09 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Consideration becomes visible through practical decisions.</title><desc>Original family-manga illustration: plate, related to Consideration becomes visible through practical decisions..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse rx="65" ry="38" fill="#e9d2a9"/><ellipse rx="43" ry="23"/><path d="M-84-40V43M-94-40V-13Q-84 1-74-13V-40M85-40V43M85-40Q59-12 85-4"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="40.94" font-weight="700" fill="#2c3540"><tspan x="28" y="472.94">Consideration becomes visible</tspan><tspan x="28" y="524.115">through practical decisions.</tspan></text><text x="28" y="579.74" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="606.7959999999999">Care for other people is demonstrated by choices that</tspan><tspan x="28" y="637.9459999999999">respond to their actual needs.</tspan></text><text x="28" y="684.226" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="711.2819999999999">Thoughtfulness shows in what we do.; Care takes</tspan><tspan x="28" y="742.4319999999999">shape in everyday choices.</tspan></text><text x="28" y="788.712" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="815.7679999999999">For example, each guest brings one dish and helps</tspan><tspan x="28" y="846.9179999999999">clear the table.</tspan></text><text x="28" y="893.198" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="920.2539999999999">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="951.4039999999999">to a specific action in the example, and explain why</tspan><tspan x="28" y="982.5539999999999">you agree or disagree.</tspan></text><text x="28" y="1028.8339999999998" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1055.89">A: What did we learn from that experience?</tspan><tspan x="28" y="1087.0400000000002">B: Consideration becomes visible through practical</tspan><tspan x="28" y="1118.19">decisions.</tspan><tspan x="28" y="1149.3400000000001">A: What do you mean?</tspan><tspan x="28" y="1180.49">B: Care for other people is demonstrated by choices</tspan><tspan x="28" y="1211.64">that respond to their actual needs.</tspan></text><text x="28" y="1258.24" font-family="Arial, sans-serif" font-size="14.24" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.92" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.296">Compare your first answer with this question: Which</tspan><tspan x="28" y="1316.4460000000001">action in today’s topic illustrates this reflection?</tspan><tspan x="28" y="1347.596">(Model: Each guest brings one dish and helps clear</tspan><tspan x="28" y="1378.746">the table.)</tspan></text></svg>