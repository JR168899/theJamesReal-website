<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a piece of cake</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/05/06 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#383426"><tspan x="28" y="477.08">a piece of cake</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">something very easy; informal</tspan></text><text x="28" y="619.082" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="648.8740000000001">a breeze; very easy</tspan></text><text x="28" y="699.834" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="729.6260000000001">The first step was a piece of cake.</tspan></text><text x="28" y="780.5859999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="810.378">Learn the whole expression. It is figurative</tspan><tspan x="28" y="844.678">language, so a word-for-word interpretation may</tspan><tspan x="28" y="878.9780000000001">be misleading.</tspan></text><text x="28" y="929.9379999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="959.73">A: How would you express this idea?</tspan><tspan x="28" y="994.03">B: a piece of cake</tspan><tspan x="28" y="1028.33">A: What does that mean here?</tspan><tspan x="28" y="1062.63">B: something very easy; informal</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Try without help. What does “a piece of cake”</tspan><tspan x="28" y="1323.772">mean in this example? The first step was a piece</tspan><tspan x="28" y="1358.072">of cake. (Model: Something very easy; informal.)</tspan></text></svg>