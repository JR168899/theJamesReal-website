<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually explore a neighbourhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/12/13 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Buildings and streets form a city neighborhood.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Buildings and streets form a city neighborhood.</tspan></text><a href="https://www.pexels.com/photo/bustling-city-street-with-historic-architecture-30726137/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 30726137</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#353331"><tspan x="28" y="480.3">How do you usually</tspan><tspan x="28" y="540.6750000000001">explore a neighbourhood?</tspan></text><text x="28" y="606.3" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="638.22">An open question that invites a person to</tspan><tspan x="28" y="674.97">describe a familiar experience.</tspan></text><text x="28" y="729.5699999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="761.49">How do you usually explore a neighbourhood?</tspan></text><text x="28" y="816.0899999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="848.01">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="884.76">answer, then ask a related follow-up.</tspan></text><text x="28" y="939.3599999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="971.28">A: How do you usually explore a</tspan><tspan x="28" y="1008.03">neighbourhood?</tspan><tspan x="28" y="1044.78">B: I start with a simple plan, but I can change it.</tspan><tspan x="28" y="1081.53">A: What has helped you most?</tspan><tspan x="28" y="1118.28">B: For example, we stop to look at a doorway</tspan><tspan x="28" y="1155.03">instead of hurrying to the next landmark.</tspan></text><text x="28" y="1260.8" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#353331"><tspan x="28" y="1292.72">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1329.47">Write a reply of your own, then ask one related</tspan><tspan x="28" y="1366.22">question.</tspan></text></svg>