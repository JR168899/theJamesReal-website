<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Getting to know a city</title><rect width="1434" height="660" fill="#f1eadc"/><rect x="15" y="15" width="1404" height="630" fill="none" stroke="#37322b" stroke-width="1"/><text x="35" y="43" fill="#37322b" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   C2   2026-12-13</tspan></text><text x="35" y="88" fill="#37322b" font-family="Georgia" font-size="32" font-weight="bold"><tspan x="35" dy="0">Getting to know a city</tspan></text><svg x="1130" y="53" width="250" height="144" viewBox="0 0 660 380"><title>Getting to know a city</title><desc>Original hand-drawn story illustration: city, set within city. A four-paragraph model with a main idea, two developed points, and a conclusion.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-3) scale(1.5)"><path d="M-75 60V-15H-35V60M-21 60V-60H21V60M35 60V-31H75V60M-90 62H90M-64 0H-49M-64 17H-49M-64 34H-49M-9-39H9M-9-20H9M-9 0H9M-9 20H9M48-13H63M48 8H63M48 30H63" fill="#c6b8a5"/></g><g transform="translate(95 264) rotate(3) scale(0.5)"><rect x="-51" y="-65" width="104" height="132" rx="7" fill="#b9c7ad"/><path d="M-29-65V67M-10-37H30M-10-18H30M-10 1H30M-10 20H22M66 44L91-36L101-33L77 47Z"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">Getting to know a city</text></svg><text x="36" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="36" dy="0">Introduction — state the main</tspan><tspan x="36" dy="20.7">idea</tspan></text><text x="36" y="270" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="36" dy="0">To explore a neighbourhood is to</tspan><tspan x="36" dy="20.7">negotiate a familiar but frequently</tspan><tspan x="36" dy="20.7">obscured relationship between</tspan><tspan x="36" dy="20.7">intentional design and the</tspan><tspan x="36" dy="20.7">contingencies of shared experience.</tspan><tspan x="36" dy="20.7">The question is not whether</tspan><tspan x="36" dy="20.7">arrangements are desirable, but what</tspan><tspan x="36" dy="20.7">authority they should acquire. A</tspan><tspan x="36" dy="20.7">credible position supports preparation</tspan><tspan x="36" dy="20.7">while withholding the assumption that</tspan><tspan x="36" dy="20.7">procedural coherence is equivalent to</tspan><tspan x="36" dy="20.7">human value.</tspan></text><text x="384" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="384" dy="0">Body 1 — reason and example</tspan></text><text x="384" y="270" fill="#37322b" font-family="Arial" font-size="14" font-weight="normal"><tspan x="384" dy="0">There is a substantive case for</tspan><tspan x="384" dy="19.32">structure: walking slowly helps us</tspan><tspan x="384" dy="19.32">notice details we usually miss. Here, we</tspan><tspan x="384" dy="19.32">stop to look at a doorway instead of</tspan><tspan x="384" dy="19.32">hurrying to the next landmark. The</tspan><tspan x="384" dy="19.32">arrangement earns its legitimacy through</tspan><tspan x="384" dy="19.32">the specific difficulty it alleviates,</tspan><tspan x="384" dy="19.32">not through its conformity to an</tspan><tspan x="384" dy="19.32">abstract ideal of order. Its success is</tspan><tspan x="384" dy="19.32">consequently conditional. Once the</tspan><tspan x="384" dy="19.32">intervention demands more attention than</tspan><tspan x="384" dy="19.32">the obstacle it removes, the original</tspan><tspan x="384" dy="19.32">justification begins to unravel.</tspan></text><text x="732" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="732" dy="0">Body 2 — second reason and</tspan><tspan x="732" dy="20.7">example</tspan></text><text x="732" y="270" fill="#37322b" font-family="Arial" font-size="14" font-weight="normal"><tspan x="732" dy="0">An assessment confined to that practical</tspan><tspan x="732" dy="19.32">benefit would nevertheless be</tspan><tspan x="732" dy="19.32">incomplete, since respecting local</tspan><tspan x="732" dy="19.32">routines makes a visit more considerate.</tspan><tspan x="732" dy="19.32">In concrete terms, we keep an entrance</tspan><tspan x="732" dy="19.32">clear while taking a photograph of the</tspan><tspan x="732" dy="19.32">street. This introduces a problem of</tspan><tspan x="732" dy="19.32">perspective: whose convenience supplies</tspan><tspan x="732" dy="19.32">the standard against which improvement</tspan><tspan x="732" dy="19.32">is measured? An apparently neutral</tspan><tspan x="732" dy="19.32">procedure may privilege the preferences</tspan><tspan x="732" dy="19.32">of its designer. Attentiveness to others</tspan><tspan x="732" dy="19.32">makes that asymmetry visible and creates</tspan><tspan x="732" dy="19.32">grounds for revision.</tspan></text><text x="1080" y="210" fill="#37322b" font-family="Arial" font-size="15" font-weight="bold"><tspan x="1080" dy="0">Conclusion — connect both</tspan><tspan x="1080" dy="20.7">reasons</tspan></text><text x="1080" y="270" fill="#37322b" font-family="Arial" font-size="16" font-weight="normal"><tspan x="1080" dy="0">What emerges is a qualified defence</tspan><tspan x="1080" dy="22.08">of planning, rather than a</tspan><tspan x="1080" dy="22.08">celebration of either control or</tspan><tspan x="1080" dy="22.08">spontaneity. Arrangements can</tspan><tspan x="1080" dy="22.08">sustain an experience without</tspan><tspan x="1080" dy="22.08">exhausting its meaning. Their</tspan><tspan x="1080" dy="22.08">authority should remain answerable</tspan><tspan x="1080" dy="22.08">to the people and circumstances</tspan><tspan x="1080" dy="22.08">they affect; otherwise, a means of</tspan><tspan x="1080" dy="22.08">making life more habitable risks</tspan><tspan x="1080" dy="22.08">becoming the criterion to which</tspan><tspan x="1080" dy="22.08">life must conform.</tspan></text><text x="35" y="580" fill="#37322b" font-family="Arial" font-size="15" font-weight="normal"><tspan x="35" dy="0">YOUR TURN · Apply the idea to a real situation, then answer: What two reasons support the main idea? Explain one example.</tspan></text><text x="35" y="632" fill="#37322b" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">ESSAY   /   11 OF 11</tspan></text></svg>