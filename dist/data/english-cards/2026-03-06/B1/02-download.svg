<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>notice</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/03/06 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Paying attention makes the details of an ordinary setting easier to see.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Paying attention makes the details of an ordinary setting easier to see.</tspan></text><a href="https://www.pexels.com/photo/a-cozy-couch-near-the-window-and-plants-6914713/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6914713</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="477.08">notice</tspan></text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="515.7900000000001">US /ˈnoʊtɪs/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="543.3868">notice · notices · noticed · noticed · noticing (base · third</tspan><tspan x="28" y="569.69">person · past · past participle · -ing)</tspan></text><text x="28" y="624.4132" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="654.2052000000001">to become aware of something</tspan></text><text x="28" y="705.1652" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="734.9572000000002">observe; become aware of</tspan></text><text x="28" y="785.9172" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="815.7092000000001">I notice a small plant beside the door.</tspan></text><text x="28" y="866.6691999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="896.4612000000001">Topic: Getting to know a city. Write one sentence</tspan><tspan x="28" y="930.7612">using this word. Check that your sentence keeps</tspan><tspan x="28" y="965.0612000000001">the meaning shown above.</tspan></text><text x="28" y="1016.0211999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1045.8132">A: What does “notice” mean?</tspan><tspan x="28" y="1080.1132">B: It means to become aware of something.</tspan><tspan x="28" y="1114.4132">A: Can we use it on a city walk?</tspan><tspan x="28" y="1148.7132000000001">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#382d2e"><tspan x="28" y="1289.472">Explain the meaning before looking at the model</tspan><tspan x="28" y="1323.772">answer. Which word means “to become aware of</tspan><tspan x="28" y="1358.072">something”: notice or landmark? (Model: notice)</tspan></text></svg>