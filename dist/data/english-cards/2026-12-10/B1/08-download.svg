<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A thing of beauty is a joy for ever:</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/12/10 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A greeting card sits beside flowers.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A greeting card sits beside flowers.</tspan></text><a href="https://www.pexels.com/photo/crop-woman-showing-pop-up-gift-card-with-decorative-heart-6765929/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6765929</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">A thing of beauty is a joy for</tspan><tspan x="28" y="522.045">ever:</tspan></text><text font-family="Arial, sans-serif" font-size="17.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="549.4499999999999">John Keats · Endymion, Book I · Published 1818</tspan></text><text x="28" y="597.3" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="623.748">Something beautiful can continue to give pleasure after</tspan><tspan x="28" y="654.1980000000001">the first moment.</tspan></text><text x="28" y="699.438" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="725.8860000000001">Beauty can bring lasting pleasure; A beautiful experience</tspan><tspan x="28" y="756.3360000000001">can stay with us</tspan></text><text x="28" y="801.576" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="828.0240000000001">Long after our walk, I still remember the light on the</tspan><tspan x="28" y="858.4740000000002">trees.</tspan></text><text x="28" y="903.714" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="930.1620000000001">The colon is retained from the opening line. For ever is</tspan><tspan x="28" y="960.6120000000002">an older two-word spelling of forever. This is a poetic</tspan><tspan x="28" y="991.0620000000001">claim, not a measurable promise.</tspan></text><text x="28" y="1036.3020000000001" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1062.75">A: Why would a beautiful thing continue to give joy?</tspan><tspan x="28" y="1093.2">B: Its memory or influence may last after the first</tspan><tspan x="28" y="1123.65">encounter.</tspan><tspan x="28" y="1154.1">A: Must everyone find the same thing beautiful?</tspan><tspan x="28" y="1184.55">B: No. The line invites reflection rather than establishing</tspan><tspan x="28" y="1215.0">a universal preference.</tspan></text><text x="28" y="1260.2400000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1286.688">Name one way an encounter with beauty can remain</tspan><tspan x="28" y="1317.1380000000001">meaningful after the object is no longer present. (Model:</tspan><tspan x="28" y="1347.5880000000002">A remembered image, sound or experience can continue</tspan><tspan x="28" y="1378.038">to evoke pleasure or significance.)</tspan></text></svg>