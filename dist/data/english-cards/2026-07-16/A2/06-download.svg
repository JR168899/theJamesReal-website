<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a piece of cake</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - A2 - 2026/07/16 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A puzzle provides a task to solve.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A puzzle provides a task to solve.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-assembling-the-puzzle-8535582/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8535582</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#383426"><tspan x="28" y="481.91">a piece of cake</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="582.7065000000001">something very easy; informal</tspan></text><text x="28" y="639.1265000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="672.1105000000001">a breeze; very easy</tspan></text><text x="28" y="728.5305000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="761.5145000000001">The first step was a piece of cake.</tspan></text><text x="28" y="817.9345000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="850.9185000000001">Learn the whole expression. It is figurative</tspan><tspan x="28" y="888.8935000000001">language, so a word-for-word interpretation</tspan><tspan x="28" y="926.8685000000002">may be misleading.</tspan></text><text x="28" y="983.2885000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1016.2725000000002">A: How would you express this idea?</tspan><tspan x="28" y="1054.2475000000002">B: a piece of cake</tspan><tspan x="28" y="1092.2225">A: What does that mean here?</tspan><tspan x="28" y="1130.1975000000002">B: something very easy; informal</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#383426"><tspan x="28" y="1294.344">What does “a piece of cake” mean in this</tspan><tspan x="28" y="1332.319">example? The first step was a piece of cake.</tspan><tspan x="28" y="1370.294">(Model: Something very easy; informal.)</tspan></text></svg>