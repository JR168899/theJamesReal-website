<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>follow through</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/08/10 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written task list makes actions and requirements visible.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written task list makes actions and requirements visible.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-to-do-list-near-laptop-6192123/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6192123</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="481.91">follow through</tspan></text><text x="28" y="549.7225000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="582.7065000000001">complete what you have agreed to do</tspan></text><text x="28" y="639.1265000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="672.1105000000001">carry out a commitment; see it through</tspan></text><text x="28" y="728.5305000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="761.5145000000001">A good plan matters only if we follow</tspan><tspan x="28" y="799.4895000000001">through.</tspan></text><text x="28" y="855.9095000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="888.8935000000001">Keep the particle with the verb. Check a</tspan><tspan x="28" y="926.8685000000002">dictionary before changing its object or word</tspan><tspan x="28" y="964.8435000000002">order.</tspan></text><text x="28" y="1021.2635000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1054.2475000000002">A: How can we change our plans?</tspan><tspan x="28" y="1092.2225">B: A good plan matters only if we follow</tspan><tspan x="28" y="1130.1975000000002">through.</tspan><tspan x="28" y="1168.1725000000001">A: That gives us a starting point.</tspan><tspan x="28" y="1206.1475000000003">B: Let us try it together.</tspan></text><text x="28" y="1262.5675" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#3d3028"><tspan x="28" y="1295.5515000000003">Explain your reasoning to a partner. Explain</tspan><tspan x="28" y="1333.5265000000002">“follow through” in your own words, then use</tspan><tspan x="28" y="1371.5015000000003">it in a sentence about plans for a rainy day.</tspan></text></svg>