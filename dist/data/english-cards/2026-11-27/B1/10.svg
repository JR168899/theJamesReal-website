<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually change our plans?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/11/27 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People continue their journey in rainy weather.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People continue their journey in rainy weather.</tspan></text><a href="https://www.pexels.com/photo/people-on-a-street-during-rain-19116705/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 19116705</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.91">How do you usually</tspan><tspan x="28" y="544.2975">change our plans?</tspan></text><text x="28" y="612.1100000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="645.0940000000002">An open question that invites a person to</tspan><tspan x="28" y="683.0690000000002">describe a familiar experience.</tspan></text><text x="28" y="739.4890000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="772.4730000000002">How do you usually change our plans?</tspan></text><text x="28" y="828.8930000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="861.8770000000002">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="899.8520000000002">answer, then ask a related follow-up.</tspan></text><text x="28" y="956.2720000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="989.2560000000002">A: How do you usually change our plans?</tspan><tspan x="28" y="1027.2310000000002">B: I start with a simple plan, but I can change</tspan><tspan x="28" y="1065.2060000000001">it.</tspan><tspan x="28" y="1103.1810000000003">A: What has helped you most?</tspan><tspan x="28" y="1141.1560000000002">B: For example, we choose a museum when</tspan><tspan x="28" y="1179.1310000000003">rain makes the outdoor walk uncomfortable.</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1294.344">Compare your first answer with this question:</tspan><tspan x="28" y="1332.319">Write a reply of your own, then ask one</tspan><tspan x="28" y="1370.294">related question.</tspan></text></svg>