<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>find out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A2 - 2026/04/30 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Reference books are arranged together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Reference books are arranged together.</tspan></text><a href="https://www.pexels.com/photo/a-stack-of-thick-books-on-white-surface-13745412/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 13745412</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="475.47">find something out</tspan><tspan x="28" y="529.8075">find out something</tspan></text><text x="28" y="588.87" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="617.5980000000001">learn a fact</tspan></text><text x="28" y="666.7379999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="695.466">discover; learn</tspan></text><text x="28" y="744.6059999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="773.334">Let us find out what we need.</tspan></text><text x="28" y="822.4739999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="851.2019999999999">Find out usually means discovering information. Use</tspan><tspan x="28" y="884.2769999999999">find for locating a physical object: find the keys.</tspan></text><text x="28" y="933.4169999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="962.1449999999999">Bella: Do children need a ticket?</tspan><tspan x="28" y="995.2199999999999">Fenrir: I do not know. I will find out.</tspan><tspan x="28" y="1028.2949999999998">Bella: Could you check the age limit too?</tspan><tspan x="28" y="1061.37">Fenrir: Yes. I will ask the organizer.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1287.848">You need the event&#x27;s age limit and ticket rule. Write</tspan><tspan x="28" y="1320.923">one specific question to find out both. (Model: What</tspan><tspan x="28" y="1353.998">is the age limit, and do children need a ticket?)</tspan></text></svg>