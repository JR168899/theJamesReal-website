<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>accommodate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/03/26 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Welcoming someone includes noticing what they need.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Welcoming someone includes noticing what they need.</tspan></text><a href="https://www.pexels.com/photo/couple-having-dinner-while-male-serving-food-at-table-6249016/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6249016</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">accommodate</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /əˈkɑməˌdeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">accommodate · accommodates · accommodated ·</tspan><tspan x="28" y="564.7724999999999">accommodated · accommodating (base · third person · past ·</tspan><tspan x="28" y="590.1363">past participle · -ing)</tspan></text><text x="28" y="642.9051000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="671.6331000000001">to make arrangements that meet someone’s needs</tspan></text><text x="28" y="720.7731" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="749.5011000000001">make room for; meet the needs of</tspan></text><text x="28" y="798.6410999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="827.3691">We can accommodate guests who need a quieter</tspan><tspan x="28" y="860.4441">room.</tspan></text><text x="28" y="909.5840999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3121">Topic: Around the table. Write one sentence using</tspan><tspan x="28" y="971.3871">this word. Check that your sentence keeps the</tspan><tspan x="28" y="1004.4621">meaning shown above.</tspan></text><text x="28" y="1053.6020999999998" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1082.3301">A: What does “accommodate” mean?</tspan><tspan x="28" y="1115.4051">B: It means to make arrangements that meet</tspan><tspan x="28" y="1148.4801">someone’s needs.</tspan><tspan x="28" y="1181.5550999999998">A: Can we use it at the table?</tspan><tspan x="28" y="1214.6300999999999">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1263.7700999999997" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1292.4980999999998">Which word means “to make arrangements that meet</tspan><tspan x="28" y="1325.5730999999998">someone’s needs”: accommodate or hospitality?</tspan></text></svg>