<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>anticipate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/11/30 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Visible changes in the sky can prompt people to prepare for different weather.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Visible changes in the sky can prompt people to prepare for different weather.</tspan></text><a href="https://www.pexels.com/photo/storm-clouds-forming-over-the-open-sea-4609228/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 4609228</text></a></svg><text font-family="Arial, sans-serif" font-size="45.77" font-weight="700" fill="#382d2e"><tspan x="28" y="477.77">anticipate</tspan></text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="517.0725">US /ænˈtɪsəˌpeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="21.89" font-weight="400" fill="#382d2e"><tspan x="28" y="545.0917">anticipate · anticipates · anticipated · anticipated · anticipating</tspan><tspan x="28" y="571.7974999999999">(base · third person · past · past participle · -ing)</tspan></text><text x="28" y="627.3583" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="657.6063">to expect something and prepare for it</tspan></text><text x="28" y="709.3463" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="739.5943000000001">expect; foresee</tspan></text><text x="28" y="791.3343000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="821.5823000000001">We anticipate a busy morning and prepare the</tspan><tspan x="28" y="856.4073000000002">materials early.</tspan></text><text x="28" y="908.1473000000001" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="938.3953000000001">Topic: Plans for a rainy day. Write one</tspan><tspan x="28" y="973.2203000000002">sentence using this word. Check that your</tspan><tspan x="28" y="1008.0453000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1059.7853000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1090.0333">A: What does “anticipate” mean?</tspan><tspan x="28" y="1124.8583">B: It means to expect something and prepare</tspan><tspan x="28" y="1159.6833000000001">for it.</tspan><tspan x="28" y="1194.5083">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1229.3333">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1281.0733000000002" font-family="Arial, sans-serif" font-size="15.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.860000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="1311.3213">Review without reading the example first. Which</tspan><tspan x="28" y="1346.1463">word means “to expect something and prepare</tspan><tspan x="28" y="1380.9713000000002">for it”: anticipate or disruption?</tspan></text></svg>