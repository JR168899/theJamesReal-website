<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>resilience</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/11/30 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A small plant continues growing despite a difficult setting.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A small plant continues growing despite a difficult setting.</tspan></text><a href="https://www.pexels.com/photo/lone-tiny-sprout-11092207/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11092207</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="473.86">resilience</tspan></text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="509.805">US /rɪˈzɪliəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.020000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="535.4306">Usually uncountable: resilience; no regular plural in this sense.</tspan></text><text x="28" y="586.2450000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="613.9090000000001">the ability to recover or adapt after difficulty</tspan></text><text x="28" y="661.229" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="688.8930000000001">capacity to recover; adaptability after difficulty</tspan></text><text x="28" y="736.2130000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="763.8770000000002">The garden’s resilience became clear after the storm.</tspan></text><text x="28" y="811.1970000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="838.8610000000002">Topic: Plans for a rainy day. Write one sentence</tspan><tspan x="28" y="870.7110000000002">using this word. Check that your sentence keeps the</tspan><tspan x="28" y="902.5610000000003">meaning shown above.</tspan></text><text x="28" y="949.8810000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="977.5450000000002">A: What does “resilience” mean?</tspan><tspan x="28" y="1009.3950000000002">B: It means the ability to recover or adapt after</tspan><tspan x="28" y="1041.2450000000001">difficulty.</tspan><tspan x="28" y="1073.0950000000003">A: Can we use it on a rainy day?</tspan><tspan x="28" y="1104.9450000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1286.224">Review without reading the example first. Which word</tspan><tspan x="28" y="1318.0739999999998">means “the ability to recover or adapt after difficulty”:</tspan><tspan x="28" y="1349.924">resilience or provisional? (Model: resilience)</tspan></text></svg>