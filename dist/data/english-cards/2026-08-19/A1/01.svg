<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>help</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/08/19 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People help by sharing a physical task.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People help by sharing a physical task.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-men-carrying-a-couch-7464393/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7464393</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">help</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /hɛlp/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">help · helps · helped · helped · helping (base · third person</tspan><tspan x="28" y="579.5250000000001">· past · past participle · -ing)</tspan></text><text x="28" y="638.157" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="670.0770000000001">to make a task easier for someone</tspan></text><text x="28" y="724.677" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="756.5970000000001">assist; make easier</tspan></text><text x="28" y="811.197" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="843.1170000000001">Could you help me move this chair?</tspan></text><text x="28" y="897.717" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="929.6370000000001">Topic: Working together. Write one sentence</tspan><tspan x="28" y="966.3870000000001">using this word. Check that your sentence</tspan><tspan x="28" y="1003.1370000000001">keeps the meaning shown above.</tspan></text><text x="28" y="1057.7369999999999" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1089.657">A: What does “help” mean?</tspan><tspan x="28" y="1126.407">B: It means to make a task easier for</tspan><tspan x="28" y="1163.157">someone.</tspan><tspan x="28" y="1199.907">A: Can we use it during a shared project?</tspan><tspan x="28" y="1236.657">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1291.2569999999998" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1323.177">Try without help. Which word means “to make</tspan><tspan x="28" y="1359.927">a task easier for someone”: help or work?</tspan></text></svg>