<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>brevity is the soul of wit</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/05/25 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A team uses a whiteboard to explain a plan.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A team uses a whiteboard to explain a plan.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2c3540"><tspan x="28" y="473.63">brevity is the soul of wit</tspan></text><text font-family="Arial, sans-serif" font-size="18.1" font-weight="400" fill="#2c3540"><tspan x="28" y="502.13750000000005">William Shakespeare · Hamlet, Act II, Scene 2 (First Folio) · Published</tspan><tspan x="28" y="524.2195">1623</tspan></text><text x="28" y="573.6324999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="601.1445">Expressing an idea briefly can make it more effective</tspan><tspan x="28" y="632.8195">or clever.</tspan></text><text x="28" y="679.8794999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="707.3915">Concise expression can be powerful; Wit often</tspan><tspan x="28" y="739.0664999999999">benefits from economy</tspan></text><text x="28" y="786.1264999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="813.6384999999999">Instead of repeating the explanation, I give one clear</tspan><tspan x="28" y="845.3134999999999">sentence and wait for a reply.</tspan></text><text x="28" y="892.3734999999998" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="919.8854999999999">This is an excerpt from a speech by Polonius. His</tspan><tspan x="28" y="951.5604999999998">lengthy speech creates irony, so the dramatic context</tspan><tspan x="28" y="983.2354999999999">matters. The date refers to the First Folio publication.</tspan></text><text x="28" y="1030.2954999999997" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1057.8074999999997">A: Which line caught your attention?</tspan><tspan x="28" y="1089.4824999999996">B: “brevity is the soul of wit”</tspan><tspan x="28" y="1121.1574999999996">A: How does that connect with the example?</tspan><tspan x="28" y="1152.8324999999998">B: The example removes repetition while keeping the</tspan><tspan x="28" y="1184.5074999999997">important idea.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.992">Explain how the example illustrates the quoted idea.</tspan><tspan x="28" y="1317.667">Which detail supports your explanation? (Model: The</tspan><tspan x="28" y="1349.3419999999999">example removes repetition while keeping the</tspan><tspan x="28" y="1381.017">important idea.)</tspan></text></svg>