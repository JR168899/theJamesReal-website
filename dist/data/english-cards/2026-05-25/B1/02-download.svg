<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cooperate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/05/25 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People close to a shared task contribute knowledge and effort.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People close to a shared task contribute knowledge and effort.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">cooperate</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /koʊˈɑpəˌreɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">cooperate · cooperates · cooperated · cooperated ·</tspan><tspan x="28" y="564.7724999999999">cooperating (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="617.5413000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="646.2693000000002">to work with others towards a shared result</tspan></text><text x="28" y="695.4093000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="724.1373000000002">work together; collaborate</tspan></text><text x="28" y="773.2773000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="802.0053000000001">We cooperate to finish the work before lunch.</tspan></text><text x="28" y="851.1453" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="879.8733000000001">Topic: Working together. Write one sentence using</tspan><tspan x="28" y="912.9483000000001">this word. Check that your sentence keeps the</tspan><tspan x="28" y="946.0233000000001">meaning shown above.</tspan></text><text x="28" y="995.1633" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1023.8913000000001">A: What does “cooperate” mean?</tspan><tspan x="28" y="1056.9663">B: It means to work with others towards a shared</tspan><tspan x="28" y="1090.0413">result.</tspan><tspan x="28" y="1123.1163000000001">A: Can we use it during a shared project?</tspan><tspan x="28" y="1156.1913000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Explain your reasoning to a partner. Which word</tspan><tspan x="28" y="1320.923">means “to work with others towards a shared result”:</tspan><tspan x="28" y="1353.998">cooperate or responsibility? (Model: cooperate)</tspan></text></svg>