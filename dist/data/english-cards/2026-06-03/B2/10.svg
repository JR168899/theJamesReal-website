<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What do you notice when you explore a new neighborhood?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/06/03 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person walks along a city street.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person walks along a city street.</tspan></text><a href="https://www.pexels.com/photo/man-walking-on-city-street-in-daytime-6016949/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6016949</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#353331"><tspan x="28" y="475.47">What do you notice when you</tspan><tspan x="28" y="529.8075">explore a new</tspan><tspan x="28" y="584.145">neighborhood?</tspan></text><text x="28" y="643.2075000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="671.9355000000002">An opening that invites a personal preference or</tspan><tspan x="28" y="705.0105000000002">experience without assuming everyone shares it.</tspan></text><text x="28" y="754.1505000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="782.8785000000001">What do you notice when you explore a new</tspan><tspan x="28" y="815.9535000000002">neighborhood?</tspan></text><text x="28" y="865.0935000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="893.8215000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="926.8965000000002">different preference or a declined invitation without</tspan><tspan x="28" y="959.9715000000001">asking the person to justify it.</tspan></text><text x="28" y="1009.1115000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1037.8395">A: Do you head straight for the main sights?</tspan><tspan x="28" y="1070.9145">B: I usually walk a little first.</tspan><tspan x="28" y="1103.9895000000001">A: What catches your eye?</tspan><tspan x="28" y="1137.0645">B: Small shops and places where people stop to talk.</tspan><tspan x="28" y="1170.1395">A: Would you rather explore alone or with a local?</tspan><tspan x="28" y="1203.2145">B: Both give you a different view. A local can explain</tspan><tspan x="28" y="1236.2895">things I might miss.</tspan></text><text x="28" y="1285.4295" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#353331"><tspan x="28" y="1314.1575">A visitor enjoys small neighborhood details. Suggest</tspan><tspan x="28" y="1347.2325">an outing and explain why it may appeal.</tspan></text></svg>