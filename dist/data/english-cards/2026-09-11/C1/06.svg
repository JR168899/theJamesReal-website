<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>a double-edged sword</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/09/11 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A phone offers useful tools but can also interrupt concentration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A phone offers useful tools but can also interrupt concentration.</tspan></text><a href="https://www.pexels.com/photo/anonymous-crop-person-using-smartphone-while-working-with-gadgets-on-table-3850201/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3850201</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#383426"><tspan x="28" y="473.63">a double-edged sword</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="557.7045">something with both benefits and disadvantages</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="632.2765">a mixed blessing; an advantage with a downside</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="706.8485000000001">A fixed routine can be a double-edged sword.</tspan></text><text x="28" y="753.9085" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="781.4205000000001">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="813.0955">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="860.1555" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="887.6675">A: How would you express this idea?</tspan><tspan x="28" y="919.3425">B: a double-edged sword</tspan><tspan x="28" y="951.0175">A: What does that mean here?</tspan><tspan x="28" y="982.6925">B: something with both benefits and disadvantages</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#383426"><tspan x="28" y="1285.992">Explain the meaning before looking at the model</tspan><tspan x="28" y="1317.667">answer. What does “a double-edged sword” mean in</tspan><tspan x="28" y="1349.3419999999999">this example? A fixed routine can be a double-edged</tspan><tspan x="28" y="1381.017">sword.</tspan></text></svg>