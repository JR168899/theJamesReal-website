<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Let me check that I understand.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - B1 - 2026/06/30 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A flag is carried at a public celebration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A flag is carried at a public celebration.</tspan></text><a href="https://www.pexels.com/photo/people-horseback-riding-holding-american-flags-during-a-parade-12711524/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12711524</text></a></svg><text font-family="Arial, sans-serif" font-size="45.540000000000006" font-weight="700" fill="#2d382e"><tspan x="28" y="477.54">Let me check that I</tspan><tspan x="28" y="534.465">understand.</tspan></text><text x="28" y="596.34" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="626.436">A way to confirm your understanding before</tspan><tspan x="28" y="661.086">continuing a conversation.</tspan></text><text x="28" y="712.566" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="742.662">Let me make sure I have this right.; Can I</tspan><tspan x="28" y="777.312">confirm what you mean?</tspan></text><text x="28" y="828.792" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="858.888">A: How should we join a public celebration?</tspan><tspan x="28" y="893.538">B: Let me check that I understand.</tspan></text><text x="28" y="945.018" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="975.114">Use this phrase in a friendly conversation.</tspan><tspan x="28" y="1009.764">Listen to the reply before asking your next</tspan><tspan x="28" y="1044.414">question.</tspan></text><text x="28" y="1095.894" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1125.99">A: How would you express this idea?</tspan><tspan x="28" y="1160.64">B: Let me check that I understand.</tspan><tspan x="28" y="1195.29">A: What does that mean here?</tspan><tspan x="28" y="1229.94">B: A way to confirm your understanding before</tspan><tspan x="28" y="1264.5900000000001">continuing a conversation.</tspan></text><text x="28" y="1316.07" font-family="Arial, sans-serif" font-size="15.840000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.720000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1346.166">When might you say “Let me check that I</tspan><tspan x="28" y="1380.816">understand.”?</tspan></text></svg>