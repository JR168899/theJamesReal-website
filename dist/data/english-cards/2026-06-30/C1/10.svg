<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What would you like to do for Independence Day?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/06/30 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A flag is carried at a public celebration.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A flag is carried at a public celebration.</tspan></text><a href="https://www.pexels.com/photo/people-horseback-riding-holding-american-flags-during-a-parade-12711524/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12711524</text></a></svg><text font-family="Arial, sans-serif" font-size="48.53000000000001" font-weight="700" fill="#353331"><tspan x="28" y="480.53000000000003">What would you like to</tspan><tspan x="28" y="541.1925">do for Independence</tspan><tspan x="28" y="601.855">Day?</tspan></text><text x="28" y="667.7925" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="699.8645">An open question that invites a person to</tspan><tspan x="28" y="736.7895">describe a familiar experience.</tspan></text><text x="28" y="791.6495000000001" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="823.7215000000001">What would you like to do for Independence</tspan><tspan x="28" y="860.6465000000001">Day?</tspan></text><text x="28" y="915.5065000000001" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="947.5785000000001">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="984.5035">answer, then ask a related follow-up.</tspan></text><text x="28" y="1039.3635000000002" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1071.4355">A: What would you like to do for</tspan><tspan x="28" y="1108.3605">Independence Day?</tspan><tspan x="28" y="1145.2855">B: I would like to join a public celebration.</tspan><tspan x="28" y="1182.2105000000001">A: What should we prepare?</tspan><tspan x="28" y="1219.1355">B: For example, we agree on a meeting</tspan><tspan x="28" y="1256.0605">place before the parade begins.</tspan></text><text x="28" y="1310.9205000000002" font-family="Arial, sans-serif" font-size="16.880000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.540000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1342.9925">Write a reply of your own, then ask one</tspan><tspan x="28" y="1379.9175">related question.</tspan></text></svg>