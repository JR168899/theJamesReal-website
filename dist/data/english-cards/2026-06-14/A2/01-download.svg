<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>remember</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A2 - 2026/06/14 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Writing gives us a way to examine an experience and our own assumptions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Writing gives us a way to examine an experience and our own assumptions.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="46.92" font-weight="700" fill="#382d2e"><tspan x="28" y="478.92">remember</tspan></text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="519.21">US /rɪˈmɛmbɚ/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.44" font-weight="400" fill="#382d2e"><tspan x="28" y="547.9332">remember · remembers · remembered · remembered ·</tspan><tspan x="28" y="575.3100000000001">remembering (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="632.2668000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="663.2748000000001">to keep or bring something into your mind</tspan></text><text x="28" y="716.3148000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="747.3228000000001">recall; keep in mind</tspan></text><text x="28" y="800.3628000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="831.3708000000001">I remember the song we heard together.</tspan></text><text x="28" y="884.4108000000001" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="915.4188000000001">Topic: Looking back and looking ahead. Write</tspan><tspan x="28" y="951.1188000000002">one sentence using this word. Check that your</tspan><tspan x="28" y="986.8188000000001">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1039.8588" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1070.8668">A: What does “remember” mean?</tspan><tspan x="28" y="1106.5668">B: It means to keep or bring something into</tspan><tspan x="28" y="1142.2668">your mind.</tspan><tspan x="28" y="1177.9668">A: Can we use it at the end of the year?</tspan><tspan x="28" y="1213.6668">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1266.7068" font-family="Arial, sans-serif" font-size="16.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.560000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1297.7148">Look again. Which word means “to keep or</tspan><tspan x="28" y="1333.4148">bring something into your mind”: remember or</tspan><tspan x="28" y="1369.1148">goal? (Model: remember)</tspan></text></svg>