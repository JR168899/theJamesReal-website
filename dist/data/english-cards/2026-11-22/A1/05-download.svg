"M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#d59bea"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#d59bea"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="45.08" font-weight="700" fill="#383426"><tspan x="28" y="477.08">a helping hand</tspan></text><text x="28" y="538.3299999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="568.1220000000001">help from another person</tspan></text><text x="28" y="619.0819999999999" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="648.874">assistance; practical support</tspan></text><text x="28" y="699.8339999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="729.626">Can you give me a helping hand?</tspan></text><text x="28" y="780.5859999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="810.3779999999999">Learn the whole expression. It is figurative</tspan><tspan x="28" y="844.6779999999999">language, so a word-for-word interpretation may</tspan><tspan x="28" y="878.978">be misleading.</tspan></text><text x="28" y="929.9379999999998" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="959.7299999999998">A: How would you express this idea?</tspan><tspan x="28" y="994.0299999999997">B: a helping hand</tspan><tspan x="28" y="1028.3299999999997">A: What does that mean here?</tspan><tspan x="28" y="1062.6299999999999">B: help from another person</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#383426"><tspan x="28" y="1289.472">Your example. What does “a helping hand” mean</tspan><tspan x="28" y="1323.772">in this example? Can you give me a helping</tspan><tspan x="28" y="1358.072">hand? (Model: Help from another person.)</tspan></text></svg>