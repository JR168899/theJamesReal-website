 rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-60V59M-45 64H45M-63-34H63M-48-34L-70 18H-24ZM48-34L24 18H70Z" fill="#d9bf85"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#383426"><tspan x="28" y="475.47">a double-edged sword</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">something with both benefits and disadvantages</tspan></text><text x="28" y="612.4005000000001" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="641.1285000000001">something with both benefits and disadvantages</tspan></text><text x="28" y="690.2685" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="718.9965000000001">A fixed routine can be a double-edged sword.</tspan></text><text x="28" y="768.1365" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="796.8645">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="829.9395000000001">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="879.0794999999999" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="907.8075">A: How would you express this idea?</tspan><tspan x="28" y="940.8825">B: a double-edged sword</tspan><tspan x="28" y="973.9575">A: What does that mean here?</tspan><tspan x="28" y="1007.0325">B: something with both benefits and disadvantages</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Apply the idea to a real situation, then answer: What</tspan><tspan x="28" y="1320.923">does “a double-edged sword” mean in this example?</tspan><tspan x="28" y="1353.998">A fixed routine can be a double-edged sword.</tspan></text></svg>