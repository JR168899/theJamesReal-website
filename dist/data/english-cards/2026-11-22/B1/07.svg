ht="400" fill="#2d382e"><tspan x="28" y="854.576">A: How should we listen to a whole album?</tspan><tspan x="28" y="888.876">B: Let me check that I understand.</tspan></text><text x="28" y="939.836" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#2d382e"><tspan x="28" y="969.6280000000002">Use this phrase in a friendly conversation. Listen</tspan><tspan x="28" y="1003.9280000000001">to the reply before asking your next question.</tspan></text><text x="28" y="1054.8880000000001" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#2d382e"><tspan x="28" y="1084.68">A: How would you express this idea?</tspan><tspan x="28" y="1118.98">B: Let me check that I understand.</tspan><tspan x="28" y="1153.28">A: What does that mean here?</tspan><tspan x="28" y="1187.5800000000002">B: A useful way to keep an everyday</tspan><tspan x="28" y="1221.88">conversation clear and considerate.</tspan></text><text x="28" y="1272.8400000000001" font-family="Arial, sans-serif" font-size="15.68" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.439999999999998" font-weight="400" fill="#2d382e"><tspan x="28" y="1302.632">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1336.932">When might you say “Let me check that I</tspan><tspan x="28" y="1371.232">understand.”?</tspan></text></svg>