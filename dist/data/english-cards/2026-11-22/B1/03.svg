<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>work out</title><rect width="660" height="1434" fill="#f1dfcf"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#3d3028" stroke-width="1"/><text x="35" y="43" fill="#3d3028" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B1   2026-11-22</tspan></text><text x="35" y="88" fill="#3d3028" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">work out</tspan></text><svg x="35" y="137.4" width="590" height="340" viewBox="0 0 660 380"><title>work out</title><desc>Original hand-drawn story illustration: music, set within music. find a solution</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(-1) scale(1.4)"><path d="M-27 37V-40L48-57V19M-27-22L48-39"/><ellipse cx="-43" cy="40" rx="21" ry="14" fill="#b7a3bf"/><ellipse cx="31" cy="23" rx="21" ry="14" fill="#b7a3bf"/></g><g transform="translate(94 266) rotate(1) scale(0.52)"><circle cx="-35" cy="-38" r="17" fill="#e0b28e"/><circle cx="40" cy="-32" r="17" fill="#bd917d"/><path d="M-63 37V0Q-35-30-9 0V37M12 41V7Q39-23 68 7V41M-42 38L-51 72M-25 38L-18 72M32 43L25 76M50 43L60 76" fill="#a6bac0"/><path d="M-9 6L9 17L21 3"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">work out</text></svg><text x="35" y="514.4" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="538.9599999999999" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">find a solution</tspan></text><text x="35" y="590.8" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="615.3599999999999" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">We can work out a plan together.</tspan></text><text x="35" y="667.1999999999999" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">USAGE NOTE</tspan></text><text x="35" y="691.7599999999999" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="35" dy="24.839999999999996">changing its object or word order.</tspan></text><text x="35" y="768.4399999999998" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">CONVERSATION</tspan></text><text x="35" y="792.9999999999998" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">A: How can we listen to a whole album?</tspan><tspan x="35" dy="24.839999999999996">B: We can work out a plan together.</tspan><tspan x="35" dy="24.839999999999996">A: That gives us a starting point.</tspan></text><text x="35" y="894.5199999999998" fill="#3d3028" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="919.0799999999997" fill="#3d3028" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Apply the idea to a real situation, then answer: Explain</tspan><tspan x="35" dy="24.839999999999996">“work out” in your own words, then use it in a sentence</tspan><tspan x="35" dy="24.839999999999996">about listening without distraction.</tspan></text><text x="35" y="1406" fill="#3d3028" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">PHRASES   /   03 OF 11</tspan></text></svg>