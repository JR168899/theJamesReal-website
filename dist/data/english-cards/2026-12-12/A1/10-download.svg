<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Do you know this street?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A1 - 2026/12/12 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Pedestrians share a street crossing.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Pedestrians share a street crossing.</tspan></text><a href="https://www.pexels.com/photo/people-walking-on-pedestrian-lane-during-daytime-109919/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 109919</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#353331"><tspan x="28" y="482.0">Do you know this street?</tspan></text><text x="28" y="550.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="584.04">An opening that invites a personal</tspan><tspan x="28" y="622.54">preference or experience without assuming</tspan><tspan x="28" y="661.04">everyone shares it.</tspan></text><text x="28" y="718.24" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="751.68">Do you know this street?</tspan></text><text x="28" y="808.88" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="842.3199999999999">Follow the answer with a related question.</tspan><tspan x="28" y="880.8199999999999">Accept a different preference or a declined</tspan><tspan x="28" y="919.3199999999999">invitation without asking the person to</tspan><tspan x="28" y="957.8199999999999">justify it.</tspan></text><text x="28" y="1015.02" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1048.46">Heart: Do you know this street?</tspan><tspan x="28" y="1086.96">Puck: A little.</tspan><tspan x="28" y="1125.46">Heart: Where is the cafe?</tspan><tspan x="28" y="1163.96">Puck: At the next corner.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#353331"><tspan x="28" y="1295.04">You cannot find the cafe. Ask someone for</tspan><tspan x="28" y="1333.54">help. (Model: Could you tell me where the</tspan><tspan x="28" y="1372.04">cafe is?)</tspan></text></svg>