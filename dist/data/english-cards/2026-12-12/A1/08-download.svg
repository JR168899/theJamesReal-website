<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Small things can help.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/12/12 - 01 - Quote</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small things can help.</title><desc>Original family-manga illustration: city, related to Small things can help..</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#f48f91"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-75 60V-15H-35V60M-21 60V-60H21V60M35 60V-31H75V60M-90 62H90M-64 0H-49M-64 17H-49M-64 34H-49M-9-39H9M-9-20H9M-9 0H9M-9 20H9M48-13H63M48 8H63M48 30H63" fill="#f5c488"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="43.47" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">Small things can help.</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="563.2605000000001">A simple action can make a task easier or improve</tspan><tspan x="28" y="596.3355000000001">someone’s situation.</tspan></text><text x="28" y="645.4755" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="674.2035000000001">Little actions can make a difference.; Even a small</tspan><tspan x="28" y="707.2785000000001">effort can be useful.</tspan></text><text x="28" y="756.4185" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="785.1465000000001">For example, we keep an entrance clear while taking</tspan><tspan x="28" y="818.2215000000001">a photograph of the street.</tspan></text><text x="28" y="867.3615" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="896.0895">Read this as a reflection, not a factual rule. Relate it</tspan><tspan x="28" y="929.1645000000001">to a specific action in the example, and explain why</tspan><tspan x="28" y="962.2395">you agree or disagree.</tspan></text><text x="28" y="1011.3795" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1040.1075">A: What did we learn from that experience?</tspan><tspan x="28" y="1073.1825000000001">B: Small things can help.</tspan><tspan x="28" y="1106.2575000000002">A: What do you mean?</tspan><tspan x="28" y="1139.3325">B: A simple action can make a task easier or improve</tspan><tspan x="28" y="1172.4075">someone’s situation.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.12" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.459999999999997" font-weight="400" fill="#2c3540"><tspan x="28" y="1287.848">Tell a friend. Which action in today’s topic illustrates</tspan><tspan x="28" y="1320.923">this reflection? (Model: We keep an entrance clear</tspan><tspan x="28" y="1353.998">while taking a photograph of the street.)</tspan></text></svg>