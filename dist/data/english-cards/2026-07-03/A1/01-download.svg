<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>flag</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/07/03 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A flag is carried in a public parade.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A flag is carried in a public parade.</tspan></text><a href="https://www.pexels.com/photo/people-horseback-riding-holding-american-flags-during-a-parade-12711524/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 12711524</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">flag</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /flæɡ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">Singular: flag; plural: flags.</tspan></text><text x="28" y="604.0425" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="634.8985">a piece of cloth used as a symbol of a country</tspan><tspan x="28" y="670.4235">or group</tspan></text><text x="28" y="723.2035000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="754.0595000000001">banner; standard</tspan></text><text x="28" y="806.8395" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="837.6955">A flag hangs above the street.</tspan></text><text x="28" y="890.4755" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="921.3315">Keep the sense and countability shown in the</tspan><tspan x="28" y="956.8565">example. Use a singular or plural form</tspan><tspan x="28" y="992.3815">appropriate to the specific person, object or</tspan><tspan x="28" y="1027.9065">event being discussed.</tspan></text><text x="28" y="1080.6865" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1111.5425">A: Why is the flag beside the entrance?</tspan><tspan x="28" y="1147.0675">B: It helps people find our group&#x27;s meeting</tspan><tspan x="28" y="1182.5925">place.</tspan><tspan x="28" y="1218.1175">A: Will you keep it there?</tspan><tspan x="28" y="1253.6425">B: Yes, until everyone arrives.</tspan></text><text x="28" y="1306.4225000000001" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1337.2785000000001">Where can your group meet at a busy event?</tspan><tspan x="28" y="1372.8035000000002">Use flag. (Model: We can meet beside the flag.)</tspan></text></svg>