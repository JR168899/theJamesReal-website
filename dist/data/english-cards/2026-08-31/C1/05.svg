<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/08/31 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small details in a document can have important consequences.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small details in a document can have important consequences.</tspan></text><a href="https://www.pexels.com/photo/person-holding-silver-pen-signing-photographers-signature-175045/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 175045</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#383426"><tspan x="28" y="475.47">the devil is in the details</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">small details can cause important difficulties</tspan></text><text x="28" y="612.4005000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="641.1285000000001">small points can cause big problems; careful</tspan><tspan x="28" y="674.2035000000002">execution matters</tspan></text><text x="28" y="723.3435000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="752.0715000000001">The broad idea is sound, but the devil is in the</tspan><tspan x="28" y="785.1465000000002">details.</tspan></text><text x="28" y="834.2865" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="863.0145000000001">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="896.0895000000002">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="945.2295" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="973.9575000000001">A: How would you express this idea?</tspan><tspan x="28" y="1007.0325000000001">B: the devil is in the details</tspan><tspan x="28" y="1040.1075">A: What does that mean here?</tspan><tspan x="28" y="1073.1825000000001">B: small details can cause important difficulties</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Explain your reasoning to a partner. What does “the</tspan><tspan x="28" y="1320.923">devil is in the details” mean in this example? The</tspan><tspan x="28" y="1353.998">broad idea is sound, but the devil is in the details.</tspan></text></svg>