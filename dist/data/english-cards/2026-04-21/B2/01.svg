<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sustainable</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/04/21 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="41.17" font-weight="700" fill="#382d2e"><tspan x="28" y="473.17">sustainable</tspan></text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="508.5225">US /səˈsteɪnəbəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="19.69" font-weight="400" fill="#382d2e"><tspan x="28" y="533.7257000000001">sustainable · more sustainable · most sustainable; noun:</tspan><tspan x="28" y="557.7475000000001">sustainability</tspan></text><text x="28" y="607.7243000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="634.9322999999999">able to continue over time without exhausting</tspan><tspan x="28" y="666.2573">resources</tspan></text><text x="28" y="712.7973000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="740.0053">maintainable; viable over time</tspan></text><text x="28" y="786.5453000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="813.7533000000001">A sustainable routine leaves time for rest.</tspan></text><text x="28" y="860.2933000000002" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="887.5013000000001">The adjective describes a person, thing or situation.</tspan><tspan x="28" y="918.8263000000002">Choose a concrete noun or context that supports the</tspan><tspan x="28" y="950.1513000000001">description rather than using it as a general</tspan><tspan x="28" y="981.4763000000002">compliment.</tspan></text><text x="28" y="1028.0163" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1055.2243">Aoede: We managed an hour every evening this</tspan><tspan x="28" y="1086.5493000000001">week.</tspan><tspan x="28" y="1117.8743000000002">Echo: But is that pace sustainable once work gets</tspan><tspan x="28" y="1149.1993">busy?</tspan><tspan x="28" y="1180.5243">Aoede: Probably not. Twenty minutes would be easier</tspan><tspan x="28" y="1211.8493">to maintain.</tspan><tspan x="28" y="1243.1743000000001">Echo: Then let us build the routine around that.</tspan></text><text x="28" y="1289.7142999999999" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1316.9223">A learner studies three hours daily, becomes</tspan><tspan x="28" y="1348.2473">exhausted and stops. Propose a more sustainable</tspan><tspan x="28" y="1379.5723">arrangement.</tspan></text></svg>