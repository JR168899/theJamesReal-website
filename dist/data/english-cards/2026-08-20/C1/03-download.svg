<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>factor in</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C1 - 2026/08/20 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Travelers examine a map to choose their route.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Travelers examine a map to choose their route.</tspan></text><a href="https://www.pexels.com/photo/a-group-of-friends-looking-at-the-map-5622107/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5622107</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">factor something in</tspan><tspan x="28" y="525.6675">factor in something</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="609.7420000000001">include something when making a judgement</tspan></text><text x="28" y="656.802" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="684.3140000000001">allow for; take into account</tspan></text><text x="28" y="731.374" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="758.8860000000001">We factor in the time other people need.</tspan></text><text x="28" y="805.946" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="833.4580000000001">Separable: factor the delay in / factor in the delay;</tspan><tspan x="28" y="865.133">factor it in. Include a relevant time, cost or condition</tspan><tspan x="28" y="896.8080000000001">in a calculation.</tspan></text><text x="28" y="943.868" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="971.3800000000001">A: Leaving at seven twenty should be fine.</tspan><tspan x="28" y="1003.0550000000001">B: Have you factored in the fifteen-minute walk?</tspan><tspan x="28" y="1034.73">A: I had not. There is a ten-minute queue as well.</tspan><tspan x="28" y="1066.4050000000002">B: Then we should work backward from the</tspan><tspan x="28" y="1098.0800000000002">seven-thirty start.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">A walk starts at 7:30. Allow fifteen minutes to get</tspan><tspan x="28" y="1317.667">there and ten minutes to enter. Give the latest</tspan><tspan x="28" y="1349.3419999999999">departure time and explain. (Model: Leave by 7:05</tspan><tspan x="28" y="1381.017">after factoring in both the walk and the queue.)</tspan></text></svg>