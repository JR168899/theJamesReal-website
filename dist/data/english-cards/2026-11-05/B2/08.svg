<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>A small decision matters when it helps someone else.</title><rect width="660" height="1434" fill="#dce5ee"/><rect x="15" y="15" width="630" height="1404" fill="none" stroke="#2c3540" stroke-width="1"/><text x="35" y="43" fill="#2c3540" font-family="Arial" font-size="13" font-weight="normal"><tspan x="35" dy="0">JAMES REAL / EVERYDAY ENGLISH   B2   2026-11-05</tspan></text><text x="35" y="88" fill="#2c3540" font-family="Georgia" font-size="30" font-weight="bold"><tspan x="35" dy="0">A small decision matters when it</tspan><tspan x="35" dy="41.4">helps someone else.</tspan></text><svg x="35" y="178.8" width="590" height="340" viewBox="0 0 660 380"><title>A small decision matters when it helps someone else.</title><desc>Original hand-drawn story illustration: hand, set within conversation. An original James Real learning reflection on practical consideration.</desc><defs><pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h2m9 7h1M5 15h1" stroke="#a38b6a" stroke-width=".6" opacity=".18"/></pattern></defs><rect width="660" height="380" fill="#f2eadb"/><rect width="660" height="380" fill="url(#paper)"/><ellipse cx="327" cy="317" rx="232" ry="16" fill="#d4c6b1" opacity=".5"/><g stroke="#4b5149" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" fill="none"><g transform="translate(315 192) rotate(1) scale(1.4)"><path d="M-65 36L-38 12L-2 12L24-7Q42-17 43-1L18 26H52Q73 24 72 38L27 62H-18L-42 77" fill="#d5ad8e"/></g><g transform="translate(538 266) rotate(-1) scale(0.52)"><path d="M-83-53H23V12H-36L-62 35V12H-83ZM40-26H86V41H62L40 62V41H13V29" fill="#c4cbd5"/><path d="M-63-31H5M-63-12H-13M43-2H68M43 17H68"/></g><path d="M128 324Q320 309 522 324" stroke-width="1.7"/><path d="M545 75l8-8m14 27h10M112 71l-7-8" stroke="#ba9670" stroke-width="2"/></g><text x="330" y="361" text-anchor="middle" fill="#6b665a" font-family="Georgia,serif" font-size="14" font-style="italic">A small decision matters when it helps someone else.</text></svg><text x="35" y="555.8" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">MEANING</tspan></text><text x="35" y="580.3599999999999" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">An original James Real learning reflection on practical</tspan><tspan x="35" dy="24.839999999999996">consideration.</tspan></text><text x="35" y="657.0399999999998" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">IN CONTEXT</tspan></text><text x="35" y="681.5999999999998" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">For example, we repeat the main point in our own words</tspan><tspan x="35" dy="24.839999999999996">before offering advice.</tspan></text><text x="35" y="758.2799999999997" fill="#2c3540" font-family="Arial" font-size="12" font-weight="bold"><tspan x="35" dy="0">YOUR TURN</tspan></text><text x="35" y="782.8399999999997" fill="#2c3540" font-family="Arial" font-size="18" font-weight="normal"><tspan x="35" dy="0">Make a sentence of your own, then answer: Which action in</tspan><tspan x="35" dy="24.839999999999996">today’s topic illustrates this reflection?</tspan></text><text x="35" y="1406" fill="#2c3540" font-family="Arial" font-size="11" font-weight="normal"><tspan x="35" dy="0">REFLECTION   /   08 OF 11</tspan></text></svg>