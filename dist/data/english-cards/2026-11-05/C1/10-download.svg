<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually listen to a friend?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/11/05 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>People exchange their views in a conversation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">People exchange their views in a conversation.</tspan></text><a href="https://www.pexels.com/photo/people-sitting-and-talking-in-an-office-8837579/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8837579</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#353331"><tspan x="28" y="472.02">How do you usually listen to a</tspan><tspan x="28" y="522.045">friend?</tspan></text><text x="28" y="576.42" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="602.868">An open question that invites a person to describe a</tspan><tspan x="28" y="633.3180000000001">familiar experience.</tspan></text><text x="28" y="678.558" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="705.0060000000001">How do you usually listen to a friend?</tspan></text><text x="28" y="750.246" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="776.6940000000001">Ask this as a genuine question. Listen to the answer,</tspan><tspan x="28" y="807.1440000000001">then ask a related follow-up.</tspan></text><text x="28" y="852.384" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="878.8320000000001">A: How do you usually listen to a friend?</tspan><tspan x="28" y="909.2820000000002">B: I make practical arrangements, while leaving room for</tspan><tspan x="28" y="939.7320000000001">other people’s preferences.</tspan><tspan x="28" y="970.1820000000001">A: What has helped you most?</tspan><tspan x="28" y="1000.6320000000001">B: For example, we ask what happened instead of</tspan><tspan x="28" y="1031.082">guessing why our friend is upset.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#353331"><tspan x="28" y="1284.368">Make a sentence of your own, then answer: Write a reply</tspan><tspan x="28" y="1314.818">of your own, then ask one related question. (Model: I</tspan><tspan x="28" y="1345.268">make practical arrangements, while leaving room for</tspan><tspan x="28" y="1375.7179999999998">other people’s preferences. What works best for you?)</tspan></text></svg>