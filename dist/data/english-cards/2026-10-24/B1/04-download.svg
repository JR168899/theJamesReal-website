178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-86 60V-66H86V60M-87 60H87M-75-49H-13V1H-75M-45-49V1M-75-24H-13M15 14H71V52H15M9 52H78M23 53V70M66 53V70" fill="#d9ccba"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="38.41" font-weight="700" fill="#3d3028"><tspan x="28" y="470.40999999999997">look into</tspan></text><text x="28" y="522.5975" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="547.9815">examine or investigate</tspan></text><text x="28" y="591.4015" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="616.7855000000001">investigate; examine</tspan></text><text x="28" y="660.2055" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="685.5895">We should look into another option.</tspan></text><text x="28" y="729.0095" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="754.3935">Keep the particle with the verb. Check a dictionary before</tspan><tspan x="28" y="783.6185">changing its object or word order.</tspan></text><text x="28" y="827.0385" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="852.4225">A: How can we arrange a room?</tspan><tspan x="28" y="881.6475">B: We should look into another option.</tspan><tspan x="28" y="910.8725000000001">A: That gives us a starting point.</tspan><tspan x="28" y="940.0975">B: Let us try it together.</tspan></text><text x="28" y="1257.36" font-family="Arial, sans-serif" font-size="13.36" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="23.38" font-weight="400" fill="#3d3028"><tspan x="28" y="1282.7440000000001">Explain your reasoning to a partner. Explain “look into” in</tspan><tspan x="28" y="1311.969">your own words, then use it in a sentence about making a</tspan><tspan x="28" y="1341.1940000000002">room your own. (Model: It means to examine or</tspan><tspan x="28" y="1370.419">investigate. Example: We should look into another option.)</tspan></text></svg>