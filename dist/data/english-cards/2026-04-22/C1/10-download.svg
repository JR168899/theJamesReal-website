<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Is there an everyday change you have found easy to keep?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C1 - 2026/04/22 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A bag is ready to carry personal belongings.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A bag is ready to carry personal belongings.</tspan></text><a href="https://www.pexels.com/photo/elegant-brown-leather-handbag-on-fabric-background-31666160/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 31666160</text></a></svg><text font-family="Arial, sans-serif" font-size="42.32000000000001" font-weight="700" fill="#353331"><tspan x="28" y="474.32">Is there an everyday change</tspan><tspan x="28" y="527.22">you have found easy to keep?</tspan></text><text x="28" y="584.72" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="612.688">An opening that invites a personal preference or</tspan><tspan x="28" y="644.888">experience without assuming everyone shares it.</tspan></text><text x="28" y="692.7280000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="720.696">Is there an everyday change you have found easy to</tspan><tspan x="28" y="752.8960000000001">keep?</tspan></text><text x="28" y="800.7360000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="828.7040000000001">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="860.9040000000001">different preference or a declined invitation without</tspan><tspan x="28" y="893.104">asking the person to justify it.</tspan></text><text x="28" y="940.9440000000001" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="968.912">Kore: Did the refill bottle make a difference to your</tspan><tspan x="28" y="1001.1120000000001">routine?</tspan><tspan x="28" y="1033.3120000000001">Onyx: Yes, once I started leaving it by my keys.</tspan><tspan x="28" y="1065.512">Kore: So remembering it was the hard part?</tspan><tspan x="28" y="1097.712">Onyx: Exactly. Buying it did not automatically change</tspan><tspan x="28" y="1129.912">the habit.</tspan><tspan x="28" y="1162.112">Kore: Would that idea work for a reusable bag too?</tspan><tspan x="28" y="1194.3120000000001">Onyx: It might. Put it where you already pause before</tspan><tspan x="28" y="1226.5120000000002">leaving.</tspan></text><text x="28" y="1274.352" font-family="Arial, sans-serif" font-size="14.720000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.760000000000005" font-weight="400" fill="#353331"><tspan x="28" y="1302.3200000000002">Ask about what makes a reusable item part of an</tspan><tspan x="28" y="1334.5200000000002">actual habit rather than just a purchase. (Model:</tspan><tspan x="28" y="1366.7200000000003">What helps you remember to take it with you?)</tspan></text></svg>