<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>externality</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/04/22 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Separate containers provide places to sort materials.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Separate containers provide places to sort materials.</tspan></text><a href="https://www.pexels.com/photo/urban-garbage-containers-11666823/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11666823</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">externality</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˌɛkstɚˈnæləti/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">Singular: externality; plural: externalities.</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">a consequence of an activity that affects people</tspan><tspan x="28" y="655.1550000000001">not directly involved in it</tspan></text><text x="28" y="704.5550000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="733.4350000000001">spillover effect; indirect cost or benefit</tspan></text><text x="28" y="782.835" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="811.715">Traffic noise is an externality that affects nearby</tspan><tspan x="28" y="844.965">residents.</tspan></text><text x="28" y="894.365" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="923.245">An effect of an activity falling on parties outside a</tspan><tspan x="28" y="956.495">transaction; identify who bears the cost or</tspan><tspan x="28" y="989.745">benefit.</tspan></text><text x="28" y="1039.145" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1068.0249999999999">A: The low price does not include the waste left in</tspan><tspan x="28" y="1101.2749999999999">the neighborhood.</tspan><tspan x="28" y="1134.5249999999999">B: That cost falls on people who did not make the</tspan><tspan x="28" y="1167.7749999999999">purchase.</tspan><tspan x="28" y="1201.0249999999999">A: An externality, then?</tspan><tspan x="28" y="1234.2749999999999">B: Yes. The private transaction does not reflect</tspan><tspan x="28" y="1267.5249999999999">all its wider effects.</tspan></text><text x="28" y="1316.925" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1345.8049999999998">Why might litter from a purchased product be a</tspan><tspan x="28" y="1379.0549999999998">negative externality?</tspan></text></svg>