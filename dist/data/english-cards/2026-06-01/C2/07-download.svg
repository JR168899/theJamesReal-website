<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I would distinguish between the intention and its consequences.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce6d8" stroke="#526f4f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2d382e"><tspan x="28" y="55">Everyday English - C2 - 2026/06/01 - 01 - Life phrases</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A written proposal gives people something concrete to examine.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A written proposal gives people something concrete to examine.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="36.800000000000004" font-weight="700" fill="#2d382e"><tspan x="28" y="468.8">I would distinguish between the</tspan><tspan x="28" y="514.8000000000001">intention and its consequences.</tspan></text><text x="28" y="564.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="589.12">A proposal to evaluate a person’s purpose separately from the</tspan><tspan x="28" y="617.12">effects of their action.</tspan></text><text x="28" y="658.7199999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="683.04">I would separate the aim from the outcome.; We should</tspan><tspan x="28" y="711.04">assess purpose and effects independently.</tspan></text><text x="28" y="752.6399999999999" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="776.9599999999999">A: How should we explore a neighbourhood?</tspan><tspan x="28" y="804.9599999999999">B: I would distinguish between the intention and its</tspan><tspan x="28" y="832.9599999999999">consequences.</tspan></text><text x="28" y="874.5599999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="898.8799999999999">Use this phrase in a friendly conversation. Listen to the reply</tspan><tspan x="28" y="926.8799999999999">before asking your next question.</tspan></text><text x="28" y="968.4799999999998" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="992.7999999999998">A: How would you express this idea?</tspan><tspan x="28" y="1020.7999999999998">B: I would distinguish between the intention and its</tspan><tspan x="28" y="1048.7999999999997">consequences.</tspan><tspan x="28" y="1076.7999999999997">A: What does that mean here?</tspan><tspan x="28" y="1104.7999999999997">B: A proposal to evaluate a person’s purpose separately from</tspan><tspan x="28" y="1132.7999999999997">the effects of their action.</tspan></text><text x="28" y="1256.8" font-family="Arial, sans-serif" font-size="12.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="22.400000000000002" font-weight="400" fill="#2d382e"><tspan x="28" y="1281.1200000000001">Explain your reasoning to a partner. When might you say “I</tspan><tspan x="28" y="1309.1200000000001">would distinguish between the intention and its</tspan><tspan x="28" y="1337.1200000000001">consequences.”? (Model: You could say it on a city walk, when</tspan><tspan x="28" y="1365.1200000000001">you want to ask for help or make your understanding clear.)</tspan></text></svg>