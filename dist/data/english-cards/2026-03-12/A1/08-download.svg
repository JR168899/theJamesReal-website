<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>We need the tonic of wildness</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/03/12 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Changing leaves mark the passing of seasons.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Changing leaves mark the passing of seasons.</tspan></text><a href="https://www.pexels.com/photo/sunlit-autumn-forest-scene-with-falling-leaves-34193050/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34193050</text></a></svg><text font-family="Arial, sans-serif" font-size="42.78" font-weight="700" fill="#2c3540"><tspan x="28" y="474.78">We need the tonic of</tspan><tspan x="28" y="528.255">wildness</tspan></text><text font-family="Arial, sans-serif" font-size="18.6" font-weight="400" fill="#2c3540"><tspan x="28" y="557.5500000000001">Henry David Thoreau · Walden, Spring · Published 1854</tspan></text><text x="28" y="608.7" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="636.972">Time in untamed nature can refresh people who</tspan><tspan x="28" y="669.5219999999999">spend much of life within familiar routines.</tspan></text><text x="28" y="717.8820000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="746.154">Nature can restore our energy; Wild places can offer</tspan><tspan x="28" y="778.704">renewal</tspan></text><text x="28" y="827.0640000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="855.336">After a day indoors, we spend a quiet hour beside the</tspan><tspan x="28" y="887.886">trees.</tspan></text><text x="28" y="936.2460000000001" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="964.518">This is an excerpt. Tonic means something that</tspan><tspan x="28" y="997.068">refreshes or restores, not a literal drink. The passage</tspan><tspan x="28" y="1029.618">contrasts familiar village life with the surrounding wild</tspan><tspan x="28" y="1062.1680000000001">landscape.</tspan></text><text x="28" y="1110.5280000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1138.8000000000002">Heart: How do you feel after a walk outside?</tspan><tspan x="28" y="1171.3500000000001">Puck: A little more relaxed.</tspan><tspan x="28" y="1203.9">Heart: Is tonic a drink here?</tspan><tspan x="28" y="1236.4500000000003">Puck: No. It is a way to describe feeling refreshed.</tspan></text><text x="28" y="1284.8100000000002" font-family="Arial, sans-serif" font-size="14.88" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.040000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1313.082">Is the quotation describing literal medicine? (Model:</tspan><tspan x="28" y="1345.632">No. Tonic is used as an image for something</tspan><tspan x="28" y="1378.182">refreshing.)</tspan></text></svg>