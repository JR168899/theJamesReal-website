<svg xmlns="http://www.w3.org/2000/svg" width="1434" height="660" viewBox="0 0 1434 660"><title>Growing something small</title><rect width="1434" height="660" fill="#f7f4eb"/><rect x="14" y="14" width="1406" height="632" rx="10" fill="#f1eadc" stroke="#81735e" stroke-width="5"/><rect x="24" y="24" width="1386" height="612" rx="3" fill="none" stroke="#f7f1e5" stroke-width="10"/><text font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#37322b"><tspan x="42" y="42">Everyday English - A2 - 2026/03/12 - 01 - Essay</tspan></text><g aria-label="Essay portrait photograph"><rect x="1066" y="96" width="328" height="488" fill="#faf8f1" stroke="#81735e" stroke-width="2"/><image x="1070" y="100" width="320" height="480" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/></g><text font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#37322b"><tspan x="1070" y="601">Hands cultivate a garden with care.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-a-person-gardening-7729129/"><text font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#37322b"><tspan x="1070" y="640">Pexels · 7729129</tspan></text></a><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#37322b"><tspan x="42" y="90">Growing something small</tspan></text><text x="42" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">1 · INTRODUCTION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="161.0">When we care for a plant, a little care can make the experience better. Planning and thinking</tspan><tspan x="42" y="189.07999999999998">about other people both help.</tspan></text><text x="42" y="221.16" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">2 · DEVELOP THE IDEA</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="250.16">First, observing a plant helps us respond to what it needs. For example, we check whether the</tspan><tspan x="42" y="278.24">soil feels dry before adding water. This is a small thing that makes the day easier.</tspan></text><text x="42" y="310.32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">3 · EXAMPLE &amp; REFLECTION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="339.32">Second, keeping a simple record helps us learn from changes. For example, we note which</tspan><tspan x="42" y="367.4">window gives the plant enough light without scorching its leaves. We do not need a perfect day</tspan><tspan x="42" y="395.48">to do this well.</tspan></text><text x="42" y="427.56" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#8c8981">4 · CONCLUSION</text><text font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#37322b"><tspan x="42" y="456.56">We can care for a plant more easily when we prepare and notice other people. These simple</tspan><tspan x="42" y="484.64">steps give us a useful place to start.</tspan></text><text font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#37322b"><tspan x="42" y="534.72">BUILD YOUR OWN · State a focused main idea. Develop one supporting reason in each body paragraph, with a concrete</tspan><tspan x="42" y="556.6800000000001">example. Conclude by connecting the two reasons without introducing a new argument. Use the structure as a model; write</tspan><tspan x="42" y="578.64">about an experience of your own.</tspan><tspan x="42" y="600.6">What two reasons support the main idea? Explain one example.</tspan></text></svg>