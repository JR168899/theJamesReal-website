<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>If music be the food of love, play on;</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/08/01 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Musicians work together on a piece of music.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Musicians work together on a piece of music.</tspan></text><a href="https://www.pexels.com/photo/couple-playing-music-in-living-room-3978313/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 3978313</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#2c3540"><tspan x="28" y="472.02">If music be the food of love,</tspan><tspan x="28" y="522.045">play on;</tspan></text><text font-family="Arial, sans-serif" font-size="17.400000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="549.4499999999999">William Shakespeare · Twelfth Night, Act I, Scene 1 (First Folio) · Published</tspan><tspan x="28" y="570.6779999999999">1623</tspan></text><text x="28" y="618.18" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="644.628">The speaker imagines music as something that feeds or</tspan><tspan x="28" y="675.0780000000001">sustains a feeling of love.</tspan></text><text x="28" y="720.318" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="746.7660000000001">Music can nourish emotion; Sound is compared to</tspan><tspan x="28" y="777.2160000000001">emotional nourishment</tspan></text><text x="28" y="822.456" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="848.9040000000001">The melody changes the mood in the room, and we listen</tspan><tspan x="28" y="879.3540000000002">to the next phrase.</tspan></text><text x="28" y="924.594" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="951.0420000000001">Orsino speaks this line. Be is an older subjunctive form</tspan><tspan x="28" y="981.4920000000002">here. Food of love is a metaphor, and the speech goes</tspan><tspan x="28" y="1011.9420000000001">on to complicate the speaker’s desire.</tspan></text><text x="28" y="1057.1820000000002" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1083.63">Sky: Why does the speaker compare music to food?</tspan><tspan x="28" y="1114.0800000000002">Michael: He imagines it feeding an emotional appetite.</tspan><tspan x="28" y="1144.5300000000002">Sky: Is that the same as saying music is literally edible?</tspan><tspan x="28" y="1174.98">Michael: No. The metaphor connects listening with desire</tspan><tspan x="28" y="1205.43">and nourishment.</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#2c3540"><tspan x="28" y="1284.368">Explain the food metaphor without treating it as a literal</tspan><tspan x="28" y="1314.818">definition of music. (Model: The speaker imagines music</tspan><tspan x="28" y="1345.268">nourishing or satisfying an emotional appetite.)</tspan></text></svg>