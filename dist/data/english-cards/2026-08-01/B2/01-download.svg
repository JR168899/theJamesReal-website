<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>subtle</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/08/01 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A listener spends time with music.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A listener spends time with music.</tspan></text><a href="https://www.pexels.com/photo/photography-of-woman-listening-to-music-1181367/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1181367</text></a></svg><text font-family="Arial, sans-serif" font-size="43.7" font-weight="700" fill="#382d2e"><tspan x="28" y="475.7">subtle</tspan></text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="513.225">US /ˈsʌtəl/ adjective</tspan></text><text font-family="Arial, sans-serif" font-size="20.900000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="539.977">subtle · subtler · subtlest; noun: subtlety</tspan></text><text x="28" y="593.0250000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="621.9050000000001">not obvious and often requiring careful attention</tspan></text><text x="28" y="671.3050000000001" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="700.1850000000001">delicate; not immediately obvious</tspan></text><text x="28" y="749.585" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="778.465">There is a subtle difference between the two</tspan><tspan x="28" y="811.715">melodies.</tspan></text><text x="28" y="861.115" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="889.995">The adjective describes a person, thing or</tspan><tspan x="28" y="923.245">situation. Choose a concrete noun or context that</tspan><tspan x="28" y="956.495">supports the description rather than using it as a</tspan><tspan x="28" y="989.745">general compliment.</tspan></text><text x="28" y="1039.145" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1068.0249999999999">Aoede: The second recording sounds almost</tspan><tspan x="28" y="1101.2749999999999">identical.</tspan><tspan x="28" y="1134.5249999999999">Echo: There is a subtle change in the singer&#x27;s</tspan><tspan x="28" y="1167.7749999999999">timing.</tspan><tspan x="28" y="1201.0249999999999">Aoede: I missed it at first.</tspan><tspan x="28" y="1234.2749999999999">Echo: Listen to the pause before the last line.</tspan></text><text x="28" y="1283.675" font-family="Arial, sans-serif" font-size="15.200000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.6" font-weight="400" fill="#382d2e"><tspan x="28" y="1312.5549999999998">Is a subtle difference always immediately</tspan><tspan x="28" y="1345.8049999999998">obvious? Explain. (Model: No. It may be slight</tspan><tspan x="28" y="1379.0549999999998">and require careful attention to notice.)</tspan></text></svg>