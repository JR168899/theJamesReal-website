<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>weigh up</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - B2 - 2026/08/01 - Phrasal verb - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Money and a calculator support a spending calculation.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Money and a calculator support a spending calculation.</tspan></text><a href="https://www.pexels.com/photo/white-notebook-on-the-table-5466798/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 5466798</text></a></svg><text font-family="Arial, sans-serif" font-size="47.150000000000006" font-weight="700" fill="#3d3028"><tspan x="28" y="479.15">weigh something up</tspan><tspan x="28" y="538.0875">weigh up something</tspan></text><text x="28" y="602.15" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="633.3100000000001">consider advantages and disadvantages</tspan></text><text x="28" y="686.61" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="717.7700000000001">assess; evaluate</tspan></text><text x="28" y="771.07" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="802.2300000000001">We weigh up the choices before deciding.</tspan></text><text x="28" y="855.5300000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="886.6900000000002">Weigh up the options / weigh the options up;</tspan><tspan x="28" y="922.5650000000002">weigh them up. Common in British English;</tspan><tspan x="28" y="958.4400000000002">weigh the options is also natural.</tspan></text><text x="28" y="1011.7400000000001" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1042.9">Aoede: Would you choose the cheaper venue?</tspan><tspan x="28" y="1078.775">Echo: I need to weigh up the savings against</tspan><tspan x="28" y="1114.65">the longer journey.</tspan><tspan x="28" y="1150.525">Aoede: The other one is easier to reach.</tspan><tspan x="28" y="1186.4">Echo: And that could affect who is able to</tspan><tspan x="28" y="1222.275">attend.</tspan></text><text x="28" y="1275.5750000000003" font-family="Arial, sans-serif" font-size="16.400000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.700000000000003" font-weight="400" fill="#3d3028"><tspan x="28" y="1306.7350000000001">Compare two venues: one is cheaper; one is</tspan><tspan x="28" y="1342.6100000000001">easier to reach. Give a balanced</tspan><tspan x="28" y="1378.4850000000001">recommendation using weigh up.</tspan></text></svg>