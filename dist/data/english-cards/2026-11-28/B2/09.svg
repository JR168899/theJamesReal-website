<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Although and despite</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e7dfec" stroke="#7b628c" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382f40"><tspan x="28" y="55">Everyday English - Grammar</tspan></text><text x="632" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#382f40">2026-11-28 · B2 · PT</text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Although and despite</title><desc>Original family-manga illustration: umbrella, related to Although and despite.</desc><defs><pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#a5b8c6" opacity=".22"/></pattern></defs><rect width="660" height="338" fill="#fffdf6"/><rect x="12" y="12" width="636" height="314" rx="3" fill="#f2f9fc" stroke="#b9cbd1"/><path d="M13 278Q170 251 330 278T647 275V325H13Z" fill="#e5efda"/><rect x="13" y="13" width="634" height="312" fill="url(#dots)"/><ellipse cx="151" cy="315" rx="83" ry="8" fill="#cad7cd"/><g stroke="#252b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M107 226L93 261M173 226L188 251L222 237" fill="none"/><path d="M112 267V308L91 310M162 267V308L183 310" fill="none"/><path d="M103 219Q140 195 177 219L169 272H111Z" fill="#54b8ec"/><path d="M126 216L140 232L154 216" fill="white"/><ellipse cx="140" cy="165" rx="48" ry="51" fill="#ffdab4"/><path d="M94 156Q83 103 133 108Q183 102 190 150L172 140L165 147L146 131L130 143L117 136L110 151Z" fill="#33343c"/><ellipse cx="126" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="153" cy="162" rx="12" ry="16" fill="white" stroke-width="2.5"/><ellipse cx="130" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><ellipse cx="149" cy="165" rx="4" ry="7" fill="#252b35" stroke="none"/><path d="M139 169L135 178L144 178M122 188Q141 209 162 187Z" fill="white"/><path d="M115 149L128 147M152 147L164 151" fill="none"/><ellipse cx="107" cy="182" rx="8" ry="4" fill="#f7a58f" stroke="none"/><ellipse cx="174" cy="181" rx="8" ry="4" fill="#f7a58f" stroke="none"/></g><g transform="translate(445 176) scale(1.15)" stroke="#252b35" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-72-4Q0-108 72-4Q48-26 24-4Q0-26-24-4Q-48-26-72-4Z" fill="#f78da0"/><path d="M0-62V49Q0 78-23 63M-72-4Q-32-72 0-62Q32-72 72-4M-52 19L-59 33M45 22L39 37"/></g><path d="M226 134L238 121M239 151L258 148M531 92L540 81" stroke="#5ba9c9" stroke-width="3" stroke-linecap="round"/></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#382f40"><tspan x="28" y="478.0">Although and despite</tspan></text><text x="28" y="540.5" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="570.9">Use although before a clause. Use despite</tspan><tspan x="28" y="605.9">before a noun or an -ing form.</tspan></text><text x="28" y="657.9" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="688.3">Although it was difficult, we continued. Despite</tspan><tspan x="28" y="723.3">the difficulty, we continued.</tspan></text><text x="28" y="775.3" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="805.6999999999999">Read the example together with the rule. Notice</tspan><tspan x="28" y="840.6999999999999">the verb form and keep the same pattern in</tspan><tspan x="28" y="875.6999999999999">your own sentence.</tspan></text><text x="28" y="927.6999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="958.0999999999999">A: Could you give me an example?</tspan><tspan x="28" y="993.0999999999999">B: Although it was difficult, we continued.</tspan><tspan x="28" y="1028.1">Despite the difficulty, we continued.</tspan><tspan x="28" y="1063.1">A: Which pattern does that use?</tspan><tspan x="28" y="1098.1">B: Use although before a clause. Use despite</tspan><tspan x="28" y="1133.1">before a noun or an -ing form.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#382f40"><tspan x="28" y="1290.4">Explain your reasoning to a partner. Choose:</tspan><tspan x="28" y="1325.4">Despite / Although the difficulty, we continued.</tspan></text></svg>