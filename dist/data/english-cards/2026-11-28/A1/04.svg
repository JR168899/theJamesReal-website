8" y="910.5999999999999">dictionary before changing its object or word</tspan><tspan x="28" y="945.5999999999999">order.</tspan></text><text x="28" y="997.5999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#3d3028"><tspan x="28" y="1028.0">A: How can we change our plans?</tspan><tspan x="28" y="1063.0">B: Please pick up the bag.</tspan><tspan x="28" y="1098.0">A: That gives us a starting point.</tspan><tspan x="28" y="1133.0">B: Let us try it together.</tspan></text><text x="28" y="1260.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#3d3028"><tspan x="28" y="1290.4">Tell a friend. Explain “pick up” in your own</tspan><tspan x="28" y="1325.4">words, then use it in a sentence about plans for</tspan><tspan x="28" y="1360.4">a rainy day.</tspan></text></svg>