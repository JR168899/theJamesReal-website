<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>egg</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - A1 - 2026/03/31 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Eggs are arranged together for a seasonal activity.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Eggs are arranged together for a seasonal activity.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-eggs-in-a-basket-15428991/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 15428991</text></a></svg><text font-family="Arial, sans-serif" font-size="48.300000000000004" font-weight="700" fill="#382d2e"><tspan x="28" y="480.3">egg</tspan></text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="521.775">US /ɛɡ/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="23.1" font-weight="400" fill="#382d2e"><tspan x="28" y="551.3430000000001">Singular: egg; plural: eggs.</tspan></text><text x="28" y="609.975" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="641.8950000000001">an oval object laid by a bird, with a shell</tspan><tspan x="28" y="678.6450000000001">around its contents</tspan></text><text x="28" y="733.245" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="765.1650000000001">hen&#x27;s egg; oval shell</tspan></text><text x="28" y="819.765" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="851.6850000000001">We paint an egg with small blue dots.</tspan></text><text x="28" y="906.285" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="938.205">Keep the sense and countability shown in the</tspan><tspan x="28" y="974.955">example. Use a singular or plural form</tspan><tspan x="28" y="1011.705">appropriate to the specific person, object or</tspan><tspan x="28" y="1048.455">event being discussed.</tspan></text><text x="28" y="1103.055" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1134.9750000000001">Heart: How many eggs do we need?</tspan><tspan x="28" y="1171.7250000000001">Puck: Four.</tspan><tspan x="28" y="1208.4750000000001">Heart: Are these for the cake?</tspan><tspan x="28" y="1245.2250000000001">Puck: Yes. The others are for breakfast.</tspan></text><text x="28" y="1299.825" font-family="Arial, sans-serif" font-size="16.8" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="29.400000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1331.7450000000001">You need four eggs and have two. How many</tspan><tspan x="28" y="1368.4950000000001">more are needed? (Model: Two more eggs.)</tspan></text></svg>