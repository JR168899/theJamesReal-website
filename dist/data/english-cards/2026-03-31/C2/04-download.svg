<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/03/31 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3d3028"><tspan x="28" y="468.0">dispense with</tspan></text><text x="28" y="512.4449999999999" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="533.573">manage without something unnecessary</tspan></text><text x="28" y="569.713" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="590.841">do without; forgo</tspan></text><text x="28" y="626.981" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="648.109">We can dispense with a rule that serves no useful purpose.</tspan></text><text x="28" y="684.249" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="705.3770000000001">Keep the particle with the verb. Check a dictionary before changing its</tspan><tspan x="28" y="729.7020000000001">object or word order.</tspan></text><text x="28" y="765.842" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="786.97">A: How can we prepare an Easter gathering?</tspan><tspan x="28" y="811.2950000000001">B: We can dispense with a rule that serves no useful purpose.</tspan><tspan x="28" y="835.62">A: That gives us a starting point.</tspan><tspan x="28" y="859.945">B: Let us try it together.</tspan></text><text x="28" y="1255.12" font-family="Arial, sans-serif" font-size="11.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="19.46" font-weight="400" fill="#3d3028"><tspan x="28" y="1276.248">For Easter, explain the meaning before looking at the model answer.</tspan><tspan x="28" y="1300.573">Explain “dispense with” in your own words, then use it in a sentence</tspan><tspan x="28" y="1324.8980000000001">about an easter gathering with room for everyone. (Model: It means to</tspan><tspan x="28" y="1349.223">manage without something unnecessary. Example: We can dispense</tspan><tspan x="28" y="1373.548">with a rule that serves no useful purpose.)</tspan></text></svg>