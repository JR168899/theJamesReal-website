<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>observance</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/03/31 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Red envelopes appear in a festive New Year display.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Red envelopes appear in a festive New Year display.</tspan></text><a href="https://www.pexels.com/photo/vibrant-lunar-new-year-decorations-with-red-envelopes-35045708/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 35045708</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">observance</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /əbˈzɝvəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: observance; plural: observances.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">the practice of following a custom or marking a</tspan><tspan x="28" y="644.5845">special occasion</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">commemoration; customary practice</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">The reading distinguishes religious observance from</tspan><tspan x="28" y="825.4035">a public celebration.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Keep the sense and countability shown in the</tspan><tspan x="28" y="931.6505">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="963.3255">the specific person, object or event being discussed.</tspan></text><text x="28" y="1010.3855" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8975">A: Is attendance at the observance required?</tspan><tspan x="28" y="1069.5725">B: No. Visitors are welcome, but participation is</tspan><tspan x="28" y="1101.2475">optional.</tspan><tspan x="28" y="1132.9225000000001">A: Should we explain the different parts?</tspan><tspan x="28" y="1164.5975">B: Yes, without assuming everyone shares the belief.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">A guest does not share a religious belief. How can an</tspan><tspan x="28" y="1317.667">invitation to an observance respect that? (Model:</tspan><tspan x="28" y="1349.3419999999999">Explain what will happen and make clear that</tspan><tspan x="28" y="1381.017">participation is optional.)</tspan></text></svg>