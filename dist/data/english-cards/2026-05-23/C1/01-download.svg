<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>interdependence</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C1 - 2026/05/23 - Vocabulary - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="41.17" font-weight="700" fill="#382d2e"><tspan x="28" y="473.17">interdependence</tspan></text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="508.5225">US /ˌɪntɚdɪˈpɛndəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.69" font-weight="400" fill="#382d2e"><tspan x="28" y="533.7257000000001">Usually uncountable: interdependence; no regular plural in this</tspan><tspan x="28" y="557.7475000000001">sense.</tspan></text><text x="28" y="607.7243000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="634.9322999999999">a situation in which people or things rely on each</tspan><tspan x="28" y="666.2573">other</tspan></text><text x="28" y="712.7973000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="740.0053">mutual dependence; mutual reliance</tspan></text><text x="28" y="786.5453000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="813.7533000000001">The garden illustrates the interdependence of plants</tspan><tspan x="28" y="845.0783000000001">and insects.</tspan></text><text x="28" y="891.6183000000001" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="918.8263">Keep the sense and countability shown in the</tspan><tspan x="28" y="950.1513">example. Use a singular or plural form appropriate to</tspan><tspan x="28" y="981.4762999999999">the specific person, object or event being discussed.</tspan></text><text x="28" y="1028.0163" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1055.2243">Kore: Could either team finish the project alone?</tspan><tspan x="28" y="1086.5493000000001">Onyx: No. Their interdependence is built into the</tspan><tspan x="28" y="1117.8743000000002">work.</tspan><tspan x="28" y="1149.1993">Kore: Then one delayed handover affects the other</tspan><tspan x="28" y="1180.5243">team?</tspan><tspan x="28" y="1211.8493">Onyx: Exactly. Their responsibilities cannot be</tspan><tspan x="28" y="1243.1743000000001">understood in isolation.</tspan></text><text x="28" y="1289.7142999999999" font-family="Arial, sans-serif" font-size="14.32" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.060000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="1316.9223">Explain interdependence using two teams that need</tspan><tspan x="28" y="1348.2473">each other&#x27;s work. (Model: Each team&#x27;s progress</tspan><tspan x="28" y="1379.5723">depends partly on what the other team provides.)</tspan></text></svg>