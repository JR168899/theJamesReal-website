<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>cooperate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B1 - 2026/05/23 - Vocabulary - 02</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Two people share the effort of moving furniture.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Two people share the effort of moving furniture.</tspan></text><a href="https://www.pexels.com/photo/close-up-shot-of-men-carrying-a-couch-7464393/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7464393</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#382d2e"><tspan x="28" y="478.69">cooperate</tspan></text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="518.7825">US /koʊˈɑpəˌreɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="22.330000000000002" font-weight="400" fill="#382d2e"><tspan x="28" y="547.3649">cooperate · cooperates · cooperated · cooperated ·</tspan><tspan x="28" y="574.6075000000001">cooperating (base · third person · past · past participle · -ing)</tspan></text><text x="28" y="631.2850999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="662.1410999999999">to work with others towards a shared result</tspan></text><text x="28" y="714.9210999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="745.7770999999999">work together; collaborate</tspan></text><text x="28" y="798.5570999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="829.4130999999999">We cooperate to finish the work before lunch.</tspan></text><text x="28" y="882.1930999999998" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="913.0490999999998">Use the verb in the sense shown in the</tspan><tspan x="28" y="948.5740999999998">exchange. Notice the subject, tense and any</tspan><tspan x="28" y="984.0990999999999">object; the word forms above show its changes.</tspan></text><text x="28" y="1036.8790999999999" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1067.7350999999999">A: The sofa will not fit if we push from both</tspan><tspan x="28" y="1103.2601">ends.</tspan><tspan x="28" y="1138.7850999999998">B: We need to cooperate and turn it together.</tspan><tspan x="28" y="1174.3101">A: Shall I lift this corner first?</tspan><tspan x="28" y="1209.8350999999998">B: Yes. I will guide the other end.</tspan></text><text x="28" y="1262.6151" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#382d2e"><tspan x="28" y="1293.4711">Why is pushing independently less useful than</tspan><tspan x="28" y="1328.9961">cooperating when moving a sofa through a</tspan><tspan x="28" y="1364.5211">doorway?</tspan></text></svg>