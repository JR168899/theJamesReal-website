<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>What makes working together easier for you?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/05/23 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A group shares outdoor work.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A group shares outdoor work.</tspan></text><a href="https://www.pexels.com/photo/volunteers-working-in-bloomington-community-garden-39778154/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 39778154</text></a></svg><text font-family="Arial, sans-serif" font-size="46.0" font-weight="700" fill="#353331"><tspan x="28" y="478.0">What makes working</tspan><tspan x="28" y="535.5">together easier for you?</tspan></text><text x="28" y="598.0" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="628.4">An opening that invites a personal preference</tspan><tspan x="28" y="663.4">or experience without assuming everyone</tspan><tspan x="28" y="698.4">shares it.</tspan></text><text x="28" y="750.4" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="780.8">What makes working together easier for you?</tspan></text><text x="28" y="832.8" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="863.1999999999999">Follow the answer with a related question.</tspan><tspan x="28" y="898.1999999999999">Accept a different preference or a declined</tspan><tspan x="28" y="933.1999999999999">invitation without asking the person to justify it.</tspan></text><text x="28" y="985.1999999999999" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1015.5999999999999">Sky: What helped the group finish on time?</tspan><tspan x="28" y="1050.6">Michael: Knowing who was responsible for each</tspan><tspan x="28" y="1085.6">task.</tspan><tspan x="28" y="1120.6">Sky: Did you have to supervise everyone?</tspan><tspan x="28" y="1155.6">Michael: No. We agreed when to check in and</tspan><tspan x="28" y="1190.6">let people get on with it.</tspan><tspan x="28" y="1225.6">Sky: Would you change anything next time?</tspan><tspan x="28" y="1260.6">Michael: Leave more time for the final cleanup.</tspan></text><text x="28" y="1312.6" font-family="Arial, sans-serif" font-size="16.0" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.0" font-weight="400" fill="#353331"><tspan x="28" y="1343.0">Your colleague mentions a smooth handover.</tspan><tspan x="28" y="1378.0">Ask what specifically made it work.</tspan></text></svg>