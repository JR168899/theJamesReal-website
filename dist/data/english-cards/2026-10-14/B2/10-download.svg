<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you choose where to go for a short trip?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B2 - 2026/10/14 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A train journey passes through a green landscape.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A train journey passes through a green landscape.</tspan></text><a href="https://www.pexels.com/photo/a-blue-train-on-railroad-near-green-trees-11218784/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 11218784</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">How do you choose where to</tspan><tspan x="28" y="525.6675">go for a short trip?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">How do you choose where to go for a short trip?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="822.236">different preference or a declined invitation without</tspan><tspan x="28" y="853.9110000000001">asking the person to justify it.</tspan></text><text x="28" y="900.971" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="928.4830000000001">A: Do you plan every stop before a trip?</tspan><tspan x="28" y="960.158">B: Only the travel. I like leaving part of the day open.</tspan><tspan x="28" y="991.8330000000001">A: What happens if the weather changes?</tspan><tspan x="28" y="1023.508">B: I keep one indoor option in mind.</tspan><tspan x="28" y="1055.183">A: Have you ever found somewhere better by</tspan><tspan x="28" y="1086.8580000000002">changing the plan?</tspan><tspan x="28" y="1118.5330000000001">B: A little gallery became the best part of our last trip.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">A friend likes leaving an afternoon unplanned. Ask a</tspan><tspan x="28" y="1317.667">follow-up that invites an experience rather than a</tspan><tspan x="28" y="1349.3419999999999">yes/no answer. (Model: What is the best place you</tspan><tspan x="28" y="1381.017">have discovered by changing your plan?)</tspan></text></svg>