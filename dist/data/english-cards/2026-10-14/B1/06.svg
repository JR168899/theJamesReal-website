<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>get the ball rolling</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - B1 - 2026/10/14 - 02 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A planning session can set a shared project in motion.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A planning session can set a shared project in motion.</tspan></text><a href="https://www.pexels.com/photo/people-working-in-the-office-7654188/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7654188</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#383426"><tspan x="28" y="475.47">get the ball rolling</tspan></text><text x="28" y="534.5325" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="563.2605000000001">start an activity</tspan></text><text x="28" y="612.4005000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="641.1285000000001">make a start; set things in motion</tspan></text><text x="28" y="690.2685" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="718.9965000000001">One question can get the ball rolling.</tspan></text><text x="28" y="768.1365" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="796.8645">Learn the whole expression. It is figurative language,</tspan><tspan x="28" y="829.9395000000001">so a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="879.0794999999999" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="907.8075">A: How would you express this idea?</tspan><tspan x="28" y="940.8825">B: get the ball rolling</tspan><tspan x="28" y="973.9575">A: What does that mean here?</tspan><tspan x="28" y="1007.0325">B: start an activity</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#383426"><tspan x="28" y="1287.848">Explain the meaning before looking at the model</tspan><tspan x="28" y="1320.923">answer. What does “get the ball rolling” mean in this</tspan><tspan x="28" y="1353.998">example? One question can get the ball rolling.</tspan></text></svg>