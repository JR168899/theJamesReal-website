<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>sit down</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - A1 - 2026/04/03 - 01 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person takes a seat.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person takes a seat.</tspan></text><a href="https://www.pexels.com/photo/an-elderly-man-sitting-on-a-lounge-chair-7544847/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7544847</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#3d3028"><tspan x="28" y="473.63">sit down</tspan></text><text x="28" y="530.1925" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="557.7045">take a seat</tspan></text><text x="28" y="604.7645" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="632.2765">be seated; take a chair</tspan></text><text x="28" y="679.3365" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="706.8485000000001">Please sit down here.</tspan></text><text x="28" y="753.9085" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="781.4205000000001">Keep the particle with the verb. Check a dictionary</tspan><tspan x="28" y="813.0955">before changing its object or word order.</tspan></text><text x="28" y="860.1555" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="887.6675">A: How can we prepare an Easter gathering?</tspan><tspan x="28" y="919.3425">B: Please sit down here.</tspan><tspan x="28" y="951.0175">A: That gives us a starting point.</tspan><tspan x="28" y="982.6925">B: Let us try it together.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#3d3028"><tspan x="28" y="1285.992">For Easter, tell a friend. Explain “sit down” in your</tspan><tspan x="28" y="1317.667">own words, then use it in a sentence about an easter</tspan><tspan x="28" y="1349.3419999999999">gathering with room for everyone. (Model: It means to</tspan><tspan x="28" y="1381.017">take a seat. Example: Please sit down here.)</tspan></text></svg>