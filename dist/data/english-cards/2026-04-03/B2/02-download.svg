<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>observance</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/04/03 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Eggs are arranged in a woven basket.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Eggs are arranged in a woven basket.</tspan></text><a href="https://www.pexels.com/photo/close-up-of-eggs-in-a-basket-15428991/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 15428991</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#382d2e"><tspan x="28" y="473.63">observance</tspan></text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="509.3775">US /əbˈzɝvəns/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="19.91" font-weight="400" fill="#382d2e"><tspan x="28" y="534.8623">Singular: observance; plural: observances.</tspan></text><text x="28" y="585.3975" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="612.9095000000001">the practice of following a custom or marking a</tspan><tspan x="28" y="644.5845">special occasion</tspan></text><text x="28" y="691.6445" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="719.1565">commemoration; customary practice</tspan></text><text x="28" y="766.2165" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="793.7285">The reading distinguishes religious observance from</tspan><tspan x="28" y="825.4035">a public celebration.</tspan></text><text x="28" y="872.4635" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="899.9755">Topic: An Easter gathering with room for everyone.</tspan><tspan x="28" y="931.6505">Write one sentence using this word. Check that your</tspan><tspan x="28" y="963.3255">sentence keeps the meaning shown above.</tspan></text><text x="28" y="1010.3855" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1037.8975">A: What does “observance” mean?</tspan><tspan x="28" y="1069.5725">B: It means the practice of following a custom or</tspan><tspan x="28" y="1101.2475">marking a special occasion.</tspan><tspan x="28" y="1132.9225000000001">A: Can we use it at an Easter gathering?</tspan><tspan x="28" y="1164.5975">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#382d2e"><tspan x="28" y="1285.992">Explain your reasoning to a partner. Which word</tspan><tspan x="28" y="1317.667">means “the practice of following a custom or marking</tspan><tspan x="28" y="1349.3419999999999">a special occasion”: observance or renewal? (Model:</tspan><tspan x="28" y="1381.017">observance)</tspan></text></svg>