<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Are you doing anything for Easter this year?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - C2 - 2026/04/03 - Small talk - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Children search outdoors with baskets.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Children search outdoors with baskets.</tspan></text><a href="https://www.pexels.com/photo/content-diverse-girls-looking-for-easter-eggs-in-garden-7169576/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7169576</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">Are you doing anything for</tspan><tspan x="28" y="525.6675">Easter this year?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An opening that invites a personal preference or</tspan><tspan x="28" y="641.417">experience without assuming everyone shares it.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">Are you doing anything for Easter this year?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Follow the answer with a related question. Accept a</tspan><tspan x="28" y="822.236">different preference or a declined invitation without</tspan><tspan x="28" y="853.9110000000001">asking the person to justify it.</tspan></text><text x="28" y="900.971" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="928.4830000000001">Sarah: Are you organizing the egg hunt?</tspan><tspan x="28" y="960.158">Liam: Yes, but there will be another activity for</tspan><tspan x="28" y="991.8330000000001">anyone who prefers it.</tspan><tspan x="28" y="1023.508">Sarah: What will that be?</tspan><tspan x="28" y="1055.183">Liam: Decorating cards at the table.</tspan><tspan x="28" y="1086.8580000000002">Sarah: Can I help explain the boundary for the hunt?</tspan><tspan x="28" y="1118.5330000000001">Liam: That would be useful. We want the instructions</tspan><tspan x="28" y="1150.208">to be clear.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">A guest prefers not to join the egg hunt. Offer another</tspan><tspan x="28" y="1317.667">activity without asking them to justify the choice.</tspan><tspan x="28" y="1349.3419999999999">(Model: You are welcome to decorate a card at the</tspan><tspan x="28" y="1381.017">table instead.)</tspan></text></svg>