<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually read a short book?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - B1 - 2026/07/10 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Readers spend time with books.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Readers spend time with books.</tspan></text><a href="https://www.pexels.com/photo/people-reading-book-8468754/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 8468754</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#353331"><tspan x="28" y="473.63">How do you usually read a</tspan><tspan x="28" y="525.6675">short book?</tspan></text><text x="28" y="582.23" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="609.7420000000001">An open question that invites a person to describe a</tspan><tspan x="28" y="641.417">familiar experience.</tspan></text><text x="28" y="688.477" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="715.989">How do you usually read a short book?</tspan></text><text x="28" y="763.049" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="790.561">Ask this as a genuine question. Listen to the answer,</tspan><tspan x="28" y="822.236">then ask a related follow-up.</tspan></text><text x="28" y="869.2959999999999" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="896.808">A: How do you usually read a short book?</tspan><tspan x="28" y="928.483">B: I start with a simple plan, but I can change it.</tspan><tspan x="28" y="960.158">A: What has helped you most?</tspan><tspan x="28" y="991.833">B: For example, we read five pages after lunch rather</tspan><tspan x="28" y="1023.508">than wait for a free afternoon.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#353331"><tspan x="28" y="1285.992">Explain the meaning before looking at the model</tspan><tspan x="28" y="1317.667">answer. Write a reply of your own, then ask one</tspan><tspan x="28" y="1349.3419999999999">related question. (Model: I start with a simple plan,</tspan><tspan x="28" y="1381.017">but I can change it. What works best for you?)</tspan></text></svg>