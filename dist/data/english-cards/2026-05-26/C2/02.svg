<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>asymmetry</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - C2 - 2026/05/26 - 02 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Different needs and perspectives must be considered when people plan together.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Different needs and perspectives must be considered when people plan together.</tspan></text><a href="https://www.pexels.com/photo/man-and-woman-doing-a-writing-a-plan-on-the-board-7984479/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7984479</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#382d2e"><tspan x="28" y="475.47">asymmetry</tspan></text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="512.7975">US /eɪˈsɪmətri/ noun</tspan></text><text font-family="Arial, sans-serif" font-size="20.790000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="539.4087">Singular: asymmetry; plural: asymmetries.</tspan></text><text x="28" y="592.1775" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="620.9055000000001">an imbalance or difference between corresponding</tspan><tspan x="28" y="653.9805000000001">parts</tspan></text><text x="28" y="703.1205" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="731.8485000000001">imbalance; lack of symmetry</tspan></text><text x="28" y="780.9885" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="809.7165000000001">The discussion revealed an asymmetry between who</tspan><tspan x="28" y="842.7915000000002">planned the event and who did the work.</tspan></text><text x="28" y="891.9315" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="920.6595000000001">Topic: Working together. Write one sentence using</tspan><tspan x="28" y="953.7345000000001">this word. Check that your sentence keeps the</tspan><tspan x="28" y="986.8095000000001">meaning shown above.</tspan></text><text x="28" y="1035.9495" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1064.6775">A: What does “asymmetry” mean?</tspan><tspan x="28" y="1097.7525">B: It means an imbalance or difference between</tspan><tspan x="28" y="1130.8275">corresponding parts.</tspan><tspan x="28" y="1163.9025">A: Can we use it during a shared project?</tspan><tspan x="28" y="1196.9775">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#382d2e"><tspan x="28" y="1287.848">Apply the idea to a real situation, then answer: Which</tspan><tspan x="28" y="1320.923">word means “an imbalance or difference between</tspan><tspan x="28" y="1353.998">corresponding parts”: asymmetry or subsidiarity?</tspan></text></svg>