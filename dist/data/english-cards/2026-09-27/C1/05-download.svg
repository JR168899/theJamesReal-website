<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>the devil is in the details</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efe6bd" stroke="#806c27" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#383426"><tspan x="28" y="55">Everyday English - C1 - 2026/09/27 - 01 - Idioms &amp; slang</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Small details in a document can have important consequences.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Small details in a document can have important consequences.</tspan></text><a href="https://www.pexels.com/photo/person-holding-silver-pen-signing-photographers-signature-175045/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 175045</text></a></svg><text font-family="Arial, sans-serif" font-size="40.02" font-weight="700" fill="#383426"><tspan x="28" y="472.02">the devil is in the details</tspan></text><text x="28" y="526.395" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="552.8430000000001">small details can cause important difficulties</tspan></text><text x="28" y="598.083" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="624.5310000000001">small points can cause big problems; careful execution</tspan><tspan x="28" y="654.9810000000001">matters</tspan></text><text x="28" y="700.221" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="726.6690000000001">The broad idea is sound, but the devil is in the details.</tspan></text><text x="28" y="771.909" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="798.3570000000001">Learn the whole expression. It is figurative language, so</tspan><tspan x="28" y="828.8070000000001">a word-for-word interpretation may be misleading.</tspan></text><text x="28" y="874.047" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="900.4950000000001">A: How would you express this idea?</tspan><tspan x="28" y="930.9450000000002">B: the devil is in the details</tspan><tspan x="28" y="961.3950000000001">A: What does that mean here?</tspan><tspan x="28" y="991.8450000000001">B: small details can cause important difficulties</tspan></text><text x="28" y="1257.92" font-family="Arial, sans-serif" font-size="13.920000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="24.360000000000003" font-weight="400" fill="#383426"><tspan x="28" y="1284.368">Compare your first answer with this question: What does</tspan><tspan x="28" y="1314.818">“the devil is in the details” mean in this example? The</tspan><tspan x="28" y="1345.268">broad idea is sound, but the devil is in the details.</tspan><tspan x="28" y="1375.7179999999998">(Model: Small details can cause important difficulties.)</tspan></text></svg>