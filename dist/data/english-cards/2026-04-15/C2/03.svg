<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>bear out</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/04/15 - Phrasal verb - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A person examines a written document.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A person examines a written document.</tspan></text><a href="https://www.pexels.com/photo/man-signing-a-contract-6814539/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 6814539</text></a></svg><text font-family="Arial, sans-serif" font-size="43.93000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="475.93">bear something out</tspan><tspan x="28" y="530.8425">bear out something</tspan></text><text x="28" y="590.53" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="619.562">support or confirm a claim</tspan></text><text x="28" y="669.222" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="698.254">corroborate; substantiate</tspan></text><text x="28" y="747.914" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="776.946">The experience did not bear out our initial</tspan><tspan x="28" y="810.371">assumption.</tspan></text><text x="28" y="860.031" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="889.063">Evidence bears out a claim; the claim is what is</tspan><tspan x="28" y="922.4879999999999">supported. Separable: bear the claim out / bear it</tspan><tspan x="28" y="955.913">out.</tspan></text><text x="28" y="1005.573" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1034.605">Sarah: Did attendance rise after the timetable</tspan><tspan x="28" y="1068.03">changed?</tspan><tspan x="28" y="1101.455">Liam: The figures do not bear out that claim.</tspan><tspan x="28" y="1134.88">Sarah: Perhaps the change helped a different</tspan><tspan x="28" y="1168.305">group?</tspan><tspan x="28" y="1201.73">Liam: Possibly, but we would need evidence</tspan><tspan x="28" y="1235.155">before saying so.</tspan></text><text x="28" y="1284.815" font-family="Arial, sans-serif" font-size="15.280000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.740000000000002" font-weight="400" fill="#3d3028"><tspan x="28" y="1313.847">A report claims attendance increased, but the</tspan><tspan x="28" y="1347.272">count stayed level. Rewrite its conclusion using</tspan><tspan x="28" y="1380.697">bear out.</tspan></text></svg>