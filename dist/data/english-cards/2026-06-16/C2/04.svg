<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>dispense with</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#f1dfcf" stroke="#96633f" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3028"><tspan x="28" y="55">Everyday English - C2 - 2026/06/16 - 02 - Phrasal verb</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple arrangement leaves out unnecessary additions.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple arrangement leaves out unnecessary additions.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#3d3028"><tspan x="28" y="473.86">dispense with</tspan></text><text x="28" y="530.7349999999999" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="558.399">manage without something unnecessary</tspan></text><text x="28" y="605.719" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="633.383">do without; forgo</tspan></text><text x="28" y="680.703" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="708.3670000000001">We can dispense with a rule that serves no useful</tspan><tspan x="28" y="740.2170000000001">purpose.</tspan></text><text x="28" y="787.537" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="815.2010000000001">Keep the particle with the verb. Check a dictionary</tspan><tspan x="28" y="847.0510000000002">before changing its object or word order.</tspan></text><text x="28" y="894.3710000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="922.0350000000002">A: How can we make a realistic plan?</tspan><tspan x="28" y="953.8850000000002">B: We can dispense with a rule that serves no useful</tspan><tspan x="28" y="985.7350000000002">purpose.</tspan><tspan x="28" y="1017.5850000000003">A: That gives us a starting point.</tspan><tspan x="28" y="1049.4350000000002">B: Let us try it together.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#3d3028"><tspan x="28" y="1286.224">Apply the idea to a real situation, then answer:</tspan><tspan x="28" y="1318.0739999999998">Explain “dispense with” in your own words, then use it</tspan><tspan x="28" y="1349.924">in a sentence about looking back and looking ahead.</tspan></text></svg>