<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>How do you usually make a realistic plan?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#e3e1df" stroke="#5f5b58" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#353331"><tspan x="28" y="55">Everyday English - A2 - 2026/06/16 - 01 - Small talk</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A calendar gives plans a place in time.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A calendar gives plans a place in time.</tspan></text><a href="https://www.pexels.com/photo/a-person-marking-a-day-in-a-calendar-17668838/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 17668838</text></a></svg><text font-family="Arial, sans-serif" font-size="49.91000000000001" font-weight="700" fill="#353331"><tspan x="28" y="481.91">How do you usually</tspan><tspan x="28" y="544.2975">make a realistic plan?</tspan></text><text x="28" y="612.1100000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="645.0940000000002">An open question that invites a person to</tspan><tspan x="28" y="683.0690000000002">describe a familiar experience.</tspan></text><text x="28" y="739.4890000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="772.4730000000002">How do you usually make a realistic plan?</tspan></text><text x="28" y="828.8930000000001" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="861.8770000000002">Ask this as a genuine question. Listen to the</tspan><tspan x="28" y="899.8520000000002">answer, then ask a related follow-up.</tspan></text><text x="28" y="956.2720000000002" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="989.2560000000002">A: How do you usually make a realistic plan?</tspan><tspan x="28" y="1027.2310000000002">B: I get ready first, and I ask a friend to help.</tspan><tspan x="28" y="1065.2060000000001">A: What has helped you most?</tspan><tspan x="28" y="1103.1810000000003">B: For example, we describe one habit that</tspan><tspan x="28" y="1141.1560000000002">helped us instead of calling the whole year</tspan><tspan x="28" y="1179.1310000000003">good or bad.</tspan></text><text x="28" y="1261.36" font-family="Arial, sans-serif" font-size="17.360000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.380000000000006" font-weight="400" fill="#353331"><tspan x="28" y="1294.344">Your example. Write a reply of your own,</tspan><tspan x="28" y="1332.319">then ask one related question.</tspan></text></svg>