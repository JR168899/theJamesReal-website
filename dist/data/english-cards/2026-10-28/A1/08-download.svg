<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I shall take the heart.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family photograph represents the love the Tin Woodman hopes to feel.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family photograph represents the love the Tin Woodman hopes to feel.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="45.080000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="477.08">I shall take the heart.</tspan></text><text font-family="Arial, sans-serif" font-size="19.6" font-weight="400" fill="#2c3540"><tspan x="28" y="507.95000000000005">The Tin Woodman (fictional character) · L. Frank Baum · The</tspan><tspan x="28" y="531.8620000000001">Wonderful Wizard of Oz, Chapter V · Published 1900</tspan></text><text x="28" y="585.3699999999999" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="615.162">The Tin Woodman is made of metal. He wants a</tspan><tspan x="28" y="649.462">heart. The Scarecrow wants a brain. They talk</tspan><tspan x="28" y="683.7620000000001">about what is important. The Woodman thinks a</tspan><tspan x="28" y="718.062">heart can help him love and be happy. The</tspan><tspan x="28" y="752.3620000000001">friends do not want the same thing.</tspan></text><text x="28" y="803.322" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="833.1140000000001">Shall here means will. The Woodman says what</tspan><tspan x="28" y="867.4140000000001">he wants. His friend wants something different.</tspan></text><text x="28" y="1259.68" font-family="Arial, sans-serif" font-size="15.680000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="27.44" font-weight="400" fill="#2c3540"><tspan x="28" y="1289.472">What does the Tin Woodman want, and what</tspan><tspan x="28" y="1323.772">does his friend want? (Model: The Tin Woodman</tspan><tspan x="28" y="1358.072">wants a heart. The Scarecrow wants a brain.)</tspan></text></svg>