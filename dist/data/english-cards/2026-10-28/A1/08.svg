<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I shall take the heart.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A1 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A family photograph represents the love the Tin Woodman hopes to feel.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A family photograph represents the love the Tin Woodman hopes to feel.</tspan></text><a href="https://www.pexels.com/photo/mother-and-father-posing-with-children-16949210/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 16949210</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2c3540"><tspan x="28" y="482.0">I shall take the heart.</tspan></text><text font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#2c3540"><tspan x="28" y="516.5">The Tin Woodman (fictional character) · L. Frank Baum · The</tspan><tspan x="28" y="543.34">Wonderful Wizard of Oz, Chapter V · Published 1900</tspan></text><text x="28" y="603.4" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="636.8399999999999">The Tin Woodman is made of metal. He</tspan><tspan x="28" y="675.3399999999999">wants a heart. The Scarecrow wants a</tspan><tspan x="28" y="713.8399999999999">brain. They talk about what is important.</tspan><tspan x="28" y="752.3399999999999">The Woodman thinks a heart can help him</tspan><tspan x="28" y="790.8399999999999">love and be happy. The friends do not want</tspan><tspan x="28" y="829.3399999999999">the same thing.</tspan></text><text x="28" y="886.54" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="919.9799999999999">Shall here means will. The Woodman says</tspan><tspan x="28" y="958.4799999999999">what he wants. His friend wants something</tspan><tspan x="28" y="996.9799999999999">different.</tspan></text><text x="28" y="1261.6" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1295.04">What does the Tin Woodman want, and</tspan><tspan x="28" y="1333.54">what does his friend want?</tspan></text></svg>