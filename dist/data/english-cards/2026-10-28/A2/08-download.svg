<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Isn&#x27;t it splendid to think of all the things there are to find out about?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold many subjects an interested reader can explore.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold many subjects an interested reader can explore.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="43.470000000000006" font-weight="700" fill="#2c3540"><tspan x="28" y="475.47">Isn&#x27;t it splendid to think of all</tspan><tspan x="28" y="529.8075">the things there are to find</tspan><tspan x="28" y="584.145">out about?</tspan></text><text font-family="Arial, sans-serif" font-size="18.900000000000002" font-weight="400" fill="#2c3540"><tspan x="28" y="613.9125">Anne Shirley (fictional character) · L. M. Montgomery · Anne of Green</tspan><tspan x="28" y="636.9705">Gables, Chapter II · Published 1908</tspan></text><text x="28" y="688.5675000000001" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="717.2955000000002">Anne is travelling with Matthew. She talks about the</tspan><tspan x="28" y="750.3705000000002">island&#x27;s flowers and its red roads. She wants to know</tspan><tspan x="28" y="783.4455000000002">why the roads are red. Matthew does not know. Anne</tspan><tspan x="28" y="816.5205000000002">is not upset about the missing answer. She is happy</tspan><tspan x="28" y="849.5955000000001">that there are so many things to learn. For her, a</tspan><tspan x="28" y="882.6705000000002">question can begin an interesting conversation.</tspan></text><text x="28" y="931.8105000000002" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="960.5385000000002">Splendid means wonderful. Find out about means</tspan><tspan x="28" y="993.6135000000003">learn about. Anne enjoys asking questions, even</tspan><tspan x="28" y="1026.6885000000002">before she knows the answers.</tspan></text><text x="28" y="1259.12" font-family="Arial, sans-serif" font-size="15.120000000000001" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="26.46" font-weight="400" fill="#2c3540"><tspan x="28" y="1287.848">When Matthew cannot answer her question, does</tspan><tspan x="28" y="1320.923">Anne lose interest? Explain. (Model: No. She is</tspan><tspan x="28" y="1353.998">excited because there are still many things to learn.)</tspan></text></svg>