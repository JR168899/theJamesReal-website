<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Isn&#x27;t it splendid to think of all the things there are to find out about?</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - A2 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Library shelves hold many subjects an interested reader can explore.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Library shelves hold many subjects an interested reader can explore.</tspan></text><a href="https://www.pexels.com/photo/vintage-library-books-on-wooden-shelves-37559006/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 37559006</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2c3540"><tspan x="28" y="482.0">Isn&#x27;t it splendid to think</tspan><tspan x="28" y="544.5">of all the things there are</tspan><tspan x="28" y="607.0">to find out about?</tspan></text><text font-family="Arial, sans-serif" font-size="22.0" font-weight="400" fill="#2c3540"><tspan x="28" y="641.5">Anne Shirley (fictional character) · L. M. Montgomery · Anne of</tspan><tspan x="28" y="668.34">Green Gables, Chapter II · Published 1908</tspan></text><text x="28" y="728.4" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="761.8399999999999">Anne is travelling with Matthew. She talks</tspan><tspan x="28" y="800.3399999999999">about the island&#x27;s flowers and its red roads.</tspan><tspan x="28" y="838.8399999999999">She wants to know why the roads are red.</tspan><tspan x="28" y="877.3399999999999">Matthew does not know. Anne is not upset</tspan><tspan x="28" y="915.8399999999999">about the missing answer. She is happy</tspan><tspan x="28" y="954.3399999999999">that there are so many things to learn. For</tspan><tspan x="28" y="992.8399999999999">her, a question can begin an interesting</tspan><tspan x="28" y="1031.34">conversation.</tspan></text><text x="28" y="1088.54" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1121.98">Splendid means wonderful. Find out about</tspan><tspan x="28" y="1160.48">means learn about. Anne enjoys asking</tspan><tspan x="28" y="1198.98">questions, even before she knows the</tspan><tspan x="28" y="1237.48">answers.</tspan></text><text x="28" y="1294.68" font-family="Arial, sans-serif" font-size="17.6" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.800000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1328.1200000000001">When Matthew cannot answer her question,</tspan><tspan x="28" y="1366.6200000000001">does Anne lose interest? Explain.</tspan></text></svg>