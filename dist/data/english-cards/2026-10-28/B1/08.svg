<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I like good strong words that mean something.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pen and notebook suggest careful choices about words.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pen and notebook suggest careful choices about words.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#2c3540"><tspan x="28" y="482.0">I like good strong words</tspan><tspan x="28" y="544.5">that mean something.</tspan></text><text font-family="Arial, sans-serif" font-size="21.900000000000006" font-weight="400" fill="#2c3540"><tspan x="28" y="578.9">Jo March (fictional character) · Louisa May Alcott · Little</tspan><tspan x="28" y="605.6179999999999">Women, Part One, Chapter IV · Published 1868</tspan></text><text x="28" y="665.4050000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="698.6930000000001">Jo and Meg are walking in the snow. Jo</tspan><tspan x="28" y="737.0180000000001">feels that they have been ungrateful and</tspan><tspan x="28" y="775.3430000000001">uses a strong expression to describe them</tspan><tspan x="28" y="813.6680000000001">both. Meg objects to her language. Jo</tspan><tspan x="28" y="851.9930000000002">replies that she likes words with force and</tspan><tspan x="28" y="890.3180000000002">meaning. The exchange shows their</tspan><tspan x="28" y="928.6430000000001">different habits of speaking. Jo values</tspan><tspan x="28" y="966.9680000000002">energy, but Meg reminds her that a word</tspan><tspan x="28" y="1005.2930000000001">can also upset the person who hears it.</tspan></text><text x="28" y="1062.2330000000002" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1095.5210000000002">Strong describes expressive force, not</tspan><tspan x="28" y="1133.8460000000002">physical strength. Jo&#x27;s preference does not</tspan><tspan x="28" y="1172.1710000000003">mean that every strong word is suitable for</tspan><tspan x="28" y="1210.496">every listener or situation.</tspan></text><text x="28" y="1267.4360000000001" font-family="Arial, sans-serif" font-size="17.520000000000003" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="30.660000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="1300.7240000000002">A friend dislikes a word you used about</tspan><tspan x="28" y="1339.0490000000002">them. How could you keep your meaning</tspan><tspan x="28" y="1377.3740000000003">but show more care?</tspan></text></svg>