<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>I like good strong words that mean something.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B1 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A pen and notebook suggest careful choices about words.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A pen and notebook suggest careful choices about words.</tspan></text><a href="https://www.pexels.com/photo/pen-and-notebook-1119792/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 1119792</text></a></svg><text font-family="Arial, sans-serif" font-size="41.63" font-weight="700" fill="#2c3540"><tspan x="28" y="473.63">I like good strong words that</tspan><tspan x="28" y="525.6675">mean something.</tspan></text><text font-family="Arial, sans-serif" font-size="18.1" font-weight="400" fill="#2c3540"><tspan x="28" y="554.1750000000001">Jo March (fictional character) · Louisa May Alcott · Little Women, Part One,</tspan><tspan x="28" y="576.2570000000001">Chapter IV · Published 1868</tspan></text><text x="28" y="625.6700000000001" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="653.1820000000001">Jo and Meg are walking in the snow. Jo feels that</tspan><tspan x="28" y="684.8570000000001">they have been ungrateful and uses a strong</tspan><tspan x="28" y="716.5320000000002">expression to describe them both. Meg objects to her</tspan><tspan x="28" y="748.2070000000001">language. Jo replies that she likes words with force</tspan><tspan x="28" y="779.8820000000002">and meaning. The exchange shows their different</tspan><tspan x="28" y="811.5570000000001">habits of speaking. Jo values energy, but Meg</tspan><tspan x="28" y="843.2320000000002">reminds her that a word can also upset the person</tspan><tspan x="28" y="874.9070000000002">who hears it.</tspan></text><text x="28" y="921.9670000000001" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="949.4790000000002">Strong describes expressive force, not physical</tspan><tspan x="28" y="981.1540000000001">strength. Jo&#x27;s preference does not mean that every</tspan><tspan x="28" y="1012.8290000000002">strong word is suitable for every listener or situation.</tspan></text><text x="28" y="1258.48" font-family="Arial, sans-serif" font-size="14.48" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.34" font-weight="400" fill="#2c3540"><tspan x="28" y="1285.992">A friend dislikes a word you used about them. How</tspan><tspan x="28" y="1317.667">could you keep your meaning but show more care?</tspan><tspan x="28" y="1349.3419999999999">(Model: I could explain my concern using a clear</tspan><tspan x="28" y="1381.017">description instead of an insulting label.)</tspan></text></svg>