<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>Our life is frittered away by detail.</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#dce5ee" stroke="#4e6e8b" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3540"><tspan x="28" y="55">Everyday English - B2 - 2026/10/28 - Quote - 01</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>A simple workspace leaves fewer competing demands on attention.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">A simple workspace leaves fewer competing demands on attention.</tspan></text><a href="https://www.pexels.com/photo/minimalist-workspace-with-laptop-and-notebook-34147402/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 34147402</text></a></svg><text font-family="Arial, sans-serif" font-size="46.690000000000005" font-weight="700" fill="#2c3540"><tspan x="28" y="478.69">Our life is frittered away by</tspan><tspan x="28" y="537.0525">detail.</tspan></text><text font-family="Arial, sans-serif" font-size="20.300000000000004" font-weight="400" fill="#2c3540"><tspan x="28" y="569.025">Henry David Thoreau (first-person narrator) · Henry David Thoreau</tspan><tspan x="28" y="593.7909999999999">· Walden, Where I Lived, and What I Lived For · Published 1854</tspan></text><text x="28" y="649.21" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">THE STORY</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2c3540"><tspan x="28" y="680.066">After explaining why he went to the woods,</tspan><tspan x="28" y="715.591">Thoreau turns to the many small demands of</tspan><tspan x="28" y="751.116">ordinary life. He urges readers to simplify their</tspan><tspan x="28" y="786.6410000000001">affairs. His complaint is about attention being</tspan><tspan x="28" y="822.166">scattered across countless concerns, rather</tspan><tspan x="28" y="857.691">than directed towards what matters. The</tspan><tspan x="28" y="893.2160000000001">sentence is deliberately forceful. It need not</tspan><tspan x="28" y="928.7410000000001">mean that every detail is worthless: some</tspan><tspan x="28" y="964.2660000000001">details protect people or make work reliable.</tspan><tspan x="28" y="999.791">The useful question is which demands deserve</tspan><tspan x="28" y="1035.316">our limited time.</tspan></text><text x="28" y="1088.0960000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">A CLOSER LOOK</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2c3540"><tspan x="28" y="1118.9520000000002">Frittered away suggests something valuable</tspan><tspan x="28" y="1154.4770000000003">being lost a little at a time. Detail is treated as</tspan><tspan x="28" y="1190.0020000000002">an overwhelming accumulation here, rather</tspan><tspan x="28" y="1225.5270000000003">than as one particular small fact.</tspan></text><text x="28" y="1278.3070000000002" font-family="Arial, sans-serif" font-size="16.240000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="28.42" font-weight="400" fill="#2c3540"><tspan x="28" y="1309.1630000000002">Name one unnecessary detail you could</tspan><tspan x="28" y="1344.6880000000003">simplify and one important detail you would</tspan><tspan x="28" y="1380.2130000000002">keep.</tspan></text></svg>