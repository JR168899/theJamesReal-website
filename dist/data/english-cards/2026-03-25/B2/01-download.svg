<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1434" viewBox="0 0 660 1434"><title>evaluate</title><rect width="660" height="1434" fill="#f7f4eb"/><rect x="7" y="7" width="646" height="1420" rx="5" fill="#efd6d5" stroke="#9b4f53" stroke-width="2.5"/><rect x="12" y="12" width="636" height="1410" rx="3" fill="none" stroke="#f7f1e5" stroke-width="5"/><text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#382d2e"><tspan x="28" y="55">Everyday English - B2 - 2026/03/25 - 01 - Vocabulary</tspan></text><svg x="28" y="80" width="604" height="310" viewBox="0 0 660 338"><title>Looking at alternatives helps people make a considered choice.</title><rect width="660" height="338" fill="#faf8f1"/><image x="0" y="0" width="660" height="292" preserveAspectRatio="xMidYMid slice" href="__JR_PHOTO__"/><text font-family="Arial, sans-serif" font-size="12" fill="#454545"><tspan x="12" y="305">Looking at alternatives helps people make a considered choice.</tspan></text><a href="https://www.pexels.com/photo/colleagues-using-a-laptop-7212946/"><text x="12" y="333" font-family="Arial, sans-serif" font-size="10" fill="#676767">Pexels · 7212946</text></a></svg><text font-family="Arial, sans-serif" font-size="41.86000000000001" font-weight="700" fill="#382d2e"><tspan x="28" y="473.86">evaluate</tspan></text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="509.805">US /ɪˈvæljuˌeɪt/ verb</tspan></text><text font-family="Arial, sans-serif" font-size="20.020000000000003" font-weight="400" fill="#382d2e"><tspan x="28" y="535.4306">evaluate · evaluates · evaluated · evaluated · evaluating (base ·</tspan><tspan x="28" y="559.855">third person · past · past participle · -ing)</tspan></text><text x="28" y="610.6694" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">MEANING</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="638.3334000000001">to judge something carefully using relevant</tspan><tspan x="28" y="670.1834000000001">information</tspan></text><text x="28" y="717.5034" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">SYNONYMS</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="745.1674000000002">assess; appraise</tspan></text><text x="28" y="792.4874000000002" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">IN CONTEXT</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="820.1514000000002">We evaluate the plan after trying it for a week.</tspan></text><text x="28" y="867.4714000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">USAGE NOTE</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="895.1354000000002">Topic: Looking back and looking ahead. Write one</tspan><tspan x="28" y="926.9854000000003">sentence using this word. Check that your sentence</tspan><tspan x="28" y="958.8354000000003">keeps the meaning shown above.</tspan></text><text x="28" y="1006.1554000000001" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">CONVERSATION</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1033.8194">A: What does “evaluate” mean?</tspan><tspan x="28" y="1065.6694">B: It means to judge something carefully using</tspan><tspan x="28" y="1097.5194000000001">relevant information.</tspan><tspan x="28" y="1129.3694">A: Can we use it at the end of the year?</tspan><tspan x="28" y="1161.2194000000002">B: Yes. Let us think of a clear example.</tspan></text><text x="28" y="1258.56" font-family="Arial, sans-serif" font-size="14.560000000000002" font-weight="700" fill="#8c8981">YOUR TURN</text><text font-family="Arial, sans-serif" font-size="25.480000000000004" font-weight="400" fill="#382d2e"><tspan x="28" y="1286.224">Review without reading the example first. Which word</tspan><tspan x="28" y="1318.0739999999998">means “to judge something carefully using relevant</tspan><tspan x="28" y="1349.924">information”: evaluate or priority? (Model: evaluate)</tspan></text></svg>